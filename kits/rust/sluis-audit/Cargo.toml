[package]
name = "sluis-audit"
description = "sluis's side of the audit emitter: its action table, key@'s Mac for pseudonyms and its names, over the crate audit-emitter of truvity/audit."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
audit-emitter.workspace = true
sluis-kit = { path = "../sluis-kit" }
sluis-proto = { path = "../sluis-proto" }

[dev-dependencies]
atoom-common.workspace = true
anyhow = "1"
base64 = "0.23"
buffa = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client"] }
rustix = { version = "1", features = ["process"] }
serde_json = "1"
sluis-kit = { path = "../sluis-kit", features = ["test-identities"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
