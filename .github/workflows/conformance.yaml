# The OpenID Foundation Config profile, on demand only.
#
# Not scheduled: a daily run of one of three profiles reads as "conformance
# passes" while the two that sign somebody in have not been run for weeks. The
# suite is run by a person, as a whole, at each major and minor release
# (docs/how-to/run-conformance.md). This profile stays one click away because it
# needs no client, no secret and nobody at a browser, and guards the surface
# most likely to break by accident: discovery and the key set. Not on a tag: a
# tag is a build, not a deployment, so a run would certify the OLD issuer against
# the NEW version. The other two profiles need a credential from the cluster,
# which CI has no business holding.
name: Conformance

on:
  workflow_dispatch:
    inputs:
      issuer:
        description: The issuer to certify, e.g. https://access.example.com.
        required: true

permissions:
  contents: read

concurrency:
  group: conformance
  cancel-in-progress: false

jobs:
  config-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ISSUER: ${{ inputs.issuer }}
      SUITE: https://localhost.emobix.co.uk:8443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The suite answers on a PUBLIC name that resolves to 127.0.0.1, which is
      # how it gets a real certificate on a runner.
      - name: Start the conformance suite
        run: |
          git clone --depth 1 https://gitlab.com/openid/conformance-suite.git /tmp/suite
          cd /tmp/suite
          docker compose -f docker-compose-prebuilt.yml up -d

      - name: Wait for it to answer
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "${SUITE}/api/runner/available" || true)
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::the suite never came up" >&2
          exit 1

      - name: Check the issuer is reachable
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "${ISSUER}/.well-known/openid-configuration")
          if [ "$code" != "200" ]; then
            echo "::error::${ISSUER} answered ${code} for its discovery document" >&2
            exit 1
          fi

      - name: Run the Config profile
        run: |
          cat > /tmp/config.json <<JSON
          {
            "alias": "access-issuer-ci",
            "description": "access-issuer — Config profile (CI)",
            "server": { "discoveryUrl": "${ISSUER}/.well-known/openid-configuration" },
            "client": { "client_id": "conformance", "client_secret": "unused-here" }
          }
          JSON

          plan=$(curl -sk -X POST \
            "${SUITE}/api/plan?planName=oidcc-config-certification-test-plan" \
            -H 'Content-Type: application/json' --data-binary @/tmp/config.json \
            | jq -r .id)
          [ -n "$plan" ] && [ "$plan" != "null" ] || {
            echo "::error::the suite would not create a plan" >&2; exit 1; }

          echo "plan: ${SUITE}/plan-detail.html?plan=${plan}"
          hack/conformance-run.sh "$plan"

      - name: Keep the log
        if: always()
        run: |
          mkdir -p /tmp/conformance
          curl -sk "${SUITE}/api/log" -o /tmp/conformance/runs.json || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: conformance-config-profile
          path: /tmp/conformance/
          if-no-files-found: warn
