# The OpenID Foundation Config profile, on demand only.
#
# WHY NOT ON A SCHEDULE ANY MORE. It ran daily, and a daily run of one
# of three profiles is a check that reports green while the two that
# actually sign somebody in have not been run for weeks. That is worse
# than no check: it reads as "conformance passes". The suite is now run
# by a person, as a whole, at each major and minor release — all three
# profiles, including the manual steps a person has to sign off — and
# docs/how-to/run-conformance.md is the procedure.
#
# WHY IT STAYS AT ALL. Config reads the discovery document and the key
# set and checks them against the specification. It needs no client, no
# secret and nobody at a browser, so it is the one profile that can run
# unattended, and it guards the surface most likely to break by
# accident: change a provider option and discovery changes with it,
# silently, for every relying party that reads it. Keeping it one click
# away is worth more than deleting it.
#
# WHY NOT ON A TAG. A tag is a build, not a deployment: at the moment
# `v1.2.3` is pushed the cluster is still running whatever it ran
# before, so a run here would certify the OLD issuer and report it
# against the NEW version.
#
# The other two profiles sign somebody in, and the signing-in needs a
# credential this workflow should not hold: `hack/conformance_drive.py`
# gets one from the cluster, and CI has no business with cluster access.
name: Conformance

on:
  workflow_dispatch:
    inputs:
      issuer:
        description: The issuer to certify, e.g. https://access.example.com.
        required: true

permissions:
  contents: read

concurrency:
  group: conformance
  cancel-in-progress: false

jobs:
  config-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ISSUER: ${{ inputs.issuer }}
      SUITE: https://localhost.emobix.co.uk:8443
    steps:
      # Pinned by COMMIT SHA, never a tag: a tag moves, and this is the
      # house rule every other workflow here follows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The suite is published as images, so there is no Java build. It
      # answers on a PUBLIC name that resolves to 127.0.0.1, which is how
      # it gets a real certificate while running on a runner.
      - name: Start the conformance suite
        run: |
          git clone --depth 1 https://gitlab.com/openid/conformance-suite.git /tmp/suite
          cd /tmp/suite
          docker compose -f docker-compose-prebuilt.yml up -d

      - name: Wait for it to answer
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "${SUITE}/api/runner/available" || true)
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::the suite never came up" >&2
          exit 1

      # The discovery document has to be reachable from the runner before
      # the suite is blamed for not reading it.
      - name: Check the issuer is reachable
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "${ISSUER}/.well-known/openid-configuration")
          if [ "$code" != "200" ]; then
            echo "::error::${ISSUER} answered ${code} for its discovery document" >&2
            exit 1
          fi

      - name: Run the Config profile
        run: |
          cat > /tmp/config.json <<JSON
          {
            "alias": "access-issuer-ci",
            "description": "access-issuer — Config profile (CI)",
            "server": { "discoveryUrl": "${ISSUER}/.well-known/openid-configuration" },
            "client": { "client_id": "conformance", "client_secret": "unused-here" }
          }
          JSON

          plan=$(curl -sk -X POST \
            "${SUITE}/api/plan?planName=oidcc-config-certification-test-plan" \
            -H 'Content-Type: application/json' --data-binary @/tmp/config.json \
            | jq -r .id)
          [ -n "$plan" ] && [ "$plan" != "null" ] || {
            echo "::error::the suite would not create a plan" >&2; exit 1; }

          echo "plan: ${SUITE}/plan-detail.html?plan=${plan}"
          hack/conformance-run.sh "$plan"

      # The suite's own record of the run, which is what an auditor wants
      # and what a failure needs: the summary above says which module,
      # this says which assertion.
      - name: Keep the log
        if: always()
        run: |
          mkdir -p /tmp/conformance
          curl -sk "${SUITE}/api/log" -o /tmp/conformance/runs.json || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: conformance-config-profile
          path: /tmp/conformance/
          if-no-files-found: warn
