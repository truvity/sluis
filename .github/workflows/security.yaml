# govulncheck for every Go module (the sluis and audit recipes), daily and on
# master; and, scheduled weekly, the external links of the built documentation
# site. Deliberately NOT in
# ci.yaml and not a required context: a standard-library advisory with no
# released fix, or a third-party site that is down, would otherwise wedge every
# pull request on a finding nobody can act on. CodeQL is the repository's
# default setup, not a workflow.
name: Security

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC
    - cron: "17 5 * * 1" # Mondays: the link check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    if: github.event.schedule != '17 5 * * 1'
    uses: truvity/ci-workflows/.github/workflows/check.yaml@8ab8774ba50e3668dcb5a07ad40ec900866ae140 # v3.33.0
    with:
      recipes: '["vuln","audit-vuln"]'

  # Every external link of the built site (lychee.toml); a dead one opens (or
  # comments on) an issue. A pull request gets the offline check of the
  # Markdown it changes, in the docs group of ci.yaml.
  links:
    if: github.event.schedule == '17 5 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: hack/docs-site.sh _site
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --root-dir "${{ github.workspace }}/_site" '_site/**/*.html'
          fail: false
          output: lychee-report.md
      - if: steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Dead links in the documentation"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="The weekly link check of the built site found dead links (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          $(cat lychee-report.md)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
