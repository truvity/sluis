# govulncheck for every Go module (the sluis and audit recipes), daily and on
# master. Deliberately NOT in ci.yaml and not a required context: a
# standard-library advisory with no released fix would otherwise wedge every
# pull request on a finding nobody can act on. CodeQL is the repository's
# default setup, not a workflow.
name: Security

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@a523f2f6e5868b00362056569c667243631fd90f # v3.26.2
    with:
      recipes: '["vuln","audit-vuln"]'
