# The one CI for pull requests and master. The shared workflow
# (truvity/ci-workflows) runs each Justfile recipe as its OWN parallel job; `plan`
# (hack/ci-plan.sh) picks the recipes a change can reach, so a docs-only or
# audit-only pull request runs what it touches. Master runs everything. The
# service-container tiers below are the tests that skip without their service.
#
# Pinned by COMMIT SHA, never a tag: this code runs in every repository of both
# organizations. Hosted runners: minutes are free on public repositories.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      recipes: ${{ steps.plan.outputs.recipes }}
      audit: ${{ steps.plan.outputs.audit }}
      s3: ${{ steps.plan.outputs.s3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: hack/ci-plan.sh

  recipes:
    needs: plan
    uses: truvity/ci-workflows/.github/workflows/check.yaml@a523f2f6e5868b00362056569c667243631fd90f # v3.26.2
    with:
      # The component contract (C1-C13) is judged, shown in the job summary,
      # and fails this job when a rule fails.
      policy-conformance: true
      policy-conformance-strict: true
      recipes: ${{ needs.plan.outputs.recipes }}

  # audit/ is a component of its own inside this repository (it never imports
  # sluis, which a test holds). `audit-race` needs a C toolchain, which its
  # recipe brings; `audit-drift-ts` and `audit-ts` fetch from a registry.
  audit:
    needs: plan
    if: needs.plan.outputs.audit == 'true'
    uses: truvity/ci-workflows/.github/workflows/check.yaml@a523f2f6e5868b00362056569c667243631fd90f # v3.26.2
    with:
      recipes: '["audit-build","audit-test","audit-lint","audit-proto","audit-drift","audit-schemas","audit-chart","audit-telemetry","audit-pages","audit-sdk-closure","audit-pulumi-test","audit-race","audit-drift-ts","audit-ts"]'

  # The S3 Blob and DynamoDB State adapters against a real S3 and DynamoDB
  # API. The image is pinned by digest (see `s3_image` in the Justfile, which
  # `just test-s3` uses locally: keep the two equal). The scripts fail when a
  # conformance test skipped or did not run, so an endpoint that stopped
  # reaching the tests cannot turn this green.
  s3:
    needs: plan
    if: needs.plan.outputs.s3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      s3:
        image: localstack/localstack@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        env:
          SERVICES: s3,kms,sqs,dynamodb,ssm
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s --health-timeout 5s --health-retries 10
      # An OpenBao development server for the storage module's KV and transit
      # backends; pinned by digest, keep it equal to `openbao_image` in the Justfile.
      openbao:
        image: ghcr.io/openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641 # 2.6.2
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
        ports: ["8200:8200"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STORAGE_OPENBAO_ADDR: http://127.0.0.1:8200
      STORAGE_OPENBAO_ROOT_TOKEN: root
      ACCESS_ROSTER_S3_URL: http://localhost:4566
      ACCESS_ROSTER_DYNAMODB_URL: http://localhost:4566
      STORAGE_LOCALSTACK_URL: http://localhost:4566
      KEYS_KMS_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: hack/s3-conformance.sh
      - run: hack/dynamodb-conformance.sh
      - run: hack/storage-conformance.sh
      - run: hack/keys-conformance.sh
      - run: hack/openbao-conformance.sh

  # audit's tests that skip without their service: Postgres, S3 with SQS and
  # DynamoDB (LocalStack), and OpenBAO. One job, three service containers.
  audit-services:
    needs: plan
    if: needs.plan.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIT_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/audit_test?sslmode=disable
      AUDIT_S3_URL: http://localhost:4566
      AUDIT_SQS_URL: http://localhost:4566
      AUDIT_DYNAMODB_URL: http://localhost:4566
      AUDIT_OPENBAO_URL: http://localhost:8200
      AUDIT_KMS_URL: http://localhost:4566
      AUDIT_OPENBAO_TOKEN: root
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      localstack:
        image: localstack/localstack@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        env:
          SERVICES: s3,kms,sqs,dynamodb
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s --health-timeout 5s --health-retries 10
      openbao:
        image: openbao/openbao@sha256:597f62847dd382382056a1d6704d50465908c2040038c4611832a23269a67112
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8200/v1/sys/health"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: audit/go.mod
      - run: hack/audit-service-tests.sh

  # The local cluster, stood up from nothing on truvity/policy's kind box; the
  # chart is installed from the package a snapshot release builds. Two lanes, each
  # on a box of its own: the chart on NATS, PostgreSQL and an S3 endpoint; and the
  # same with the notary signing under an AWS KMS key (a LocalStack stand-in), the
  # services-in-the-cluster tier, where nothing reads SQS, DynamoDB or SSM and the
  # pods get their endpoints and credentials from Kubernetes Secrets.
  audit-cluster:
    needs: plan
    if: needs.plan.outputs.audit == 'true'
    uses: truvity/ci-workflows/.github/workflows/integration.yaml@a523f2f6e5868b00362056569c667243631fd90f # v3.26.2
    permissions:
      contents: read
      id-token: write
    with:
      policy-version: v0.8.1
      gemaal-namespace: audit-e2e
      timeout-minutes: 30
      lanes: |
        [
          {
            "name": "audit",
            "build": "devbox run -- just audit-e2e-snapshot",
            "install": "devbox run -- just audit-e2e-fixture && devbox run -- just audit-e2e-install",
            "test": "devbox run -- just audit-e2e-smoke"
          },
          {
            "name": "audit-kms",
            "build": "devbox run -- just audit-e2e-snapshot",
            "install": "devbox run -- just audit-e2e-fixture && devbox run -- just audit-e2e-kms-fixture && EXTRA_VALUES=../charts/audit/testdata/values/e2e-kms.yaml devbox run -- just audit-e2e-install",
            "test": "E2E_KMS=1 devbox run -- just audit-e2e-smoke"
          }
        ]

  # Stable name for branch protection: the matrix reports as "recipes / build"
  # and so on, so a required context called "check" would never arrive and
  # every PR would hang waiting for it. Skipped jobs (a change that cannot
  # reach them) are not failures; anything else but success is.
  check:
    needs: [plan, recipes, audit, s3, audit-services, audit-cluster]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || { echo "a job ended $r"; exit 1; }
          done
