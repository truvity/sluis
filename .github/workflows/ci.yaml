# Calls the shared workflow (truvity/ci-workflows), which runs each
# Justfile recipe as its OWN parallel job. Previously all four ran
# serially inside one job, so a red result told you only that something
# failed — and this file was one of five near-identical copies across the
# public estate, which is how ten of them ended up silently broken on
# 2026-08-15.
#
# Hosted runners: minutes are free on public repositories, so the fan-out
# costs nothing.
#
# Pinned by COMMIT SHA, never a tag — tags move, and this code runs in
# every repository of both organizations.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@58d470dff71c732e208f47a80bb6c5d741e016a7 # v3.25.0
    with:
      # Required: the component contract (C1-C13) is judged, shown in the
      # job summary, and fails this job when a rule fails.
      policy-conformance: true
      policy-conformance-strict: true
      recipes: '["build","test","lint","chart-lint","telemetry","archive-check","docs-check","leak-canary","audit-catalogue","ts","console","pulumi-test"]'

  # The S3 Blob and DynamoDB State adapters against a real S3 and DynamoDB
  # API. The image
  # is pinned by digest (see `s3_image` in the Justfile, which `just test-s3`
  # uses locally: keep the two equal). The script fails when a conformance test
  # skipped or did not run, so an endpoint that stopped reaching the tests cannot
  # turn this green.
  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      s3:
        image: localstack/localstack@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        env:
          SERVICES: s3,kms,sqs,dynamodb
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      ACCESS_ROSTER_S3_URL: http://localhost:4566
      ACCESS_ROSTER_DYNAMODB_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: the adapters against LocalStack, and no skips
        run: hack/s3-conformance.sh
      - name: the DynamoDB adapter against LocalStack, and no skips
        run: hack/dynamodb-conformance.sh

  # Stable name for branch protection: the matrix reports as
  # "recipes / build" and so on, so a required context called "check"
  # would never arrive and every PR would hang waiting for it.
  check:
    needs: [recipes, s3]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.recipes.result }}" = "success" ] && [ "${{ needs.s3.result }}" = "success" ]'
