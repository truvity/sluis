# The one CI for pull requests and master. Each job runs a group of Justfile
# recipes (the `ci-*` recipes: `just ci-go-lint` on a laptop is the go-lint job)
# through hack/ci-group.sh, which runs every recipe even after one fails and
# lists each with its result in the job summary, so a red row names its recipe.
# `plan` (hack/ci-plan.sh) picks the groups a change can reach; master runs
# everything. `check` is the one required context.
#
# GitHub-hosted runners only: the repository is public. Actions are pinned by
# commit SHA.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      services: ${{ steps.plan.outputs.services }}
      audit: ${{ steps.plan.outputs.audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: hack/ci-plan.sh

  # go-build, go-test, go-lint, web, docs, audit. The Go groups embed the
  # console: frontend/dist comes from a cache keyed on its sources, and the
  # group's `console-ready` builds it on a miss.
  group:
    name: ${{ matrix.group }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # policy-conformance's C5 reads the CHANGELOG against the latest tag.
          fetch-depth: ${{ matrix.group == 'docs' && 0 || 1 }}
      - uses: truvity/ci-actions/setup-devbox@0fcf84dbeb8d406bce34d969e6cc32592af5cb5b # v1.15.0
      - if: startsWith(matrix.group, 'go-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/dist
          key: console-${{ hashFiles('frontend/**', 'ts/**', 'audit/ts/**', 'audit/react/**', 'devbox.lock') }}
      # golangci-lint's analysis cache: nothing else keeps it between runs.
      - id: golangci
        if: matrix.group == 'go-lint' || matrix.group == 'audit'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ matrix.group }}-${{ hashFiles('devbox.lock') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: golangci-${{ matrix.group }}-${{ hashFiles('devbox.lock') }}-
      - name: just ci-${{ matrix.group }}
        env:
          GROUP: ${{ matrix.group }}
        run: devbox run -- just "ci-$GROUP"
      - if: always() && steps.golangci.conclusion == 'success' && steps.golangci.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ steps.golangci.outputs.cache-primary-key }}
      # Every pin of truvity/ci-workflows and ci-actions is a tagged release,
      # and the component contract (C1-C13) holds.
      - if: ${{ !cancelled() && matrix.group == 'docs' }}
        uses: truvity/ci-actions/tagged-pins@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
      - if: ${{ !cancelled() && matrix.group == 'docs' }}
        uses: truvity/ci-actions/policy-conformance@b9e15d9c85bab02f91156faf9363fcd240946dcb # v1.16.0
        with:
          strict: "true"

  # The tests that skip without their service, each script failing when the
  # test it exists for did not run: sluis's S3, DynamoDB, KMS and SSM adapters
  # and the storage module's backends (LocalStack, OpenBao), and audit's
  # (Postgres, LocalStack, its own OpenBao). Images pinned by digest, equal to
  # `s3_image`, `openbao_image` and `audit_openbao_image` in the Justfile.
  services:
    needs: plan
    if: needs.plan.outputs.services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      localstack:
        image: localstack/localstack@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        env:
          SERVICES: s3,kms,sqs,dynamodb,ssm
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s --health-timeout 5s --health-retries 10
      openbao:
        image: ghcr.io/openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641 # 2.6.2
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
        ports: ["8200:8200"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health"
          --health-interval 5s --health-timeout 5s --health-retries 10
      audit-openbao:
        image: openbao/openbao@sha256:597f62847dd382382056a1d6704d50465908c2040038c4611832a23269a67112
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8201:8200"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8200/v1/sys/health"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
      ACCESS_ROSTER_S3_URL: http://localhost:4566
      ACCESS_ROSTER_DYNAMODB_URL: http://localhost:4566
      STORAGE_LOCALSTACK_URL: http://localhost:4566
      KEYS_KMS_URL: http://localhost:4566
      STORAGE_OPENBAO_ADDR: http://127.0.0.1:8200
      STORAGE_OPENBAO_ROOT_TOKEN: root
      AUDIT_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/audit_test?sslmode=disable
      AUDIT_S3_URL: http://localhost:4566
      AUDIT_SQS_URL: http://localhost:4566
      AUDIT_DYNAMODB_URL: http://localhost:4566
      AUDIT_KMS_URL: http://localhost:4566
      AUDIT_OPENBAO_URL: http://localhost:8201
      AUDIT_OPENBAO_TOKEN: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - env:
          SCRIPTS: ${{ needs.plan.outputs.services }}
        run: |
          read -ra scripts <<<"$SCRIPTS"
          hack/ci-group.sh --run services "${scripts[@]}"

  # The local cluster, stood up from nothing on truvity/policy's kind box; the
  # chart is installed from the package a snapshot release builds. Two lanes,
  # each on a box of its own: the chart on NATS, PostgreSQL and an S3 endpoint;
  # and the same with the notary signing under an AWS KMS key (a LocalStack
  # stand-in), where the pods get their endpoints and credentials from
  # Kubernetes Secrets.
  e2e:
    needs: plan
    if: needs.plan.outputs.audit == 'true'
    uses: truvity/ci-workflows/.github/workflows/integration.yaml@a523f2f6e5868b00362056569c667243631fd90f # v3.26.2
    permissions:
      contents: read
      id-token: write
    with:
      policy-version: v0.8.1
      gemaal-namespace: audit-e2e
      timeout-minutes: 30
      lanes: |
        [
          {
            "name": "audit",
            "build": "devbox run -- just audit-e2e-snapshot",
            "install": "devbox run -- just audit-e2e-fixture && devbox run -- just audit-e2e-install",
            "test": "devbox run -- just audit-e2e-smoke"
          },
          {
            "name": "audit-kms",
            "build": "devbox run -- just audit-e2e-snapshot",
            "install": "devbox run -- just audit-e2e-fixture && devbox run -- just audit-e2e-kms-fixture && EXTRA_VALUES=../charts/audit/testdata/values/e2e-kms.yaml devbox run -- just audit-e2e-install",
            "test": "E2E_KMS=1 devbox run -- just audit-e2e-smoke"
          }
        ]

  # The required context, under a name of its own: a matrix or a reusable
  # workflow reports as "group / ..." or "e2e / ...", which a ruleset naming
  # `check` never sees. Every job the plan picked must succeed; one it did not
  # pick must be skipped. Failed, cancelled, or skipped when planned is red.
  check:
    needs: [plan, group, services, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          GROUP: ${{ needs.group.result }}
          SERVICES: ${{ needs.services.result }}
          E2E: ${{ needs.e2e.result }}
          WANT_SERVICES: ${{ needs.plan.outputs.services != '' && 'success' || 'skipped' }}
          WANT_E2E: ${{ needs.plan.outputs.audit == 'true' && 'success' || 'skipped' }}
        run: |
          fail=0
          verdict() { echo "$1: $2 (wanted $3)"; [ "$2" = "$3" ] || fail=1; }
          verdict plan "$PLAN" success
          verdict group "$GROUP" success
          verdict services "$SERVICES" "$WANT_SERVICES"
          verdict e2e "$E2E" "$WANT_E2E"
          exit "$fail"
