# Builds the sluis.id website (Astro Starlight, site/ and docs/) together with the
# v1 documentation of the newest stable v1 release tag (under /v1/), and deploys it
# to Cloudflare Workers. This workflow publishes; checks.yaml judges pull requests.
#
# - `build` proves the site builds strictly (checks, v1 under /v1/, the built-site
#   checks) and gates the deploy.
# - `deploy-workers` builds the site for Cloudflare Workers and deploys it with
#   Wrangler, on every push to `main` (and on a manual run from `main`) after `build`
#   has passed, in the GitHub environment `cloudflare` (ADR 0063). That environment
#   allows only `main` and holds the three secrets of the deploy. A pull request never
#   runs it: this workflow has no pull_request trigger.
#
# GitHub Pages is off (2026-11-01): the site is served by the Worker alone, and this
# workflow has no job that publishes to Pages.
#
# The v1 tag is looked up on every run (site/scripts/latest-v1-tag.sh), so a run
# started after a new v1.X.Y tag is pushed picks it up. The tag and its commit are
# stamped into build.json next to this branch's own commit. The build names no
# branch of v1: when `master` is renamed `v1` at the cutover, nothing here changes.
#
# The Worker, its KV namespace and the custom domains of sluis.id are managed outside
# this repository; this workflow only uploads a new version of the Worker.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "Justfile"
      - "lychee.toml"
      - "devbox.json"
      - "devbox.lock"
      - ".github/workflows/site.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Images and fonts are in Git LFS (.gitattributes), so lfs: true.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      # v1: the MkDocs site at the newest stable v1 release tag, built under /v1/
      # by site/scripts/build-v1.sh. The step fails when there is no such tag.
      - name: Find the newest stable v1 tag
        id: v1
        run: |
          set -euo pipefail
          read -r tag commit < <(site/scripts/latest-v1-tag.sh "https://github.com/$GITHUB_REPOSITORY")
          echo "v1 documentation: $tag ($commit)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.v1.outputs.tag }}
          path: v1-src
          lfs: true
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      # The status page reads the org project, which the GITHUB_TOKEN cannot. The
      # read-only sluis-status App mints a short-lived token for the build only.
      - name: Token to read the project
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SLUIS_STATUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SLUIS_STATUS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: read
          permission-organization-projects: read
      - name: Build the site (strict)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: devbox run -- just site-build
      # The build falls back to a page without project data when the token cannot
      # read the project; a published build must not.
      - name: The status page has the project data
        run: |
          if grep -q "Project data not available" site/dist/status/index.html; then
            echo "::error::the build could not read the project; see the Build step's log"
            exit 1
          fi
      - name: Render the pages in headless Chrome
        run: devbox run -- just site-render
      - name: Build v1 into /v1/
        run: devbox run -- site/scripts/build-v1.sh v1-src site/dist
      - name: Check the built site
        run: devbox run -- site/scripts/check-built.sh site/dist

  # The Cloudflare Workers build and deploy (ADR 0063). It repeats the build steps of
  # `build` with SLUIS_TARGET=workers instead of passing an artifact: the KV id of the
  # Worker's configuration is written by the build, from a secret that exists only in
  # this job's environment, and the generated Wrangler redirect lives in a hidden
  # directory that an artifact would drop. The secrets are given to single steps, not to
  # the job, so the install, the v1 build and the checks never see them.
  deploy-workers:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    environment: cloudflare
    # One deploy at a time. A deploy that waits is replaced by a newer one; a running
    # deploy is never cancelled.
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    steps:
      # Fail in seconds, and without printing a value, when the environment is not set up.
      - name: The deploy secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLUIS_STATUS_KV_ID: ${{ secrets.SLUIS_STATUS_KV_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SLUIS_STATUS_KV_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::the secret $name of the environment cloudflare is not set"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Find the newest stable v1 tag
        id: v1
        run: |
          set -euo pipefail
          read -r tag commit < <(site/scripts/latest-v1-tag.sh "https://github.com/$GITHUB_REPOSITORY")
          echo "v1 documentation: $tag ($commit)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.v1.outputs.tag }}
          path: v1-src
          lfs: true
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - name: Token to read the project
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SLUIS_STATUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SLUIS_STATUS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: read
          permission-organization-projects: read
      - name: Install the site's dependencies
        run: devbox run -- just site-install
      # The build writes the KV id into the generated Worker configuration
      # (site/src/cloudflare-kv-id.mjs); it logs that it did, never the id.
      - name: Build the site for the Worker (strict)
        env:
          SLUIS_TARGET: workers
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUIS_STATUS_KV_ID: ${{ secrets.SLUIS_STATUS_KV_ID }}
        run: devbox run -- site/scripts/strict-build.sh
      - name: The status page has the project data
        run: |
          if grep -q "Project data not available" site/dist/client/status/index.html; then
            echo "::error::the build could not read the project; see the Build step's log"
            exit 1
          fi
      - name: Build v1 into /v1/
        run: devbox run -- site/scripts/build-v1.sh v1-src site/dist/client
      - name: Check the built site
        run: devbox run -- site/scripts/check-built.sh site/dist/client
      - name: Stamp the build
        env:
          V1_TAG: ${{ steps.v1.outputs.tag }}
          V1_COMMIT: ${{ steps.v1.outputs.commit }}
        run: |
          jq -nc --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg v1_tag "$V1_TAG" --arg v1_commit "$V1_COMMIT" \
            '{commit: $commit, run: $run, v1_tag: $v1_tag, v1_commit: $v1_commit}' > site/dist/client/build.json
          cat site/dist/client/build.json
      # Free plan: 20,000 asset files per Worker version (ADR 0063).
      - name: Fewer than 20,000 asset files
        run: |
          files=$(find site/dist/client -type f | wc -l)
          echo "$files asset files"
          [ "$files" -le 20000 ] || { echo "::error::$files asset files; the Free plan allows 20,000 per version"; exit 1; }
      # Wrangler prints the bindings of the Worker, which include the KV id. GitHub
      # masks the value of every secret in the log, so it shows as ***.
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: devbox run -- just site-deploy
