# Judges pull requests to the sluis.id website: description lint, a strict build,
# a link check, the workflows themselves, the v1 build under /v1/, and the
# repository rules (`just check-rules`). It never publishes (site.yaml does), and
# it is not path-filtered, so it can be made a required check on `main`.
name: Checks

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: site (lint, strict build, links)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      # PUBLIC_CONTENT_DENYLIST is a repository secret: the private names that must never appear
      # here. The requirements lint checks the catalogue against it; a pull request from a fork
      # gets no secrets, and the lint then skips that part and says so.
      - run: devbox run -- just site-check
        env:
          PUBLIC_CONTENT_DENYLIST: ${{ secrets.PUBLIC_CONTENT_DENYLIST }}

  v1:
    name: v1 under /v1/
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      # The tag the Pages workflow publishes under /v1/ (site/scripts/latest-v1-tag.sh).
      - name: Find the newest stable v1 tag
        id: v1
        run: |
          set -euo pipefail
          read -r tag commit < <(site/scripts/latest-v1-tag.sh "https://github.com/$GITHUB_REPOSITORY")
          echo "v1 documentation: $tag ($commit)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.v1.outputs.tag }}
          path: v1-src
          lfs: true
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - run: devbox run -- just site-build
      - run: devbox run -- site/scripts/build-v1.sh v1-src site/dist
      - run: devbox run -- site/scripts/check-built.sh site/dist

  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - run: devbox run -- actionlint

  # The repository rules (tools/checks/, `just check-rules`). PUBLIC_CONTENT_DENYLIST is a
  # repository secret: the private names that must never appear here. A pull request from a
  # fork gets no secrets, and the check then skips that part and says so.
  rules:
    name: rules (decisions, requirements, public content, file names, agent links)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - run: devbox run -- just check-rules
        env:
          PUBLIC_CONTENT_DENYLIST: ${{ secrets.PUBLIC_CONTENT_DENYLIST }}

  # One name to require. A job that was skipped or cancelled is not a pass.
  checks:
    needs: [site, v1, workflows, rules]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check succeeded
        env:
          RESULTS: ${{ needs.site.result }} ${{ needs.v1.result }} ${{ needs.workflows.result }} ${{ needs.rules.result }}
        run: |
          echo "site v1 workflows rules: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a check did not succeed"; exit 1; }
          done
