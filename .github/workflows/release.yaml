# One release for the whole repository. Pushing a root tag vX.Y.Z:
#
#   release  sluis: binaries, images (ko), the Helm chart and the Nix flakes,
#            by the shared workflow (truvity/ci-workflows)
#   audit    audit: the same, from audit/.goreleaser.yaml, added to the SAME
#            GitHub release (the shared workflow runs one goreleaser config, so
#            the second product is a job of its own beside it)
#   npm      the TypeScript package
#   modules  every other Go module (hack/modules.py finds them), tagged
#            <dir>/vX.Y.Z at the release commit, which `just release-pin`
#            made: every go.mod already requires this release
#            (hack/tag-modules.sh)
#
# Release machinery is exercised only by a tag, so `just release-check vX.Y.Z`
# runs everything that does not need one, and `gate` runs the chain's pin first.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish: a half-pushed artifact set is worse than a
# queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Before anything is published: refuse a tag whose commit is not the pinned release commit.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # --release: the tagged commit must already have every go.mod pinned to
      # the release (`just release-pin`)
      - run: ./hack/modules.py check "$GITHUB_REF_NAME" --release

  release:
    needs: gate
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@b38472fac2bff567c7b138654cebc7da485170ca # v3.26.1
    with:
      # Charts are published here, NOT by goreleaser, so this list is a second
      # place the set of shipped artifacts is written down.
      charts: '["sluis"]'
      # ko names each artifact after its cmd dir: ghcr.io/truvity/sluis/sluis.
      ko-docker-repo: ghcr.io/truvity/sluis
      # sluisctl as a Nix flake (sluisctl_<version>_nix-flake.tar.gz) that
      # another repository's devbox installs by URL. accessctl is the same
      # program under its old name, kept for a release or two.
      nix-flakes: '["sluisctl", "accessctl"]'

  audit:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: truvity/ci-actions/public-runners@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        with:
          runners: ubuntu-latest
          visibility: ${{ github.event.repository.visibility }}
      - uses: truvity/ci-actions/setup-devbox@0fcf84dbeb8d406bce34d969e6cc32592af5cb5b # v1.15.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      # audit/.goreleaser.yaml: the archives and four images
      # (ghcr.io/truvity/audit/*) onto the release the first job created.
      - name: GoReleaser (audit)
        run: devbox run -- just audit-release
        env:
          GITHUB_RELEASE_DISABLED: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: ghcr.io/truvity/audit
      # The docs name checksums.txt for the Lambda zips: one file for the
      # release, so audit's lines go into it.
      - name: One checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern checksums.txt --dir "$RUNNER_TEMP"
          cat audit/dist/audit_*_checksums.txt >> "$RUNNER_TEMP/checksums.txt"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/checksums.txt" --clobber
      # The charts and the flake read dist/ of the checkout goreleaser built in.
      - run: rm -rf dist && cp -a audit/dist dist
      - uses: truvity/ci-actions/publish-charts@b1929140480a682ba6fc2cadaf58da387b500a90 # v1.11.0
        with:
          charts: '["audit"]'
          chart-root: charts
          registry: oci://ghcr.io/truvity/charts
          app-version-mode: release
          helmctl-version: 0.8.0
          token: ${{ secrets.GITHUB_TOKEN }}
      # The CLI as a Nix flake, so that another repository's devbox pins
      # `audit verify` by hash.
      - uses: truvity/ci-actions/publish-nix-flakes@b1929140480a682ba6fc2cadaf58da387b500a90 # v1.11.0
        with:
          flakes: '["audit"]'
          flake-dir: ${{ runner.temp }}/nix-flakes
          token: ${{ secrets.GITHUB_TOKEN }}

  # The TypeScript package, to GitHub Packages, at the tag's version. Built
  # here rather than on install: a git dependency builds itself through
  # `prepare`, and a package manager is free to pack it without running that
  # (yarn 4 did, and a consumer received a package with no ts/dist).
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          registry-url: https://npm.pkg.github.com
          scope: "@truvity"
      - name: Build, test and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd ts && npm ci && npx tsc --noEmit && npx vitest run && npx tsc -p tsconfig.build.json)
          # The repository's version is the tag; package.json carries none.
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          # npm refuses a pre-release (vX.Y.Z-rc.N) without a dist-tag.
          dist=latest
          case "$TAG" in *-*) dist=next ;; esac
          npm publish --tag "$dist"
          # The package was @truvity/access-roster before the rename to sluis.
          # GitHub Packages cannot `npm deprecate`, so for a release or two the
          # SAME build is published under the old name too. Remove this step
          # when the old name is retired (docs/decisions/0035-renamed-to-sluis.md).
          npm pkg set name="@truvity/access-roster" \
            description="DEPRECATED: renamed to @truvity/sluis, the same code under its new name. Install @truvity/sluis."
          npm publish --tag "$dist"

  # Supply-chain assurance, after the release and audit jobs have put every
  # asset on the GitHub release. It is a job of this workflow rather than a
  # step of the shared one because signing and attesting need the workflow's
  # OIDC token (`id-token: write`), which the shared workflow does not
  # request and a caller cannot widen. The certificate's identity is then
  # THIS file at the tag, which is what hack/release-verify.sh checks.
  #
  # Keyless: every signature and attestation is recorded in Sigstore's public
  # transparency log (Rekor), and so is the workflow identity that made it.
  #
  #   checksums.txt        signed once, AFTER the release and audit lines are
  #                        combined (the audit job), as checksums.txt.sigstore.json
  #   every release asset  a build-provenance attestation
  #   every SBOM           bound to its archive by an SBOM attestation (matrix)
  #   every image digest   signed, with provenance and an SBOM attestation
  #   every chart digest   signed, with provenance (attest-oci)
  attest:
    needs: [release, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the signature bundle is added to the release
      id-token: write
      attestations: write
    outputs:
      sboms: ${{ steps.plan.outputs.sboms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/public-runners@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        with:
          runners: ubuntu-latest
          visibility: ${{ github.event.repository.visibility }}
      - uses: truvity/ci-actions/setup-devbox@0fcf84dbeb8d406bce34d969e6cc32592af5cb5b # v1.15.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets out
          gh release download "$GITHUB_REF_NAME" --dir assets
          ls -l assets
      - name: Sign checksums.txt (keyless)
        run: |
          set -euo pipefail
          devbox run -- cosign sign-blob --yes \
            --bundle out/checksums.txt.sigstore.json assets/checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - name: Publish the signature bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" out/checksums.txt.sigstore.json --clobber
      - name: Plan the SBOM attestations
        id: plan
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(assets/*.sbom.spdx.json)
          test "${#files[@]}" -gt 0 || { echo "no SBOM among the release assets" >&2; exit 1; }
          echo "sboms=$(printf '%s\n' "${files[@]##*/}" | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  # One SBOM bound to the archive it describes (actions/attest-sbom).
  attest-sboms:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        sbom: ${{ fromJSON(needs.attest.outputs.sboms) }}
    steps:
      - name: Download the archive and its SBOM
        id: subject
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SBOM: ${{ matrix.sbom }}
        run: |
          set -euo pipefail
          subject="${SBOM%.sbom.spdx.json}"
          gh release download "$GITHUB_REF_NAME" --repo "$REPO" --dir assets --pattern "$subject" --pattern "$SBOM"
          echo "path=assets/$subject" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.subject.outputs.path }}
          sbom-path: assets/${{ matrix.sbom }}

  # The OCI artifacts of the release (hack/release-images.txt, the one list;
  # hack/release-verify.sh reads it too), as a matrix.
  oci-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifacts: ${{ steps.plan.outputs.artifacts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          set -euo pipefail
          list=$(grep -v '^[[:space:]]*\(#\|$\)' hack/release-images.txt | jq -Rnc '[inputs | split(" ") | {kind: .[0], ref: .[1]}]')
          test "$(jq length <<<"$list")" -gt 0
          echo "artifacts=$list" >> "$GITHUB_OUTPUT"

  # Every image and chart the release pushes, by digest: a keyless cosign
  # signature and a build-provenance attestation, pushed to the registry
  # beside the artifact; an image also gets an SPDX SBOM attestation.
  attest-oci:
    needs: [release, audit, oci-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(needs.oci-plan.outputs.artifacts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/public-runners@598251d570fd99ba403b99bfa65ae4472ed25e73 # v1.8.0
        with:
          runners: ubuntu-latest
          visibility: ${{ github.event.repository.visibility }}
      - uses: truvity/ci-actions/setup-devbox@0fcf84dbeb8d406bce34d969e6cc32592af5cb5b # v1.15.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - name: Resolve the digest, sign it, write the image's SBOM
        id: oci
        env:
          REF: ${{ matrix.artifact.ref }}
          KIND: ${{ matrix.artifact.kind }}
        run: |
          set -euo pipefail
          digest=$(devbox run -- crane digest "$REF:${GITHUB_REF_NAME#v}")
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "no digest for $REF: $digest" >&2; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          devbox run -- cosign sign --yes "$REF@$digest"
          if [ "$KIND" = image ]; then
            devbox run -- syft "$REF@$digest" --output "spdx-json=$RUNNER_TEMP/image.sbom.spdx.json"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.artifact.ref }}
          subject-digest: ${{ steps.oci.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: matrix.artifact.kind == 'image'
        with:
          subject-name: ${{ matrix.artifact.ref }}
          subject-digest: ${{ steps.oci.outputs.digest }}
          sbom-path: ${{ runner.temp }}/image.sbom.spdx.json
          push-to-registry: true

  # The modules other than the root, once the release itself succeeded.
  #
  # The tags are pushed with an installation token of the catalogue App, not
  # GITHUB_TOKEN: a tag ruleset can name an App as its only bypass but cannot
  # name GitHub Actions ("Actor GitHub Actions integration must be part of the
  # ruleset source or owner organization"), so the App is what lets the module
  # tags be creatable by this job alone. The job's OIDC token is exchanged at the
  # issuer for it: no key, no secret. The issuer must grant this workflow file a
  # token of the App for this repository (contents: write); without
  # vars.ACCESS_ROSTER_ISSUER the job falls back to GITHUB_TOKEN, which a ruleset
  # on the module tags would refuse.
  modules:
    needs: [release, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is for the API calls and nothing else; a credential left
          # in .git/config is one more place a step could read it.
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: truvity/ci-actions/token-exchange@de28ab4e61adb8b217c0838886cc6e4b2c71b398 # v1.9.0
        id: app
        if: vars.ACCESS_ROSTER_ISSUER != ''
        with:
          issuer: ${{ vars.ACCESS_ROSTER_ISSUER }}
          github-app: truvity-ci-automation
          repositories: ${{ github.event.repository.name }}
          permissions: contents:write
      - name: tag the modules, dependencies first, at the release commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.github-token || github.token }}
          REPO: ${{ github.repository }}
          GOEXPERIMENT: jsonv2
        run: ./hack/tag-modules.sh "$GITHUB_REF_NAME"
