# Deploys the documentation site (docs/, mkdocs-material) and the JSON schemas
# to https://truvity.github.io/sluis/ on a push to master that changes them.
# Deploy only: a pull request builds and checks the same site in the `docs`
# group of ci.yaml (`just docs-site`), so this job runs the one build script
# and publishes it. Needs GitHub Pages enabled for the repository (Settings >
# Pages > Source: GitHub Actions), a setting this workflow does not change.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yaml"
      - "hack/mkdocs_hooks.py"
      - "hack/pages-requirements.txt"
      - "schemas/**"
      - "audit/schemas/**"
      - "audit/sdk/schemas/**"
      - "audit/sdk/catalogue/**"
      - "audit/gen/jsonschema/**"
      - "hack/docs-site.sh"
      - "hack/pages-site.sh"
      - "hack/fetch-mermaid.sh"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - run: hack/docs-site.sh _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
