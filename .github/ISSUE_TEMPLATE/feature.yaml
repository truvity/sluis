name: Feature request
description: Ask for new behaviour.
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        sluis issues credentials and brokers identity. New scope needs a decision first.
        If you are not sure whether your idea fits, use the Decision proposal form.
        New features are planned for v2. v1 builds only its agreed roadmap and fixes; any other v1 feature needs a decision issue first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem? What do they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core
        - port
        - driver
        - integration
        - client
        - service
        - deploy
        - conformance
        - docs
        - not sure
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Could you build it?
      options:
        - "Yes"
        - "With guidance"
        - "No"
