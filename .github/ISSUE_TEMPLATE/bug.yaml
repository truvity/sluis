name: Bug
description: Something does not work as documented.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use the private security advisory link on the issue chooser.
        Do not paste real secrets, tokens, hostnames or personal data.
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: Which line is the problem in? v1 issues are labelled `line:v1`; an issue without that label is about v2.
      options:
        - "v1.x (master)"
        - "v2 (main)"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release tag or commit
      description: The exact release tag or commit you tested.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core
        - port
        - driver
        - integration
        - service
        - deploy
        - conformance
        - docs
        - not sure
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest steps that show the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove secrets and personal data first.
      render: text
