# A valid install whose writer verifies who publishes, which is the base the
# refusals about workload identity are laid over (tests/invalid/audit).
mode: direct
presets:
  operational:
    bucket: audit-archive
    region: eu-example-1
externalIdentifiersAreOpaque: true
workloadIdentity:
  issuers:
    - url: https://oidc.example.test
  workloads:
    - subject: system:serviceaccount:app:api
      source: app
writer:
  config:
    apiVersion: audit.truvity.github.io/audit-writer/v2
    deployment: /etc/audit/deployment.yaml
    workloads: /etc/audit/workloads.yaml
jobs:
  verify:
    enabled: false
  purge:
    enabled: false
  clockSync:
    enabled: false
