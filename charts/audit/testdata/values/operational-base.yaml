# Direct mode: the front door and the write path in one process, no stream, one
# writer, and the jobs that need no database. A trial install, so the writer
# takes writes from callers it cannot verify.
mode: direct
presets:
  operational:
    bucket: audit-archive
    region: eu-example-1
externalIdentifiersAreOpaque: true
writer:
  config:
    apiVersion: audit.truvity.github.io/audit-writer/v2
    deployment: /etc/audit/deployment.yaml
    anonymousWrites: true
jobs:
  notary:
    enabled: true
    config:
      apiVersion: audit.truvity.github.io/audit-notary/v2
      deployment: /etc/audit/deployment.yaml
      signer:
        kms:
          key: alias/audit-seal
      sink:
        url: http://audit:8080
  verify:
    config:
      apiVersion: audit.truvity.github.io/audit-verify/v2
      deployment: /etc/audit/deployment.yaml
      sink:
        url: http://audit:8080
  purge:
    enabled: false
  clockSync:
    config:
      apiVersion: audit.truvity.github.io/audit-clock-sync/v2
      ntp: [time.cloudflare.com]
      sink:
        url: http://audit:8080
