# Audit with its services in the cluster: NATS carries the stream, PostgreSQL
# holds the deduplication table and the index, and credentials arrive as
# Kubernetes Secrets (delivered, for example, from OpenBAO by an operator such
# as External Secrets). Nothing reads SQS, DynamoDB or SSM Parameter Store, and
# there is no Pulumi program and no Lambda.
#
# What stays outside the cluster, and is the operator's to bring:
#
#   - an S3 bucket: AWS S3 here, or Cloudflare R2 (the commented variant below).
#     Prefer AWS S3 where Object Lock may be needed later: the `attested`
#     preset keeps its objects under compliance Object Lock, which is AWS S3
#     only and is refused on an endpoint.
#   - a key: an AWS KMS key here (the notary signs seals with it), or OpenBAO
#     transit (the commented variant below).
#   - the PostgreSQL database and its four roles.
#   - the Secrets named below.
#
# PostgreSQL here is a CloudNativePG cluster named `audit-db` in the `postgres`
# namespace. Every connection verifies the server (`sslmode=verify-full`, the
# only mode the binaries accept) against the cluster's own CA, so the URL names
# the read-write Service `audit-db-rw`, a name the server certificate carries,
# and `sslrootcert` names the CA file mounted by `trust` below.
#
# The host and Secret names are examples. A secret is never in this file.
mode: stream
replicas: 2

presets:
  standard:
    bucket: audit-eu-example-1
    region: eu-example-1
    prefix: audit/
    # Objects are encrypted under this KMS key; the alias is a name, never an ARN.
    key_alias: alias/sluis-example-audit-archive
  # The same preset on Cloudflare R2 instead (no KMS key, no Object Lock):
  #   standard:
  #     bucket: audit-archive
  #     prefix: audit/
  #     region: auto
  #     endpoint: https://ACCOUNT.r2.cloudflarestorage.com
  # and give each pod that touches the archive the access key as AWS_ACCESS_KEY_ID
  # and AWS_SECRET_ACCESS_KEY (`secretEnv`, as the writer's below).
profiles:
  security:
    frameworks: [security]

# Identifiers an application minted are already opaque, so the writer needs no
# pseudonymisation key. Set it false and add a `keys` block under `writer.config`
# (see the variants at the end) if records carry direct identifiers.
externalIdentifiersAreOpaque: true

# The CA of the CNPG cluster's server certificate is the `ca.crt` key of its
# `audit-db-ca` Secret. `trust` takes a ConfigMap, so put the CA in one in this
# release's namespace, for example with trust-manager (a Bundle whose source is
# that Secret, in trust-manager's own namespace, and whose target is a ConfigMap
# with key ca.crt), or once by hand:
#   kubectl -n postgres get secret audit-db-ca -o jsonpath='{.data.ca\.crt}' | base64 -d \
#     | kubectl -n audit create configmap audit-db-ca --from-file=ca.crt=/dev/stdin
# The chart mounts it on every pod at /etc/audit/trust, where the URLs below
# point `sslrootcert`.
trust:
  configMap: audit-db-ca
  key: ca.crt

migrate:
  enabled: true
  config:
    apiVersion: audit.truvity.github.io/audit-migrate/v2
    secrets:
      source: file
      root: /etc/audit/secrets
    database:
      url: postgres://audit_owner@audit-db-rw.postgres.svc:5432/audit?sslmode=verify-full&sslrootcert=/etc/audit/trust/ca.crt
      passwordSecret: audit-database-password
    writer: audit_writer
    observe: audit_observe
    reader: audit_query
  secretFiles:
    - name: audit-database-password
      secretName: audit-owner-database
      key: password

# The receiver is the front door: it publishes to NATS and holds neither the
# bucket nor a key.
receiver:
  config:
    apiVersion: audit.truvity.github.io/audit-writer/v2
    secrets:
      source: file
      root: /etc/audit/secrets
    mode: receiver
    deployment: /etc/audit/deployment.yaml
    anonymousWrites: true
    database:
      url: postgres://audit_writer@audit-db-rw.postgres.svc:5432/audit?sslmode=verify-full&sslrootcert=/etc/audit/trust/ca.crt
      passwordSecret: audit-database-password
    stream:
      nats:
        url: nats://nats.nats.svc:4222
      name: AUDIT
  secretFiles:
    - name: audit-database-password
      secretName: audit-database
      key: password

# Three writers consume the stream. On AWS the pod's identity (IRSA, Pod
# Identity) is the S3 credential; elsewhere the access key comes from a Secret.
writer:
  consumers: 3
  config:
    apiVersion: audit.truvity.github.io/audit-writer/v2
    secrets:
      source: file
      root: /etc/audit/secrets
    deployment: /etc/audit/deployment.yaml
    anonymousWrites: true
    replicas: 3
    database:
      url: postgres://audit_writer@audit-db-rw.postgres.svc:5432/audit?sslmode=verify-full&sslrootcert=/etc/audit/trust/ca.crt
      passwordSecret: audit-database-password
    stream:
      nats:
        url: nats://nats.nats.svc:4222
      name: AUDIT
      consumer: audit-writer
  secretFiles:
    - name: audit-database-password
      secretName: audit-database
      key: password

observe:
  enabled: true
  config:
    apiVersion: audit.truvity.github.io/audit-observe/v2
    secrets:
      source: file
      root: /etc/audit/secrets
    deployment: /etc/audit/deployment.yaml
    database:
      url: postgres://audit_observe@audit-db-rw.postgres.svc:5432/audit?sslmode=verify-full&sslrootcert=/etc/audit/trust/ca.crt
      passwordSecret: audit-database-password
  secretFiles:
    - name: audit-database-password
      secretName: audit-observe-database
      key: password

jobs:
  # Seals each closed hour into a signed chain, with a KMS key of its own: the
  # notary's identity may sign and the writer's may not. The key is an
  # ECC_NIST_P384 SIGN_VERIFY key; the pod reaches KMS through the SDK's
  # default credential chain.
  notary:
    enabled: true
    config:
      apiVersion: audit.truvity.github.io/audit-notary/v2
      deployment: /etc/audit/deployment.yaml
      keys:
        adapter: kms
        # Names the installation in the encryption context; stable, not secret.
        instance: audit
        seal:
          key: alias/sluis-example-audit-seal
      sink:
        url: http://audit:8080
    # OpenBAO transit instead of KMS, signing with a token from a Secret:
    #   keys: null
    #   keys:
    #     adapter: transit
    #     instance: audit
    #     seal: audit-seal
    #     openbao: {address: http://openbao.secrets.svc:8200, tokenSecret: AUDIT_BAO_TOKEN}
    # with a `secretEnv` entry for AUDIT_BAO_TOKEN.
  verify:
    enabled: true
    config:
      apiVersion: audit.truvity.github.io/audit-verify/v2
      deployment: /etc/audit/deployment.yaml
      sink:
        url: http://audit:8080
  purge:
    enabled: false
  clockSync:
    enabled: true
    config:
      apiVersion: audit.truvity.github.io/audit-clock-sync/v2
      # Any NTP server the cluster can reach. On AWS, 169.254.169.123 is the
      # instance's own time service.
      ntp: ["pool.ntp.org"]
      sink:
        url: http://audit:8080

# Pseudonymisation keys, for records that carry direct identifiers (set
# `externalIdentifiersAreOpaque: false`). Under `writer.config`, with KMS and the
# wrapped per-tenant secrets in the PostgreSQL above (no SSM):
#   keys:
#     adapter: kms
#     instance: audit
#     pseudonym:
#       key: alias/audit-pseudonym
#     state:
#       backend: database
# The writer's database role holds the table; the key is an AWS KMS symmetric key.
# Or in OpenBAO transit, every writer asking the same engine, with a token with
# the writer's policy in AUDIT_BAO_TOKEN and the query service given one of its own:
#   keys:
#     adapter: transit
#     instance: audit
#     pseudonym: audit-pseudonym
#     openbao: {address: http://openbao.secrets.svc:8200, tokenSecret: AUDIT_BAO_TOKEN}
