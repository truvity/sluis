{{- include "sluis.prepare" . -}}
{{- if eq .Values.renders "app" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sluis.fullname" . }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sluis.selectorLabels" . | nindent 4 }}
    {{- if include "sluis.split" . }}
    app.kubernetes.io/component: issuer
    {{- end }}
  ports:
    - name: issuer
      port: {{ include "sluis.port" . }}
      targetPort: issuer
{{ end -}}
