{{- include "sluis.prepare" . -}}
{{- if eq .Values.renders "app" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sluis.serviceAccountName" . }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.serviceAccount.annotations | default dict) }}
  {{- if eq (.Values.serviceAccount.awsIdentity | default "pod-identity") "irsa" }}
  {{- $_ := required "serviceAccount.awsIdentity is irsa, which annotates the account with the role: set serviceAccount.awsRoleArn" .Values.serviceAccount.awsRoleArn }}
  {{- if hasKey $annotations "eks.amazonaws.com/role-arn" }}
  {{- fail "serviceAccount.annotations names eks.amazonaws.com/role-arn and serviceAccount.awsIdentity is irsa: say the role once, in serviceAccount.awsRoleArn" }}
  {{- end }}
  {{- $_ := set $annotations "eks.amazonaws.com/role-arn" .Values.serviceAccount.awsRoleArn }}
  {{- else if .Values.serviceAccount.awsRoleArn }}
  {{- fail "serviceAccount.awsRoleArn is set and serviceAccount.awsIdentity is not irsa: EKS Pod Identity annotates nothing, so the ARN would be ignored. Set awsIdentity: irsa, or remove awsRoleArn" }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if eq (dig "store" "memory" .Values.config) "kubernetes" }}
---
# The directory store is plain Kubernetes objects in THIS namespace:
# workspace records (ConfigMaps) and their credentials (Secrets), written
# by this service itself. A namespaced Role and never a ClusterRole —
# which is why this service gets a namespace of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sluis.fullname" . }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sluis.fullname" . }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sluis.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sluis.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if (dig "recovery" "enabled" false .Values.config) }}
---
# The one cluster-scoped permission this service ever needs, and the one
# thing left that asks the API server anything: creating TokenReviews, so
# that recovery can check a token proving cluster access. It reads
# nothing.
#
# Workloads used to need it too. They do not any more: a
# ServiceAccount token is verified against the key set its own cluster
# publishes, so this service holds no access to any cluster including its
# own. Recovery keeps it because on the day everything else is broken it
# should depend on nothing but the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sluis.fullname" . }}-{{ .Release.Namespace }}-tokenreview
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sluis.fullname" . }}-{{ .Release.Namespace }}-tokenreview
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sluis.fullname" . }}-{{ .Release.Namespace }}-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ include "sluis.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if (dig "recovery" "enabled" false .Values.config) }}
---
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.config.recovery.serviceAccount }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
{{- end }}
{{ end -}}
