{{- include "sluis.prepare" . -}}
{{- if eq .Values.renders "app" -}}
{{- include "sluis.checks" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sluis.fullname" . }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sluis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sluis.selectorLabels" . | nindent 8 }}
      annotations:
        # Configuration and policy are immutable for an instance: each document
        # is read once, at start, so a change to either is a rollout. One
        # checksum per document this process reads: the service document (the
        # controllers' sections are in it) and the policy.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/policy: {{ include (print $.Template.BasePath "/policy-configmap.yaml") . | sha256sum }}
        {{- if .Values.signingKey.verifyOnly }}
        checksum/verify-keys: {{ include (print $.Template.BasePath "/verify-keys.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sluis.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        {{- if include "sluis.secretFiles" . }}
        # The projected secrets are mode 0440: readable by this group, whatever
        # user the image runs as.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serve
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: {{ include "sluis.port" . }}
            - name: health
              containerPort: {{ include "sluis.healthPort" . }}
          # The whole of the configuration is the service document, `config`
          # rendered as it stands, and the policy document it names. The
          # environment carries only the secrets the document names.
          args:
            - serve
            - --config=/etc/sluis/config.yaml
          {{- /* The one process reports as access-issuer: the controllers' series are its own. */}}
          {{- /* Beside the secrets, the SDK variables telemetry.otlp names (ADR 0006). */}}
          {{- $otel := include "sluis.otelEnv" (dict "root" . "service" "access-issuer") }}
          {{- if or .Values.secretEnv $otel }}
          env:
            {{- range .Values.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
                  {{- if hasKey . "optional" }}
                  optional: {{ .optional }}
                  {{- end }}
            {{- end }}
            {{- with $otel }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            # Read once, at start: a subPath is enough, since a change replaces
            # the pod (checksum/*). The policy keeps its directory.
            - name: config
              mountPath: /etc/sluis/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            {{- if not (include "sluis.remoteSigning" .) }}
            - name: signing-key
              mountPath: /var/run/access-issuer/signing-key
              readOnly: true
            {{- range .Values.signingKey.additional }}
            {{- $name := include "sluis.additionalSigningKeyName" . }}
            - name: {{ $name }}
              mountPath: /var/run/access-issuer/{{ $name }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.signingKey.verifyOnly }}
            - name: verify-keys
              mountPath: /var/run/access-issuer/verify-keys
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- include "sluis.auditMounts" (dict "root" . "cfg" .Values.config) | nindent 12 }}
            {{- if include "sluis.controllerOn" (dict "root" . "kind" "github") }}
            # The GitHub controller's: the token the console verifies for it, the
            # Apps' credentials and the console's records.
            - name: github-token
              mountPath: /var/run/secrets/github-roster
              readOnly: true
            - name: github-apps
              mountPath: /var/run/github-roster/apps
              readOnly: true
            - name: github-records
              mountPath: /var/run/github-roster/records
              readOnly: true
            {{- end }}
            {{- if include "sluis.controllerOn" (dict "root" . "kind" "slack") }}
            # The Slack controller's, likewise.
            - name: slack-token
              mountPath: /var/run/secrets/slack-roster
              readOnly: true
            - name: slack-credentials
              mountPath: /var/run/slack-roster/credentials
              readOnly: true
            - name: slack-workspaces
              mountPath: /var/run/slack-roster/workspaces
              readOnly: true
            {{- end }}
            {{- with include "sluis.exportsMounts" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if include "sluis.secretFiles" . }}
            # A directory, not a subPath: a secret is read on every use, so a
            # rotated Secret reaches the running process.
            - name: secrets
              mountPath: /var/run/sluis/secrets
              readOnly: true
            {{- end }}
            {{- range .Values.secretMounts }}
            - name: secret-{{ .secretName }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "sluis.fullname" . }}-config
        {{- if not (include "sluis.remoteSigning" .) }}
        - name: signing-key
          secret:
            secretName: {{ include "sluis.signingKeySecret" . }}
        {{- range .Values.signingKey.additional }}
        {{- $name := include "sluis.additionalSigningKeyName" . }}
        - name: {{ $name }}
          secret:
            secretName: {{ include "sluis.fullname" $ }}-{{ $name }}
        {{- end }}
        {{- end }}
        {{- if .Values.signingKey.verifyOnly }}
        - name: verify-keys
          configMap:
            name: {{ include "sluis.fullname" . }}-verify-keys
        {{- end }}
        - name: policy
          configMap:
            name: {{ include "sluis.fullname" . }}-policy
        # The root filesystem is read-only, and the directory backends
        # want somewhere to write.
        - name: tmp
          emptyDir: {}
        {{- include "sluis.auditVolumes" (dict "root" . "cfg" .Values.config) | nindent 8 }}
        {{- if include "sluis.controllerOn" (dict "root" . "kind" "github") }}
        # The token the console verifies, for the audience it accepts a
        # workload's token for. Rotated by the kubelet; the controller reads
        # the file on every call.
        - name: github-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ include "sluis.exchangeAudience" . }}
                  expirationSeconds: 3600
                  path: token
        # One file per connected organisation. Optional: before anything is
        # connected there may be nothing, and the controller reports each
        # bound organisation as not connected rather than failing to start.
        - name: github-apps
          secret:
            secretName: {{ include "sluis.fullname" . }}-github-apps
            optional: true
        # The console's records beside them: each organisation's record, the
        # operators' confirmations and their requests for a pass now. Optional
        # for the same reason.
        - name: github-records
          configMap:
            name: {{ include "sluis.fullname" . }}-github-orgs
            optional: true
        {{- end }}
        {{- if include "sluis.controllerOn" (dict "root" . "kind" "slack") }}
        - name: slack-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ include "sluis.exchangeAudience" . }}
                  expirationSeconds: 3600
                  path: token
        # One file per connected workspace: the app's credentials and its bot
        # token. Optional: before anything is connected there may be nothing.
        - name: slack-credentials
          secret:
            secretName: {{ include "sluis.fullname" . }}-slack-credentials
            optional: true
        # The console's records beside them: each workspace's record, the
        # shared channels' definitions and the operators' confirmations.
        - name: slack-workspaces
          configMap:
            name: {{ include "sluis.fullname" . }}-slack-workspaces
            optional: true
        {{- end }}
        {{- with include "sluis.exportsVolumes" . }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if include "sluis.secretFiles" . }}
        # Every secret the config names, as the file <root>/<name>, so the
        # service resolves a secret by reading a path and never by holding
        # RBAC to read Secrets -- the same reason the signing key is a file.
        # A confidential client's is clients/<client-id>/secret, from the
        # Secret its policy entry names.
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              {{- range .Values.secrets }}
              - secret:
                  name: {{ .secretName | quote }}
                  items:
                    - key: {{ .key | quote }}
                      path: {{ .name | quote }}
              {{- end }}
              {{- if not (include "sluis.documentsMode" .) }}
              {{- range $id, $client := (include "sluis.declaredClients" . | fromYaml) }}
              {{- if $client.secret }}
              - secret:
                  name: {{ $client.secret }}
                  items:
                    - key: {{ $client.secretKey | default "client-secret" }}
                      path: clients/{{ $id }}/secret
              {{- end }}
              {{- end }}
              {{- end }}
        {{- end }}
        {{- range .Values.secretMounts }}
        - name: secret-{{ .secretName }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{ end -}}
