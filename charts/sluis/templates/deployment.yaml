{{- if eq .Values.renders "app" -}}
{{- include "sluis.checks" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sluis.fullname" . }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sluis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sluis.selectorLabels" . | nindent 8 }}
      annotations:
        # A configuration change is a rollout: the file is read at start.
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        # A policy change is a rollout: the file is read at start.
        checksum/policy: {{ include (print $.Template.BasePath "/policy-configmap.yaml") . | sha256sum }}
        {{- if .Values.exchange.clusters }}
        # A federated cluster is read once at start. A row added without a
        # rollout is a cluster whose workloads go on being refused, with
        # nothing to see but an error naming the wrong cause.
        checksum/clusters: {{ include (print $.Template.BasePath "/clusters-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.exchange.aws.accounts }}
        # An AWS account is read once at start, for the same reason.
        checksum/aws: {{ include (print $.Template.BasePath "/aws-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.directory.workspaces }}
        # A declared workspace is read once at start, so a workspace added
        # to the values without a rollout is one an operator can see in
        # git and nowhere in the running service.
        checksum/overlay: {{ include (print $.Template.BasePath "/overlay-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.githubApps.catalogue }}
        # The catalogue is read once at start, so an App declared without a
        # rollout is one the console does not offer.
        checksum/github-apps-catalogue: {{ include (print $.Template.BasePath "/github-apps-catalogue-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.slackApps }}
        # Likewise the Slack catalogue: read once at start.
        checksum/slack-apps-catalogue: {{ include (print $.Template.BasePath "/slack-apps-catalogue-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sluis.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serve
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: {{ include "sluis.port" . }}
            - name: health
              containerPort: {{ include "sluis.healthPort" . }}
          # The whole of the configuration is the file: `config`, rendered as it
          # stands. The environment carries only the secrets that file names.
          args:
            - serve
            - --config=/etc/sluis/config.yaml
          {{- /* Beside the secrets, the SDK variables telemetry.otlp names (ADR 0006). */}}
          {{- $otel := include "sluis.otelEnv" (dict "root" . "service" "access-issuer") }}
          {{- if or .Values.secretEnv $otel }}
          env:
            {{- range .Values.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
                  {{- if hasKey . "optional" }}
                  optional: {{ .optional }}
                  {{- end }}
            {{- end }}
            {{- with $otel }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/sluis/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: signing-key
              mountPath: /var/run/access-issuer/signing-key
              readOnly: true
            {{- range .Values.signingKey.additional }}
            {{- $name := include "sluis.additionalSigningKeyName" . }}
            - name: {{ $name }}
              mountPath: /var/run/access-issuer/{{ $name }}
              readOnly: true
            {{- end }}
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            {{- if .Values.exchange.clusters }}
            - name: clusters
              mountPath: /var/run/access-issuer/clusters.yaml
              subPath: clusters.yaml
              readOnly: true
            {{- end }}
            {{- if .Values.exchange.aws.accounts }}
            - name: aws
              mountPath: /var/run/access-issuer/aws.yaml
              subPath: aws.yaml
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- include "sluis.auditMounts" (dict "root" . "cfg" .Values.config) | nindent 12 }}
            {{- with include "sluis.exportsMounts" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.githubApps.catalogue }}
            - name: github-apps-catalogue
              mountPath: /var/run/access-issuer/github-apps-catalogue.yaml
              subPath: catalogue.yaml
              readOnly: true
            {{- end }}
            {{- if .Values.slackApps }}
            - name: slack-apps-catalogue
              mountPath: /var/run/access-issuer/slack-apps-catalogue.yaml
              subPath: catalogue.yaml
              readOnly: true
            {{- end }}
            {{- if .Values.directory.workspaces }}
            - name: overlay
              mountPath: /var/run/access-issuer/directory/overlay.yaml
              subPath: overlay.yaml
              readOnly: true
            {{- range .Values.directory.workspaces }}
            - name: key-{{ .secretName }}
              mountPath: /var/run/access-issuer/directory/keys/{{ .secretName }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if include "sluis.confidentialClients" . }}
            - name: client-secrets
              mountPath: /var/run/access-issuer/clients
              readOnly: true
            {{- end }}
            {{- range .Values.secretMounts }}
            - name: secret-{{ .secretName }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "sluis.fullname" . }}-config
        - name: signing-key
          secret:
            secretName: {{ include "sluis.signingKeySecret" . }}
        {{- range .Values.signingKey.additional }}
        {{- $name := include "sluis.additionalSigningKeyName" . }}
        - name: {{ $name }}
          secret:
            secretName: {{ include "sluis.fullname" $ }}-{{ $name }}
        {{- end }}
        - name: policy
          configMap:
            name: {{ include "sluis.fullname" . }}-policy
        # The root filesystem is read-only, and the directory backends
        # want somewhere to write.
        - name: tmp
          emptyDir: {}
        {{- include "sluis.auditVolumes" (dict "root" . "cfg" .Values.config) | nindent 8 }}
        {{- with include "sluis.exportsVolumes" . }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.exchange.clusters }}
        - name: clusters
          configMap:
            name: {{ include "sluis.fullname" . }}-clusters
        {{- end }}
        {{- if .Values.exchange.aws.accounts }}
        - name: aws
          configMap:
            name: {{ include "sluis.fullname" . }}-aws
        {{- end }}
        {{- if .Values.githubApps.catalogue }}
        - name: github-apps-catalogue
          configMap:
            name: {{ include "sluis.fullname" . }}-github-apps-catalogue
        {{- end }}
        {{- if .Values.slackApps }}
        - name: slack-apps-catalogue
          configMap:
            name: {{ include "sluis.fullname" . }}-slack-apps-catalogue
        {{- end }}
        {{- if .Values.directory.workspaces }}
        - name: overlay
          configMap:
            name: {{ include "sluis.fullname" . }}-overlay
        {{- range .Values.directory.workspaces }}
        - name: key-{{ .secretName }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
        {{- end }}
        {{- if include "sluis.confidentialClients" . }}
        # One file per confidential client, named after the client id, so
        # the service resolves a secret by reading a path and never by
        # holding RBAC to read Secrets -- the same reason the signing key
        # is a file.
        - name: client-secrets
          projected:
            sources:
              {{- range $id, $client := (include "sluis.declaredClients" . | fromYaml) }}
              {{- if $client.secret }}
              - secret:
                  name: {{ $client.secret }}
                  items:
                    - key: {{ $client.secretKey | default "client-secret" }}
                      path: {{ $id }}
              {{- end }}
              {{- end }}
        {{- end }}
        {{- range .Values.secretMounts }}
        - name: secret-{{ .secretName }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{ end -}}
