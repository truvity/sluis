{{- if eq .Values.renders "app" -}}
{{- if .Values.controllerSlack.enabled }}
{{- $cfg := .Values.controllerSlack.config }}
{{- include "sluis.rosterChecks" (dict "root" . "name" "controllerSlack" "cfg" $cfg "dir" "slack-roster") }}
{{- include "sluis.expectPath" (dict "key" "controllerSlack.config.credentialsDir" "got" $cfg.credentialsDir "want" "/var/run/slack-roster/credentials" "source" "the credentials Secret" "present" true) }}
{{- include "sluis.expectPath" (dict "key" "controllerSlack.config.recordsDir" "got" $cfg.recordsDir "want" "/var/run/slack-roster/workspaces" "source" "the records ConfigMap" "present" true) }}
{{- /*
  The controller refuses to start when the policy document's
  controllers.slack.enabledWorkspaces names a key its slack table does not
  declare. The policy is inline in values, so say so here, at render time,
  before the rollout stops the running controller.
*/ -}}
{{- $bound := dig "slack" "workspaces" dict .Values.policy }}
{{- range dig "controllers" "slack" "enabledWorkspaces" list .Values.policy }}
{{- if not (hasKey $bound .) }}
{{- fail (printf "policy.controllers.slack.enabledWorkspaces names %q, which policy.slack.workspaces does not declare: remove it from enabledWorkspaces, or declare the workspace in the policy" .) }}
{{- end }}
{{- end }}
{{- include "sluis.controllerRollout" (dict "name" "controllerSlack" "v" .Values.controllerSlack) }}
{{- $name := printf "%s-slack-roster" (include "sluis.fullname" .) }}
---
# The controller's own account. It holds one permission: updating its one
# report. The Secret with the workspaces' bot tokens and the ConfigMap with
# the console's records are mounted volumes, so no Secret or other ConfigMap
# is readable at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-slack
---
# Update, by name, the one ConfigMap it reports into. The service creates
# that object — `create` cannot be narrowed to a name — so this account
# cannot create any ConfigMap, and in particular none that would read to
# the service as a workspace record.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-slack
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ printf "%s-slack-status" (include "sluis.fullname" .) | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-slack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-slack
data:
  # What `sluis controller slack --config` reads: `controllerSlack.config`, as the values give
  # it, with the apiVersion the chart writes. The binary validates it against schemas/config/controller-slack.schema.json.
  config.yaml: |
    {{- include "sluis.document" (dict "kind" "controller-slack" "doc" $cfg) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-slack
spec:
  # Rolled so that a new pod must be Ready before an old one goes: a
  # start that fails (the 2026-10-04 rollout, where every new pod crashed
  # at start) leaves the old pod running. More than one replica is safe only
  # on a shared State (see sluis.controllerRollout), and `replicas` is
  # refused above 1 without one.
  replicas: {{ .Values.controllerSlack.replicas }}
  minReadySeconds: {{ .Values.controllerSlack.minReadySeconds }}
  strategy:
    {{- include "sluis.controllerStrategy" .Values.controllerSlack | nindent 4 }}
  selector:
    matchLabels:
      {{- include "sluis.controllerSlackSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sluis.controllerSlackSelectorLabels" . | nindent 8 }}
      annotations:
        # One checksum per document this process reads: its own, and the
        # policy. A change to the service's or the other controller's
        # document does not restart it.
        checksum/config: {{ include "sluis.document" (dict "kind" "controller-slack" "doc" $cfg) | sha256sum }}
        checksum/policy: {{ include (print $.Template.BasePath "/policy-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller-slack
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args:
            - controller
            - slack
            - --config=/etc/sluis/config/config.yaml
          {{- include "sluis.controllerProbes" (dict "name" "controllerSlack" "cfg" $cfg) | nindent 10 }}
          {{- with include "sluis.otelEnv" (dict "root" . "service" "slack-roster") }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/sluis/config
              readOnly: true
            - name: policy
              mountPath: /etc/sluis/policy
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/slack-roster
              readOnly: true
            - name: credentials
              mountPath: /var/run/slack-roster/credentials
              readOnly: true
            - name: workspaces
              mountPath: /var/run/slack-roster/workspaces
              readOnly: true
            {{- include "sluis.auditMounts" (dict "root" . "cfg" $cfg) | nindent 12 }}
          {{- with .Values.controllerSlack.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: policy
          configMap:
            name: {{ include "sluis.fullname" . }}-policy
        # The token the console verifies, for the audience it accepts a
        # workload's token for. Rotated by the kubelet; the controller reads
        # the file on every call.
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ include "sluis.exchangeAudience" . }}
                  expirationSeconds: 3600
                  path: token
        # One file per connected workspace: the app's credentials and its bot
        # token. Optional: before anything is connected there may be nothing,
        # and the controller reports each declared workspace as not connected
        # rather than failing to start.
        - name: credentials
          secret:
            secretName: {{ include "sluis.fullname" . }}-slack-credentials
            optional: true
        # The console's records beside them: each workspace's record, the
        # shared channels' definitions and the operators' confirmations.
        # Optional for the same reason.
        - name: workspaces
          configMap:
            name: {{ include "sluis.fullname" . }}-slack-workspaces
            optional: true
        {{- include "sluis.auditVolumes" (dict "root" . "cfg" $cfg) | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{ end -}}
