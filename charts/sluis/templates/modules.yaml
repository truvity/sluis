{{- include "sluis.prepare" . -}}
{{- if eq .Values.renders "app" -}}
{{- include "sluis.checks" . }}
{{- include "sluis.moduleChecks" . }}
{{- range $mod := list "issuer" "github" "slack" "google" "cloudflare" }}
{{- if include "sluis.moduleOn" (dict "root" $ "module" $mod) }}
{{- $args := dict "root" $ "module" $mod }}
---
{{ include "sluis.moduleServiceAccountObject" $args }}
---
# The {{ $mod }} module's document, read once at start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sluis.moduleFullname" $args }}-config
  labels:
    {{- include "sluis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $mod }}
data:
  config.yaml: |
    {{- include "sluis.moduleDocument" $args | nindent 4 }}
---
{{ include "sluis.moduleDeployment" $args }}
{{- if include "sluis.modulePDBOn" $args }}
---
# Voluntary disruptions (a node drain) may take down only as many of the
# {{ $mod }} module's pods as this allows.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sluis.moduleFullname" $args }}
  labels:
    {{- include "sluis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $mod }}
spec:
  {{- $pdb := dig "podDisruptionBudget" dict (get $.Values.modules $mod) }}
  {{- if not (kindIs "invalid" $pdb.minAvailable) }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ ternary $pdb.maxUnavailable 1 (not (kindIs "invalid" $pdb.maxUnavailable)) }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sluis.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $mod }}
{{- end }}
{{- if include "sluis.moduleAutoscaled" $args }}
---
# The issuer's replicas follow its load; no other module scales: a controller
# runs one pass at a time under a lease, and a module's work is not request-bound.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sluis.moduleFullname" $args }}
  labels:
    {{- include "sluis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $mod }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sluis.moduleFullname" $args }}
  {{- $hpa := $.Values.modules.issuer.autoscaling }}
  minReplicas: {{ $hpa.minReplicas }}
  maxReplicas: {{ $hpa.maxReplicas }}
  metrics:
    {{- if $hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $hpa.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- if include "sluis.isCallee" $args }}
---
# Calls to the {{ $mod }} module, on /rpc. A call carries a projected ServiceAccount
# token minted for the module's audience, which the module checks with a TokenReview.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sluis.moduleFullname" $args }}
  labels:
    {{- include "sluis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $mod }}
spec:
  selector:
    {{- include "sluis.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $mod }}
  ports:
    - name: rpc
      port: {{ include "sluis.moduleRPCPort" $args }}
      targetPort: rpc
---
# The module checks its callers' tokens with a TokenReview, which is the one
# thing system:auth-delegator allows (and a SubjectAccessReview).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sluis.fullname" $ }}-{{ $.Release.Namespace }}-{{ $mod }}-auth-delegator
  labels:
    {{- include "sluis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $mod }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "sluis.moduleAccountName" $args }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{ end -}}
