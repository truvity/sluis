{{- if eq .Values.renders "app" -}}
{{- if .Values.networkPolicy.enabled }}
# Ingress only. Everything with a browser arrives through the gateway;
# these are the in-cluster callers — the proxies verifying tokens and the
# workloads exchanging them.
#
# No egress rules: this service has to reach the API server, the hub and
# whichever directory a person signs in with, and a chart that guessed at
# that list would be a chart that breaks a login the day a provider adds
# a hostname. The fleet's own egress policy is where that belongs: a
# Kubernetes NetworkPolicy cannot name a host, and the Slack controller
# (config.controllers.slack) needs slack.com:443 to be allowed there, as the
# GitHub controller needs api.github.com:443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sluis.fullname" . }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sluis.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if .Values.networkPolicy.gatewayNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        {{- end }}
        {{- range .Values.networkPolicy.clients }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: {{ include "sluis.port" . }}
    {{- if or (include "sluis.controllerOn" (dict "root" . "kind" "github")) (include "sluis.controllerOn" (dict "root" . "kind" "slack")) }}
    # The controllers in this process read the console's API through this
    # release's own Service, which may route the call to another replica of
    # the pod: so the pods admit one another on the issuer's port.
    - from:
        - podSelector:
            matchLabels:
              {{- include "sluis.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ include "sluis.port" . }}
    {{- end }}
{{- end }}
{{ end -}}
