{{- if eq .Values.renders "app" -}}
{{- if .Values.controllerGithub.enabled }}
{{- $cfg := .Values.controllerGithub.config }}
{{- include "sluis.rosterChecks" (dict "root" . "name" "controllerGithub" "cfg" $cfg "dir" "github-roster") }}
{{- include "sluis.expectPath" (dict "key" "controllerGithub.config.appsDir" "got" $cfg.appsDir "want" "/var/run/github-roster/apps" "source" "the apps Secret" "present" true) }}
{{- include "sluis.expectPath" (dict "key" "controllerGithub.config.recordsDir" "got" $cfg.recordsDir "want" "/var/run/github-roster/records" "source" "the records ConfigMap" "present" true) }}
{{- include "sluis.expectPath" (dict "key" "controllerGithub.config.catalogueFile" "got" $cfg.catalogueFile "want" "/var/run/github-roster/github-apps-catalogue.yaml" "source" "githubApps.catalogue" "present" (not (empty .Values.githubApps.catalogue))) }}
{{- /*
  The controller refuses to start when enabledOrgs names an organisation the
  policy does not bind. The policy is inline in values, so say so here, at
  render time, before the rollout stops the running controller. Skipped when
  the values carry no policy at all.
*/ -}}
{{- if or .Values.policy .Values.access }}
{{- $bound := dict }}
{{- range $org, $_ := dig "github" dict .Values.policy }}{{ $_ := set $bound $org true }}{{ end }}
{{- range dig "github" list (.Values.access | default dict) }}{{ $_ := set $bound .org true }}{{ end }}
{{- range $cfg.enabledOrgs }}
{{- if not (hasKey $bound .) }}
{{- fail (printf "controllerGithub.config.enabledOrgs names %q, which policy.github does not bind, and nor does access.github: remove it from enabledOrgs, or bind the organisation in the policy" .) }}
{{- end }}
{{- end }}
{{- end }}
{{- include "sluis.controllerRollout" (dict "name" "controllerGithub" "v" .Values.controllerGithub) }}
{{- $name := printf "%s-github-roster" (include "sluis.fullname" .) }}
---
# The controller's own account. It holds two permissions: updating its one
# report, and updating the one Secret people's linked GitHub accounts are
# kept in — each link's token pair rotates every time it is renewed, and
# the renewed pair has to be written back. The Secret with the Apps' keys
# and the ConfigMap with the console's records are mounted volumes, so no
# other Secret or ConfigMap is readable at all, and watching them for a
# change (an install, a Refresh) needs no permission either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-github
---
# Update, by name, the one ConfigMap it reports into. The service creates
# that object — `create` cannot be narrowed to a name — so this account
# cannot create any ConfigMap, and in particular none that would read to
# the service as a workspace record.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-github
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ printf "%s-github-status" (include "sluis.fullname" .) | quote }}]
    verbs: ["get", "update", "patch"]
  # Created by the service, like the report, so this can name it.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-github-links" (include "sluis.fullname" .) | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-github
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-github
data:
  # What `sluis controller github --config` reads: `controllerGithub.config`, as the values give
  # it. The binary validates it against schemas/config/controller-github.schema.json.
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-github
spec:
  # Rolled so that a new pod must be Ready before an old one goes: a
  # start that fails (the 2026-10-04 rollout, where every new pod crashed
  # at start) leaves the old pod running. More than one replica is safe only
  # on a shared State (see sluis.controllerRollout), and `replicas` is
  # refused above 1 without one.
  replicas: {{ .Values.controllerGithub.replicas }}
  minReadySeconds: {{ .Values.controllerGithub.minReadySeconds }}
  strategy:
    {{- include "sluis.controllerStrategy" .Values.controllerGithub | nindent 4 }}
  selector:
    matchLabels:
      {{- include "sluis.controllerGithubSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sluis.controllerGithubSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml $cfg | sha256sum }}
        # The bindings are read at start, like the service's policy.
        checksum/policy: {{ include (print $.Template.BasePath "/policy-configmap.yaml") . | sha256sum }}
        {{- if .Values.githubApps.catalogue }}
        # The catalogue is read once at start, like the service's own copy
        # (see deployment.yaml): this controller keeps no App keys and mints
        # no installation tokens, so it reads the catalogue for one reason
        # only — the groups its grants name are not reported as unconsumed
        # — and a changed catalogue should still restart it, the same way a
        # changed policy does.
        checksum/github-apps-catalogue: {{ include (print $.Template.BasePath "/github-apps-catalogue-configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller-github
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args:
            - controller
            - github
            - --config=/etc/sluis/controller-github.yaml
          {{- include "sluis.controllerProbes" (dict "name" "controllerGithub" "cfg" $cfg) | nindent 10 }}
          {{- with include "sluis.otelEnv" (dict "root" . "service" "github-roster") }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/sluis/controller-github.yaml
              subPath: config.yaml
              readOnly: true
            - name: policy
              mountPath: /var/run/github-roster/policy
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/github-roster
              readOnly: true
            - name: apps
              mountPath: /var/run/github-roster/apps
              readOnly: true
            - name: records
              mountPath: /var/run/github-roster/records
              readOnly: true
            {{- if .Values.githubApps.catalogue }}
            - name: github-apps-catalogue
              mountPath: /var/run/github-roster/github-apps-catalogue.yaml
              subPath: catalogue.yaml
              readOnly: true
            {{- end }}
            {{- include "sluis.auditMounts" (dict "root" . "cfg" $cfg) | nindent 12 }}
          {{- with .Values.controllerGithub.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: policy
          configMap:
            name: {{ include "sluis.fullname" . }}-policy
        # The token the console verifies, for the audience it accepts a
        # workload's token for. Rotated by the kubelet; the controller reads
        # the file on every call.
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ include "sluis.exchangeAudience" . }}
                  expirationSeconds: 3600
                  path: token
        # One file per connected organisation. Optional: before anything is
        # connected there may be nothing, and the controller reports each
        # bound organisation as not connected rather than failing to start.
        - name: apps
          secret:
            secretName: {{ include "sluis.fullname" . }}-github-apps
            optional: true
        # The console's records beside them: each organisation's record, the
        # operators' confirmations and their requests for a pass now. The
        # controller watches it, so a Refresh runs a pass at once. Optional
        # for the same reason.
        - name: records
          configMap:
            name: {{ include "sluis.fullname" . }}-github-orgs
            optional: true
        {{- if .Values.githubApps.catalogue }}
        - name: github-apps-catalogue
          configMap:
            name: {{ include "sluis.fullname" . }}-github-apps-catalogue
        {{- end }}
        {{- include "sluis.auditVolumes" (dict "root" . "cfg" $cfg) | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{ end -}}
