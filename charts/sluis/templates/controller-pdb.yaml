{{- if eq .Values.renders "app" -}}
{{- range $key, $kind := dict "controllerGithub" "github" "controllerSlack" "slack" }}
{{- $v := index $.Values $key }}
{{- if and $v.enabled (gt (int $v.replicas) 1) $v.podDisruptionBudget.enabled }}
---
# More than one replica is there to keep a controller running through a
# voluntary disruption (a node drain, a cluster upgrade): without a budget a
# drain may evict every replica at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sluis.fullname" $ }}-{{ $kind }}-roster
  labels:
    {{- include "sluis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: controller-{{ $kind }}
spec:
  minAvailable: {{ $v.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- if eq $kind "github" }}
      {{- include "sluis.controllerGithubSelectorLabels" $ | nindent 6 }}
      {{- else }}
      {{- include "sluis.controllerSlackSelectorLabels" $ | nindent 6 }}
      {{- end }}
{{- end }}
{{- end }}
{{ end -}}
