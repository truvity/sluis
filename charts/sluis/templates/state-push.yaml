{{- if eq .Values.renders "app" -}}
{{- /*
Second copies of the Secrets this service writes and nothing else can
re-deliver: the workspace credential an operator connected, the Apps the
service acts as, and the Slack state (every Slack workspace's credential,
and the records that say which workspaces and Slack Connect channels the
console holds).

These are RECOVERY copies, which is what separates them from
github-apps-push.yaml beside this file. That one exists so a consumer can
act as a catalogue App without asking the issuer; these exist so an
operator can put back what a deleted Secret took away. Same machinery,
different reason, and the reason is why neither is on by default.

Both push the WHOLE Secret under one remote key rather than mapping keys.
The names inside are not stable -- `<workspace-id>.json` changes on
reconnect, and `<org>.json` appears when an organisation is bound -- so a
per-key mapping written today stops matching later, silently, and leaves a
copy that is stale while still reporting healthy. A backup that lies is
worse than none.

THE SLACK RECORDS ARE A SECRET ON PURPOSE. They live in a ConfigMap, and a
PushSecret reads Secrets only, so the service keeps a mirror Secret,
`<release>-slack-records`, of exactly the ConfigMap's workspace records, Slack Connect
definitions and console channel records (never confirmations or pass markers, which are
transient) and rewrites it in the same code path that writes the ConfigMap.
That is why slackState.push takes two remote keys: two Secrets, two copies,
and a restore that can tell them apart. The derived status ConfigMap is not
copied: the controller rebuilds it.

WHAT IS NOT HERE: the session key. The service writes it, it is a Secret,
and copying it would be a mistake -- losing it signs everyone out and a
fresh one is minted, which is correct behaviour rather than a fault, while
a durable copy widens what a compromise of the store is worth. values.yaml
carries the argument in full.
*/ -}}
{{- $root := . }}
{{- $pushes := list }}
{{- if .Values.directory.push }}
{{- $pushes = append $pushes (dict
      "name" "workspace"
      "push" .Values.directory.push
      "secret" (printf "%s-workspace-credentials" (include "sluis.fullname" $root))
      "what" "the credential of every connected workspace") }}
{{- end }}
{{- if .Values.githubApps.push }}
{{- $pushes = append $pushes (dict
      "name" "github-apps"
      "push" .Values.githubApps.push
      "secret" (printf "%s-github-apps" (include "sluis.fullname" $root))
      "what" "the link App and one App per bound organisation") }}
{{- end }}
{{- if .Values.slackState.push }}
{{- $slack := .Values.slackState.push }}
{{- $pushes = append $pushes (dict
      "name" "slackState"
      "push" $slack
      "secret" (printf "%s-slack-credentials" (include "sluis.fullname" $root))
      "copy" "slack-credentials"
      "what" "the credential of every connected Slack workspace") }}
{{- if not $slack.recordsRemoteKey }}
{{- fail "slackState.push needs a recordsRemoteKey: the records are a second Secret and need an address of their own, apart from remoteKey" }}
{{- end }}
{{- $pushes = append $pushes (dict
      "name" "slackState.records"
      "push" (dict "secretStore" $slack.secretStore "remoteKey" $slack.recordsRemoteKey "refreshInterval" $slack.refreshInterval)
      "secret" (printf "%s-slack-records" (include "sluis.fullname" $root))
      "copy" "slack-records"
      "what" "every Slack workspace's record and every Slack Connect channel's definition (the mirror of the records ConfigMap)") }}
{{- end }}
{{- $seen := dict }}
{{- range $pushes }}
{{- if ne (dig "store" "memory" $root.Values.config) "kubernetes" }}
{{- fail (printf "%s.push needs config.store: kubernetes: with any other store this service keeps no Secret, so there is nothing to copy" .name) }}
{{- end }}
{{- if not .push.secretStore }}
{{- fail (printf "%s.push needs a secretStore: this chart does not invent where a credential is written" .name) }}
{{- end }}
{{- if not .push.remoteKey }}
{{- fail (printf "%s.push needs a remoteKey: a copy with no address is not one" .name) }}
{{- end }}
{{- $kind := .push.secretStore.kind | default "SecretStore" }}
{{- $where := printf "%s/%s/%s" $kind .push.secretStore.name .push.remoteKey }}
{{- if hasKey $seen $where }}
{{- fail (printf "%s.push and %s.push both write remoteKey %s in %s %s: one would overwrite the other, and whoever restored from that path could not tell which Secret they were holding" (index $seen $where) .name .push.remoteKey $kind .push.secretStore.name) }}
{{- end }}
{{- $_ := set $seen $where .name }}
---
# A recovery copy of {{ .what }}, to {{ $kind }} {{ .push.secretStore.name }}
# at {{ .push.remoteKey }}. Every key of the Secret lands there as one JSON
# object; restoring is an operator writing it back, deliberately.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ include "sluis.fullname" $root }}-{{ .copy | default .name }}-copy
  labels:
    {{- include "sluis.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ .push.refreshInterval | default "1h" }}
  # Declared rather than defaulted, as in github-apps-push.yaml: a field
  # the CRD fills in but the manifest omits reads as drift to anything
  # comparing desired against live, so an ArgoCD Application carrying this
  # chart would sit permanently OutOfSync on a PushSecret that is doing its
  # job -- and a permanent OutOfSync is a health signal nobody reads.
  updatePolicy: Replace
  # None, and not overridable to Delete by accident: the case this exists
  # for IS the Secret going away. A copy that leaves with its source is not
  # a backup. An installation that truly wants the copy removed can remove
  # it where it lives.
  deletionPolicy: None
  secretStoreRefs:
    - name: {{ .push.secretStore.name }}
      kind: {{ $kind }}
  selector:
    secret:
      name: {{ .secret }}
  dataTo:
    - conversionStrategy: None
      remoteKey: {{ .push.remoteKey }}
      # REQUIRED PER ENTRY. The top-level secretStoreRefs above does NOT
      # satisfy it: external-secrets puts a CEL rule on every dataTo item,
      #
      #   has(self.storeRef) && (has(self.storeRef.name) ||
      #                          has(self.storeRef.labelSelector))
      #
      # and an API server refuses the object outright without it --
      # "spec.dataTo[0]: Invalid value: storeRef must specify either name
      # or labelSelector", which names storeRef while pointing at dataTo
      # and so reads as though the store block above were wrong.
      #
      # THE SAME STORE as secretStoreRefs, never a second value. A push
      # already names where it writes; letting the two diverge would put
      # the copy somewhere nobody looks for it.
      #
      # This shipped broken once. `helm template`, the values schema and
      # the golden renders all passed, because a CEL rule lives in the CRD
      # and none of them has one -- so chart-lint pins the shape instead.
      storeRef:
        name: {{ .push.secretStore.name }}
        kind: {{ $kind }}
{{- end }}
{{ end -}}
