{{- include "sluis.prepare" . -}}
{{- if eq .Values.renders "app" -}}
{{- if .Values.adapters.openbao.caBundle }}
# The authorities that sign OpenBao's certificate, for the service's OpenBao connection
# A certificate, never a secret: it is mounted where the adapter's caFile says.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sluis.fullname" . }}-openbao-ca
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
data:
  ca.pem: |
    {{- .Values.adapters.openbao.caBundle | trim | nindent 4 }}
{{- end }}
{{ end -}}
