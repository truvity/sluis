{{- include "sluis.prepare" . -}}
{{- if eq .Values.renders "dashboards" }}
{{- /*
Dashboards-only mode: the sluis dashboards as grafana-operator objects for the
ONE shared Grafana, and nothing else. Install it in the namespace `sluis` of the
cluster that holds Grafana. A cluster without the operator has no GrafanaFolder
or GrafanaDashboard kind, which is why this is a mode of its own and not part of
the service's release.

The operator of THIS cluster places them in a folder `sluis` under the cluster's
own folder (dashboards.clusterFolderUID); it holds Edit on that folder only and a
nested folder inherits it. Dashboard uids are global in the shared Grafana, so
each is derived from the cluster folder (<clusterFolderUID>-sluis-overview,
<clusterFolderUID>-sluis-audit, <clusterFolderUID>-sluis-lambda): a fixed uid would collide across
clusters. The GrafanaFolder is Argo CD sync wave 0 and the dashboards wave 1;
the operator does not retry a dashboard applied before its folder.

The dashboards are the files in dashboards/. sluis-overview and audit-overview read
the metrics store; sluis-lambda reads the log store (the Lambda platform's INIT_REPORT
events carry cold starts, init durations and init timeouts, which no metric does), so
its datasource variable is a VictoriaLogs one and defaults to dashboards.datasources.logs.
audit-overview.json is a copy of
charts/audit/dashboards/audit-overview.json (Helm cannot read outside the chart,
and the audit chart is a separate release); tests/chart holds the two byte-equal.

The dashboards hold to truvity/observability's docs/dashboards.md (`just
telemetry` runs its dashboardlint): a `datasource` variable that every panel
uses, a `cluster` variable chained off it, `$cluster` in the title and every
query. The datasource uid is only the variable's default, filled in here.
*/ -}}
{{- $d := .Values.dashboards -}}
{{- $folder := required "dashboards.clusterFolderUID is required: the uid of this cluster's folder in the shared Grafana (the folder.uid of the observability-cluster chart)" $d.clusterFolderUID -}}
{{- $metrics := required "dashboards.datasources.metrics is required: the uid of the metrics datasource of the Grafana these dashboards live in" $d.datasources.metrics -}}
{{- $logs := required "dashboards.datasources.logs is required: the uid of the logs datasource of the Grafana these dashboards live in" $d.datasources.logs -}}
{{- $fuid := printf "%s-sluis" $folder -}}
{{- $selector := dict "matchLabels" (dict "observability.truvity.io/grafana" "shared") -}}
{{- if $d.instanceSelector }}{{ $selector = $d.instanceSelector }}{{ end -}}
{{- $ann := $d.commonAnnotations | default dict -}}
{{- $names := dict "sluis-overview" "sluis-overview" "audit-overview" "sluis-audit" "sluis-lambda" "sluis-lambda" -}}
{{- /* Check every uid before rendering any of them. */ -}}
{{- range $file, $suffix := $names }}
{{- $u := printf "%s-%s" $folder $suffix }}
{{- if not (regexMatch "^[A-Za-z0-9_-]{1,40}$" $u) }}
{{- fail (printf "dashboards.clusterFolderUID %q gives the dashboard uid %q, which must be 1 to 40 characters of letters, digits, '-' and '_' (a folder uid of at most 25 characters fits)" $folder $u) }}
{{- end }}
{{- end }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: {{ include "sluis.fullname" . }}-folder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboards
  annotations:
    {{- merge (dict "argocd.argoproj.io/sync-wave" "0") $ann | toYaml | nindent 4 }}
spec:
  # The Grafana resource lives in the observability-cluster release's
  # namespace, not this one; the folder needs the flag as much as a dashboard.
  allowCrossNamespaceImport: true
  title: sluis
  uid: {{ $fuid | quote }}
  parentFolderUID: {{ $folder | quote }}
  instanceSelector:
    {{- toYaml $selector | nindent 4 }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $name := trimSuffix ".json" (base $path) }}
{{- $dash := $.Files.Get $path | fromJson }}
{{- $_ := set $dash "uid" (printf "%s-%s" $folder (get $names $name)) }}
{{- range $v := $dash.templating.list }}
{{- if eq $v.name "datasource" }}
{{- $uid := ternary $logs $metrics (eq $v.query "victoriametrics-logs-datasource") }}
{{- $_ := set $v "current" (dict "selected" false "text" $uid "value" $uid) }}
{{- end }}
{{- end }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "sluis.fullname" $ }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sluis.labels" $ | nindent 4 }}
    app.kubernetes.io/component: dashboards
  annotations:
    {{- merge (dict "argocd.argoproj.io/sync-wave" "1") $ann | toYaml | nindent 4 }}
spec:
  allowCrossNamespaceImport: true
  folderUID: {{ $fuid | quote }}
  instanceSelector:
    {{- toYaml $selector | nindent 4 }}
  json: |
    {{- $dash | toPrettyJson | nindent 4 }}
{{- end }}
{{- end }}
