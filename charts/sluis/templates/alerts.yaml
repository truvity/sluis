{{- include "sluis.prepare" . -}}
{{- if eq .Values.renders "alerts" }}
{{- /*
Alert-only mode: this release renders the rules and nothing else, so it can be
installed a second time, where the metrics store's ruler looks for rule
objects, beside the release that runs the service. The precedent is
truvity/audit's `renders: alerts` and truvity/openbao's openbao-ops chart.

The series are the ones the service and the controllers publish over OTLP,
named as the metrics gateway names them: dots become underscores, a counter
gains `_total`, a unit becomes a suffix. Only the cluster, namespace and tier
become labels from the resource, so every other label below (`route`,
`kind`, `target`, `port`, `outcome`) is a metric attribute. A target is a
GitHub organisation or a Slack workspace the policy declares, which is why it
may be a label; a person, a group or an address never is.

Every expression is written over the `sluis_*` series. The `AccessRoster...`
alert names of v1.76 are retired with the `access_issuer_*` and `access_roster_*`
series they read: a route or a silence on one must move to the `Sluis...` name.

Which series a rule reads is the values' to say, so one release can read the
cluster's pods and another the Lambda function's: `alerts.namespaceLabel` names the
label that carries the namespace (`namespace` for a pod; `k8s_namespace_name` where the
metrics gateway keeps the resource's own), `alerts.namespace` its value (`lambda`
for the function) and `alerts.selector` any further matcher.

Every threshold carries its reason in a comment above the rule, and every
`by (...)` keeps the cluster label: one store holds many clusters and an
aggregation that drops it pairs series across them.
*/ -}}
{{- $a := .Values.alerts -}}
{{- $r := $a.rules -}}
{{- $ns := default .Release.Namespace $a.namespace -}}
{{- $c := $a.clusterLabel -}}
{{- $nl := $a.namespaceLabel -}}
{{- $w := printf "%s=%s" $nl ($ns | toJson) -}}
{{- if $a.selector }}{{- $w = printf "%s,%s" $w $a.selector -}}{{- end -}}
{{- if not (has $a.format (list "vmrule" "prometheusrule")) -}}
{{- fail (printf "sluis: alerts.format is `vmrule` or `prometheusrule`, not %q." $a.format) -}}
{{- end -}}
{{- $name := default (printf "%s-alerts" (include "sluis.fullname" .)) $a.name -}}
{{- $any := false -}}
{{- range $k, $v := $r }}{{- if $v.enabled }}{{- $any = true -}}{{- end }}{{- end -}}
{{- if not $any -}}
{{- fail "sluis: alerts.rules has every rule disabled, so this release would render an empty rule group, which the rulers refuse. Enable one, or do not install in alerts mode." -}}
{{- end }}
apiVersion: {{ ternary "operator.victoriametrics.com/v1beta1" "monitoring.coreos.com/v1" (eq $a.format "vmrule") }}
kind: {{ ternary "VMRule" "PrometheusRule" (eq $a.format "vmrule") }}
metadata:
  name: {{ $name }}
  namespace: {{ default .Release.Namespace $a.objectNamespace }}
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: alerts
    {{- with $a.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: sluis
      interval: {{ $a.interval }}
      rules:
        {{- if $r.noSigningKey.enabled }}
        {{- $alert := "SluisNoSigningKeyPublished" }}
        # Zero published keys is an issuer that cannot be verified against: the JWKS is
        # empty, so every relying party refuses every token, and a new one cannot be
        # signed. There is no healthy zero. Five minutes rides out a rollout, in which a
        # new replica has read the key file but not yet published the key. A
        # series that is absent (no issuer running) is not this alert's to say.
        - alert: {{ $alert }}
          expr: >-
            {{- printf "min by (%s, namespace, algorithm) (sluis_signing_keys_published{%s}) < 1" $c $w | replace ", namespace" (print ", " $nl) | nindent 12 }}
          for: {{ $r.noSigningKey.for }}
          labels:
            {{- include "sluis.ruleLabels" (dict "root" $ "cfg" $r.noSigningKey) | nindent 12 }}
          annotations:
            summary: 'The sluis issuer in {{ printf "{{ $labels.%s }}" $nl }} publishes no {{ "{{ $labels.algorithm }}" }} signing key'
            description: >-
              The issuer's key ring holds no key to publish for this algorithm, so its JWKS
              is empty and no relying party can verify a token. Look at the signing key
              Secret the chart mounts (cert-manager's Certificate, or the existing Secret
              named in signingKey.existingSecret) and the issuer's log for why it could not
              be read.
            {{- include "sluis.runbook" (dict "root" $ "alert" $alert) | nindent 12 }}
        {{- end }}
        {{- if $r.signingKeyRotationStalled.enabled }}
        {{- $alert := "SluisSigningKeyRotationStalled" }}
        {{- /*
          The threshold: what the rule says, else derived from how the keys rotate.
          kms-wrapped generates a key pair every `rotateEvery` (24h by default), so
          a healthy active key is at most that old, plus the prepublish delay and a
          late pass: rotateEvery + 2h. Otherwise the keys are cert-manager's
          (350 days, below). The release must carry the same config.signingKey as
          the service's for the derivation, or set maxAgeSeconds.
        */ -}}
        {{- $maxAge := $r.signingKeyRotationStalled.maxAgeSeconds -}}
        {{- if not $maxAge -}}
        {{- $wrapped := include "sluis.wrappedRotateSeconds" $ | int64 -}}
        {{- $maxAge = ternary (add $wrapped 7200) 30240000 (gt $wrapped 0) -}}
        {{- end }}
        # The age of the active key is the time since the first replica saw it become
        # active. With kms-wrapped signing a new key pair is made every `rotateEvery`
        # and the threshold is that plus two hours. cert-manager replaces the certificate `renewBefore` ahead of its end
        # (default 720h before 8760h), so a healthy key is at most about 335 days old and
        # `maxAgeSeconds` allows two weeks more. A key that is older has not been
        # replaced: the Certificate is not renewing, or the issuer is not picking the new
        # key up, and the day the certificate expires every token stops verifying. The
        # newest timestamp across replicas is used, so a lagging replica does not fire it.
        - alert: {{ $alert }}
          expr: >-
            {{- printf "time() - max by (%s, namespace, algorithm) (sluis_signing_key_active_since_timestamp_seconds{%s}) > %d" $c $w ($maxAge | int64) | replace ", namespace" (print ", " $nl) | nindent 12 }}
          for: {{ $r.signingKeyRotationStalled.for }}
          labels:
            {{- include "sluis.ruleLabels" (dict "root" $ "cfg" $r.signingKeyRotationStalled) | nindent 12 }}
          annotations:
            summary: 'The {{ "{{ $labels.algorithm }}" }} signing key in {{ printf "{{ $labels.%s }}" $nl }} has been active for {{ "{{ $value | humanizeDuration }}" }}'
            description: >-
              The active signing key is older than {{ $maxAge | int64 }}s
              and has not rotated. With cert-manager keys, check the Certificate for the key
              (kubectl describe certificate), its issuer, and whether the issuer's
              signingKey.pollInterval is reading the mounted file. With kms-wrapped keys,
              check the issuer's log for why it cannot generate or wrap a key pair (the
              pod's AWS role, the KMS key's policy).
            {{- include "sluis.runbook" (dict "root" $ "alert" $alert) | nindent 12 }}
        {{- end }}
        {{- if $r.issuer5xx.enabled }}
        {{- $alert := "SluisIssuer5xx" }}
        # The share of the issuer listener's requests answered 5xx over 10 minutes. A
        # healthy issuer answers none: its refusals are 4xx. A floor of `minErrors` in
        # the window keeps one failed request in a quiet hour from being a page, and the
        # share (5% by default) keeps a handful among thousands from being one either.
        # Every route is counted together: the sign-in and the token endpoint failing are
        # the same outage to the people behind them.
        - alert: {{ $alert }}
          expr: >-
            {{- printf "( sum by (%[1]s, namespace) (increase(sluis_http_requests_total{%[2]s,status_class=\"5xx\"}[10m])) / sum by (%[1]s, namespace) (increase(sluis_http_requests_total{%[2]s}[10m])) ) > %[3]v and sum by (%[1]s, namespace) (increase(sluis_http_requests_total{%[2]s,status_class=\"5xx\"}[10m])) >= %[4]v" $c $w $r.issuer5xx.ratio $r.issuer5xx.minErrors | replace ", namespace" (print ", " $nl) | nindent 12 }}
          for: {{ $r.issuer5xx.for }}
          labels:
            {{- include "sluis.ruleLabels" (dict "root" $ "cfg" $r.issuer5xx) | nindent 12 }}
          annotations:
            summary: 'The sluis issuer in {{ printf "{{ $labels.%s }}" $nl }} answers {{ "{{ $value | humanizePercentage }}" }} of requests with a 5xx'
            description: >-
              More than {{ printf "%.0f%%" (mulf $r.issuer5xx.ratio 100) }} of the requests in the last 10 minutes
              failed on the server side. The dashboard's request panel names the route; the
              issuer's log has the error. A store that is down (see SluisPortErrors)
              and a directory that cannot be reached are the usual causes.
            {{- include "sluis.runbook" (dict "root" $ "alert" $alert) | nindent 12 }}
        {{- end }}
        {{- if $r.tokenLatency.enabled }}
        {{- $alert := "SluisTokenEndpointSlow" }}
        # A token is signed in memory and costs one store write, so the p99 of the token
        # endpoint is milliseconds when healthy. Two seconds is two orders of magnitude
        # over that and still short of the clients' timeouts, which is where a slow
        # issuer starts to look like a down one. Ten minutes of rate smooths a single slow
        # request; the quantile over `le` buckets of every replica together is the one a
        # client sees.
        - alert: {{ $alert }}
          expr: >-
            {{- printf "histogram_quantile(0.99, sum by (%s, namespace, le) (rate(sluis_http_request_duration_seconds_bucket{%s,route=\"token\"}[10m]))) > %v" $c $w $r.tokenLatency.thresholdSeconds | replace ", namespace" (print ", " $nl) | nindent 12 }}
          for: {{ $r.tokenLatency.for }}
          labels:
            {{- include "sluis.ruleLabels" (dict "root" $ "cfg" $r.tokenLatency) | nindent 12 }}
          annotations:
            summary: 'The sluis token endpoint in {{ printf "{{ $labels.%s }}" $nl }} has a p99 of {{ "{{ $value | humanizeDuration }}" }}'
            description: >-
              Token requests are taking longer than {{ $r.tokenLatency.thresholdSeconds }}s at the
              99th percentile. The store (see the port latency panel), the policy's size and
              the directory are what a token waits on.
            {{- include "sluis.runbook" (dict "root" $ "alert" $alert) | nindent 12 }}
        {{- end }}
        {{- if $r.tickFailing.enabled }}
        {{- $alert := "SluisTickFailing" }}
        # A tick that fails once is a console mid-rollout or GitHub having a moment, and
        # the next pass repairs it. The default interval is 15 minutes, so
        # `failures` (3) failed ticks of ONE target within `window` (45m) is three in a
        # row: the target is not being reconciled and the cause is not going away. The
        # counter is per kind and target, because one organisation failing (its App was
        # uninstalled) is not another's outage.
        - alert: {{ $alert }}
          expr: >-
            {{- printf "sum by (%s, namespace, kind, target) (increase(sluis_ticks_total{%s,outcome=\"failed\"}[%s])) >= %v" $c $w $r.tickFailing.window $r.tickFailing.failures | replace ", namespace" (print ", " $nl) | nindent 12 }}
          for: {{ $r.tickFailing.for }}
          labels:
            {{- include "sluis.ruleLabels" (dict "root" $ "cfg" $r.tickFailing) | nindent 12 }}
          annotations:
            summary: 'The {{ "{{ $labels.kind }}" }} of {{ "{{ $labels.target }}" }} has failed {{ "{{ $value | printf \"%.0f\" }}" }} times'
            description: >-
              The controller's tick of this target failed {{ $r.tickFailing.failures }} or more
              times within {{ $r.tickFailing.window }}. Its report (the controller's page in the
              console, and the log's "a pass over an organisation failed" or the Slack
              equivalent) names the error.
            {{- include "sluis.runbook" (dict "root" $ "alert" $alert) | nindent 12 }}
        {{- end }}
        {{- if $r.tickStale.enabled }}
        {{- $alert := "SluisTickStale" }}
        # The time since a live target's last ok tick, from a gauge each ok tick stamps.
        # It catches what a failure counter cannot: a loop that hangs, a lease nobody
        # can take, a controller that runs and never succeeds. One hour is four default
        # intervals (15m), which tolerates three missed passes. A running controller
        # reports the gauge on every export with its last ok stamp, so a live target
        # that stalls keeps a series whose stamp ages. Only a series with a sample in
        # the last `liveWindow` (15m) is read: one that stopped reporting, as a target
        # renamed, removed from the policy or relabelled does, is not a stuck
        # controller, and SluisTickSeriesStale says that instead, as a warning.
        - alert: {{ $alert }}
          expr: >-
            {{- printf "time() - max by (%s, namespace, kind, target) (last_over_time(sluis_tick_last_success_timestamp_seconds{%s}[%s])) > %d" $c $w $r.tickStale.liveWindow ($r.tickStale.maxAgeSeconds | int64) | replace ", namespace" (print ", " $nl) | nindent 12 }}
          for: {{ $r.tickStale.for }}
          labels:
            {{- include "sluis.ruleLabels" (dict "root" $ "cfg" $r.tickStale) | nindent 12 }}
          annotations:
            summary: 'No successful {{ "{{ $labels.kind }}" }} of {{ "{{ $labels.target }}" }} for {{ "{{ $value | humanizeDuration }}" }}'
            description: >-
              This target is still reporting but has not completed a tick for longer than {{ $r.tickStale.maxAgeSeconds | int64 }}s.
              Check that its leases are not held by a runner that is gone (SluisLeaseLost),
              and the controller's log for the failures.
            {{- include "sluis.runbook" (dict "root" $ "alert" $alert) | nindent 12 }}
        {{- end }}
        {{- if $r.tickSeriesStale.enabled }}
        {{- $alert := "SluisTickSeriesStale" }}
        # A target's series that had a sample in the last two hours and has none in the
        # last `tickStale.liveWindow` (15m): nothing exports it any more. The usual
        # cause is a target the policy no longer declares or declares under another
        # name, or a label that changed; the other is a controller gone. It is a
        # warning because the usual cause is a change somebody made, and it leaves the
        # rule by itself two hours after the series' last sample. The two hours are the
        # look-back, so a controller gone for good leaves silence which only
        # `absent(...)` sees, as the health guide says.
        - alert: {{ $alert }}
          expr: >-
            {{- printf "max by (%[1]s, namespace, kind, target) (last_over_time(sluis_tick_last_success_timestamp_seconds{%[2]s}[2h])) unless max by (%[1]s, namespace, kind, target) (last_over_time(sluis_tick_last_success_timestamp_seconds{%[2]s}[%[3]s]))" $c $w $r.tickStale.liveWindow | replace ", namespace" (print ", " $nl) | nindent 12 }}
          for: {{ $r.tickSeriesStale.for }}
          labels:
            {{- include "sluis.ruleLabels" (dict "root" $ "cfg" $r.tickSeriesStale) | nindent 12 }}
          annotations:
            summary: 'The {{ "{{ $labels.kind }}" }} series of {{ "{{ $labels.target }}" }} stopped reporting: probably renamed or removed; check the policy'
            description: >-
              No sample of this target's last-success gauge has arrived for {{ $r.tickStale.liveWindow }}, though one did
              within the last two hours. If the policy renamed or removed the target, or a
              label changed, nothing is wrong and this clears on its own. Otherwise the
              controller is gone: check that its Deployment is running.
            {{- include "sluis.runbook" (dict "root" $ "alert" $alert) | nindent 12 }}
        {{- end }}
        {{- if $r.leaseLost.enabled }}
        {{- $alert := "SluisLeaseLost" }}
        # A lease is lost when another runner takes it over or when it could not be
        # renewed for a whole lifetime; the tick stops before its next write, which is
        # what the lease is for, so one loss is the design working. Repeated losses are
        # two runners fighting over one target, or a State that cannot be reached to
        # renew. `losses` (3) within `window` (1h) separates that from a node being
        # drained.
        - alert: {{ $alert }}
          expr: >-
            {{- printf "sum by (%s, namespace, kind) (increase(sluis_leases_lost_total{%s}[%s])) >= %v" $c $w $r.leaseLost.window $r.leaseLost.losses | replace ", namespace" (print ", " $nl) | nindent 12 }}
          for: {{ $r.leaseLost.for }}
          labels:
            {{- include "sluis.ruleLabels" (dict "root" $ "cfg" $r.leaseLost) | nindent 12 }}
          annotations:
            summary: 'Tick leases of {{ "{{ $labels.kind }}" }} in {{ printf "{{ $labels.%s }}" $nl }} were lost {{ "{{ $value | printf \"%.0f\" }}" }} times'
            description: >-
              Controllers lost their lease on a target {{ $r.leaseLost.losses }} or more times
              within {{ $r.leaseLost.window }}. Look for a second runner (a tick Job beside the
              Deployment, a replica count over one on a State that is not shared) and for
              port errors on the State.
            {{- include "sluis.runbook" (dict "root" $ "alert" $alert) | nindent 12 }}
        {{- end }}
        {{- if $r.cloudflareRotationStale.enabled }}
        {{- $alert := "SluisCloudflareRotationStale" }}
        # The time since a Cloudflare preset's stored credential was minted, against
        # `factor` (2) times that preset's own rotation, both published by the
        # service. The credential lives for `lifetime`, longer than one rotation, so
        # one missed rotation is survived; two in a row means the schedule (the
        # EventBridge rule on Lambda, the loop in a cluster) or Cloudflare is failing
        # and consumers will soon read an expired token. `last_over_time` over a day
        # keeps a stopped preset visible. A preset the service no longer declares fires
        # for at most a day.
        - alert: {{ $alert }}
          expr: >-
            time() - max by ({{ $c }}, {{ $nl }}, preset) (last_over_time(sluis_cloudflare_rotation_last_timestamp_seconds{ {{- $w -}} }[1d]))
            > {{ $r.cloudflareRotationStale.factor }} * max by ({{ $c }}, {{ $nl }}, preset) (last_over_time(sluis_cloudflare_rotation_interval_seconds{ {{- $w -}} }[1d]))
          for: {{ $r.cloudflareRotationStale.for }}
          labels:
            {{- include "sluis.ruleLabels" (dict "root" $ "cfg" $r.cloudflareRotationStale) | nindent 12 }}
          annotations:
            summary: 'The Cloudflare credential of preset {{ "{{ $labels.preset }}" }} was last rotated {{ "{{ $value | humanizeDuration }}" }} ago, past its allowance'
            description: >-
              The stored credential of this preset is older than {{ $r.cloudflareRotationStale.factor }} times
              its rotation. Look at the log for "a Cloudflare token was not minted" (its
              reason says whether the prototype was refused, the minter credential is
              missing or Cloudflare answered an error), at the scheduled invocation on
              Lambda, and at the preset's prototype in Cloudflare.
            {{- include "sluis.runbook" (dict "root" $ "alert" $alert) | nindent 12 }}
        {{- end }}
        {{- if $r.rateLimitLow.enabled }}
        {{- $alert := "SluisGitHubRateLimitLow" }}
        # GitHub's budget left, as last reported on a response. An App's core budget is
        # thousands of requests an hour, and the controller waits out a limit itself, so
        # a low reading is not an outage; sustained is. Under `remaining` (100) for
        # thirty minutes means the budget is being spent as fast as it refills and the
        # next pass will be made to wait or be refused. The reading is of the last
        # response, so a quiet controller keeps its last value: a pass runs every
        # interval, which is what keeps it fresh.
        - alert: {{ $alert }}
          expr: >-
            min by ({{ $c }}, {{ $nl }}, resource) (github_roster_rate_limit_remaining{ {{- $w -}} }) < {{ $r.rateLimitLow.remaining }}
          for: {{ $r.rateLimitLow.for }}
          labels:
            {{- include "sluis.ruleLabels" (dict "root" $ "cfg" $r.rateLimitLow) | nindent 12 }}
          annotations:
            summary: 'GitHub rate limit ({{ "{{ $labels.resource }}" }}) is down to {{ "{{ $value | printf \"%.0f\" }}" }} requests'
            description: >-
              The GitHub budget for this resource has been under {{ $r.rateLimitLow.remaining }}
              requests for {{ $r.rateLimitLow.for }}. github_roster_rate_limited_total says how
              often a call already waited. Lengthen the controller's interval, or look for
              a caller spending the App's budget outside this controller.
            {{- include "sluis.runbook" (dict "root" $ "alert" $alert) | nindent 12 }}
        {{- end }}
        {{- if $r.seatsShort.enabled }}
        {{- $alert := "SluisSeatsShort" }}
        # The invitations the last pass could not send for want of a free seat. There is
        # no healthy non-zero: each is a person the policy admits who cannot be invited
        # until the organisation buys a seat or removes one. Not a page (the controller is
        # well), but it does not clear on its own, so thirty minutes only keeps a seat
        # that frees up between two passes from alerting.
        - alert: {{ $alert }}
          expr: >-
            max by ({{ $c }}, {{ $nl }}, org) (github_roster_seats_short{ {{- $w -}} }) > 0
          for: {{ $r.seatsShort.for }}
          labels:
            {{- include "sluis.ruleLabels" (dict "root" $ "cfg" $r.seatsShort) | nindent 12 }}
          annotations:
            summary: 'GitHub organisation {{ "{{ $labels.org }}" }} is {{ "{{ $value | printf \"%.0f\" }}" }} seat(s) short'
            description: >-
              The controller could not invite everyone the policy admits to this organisation
              because it has no free seats. Buy seats, or remove members that no longer
              belong, and the next pass sends the invitations.
            {{- include "sluis.runbook" (dict "root" $ "alert" $alert) | nindent 12 }}
        {{- end }}
        {{- if $r.portErrors.enabled }}
        {{- $alert := "SluisPortErrors" }}
        # The share of storage port calls (state, index, blob) that ended `unavailable`
        # or `error` over five minutes. A lost compare-and-swap (`conflict`), a create
        # over a live key (`exists`) and a missing key (`not_found`) are the ports
        # working and are not counted. A healthy store fails none; the sign-in path
        # refuses a request when it is down, so this is the alert that explains the 5xx.
        # `minErrors` keeps a single failed call from being a page.
        - alert: {{ $alert }}
          expr: >-
            {{- printf "( sum by (%[1]s, namespace, port) (increase(sluis_port_operation_duration_seconds_count{%[2]s,outcome=~\"unavailable|error\"}[5m])) / sum by (%[1]s, namespace, port) (increase(sluis_port_operation_duration_seconds_count{%[2]s}[5m])) ) > %[3]v and sum by (%[1]s, namespace, port) (increase(sluis_port_operation_duration_seconds_count{%[2]s,outcome=~\"unavailable|error\"}[5m])) >= %[4]v" $c $w $r.portErrors.ratio $r.portErrors.minErrors | replace ", namespace" (print ", " $nl) | nindent 12 }}
          for: {{ $r.portErrors.for }}
          labels:
            {{- include "sluis.ruleLabels" (dict "root" $ "cfg" $r.portErrors) | nindent 12 }}
          annotations:
            summary: 'The {{ "{{ $labels.port }}" }} store of sluis in {{ printf "{{ $labels.%s }}" $nl }} is failing {{ "{{ $value | humanizePercentage }}" }} of calls'
            description: >-
              More than {{ printf "%.0f%%" (mulf $r.portErrors.ratio 100) }} of the calls to this storage port failed in the
              last 5 minutes. State and index are Valkey (or the namespace's ConfigMaps and
              Secrets); blobs are the reports' ConfigMaps. Check that store's own health and
              the NetworkPolicy to it.
            {{- include "sluis.runbook" (dict "root" $ "alert" $alert) | nindent 12 }}
        {{- end }}
{{- end }}
