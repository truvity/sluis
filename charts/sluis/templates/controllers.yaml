{{- include "sluis.prepare" . -}}
{{- if eq .Values.renders "app" -}}
{{- /* A controller runs in its module's pod, which the Role is bound to; in documents mode the issuer's pod runs what its document names. */}}
{{- $issuer := dict "root" . "module" "issuer" -}}
{{- $github := or (include "sluis.moduleOn" (dict "root" . "module" "github")) (include "sluis.hosts" (merge (dict "kind" "github") $issuer)) -}}
{{- $slack := or (include "sluis.moduleOn" (dict "root" . "module" "slack")) (include "sluis.hosts" (merge (dict "kind" "slack") $issuer)) -}}
{{- if or $github $slack }}
---
# What the controllers in this process may do to the cluster, bound to the
# accounts of the pods that run them (the github and slack modules'). Update, by name,
# the ConfigMaps they report into, and the one Secret people's linked GitHub
# accounts are kept in: each link's token pair rotates every time it is renewed,
# and the renewed pair has to be written back. The service creates those
# objects -- `create` cannot be narrowed to a name -- so this grants no create,
# and in particular no ConfigMap that would read to the service as a workspace
# record. The Secrets with the Apps' keys and the ConfigMaps with the console's
# records are mounted volumes, so no other Secret or ConfigMap is readable, and
# watching them for a change (an install, a Refresh) needs no permission either.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sluis.fullname" . }}-controllers
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      {{- if $github }}
      - {{ printf "%s-github-status" (include "sluis.fullname" .) | quote }}
      {{- end }}
      {{- if $slack }}
      - {{ printf "%s-slack-status" (include "sluis.fullname" .) | quote }}
      {{- end }}
    verbs: ["get", "update", "patch"]
  {{- if $github }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-github-links" (include "sluis.fullname" .) | quote }}]
    verbs: ["get", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sluis.fullname" . }}-controllers
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sluis.fullname" . }}-controllers
subjects:
  {{- $accounts := list }}
  {{- range $kind := list "github" "slack" }}
  {{- $host := ternary $kind "issuer" (include "sluis.moduleOn" (dict "root" $ "module" $kind) | ne "" ) }}
  {{- if or (include "sluis.moduleOn" (dict "root" $ "module" $kind)) (include "sluis.hosts" (dict "root" $ "module" "issuer" "kind" $kind)) }}
  {{- $account := include "sluis.moduleAccountName" (dict "root" $ "module" $host) }}
  {{- if not (has $account $accounts) }}
  {{- $accounts = append $accounts $account }}
  - kind: ServiceAccount
    name: {{ $account }}
    namespace: {{ $.Release.Namespace }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
{{ end -}}
