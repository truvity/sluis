{{- include "sluis.prepare" . -}}
{{- if eq .Values.renders "app" -}}
{{- /* With `documents.service` the document is rendered verbatim: no apiVersion added, nothing renamed or dropped. */ -}}
# What `sluis serve --config` reads: `config`, as the values give it, with
# nothing added, renamed or dropped but the apiVersion the chart writes. The
# binary validates it against schemas/config/sluis.schema.json at start, and
# values.schema.json holds the values to the same schema before this renders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sluis.fullname" . }}-config
  labels:
    {{- include "sluis.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
data:
  config.yaml: |
    {{- if include "sluis.documentsMode" . }}
    {{- .Values.documents.service | trimSuffix "\n" | nindent 4 }}
    {{- else }}
    {{- include "sluis.document" (dict "kind" "sluis" "doc" .Values.config) | nindent 4 }}
    {{- end }}
{{ end -}}
