apiVersion: v2
name: sluis
description: >-
  sluis in one chart and one image: the token service (`serve`),
  which verifies proofs produced elsewhere, applies the shared policy and
  issues tokens, and runs the GitHub and Slack controllers in the same
  process. It authenticates nobody itself and holds no user records. See docs/concepts/sluis/design.md.
type: application
