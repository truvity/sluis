apiVersion: v2
name: sluis
description: >-
  sluis in one chart and one image: the token service (`serve`),
  which verifies proofs produced elsewhere, applies the shared policy and
  issues tokens, and the GitHub and Slack controllers (`controller github`,
  `controller slack`). It authenticates nobody itself and holds no user
  records. See docs/design/sluis.md.
type: application
# Placeholder. The git tag is the sole version authority — the release
