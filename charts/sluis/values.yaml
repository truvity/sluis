# sluis — the token service and its controllers: one image, one chart, one
# process.
#
# What this chart renders: ONE Deployment (`sluis serve`), a Service, a
# ServiceAccount with the one cluster-scoped permission the exchange needs, a
# NetworkPolicy, the service document and the policy document as ConfigMaps,
# the Gateway API route for its host, and the cert-manager Certificate that
# produces its signing key. The GitHub and Slack controllers run in that same
# process, each in a loop of its own, when `config.controllers.github` and
# `config.controllers.slack` name them.
#
# What it expects to exist: a directory hub to ask about people, and an
# issuer for that Certificate. The signing key is deliberately not this
# service's to create — see `signingKey` below.

replicaCount: 2

# Names. Both are empty for a new installation. An installation moving from
# the access-issuer chart sets them to what it had, so that no object is
# renamed and no Deployment selector (which is immutable) changes:
#   nameOverride: access-issuer
#   fullnameOverride: <the release's old full name>
# `fullnameOverride` is also the value `config.release` must carry.
nameOverride: ""
fullnameOverride: ""

# What this release renders.
#
#   app         the service, with the controllers its config names (the
#               default).
#   alerts      ONLY the alert rules (`alerts`), as a VMRule or a
#               PrometheusRule. Nothing else is rendered and nothing else is
#               validated: install it a second time, where the metrics
#               store's ruler looks for rule objects, beside the release that
#               runs the service.
#   dashboards  ONLY the Grafana dashboard ConfigMaps (`dashboards`), for the
#               cluster Grafana runs on.
#
# Not to be confused with `route` (the Gateway API route), `exchange.clusters`
# (workloads' home clusters) or `config.controllers` (which controllers run):
# this chooses which of three kinds of object this release is. The signals the rules and the dashboard read, and the install, are in
# docs/reference/telemetry.md.
renders: app

# Alert rules, rendered only with `renders: alerts`. Every threshold and the
# reason for it is in docs/reference/telemetry.md and in the rule's comment in
# templates/alerts.yaml. The series are what the service and the controllers
# publish over OTLP (OTEL_EXPORTER_OTLP_ENDPOINT on the pods), named as the
# metrics gateway names them.
alerts:
  # The object's name. Empty: <release>-alerts.
  name: ""
  # Where the rule object goes: the namespace the ruler selects rules from.
  # Empty: the release's.
  objectNamespace: ""
  # `vmrule` (operator.victoriametrics.com) or `prometheusrule`.
  format: vmrule
  # Labels on the rule object, for a ruler that selects objects by label.
  labels: {}
  # Labels added to EVERY rule, for the Alertmanager routing tree: set the
  # cluster once here.
  #   ruleLabels:
  #     k8s_cluster_name: prod
  ruleLabels: {}
  interval: 1m
  # The label that names the cluster on a store that holds several. Every
  # aggregation keeps it.
  clusterLabel: k8s_cluster_name
  # The namespace sluis runs in, whose series the rules read. Empty:
  # the release's namespace. In an alerts-only release in another namespace,
  # set it.
  namespace: ""
  # Extra matchers for every series, e.g. `k8s_cluster_name="prod"`.
  selector: ""
  # Where an alert's runbook entry is. The alert's name, lower-cased, is the
  # anchor. Empty renders no link.
  runbookBaseUrl: https://github.com/truvity/sluis/blob/master/docs/reference/telemetry.md
  rules:
    noSigningKey:
      enabled: true
      severity: critical
      for: 5m
      labels: {}
    signingKeyRotationStalled:
      enabled: true
      severity: warning
      # The age, in seconds, past which the active key has not rotated. Unset,
      # it follows how the keys rotate:
      #  - kms-wrapped signing (`config.signingKey.kmsWrapped`, or
      #    `adapters.signing`) makes a key pair every `rotateEvery` (24h by
      #    default), so the threshold is that plus two hours: 26h for 24h. An
      #    alerts-only release needs the same `config.signingKey` for this;
      #  - otherwise 350 days. The default certificate lives 8760h (365d) and
      #    cert-manager replaces it 720h (30d) before the end, so a healthy key
      #    is at most about 335 days old; 350 tolerates two weeks of a late
      #    renewal and fires while the old key still has days to run. Set it to
      #    (duration - renewBefore) + 14d if you changed either, or disable the
      #    rule when `signingKey.existingSecret` is rotated by hand.
      # maxAgeSeconds: 30240000
      for: 1h
      labels: {}
    issuer5xx:
      enabled: true
      severity: critical
      # The share of the listener's requests that were answered 5xx over
      # 10m, and the fewest 5xx that count: one error in a quiet hour is not
      # a page.
      ratio: 0.05
      minErrors: 5
      for: 10m
      labels: {}
    tokenLatency:
      enabled: true
      severity: warning
      # p99 of the token endpoint, over 10m. A token is signed in memory and
      # one store write: milliseconds when healthy.
      thresholdSeconds: 2
      for: 15m
      labels: {}
    tickFailing:
      enabled: true
      severity: warning
      # This many failed ticks of one target within `window`. The default
      # interval is 15m, so 3 in 45m is three in a row.
      failures: 3
      window: 45m
      for: 0m
      labels: {}
    tickStale:
      enabled: true
      severity: critical
      # No ok tick of a target for this long: 1h is four default intervals
      # (15m), which tolerates three missed passes.
      maxAgeSeconds: 3600
      for: 10m
      labels: {}
    leaseLost:
      enabled: true
      severity: warning
      # A lease lost this many times in `window` by one kind of target.
      losses: 3
      window: 1h
      for: 0m
      labels: {}
    cloudflareRotationStale:
      enabled: true
      severity: critical
      # The stored credential of a Cloudflare preset is older than this many
      # of its own `rotation`s: the schedule is not rotating it, and the
      # credential consumers read expires within `lifetime`.
      factor: 2
      for: 5m
      labels: {}
    rateLimitLow:
      enabled: true
      severity: warning
      # GitHub's budget left, per resource. The App's core budget is
      # thousands an hour, so under 100 for 30m is a controller about to be
      # refused, not a quiet hour.
      remaining: 100
      for: 30m
      labels: {}
    seatsShort:
      enabled: true
      severity: warning
      for: 30m
      labels: {}
    portErrors:
      enabled: true
      severity: critical
      # The share of storage port calls that failed (store unavailable or
      # another error: not a lost compare-and-swap, not a missing key) over
      # 5m, and the fewest failures that count.
      ratio: 0.05
      minErrors: 5
      for: 10m
      labels: {}

# Grafana dashboards, rendered only with `renders: dashboards`: one ConfigMap
# per file in dashboards/, labelled for Grafana's sidecar. Install it into the
# cluster Grafana runs on.
dashboards:
  # Grafana's namespace. Empty: the release's.
  namespace: ""
  # The Grafana folder, when the sidecar is set to read the folder annotation.
  folder: Access
  # The label Grafana's sidecar selects ConfigMaps by (its
  # `sidecar.dashboards.label`, and `labelValue`).
  sidecarLabel: grafana_dashboard
  sidecarLabelValue: "1"
  labels: {}

image:
  # The one image, and the one command the Deployment runs: `sluis serve`.
  repository: ghcr.io/truvity/sluis/sluis
  # Empty uses the chart's appVersion, which the release stamps from the
  # git tag. Pin it here only to run something other than the chart's own
  # release.
  tag: ""
  pullPolicy: IfNotPresent

# The service document: the file `sluis serve --config` reads, rendered as it
# stands into a ConfigMap and mounted. It is the one document of the one
# process (apiVersion sluis.truvity.github.io/sluis/v3): the issuer, the console
# and the directory hub at the top level, and the GitHub and Slack controllers
# under `controllers`. Everything the service decides is here and nothing is rendered into it: what you write is
# what the binary is given, and `values.schema.json` holds it to the same
# schema the binary validates it against (schemas/config/sluis.schema.json),
# so a misspelt or misplaced key fails `helm install` and not a container.
# docs/reference/configuration.md describes every key.
#
# Platform concerns are values, below: images, replicas, the signing key's
# Certificate, the route, the files the chart renders from `policy`,
# `exchange`, `directory.workspaces`, `githubApps` and `slackApps`. The
# config names those files by path, and the chart refuses a path that is not
# where it mounts them.
#
# Secrets are never here. A key ending in `Secret` names a secret
# (`valkey/password`), which `secrets` (below) delivers as a file under
# `config.secrets.root`, and a confidential client's is
# `clients/<client-id>/secret`, projected from the Secret its policy entry
# names.
#
# `issuerURL` is baked into every token this service signs and into every
# relying party's trust, so it must be stable for the life of the
# installation, and there is no default: set it.
config:
  # issuerURL: https://access.example
  #
  # The name this installation's objects carry. It must be this release's
  # full name (`sluis` when the release is called that, which is
  # the default; `fullnameOverride` when that is set); the chart refuses
  # anything else and says what to write.
  # release: sluis
  #
  # Where what an operator connected is kept: the workspaces and their
  # credentials, the memberships, the OAuth client, the session key, as
  # ConfigMaps and Secrets in this namespace. `memory` makes a restart a
  # fresh installation, which is right for a laptop and nothing else.
  store: kubernetes
  listen:
    # OIDC, the exchange, and this service's own pages.
    address: ":8080"
  probes:
    # liveness/readiness only.
    address: ":7070"
  # How the secrets the config names are delivered: as files the chart
  # projects (`secrets` below, and each confidential client's Secret), read on
  # every use, so a rotated Secret takes effect without a restart.
  secrets:
    source: file
    root: /var/run/sluis/secrets
  # The policy document the chart renders (`policy`, beside `exchange`,
  # `githubApps.catalogue` and `slackApps`) and mounts. Change the path and
  # the chart refuses until the mount agrees.
  policy:
    file: /var/run/access-issuer/policy/policy.yaml
  # `file` is where the chart mounts the cert-manager key. With KMS signing
  # there is no file, and the chart refuses one: drop the default with a null
  # and name the keys,
  #
  #   signingKey:
  #     file: null
  #     kmsWrapped:
  #       keyId: alias/sluis-signing
  #       region: eu-west-1
  #       stateSecret: signing/state   # a name in `secrets`
  #       rotateEvery: 24h
  #
  # and the chart then renders no Certificate and mounts no signing Secret.
  signingKey:
    file: /var/run/access-issuer/signing-key/tls.key
    pollInterval: 30s
    activationDelay: 15m
  lifetimes:
    token: 1h
    refresh: 12h
    absolute: 24h
    hold: 4h
  # The way in when no directory can vouch for anybody: a token for this
  # ServiceAccount, proven against the cluster. The chart creates the
  # account and nobody is bound to it.
  inCluster: true
  recovery:
    enabled: true
    serviceAccount: access-issuer-recovery
    audience: access-issuer-recovery
  audit:
    # The projected token the chart mounts when `audit.writer` is set.
    tokenFile: /var/run/audit/token
  # Everything else the schema has is unset, which is the binary's default.
  # The commonest, as an example:
  #
  #   # The controllers that run in this process. Each is off unless named; a
  #   # section may be left empty (`github: {}`) for the defaults, which are the
  #   # paths the chart mounts. `consoleURL` is where the controller reads the
  #   # console: this release's own Service,
  #   # http://<full name>.<namespace>.svc:<port><console.mount>, which the
  #   # chart requires and prints when it is wrong. A controller reads the
  #   # console as a workload with this pod's ServiceAccount token: the
  #   # policy's exchange must name this cluster and put the account in
  #   # `all:access-roster:viewer`. What a controller CHANGES is the policy
  #   # document's `controllers.<kind>.enabledOrgs` / `enabledWorkspaces`.
  #   # More than one replica needs the tick leases in a shared State
  #   # (`ports.adapter: dynamodb`); the chart refuses it otherwise.
  #   controllers:
  #     github:
  #       consoleURL: http://sluis.access.svc:8080/console
  #       interval: 15m
  #     slack:
  #       consoleURL: http://sluis.access.svc:8080/console
  #
  #   # DEPRECATED in v1.74.0, removed in v1.75 (as is `ports.adapter: legacy`): migrate with `sluis migrate`.
  #   valkey:
  #     address: valkey.example.svc:6379
  #     passwordSecret: valkey/password                       # with `secrets`
  #   directory:
  #     workspaces:                                           # each key with `secrets`
  #       - backend: google
  #         admin: admin@example.com
  #         keySecret: directory/example/key
  #
  # The chart writes the apiVersion of every document it renders
  # (sluis.truvity.github.io/sluis/v3, .../policy/v2), so
  # neither `config` nor `policy` carries one. Whose CI tokens are verified
  # (`policy.exchange.github.owners`), the runner tiers
  # (`policy.apps.github.runnerTiers`) are the policy document's.

# The secrets the config names, each one key of a Secret projected as the
# file <config.secrets.root>/<name>: `valkey.passwordSecret`,
# `oauthClient.provider`'s providers/google/<provider>/client-id and
# client-secret, `recovery.passwordSecret`, `signingKey.kms.stateSecret`, a
# declared workspace's `keySecret`. A confidential client's secret is
# projected from the Secret its policy entry names, without an entry here (values
# mode); in documents mode (`documents.service`) a client's `secret` is a name, so
# declare each `clients/<id>/secret` here too, and set `secrets.source: file`.
#
#   secrets:
#     - name: valkey/password
#       secretName: valkey
#       key: password
secrets: []

# Environment variables from Secrets' keys, for a config whose
# `secrets.source` is `env` (SLUIS_SECRET_<NAME>).
#
#   secretEnv:
#     - name: SLUIS_SECRET_VALKEY_PASSWORD
#       secretName: valkey
#       key: password
secretEnv: []

# Telemetry is the OpenTelemetry SDK's own environment (ADR 0006), never the
# config file (ADR 0032). With `otlp.endpoint` set, every pod of `renders: app`
# gets OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_PROTOCOL and an
# OTEL_SERVICE_NAME of `access-issuer` (the one process's name: the controllers
# report under it), then each `extraEnv` entry. Unset, nothing is
# rendered and the pods export nothing. How to wire it: docs/reference/telemetry.md.
telemetry:
  otlp:
    # The collector or metrics gateway, an http(s) URL, e.g.
    # http://<gateway>.<namespace>.svc:4318. Empty: no export.
    endpoint: ""
    # `http/protobuf` (the estate's convention), `http/json` or `grpc`.
    protocol: http/protobuf
    # Any other OTEL_* variable, e.g. OTEL_TRACES_SAMPLER. Names must start
    # with OTEL_; the endpoint has its own value above.
    extraEnv: {}

# Secrets mounted read-only as directories, for a file the config names by
# path. Each key of the Secret is a file under `mountPath`.
#
#   secretMounts:
#     - secretName: google-oauth-client
#       mountPath: /var/run/access-issuer/oauth-client
secretMounts: []

# The corporate directories this service reads. How they are kept current
# (`freshness`), whether the console offers a sign-in of its own
# (`login.directory`) and where what an operator connected lives (`store`)
# are the config's.
#
# It reads them ITSELF. There is no second deployment to ask:
# the answer about a person is a function call, so a login makes no
# network call except to the corporate directory. What that buys is not
# only a hop — it is the end of a class of failure where two services
# disagreed about the same person.
directory: {}
  # THESE OBJECTS ARE A PROJECTION, NOT A LIVE SOURCE. Writing a new value
  # into one does not rotate anything on a running pod, and nothing here
  # watches them. Which ones need a restart differs, so the rule is per
  # object rather than general:
  #
  #   workspace-credentials  RESTART. The credential is read once, when a
  #                          replica first opens that workspace -- at
  #                          start, or at the console's connect ceremony.
  #                          After that the open reader is held in memory
  #                          and the Secret is never read again. The only
  #                          thing that drops a reader is DISCONNECTING
  #                          the workspace, which also revokes the
  #                          credential and deletes the snapshot: that is
  #                          removal, not rotation.
  #   session-key            RESTART. Read once while the stores are
  #                          wired. Deleting it is the documented "sign
  #                          everyone out" lever, and it takes effect on
  #                          the restart, not on the delete.
  #   github-links (App)     NO RESTART. The record and its credential are
  #                          read from the API on every use, so a rotated
  #                          value is picked up by the next request.
  #
  # The silence is the hazard: a rotation that has not taken effect looks
  # exactly like one that has, until a restart hours or weeks later picks
  # up the new value -- or, if the written value was wrong, takes the
  # directory down at a moment nobody connects to the change. Measured on
  # 2026-09-21: a deliberately corrupted credential went unnoticed for 14
  # minutes of normal operation, probes and a successful directory read
  # included, and would have gone unnoticed indefinitely.
  #
  # TO ROTATE a workspace credential or the session key: write the value,
  # then restart the Deployment, then confirm from the logs that the new
  # value was read ("opened a workspace this replica had not seen" for a
  # workspace). RESTORING FROM A BACKUP IS A ROTATION and needs the same
  # restart -- writing the good value back is not enough on its own.

  # A SECOND COPY OF THE WORKSPACE CREDENTIAL, for recovery. Off unless
  # written out. DEPRECATED, with every `push` below: it needs
  # `config.store: kubernetes`. On a State adapter there is no second copy to
  # make: backup and restore are whole-installation (docs/decisions/0041).
  #
  #   push:
  #     secretStore: {name: openbao, kind: ClusterSecretStore}
  #     remoteKey: infra/access-issuer-workspace
  #
  # WHY THIS EXISTS. With `store: kubernetes` the credential an operator
  # connected lives in exactly one place: a Secret this service writes
  # during the connect ceremony. Every other secret an installation runs on
  # arrives FROM somewhere and can be re-delivered; this one has no
  # upstream. Delete the Secret -- a drill, a rebuilt namespace, a
  # mistyped `kubectl delete` -- and the only way back is an operator
  # reconnecting the workspace in a browser.
  #
  # IT CANNOT BE AN ExternalSecret INSTEAD, and that is the whole reason
  # this is a push. The service is the writer. Pulling the credential from
  # a store would let the store overwrite a freshly connected workspace
  # with a stale copy: a backup that corrupts the thing it backs up.
  #
  # BE HONEST ABOUT WHAT IT PROTECTS. It protects the COPY, not the
  # credential. If Google revokes the key, what is in the store is equally
  # dead and an operator needs a new one from Google either way. This is
  # for losing the Secret while the credential is still good.
  #
  # And what it writes IS the credential -- a second durable copy of a key
  # that can read the directory, rotated as one, and the store that holds
  # it is in its blast radius. Name a store the installation already trusts
  # with material of that weight.
  #
  # The whole Secret goes, bundled under one remote key, because the key
  # name inside it is `<workspace-id>.json` and a reconnect mints a new id.
  # A per-key mapping would stop matching silently and the copy would go
  # stale while still reporting healthy.
  # (absent by default — the block above is the shape)
  #
  # The workspaces a deployment declares are the config's
  # (`config.directory.workspaces`), each key file mounted with
  # `secretMounts`.

# The key this service signs tokens with.
#
# It is provisioned, never minted here: a service that creates its own
# credential is an exception to how every other credential in this estate
# is provisioned, and it would put the rotation of the most sensitive key
# we hold outside the machinery that rotates everything else. It also has
# to be the same key in every replica — two replicas with two keys hand
# out tokens half the fleet cannot verify.
#
# Either let cert-manager issue one (the default: it generates in the
# cluster, rotates on its own schedule, and the key never leaves), or
# point `existingSecret` at one external-secrets delivers. Or have AWS KMS
# hold the keys (`config.signingKey.kmsWrapped`): then none of this applies, the
# chart renders no Certificate and mounts no key, and the chart refuses the
# values below that are for a key it would mount.
signingKey:
  # Name a Secret that already holds the key, and no Certificate is
  # rendered. It must carry a PEM private key under `key`: RSA, or ECDSA
  # on P-256, P-384 or P-521.
  existingSecret: ""
  key: tls.key
  certificate:
    # cert-manager Issuer or ClusterIssuer that produces the key. A
    # self-signed issuer is the usual answer: the certificate is a
    # by-product and only the key is used.
    issuerName: selfsigned
    issuerKind: ClusterIssuer
    # What the issuer signs with follows from the key and is not
    # configured beside it: RSA signs RS256, P-256 ES256, P-384 ES384,
    # P-521 ES512. It is what `id_token_signing_alg_values_supported`
    # advertises, so every relying party has to accept it -- RS256 is the
    # one every client understands, and is the answer for an installation
    # with a verifier it does not control.
    #
    # Sizes are per algorithm: ECDSA takes 256, 384 or 521; RSA takes
    # 2048, 3072 or 4096. The chart refuses a combination cert-manager
    # would not issue.
    algorithm: ECDSA
    size: 384
    # PKCS8 encodes either kind; PKCS1 encodes only RSA.
    encoding: PKCS8
    # How long before expiry cert-manager replaces it, which is a new key
    # every time (`rotationPolicy: Always` above). This only decides HOW
    # OFTEN a rotation happens; it does not by itself keep the old key
    # verifying afterwards — that is `rotation.overlap` below, which is
    # the setting that actually has to be kept longer than `lifetimes.token`.
    renewBefore: 720h
    duration: 8760h
  # Every OTHER algorithm this installation signs with AT THE SAME TIME as
  # the default key above -- see reference/policy.md's "Signing algorithm
  # per audience". The issuer picks which key signs a given token by the
  # AUDIENCE (a client's or a resource's `signing_alg`, in the policy),
  # never by rotating the installation's one key; a client naming an
  # algorithm not listed here (or above) is refused at start.
  #
  # Each entry renders its own cert-manager Certificate and Secret,
  # mounted at its own path, on its own rotation track in the issuer:
  # renewing one never disturbs another's schedule, including the default
  # key's. Two entries signing the SAME algorithm (an RSA and another RSA,
  # or two P-384 ECDSA keys) are refused -- a key ring can publish only
  # one key per algorithm.
  #
  # Empty is every deployment before this existed: one key, the default
  # above, signing everything.
  additional: []
  # PUBLIC keys published in the JWKS and never signed with, so the tokens an
  # earlier signer issued keep verifying until they expire: the overlap of a
  # cutover from cert-manager file keys to `config.signingKey.kmsWrapped`. Each is
  # mounted from a ConfigMap (a public key is not a secret) at
  # /var/run/access-issuer/verify-keys/<index>.pem, and the config says it, with
  # the `kid` the old tokens carry (unset: the key's RFC 7638 thumbprint, which
  # is what a file signer derived), its `alg` and the `until` after which it is no
  # longer published:
  #
  #   config:
  #     signingKey:
  #       verifyOnly:
  #         - {file: /var/run/access-issuer/verify-keys/0.pem, until: "2026-11-05T00:00:00Z"}
  #         - {file: /var/run/access-issuer/verify-keys/1.pem, until: "2026-11-05T00:00:00Z"}
  #   signingKey:
  #     verifyOnly:
  #       - pem: |        # the old ES384 public key
  #       - pem: |        # the old RS256 public key
  #
  # A private key stops the start (and the render).
  verifyOnly: []
  # - algorithm: RSA
  #   size: 2048
  #   # PKCS1 or PKCS8; RS256 verifies either way.
  #   encoding: PKCS1
  #   issuerName: selfsigned
  #   issuerKind: ClusterIssuer
  #   renewBefore: 720h
  #   duration: 8760h
  # Live rotation (how often the mounted file is re-read, how long a new key
  # is published before this replica signs with it, how long a superseded
  # key stays published) is the config's: `config.signingKey.pollInterval`,
  # `activationDelay` and `overlap`. The file is `config.signingKey.file`,
  # and the chart refuses one that is not where it mounts `key`.

exchange:
  # The audience a ServiceAccount token must be minted for is the config's
  # (`config.exchange.audience`; unset is the release name).
  #
  # Each list below is rendered into the policy document's `exchange`
  # (exchange.clusters, exchange.aws), which every process reads. Write them
  # here or in `policy.exchange`, not both.

  # The clusters whose workloads may exchange, each verified against the
  # key set that cluster publishes for its own ServiceAccount tokens.
  #
  # This is what makes ONE issuer serve MANY clusters. The other way to
  # check such a token is a TokenReview, which means asking the cluster —
  # and asking means holding a kubeconfig for every one of them, inside
  # the service whose whole point is to hold almost no credential. A key
  # set is public: EKS publishes one per cluster (it is what IRSA rests
  # on) and Talos serves the same keys at the API server's
  # `/openid/v1/jwks`. So there is no secret in any of these rows, and
  # this issuer needs no access to any cluster, including the one it runs
  # in — which is a row here like any other, because a special case is a
  # second code path only one installation exercises.
  #
  # What is given up is TokenReview's deletion check: a token stays valid
  # until it expires even if the ServiceAccount is deleted. Bound tokens
  # are short-lived, so the window is minutes. Recovery deliberately
  # keeps TokenReview — on the day everything else is broken it should
  # depend on nothing but the API server.
  clusters: []
  #  - name: prod            # the estate's own word for it, and what a
  #                          # `workload` matcher names. Renaming a row
  #                          # changes every rule about that cluster.
  #    issuer: https://oidc.eks.eu-central-1.amazonaws.com/id/EXAMPLE
  #    # Where its public keys are. Omitted, it is discovered from the
  #    # issuer, which works wherever the cluster publishes a discovery
  #    # document at an address this service can reach.
  #    jwksUri: ""

  # AWS accounts whose IAM roles may exchange the token AWS gives them
  # (`sts:GetWebIdentityToken`, outbound identity federation), each
  # verified against the key set its own account issuer publishes.
  #
  # Like `clusters`, no secret in any row. UNLIKE any default anywhere
  # else, an empty list verifies no AWS token at all: any AWS account can
  # mint a valid token for a role of its own with any audience, so the
  # row is the trust boundary and the chart will not invent one.
  aws:
    # The audience the role must request from STS. Empty means this
    # issuer's own URL, the same rule as for CI tokens. Ignored while
    # `accounts` is empty.
    audience: ""
    # Refuse a token whose `iat` is older than this, whatever its `exp`
    # allows: AWS lets one live for an hour, and nothing needs that.
    maxAge: 5m
    accounts: []
    #  - account: "111122223333"   # 12 digits; the token's account claim and
    #                              # the account in the role's ARN must match
    #    name: apps                # the estate's word for it, for logs
    #    # From `aws iam get-outbound-web-identity-federation-info`.
    #    issuer: https://example-id.tokens.sts.global.api.aws
    #    jwksUri: ""               # default: <issuer>/.well-known/jwks.json
    #    orgId: ""                 # optional: require this AWS Organizations id
    #    algs: [ES384, RS256]      # default both; narrow, never widen

# The rendered documents (`sluisctl render --installation <file> --out <dir>`,
# docs/reference/sluisctl.md): the service document (`sluis.yaml`, apiVersion
# sluis.truvity.github.io/sluis/v3) and the policy document (`policy.yaml`,
# .../policy/v2) of one installation, as strings. The chart puts each into its
# ConfigMap UNCHANGED and keeps only what is deployment-level (replicas, the
# service account, mounts, probes, routes, alerts). It does not rewrite them: it
# holds them to what it mounts (a path where the chart mounts something, the
# release's full name, the public URLs the route's), and refuses one that
# disagrees, naming the key to change in the INSTALLATION and render again.
#
#   helm upgrade sluis charts/sluis \
#     --set-file documents.service=rendered/sluis.yaml \
#     --set-file documents.policy=rendered/policy.yaml
#
# Set both or neither. With them, `config`, `policy`, `exchange.clusters` and
# `exchange.aws.accounts` are not used (`policy` and the two exchange lists are
# refused, so nothing is said twice). `githubApps` and `slackApps` keep only
# their `push` instructions to External Secrets.
#
# DEPRECATED: the values-mode, `config` and `policy` and the values that fill
# the policy's sections (`exchange`, `githubApps.catalogue`, `slackApps`), still
# works for one minor and is then removed. NOTES.txt says so while it is used.
documents:
  service: ""
  policy: ""

# The policy document (schemas/config/policy.schema.json), without its
# apiVersion, which the chart writes: the access model's tables (groups,
# claims, lifetimes, resources, client_documents, clients, github, people,
# slack, vocabulary; see docs/reference/policy.md) and the decisions beside
# them: `exchange` (whose tokens the exchange trusts), `apps` (runner tiers
# and the App catalogues), `controllers` (what each controller may change)
# and `exports`. The chart adds `exchange.clusters` and `exchange.aws` from
# `exchange`, and the catalogues from `githubApps.catalogue` and `slackApps`.
# One ConfigMap, <release>-policy, mounted as the policy directory by the one
# process: a change rolls it.
#
# A deployment that layers its policy (a directory of files, an access
# document) renders it first, `sluisctl policy render <dir>`, and passes the
# result here.
#
# A confidential client names the Secret holding its secret, under the key
# client-secret:
#
#   policy:
#     clients:
#       my-console:
#         kind: confidential
#         secret: my-console-client   # a Secret in this namespace
#         redirects: [https://console.example/oauth2/callback]
#         requires: [operators]
#         # What the sign-in page calls it. Optional, and PUBLIC: anyone
#         # who starts a sign-in for this client reads both lines.
#         display_name: My console
#         description: Where operators look after the widgets.
#       my-ssh-fleet:
#         kind: public
#         requires: [operators]
#         signing_alg: RS256      # opkssh cannot verify this installation's default
#         # A temporary interop shim for opkssh's own policy parser, which
#         # splits `oidc:groups:<value>` on EVERY `:` -- see
#         # docs/decisions/0015-a-per-audience-groups-delimiter-for-opkssh.md.
#         groups_delimiter: "."
#     controllers:
#       github: {enabledOrgs: [example-org]}
#
# Each one is projected to a file named after the client id, and the
# service resolves a secret by reading that path -- never by holding RBAC
# to read Secrets, which is the same reason the signing key is a file.
policy: {}

# The issuer's hostname on the gateway. Empty renders no route, which is
# right for a hub reached by port-forward while it is being tried.
route:
  host: ""
  # Where a bare GET of this host's root goes. The issuer serves nothing
  # at "/" -- every endpoint it answers is a named one -- so a person who
  # types the domain gets a 404. Where a console shares this host under a
  # path, point this at it ("/console/") and they land somewhere useful.
  # Empty keeps the 404, which is the honest answer for an issuer with no
  # console beside it.
  rootRedirect: ""
  gatewayClassName: internal
  certificate:
    issuerName: internal-ca
    issuerKind: ClusterIssuer
    # The key this certificate is issued for. Empty leaves every field to
    # cert-manager's own defaults, which is an RSA 2048 key. Set it when
    # the issuer will only sign one kind of key: a PKI role pinned to an
    # algorithm refuses the request at issuance, long after the render
    # succeeded, and the listener stays dark with the reason on the
    # CertificateRequest.
    #   algorithm: ECDSA         # RSA | ECDSA
    #   size: 384                # ECDSA 256|384|521, RSA 2048|3072|4096
    #   encoding: PKCS8          # PKCS1 | PKCS8
    #   rotationPolicy: Always   # a renewal over the same key rotates nothing
    privateKey: {}
  # Namespaces, besides this issuer's own, allowed to attach an HTTPRoute
  # to this Gateway.
  #
  # This is the other half of the one-origin console: the
  # directory console shares this issuer's HOSTNAME, so it also has to
  # share this issuer's GATEWAY -- two Gateways declaring a listener for
  # the same route.host collide (Envoy Gateway merges every Gateway of
  # one class into one deployment), they do not coexist as two
  # independent routes. The console's own HTTPRoutes live in the hub
  # chart's namespace, which is why this needs naming at all.
  #
  # Renders allowedRoutes.namespaces as a Selector matching this
  # namespace plus every one named here, rather than the default
  # `from: Same`.
  #
  # NOTE, because it is the thing everyone gets wrong once: this is a
  # GATEWAY-level admission, not a ReferenceGrant. A ReferenceGrant
  # governs a route's backendRefs reaching INTO another namespace; it has
  # nothing to do with a route's parentRefs reaching a Gateway. Whether a
  # Gateway accepts a route from another namespace at all is entirely
  # its own allowedRoutes -- which is what this value renders.
  #
  # Empty keeps `from: Same`, today's shape exactly.
  sharedWith: []
  # Parents for the issuer's routes, written out in full. When set, the
  # chart renders no Gateway and no Certificate: the parent -- typically a
  # platform ListenerSet carrying route.host -- owns the listener and its
  # certificate, and gatewayClassName, certificate and sharedWith have no
  # effect. Write group and kind out; the API server fills them in and a
  # desired/live comparison reads their absence as drift.
  #   - group: gateway.networking.k8s.io
  #     kind: ListenerSet
  #     name: issuer
  #     namespace: gateway-system
  parentRefs: []

networkPolicy:
  enabled: false
  # Namespaces allowed to reach the issuer. Everything with a browser
  # reaches it through the gateway, so this is for in-cluster callers:
  # the proxies verifying tokens and the workloads exchanging them.
  clients: []
  gatewayNamespace: ""

serviceAccount:
  name: ""
  # Annotations on the ServiceAccount. The reason this exists is cloud
  # identity: an admission webhook (EKS Pod Identity, GKE Workload
  # Identity, or the self-hosted amazon-eks-pod-identity-webhook) reads an
  # annotation here and injects the credentials into every pod that uses
  # the account.
  annotations: {}
  # How the pod gets its AWS role, for the AWS adapters (DynamoDB, S3, KMS, SSM).
  # `pod-identity` (EKS Pod Identity) renders nothing here: the association of
  # this ServiceAccount to the role is made outside the chart. `irsa` (IAM roles
  # for service accounts) annotates the account with the role's ARN, `awsRoleArn`,
  # which it then requires.
  awsIdentity: pod-identity
  # awsRoleArn: arn:example:iam::acct:role/sluis

# Runner Apps: the GitHub App a self-hosted runner scale set in one tier
# registers with, one per organisation per tier, created by an operator on
# the console's GitHub page (Apps). The tiers an operator may create one for
# are the policy document's (`policy.apps.github.runnerTiers`, e.g. [preview, stable]);
# empty creates none. The service keeps every App in the Secret
# `<release>-github-runner-apps`, an installed App as three keys named as
# gha-runner-scale-set's githubConfigSecret names them --
# `<tier>.<org>.github_app_id`, `.github_app_installation_id`,
# `.github_app_private_key` -- for the deployment to hand to its runners.
# Nothing here acts with them. Needs `config.store: kubernetes`.

# A catalogue of GitHub Apps, declared as data and created by an operator
# on the console's GitHub page (Apps, then Catalogue) with two clicks each:
# create, then install. The service keeps every App in the Secret
# `<release>-github-catalogue-apps`, an installed App as
# `<id>.github_app_id`, `<id>.github_app_installation_id` and
# `<id>.github_app_private_key` beside `<id>.record.json`. Rendered into the
# policy document's `apps.github.catalogue` (without `push`); a malformed entry
# stops the service. Needs
# `directory.store: kubernetes`. See docs/how-to/connect/github-apps-catalogue.md.
githubApps:
  # Each entry:
  #   - id: renovate               # [a-z0-9-], at most 32, unique; never changes
  #     org: example-org           # the organisation the App is created under
  #     name: example-org-renovate # optional; default <org>-<id>, at most 34
  #     description: Dependency updates
  #     public: false
  #     permissions: {contents: write, pull_requests: write}
  #     events: []                 # optional; delivered only if `webhook` is set
  #     export: false              # true with a `webhook`: consumers read its secret from the exported document
  #     webhook:                   # optional; exactly one of url | kargo, needs events
  #       url: https://argocd.example/api/webhook
  #       # kargo: {base: https://kargo-webhooks.example, receiver: github, project: apps}
  #     installation: selected     # all | selected (default)
  #     grants:                    # who may ask for tokens of it, and for how much
  #       - group: all:platform:engineer
  #         repositories: ["*"]
  #         permissions: {contents: read}
  #     push:                      # optional; off unless written out, see below
  #       secretStore: {name: example-store, kind: SecretStore}
  #       remoteKey: platform/github-apps/iac
  #
  # `push` is DEPRECATED (a State adapter reads the App's `github/v1`
  # document at `external/github/<app>`, docs/decisions/0041). It is the one way a credential leaves this service. External
  # Secrets copies exactly the App's three property keys -- the id, the
  # installation id and the private key, never the whole Secret -- to the
  # store and path the entry names, for a consumer that cannot ask the
  # issuer at the moment it runs: an infrastructure-as-code apply,
  # typically. Off unless an entry carries it, and what it writes is a
  # REAL credential: a second durable copy of the App's key, to be rotated
  # as one. See docs/how-to/connect/infrastructure-as-code.md.
  #
  # A default set an estate can copy -- dependency updates split public
  # from private, a bot that approves and tags, and one App for the
  # program that manages the organisation -- is shipped beside this file
  # as examples/github-apps.yaml, with what each App is for and why they
  # are separate identities.
  catalogue: []

  # A SECOND COPY OF THE APPS THIS SERVICE ACTS AS -- the link App and one
  # per bound organisation, the Secret `<release>-github-apps`. Off unless
  # written out, same shape as `directory.push`:
  #
  #   push:
  #     secretStore: {name: openbao, kind: ClusterSecretStore}
  #     remoteKey: infra/access-issuer-github-apps
  #
  # Distinct from `catalogue[].push` above, which copies ONE catalogue
  # App's three keys to a consumer that must act as that App. This copies
  # the service's OWN identities, and only so they can be restored.
  #
  # Losing them is worse than it sounds: an App cannot be re-created with
  # its old id, so recovery is not "make another one" -- every grant that
  # names the App rebinds, and every installation is re-authorised by hand.
  #
  # Bundled under one remote key, like the workspace credential, because
  # the keys are `_link.json` and `<org>.json`: an organisation bound later
  # adds a key, and a per-key mapping written today would not carry it.
  # (absent by default — the block above is the shape)

# A SECOND COPY OF THE SLACK STATE, for recovery. DEPRECATED with the other
# `push` values: it needs `config.store: kubernetes`. Off unless written out,
# same shape as `directory.push` and `githubApps.push`, with one more key:
#
#   slackState:
#     push:
#       secretStore: {name: openbao, kind: ClusterSecretStore}
#       remoteKey: infra/access-issuer-slack-credentials
#       recordsRemoteKey: infra/access-issuer-slack-records
#
# Two Secrets are copied, each whole and bundled under its own remote key,
# because the key names inside are `<workspace-id>.json` and a reconnect
# mints a new id, so a per-key mapping would go stale while reporting
# healthy:
#
#   `<release>-slack-credentials`  `remoteKey`         every connected
#       workspace's client id and secret, and its bot token once installed
#   `<release>-slack-records`      `recordsRemoteKey`  which workspaces are
#       connected, the Slack Connect channels and the ordinary channels
#       defined on the console
#
# The second is a MIRROR the service keeps, and not a Secret of the
# installation's own: those records live in the ConfigMap
# `<release>-slack-workspaces`, and an External Secrets PushSecret reads
# Secrets only. The mirror holds exactly the ConfigMap's `<workspace>.json`,
# `_shared.<name>.json` and `_channel.<workspace>.<name>.json` entries -- never an operator's confirmation or
# a pass marker, which are transient -- and the service rewrites it in the
# same code path that writes the ConfigMap. If the ConfigMap is lost and
# the mirror is put back, the service repopulates the ConfigMap at start.
# The derived status ConfigMap is not copied: the controller rebuilds it.
#
# Catalogue Slack Apps (`slackApps`) have their own per-entry `push`, which
# copies one App's bot token for a consumer; this is the service's own
# state, and only so it can be restored.
#
# Needs `directory.store: kubernetes`, a store and both keys, and the two
# keys must differ; `deletionPolicy` is fixed at `None`, because the case
# this exists for is the Secret going away. What lands in the store IS the
# credential of every workspace: name a store the installation already
# trusts with material of that weight. See docs/how-to/back-up-and-restore.md.
# (absent by default -- the block above is the shape)
slackState: {}

# A catalogue of Slack Apps, declared as data and created by an operator on
# the console's Slack Apps page: create (with a throwaway app configuration
# token, used once and never stored), then install (an owner of the
# workspace approves in Slack). The service keeps every App in the Secret
# `<release>-slack-catalogue-apps`: `<id>.client_id`, `<id>.client_secret`,
# and, once installed, `<id>.slack_bot_token` beside `<id>.record.json`.
# Rendered into the policy document's `apps.slack.catalogue` (without `push`);
# a malformed entry, or one for a workspace the policy's `slack.workspaces`
# does not name, stops the service. Needs
# `directory.store: kubernetes`. See docs/how-to/connect/slack-apps-catalogue.md.
#
# Each entry:
#   - id: sync                  # [a-z0-9-], at most 32, unique; never changes
#     workspace: acme           # a key of the policy's slack.workspaces
#     name: acme-sync           # optional; default <workspace>-<id>, at most 35
#     description: Channel sync # optional; at most 140
#     botScopes: [channels:read, users:read, users:read.email]
#     push:                     # optional; off unless written out
#       secretStore: {name: example-store, kind: SecretStore}
#       remoteKey: platform/slack-apps/sync
#
# `push` is DEPRECATED (a State adapter reads the App's `slack/v1`
# document at `external/slack/<app>`, docs/decisions/0041). It copies exactly the App's bot token -- one key, never the client
# secret, never the record -- to the store and path the entry names, for a
# program that acts in the workspace as the bot and cannot ask the service
# at the moment it runs. What it writes is a REAL credential: a second
# durable copy of the token, to be rotated as one.
slackApps: []

# THE SESSION KEY IS DELIBERATELY NOT PUSHABLE, and this note is the
# feature.
#
# It is the obvious next candidate -- the service writes it, it is a
# Secret, the machinery is right here -- and copying it would make the
# installation worse. Losing it signs everyone out and the service mints a
# fresh one: correct behaviour, not a failure, and nothing an operator
# must recover. A durable copy buys none of that back and widens what a
# compromise of the store is worth, from reading secrets to forging
# sessions.
#
# So there is no `session.push`. If a later installation asks for one, the
# answer is this paragraph rather than a knob.

# The audit installation this process (the service and its controllers) records to: its
# receiver (`config.audit.writer`), its query service (`queryURL`), the
# client the Audit page's tokens carry (`audience`) and how many proxies sit
# in front (`forwardedForTrustedHops`) are `config`'s. What the
# chart owns is the projected token each presents to the receiver, mounted
# where `config.audit.tokenFile` says (the chart refuses another path).
#
# The service account's projected token is how the installation knows this
# workload: its `workloadIdentity.workloads` must map
# system:serviceaccount:<namespace>:<this release's service account> to the
# source `roster`: the controllers run as that same account.
audit:
  # The projected token presented to the receiver.
  token:
    audience: audit
    expirationSeconds: 3600

# What the chart mounts for the service's OpenBao connection (the `openbao`
# secrets adapter): a CA bundle and a projected token, mounted where the
# config's `caFile` and `auth.tokenFile` must say (the chart refuses another
# path). The key keeps the name it had when the exports used the same mounts.
exports:
  openbao:
    # PEM of the authorities that sign OpenBao's certificate. Empty mounts
    # nothing, and the system's are trusted. Mounted at
    # /var/run/access-issuer/openbao-ca/ca.pem.
    caBundle: ""
    # A ServiceAccount token projected at /var/run/openbao/token, for the
    # `jwt` auth method: its audience is the one the role's `bound_audiences`
    # names. Empty projects nothing, which is what the `kubernetes` method
    # wants (it reads the pod's own token).
    token:
      audience: ""
      expirationSeconds: 3600

resources: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []

# The console that shows this issuer's sessions.
console:
  # Where the console is mounted on this issuer's origin.
  #
  # It is a PATH and not a host because discovery must sit at the root of
  # the origin named in every token's `iss`: the issuer owns "/", and the
  # console takes a path beside it. Same origin is what lets the console's
  # session pages call this issuer with the browser's own cookie and no
  # bearer in JavaScript.
  #
  # This value is also what the console prefixes onto every link it hands
  # a browser, because "/login" resolves against the origin — where the
  # issuer's own page is, not the console's. Empty serves no console.
  mount: /console
  # Which origin may call SessionService (`config.console.origin`) and the
  # client id the console signs people in as (`config.console.client`) are
  # the config's.
