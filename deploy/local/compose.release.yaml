# Generated by tools/gen/compose from the registries (docs/architecture/*.yaml, tools/gen/registry/uids.yaml).
# Do not edit: run `just compose-gen`.
# The local installation from the published images (docs/runtimes/local.md, "Images"): this file goes after compose.yaml
# and replaces the images built from the tree by the images of a release. `SLUIS_LOCAL_IMAGES=release SLUIS_LOCAL_VERSION=<version>
# just local-up` uses it; SLUIS_IMAGE_PREFIX moves the namespace, and SLUIS_RELEASE_IMAGES (the release-images.txt of the release)
# pins every image by digest, through the variable named after it.
name: sluis-local

services:

  adapter-upstream-oidc:
