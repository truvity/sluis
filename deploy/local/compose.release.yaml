    build: !reset null
    entrypoint: ["/usr/libexec/sluis/actors/adapter-upstream-oidc"]
    healthcheck:
      test: ["CMD", "/usr/libexec/sluis/actors/adapter-upstream-oidc", "check", "--boundary", "dev", "--socket", "/run/sluis/adapter-upstream-oidc/dev.sock"]

  drv-indexer-fs:
