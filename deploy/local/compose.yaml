# Generated by tools/gen/compose from the registries (docs/architecture/*.yaml, tools/gen/registry/uids.yaml).
# Do not edit: run `just compose-gen`.
# The local installation (docs/runtimes/local.md): one container per actor and per driver, each as its pinned uid.
# `just local-up` makes the state, builds the images and starts it; the variables it needs are SLUIS_UPSTREAM_TARGET
# (the upstream's host:port, which the repository never names) and SLUIS_LOCAL_PORT (default 8443).
name: sluis-local

services:
