      - audit:/run/sluis/audit/dev:ro
      - run-policy:/run/sluis/policy:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "/sluis", "check", "--boundary", "dev", "--socket", "/run/sluis/adapter-upstream-oidc/dev.sock"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: "on-failure"
    depends_on:
      init: { condition: service_completed_successfully }
