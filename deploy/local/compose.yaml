    network_mode: none
    restart: "no"
    command: ["sh", "/init.sh"]
    volumes:
      - ./init.sh:/init.sh:ro
      - ${SLUIS_LOCAL_SEED:-../../.cache/local/seed}:/seed:ro
      - ../../tests/installations/local/exporter:/exporter-seed:ro
      - audit:/v/audit
      - bootstrap:/v/bootstrap
      - config:/v/config
      - creds-store:/v/creds-store
      - drv-exporter:/v/drv-exporter
      - drv-indexer:/v/drv-indexer
      - drv-store:/v/drv-store
      - drv-writer:/v/drv-writer
      - export-public:/v/export-public
      - exporter-config:/v/exporter-config
      - forwarder-tls:/v/forwarder-tls
      - key-adapter-github:/v/key-adapter-github
      - key-adapter-slack:/v/key-adapter-slack
      - key-adapter-upstream-oidc:/v/key-adapter-upstream-oidc
      - key-ca:/v/key-ca
      - key-console:/v/key-console
      - key-driver:/v/key-driver
      - key-entry:/v/key-entry
      - key-exchange:/v/key-exchange
      - key-exporter:/v/key-exporter
      - key-indexer:/v/key-indexer
      - key-policy:/v/key-policy
      - key-quota:/v/key-quota
      - key-reader:/v/key-reader
      - key-session:/v/key-session
      - key-signer:/v/key-signer
      - key-sluis-node:/v/key-sluis-node
      - key-ssh-ca:/v/key-ssh-ca
      - key-store:/v/key-store
      - key-witness:/v/key-witness
      - key-writer:/v/key-writer
      - rqlite-data:/v/rqlite-data
      - run-adapter-upstream-oidc:/v/run-adapter-upstream-oidc
      - run-entry:/v/run-entry
      - run-exchange:/v/run-exchange
      - run-key:/v/run-key
      - run-policy:/v/run-policy
      - run-reader:/v/run-reader
      - run-session:/v/run-session
      - run-signer:/v/run-signer
      - run-store:/v/run-store
      - state-blob:/v/state-blob
