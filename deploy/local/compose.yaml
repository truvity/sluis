      args:
        BINARY: actors/adapter-upstream-oidc
    command: ["serve", "--boundary", "dev", "--socket", "/run/sluis/adapter-upstream-oidc/dev.sock"]
    user: "61009:61009"
    group_add:
      - "61005"
      - "61012"
      - "61024"
      - "61709"
    network_mode: service:idp-loopback
