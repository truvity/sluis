apiVersion: sluis.truvity.github.io/sluis/v3
adapters:
  audit:
    adapter: sqs
    settings:
      queueURL: https://sqs.eu-central-1.amazonaws.com/111122223333/example-audit-ingest
      region: eu-central-1
  blobs:
    adapter: s3
    settings:
      bucket: example-sluis-111122223333
      region: eu-central-1
  secrets:
    adapter: ssm
    settings:
      region: eu-central-1
      root: /sluis/staging
  trigger:
    adapter: invoke
    settings:
      github: sluis-staging-github
      slack: sluis-staging-chat
audit:
  audience: audit
  queryURL: https://audit.example.test/sluis
cloudflare:
  remote:
    function: sluis-staging-cloudflare
console:
  client: access-console
exchange:
  audience: access-issuer
freshness:
  freshnessWindow: 30m
  probeInterval: 5m
  refreshInterval: 15m
github:
  remote:
    function: sluis-staging-github
google:
  remote:
    function: sluis-staging-google
groupsScoping: report
instance: staging
issuerURL: https://access.example.test
keys:
  adapter: kms
  sign: alias/example-sign
lifetimes:
  absolute: 24h
  hold: 4h
  refresh: 12h
  session: 12h
  token: 1h
log:
  level: info
login:
  directory: true
oauthClient:
  provider: default
policy:
  file: /opt/sluis/policy.yaml
preset: aws-hybrid
publicRootURL: https://access.example.test
publicURL: https://access.example.test/console
recovery:
  enabled: false
  verifierSecret: recovery/verifier
release: access-issuer
secrets:
  layout: v5
  region: eu-central-1
  root: /sluis/staging
  source: ssm
secureCookies: true
signingKey:
  activationDelay: 30s
  kmsWrapped:
    algorithms:
      - ES384
    region: eu-central-1
    stateSecret: issuer/state-secret
  pollInterval: 30s
slack:
  remote:
    function: sluis-staging-chat
