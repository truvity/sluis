apiVersion: sluis.truvity.github.io/policy/v2
groups:
  all:access-roster:operator:
    members:
      - admin@example.test
    matchers:
      - service_account:
          namespace: access-issuer
          name: access-issuer-recovery
  all:access-roster:viewer:
    matchers:
      - email_domain: example.test
  all:audit:security:
    members:
      - admin@example.test
  all:grafana:admin:
    members:
      - admin@example.test
  all:infra:dns-editors:
    members:
      - admin@example.test
  example:k8s:admin:
    members:
      - admin@example.test
lifetimes:
  default: 4h0m0s
clients:
  access-console:
    kind: public
    redirects:
      - https://access.example.test/console/callback
    requires:
      - all:access-roster:viewer
  audit:
    kind: exchange
    requires:
      - all:audit:security
  grafana:
    kind: confidential
    secret: clients/grafana/secret
    redirects:
      - https://grafana.example.test/login/generic_oauth
    requires:
      - all:grafana:admin
github:
  example-org:
    members:
      - all:access-roster:viewer
slack:
  workspaces:
    example:
      channels:
        ops:
          private: true
          from:
            - all:access-roster:operator
outline:
  workspaces:
    wiki:
      roles:
        admin:
          - all:access-roster:operator
      ignore:
        - key.owner@example.test
      collections:
        General:
          mode: strict
          read_write:
            - all:access-roster:viewer
          admin:
            - all:access-roster:operator
exchange:
  github:
    owners:
      - example-org
apps:
  github:
    apps:
      - purpose: runner
        tier: stable
controllers:
  github:
    enabledOrgs:
      - example-org
  slack:
    enabledWorkspaces:
      - example
  outline:
    enabledWorkspaces:
      - wiki
cloudflare:
  grants:
    - group: all:infra:dns-editors
      presets:
        - dns-example
