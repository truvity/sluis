# A larger installation on AWS Lambda with a function per module: both
# controllers, a declared Google workspace, Cloudflare presets with a grant, one
# module function under a name of its own, and the intervals of the directory's
# refresh. Every name is a placeholder; no value here is a secret.
apiVersion: sluis.truvity.github.io/installation/v1
instance: staging
shape: lambda
preset: aws-hybrid
release: access-issuer

issuer:
  url: https://access.example.test
  consoleURL: https://access.example.test/console
  secureCookies: true
  groupsScoping: report

log: {level: info}
lifetimes: {token: 1h, refresh: 12h, absolute: 24h, hold: 4h, session: 12h}
freshness: {refreshInterval: 15m, freshnessWindow: 30m, probeInterval: 5m}

aws:
  account: "111122223333"
  region: eu-central-1
  functionName: sluis-staging-issuer
  functions:
    slack: sluis-staging-chat
    github-mint: sluis-staging-token-mint
  bucket: example-sluis-111122223333
  auditQueueURL: https://sqs.eu-central-1.amazonaws.com/111122223333/example-audit-ingest

keys: {adapter: kms, sign: alias/example-sign}
signingKey:
  kmsWrapped:
    algorithms: [ES384]
  pollInterval: 30s
  activationDelay: 30s

recovery: {enabled: false}
login: {directory: true}
console: {client: access-console}
oauthClient: {provider: default}
audit:
  audience: audit
  queryURL: https://audit.example.test/sluis

exchange:
  audience: access-issuer
  github:
    owners: [example-org]

apps:
  github:
    apps:
      - {purpose: runner, tier: stable}

directory:
  workspaces:
    - {id: tenant, backend: google, admin: admin@example.test, keySecret: directory/tenant/key, serve: [example.test], syncGroups: [staff@example.test]}

controllers:
  github:
    consoleURL: https://access.example.test/console
    interval: 15m
    enabledOrgs: [example-org]
  slack:
    interval: 10m
    enabledWorkspaces: [example]

cloudflare:
  forbiddenPermissionGroups: [Workers Scripts Write]
  accounts:
    main:
      id: 0123456789abcdef0123456789abcdef
      minter: internal/cloudflare/main/minter
  presets:
    dns-example:
      account: main
      prototype: 9d3b1c7a5e2f4b8a9c0d1e2f3a4b5c6d
      description: DNS edits on example.com for the release job
      lifetime: 15m
      rotation: 5m
  grants:
    - group: all:infra:dns-editors
      presets: [dns-example]

access:
  groups:
    all:access-roster:operator:
      members: [admin@example.test]
      matchers:
        - service_account: {namespace: access-issuer, name: access-issuer-recovery}
    all:access-roster:viewer:
      matchers: [{email_domain: example.test}]
    all:audit:security:
      members: [admin@example.test]
    example:k8s:admin:
      members: [admin@example.test]
    all:grafana:admin:
      members: [admin@example.test]
    all:infra:dns-editors:
      members: [admin@example.test]
  lifetimes:
    default: 4h
  clients:
    access-console:
      kind: public
      redirects: [https://access.example.test/console/callback]
      requires: [all:access-roster:viewer]
    audit:
      kind: exchange
      requires: [all:audit:security]
    grafana:
      kind: confidential
      secret: clients/grafana/secret
      redirects: [https://grafana.example.test/login/generic_oauth]
      requires: [all:grafana:admin]
  github:
    example-org:
      members: [all:access-roster:viewer]
  slack:
    workspaces:
      example:
        channels:
          ops: {private: true, from: [all:access-roster:operator]}
