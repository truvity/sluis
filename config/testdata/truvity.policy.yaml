apiVersion: sluis.truvity.github.io/policy/v2
groups:
  all:access-roster:operator:
    members:
      - admin@example.test
  all:access-roster:viewer:
    matchers:
      - email_domain: example.test
  all:argocd:admin:
    members:
      - admin@example.test
  all:audit:security:
    members:
      - admin@example.test
  all:aws:admin:
    members:
      - admin@example.test
  all:ci:runner:
    matchers:
      - github:
          owner: example-org
          ref: refs/heads/main
      - github:
          owner: example-forms
          ref: refs/heads/main
  all:docs:reader:
    members:
      - admin@example.test
  all:github:reader:
    members:
      - admin@example.test
  all:grafana:admin:
    members:
      - admin@example.test
  all:headlamp:admin:
    members:
      - admin@example.test
  all:k8s:admin:
    members:
      - admin@example.test
  all:kargo:admin:
    members:
      - admin@example.test
  all:linear:reader:
    members:
      - admin@example.test
  all:outline:member:
    members:
      - admin@example.test
  all:registry:admin:
    members:
      - admin@example.test
  all:ssh:operator:
    members:
      - admin@example.test
  all:vmauth:viewer:
    members:
      - admin@example.test
lifetimes:
  default: 4h0m0s
clients:
  access-console:
    kind: public
    redirects:
      - https://access.example.test/console/callback
    requires:
      - all:access-roster:viewer
  argocd:
    kind: confidential
    secret: clients/argocd/secret
    redirects:
      - https://argocd.example.test/callback
    requires:
      - all:argocd:admin
    signing_alg: RS256
  audit:
    kind: exchange
    requires:
      - all:audit:security
  aws-cli:
    kind: public
    redirects:
      - http://localhost:8015/callback
    requires:
      - all:aws:admin
  ci-github:
    kind: exchange
    requires:
      - all:ci:runner
  ci-gitlab:
    kind: exchange
    requires:
      - all:ci:runner
  grafana:
    kind: confidential
    secret: clients/grafana/secret
    redirects:
      - https://grafana.example.test/callback
    requires:
      - all:grafana:admin
  harbor:
    kind: confidential
    secret: clients/harbor/secret
    redirects:
      - https://harbor.example.test/callback
    requires:
      - all:registry:admin
  headlamp:
    kind: confidential
    secret: clients/headlamp/secret
    redirects:
      - https://headlamp.example.test/callback
    requires:
      - all:headlamp:admin
  k8s-staging:
    kind: exchange
    requires:
      - all:k8s:admin
  kargo:
    kind: confidential
    secret: clients/kargo/secret
    redirects:
      - https://kargo.example.test/callback
    requires:
      - all:kargo:admin
    signing_alg: RS256
  kargo-cli:
    kind: public
    redirects:
      - http://localhost:8013/callback
    requires:
      - all:kargo:admin
    signing_alg: RS256
  mcp-docs:
    kind: public
    redirects:
      - http://localhost:8018/callback
    requires:
      - all:docs:reader
  mcp-github:
    kind: public
    redirects:
      - http://localhost:8019/callback
    requires:
      - all:github:reader
  mcp-linear:
    kind: public
    redirects:
      - http://localhost:8019/callback
    requires:
      - all:linear:reader
  opkssh:
    kind: public
    redirects:
      - http://localhost:8014/callback
    requires:
      - all:ssh:operator
    signing_alg: RS256
  outline:
    kind: confidential
    secret: clients/outline/secret
    redirects:
      - https://outline.example.test/callback
    requires:
      - all:outline:member
  sluisctl:
    kind: public
    redirects:
      - http://localhost:8017/callback
    requires:
      - all:access-roster:viewer
  vmauth:
    kind: confidential
    secret: clients/vmauth/secret
    redirects:
      - https://vmauth.example.test/callback
    requires:
      - all:vmauth:viewer
  zot-cli:
    kind: public
    redirects:
      - http://localhost:8016/callback
    requires:
      - all:registry:admin
github:
  example-forms:
    members:
      - all:access-roster:viewer
  example-org:
    members:
      - all:access-roster:viewer
slack:
  workspaces:
    example:
      channels:
        ops:
          private: true
          from:
            - all:access-roster:operator
exchange:
  clusters:
    - name: staging
      issuer: https://kubernetes.default.svc
    - name: devel
      issuer: https://oidc.devel.example.test
      jwksUri: https://oidc.devel.example.test/keys
    - name: stage
      issuer: https://oidc.stage.example.test
    - name: prod
      issuer: https://oidc.prod.example.test
  aws:
    audience: https://access.example.test
    maxAge: 5m
    accounts:
      - account: "111122223333"
        name: staging
        issuer: https://sts-issuer.example.test
  github:
    owners:
      - example-forms
      - example-org
apps:
  github:
    apps:
      - purpose: runner
        tier: stable
      - purpose: runner
        tier: large
      - purpose: runner
        tier: canary
      - id: release
        purpose: catalogue
        org: example-org
        permissions:
          contents: write
          pull_requests: read
        grants:
          - group: all:ci:runner
            repositories:
              - infra-*
            permissions:
              contents: write
  slack:
    catalogue:
      - id: alerts
        workspace: example
        botScopes:
          - chat:write
      - id: deadman
        workspace: example
        botScopes:
          - chat:write
controllers:
  github:
    enabledOrgs:
      - example-forms
      - example-org
  slack:
    enabledWorkspaces:
      - example
