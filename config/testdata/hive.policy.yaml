apiVersion: sluis.truvity.github.io/policy/v2
groups:
  all:access-roster:operator:
    members:
      - admin@example.test
    matchers:
      - service_account:
          namespace: access-issuer
          name: access-issuer-recovery
  all:access-roster:viewer:
    matchers:
      - email_domain: example.test
  all:audit:security:
    members:
      - admin@example.test
  all:grafana:admin:
    members:
      - admin@example.test
  hive:k8s:admin:
    members:
      - admin@example.test
lifetimes:
  default: 4h0m0s
clients:
  access-console:
    kind: public
    redirects:
      - https://access.example.test/console/callback
    requires:
      - all:access-roster:viewer
  audit:
    kind: exchange
    requires:
      - all:audit:security
  grafana:
    kind: confidential
    secret: clients/grafana/secret
    redirects:
      - https://grafana.example.test/login/generic_oauth
    requires:
      - all:grafana:admin
github:
  example-org:
    members:
      - all:access-roster:viewer
exchange:
  github:
    owners:
      - example-org
apps:
  github:
    runnerTiers:
      - stable
controllers:
  github:
    enabledOrgs:
      - example-org
exports:
  - name: arc-runner-app
    source: runner-app
    tier: stable
    org: example-org
    path: github-runner-app/stable/example-org
