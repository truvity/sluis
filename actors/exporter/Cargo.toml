[package]
name = "exporter"
description = "The exporter actor: it publishes the kinds marked exportable to destinations outside sluis, the static key set first, through the destination port (ADR 0009)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "exporter"
path = "src/lib.rs"

[[bin]]
name = "exporter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client"] }
serde_json = "1"
sluis-audit = { path = "../../kits/rust/sluis-audit" }
sluis-destination = { path = "../../kits/rust/sluis-destination" }
sluis-kit = { path = "../../kits/rust/sluis-kit" }
sluis-proto = { path = "../../kits/rust/sluis-proto" }
sluis-registry = { path = "../../kits/rust/sluis-registry" }
sluis-store = { path = "../../kits/rust/sluis-store" }
sluis-version = { path = "../../kits/rust/sluis-version" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
aws-lc-rs = "1"
futures = "0.3"
rustix = { version = "1", features = ["process"] }
# The directory driver is the other end of the destination port in the tests.
sluis-driver-exporter-dir = { path = "../../drivers/exporter/dir" }
# Only a dev-dependency turns the test uid table on, so no product build has it (just rust-feature-guard).
sluis-kit = { path = "../../kits/rust/sluis-kit", features = ["test-identities"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
