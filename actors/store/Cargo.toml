[package]
name = "store"
description = "store@: the only holder of storage credentials; the generic store service, its rules, TTL and grant check (ADR 0005)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "store"
path = "src/lib.rs"

[[bin]]
name = "store"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-lc-rs = "1"
base64 = "0.23"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive", "string"] }
# The reader of the `file` config source, which `store check --validate` reads a directory with, so that the offline
# check reads exactly what the driver would serve (ADR 0012, "The configuration check runs store@'s own rules").
file = { path = "../../drivers/store/file" }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
futures = "0.3"
rustix = { version = "1", features = ["fs", "process"] }
saphyr-parser = "=0.3.3"
serde = "1"
serde_json = "1"
sluis-audit = { path = "../../kits/rust/sluis-audit" }
sluis-kit = { path = "../../kits/rust/sluis-kit" }
sluis-proto = { path = "../../kits/rust/sluis-proto" }
sluis-registry = { path = "../../kits/rust/sluis-registry" }
sluis-store = { path = "../../kits/rust/sluis-store" }
sluis-version = { path = "../../kits/rust/sluis-version" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
# The secret source driver, served in the tests over its real contract.
credential = { path = "../../drivers/store/credential" }
sluis-conformance = { path = "../../kits/rust/sluis-conformance", features = ["memory"] }
# The rqlite driver and the memory engine, served in the tests over their real contract: Watch end to end.
rqlite = { path = "../../drivers/store/rqlite" }
sluis-kit = { path = "../../kits/rust/sluis-kit", features = ["test-identities"] }
tempfile = "3"
