[package]
name = "reader"
description = "The reader actor: it answers Search over the audit index, filtered by the grant policy gives, and opens each record at key@ from the log (ADR 0028, The reader)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "reader"
path = "src/lib.rs"

[[bin]]
name = "reader"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-lc-rs = "1"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
# The format of the log's entries and the seal address are the indexer's (one definition, two readers).
indexer = { path = "../indexer" }
serde_json = "1"
sluis-audit = { path = "../../kits/rust/sluis-audit" }
sluis-kit = { path = "../../kits/rust/sluis-kit" }
sluis-proto = { path = "../../kits/rust/sluis-proto" }
sluis-store = { path = "../../kits/rust/sluis-store" }
sluis-version = { path = "../../kits/rust/sluis-version" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
# The real index driver is the other end of the index-ro port in the tests; its dev edge turns the test uid table on.
sluis-driver-indexer-sqlite = { path = "../../drivers/indexer/sqlite" }
# Only a dev-dependency turns the test uid table on, so no product build has it (just rust-feature-guard).
sluis-kit = { path = "../../kits/rust/sluis-kit", features = ["test-identities"] }
base64 = "0.23"
rustix = { version = "1", features = ["process"] }
tempfile = "3"
