[package]
name = "indexer"
description = "The indexer actor: it follows each audit log of its boundary by signed checkpoint, opens the entries a verified checkpoint covers at key@, and writes them to the search index (ADR 0028, Search and the index)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "indexer"
path = "src/lib.rs"

[[bin]]
name = "indexer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-lc-rs = "1"
base64 = "0.23"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client"] }
serde_json = "1"
# The C2SP signed-note, tlog-checkpoint and RFC 6962 code of Cloudflare's azul, at the commit of its v0.3.0 tag
# (2026-10-15, BSD-3-Clause). The 0.2.0 release on crates.io is older than a year and has no `NoteVerifier`; the
# tag is not published there, so the pin is a revision (docs/reference/approved-libraries.md, C2SP section).
signed_note = { git = "https://github.com/cloudflare/azul", rev = "662c80c05a5969a2c5eb4e75a48e3cf50dba5790" }
sluis-kit = { path = "../../kits/rust/sluis-kit" }
sluis-proto = { path = "../../kits/rust/sluis-proto" }
sluis-store = { path = "../../kits/rust/sluis-store" }
sluis-version = { path = "../../kits/rust/sluis-version" }
tlog_checkpoint = { git = "https://github.com/cloudflare/azul", rev = "662c80c05a5969a2c5eb4e75a48e3cf50dba5790" }
tlog_core = { git = "https://github.com/cloudflare/azul", rev = "662c80c05a5969a2c5eb4e75a48e3cf50dba5790" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
# The real index driver is the other end of the index port in the tests; its dev edge turns the test uid table on.
sluis-driver-indexer-sqlite = { path = "../../drivers/indexer/sqlite" }
# Only a dev-dependency turns the test uid table on, so no product build has it (just rust-feature-guard).
sluis-kit = { path = "../../kits/rust/sluis-kit", features = ["test-identities"] }
rustix = { version = "1", features = ["process"] }
tempfile = "3"
