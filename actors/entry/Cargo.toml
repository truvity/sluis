[package]
name = "entry"
description = "The entry actor: the only HTTP surface of a boundary. It parses each request against closed parameter lists and routes it to session or exchange."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Lets a test choose which uid is the forwarder (`serve_with`). Only the dev-dependency on this crate
# below turns it on, so no product build has it.
test-identities = []

[lib]
name = "entry"
path = "src/lib.rs"

[[bin]]
name = "entry"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "http1", "http2"] }
rustix = { version = "1", features = ["rand", "process"] }
serde_json = "1"
sluis-audit = { path = "../../kits/rust/sluis-audit" }
sluis-kit = { path = "../../kits/rust/sluis-kit" }
sluis-proto = { path = "../../kits/rust/sluis-proto" }
sluis-registry = { path = "../../kits/rust/sluis-registry" }
sluis-store = { path = "../../kits/rust/sluis-store" }
sluis-version = { path = "../../kits/rust/sluis-version" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
aws-lc-rs = "1"
entry = { path = ".", features = ["test-identities"] }
buffa = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
# Only a dev-dependency turns the test uid table on, so no product build has it (just rust-feature-guard).
sluis-kit = { path = "../../kits/rust/sluis-kit", features = ["test-identities"] }
rustix = { version = "1", features = ["rand", "process"] }
tempfile = "3"
