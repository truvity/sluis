[package]
name = "signer"
description = "The signer actor: it checks the claims of a token against the config and signs them through key@ with the token-signing key; it keeps the key set (SigningRing) in store@."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Lets a test choose which uid is a caller (`serve_with`). Only the dev-dependency on this crate
# below turns it on, so no product build has it.
test-identities = []

[lib]
name = "signer"
path = "src/lib.rs"

[[bin]]
name = "signer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-lc-rs = "1"
base64 = "0.23"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
serde_json = "1"
sluis-audit = { path = "../../kits/rust/sluis-audit" }
sluis-kit = { path = "../../kits/rust/sluis-kit" }
sluis-proto = { path = "../../kits/rust/sluis-proto" }
sluis-registry = { path = "../../kits/rust/sluis-registry" }
sluis-store = { path = "../../kits/rust/sluis-store" }
sluis-version = { path = "../../kits/rust/sluis-version" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
signer = { path = ".", features = ["test-identities"] }
# Only a dev-dependency turns the test uid table on, so no product build has it (just rust-feature-guard).
sluis-kit = { path = "../../kits/rust/sluis-kit", features = ["test-identities"] }
rustix = { version = "1", features = ["process"] }
tempfile = "3"
