[package]
name = "sluis-driver-indexer-fs"
description = "The host of the read-only fs blob driver of the indexer and the reader: atoom's fs readonly driver (github.com/truvity/atoom, blob/fsreadonly) behind sluis's sockets, peer checks and command line (ADR 0028, Access)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "driver-indexer-fs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atoom-blob-fsdir.workspace = true
atoom-blob-fsreadonly.workspace = true
clap = { version = "4", features = ["derive", "string"] }
rustix = { version = "1", features = ["process"] }
sluis-kit = { path = "../../../kits/rust/sluis-kit" }
sluis-registry = { path = "../../../kits/rust/sluis-registry" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
atoom-blob-conformance.workspace = true
atoom-socket.workspace = true
atoom-blob.workspace = true
# Lets a test choose which uid is which actor; only a dev edge turns it on.
sluis-kit = { path = "../../../kits/rust/sluis-kit", features = ["test-identities"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
tempfile = "3"
