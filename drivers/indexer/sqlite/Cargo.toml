[package]
name = "sluis-driver-indexer-sqlite"
description = "The host of the sqlite index driver of the indexer: atoom's sqlite index driver (github.com/truvity/atoom, index/sqlite) behind sluis's sockets, peer checks and command line (ADR 0028, Search and the index)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "driver-indexer-sqlite"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atoom-index-sqlite.workspace = true
clap = { version = "4", features = ["derive", "string"] }
sluis-kit = { path = "../../../kits/rust/sluis-kit" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
atoom-index.workspace = true
buffa = { version = "=0.9.2", features = ["json"] }
# Lets a test choose which uid is which actor; only a dev edge turns it on.
sluis-kit = { path = "../../../kits/rust/sluis-kit", features = ["test-identities"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
rustix = { version = "1", features = ["process"] }
tempfile = "3"
