[package]
name = "rqlite"
description = "The host of the rqlite driver of store@: atoom's rqlite item driver (github.com/truvity/atoom, store/rqlite) behind sluis's socket, peer check and command line, for the durable and the temp port."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "rqlite"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atoom-store-rqlite.workspace = true
clap = { version = "4", features = ["derive", "string"] }
sluis-kit = { path = "../../../kits/rust/sluis-kit" }
sluis-registry = { path = "../../../kits/rust/sluis-registry" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
atoom-common.workspace = true
atoom-store.workspace = true
atoom-store-conformance.workspace = true
atoom-store-memory.workspace = true
# The test-only feature of the kit is a dev edge: no product build has it.
sluis-kit = { path = "../../../kits/rust/sluis-kit", features = ["test-identities"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
futures = "0.3"
rustix = { version = "1", features = ["process"] }
tempfile = "3"
