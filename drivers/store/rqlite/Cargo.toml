[package]
name = "rqlite"
description = "The rqlite driver of store@: the item contract (sluis.port.item.v2alpha1) over rqlite's HTTP API, for the durable and the temp port."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "sluis_rqlite"
path = "src/lib.rs"

[[bin]]
name = "rqlite"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
bytes = "1"
clap = { version = "4", features = ["derive", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde_json = "1"
sluis-conformance = { path = "../../../kits/rust/sluis-conformance" }
sluis-kit = { path = "../../../kits/rust/sluis-kit" }
sluis-proto = { path = "../../../kits/rust/sluis-proto" }
sluis-registry = { path = "../../../kits/rust/sluis-registry" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
# The test-only feature of the kit and the in-memory engine are dev edges: no product build has them.
sluis-kit = { path = "../../../kits/rust/sluis-kit", features = ["test-identities"] }
rustix = { version = "1", features = ["process"] }
tempfile = "3"
