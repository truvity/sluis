[package]
name = "credential"
description = "The host of the credential driver of store@: atoom's credential source driver (github.com/truvity/atoom, source/credential) behind sluis's socket, peer check and command line, the secret source."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "credential"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atoom-source-credential.workspace = true
clap = { version = "4", features = ["derive", "string"] }
sluis-kit = { path = "../../../kits/rust/sluis-kit" }
sluis-registry = { path = "../../../kits/rust/sluis-registry" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }

[dev-dependencies]
atoom-source-conformance.workspace = true
atoom-socket.workspace = true
atoom-source.workspace = true
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "server"] }
rustix = { version = "1", features = ["fs", "process"] }
# Lets a test choose which uid is which actor; only a dev edge turns it on.
sluis-kit = { path = "../../../kits/rust/sluis-kit", features = ["test-identities"] }
tempfile = "3"
