[package]
name = "sluis-driver-exporter-dir"
description = "The host of the directory driver of exporter@: atoom's dir destination driver (github.com/truvity/atoom, destination/dir) behind sluis's socket, peer check and command line, for public material (ADR 0009, Destinations)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "driver-exporter-dir"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atoom-destination-conformance.workspace = true
atoom-destination-dir.workspace = true
clap = { version = "4", features = ["derive", "string"] }
sluis-kit = { path = "../../../kits/rust/sluis-kit" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
atoom-destination.workspace = true
atoom-socket.workspace = true
# Lets a test choose which uid is which actor; only a dev edge turns it on.
sluis-kit = { path = "../../../kits/rust/sluis-kit", features = ["test-identities"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
rustix = { version = "1", features = ["process"] }
tempfile = "3"
