[package]
name = "sluis-driver-writer-spool"
description = "The host of the spool audit transport driver of the writer: atom's spool driver (github.com/truvity/atoom, transport/spool) behind sluis's sockets, peer check, call graph and command line (ADR 0028, Transport)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "driver-writer-spool"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atoom-transport-spool.workspace = true
clap = { version = "4", features = ["derive", "string"] }
sluis-kit = { path = "../../../kits/rust/sluis-kit" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
atoom-transport.workspace = true
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "server"] }
rustix = { version = "1", features = ["process"] }
tempfile = "3"
# Lets a test choose which uid is which actor; only a dev edge turns it on.
sluis-kit = { path = "../../../kits/rust/sluis-kit", features = ["test-identities"] }
sluis-audit = { path = "../../../kits/rust/sluis-audit" }
sluis-registry = { path = "../../../kits/rust/sluis-registry" }
serde_json = "1"
