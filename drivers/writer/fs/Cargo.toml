[package]
name = "sluis-driver-writer-fs"
description = "The host of the fs blob driver of the audit writer: atoom's fs blob driver (github.com/truvity/atoom, blob/fs) behind sluis's socket, peer check and command line (ADR 0029, The write-once fence)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "driver-writer-fs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atoom-blob-fs.workspace = true
clap = { version = "4", features = ["derive", "string"] }
sluis-kit = { path = "../../../kits/rust/sluis-kit" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
atoom-blob.workspace = true
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "server"] }
rustix = { version = "1", features = ["process"] }
# Lets a test choose which uid is which actor; only a dev edge turns it on.
sluis-kit = { path = "../../../kits/rust/sluis-kit", features = ["test-identities"] }
tempfile = "3"
