// The types every atoom port and driver speaks: the detail of an error (Refusal) and one declared index of an item (IndexEntry).
// Moved from sluis proto/sluis/type/v2alpha1/type.proto (see common/PROVENANCE.md); the package is renamed, the fields and their numbers
// are unchanged.
syntax = "proto3";

package atoom.common.v1alpha1;

// IndexEntry is one declared index of an item, computed by the writer.
message IndexEntry {
  string name = 1;   // the declared index
  bytes value = 2;   // the value to match under that index
}

// Refusal is the detail of every Connect error in atoom and its consumers.
message Refusal {
  string reason = 1;      // from a closed list; never a value
  string field_path = 2;  // the path of the field at fault; never its value
}
