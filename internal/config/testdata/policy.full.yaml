# Every key the policy document's schema has, set, and valid: the loader's
# checks pass, and the type holds each key.
apiVersion: sluis.truvity.github.io/policy/v2
vocabulary:
  scopes:
    all: {}
    prod: {sensitive: true}
  things:
    sluis:
      scopes: [all]
      roles:
        operator: [viewer]
        viewer: []
        releaser: []
    shop:
      scopes: [prod]
      roles:
        deployer: {implies: [], scopes: [prod]}
groups:
  all:sluis:operator:
    members: [ops@example.com]
    matchers:
      - service_account: {cluster: devel, namespace: access-issuer, name: access-issuer-recovery}
      - github: {repository: example-org/infra, ref: refs/heads/main, workflow_ref: "example-org/infra/.github/workflows/*@refs/heads/main"}
  all:sluis:viewer:
    matchers:
      - aws: {account: "111122223333", role: sluis-github}
      - email_domain: example.com
  all:sluis:releaser:
    matchers:
      - github: {repository: example-org/example-repo, ref: "refs/tags/v*", job_workflow_ref: "example-org/example-repo/.github/workflows/release.yml@refs/tags/v*"}
  prod:shop:deployer:
    matchers:
      - email: ada@example.com
claims:
  prod:shop:deployer: {team: shop, filters: [a]}
lifetimes:
  default: 4h
  prod:shop:deployer: 1h
resources:
  https://shop.example:
    display_name: Shop
    requires: [prod:shop:deployer]
    ttl_cap: 30m
client_documents:
  origins: [apps.example]
  requires: [all:sluis:viewer]
clients:
  access-console:
    kind: public
    redirects: [https://access.example/console/callback]
    requires: [all:sluis:viewer]
    groups: all
github:
  example-org:
    members: [all:sluis:viewer]
    teams:
      platform: {members: [all:sluis:operator], maintainers: [all:sluis:operator]}
    ignore: [bot@example.com]
people:
  ada: [ada@example.com, ada@other.example]
slack:
  workspaces:
    example:
      channels:
        ops: {private: true, from: [all:sluis:operator]}
outline:
  workspaces:
    wiki:
      client: access-console
      roles: {admin: [all:sluis:operator]}
      ignore: [key.owner@example.com]
      collections:
        General: {mode: strict, read_write: [all:sluis:viewer], admin: [all:sluis:operator]}
        Shop: {mode: strict, directory: example.com, read: [prod:shop:deployer]}
exchange_limits:
  - match: {aws: {account: "111122223333", role: sluis-github, path: /}}
    clients: [access-console]
exchange:
  clusters:
    - {name: devel, issuer: "https://kubernetes.default.svc", jwksUri: "https://devel.example/openid/v1/jwks"}
  aws:
    audience: https://access.example
    maxAge: 5m
    accounts:
      - account: "111122223333"
        name: apps
        issuer: https://example-id.tokens.sts.global.api.aws
        jwksUri: https://example-id.tokens.sts.global.api.aws/.well-known/jwks.json
        orgId: o-example
        algs: [ES384]
  github:
    owners: [example-org]
apps:
  github:
    apps:
      - {id: link, purpose: link, labels: {team: platform}}
      - {purpose: runner, tier: small}
      - {purpose: runner, tier: large, org: example-org, labels: {pool: ci}}
      - id: renovate
        purpose: catalogue
        labels: {team: platform}
        export: true
        org: example-org
        name: example-org-renovate
        description: Dependency updates
        public: false
        permissions: {contents: write, members: write, organization_administration: read, pull_requests: write}
        events: [push]
        installation: selected
        grants:
          - {group: "all:sluis:operator", repositories: ["*"], permissions: {contents: read}}
  slack:
    catalogue:
      - {id: alerts, workspace: example, name: example-alerts, description: Alerts, botScopes: ["chat:write"]}
controllers:
  github: {enabledOrgs: [example-org], appRefs: {example-org: renovate}}
  slack: {enabledWorkspaces: [example]}
  outline: {enabledWorkspaces: [wiki]}
cloudflare:
  grants:
    - group: "all:sluis:operator"
      presets: [dns-example, r2-archive]
    - group: "all:sluis:releaser"
      presets: [dns-example]
backup:
  runGroups: ["all:sluis:operator"]
