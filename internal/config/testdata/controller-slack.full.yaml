apiVersion: sluis.truvity.github.io/controller-slack/v2
release: access-issuer
policy: {file: /etc/sluis/policy/policy.yaml}
consoleURL: http://access-issuer.access.svc:8080/console
tokenFile: /var/run/secrets/slack-roster/token
recordsDir: /var/run/slack-roster/workspaces
interval: 15m
log: {level: info}
audit: {writer: "http://audit.access-issuer.svc:8080", tokenFile: /var/run/audit/token}
credentialsDir: /var/run/slack-roster/credentials
ports: {adapter: legacy}
probes:
  address: ":7070"

platform:
  aws: true
  kubernetes: true
  openbao: true
  runtime: lambda
  replicas: 2
preset: aws-hybrid
adapters:
  state: {adapter: dynamodb, settings: {tables: {oidc: sluis-oidc}, region: eu-west-1}}
console:
  auth:
    aws:
      audience: https://sluis.example/console
github:
  remote:
    function: sluis-acme-github
slack:
  remote:
    url: http://slack.sluis.svc:8080
    audience: slack
    tokenFile: /var/run/secrets/sluis/slack/token
google:
  remote:
    function: sluis-acme-google
secrets: {source: ssm, root: /sluis/example, layout: v5, region: eu-west-1}
