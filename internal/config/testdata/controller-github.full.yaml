apiVersion: sluis.truvity.github.io/controller-github/v2
release: access-issuer
policy: {file: /etc/sluis/policy/policy.yaml}
consoleURL: http://access-issuer.access.svc:8080/console
tokenFile: /var/run/secrets/github-roster/token
recordsDir: /var/run/github-roster/records
interval: 15m
log: {level: info}
audit: {writer: "http://audit.access-issuer.svc:8080", tokenFile: /var/run/audit/token}
appsDir: /var/run/github-roster/apps
ports: {adapter: legacy}
probes:
  address: ":7070"

platform:
  aws: true
  kubernetes: true
  openbao: true
  runtime: lambda
  replicas: 2
preset: aws-hybrid
adapters:
  state: {adapter: dynamodb, settings: {table: sluis, region: eu-west-1}}
console:
  auth:
    aws:
      audience: https://sluis.example/console
secrets: {source: ssm, root: /sluis/example, layout: v5, region: eu-west-1}
calls:
  modules:
    github:
      function: sluis-acme-github
    slack:
      url: http://slack.sluis.svc:8080
      audience: slack
      tokenFile: /var/run/secrets/sluis/slack/token
