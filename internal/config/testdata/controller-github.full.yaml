release: access-issuer
policyDir: /var/run/github-roster/policy
consoleURL: http://access-issuer.access.svc:8080/console
tokenFile: /var/run/secrets/github-roster/token
recordsDir: /var/run/github-roster/records
interval: 15m
log: {level: info}
audit: {writer: "http://audit.access-issuer.svc:8080", tokenFile: /var/run/audit/token}
appsDir: /var/run/github-roster/apps
catalogueFile: /var/run/github-roster/github-apps-catalogue.yaml
enabledOrgs: [example-org]
ports: {adapter: legacy}
probes:
  address: ":7070"

platform:
  aws: true
  kubernetes: true
  openbao: true
  runtime: lambda
  replicas: 2
preset: aws-hybrid
adapters:
  state: {adapter: dynamodb, settings: {table: sluis, region: eu-west-1}}
