apiVersion: sluis.truvity.github.io/sluis-outline/v1
release: sluis
policy: {file: /etc/sluis/policy/policy.yaml}
consoleURL: http://sluis.sluis.svc:8080/console
tokenFile: /var/run/secrets/outline-roster/token
interval: 2m
log: {level: info}
audit: {writer: "http://audit.sluis.svc:8080", tokenFile: /var/run/audit/token}
ports: {adapter: dynamodb, dynamodb: {tables: {outline: sluis-acme-outline}, region: eu-west-1}}
probes:
  address: ":7070"
platform:
  aws: true
  kubernetes: true
  openbao: true
  runtime: lambda
  replicas: 1
preset: aws-serverless
adapters:
  state: {adapter: dynamodb, settings: {tables: {outline: sluis-acme-outline}, region: eu-west-1}}
console:
  auth:
    aws:
      audience: https://sluis.example/console
secrets: {source: ssm, root: /sluis/acme, layout: v5, region: eu-west-1}
outline:
  serve:
    address: ":8081"
    audience: outline
    issuers: ["system:serviceaccount:sluis:sluis"]
  shareScan: 1h
