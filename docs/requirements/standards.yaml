# The standards register as data: the ids the requirement records cite.
# ST-nn are the rows of the standards register (docs/standards/index.md) plus the rows the
# research proposed for it (register: false); NC-nn are candidate rows that the register lacks.
# `register: true` means the row is on the /standards/ page. A row dropped from the page
# (JWE, OCSP; agreed 2026-10-30) keeps its id with `register: false`, so records that cite it stay valid.
# HPKE was dropped the same morning and is back on the page since the afternoon: enrolment is encrypted
# end to end with it (agreed 2026-10-30). The SPIFFE rows ST-107 to ST-113 replace ST-48 (agreed 2026-10-30);
# ST-48 keeps its id for SPIRE as prior art, which sluis does not deploy.
# The optional OpenID plans (ADR 0061, decided 2026-10-30): Form Post (ST-34) is a v2 target; Front-Channel Logout (ST-32)
# and 3rd Party-Initiated Login (ST-35) are not planned; CIBA (ST-36) is planned later, in poll mode, after v2 parity.
# The audit record formats (ADR 0064, decided 2026-11-01): OCSF (ST-114), in core classes with the sluis facts in `unmapped.sluis` and no extension, is the audit record;
# CloudEvents (ST-100) is back on the page for the usage stream, not as an audit envelope; FOCUS (ST-115) names the columns
# of the finance export.
