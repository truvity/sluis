# OPS: Operations and configuration
schema: 1
area: OPS
requirements:
  - id: REQ-OPS-001
    area: OPS
    statement: "`sluis config check` MUST validate an installation against the requirements declared by its drivers."
    rationale: "Placement is derived from rules, not chosen."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    decisions: ["OD-32"]
    issues: [864, 867]
    verification:
      - {kind: integration-test, ref: "driver-requirement tests"}
  - id: REQ-OPS-009
    area: OPS
    split_from: REQ-OPS-001
    statement: "`sluis config check` MUST refuse a combination that the compatibility table marks impossible."
    rationale: "Placement is derived from rules, not chosen."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    decisions: ["OD-32"]
    issues: [864, 867]
    verification:
      - {kind: integration-test, ref: "compatibility matrix tests"}
  - id: REQ-OPS-002
    area: OPS
    statement: "Configuration MUST be strictly validated against a generated schema."
    rationale: "Silent typos are bugs."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [864, 865]
    verification:
      - {kind: test-vectors, ref: "JSON-Schema-Test-Suite"}
  - id: REQ-OPS-010
    area: OPS
    split_from: REQ-OPS-002
    statement: "Unknown configuration keys MUST be refused."
    rationale: "Silent typos are bugs."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [864, 865]
    verification:
      - {kind: integration-test, ref: "unknown-key test"}
  - id: REQ-OPS-003
    area: OPS
    statement: "An actor that declares exactly one instance MUST acquire a lease when the installation has more than one node or elastic nodes."
    rationale: "A duplicated singleton corrupts state."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-81, section: "8446", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [847]
    verification:
      - {kind: test-vectors, ref: "port suite lease"}
  - id: REQ-OPS-004
    area: OPS
    statement: "Nodes of a cluster MUST join through discovery."
    rationale: "Autoscaling replaces nodes."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-81, section: "8446", depth: Full}
    issues: [887]
    verification:
      - {kind: integration-test, ref: "join test"}
  - id: REQ-OPS-011
    area: OPS
    split_from: REQ-OPS-004
    statement: "A node that has been unreachable for a configured time MUST be removed from the cluster."
    rationale: "Autoscaling replaces nodes."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-81, section: "8446", depth: Full}
    issues: [887]
    verification:
      - {kind: integration-test, ref: "node replacement test"}
  - id: REQ-OPS-012
    area: OPS
    split_from: REQ-OPS-004
    statement: "A node MUST leave the cluster cleanly when scaled in."
    rationale: "Autoscaling replaces nodes."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-81, section: "8446", depth: Full}
    issues: [887]
    verification:
      - {kind: integration-test, ref: "scale-in test"}
  - id: REQ-OPS-005
    area: OPS
    statement: "sluis MUST migrate state between storage drivers."
    rationale: "Operators change storage."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [804]
    verification:
      - {kind: integration-test, ref: "migration round trip"}
  - id: REQ-OPS-006
    area: OPS
    statement: "When a dependency needed for a decision is unavailable, sluis MUST refuse the request with the documented error."
    rationale: "Fail closed with bounded impact."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: stakeholder-only
    verification:
      - {kind: integration-test, ref: "dependency-down matrix"}
  - id: REQ-OPS-013
    area: OPS
    split_from: REQ-OPS-006
    statement: "When a dependency needed for a decision is unavailable, sluis MUST NOT take a weaker path."
    rationale: "Fail closed with bounded impact."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: stakeholder-only
    verification:
      - {kind: integration-test, ref: "no-weaker-path test"}
  - id: REQ-OPS-014
    area: OPS
    split_from: REQ-OPS-006
    statement: "Tokens already issued MUST remain valid until expiry when a dependency is unavailable."
    rationale: "Fail closed with bounded impact."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: stakeholder-only
    verification:
      - {kind: integration-test, ref: "issued-token validity test"}
  - id: REQ-OPS-007
    area: OPS
    statement: "In an installation that enforces a region policy, every table, bucket, key replica and index MUST be in an allowed region, checked at load and at deployment."
    rationale: "Residency is a legal requirement for some users."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: stakeholder-only
    verification:
      - {kind: integration-test, ref: "region guard test"}
  - id: REQ-OPS-008
    area: OPS
    statement: "A production profile MUST refuse every feature that exists only for tests."
    rationale: "Test doors must not ship."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [877]
    verification:
      - {kind: integration-test, ref: "production-profile refusal tests"}
  - id: REQ-OPS-015
    area: OPS
    statement: "A configuration field that carries authority MUST accept declared configuration only."
    rationale: "Authority is reviewed before it takes effect."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    issues: [864, 960]
    verification:
      - {kind: integration-test, ref: "authority origin refusal test"}
  - id: REQ-OPS-016
    area: OPS
    statement: "An operator write to a field that declared configuration sets MUST be refused, except a tighten-only switch moved in its safe direction."
    rationale: "A declared value locks its field."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    features: ["design"]
    issues: [960]
    verification:
      - {kind: integration-test, ref: "declared lock test"}
  - id: REQ-OPS-017
    area: OPS
    statement: "An object defined both in declared configuration and as an operator-set record MUST be held until one definition is removed or adopted."
    rationale: "Neither side may silently take over the other."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    features: ["design"]
    issues: [960]
    verification:
      - {kind: integration-test, ref: "double definition hold test"}
  - id: REQ-OPS-018
    area: OPS
    statement: "Every operator-set write MUST be audited under the person who made it, with the full value apart from secrets."
    rationale: "The audit trail is the history of records that are not in version control."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    features: ["design"]
    issues: [960]
    verification:
      - {kind: integration-test, ref: "operator-set audit record test"}
  - id: REQ-OPS-019
    area: OPS
    statement: "The state driver MUST refuse an operator-set write from any actor other than the owner of the record kind."
    rationale: "The owning actor validates its own records."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-103, section: "test plan", depth: Partial}
    features: ["design"]
    issues: [960]
    verification:
      - {kind: integration-test, ref: "operator-set writer refusal test"}
  - id: REQ-OPS-020
    area: OPS
    statement: "sluis MUST refuse a declared key for a value that it learns from an external system."
    rationale: "Configuring what the product knows creates two sources of truth."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    features: ["design"]
    issues: [864]
    verification:
      - {kind: integration-test, ref: "learned key refusal test"}
  - id: REQ-OPS-021
    area: OPS
    statement: "A declared configuration snapshot that fails validation on reload MUST be refused while the version in force stays."
    rationale: "A bad reload must not change a running installation."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    issues: [977]
    verification:
      - {kind: integration-test, ref: "failed reload test"}
  - id: REQ-OPS-022
    area: OPS
    statement: "An operator MAY move a tighten-only switch in its safe direction even when declared configuration sets it."
    rationale: "A fast brake must not wait for a deployment."
    level: MAY
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    features: ["design"]
    issues: [960]
    verification:
      - {kind: integration-test, ref: "tighten-only switch test"}
  - id: REQ-OPS-023
    area: OPS
    statement: "`sluis config explain` MUST show the origin of each effective value."
    rationale: "An operator must be able to trace a value to whoever set it."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    features: ["design"]
    issues: [864]
    verification:
      - {kind: integration-test, ref: "explain origin test"}
  - id: REQ-OPS-024
    area: OPS
    statement: "On a push notification an integration MUST read the full state from the product's API instead of storing the notification's content."
    rationale: "A notification can be lost or reordered, and a full read cannot."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    features: ["design"]
    issues: [997]
    verification:
      - {kind: integration-test, ref: "notify-then-pull test"}
