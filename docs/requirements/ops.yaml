  - id: REQ-OPS-136
    area: OPS
    statement: "`sluis doctor` MUST NOT write to the host."
    rationale: "A check of the platform before a key is made must leave the platform as it found it, so it can be run at any time by any account that may read."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
