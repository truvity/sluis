# OPS: Operations and configuration
schema: 1
area: OPS
requirements:
  - id: REQ-OPS-001
    area: OPS
    statement: "`sluis config check` MUST validate an installation against the requirements declared by its drivers."
    rationale: "Placement is derived from rules, not chosen."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [864, 867, 1419]
    verification:
      - {kind: integration-test, ref: "driver-requirement tests"}
  - id: REQ-OPS-009
    area: OPS
    split_from: REQ-OPS-001
    statement: "`sluis config check` MUST refuse a combination that the compatibility table marks impossible."
    rationale: "Placement is derived from rules, not chosen."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [864, 867, 1419]
    tests: [actors/store/tests/validate.rs, cli/sluis/configcheck_test.go]
    verification:
      - {kind: integration-test, ref: "compatibility matrix tests"}
  - id: REQ-OPS-002
    area: OPS
    statement: "Configuration MUST be strictly validated against a generated schema."
    rationale: "Silent typos are bugs."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [864, 865]
    verification:
      - {kind: test-vectors, ref: "JSON-Schema-Test-Suite"}
  - id: REQ-OPS-010
    area: OPS
    split_from: REQ-OPS-002
    statement: "Unknown configuration keys MUST be refused."
    rationale: "Silent typos are bugs."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [864, 865]
    verification:
      - {kind: integration-test, ref: "unknown-key test"}
  - id: REQ-OPS-003
    area: OPS
    statement: "An actor that declares exactly one instance MUST acquire a lease when the installation has more than one node or elastic nodes."
    rationale: "A duplicated singleton corrupts state."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-81, section: "8446", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [847]
    superseded_by: [REQ-DATA-063, REQ-DATA-065]
    verification:
      - {kind: test-vectors, ref: "port suite lease"}
  - id: REQ-OPS-004
    area: OPS
    statement: "Nodes of a cluster MUST join through discovery."
    rationale: "Autoscaling replaces nodes."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-81, section: "8446", depth: Full}
    issues: [952]
    verification:
      - {kind: integration-test, ref: "join test"}
  - id: REQ-OPS-011
    area: OPS
    split_from: REQ-OPS-004
    statement: "A node that has been unreachable for a configured time MUST be removed from the cluster."
    rationale: "Autoscaling replaces nodes."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-81, section: "8446", depth: Full}
    issues: [952]
    verification:
      - {kind: integration-test, ref: "node replacement test"}
  - id: REQ-OPS-012
    area: OPS
    split_from: REQ-OPS-004
    statement: "A node MUST leave the cluster cleanly when scaled in."
    rationale: "Autoscaling replaces nodes."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-81, section: "8446", depth: Full}
    issues: [952]
    verification:
      - {kind: integration-test, ref: "scale-in test"}
  - id: REQ-OPS-005
    area: OPS
    statement: "sluis MUST migrate state between storage drivers."
    rationale: "Operators change storage."
    level: MUST
    source: v1-parity
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [804]
    superseded_by: [REQ-BACKUP-041]
    verification:
      - {kind: integration-test, ref: "migration round trip"}
  - id: REQ-OPS-006
    area: OPS
    statement: "When a dependency needed for a decision is unavailable, sluis MUST refuse the request with the documented error."
    rationale: "Fail closed with bounded impact."
    level: MUST
    source: stakeholder-ciam
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [1051]
    verification:
      - {kind: integration-test, ref: "dependency-down matrix"}
  - id: REQ-OPS-013
    area: OPS
    split_from: REQ-OPS-006
    statement: "When a dependency needed for a decision is unavailable, sluis MUST NOT take a weaker path."
    rationale: "Fail closed with bounded impact; cached group membership inside its bounded staleness window is not a weaker path, and past the window the request is refused (ADR 0017)."
    level: MUST
    source: stakeholder-ciam
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [1051]
    verification:
      - {kind: integration-test, ref: "no-weaker-path test"}
  - id: REQ-OPS-014
    area: OPS
    split_from: REQ-OPS-006
    statement: "Tokens already issued MUST remain valid until expiry when a dependency is unavailable."
    rationale: "Fail closed with bounded impact."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [1051]
    verification:
      - {kind: integration-test, ref: "issued-token validity test"}
  - id: REQ-OPS-007
    area: OPS
    statement: "In an installation that enforces a region policy, every table, bucket, key replica and index MUST be in an allowed region, checked at load and at deployment."
    rationale: "Residency is a legal requirement for some users."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [1061]
    verification:
      - {kind: integration-test, ref: "region guard test"}
  - id: REQ-OPS-008
    area: OPS
    statement: "A production profile MUST refuse every feature that exists only for tests."
    rationale: "Test doors must not ship."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [877]
    verification:
      - {kind: integration-test, ref: "production-profile refusal tests"}
  - id: REQ-OPS-015
    area: OPS
    statement: "A configuration field that carries authority MUST accept declared configuration only."
    rationale: "Authority is reviewed before it takes effect."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [864, 960]
    superseded_by: [REQ-DATA-024, REQ-DATA-015]
    verification:
      - {kind: integration-test, ref: "authority origin refusal test"}
  - id: REQ-OPS-016
    area: OPS
    statement: "An operator write to a field that declared configuration sets MUST be refused, except a tighten-only switch moved in its safe direction."
    rationale: "A declared value locks its field."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [960]
    superseded_by: [REQ-DATA-028]
    verification:
      - {kind: integration-test, ref: "declared lock test"}
  - id: REQ-OPS-017
    area: OPS
    statement: "An object defined both in declared configuration and as an operator-set record MUST be held until one definition is removed or adopted."
    rationale: "Neither side may silently take over the other."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [960]
    superseded_by: [REQ-DATA-002]
    verification:
      - {kind: integration-test, ref: "double definition hold test"}
  - id: REQ-OPS-018
    area: OPS
    statement: "Every write that the console makes or routes MUST be audited under the person who made it, with the previous and new version and the full new value apart from sealed values."
    rationale: "Every run-time write is authorised for a concrete person and audited under that name."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [960]
    verification:
      - {kind: integration-test, ref: "Operable-kind write audit record test"}
  - id: REQ-OPS-019
    area: OPS
    statement: "The state driver MUST refuse an operator-set write from any actor other than the owner of the record kind."
    rationale: "The owning actor validates its own records."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-103, section: "test plan", depth: Partial}
    issues: [960]
    superseded_by: [REQ-DATA-004]
    verification:
      - {kind: integration-test, ref: "operator-set writer refusal test"}
  - id: REQ-OPS-020
    area: OPS
    statement: "sluis MUST refuse a declared key for a value that it learns from an external system."
    rationale: "Configuring what the product knows creates two sources of truth."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [864]
    superseded_by: [REQ-DATA-002]
    verification:
      - {kind: integration-test, ref: "learned key refusal test"}
  - id: REQ-OPS-021
    area: OPS
    statement: "A declared configuration snapshot that fails validation on reload MUST be refused while the version in force stays."
    rationale: "A bad reload must not change a running installation."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [977]
    superseded_by: [REQ-DATA-084]
    verification:
      - {kind: integration-test, ref: "failed reload test"}
  - id: REQ-OPS-022
    area: OPS
    statement: "An operator MAY move a tighten-only switch in its safe direction even when declared configuration sets it."
    rationale: "A fast brake must not wait for a deployment."
    level: MAY
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [960]
    superseded_by: [REQ-DATA-030]
    verification:
      - {kind: integration-test, ref: "tighten-only switch test"}
  - id: REQ-OPS-023
    area: OPS
    statement: "`sluis config explain` MUST show the provenance of each effective value: the layer that set it and its version."
    rationale: "An operator must see where an effective value comes from."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [864, 1419, 1450]
    tests: [actors/store/tests/validate.rs, cli/sluis/configexplain_test.go]
    verification:
      - {kind: integration-test, ref: "explain provenance test: layer, version and source of each setting, a credential as its reference, a refused set not explained"}
  - id: REQ-OPS-024
    area: OPS
    statement: "On a push notification an integration MUST read the full state from the product's API instead of storing the notification's content."
    rationale: "A notification can be lost or reordered, and a full read cannot."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [805]
    verification:
      - {kind: integration-test, ref: "notify-then-pull test"}
  - id: REQ-OPS-025
    area: OPS
    statement: "An instance record MUST be issued only under a declared template, by a caller that a declared delegation policy permits."
    rationale: "Run-time self-service stays inside what a reviewer has read (ADR 0004)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1023]
    superseded_by: [REQ-DATA-025, REQ-DATA-026]
    verification:
      - {kind: integration-test, ref: "an issue with no covering template, and an issue by a caller no delegation permits, are both refused"}
  - id: REQ-OPS-026
    area: OPS
    statement: "The audit record of an issued instance MUST name the caller, the template, the slot values apart from secrets and the delegation that permitted it."
    rationale: "Without them a reviewer cannot tell why an instance exists (ADR 0004)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1023]
    superseded_by: [REQ-OPS-018]
    verification:
      - {kind: integration-test, ref: "issued instance audit record test"}
  - id: REQ-OPS-027
    area: OPS
    statement: "An instance record MUST be refused when a slot value lies outside the bound that its template declares."
    rationale: "An instance must not hold more authority than its template carries (ADR 0004)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1023]
    superseded_by: [REQ-DATA-025]
    verification:
      - {kind: integration-test, ref: "a slot value one step outside its bound is refused and one on the bound is accepted"}
  - id: REQ-OPS-028
    area: OPS
    statement: "A snapshot with a per-customer default outside the bound that its template declares MUST be refused while the version in force stays."
    rationale: "A default carries no authority, so it may not exceed its bound (ADR 0004)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1023, 977]
    superseded_by: [REQ-DATA-082]
    verification:
      - {kind: integration-test, ref: "out-of-bound default snapshot test"}
  - id: REQ-OPS-029
    area: OPS
    statement: "Declared configuration MUST be applied from the configuration service of its runtime as a whole versioned snapshot, swapped atomically and audited with its digest."
    rationale: "The reviewed commit and the applied configuration must be matchable (ADR 0004)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [977]
    superseded_by: [REQ-DATA-082]
    verification:
      - {kind: integration-test, ref: "snapshot swap and digest audit test on each runtime"}
  - id: REQ-OPS-030
    area: OPS
    statement: "Before the first relying party moves from v1, the cutover inventory MUST list every relying party of the v1 issuer, every consumer that keys on its sub, aud or groups claim, and how each relying party caches the key set: whether it honours max-age, whether it fetches again on an unknown kid, and the longest cache seen."
    rationale: "A consumer keyed on v1's e-mail sub breaks when the subject becomes opaque, and a relying party that caches the key set for an hour breaks the first rotation after the move (ADR 0015, ADR 0006)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1017]
    verification:
      - {kind: integration-test, ref: "the inventory run against a v1 fixture lists each relying party, each consumer of the sub claim and the key-set caching behaviour of each relying party"}
  - id: REQ-OPS-031
    area: OPS
    statement: "A reconciler pass MUST change an external system only while its process holds the lease for that target."
    rationale: "Two processes acting on one target would fight (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1012]
    verification:
      - {kind: integration-test, ref: "a pass after the lease passed to another holder changes nothing"}
  - id: REQ-OPS-032
    area: OPS
    statement: "A provisioner MUST refuse a change that carries a fencing token lower than one it has seen."
    rationale: "A paused holder must not write over its successor (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1012]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: a stale fencing token"}
  - id: REQ-OPS-033
    area: OPS
    statement: "A reconciler pass in dry run MUST NOT change the external system."
    rationale: "An operator reads a dry run before enabling a target (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1012]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: dry run against the fake vendor"}
  - id: REQ-OPS-034
    area: OPS
    statement: "A second reconciler pass on an unchanged desired state and an unchanged external system MUST make no change."
    rationale: "A pass that is not idempotent flaps and floods the vendor and the audit log (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1012]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: idempotence"}
  - id: REQ-OPS-035
    area: OPS
    statement: "A reconciler MUST NOT remove a member when the directory fact about that member is unavailable or stale."
    rationale: "An unreadable directory must not look like an empty one (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1012]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: UNAVAILABLE removes no one"}
  - id: REQ-OPS-036
    area: OPS
    statement: "A reconciler MUST hold a pass that would remove more than half of a container's members until an operator confirms it."
    rationale: "A directory error or a policy mistake must not empty a team unseen (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1012]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: breaker at the threshold"}
  - id: REQ-OPS-037
    area: OPS
    statement: "A provisioner outcome MUST carry a reason from the closed list, never vendor error text."
    rationale: "Vendor text could leak a tenant's data into a caller's response (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1012]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: outcome of a vendor error"}
  - id: REQ-OPS-038
    area: OPS
    statement: "A token-signing key of an installation MUST be a single-Region key."
    rationale: "A multi-Region key copies key material to another Region, against principle 1."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1061]
    verification:
      - {kind: integration-test, ref: "key description scan of a test installation"}
  - id: REQ-OPS-039
    area: OPS
    statement: "The documentation of an installation MUST state the recovery point and recovery time that its latest recovery drill measured, with the drill's date and versions."
    rationale: "No page promises a recovery time that no drill measured."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1142]
    manual_reason: "A statement in published documentation is checked by reading it."
    verification:
      - {kind: manual, ref: "documentation review"}
  - id: REQ-OPS-040
    area: OPS
    statement: "A recovery drill MUST run at least once a year and after a change to the backup or restore path."
    rationale: "A restore that has not been tried is not a recovery plan."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1142]
    manual_reason: "A drill is a procedure whose record is checked by reading it."
    verification:
      - {kind: manual, ref: "drill record review"}
  - id: REQ-OPS-041
    area: OPS
    statement: "`sluis config check` MUST refuse a bootstrap file that names a driver the installation does not offer for a port."
    rationale: "A driver that the runtime lacks cannot serve its port."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1157]
    verification:
      - {kind: integration-test, ref: "driver offer tests on each tested installation"}
  - id: REQ-OPS-042
    area: OPS
    statement: "`sluis config check` MUST refuse two configuration sources whose owned paths are equal or one inside the other."
    rationale: "Two owners of one key would make the effective value depend on an order."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-082, REQ-DATA-087]
    verification:
      - {kind: test-vectors, ref: "composition vectors: equal and nested pointers"}
  - id: REQ-OPS-043
    area: OPS
    statement: "`sluis config check` MUST refuse a source that owns a key of the install file that names where to read or whom to trust."
    rationale: "A source that could rewrite the list of sources or the roots would choose its own authority."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-082, REQ-DATA-087]
    verification:
      - {kind: test-vectors, ref: "composition vectors: base keys"}
  - id: REQ-OPS-044
    area: OPS
    statement: "The configuration loader MUST refuse an install file that holds a key under a path that a source owns, even with the same value."
    rationale: "A copy in the install file would hide a source that fails or changes."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-082, REQ-DATA-087]
    verification:
      - {kind: test-vectors, ref: "composition vectors: base holds an owned key"}
  - id: REQ-OPS-045
    area: OPS
    statement: "The configuration loader MUST refuse a source document that holds a key outside the paths its source owns."
    rationale: "A publisher writes only its own scope (ADR 0004)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-082, REQ-DATA-087]
    verification:
      - {kind: test-vectors, ref: "composition vectors: key outside scope"}
  - id: REQ-OPS-046
    area: OPS
    statement: "The configuration loader MUST refuse a source document that lacks one of the paths its source owns."
    rationale: "An absent subtree and an empty one must not mean the same."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-082, REQ-DATA-087]
    verification:
      - {kind: test-vectors, ref: "composition vectors: missing owned path"}
  - id: REQ-OPS-047
    area: OPS
    statement: "The configuration loader MUST give the same merged document and the same digest whatever the order of the sources."
    rationale: "No source wins, so the order of a list is not a way to set a value."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-082, REQ-DATA-087]
    verification:
      - {kind: test-vectors, ref: "composition vectors: order independence"}
  - id: REQ-OPS-048
    area: OPS
    statement: "The configuration loader MUST validate each source document against the strict profile and the schema of its owned subtrees before merging, and the merged document once after composition."
    rationale: "A bad document is named by its source, and a combination that no single document shows is still refused."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [1157]
    superseded_by: [REQ-DATA-082, REQ-DATA-087]
    verification:
      - {kind: test-vectors, ref: "composition vectors: per-document and merged verdicts"}
  - id: REQ-OPS-049
    area: OPS
    statement: "The configuration loader MUST verify the signature of a signed source over the received bytes before it parses them, and refuse a document without a valid ES384 signature from a key that the install file names."
    rationale: "An authority document is accepted for its publisher, not for the service that carried it (principle 4)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-49, section: "5.2", depth: Partial}
      - {id: ST-51, section: "3.4", depth: Partial}
    issues: [1157]
    superseded_by: [REQ-DATA-076, REQ-DATA-077]
    verification:
      - {kind: test-vectors, ref: "signed document vectors: unsigned, wrong key, other algorithm, forbidden header"}
  - id: REQ-OPS-050
    area: OPS
    statement: "`sluis config check` MUST refuse a source whose paths hold an authority field unless the source is verified as `host` or `signed`."
    rationale: "The access rules of a configuration service must not be the right to grant."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-082, REQ-DATA-087]
    verification:
      - {kind: test-vectors, ref: "composition vectors: service source owning authority"}
  - id: REQ-OPS-051
    area: OPS
    statement: "`sluis config check` MUST refuse a per-customer default from any source that is not a service source."
    rationale: "Per-customer defaults live in the configuration service and not in git (ADR 0004)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-082, REQ-DATA-087]
    verification:
      - {kind: test-vectors, ref: "composition vectors: defaults from a file or a signed source"}
  - id: REQ-OPS-052
    area: OPS
    statement: "sluis MUST refuse to start when its install file or a declared configuration source is missing, unreadable, unreachable, unsigned or invalid."
    rationale: "A check that cannot run is reported as not run, never as passed, and no cached copy stands in for a source."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-083]
    verification:
      - {kind: integration-test, ref: "start with an unreachable and an invalid source on the lambda installation"}
      - {kind: integration-test, ref: "start with a missing, an unreadable and an invalid install file or file source on each tested installation"}
  - id: REQ-OPS-053
    area: OPS
    statement: "sluis MUST keep the configuration in force and report it when a source is unreachable at reload."
    rationale: "An outage of a configuration service must not change a running installation."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [977]
    superseded_by: [REQ-DATA-084]
    verification:
      - {kind: integration-test, ref: "unreachable source on reload test"}
  - id: REQ-OPS-054
    area: OPS
    statement: "The configuration loader MUST refuse on reload a signed document whose sequence number is lower than the one in force."
    rationale: "A running process must not take an older signed document than the one it applies."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-080]
    verification:
      - {kind: test-vectors, ref: "signed document vectors: lower sequence"}
  - id: REQ-OPS-055
    area: OPS
    statement: "sluis MUST NOT write to a configuration service."
    rationale: "Declared configuration is delivered read-only (ADR 0004)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-015]
    verification:
      - {kind: integration-test, ref: "permission manifest and IAM policy tests: no write action on a configuration profile"}
  - id: REQ-OPS-056
    area: OPS
    statement: "The Go and Rust configuration loaders MUST give the same verdict on every composition vector."
    rationale: "Two languages read the same install file, so they must agree on how its sources are put together (principle 6)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-091]
    verification:
      - {kind: test-vectors, ref: "composition vector set run by both loaders"}
  - id: REQ-OPS-057
    area: OPS
    statement: "The configuration schema MUST give every path of declared configuration a reload class, `live` or `restart`, by an annotation on the path or on its nearest ancestor, with `restart` at the root."
    rationale: "One rule says what a reload may change, and a key that nobody has classified is the safe one (ADR 0004)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [977]
    superseded_by: [REQ-DATA-086]
    verification:
      - {kind: test-vectors, ref: "reload class vectors: annotated, inherited and unannotated paths"}
  - id: REQ-OPS-058
    area: OPS
    statement: "sluis MUST refuse a configuration reload that changes a path of class `restart`, as a whole, while the version in force stays."
    rationale: "A half-applied snapshot is a document that nobody reviewed or published (ADR 0004)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [977]
    superseded_by: [REQ-DATA-086]
    verification:
      - {kind: integration-test, ref: "reload with a restart change and a live change test on each runtime"}
  - id: REQ-OPS-059
    area: OPS
    statement: "A refused reload MUST be audited once for each refused digest, with the paths that need a restart and without their values."
    rationale: "An operator must see why a change did not apply, and a poll must not repeat the record."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [977]
    superseded_by: [REQ-DATA-086]
    verification:
      - {kind: integration-test, ref: "refused reload audit record test"}
  - id: REQ-OPS-060
    area: OPS
    statement: "`sluis config check` MUST list, given the previous version, every changed path whose reload class is `restart`."
    rationale: "A pipeline must learn before it publishes that a running installation would refuse the change."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [977]
    superseded_by: [REQ-DATA-086]
    verification:
      - {kind: test-vectors, ref: "reload class vectors: changed paths against a previous version"}
  - id: REQ-OPS-061
    area: OPS
    statement: "`sluis config check` SHOULD warn about a configuration source that owns a path of class `restart`."
    rationale: "A restart change in a source is refused at reload and holds back every live change in the same snapshot."
    level: SHOULD
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [977]
    superseded_by: [REQ-DATA-086]
    verification:
      - {kind: test-vectors, ref: "reload class vectors: a source owning a restart path"}
  - id: REQ-OPS-062
    area: OPS
    statement: "A field marked tighten-only MUST have the reload class `live`."
    rationale: "A brake must not wait for a restart (ADR 0004)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [977]
    superseded_by: [REQ-DATA-086]
    verification:
      - {kind: test-vectors, ref: "reload class vectors: tighten-only fields"}
  - id: REQ-OPS-063
    area: OPS
    statement: "A lambda function MUST apply a changed `live` path from an `appconfig` source at the first invocation after the poll interval, without a new function version."
    rationale: "A lambda installation gets live policy and clients from the configuration service, because a layer cannot change under a running function (ADR 0005)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: ["serverless"]
    standards: []
    issues: [977]
    superseded_by: [REQ-DATA-093]
    verification:
      - {kind: integration-test, ref: "live policy and client change on the lambda installation test"}
  - id: REQ-OPS-064
    area: OPS
    statement: "The loader MUST reload a `file` source when its file is replaced, including the swap of a mounted ConfigMap."
    rationale: "The `file` driver signals by notify, so a replaced file is seen without a poll (ADR 0005)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: ["bare-metal", "kubernetes"]
    standards: []
    issues: [977]
    superseded_by: [REQ-DATA-092]
    verification:
      - {kind: integration-test, ref: "file replace and ConfigMap swap reload test"}
  - id: REQ-OPS-065
    area: OPS
    statement: "The audit record of a start or reload MUST name the SHA-384 of the payload of each source and, for a signed source, its sequence number."
    rationale: "A reviewer finds an older signed document at a cold start by comparing the digest and the sequence number with the reviewed branch (ADR 0005)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1157]
    superseded_by: [REQ-DATA-085]
    verification:
      - {kind: integration-test, ref: "audit record of a start names digest and sequence number test"}

  # ---- reconcilers (decision 0026)
  - id: REQ-OPS-066
    area: OPS
    statement: "A reconciler MUST act only on the targets that the ReconcileTarget durable kind declares."
    rationale: "A target is a record inside the bounds that config and reviewed policy set, so a reconciler cannot be pointed at a system nobody approved (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a reconciler pass for a target absent from ReconcileTarget changes nothing"}
  - id: REQ-OPS-067
    area: OPS
    statement: "An operator MUST be able to pause a reconciler with a Switch."
    rationale: "A pause is a tightening, so it takes effect at once and lasts (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a Switch for a target stops its next pass and survives a restart"}
  - id: REQ-OPS-068
    area: OPS
    statement: "A provisioner MUST reconcile its target to the union of the current DesiredState parts of that target."
    rationale: "A target with several sources has one part per source, and the union is what the target should hold (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a pass over two DesiredState parts changes the external system to match their union"}
  - id: REQ-OPS-069
    area: OPS
    statement: "A directory adapter MUST write the DesiredState parts of a connection under the lease it holds for refreshing that connection's directory, straight after each refresh."
    rationale: "The lease already gives one writer per connection, so no actor and no scheduler is added (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a directory refresh under the lease ends with one DesiredState part per target and source, and a process without the lease writes none"}
  - id: REQ-OPS-070
    area: OPS
    statement: "A directory adapter MUST write a DesiredState part from the answer of the policy batch membership method and from nothing else."
    rationale: "Writing the answer is executing, so the adapter decides no membership (ADR 0025, ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a part holds exactly the members policy answered for a fake directory, whatever the directory also holds"}
  - id: REQ-OPS-071
    area: OPS
    statement: "A reconciler MUST NOT remove a person whose source has no current DesiredState part."
    rationale: "A missing or stale part is unreadable, never empty (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: a missing or stale part removes no one and is reported"}
  - id: REQ-OPS-072
    area: OPS
    statement: "A reconciler MUST NOT remove a person from a target unless the person's own directory has stopped vouching for them."
    rationale: "A person absent from another source's part is not gone from their own directory (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: a person named by one part and absent from another is not removed"}
  - id: REQ-OPS-073
    area: OPS
    statement: "A DesiredState part MUST be sealed under the data key of the tenant that owns the container the target describes."
    rationale: "The owner's exit shreds every part of its targets, and no provisioner opens another tenant's key (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a part for a target of tenant A, written by the directory of tenant B, opens only with the data key of tenant A"}
  - id: REQ-OPS-074
    area: OPS
    statement: "A directory adapter MUST write a DesiredState part into another company's tenant only when the owner's ReconcileTarget lists the connection as a source and the connection's company policy allows the group in that target."
    rationale: "A share that one side has not declared must write nothing (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a write across tenants is refused when either declaration is missing and succeeds when both exist"}
  - id: REQ-OPS-075
    area: OPS
    statement: "A reconciler pass MUST report a share that only one side has declared."
    rationale: "The people on both sides need to see what is missing, because nothing is written (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a pass for a target with a one-sided share reports the missing declaration and changes nothing"}
  - id: REQ-OPS-076
    area: OPS
    statement: "A DesiredState part written across tenants MUST carry only the vendor account ids of the declared people and the source tenant's audit pseudonym of each."
    rationale: "Only the declared people cross between companies, by the reference the container needs and the one the source's audit record needs (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a part written into another tenant holds the vendor account ids and source pseudonyms of the declared people and no name, address or subject"}
  - id: REQ-OPS-077
    area: OPS
    statement: "A DesiredState write across tenants MUST be audited in the tenant that writes and in the tenant that owns the target."
    rationale: "Each company can see what was written about its people and into its container (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a write across tenants leaves one audit record in each tenant"}
  - id: REQ-OPS-078
    area: OPS
    statement: "The operator MUST run a rotation drill in a staging installation before each planned production rotation of a token-signing key and at least once a year, and list the verifiers that fail."
    rationale: "A verifier that breaks the cache or discovery rules is found before a rotation and not by an outage, though a staging drill sees only the verifiers that are pointed at staging (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    manual_reason: "A drill is a procedure whose record is checked by reading it."
    verification:
      - {kind: manual, ref: "drill record review: the date of the drill, the planned rotation it precedes, and the verifiers that failed to see the new key, with their ua_product and asn"}
  - id: REQ-OPS-079
    area: OPS
    statement: "The documentation MUST contain an incident page that states, for each key kind, the command, the effect, what consumers see and the time that a drill measured with its date and versions."
    rationale: "An operator under pressure needs one page, and a figure without a date cannot be judged (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1363]
    runtimes: all
    standards: []
    features: ["design"]
    manual_reason: "A page is judged by reading it."
    verification:
      - {kind: manual, ref: "page review: every key kind has a row, and an empty time is marked as not yet measured"}
  - id: REQ-OPS-080
    area: OPS
    statement: "A key-compromise drill for the token-signing key MUST run at least once a year and after a change to the key path, and record the time from declaration to a verifier's refusal."
    rationale: "A procedure that has not been run is not a procedure, and the figure on the incident page comes from it (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1363]
    runtimes: all
    standards: []
    features: ["design"]
    manual_reason: "A drill is a procedure whose record is checked by reading it."
    verification:
      - {kind: manual, ref: "drill record review: the date, the versions, the installation, the measured time and the verifiers that failed"}
  - id: REQ-OPS-081
    area: OPS
    statement: "When a tenant starts erasing, its directory adapter MUST replace every DesiredState part it wrote into another tenant with a withdrawal at once, whatever ErasureHold covers the tenant's records."
    rationale: "The parts are sealed under the owner's key, so the source's crypto-shred does not reach them, deleting them would hold the people in place, and a hold keeps records but gives no access (ADR 0008, ADR 0026, ADR 0034)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "erasing tenant B, with and without an ErasureHold, at once leaves a withdrawal at the kind's maximum lifetime in tenant A for every target that B fed"}
  - id: REQ-OPS-082
    area: OPS
    statement: "A provisioner MUST remove from its container every person that a withdrawal names and no other current part of the target names, in strict and in extend mode."
    rationale: "A withdrawal is the person's own directory ceasing to vouch, and it names only people that the share put in the target (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: a withdrawal removes the people it names in both modes, and keeps a person that another part still names"}
  - id: REQ-OPS-083
    area: OPS
    statement: "A tenant's exit MUST wait before its crypto-shred until its own audit log holds the outcome of every withdrawal it wrote, or until 75 minutes have passed since the last one."
    rationale: "The owners' reconcilers remove the people, and the source cannot read the owners' configuration, so the wait is the removal bound at its one-hour ceiling plus 15 minutes for the delivery of the audit records (ADR 0008, ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "an exit with two withdrawals shreds after both outcomes are in its log, and an exit whose owner never passes shreds once 75 minutes have passed and not before"}
  - id: REQ-OPS-084
    area: OPS
    statement: "A tenant's exit MUST record each removal that the owners did not make within the wait as a residual that names the target and the count, never the people."
    rationale: "What an owner's breaker held or the external system keeps is data outside sluis, and the exit must say so without naming anyone (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "an exit whose withdrawal the owner's breaker holds ends with a residual for that target and count, and no vendor identifier in the exit record"}
  - id: REQ-OPS-085
    area: OPS
    statement: "A provisioner MUST NOT store any data about a person from another tenant's source beyond the vendor's account id that its container needs."
    rationale: "The owner holds the minimal reference only, never the source's directory data, and an e-mail address that a Slack Connect invitation needs is used only in the call that sends it (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "after a pass, a held change and a withdrawal for a part from tenant B, every item of tenant A about B's people holds a vendor account id and no name, e-mail address, group or subject"}
  - id: REQ-OPS-086
    area: OPS
    statement: "A provisioner SHOULD start a pass of a target when a watch of DesiredState in the owner's tenant delivers a change to one of the target's parts."
    rationale: "A source's change then reaches the container in seconds after the part is written, where the runtime pushes changes (ADR 0005, ADR 0026)."
    level: SHOULD
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal", "kubernetes"]
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a part written for a target starts a pass of that target before its next full pass is due"}
  - id: REQ-OPS-087
    area: OPS
    statement: "A reconciler MUST run a full pass of every target at least once per full-pass interval of its ReconcileTarget, whatever the watch delivers."
    rationale: "The full pass catches what a lost stream or an expired resume point missed, and it is the only path where nothing is pushed (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "with the watch off, a part change is applied by a full pass within the target's interval"}
  - id: REQ-OPS-088
    area: OPS
    statement: "A reconciler MUST refuse a ReconcileTarget whose full-pass interval is longer than one hour."
    rationale: "The ceiling bounds every removal and lets a source's exit bound its wait without reading the owner's configuration (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a ReconcileTarget with a full-pass interval of 61 minutes is refused, and one of 60 minutes is accepted"}
  - id: REQ-OPS-089
    area: OPS
    statement: "A reconciler MUST apply or hold a removal within one full-pass interval of the DesiredState write that carries it."
    rationale: "A removal in a source directory must reach the owner's container within a stated bound (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a part from another tenant that drops a suspended person leads, within the target's interval, to the removal at a fake vendor or to a held change"}
  - id: REQ-OPS-092
    area: OPS
    statement: "A provisioner MUST NOT promote a person to an administrator role, nor add a person to a group that confers one, on a directory fact that is stale or that the directory does not vouch for."
    rationale: "An answer the directory cannot vouch for may be wrong, and an administrator added by mistake is worse than a member left out (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: with a stale or unvouched fact the pass adds the person as a member and never as an administrator, and removes and demotes no one"}
  - id: REQ-OPS-093
    area: OPS
    statement: "A reconciler MUST hold a pass that would remove, demote or suspend the last active administrator of a container until an operator confirms it."
    rationale: "A container with no administrator cannot be repaired by sluis or by its members (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: a pass that would remove, demote or suspend the only active administrator is held and changes nothing"}
  - id: REQ-OPS-094
    area: OPS
    statement: "A reconciler MUST hold a pass that would demote more than one administrator of a container until an operator confirms it."
    rationale: "Demoting several administrators in one pass is the shape of a wrong desired state (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: a pass that demotes two administrators is held; a pass that demotes one is applied"}
  - id: REQ-OPS-095
    area: OPS
    statement: "A reconciler MUST NOT demote or suspend the account whose credential it uses."
    rationale: "An account that loses its administrator role takes the reconciler's access away, and the container can no longer be reconciled (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: a desired state that would demote or suspend the credential's own account leaves that account an administrator and reports the change as held"}
  - id: REQ-OPS-096
    area: OPS
    statement: "A reconciler MUST hold a pass that would suspend more than 3 accounts, or more than the limit that the target declares, until an operator confirms it."
    rationale: "A suspension cuts a person off from every container of the vendor, so a mass suspension must be seen first (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: a target that declares no limit holds a pass that suspends 4 accounts and applies one that suspends 3; a declared limit replaces the 3"}
  - id: REQ-OPS-097
    area: OPS
    statement: "A provisioner MUST hold the whole target when, at the start of a pass, the credential of the connection no longer holds the vendor role that the pass needs."
    rationale: "A key of an account that was demoted or suspended still authenticates and then fails in the middle of a pass, or changes less than it should (ADR 0026, ADR 0025)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: the fake vendor demotes the credential's account; the pass holds the target with a reason from the closed list and makes no change"}
  - id: REQ-OPS-098
    area: OPS
    statement: "The confirmation of a held change MUST name the set of changes it confirms and lapse within 24 hours."
    rationale: "A confirmation that stays valid could approve a different change made later (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: a confirmation of one change set does not release a different set, and a confirmation older than 24 hours releases nothing"}
  - id: REQ-OPS-090
    area: OPS
    statement: "A change that a provisioner makes or holds in a container because of a part from another tenant's source MUST be audited in the owner's tenant and in the source's tenant."
    rationale: "Each company can show what happened to its people or in its container, and the source's exit waits for its own record (ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a removal caused by tenant B's part in tenant A's target leaves one record sealed under A's evidence key and one sealed under B's"}
  - id: REQ-OPS-091
    area: OPS
    statement: "A provisioner MUST identify a person of another tenant's source by the vendor identifier in that source's part, never by a sluis subject."
    rationale: "A person has a different subject in each tenant, so the link goes through the source's directory connection (ADR 0026, ADR 0034)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: conformance-suite, ref: "provisioner suite: a person with different subjects in the two tenants is reconciled by the part's vendor identifier alone"}

  # ---- company-issued OpenPGP keys on staff GitHub accounts (decision 0042)
  - id: REQ-OPS-099
    area: OPS
    statement: "adapter-github MUST put the certificate of a person's active binding for a company on that person's GitHub account, adding it when it is absent and replacing it when the account holds a copy that lacks a subkey, user ID, binding signature or expiry of the binding."
    rationale: "GitHub does not follow a key's renewal, so a key uploaded once goes stale and the person's commits turn Unverified (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "against a fake GitHub: an absent key is added, a key whose copy lacks the renewed binding is replaced, and a second pass makes no call that changes the account"}
  - id: REQ-OPS-100
    area: OPS
    statement: "adapter-github MUST NOT add, change or remove a key on a person's GitHub account that is not a company key."
    rationale: "A personal key belongs to the person, and the company manages only the keys it issued (ADR 0042, GH1 A)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "an account with a personal key whose user ID carries a company address keeps that key through an add, an update, a removal and a leaver's pass"}
  - id: REQ-OPS-101
    area: OPS
    statement: "adapter-github MUST add a key to a GitHub account only from the certificate of an active binding of the person whose account it is."
    rationale: "The write permission on a person's keys would let a wrong binding put a key on an account and sign commits as that person (ADR 0042)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a certificate whose binding has ended, one that is held by no binding and one that belongs to another person's binding cause no call that adds a key to the account"}
  - id: REQ-OPS-102
    area: OPS
    statement: "adapter-github MUST NOT remove a key from a GitHub account because its binding records are unreadable or older than their time to live."
    rationale: "Unreadable binding records must never look like no bindings (ADR 0042, ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "with unreadable and expired binding records a pass removes no key and reports them as unreadable"}
  - id: REQ-OPS-103
    area: OPS
    statement: "adapter-github MUST remove the company keys of a person from the person's GitHub account when the person's binding has ended or the directory marks the person as left, before it deletes the person's tokens."
    rationale: "A leaver's company key must not stay on the account, and the tokens that remove it must outlive the removal (ADR 0042, G5 A)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a person whose binding ended and a person marked left both lose their company keys, the outcome is audited, and only then are the tokens deleted"}
  - id: REQ-OPS-104
    area: OPS
    statement: "adapter-github MUST mark a person's key authorisation revoked, delete the stored tokens and raise an alert only after a call to GitHub with the person's current token has confirmed that the authorisation is gone."
    rationale: "A revoked authorisation leaves keys on an account that sluis can no longer manage, so the gap must be seen (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "an event, and a 401 with no event, each lead to a probe: a failed probe marks the item revoked, deletes both tokens, audits and alerts; a probe that succeeds leaves it active"}
  - id: REQ-OPS-105
    area: OPS
    statement: "adapter-github MUST store a person's GitHub user token and refresh token sealed under the tenant's data key."
    rationale: "A token that reaches a personal account is a sharp credential, and a copy of the store must not yield it (ADR 0042, ADR 0025)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "the stored GitHubKeyAuthorization item is ciphertext and holds neither token in clear"}
  - id: REQ-OPS-106
    area: OPS
    statement: "adapter-github MUST write the token pair that a refresh returns before it uses the new user token."
    rationale: "A refresh token works once, so a pair that is used but not written is lost and the person must authorise again (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "against a fake GitHub that honours a refresh token once: two concurrent passes under the lease burn no pair, and a failed write stops the pass before the new token is used"}
  - id: REQ-OPS-107
    area: OPS
    statement: "adapter-github MUST NOT record a user token, a refresh token or a client secret in an audit record, a log line or a span."
    rationale: "Nothing that opens a personal account may leave the sealed item (ADR 0042, ADR 0025)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a pass with known token values leaves none of them in its audit records, log output and trace attributes"}
  - id: REQ-OPS-108
    area: OPS
    statement: "adapter-github MUST mark a person's key authorisation refresh-lost, as a state apart from revoked, and raise an operator task to ask the person to authorise again, when a refresh was begun and its answer was never written or a refresh is then refused."
    rationale: "A crash between GitHub's answer and the write loses the pair about as often as a refresh happens, and the person did nothing wrong (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a process killed after GitHub's refresh answer and before the write leaves the item refresh-lost with an operator task and no revoked alert; nothing changes for the person until they authorise again"}
  - id: REQ-OPS-109
    area: OPS
    statement: "adapter-github MUST mark a key authorisation revoked only by a write conditional on the version of the item that it read."
    rationale: "A stale process with an old token pair must not delete the newer pair that another process wrote (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "process A holds pair P1, its lease lapses, B writes P2, A's call gets 401: A's conditional write conflicts, A re-reads P2 and leaves the item active"}
  - id: REQ-OPS-110
    area: OPS
    statement: "adapter-github MUST hold a pass that would remove more than half of the company keys of all people, or more than half of one person's company keys without an explicit cause."
    rationale: "A wrong keyring or a mass change must stop before it empties the accounts (ADR 0042, ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a keyring that drops most people, and one that drops most of one person's keys with no left state and no withdrawal, are held and reported with no key removed"}
  - id: REQ-OPS-111
    area: OPS
    statement: "adapter-github MUST NOT hold, for the breaker, the removal of the company keys of a person whom the directory marks left or the removal of a withdrawn fingerprint."
    rationale: "A leaver with one key is more than half of their keys and must still lose it at once (ADR 0042, G5 A)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a person marked left with a single company key loses it in one pass with the breaker armed"}
  - id: REQ-OPS-112
    area: OPS
    statement: "adapter-github MUST remove only a key that it added or that a binding it held has ended."
    rationale: "A wrong binding record must not be able to delete a personal key by naming its fingerprint (ADR 0042, GH1 A)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a binding record that names the fingerprint of a personal key causes no delete, and a key that sluis added and whose binding then ends is deleted"}
  - id: REQ-OPS-113
    area: OPS
    statement: "adapter-github MUST add a certificate only to the pinned account of the person whose active binding holds that certificate."
    rationale: "A wrong or tampered binding of one person must not put a certificate on another person's account, where commits signed as that person would show Verified (ADR 0042)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a certificate held by another person's binding, or by no binding, is not added to the person's account"}
  - id: REQ-OPS-114
    area: OPS
    statement: "adapter-github MUST refuse a pass that exceeds the limits of the target for company certificates per person per company, size of a certificate and changes to one account."
    rationale: "Bounds on a pass limit what a compromised keyring source can do in one run (ADR 0042)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "more than one certificate for one person and company, a certificate over the size cap and a pass over the change cap are each refused with a reason and change nothing"}
  - id: REQ-OPS-115
    area: OPS
    statement: "adapter-github MUST identify a key on a GitHub account by the full version 4 fingerprint that it computes from the key's armoured public key."
    rationale: "GitHub's key object has no fingerprint field, a short key id can collide and a name is set by the uploader (ADR 0042)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "two keys with the same key id and different fingerprints, and a personal key named like a company key, are told apart: only the fingerprint match is a company key"}
  - id: REQ-OPS-116
    area: OPS
    statement: "adapter-github MUST delete the old record of a key in an update only when its id differs from the id that the add returned."
    rationale: "If GitHub answers a second upload with the existing record, deleting the old one would remove the only copy (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "against a fake GitHub that answers a repeat upload with the existing record: no delete is made, and the account still holds the key after the pass"}
  - id: REQ-OPS-117
    area: OPS
    statement: "adapter-github MUST accept a github_app_authorization event only when its X-Hub-Signature-256 verifies against the webhook secret and its sender is the pinned GitHub user."
    rationale: "An unauthenticated or foreign event must not set a person's state (ADR 0042)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "an event with a bad signature, one for another sender, and one for the pinned sender are handled in turn: only the last leads to a probe, and no event is read for an action field"}
  - id: REQ-OPS-118
    area: OPS
    statement: "adapter-github MUST NOT mark an authorisation revoked or raise a revocation alert for the event that follows its own revocation of the grant of a person who has left."
    rationale: "The leaver step ends the grant itself and must not look like a person's revocation (ADR 0042, G5 A)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a leaver pass that revokes the grant leaves the item left, and the event that GitHub then sends changes nothing and raises no alert"}
  - id: REQ-OPS-119
    area: OPS
    statement: "adapter-github MUST refuse an authorisation of the key App from a GitHub account other than the one pinned for the person, until an operator releases the pin."
    rationale: "A person must not move their company keys to another account (ADR 0042)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a second authorisation from another GitHub account is refused, the pinned account is unchanged, and it succeeds only after the operator releases the pin"}
  - id: REQ-OPS-120
    area: OPS
    statement: "adapter-github MUST NOT change a GitHub account in a key-sync pass until the operator has enabled the target."
    rationale: "A new job over personal accounts starts by showing what it would do (ADR 0042, ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a pass on a target not enabled changes nothing and lists the adds and removes that an enabled pass then makes"}
  - id: REQ-OPS-121
    area: OPS
    split_from: REQ-OPS-109
    statement: "adapter-github MUST read the item again and decide again when its conditional write of the revoked state conflicts."
    rationale: "Another process may have written a newer token pair, and a stale process must not delete it (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "process A holds pair P1, its lease lapses, B writes P2, A's call gets 401: A's conditional write conflicts, A re-reads P2 and leaves the item active"}
  - id: REQ-OPS-122
    area: OPS
    split_from: REQ-OPS-115
    statement: "adapter-github MUST NOT match a key on a GitHub account by its key id, its name or an email of the key object."
    rationale: "A short key id can collide and a name is set by whoever uploaded the key (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "two keys with the same key id and different fingerprints, and a personal key named like a company key, are told apart: only the fingerprint match is a company key"}
  - id: REQ-OPS-123
    area: OPS
    split_from: REQ-OPS-116
    statement: "adapter-github MUST list the account after an update and confirm that the fingerprint of the key is present."
    rationale: "The check catches an update that left the account without the key (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "after an update against a fake GitHub the account is listed, and a missing fingerprint fails the pass and is audited"}
  - id: REQ-OPS-124
    area: OPS
    split_from: REQ-OPS-117
    statement: "adapter-github MUST treat a github_app_authorization event as a hint that a call to GitHub confirms."
    rationale: "An event alone must not set a person's state (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "an event followed by a call that succeeds leaves the item active"}
  - id: REQ-OPS-125
    area: OPS
    split_from: REQ-OPS-120
    statement: "adapter-github MUST return, in a dry run, the changes that an apply of the same pass would make."
    rationale: "The operator reads a dry run before enabling the target (ADR 0042, ADR 0026)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a pass on a target not enabled lists the adds and removes that the enabled pass then makes"}
  - id: REQ-OPS-126
    area: OPS
    split_from: REQ-OPS-117
    statement: "adapter-github MUST NOT rely on an action field of a github_app_authorization event."
    rationale: "GitHub's page lists no action field for the event (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "an event whose payload has an action value of revoked and one with no action both lead to the same probe, and only the probe sets the state"}
  - id: REQ-OPS-127
    area: OPS
    statement: "adapter-github MUST keep at most one company certificate per person per company on the person's GitHub account."
    rationale: "A person has one primary per company with card-born subkeys under it, so a second or a lost card changes the certificate and never adds a key (ADR 0042, BD1 B, BD2 B)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a person with a second card, then a lost card, has one company certificate on the account after each pass, replaced each time, and a personal key is untouched"}
  - id: REQ-OPS-128
    area: OPS
    statement: "adapter-github MUST NOT put the certificate of a customer tenant's person on GitHub unless that tenant's policy enables it."
    rationale: "Only staff are synced; customers get no key on a personal account unless their tenant later says so (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a customer tenant's person with an active binding gets no call to GitHub while the tenant's policy does not enable the sync"}
  - id: REQ-OPS-129
    area: OPS
    split_from: REQ-OPS-127
    statement: "adapter-github MUST replace a person's company certificate on GitHub when the person's subkeys, user ID or expiry change."
    rationale: "A second card or a lost card changes the subkeys under the one primary, and a change of address or a renewal changes its user ID or expiry, so GitHub's copy must follow (ADR 0042, ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "adding a card and losing a card each replace the certificate on the account, a change of the user ID and a renewal of the expiry do the same, and the account holds the new copy after the pass"}
  - id: REQ-OPS-130
    area: OPS
    statement: "`sluis config check --against OLD` MUST warn about each setting of the bootstrap file that differs from the previous file, naming its path and never its value."
    rationale: "A changed bootstrap file is a restart of store@, so a pipeline that must not publish one needs to see it before it publishes (ADR 0005, bootstrap-file.md)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [864, 1419]
    tests:
      - actors/store/tests/validate.rs
      - cli/sluis/configcheck_test.go
    verification:
      - {kind: integration-test, ref: "a timeout, a socket and a kid that differ are three warnings that name their paths and print no value, the exit is 0, and a previous file that cannot be read fails"}
  - id: REQ-OPS-131
    area: OPS
    statement: "`sluis doctor` MUST warn when the kernel is older than 5.18."
    rationale: "A virtual machine cloned from a running one keeps the generator state of the original on a kernel that does not reseed, so a key made there is predictable (ADR 0006, Algorithms)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [867]
    tests: [cli/sluis/doctor_test.go]
    verification:
      - {kind: integration-test, ref: "5.10, 4.19 and 5.17 warn; 5.18, 6.18 and 7.0 pass; an unreadable release is not-run (TestDoctorWarnsOnAKernelBelow518)"}
  - id: REQ-OPS-132
    area: OPS
    statement: "`sluis doctor` MUST fail when the kernel's generator is not initialised."
    rationale: "A key made before the generator is initialised is weak (ADR 0006, Algorithms)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [867]
    tests: [cli/sluis/doctor_test.go]
    verification:
      - {kind: integration-test, ref: "an uninitialised generator is a fail with exit 3; one that cannot be asked is not-run (TestDoctorFailsOnAGeneratorThatIsNotInitialised...)"}
  - id: REQ-OPS-133
    area: OPS
    statement: "`sluis doctor` MUST report a missing hardware generator as a note and not as a failure or a warning."
    rationale: "A SoC's hardware generator is left out of a mainline kernel on purpose, and the kernel's own generator is sluis's only source (ADR 0006, Algorithms)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [867]
    tests: [cli/sluis/doctor_test.go]
    verification:
      - {kind: integration-test, ref: "no hardware generator, in every form the kernel says it, is an ok with a note; a present one is named and bounded (TestDoctorFailsOnAGenerator...)"}
  - id: REQ-OPS-134
    area: OPS
    statement: "`sluis doctor` MUST warn when systemd is older than 252."
    rationale: "The generated units rely on what 252 provides, and an older image is a declared exception (ADR 0013, Supported platforms)."
    level: MUST
    source: design-decision
