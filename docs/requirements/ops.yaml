  - id: REQ-OPS-137
    area: OPS
    statement: "`sluis doctor` MUST exit 3 when a check fails."
    rationale: "One scheme of exit codes lets a pipeline tell a refusal from a notice (cli.md, Exit codes)."
    level: MUST
    source: design-decision
    status: done
