  - id: REQ-OPS-135
    area: OPS
    statement: "`sluis doctor` MUST report the systemd check as not run where systemd is not the init of the host."
    rationale: "A container has no systemd to ask, and a check that did not run must not read as passed (ADR 0013, Supported platforms)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
