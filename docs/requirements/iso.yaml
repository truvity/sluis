# ISO: Isolation between boundaries, actors, companies and tenants.
# Each record is a control from the threat model (docs/security/threat-model.md). Its test vectors name the
# threat (T-n) and the check that must refuse: the store's rule with the grant sealed for the tenant, key@'s
# grant check, the holder's own check (a driver's or backend's check of the caller's platform identity), or
# physical separation at level L3 or L4. A vector runs with the other checks switched off in the isolation
# harness, so each check is proven on its own. The checks that used to sit in a library of every actor are gone
# (decision 0002): the two independent checks of decision 0007 and the ladder of decision 0008 replace them.
schema: 1
area: ISO
requirements:
  # ---- the harness
  - id: REQ-ISO-001
    area: ISO
    statement: "The isolation harness MUST be able to run every isolation vector with one chosen layer enabled and the other layers switched off."
    rationale: "A layer that is only ever tested behind another layer is not tested at all."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-103, depth: Partial}
    issues: [877, 851]
    superseded_by: [REQ-ISO-083]
    verification:
      - {kind: integration-test, ref: "harness self-test: each layer switch is observed off in the driver, the backend policy and the store layout before a vector runs"}
  - id: REQ-ISO-002
    area: ISO
    statement: "The isolation harness MUST reject as void a vector whose attempt is refused even with every check switched off."
    rationale: "A vector that cannot succeed with no protection proves nothing when it fails with protection."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-103, depth: Partial}
    issues: [877]
    verification:
      - {kind: integration-test, ref: "harness self-test: a deliberately broken vector (wrong prefix spelling) is reported void, not passed"}

  # ---- layer 1: the port library
  - id: REQ-ISO-003
    area: ISO
    statement: "The port library MUST derive the scope of every keys, state, blob and transport call from the calling actor's own identity and boundary, never from a field of the request."
    rationale: "A scope taken from the request lets any caller name another boundary's data."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-103, depth: Partial}
    issues: [851, 863]
    superseded_by: [REQ-DATA-013]
    verification:
      - {kind: test-vectors, ref: "T-11 layer 1, layers 2 and 3 off: actor X passes boundary env-b in a request field; the call is scoped to X's own prefix and env-b is never reached"}
      - {kind: test-vectors, ref: "T-12 layer 1, layers 2 and 3 off: actor X asks the blob port for an object under actor Y's prefix; refused by the library"}

  # ---- keys
  - id: REQ-ISO-004
    area: ISO
    statement: "A keys driver MUST refuse a sign, decrypt or unwrap call for a key outside the caller's boundary and purpose, judged by the caller's platform identity."
    rationale: "The driver's own check holds when the actor's library is bypassed or compromised."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-103, depth: Partial}
    issues: [800, 851]
    superseded_by: [REQ-KEYS-029, REQ-KEYS-030]
    verification:
      - {kind: test-vectors, ref: "T-8 layer 2, layers 1 and 3 off: ca@env-a requests env-b's CA key; refused by the key-holder ACL or the KMS key policy"}
      - {kind: test-vectors, ref: "T-8 layer 2, layers 1 and 3 off: ca@env-a requests its own boundary's token-signing key; refused (wrong purpose)"}
  - id: REQ-ISO-005
    area: ISO
    statement: "At level L4, a boundary's authority keys MUST be held in that boundary's own account, cluster or hosts."
    rationale: "Physical separation still holds when a key policy or an ACL is wrong."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [963, 800]
    verification:
      - {kind: test-vectors, ref: "T-8 physical separation alone: ca@env-a's credentials call env-b's key; refused because the key is in env-b's account or hosts"}
  - id: REQ-ISO-006
    area: ISO
    statement: "key@ MUST sign for the ca purpose only a parseable TBSCertificate that is within the purpose's constraints."
    rationale: "Content-aware signing stops a caller that holds the CA key from using it for another protocol or a wider certificate."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: ["bare-metal", "kubernetes"]
    actors: [key]
    standards:
      - {id: ST-62, section: "4.1", depth: Partial}
    issues: [913, 914]
    verification:
      - {kind: test-vectors, ref: "T-9: the ca purpose is asked to sign a JWS signing input; refused (content-aware)"}
      - {kind: test-vectors, ref: "T-9: the ca purpose is asked to sign a TBSCertificate with basicConstraints CA true outside its constraints; refused"}
      - {kind: test-vectors, ref: "x509-limbo and Wycheproof malformed-DER inputs fed to the ca purpose; every unparseable input refused"}
  - id: REQ-ISO-007
    area: ISO
    statement: "key@ MUST sign for the ssh-user and ssh-host purposes only an OpenSSH certificate body."
    rationale: "An SSH CA key that signs arbitrary bytes can be turned into a signer for any protocol."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal", "kubernetes"]
    actors: [key]
    standards:
      - {id: ST-65, depth: Partial}
    issues: [913, 914]
    verification:
      - {kind: test-vectors, ref: "T-9: the ssh-ca purpose is asked to sign a TBSCertificate; refused (content-aware)"}
  - id: REQ-ISO-008
    area: ISO
    statement: "key@ MUST sign for a token purpose only a JWS signing input."
    rationale: "A token key that signs certificates would let a token signer mint a CA."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal", "kubernetes"]
    actors: [key]
    standards:
      - {id: ST-49, section: "5.1", depth: Partial}
    issues: [869, 914]
    verification:
      - {kind: test-vectors, ref: "T-9: a token purpose is asked to sign a TBSCertificate or an OpenSSH certificate body; refused (content-aware)"}
  - id: REQ-ISO-009
    area: ISO
    statement: "The key-holder MUST serve each caller on its own Unix socket, in a directory that only that caller can open."
    rationale: "A socket per caller makes the operating system the first judge of who may ask."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: [bare-metal, kubernetes]
    standards: []
    issues: [866, 914]
    superseded_by: [REQ-KEYS-044]
    verification:
      - {kind: test-vectors, ref: "T-24 layer 2, peer-uid check off: a process under another uid opens ca@env-a's key-holder socket; refused by the directory permissions"}
  - id: REQ-ISO-010
    area: ISO
    statement: "The key-holder MUST refuse a connection whose peer uid is not the uid its socket was made for."
    rationale: "The peer-uid check is a second factor when a socket's directory permissions are wrong."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: [bare-metal, kubernetes]
    standards: []
    issues: [914]
    superseded_by: [REQ-KEYS-045]
    verification:
      - {kind: test-vectors, ref: "T-24 layer 2, directory permissions off (socket left world-writable): uid B connects to uid A's socket; refused by the peer-uid check"}
  - id: REQ-ISO-011
    area: ISO
    statement: "key@ MUST write an audit record for every signature it makes, naming the caller and the purpose."
    rationale: "A compromised key@ or caller is found by its signatures, so each one must be on the record."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: ["bare-metal", "kubernetes"]
    actors: [key]
    standards: []
    issues: [914, 1120]
    verification:
      - {kind: integration-test, ref: "T-10: sign N times through two callers; the audit log holds N records with caller and purpose, and a signature without a record fails the test"}
  - id: REQ-ISO-012
    area: ISO
    statement: "A driver whose backend authorises each caller natively MUST use a credential per actor and no mediator."
    rationale: "A mediator in front of a backend that can tell callers apart only adds a process that can be compromised for all of them."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [863]
    superseded_by: [REQ-ISO-085, REQ-DATA-066]
    verification:
      - {kind: test-vectors, ref: "T-10 config check corpus: an install file that routes aws-kms, DynamoDB or PostgreSQL through a shared mediator; refused"}

  # ---- state
  - id: REQ-ISO-013
    area: ISO
    statement: "A state driver MUST refuse a read or write outside the caller's own prefix, judged by the caller's platform identity."
    rationale: "The store's own check holds when the actor's library is bypassed or compromised."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-103, depth: Partial}
    issues: [851]
    superseded_by: [REQ-DATA-047, REQ-DATA-013]
    verification:
      - {kind: test-vectors, ref: "T-11 layer 2, layers 1 and 3 off: actor X writes prefix Y; refused by the rqlite user, DynamoDB LeadingKeys, PostgreSQL RLS or file owner"}
      - {kind: test-vectors, ref: "T-11 layer 2, layers 1 and 3 off: actor X reads prefix Y of a kind it is not a declared reader of; refused"}
  - id: REQ-ISO-014
    area: ISO
    statement: "The rqlite driver MUST run one cluster per boundary and owning actor, with execute rights for the owner and query rights only for the declared readers."
    rationale: "rqlite has no row-level permissions, so the cluster and its users are the unit of separation."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: [bare-metal]
    standards: []
    issues: [952]
    superseded_by: [REQ-DATA-073, REQ-DATA-066]
    verification:
      - {kind: test-vectors, ref: "T-11 layer 2: a declared reader sends an execute to the owner's cluster; refused (query-only user)"}
      - {kind: test-vectors, ref: "T-11 layer 2: actor X presents its own client certificate to actor Y's cluster; refused (a certificate per cluster)"}
  - id: REQ-ISO-015
    area: ISO
    statement: "The PostgreSQL audit index MUST separate the rows of its projects and tenants with forced row-level security that tests group-role membership and never a session variable."
    rationale: "A policy that trusts a session variable is bypassed by any caller that sets it."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [975, 839]
    verification:
      - {kind: test-vectors, ref: "T-11, the grant filter off: the role of project A selects the rows of project B; zero rows"}
      - {kind: test-vectors, ref: "T-11: the role of project A sets a session variable naming project B; zero rows"}
      - {kind: test-vectors, ref: "T-11: the table owner role is used by an actor; refused (actors never own tables)"}
  - id: REQ-ISO-016
    area: ISO
    statement: "At level L3 and above, each boundary MUST have its own engine."
    rationale: "A separate engine still holds when every in-store check is wrong."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [975, 952]
    superseded_by: [REQ-DATA-073]
    verification:
      - {kind: test-vectors, ref: "T-11, physical separation alone: an actor of env-a addresses env-b's items; not found, because they are in another engine"}
  - id: REQ-ISO-017
    area: ISO
    statement: "The port library MUST encrypt every state value with AES-256-GCM under a data key per boundary and record kind."
    rationale: "Encryption keeps records secret from a store, its admins and its backups even when every access check fails."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-88, depth: Partial}
      - {id: ST-106, depth: Partial}
    issues: [851, 800]
    superseded_by: [REQ-KEYS-033]
    verification:
      - {kind: test-vectors, ref: "T-14, layers 2 and 3 off: actor X reads Y's record by a raw driver call; ciphertext only, and unwrapping Y's data key is refused"}
      - {kind: test-vectors, ref: "Wycheproof AES-GCM vectors"}
  - id: REQ-ISO-018
    area: ISO
    statement: "The port library MUST bind each encrypted value to its boundary, record kind, key and version as additional authenticated data."
    rationale: "Without that binding a store admin can move a valid ciphertext to another key or boundary."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [851]
    superseded_by: [REQ-KEYS-033]
    verification:
      - {kind: test-vectors, ref: "T-14: a store admin moves a ciphertext to another key of the same kind; decryption fails"}
      - {kind: test-vectors, ref: "T-14: a ciphertext copied from env-a to the same key name in env-b; decryption fails"}
  - id: REQ-ISO-019
    area: ISO
    statement: "The keys port MUST unwrap a record kind's data key only for the writer of that kind and its declared readers."
    rationale: "The unwrap check is what turns a leaked ciphertext into nothing."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [800]
    superseded_by: [REQ-KEYS-029]
    verification:
      - {kind: test-vectors, ref: "T-11 layer 2: an actor that is not a declared reader asks to unwrap the data key; refused by the key-holder ACL or the KMS encryption-context condition"}
  - id: REQ-ISO-020
    area: ISO
    statement: "A record key MUST NOT contain personal data."
    rationale: "Keys are visible to the store and its admins even though values are encrypted."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [863]
    superseded_by: [REQ-DATA-012]
    verification:
      - {kind: test-vectors, ref: "T-14 manifest lint corpus: a record-key template that uses a field of sensitivity personal or secret; refused"}

  # ---- blob
  - id: REQ-ISO-021
    area: ISO
    statement: "The credential of an audit piece for a project's bucket MUST refuse a write outside the piece's own prefix, judged by the piece's platform identity."
    rationale: "The bucket's own check holds when the actor is bypassed or compromised."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-103, depth: Partial}
    issues: [851]
    verification:
      - {kind: test-vectors, ref: "T-12, the holder's own check alone: the writer of project X puts an object under project Y's prefix; refused by an IAM prefix condition, a prefix-scoped temporary credential or the directory owner"}
  - id: REQ-ISO-022
    area: ISO
    statement: "The audit writer MUST create every entry bundle and tile only if no object of that name exists."
    rationale: "Create-if-absent means a compromised writer cannot rewrite what was already written."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1121, 837, 851]
    tests:
      - actors/writer/internal/writerd/writer_test.go
      - actors/writer/internal/writerd/immutable_test.go
      - drivers/writer/fs/tests/port.rs
    verification:
      - {kind: test-vectors, ref: "T-12: a second write of an existing audit batch name; refused with a precondition failure"}
  - id: REQ-ISO-023
    area: ISO
    statement: "At level L3 and above, each boundary MUST have its own bucket."
    rationale: "A separate bucket still holds when a prefix condition is wrong."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [954]
    verification:
      - {kind: test-vectors, ref: "T-12 physical separation alone: an actor of env-a writes into env-b's bucket; refused because its credentials do not reach that bucket"}

  # ---- transport
  - id: REQ-ISO-024
    area: ISO
    statement: "A transport driver MUST refuse a message whose sender identity is not allowed for its destination, judged at the receiver or the broker."
    rationale: "A sender that can write to another actor's queue can forge that actor's events."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-103, depth: Partial}
    issues: [851]
    verification:
      - {kind: test-vectors, ref: "T-13 the holder's own check alone: role X sends to a queue whose policy names only role Y; refused by the queue policy"}
      - {kind: test-vectors, ref: "T-13 the holder's own check: a Unix-socket or spool sender with a foreign peer uid; refused at the receiver"}
  - id: REQ-ISO-025
    area: ISO
    statement: "The nats-jetstream driver MUST give each actor instance its own NATS user, limited to its own subjects in its boundary's account."
    rationale: "NATS accounts and permission templates are the per-caller check of this backend."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: [kubernetes]
    standards:
      - {id: NC-17, depth: Partial}
      - {id: ST-102, depth: Partial}
    issues: [802]
    verification:
      - {kind: test-vectors, ref: "T-13 the holder's own check alone: user X publishes on actor Y's audit subject; refused by the permission template"}
      - {kind: test-vectors, ref: "T-13 the holder's own check: a user of env-a subscribes to a subject of env-b's account; nothing is delivered"}
  - id: REQ-ISO-026
    area: ISO
    statement: "At level L3 and above, each boundary MUST have its own queues or streams."
    rationale: "A separate queue still holds when a queue policy is wrong."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [802]
    verification:
      - {kind: test-vectors, ref: "T-13 physical separation alone: an actor of env-a sends to env-b's queue; refused because its credentials do not reach it"}

  # ---- tokens and issuers
  - id: REQ-ISO-027
    area: ISO
    statement: "sluis MUST refuse a sender-constrained access or refresh token that is presented without proof of possession of its bound key."
    rationale: "A token copied in transit, for example by a compromised entry, must be useless without the client's key."
    level: MUST
    source: design-decision
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards:
      - {id: ST-18, section: "7.1", depth: Partial}
      - {id: ST-19, section: "3", depth: Partial}
    issues: [912]
    verification:
      - {kind: test-vectors, ref: "T-1: a copied DPoP-bound refresh token at the token endpoint with no proof, or a proof by another key; refused"}
      - {kind: test-vectors, ref: "T-1: a copied certificate-bound access token over a TLS connection with another client certificate; refused"}
  - id: REQ-ISO-028
    area: ISO
    statement: "The single audience of a token that sluis issues to a client MUST be a client ID registered at the issuing issuer."
    rationale: "A readable client ID that each relying party pins stops a token for one client being accepted by another."
    level: MUST
    source: design-decision
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-52, section: "4.1.3", depth: Partial}
      - {id: ST-56, section: "3.9", depth: Partial}
    issues: [962]
    verification:
      - {kind: test-vectors, ref: "T-2: a token with aud for client X presented to client Y's reference verifier; refused"}
  - id: REQ-ISO-029
    area: ISO
    statement: "sluis MUST NOT copy an RFC 8707 resource value into the aud claim of any token, and maps it to a registered client ID instead."
    rationale: "A resource URL in aud would make the audience whatever the requester wrote."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-08, section: "2", depth: Partial}
    issues: [791]
    verification:
      - {kind: test-vectors, ref: "T-2: an authorization request with resource set to a URL; the issued aud is the mapped client ID, and an unmapped resource is refused with invalid_target"}
  - id: REQ-ISO-030
    area: ISO
    statement: "Every relying-party snippet that sluis prints MUST pin both the issuer and the audience."
    rationale: "A relying party that pins only one of them accepts tokens of another boundary or another client."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.3.7", depth: Partial}
    issues: [962]
    verification:
      - {kind: test-vectors, ref: "T-3: each printed snippet, applied to its reference relying party, is fed a token of another issuer and a token of another client; both refused"}
  - id: REQ-ISO-031
    area: ISO
    statement: "Each environment boundary MUST have its own issuer with its own token-signing keys and key set."
    rationale: "A token signed in one environment then cannot verify in another, whatever its claims say."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-50, depth: Partial}
    issues: [962]
    verification:
      - {kind: test-vectors, ref: "T-3: a token signed by env-a's key with iss set to env-b's issuer; refused at env-b because the kid is not in its key set"}

  # ---- across boundaries
  - id: REQ-ISO-032
    area: ISO
    statement: "A boundary MUST decide every request that reaches it from another boundary with its own policy, whatever the sending boundary decided."
    rationale: "A compromised front or sending boundary then cannot grant what the target forbids."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: NC-12, depth: Partial}
    issues: [892]
    verification:
      - {kind: test-vectors, ref: "T-5: the front forwards a request it marked allowed and env-b's policy denies it; refused at env-b"}
  - id: REQ-ISO-033
    area: ISO
    statement: "A boundary whose policy demands fresh multi-factor authentication MUST verify the person's passkey assertion over a challenge it issued itself."
    rationale: "A compromised front cannot then act in a sensitive boundary on a person's behalf."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-59, section: "7.2", depth: Partial}
      - {id: ST-24, section: "3", depth: Partial}
    issues: [885]
    verification:
      - {kind: test-vectors, ref: "T-5: an assertion over a challenge issued by the front is replayed at the production boundary; refused"}
      - {kind: test-vectors, ref: "T-5: the front forwards a request with no assertion; answered with insufficient_user_authentication"}
  - id: REQ-ISO-034
    area: ISO
    statement: "Every passkey verifier of an installation MUST refuse an assertion whose origin is not one of that installation's own sluis hosts."
    rationale: "The relying-party ID is the registrable parent domain, so any other host under it could otherwise collect a usable assertion."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-59, section: "7.2", depth: Partial}
    issues: [885]
    verification:
      - {kind: test-vectors, ref: "T-6: an assertion whose client data names the web origin other.example.com under the same relying-party ID; refused"}
      - {kind: test-vectors, ref: "T-6: an assertion from sluis.devel.example.com presented to a verifier whose allow-list lacks it; refused"}
  - id: REQ-ISO-035
    area: ISO
    statement: "A boundary MUST challenge a session whose last authentication is older than that boundary's freshness rule with an RFC 9470 step-up."
    rationale: "A stolen cookie then reaches only the boundaries with a loose freshness rule, and only for as long as the rule allows."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-24, section: "3", depth: Full}
    issues: [885, 916]
    verification:
      - {kind: test-vectors, ref: "T-7: an authentication older than the production rule; answered with insufficient_user_authentication and max_age (the step-up round trip with fakes), and a fresh one is accepted"}
  - id: REQ-ISO-036
    area: ISO
    statement: "The compiled policy MUST forbid a subject of one tenant any grant in another tenant's scope unless a cross-tenant grant allows it."
    rationale: "A tenant guard written as a forbid holds against any permit, including a wrong one."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: NC-12, depth: Partial}
    issues: [892, 852]
    verification:
      - {kind: test-vectors, ref: "T-16: a tenant C subject asks for a grant in tenant D's scope with no cross-tenant grant; refused by the tenant guard"}
      - {kind: test-vectors, ref: "T-16 positive control: the same request with a cross-tenant grant; allowed"}
  - id: REQ-ISO-037
    area: ISO
    statement: "The policy build MUST fail when the bundle of one environment contains a policy scoped to another environment."
    rationale: "Policy comes from one source, so the compiler is where a leak between environments is cheapest to stop."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: NC-12, depth: Partial}
    issues: [892, 852]
    verification:
      - {kind: test-vectors, ref: "T-17: a policy bundle for env-a that contains an env-b-scoped policy; the build fails"}
  - id: REQ-ISO-038
    area: ISO
    statement: "A signing actor MUST refuse a grant that is not signed by its own environment's grant key."
    rationale: "A grant key per environment keeps a decision made for one environment from being spent in another."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [892]
    superseded_by: [REQ-ISO-066, REQ-ISO-067]
    verification:
      - {kind: test-vectors, ref: "T-18 layer 2: a grant signed by policy@env-a is presented to signer@env-b; refused"}
  - id: REQ-ISO-039
    area: ISO
    statement: "sluis MUST take the subject of an issued certificate, SVID or workload token from the requester's authenticated identity, never from the request."
    rationale: "Issuance bound to the requester stops one workload or host asking for another's identity."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-109, section: "2", depth: Partial}
      - {id: ST-107, section: "2", depth: Partial}
    issues: [913, 870]
    verification:
      - {kind: test-vectors, ref: "T-20: workload A requests an X.509-SVID for workload B's SPIFFE ID; refused"}
      - {kind: test-vectors, ref: "T-20: host A renews with a CSR naming host B; refused"}
  - id: REQ-ISO-040
    area: ISO
    statement: "An actor MUST accept a call from another boundary only over mutual TLS with a client certificate whose SPIFFE ID is in a trust domain it declares as trusted."
    rationale: "The trust domain is the boundary, so the certificate itself says where the caller comes from."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-109, section: "5", depth: Partial}
      - {id: ST-108, section: "2", depth: Partial}
    issues: [964, 963]
    verification:
      - {kind: test-vectors, ref: "T-21: a client certificate from an undeclared trust domain; refused"}
      - {kind: test-vectors, ref: "T-21: a certificate of env-a's trust domain whose path names an env-b actor; refused as an env-a caller"}
  - id: REQ-ISO-041
    area: ISO
    statement: "A JWT-SVID for a call between actors of different boundaries MUST carry the target's SPIFFE ID as its only audience."
    rationale: "A token addressed to one actor must not be spendable at another."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-110, section: "3.2", depth: Partial}
    issues: [964]
    verification:
      - {kind: test-vectors, ref: "T-21: a JWT-SVID for target X presented to target Y; refused"}

  # ---- entry
  - id: REQ-ISO-042
    area: ISO
    statement: "The entry actor MUST have no network access except its listener and the calls of its ports that the actor registry lists; its audit front may also call the reader (ADR 0028)."
    rationale: "A compromised entry that cannot connect out cannot send what it sees anywhere."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [entry]
    standards: []
    issues: [866, 796]
    verification:
      - {kind: test-vectors, ref: "T-4: entry opens an outbound TCP or UDP socket; refused by the sandbox"}
      - {kind: test-vectors, ref: "T-4: entry connects to a socket that neither the registry row of entry nor, for the audit front, the reader gives it; refused"}
  - id: REQ-ISO-043
    area: ISO
    statement: "The entry actor MUST NOT hold a storage, key or audit credential at rest."
    rationale: "What entry does not hold cannot be stolen from it."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [entry]
    standards: []
    issues: [863]
    verification:
      - {kind: test-vectors, ref: "registry test over actors.yaml: entry is not a holder and has no port of a credential holder; a copy with a holder flag or a key-store port is refused"}

  # ---- enrolment and trust bundles
  - id: REQ-ISO-044
    area: ISO
    statement: "An enrolling client MUST prove its enrolment token with an HMAC over its CSR and a fresh server nonce, and never send the token itself."
    rationale: "A token that never travels cannot be copied in transit."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: NC-06, depth: Partial}
    issues: [966, 967]
    verification:
      - {kind: test-vectors, ref: "T-22: a recorded HMAC replayed with an old nonce; refused"}
      - {kind: test-vectors, ref: "T-22: an HMAC over another CSR than the one sent; refused"}
  - id: REQ-ISO-045
    area: ISO
    statement: "sluis MUST refuse an enrolment token after its last allowed use or its expiry."
    rationale: "A single-use or counted token bounds what a stolen copy can enrol."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [966]
    verification:
      - {kind: test-vectors, ref: "T-22: a single-use enrolment token used a second time; refused"}
  - id: REQ-ISO-046
    area: ISO
    statement: "The aws-iid verifier MUST accept an instance identity document once per instance."
    rationale: "Any process on the instance can read the document, so its second use is the one to refuse."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [965]
    verification:
      - {kind: test-vectors, ref: "T-22: a second enrolment with the same instance identity document; refused"}
  - id: REQ-ISO-047
    area: ISO
    statement: "An enrolment request MUST be encrypted end to end with HPKE to the enrolment public key whose certificate the trust bundle carries."
    rationale: "The edge and entry then cannot read or alter an enrolment."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-61, section: "5.1", depth: Partial}
    issues: [966]
    verification:
      - {kind: test-vectors, ref: "T-22: entry flips one byte of an enrolment ciphertext; decryption fails at the exchange actor"}
      - {kind: test-vectors, ref: "RFC 9180 appendix A test vectors"}
  - id: REQ-ISO-048
    area: ISO
    statement: "sluis trust sync MUST refuse a trust bundle whose spiffe_sequence is lower than the one it holds."
    rationale: "Refusing a lower sequence stops a rollback to a bundle that still trusts a removed root."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: [bare-metal, kubernetes]
    standards:
      - {id: ST-108, section: "4.1", depth: Partial}
    issues: [968]
    verification:
      - {kind: test-vectors, ref: "T-23: a trust bundle of valid certificates with a lower spiffe_sequence; refused, and the anchors on disk are unchanged"}
  - id: REQ-ISO-049
    area: ISO
    statement: "sluis trust sync MUST refuse a trust bundle that is not signed by a key certified by both roots."
    rationale: "One compromised root then cannot rewrite what every host trusts."
    level: MUST
    source: design-decision
    status: withdrawn
    superseded_by: [REQ-ISO-064]
    runtimes: [bare-metal, kubernetes]
    standards:
      - {id: ST-108, depth: Partial}
    verification:
      - {kind: test-vectors, ref: "T-23: a bundle signed by a key certified by one root only; refused"}
  - id: REQ-ISO-050
    area: ISO
    statement: "Enrolment by any path other than manual approval MUST pin the public keys of the roots."
    rationale: "Web PKI gives reachability, not trust, so a client must know which roots it is joining, and a pin on a public key survives a root whose validity is extended."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [966, 967]
    verification:
      - {kind: test-vectors, ref: "T-23: enrolment against a server with a valid web certificate but other roots; refused"}

  # ---- integrations
  - id: REQ-ISO-051
    area: ISO
    statement: "Each dedicated integration instance MUST run as its own process with its own platform identity, one per vendor tenant."
    rationale: "A compromised integration then reaches only its own tenant's credential and state."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [863]
    superseded_by: [REQ-ISO-106]
    verification:
      - {kind: test-vectors, ref: "T-15 layer 2, layers 1 and 3 off: google-signin@company-a reads company-b's client secret; refused"}
  - id: REQ-ISO-052
    area: ISO
    statement: "An adapter MUST NOT hold an authority key."
    rationale: "Adapters hold vendor connections, so they must not also be able to sign for sluis."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [863]
    verification:
      - {kind: test-vectors, ref: "registry test over keys.yaml: no adapter may use any op of a signing or key-agreement purpose, which is what an authority key is here"}

  # ---- operators and configuration
  - id: REQ-ISO-053
    area: ISO
    statement: "The console MUST refuse a change by an operator outside the tenant and boundary scope delegated to that operator."
    rationale: "A mistake or a stolen operator session then stays inside one delegation."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [960]
    verification:
      - {kind: test-vectors, ref: "T-25: an operator delegated for tenant A edits a tenant B item; refused and audited"}
      - {kind: test-vectors, ref: "T-25: an operator delegated for devel edits a production machine-plane item; refused and audited"}
  - id: REQ-ISO-054
    area: ISO
    statement: "sluis config check MUST refuse a driver whose backend has no per-caller check unless the installation is at level L3 or above for that port."
    rationale: "Such a driver has no layer 2, so only layer 3 can stand in for it."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [864]
    superseded_by: [REQ-DATA-066, REQ-DATA-072]
    verification:
      - {kind: test-vectors, ref: "T-25 config check corpus: an install file with such a driver shared by two boundaries at level L2; refused"}
  - id: REQ-ISO-055
    area: ISO
    statement: "The drift test MUST fail when a deployed ACL, IAM or KMS policy, unit, socket or service account differs from what the registries generate."
    rationale: "Generated policies help only while what is deployed still matches them."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [863]
    verification:
      - {kind: integration-test, ref: "T-25: widen one generated policy by hand in a test installation; the drift test fails and names it"}

  # ---- shared hosts and clusters
  - id: REQ-ISO-056
    area: ISO
    statement: "The trust policy of every cloud role that an actor assumes MUST pin the subject to that actor at its boundary."
    rationale: "A node token of one actor must not open another actor's or another boundary's role."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-46, depth: Partial}
    issues: [870]
    verification:
      - {kind: test-vectors, ref: "T-24 the holder's own check: the node token of ca@devel is used to assume prod's ca role; refused by the trust policy"}
  - id: REQ-ISO-057
    area: ISO
    statement: "A container MUST mount only its own actor's key-holder socket."
    rationale: "A pod that sees another actor's socket is one permission mistake away from using it."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: [kubernetes]
    standards: []
    issues: [876]
    superseded_by: [REQ-ISO-102]
    verification:
      - {kind: test-vectors, ref: "T-24 chart corpus: every rendered preset mounts at most one key-holder socket per container, its own"}

  # ---- people and companies
  - id: REQ-ISO-058
    area: ISO
    statement: "A grant of one directory account MUST NOT be usable through a person link from another directory account."
    rationale: "A person link records that two accounts are one person; it must not merge what each company granted."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: no-proving-test
    runtimes: all
    standards: []
    issues: [807, 809]
    verification:
      - {kind: test-vectors, ref: "T-19: account A of company C holds a grant, and linked account B of company D asks for it; refused"}
  - id: REQ-ISO-059
    area: ISO
    statement: "Destroying a company's audit tenant key MUST leave every audit record of that company unreadable."
    rationale: "A company that leaves is promised that its records are crypto-shredded, not merely hidden."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1121, 837]
    superseded_by: [REQ-KEYS-036, REQ-AUDIT-068]
    verification:
      - {kind: integration-test, ref: "T-26: export, then destroy the tenant key; the reader fails to decrypt every record of that company and still reads the others"}
  - id: REQ-ISO-060
    area: ISO
    statement: "After a tenant is suspended or erased, sluis MUST refuse sign-in and token exchange through the upstreams of that tenant's company."
    rationale: "Suspending a tenant is a tightening and takes effect at once (ADR 0008)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [973]
    verification:
      - {kind: test-vectors, ref: "T-26: a valid upstream ID token of the suspended tenant at sign-in and at the token endpoint; refused"}
  - id: REQ-ISO-061
    area: ISO
    statement: "A node's card service MUST accept connections only from the user of key@."
    rationale: "While the PIN is verified any local process can sign, and any client can reset the card or lock its PIN."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal", "kubernetes"]
    actors: [key]
    standards: []
    issues: [951]
    verification:
      - {kind: test-vectors, ref: "K2: a process under another uid connects to the card service; refused"}
  - id: REQ-ISO-062
    area: ISO
    statement: "key@ MUST make the OpenPGP primary-key binding signature of a node subkey on the card."
    rationale: "The subkey stays in a PIV slot, so only the card can make its back-signature."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: ["bare-metal", "kubernetes"]
    actors: [key]
    standards: []
    issues: [951, 1067]
    verification:
      - {kind: integration-test, ref: "on a test card the gpg, gpgv and sqv verifiers accept the subkey with the back-signature and refuse it without"}
  - id: REQ-ISO-063
    area: ISO
    statement: "key@ MUST NOT accept a caller-supplied digest for an OpenPGP binding signature."
    rationale: "It builds the digest from the keys itself, so a caller cannot turn the purpose into a general signer."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: ["bare-metal", "kubernetes"]
    actors: [key]
    standards: []
    issues: [951, 1067]
    verification:
      - {kind: test-vectors, ref: "T-9: the OpenPGP binding purpose is asked to sign a caller-supplied digest; refused (content-aware)"}
  - id: REQ-ISO-064
    area: ISO
    statement: "sluis trust sync MUST refuse a root list that is not signed by a root in the list the host already holds."
    rationale: "A list is taken only from a root the host already trusts; a list that changes the root set also carries the signature or stored removal authorisation of every root it replaces."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-108, depth: Partial}
    issues: [968]
    verification:
      - {kind: test-vectors, ref: "T-23: a root list signed by a key outside the held list; refused and the anchors on disk are unchanged"}
  - id: REQ-ISO-065
    area: ISO
    statement: "sluis trust sync MUST refuse a root list whose trust sequence is lower than the one it holds."
    rationale: "Refusing a lower sequence stops a rollback to a list that still names a revoked root."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-108, depth: Partial}
    issues: [968]
    verification:
      - {kind: test-vectors, ref: "T-23: a validly signed root list with a lower sequence; refused and the anchors on disk are unchanged"}
  - id: REQ-ISO-066
    area: ISO
    statement: "A signing actor MUST refuse a grant that key@ does not open under its own boundary's grant data key."
    rationale: "A grant data key per boundary keeps a decision made for one boundary from being spent in another."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: all
    standards: []
    issues: [892, 914]
    verification:
      - {kind: test-vectors, ref: "T-18, the holder's own check alone: a grant sealed by policy@env-a is presented to signer@env-b; refused"}
  - id: REQ-ISO-067
    area: ISO
    statement: "The `policy` actor MUST have key@ seal each grant with authenticated encryption under the boundary's grant data key, with the purpose grant in the context."
    rationale: "Only sluis itself verifies a grant, so a seal under a key that never leaves key@ makes a signature on a grant unnecessary."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [892, 914]
    tests: [actors/key/internal/keyd/seal_test.go]
    verification:
      - {kind: test-vectors, ref: "a sealed grant opened as another purpose in the context (data, or the purpose byte changed), under another key or at another address is refused; a change of any byte of it is refused"}
  - id: REQ-ISO-068
    area: ISO
    statement: "The data keys of a tenant MUST be wrapped under the boundary's wrapping key with the tenant and the purpose in the context."
    rationale: "Shredding a tenant deletes its wraps, and the context keeps one tenant's wraps from opening for another."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [914]
    verification:
      - {kind: integration-test, ref: "a tenant's data key unwrapped with another tenant in the encryption context; refused"}
  - id: REQ-ISO-070
    area: ISO
    statement: "sluis MUST NOT create a key in the key store for a tenant."
    rationale: "Thousands of tenants would otherwise mean thousands of store keys, policies and aliases; per-tenant signing keys are a possible later feature."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [914]
    verification:
      - {kind: integration-test, ref: "a count of the keys in the key store of a test installation before and after a tenant is added; unchanged"}
  - id: REQ-ISO-069
    area: ISO
    statement: "A key policy that lets an actor use a shared symmetric KMS key MUST carry a `kms:EncryptionContext:` condition for each use that the actor's manifest names."
    rationale: "A symmetric key may be shared only because the store itself separates its uses by encryption context."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: ["serverless", "kubernetes"]
    standards: []
    issues: [914]
    superseded_by: [REQ-KEYS-050]
    verification:
      - {kind: test-vectors, ref: "generated key policies for a shared symmetric key: every Allow statement carries an encryption-context condition; a policy without one fails the build"}
  - id: REQ-ISO-071
    area: ISO
    statement: "sluis trust sync MUST drop every certificate of a trust bundle that does not chain to a root in the pinned root list."
    rationale: "The bundle has no signature of its own, so each certificate is trusted only through its chain to a pinned root."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-108, depth: Partial}
    issues: [968]
    verification:
      - {kind: test-vectors, ref: "T-23: a bundle with one certificate that chains to an unpinned root; that certificate is not written and the rest are"}
  - id: REQ-ISO-072
    area: ISO
    statement: "In containers the uid of an actor instance MUST be the actor's pinned base uid plus 1000 times the uid block that the Boundary config kind declares for its boundary."
    rationale: "Two boundaries then never share a uid, so the peer-uid check can tell their instances apart."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [863]
    verification:
      - {kind: integration-test, ref: "generate the Compose file for two boundaries: every instance has a distinct uid and the one-boundary file uses the base uids"}
  - id: REQ-ISO-073
    area: ISO
    statement: "sluis config check MUST refuse a uid block that is out of range."
    rationale: "A block past the end of the uid space gives no actor of the boundary a uid."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [863, 1419]
    tests: [actors/store/tests/validate.rs, cli/sluis/configcheck_test.go]
    verification:
      - {kind: integration-test, ref: "a block past the last uid block that fits is refused with the field path of the Boundary, and the number is not printed"}
  - id: REQ-ISO-118
    area: ISO
    split_from: REQ-ISO-073
    statement: "sluis config check MUST refuse a uid block that two boundaries of one installation use."
    rationale: "A repeated block would give two boundaries one uid."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [863, 1419]
    verification:
      - {kind: integration-test, ref: "the Boundary documents of two boundaries with one block are refused, naming the field path of each"}
  - id: REQ-ISO-074
    area: ISO
    statement: "sluis trust sync MUST refuse a root list that has the sequence of the list it holds but different content."
    rationale: "One sequence names one set of roots, so two lists with the same sequence mean a signing mistake or an attack."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal", "kubernetes"]
    standards: []
    issues: [968]
    verification:
      - {kind: test-vectors, ref: "T-23: two validly signed root lists with one sequence and different content; the second is refused and the anchors on disk are unchanged"}
  - id: REQ-ISO-075
    area: ISO
    statement: "A customer boundary MUST have keys of its own, shared with no other boundary."
    rationale: "Its customers' tokens and data must not depend on, or be reachable through, another boundary (ADR 0008)."
    level: MUST
    source: design-decision
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards: []
    issues: [1023]
    verification:
      - {kind: integration-test, ref: "a configuration that gives a customer boundary a key of another boundary is refused by sluis config check"}
  - id: REQ-ISO-076
    area: ISO
    statement: "store@ MUST refuse a write of a tenant kind that widens a field its template bounds."
    rationale: "A tenant must not widen its own claims, trust ceiling or redirect rules (ADR 0032)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [1023]
    superseded_by: [REQ-DATA-025]
    verification:
      - {kind: integration-test, ref: "a tenant item that raises each bounded field in turn is refused"}
  - id: REQ-ISO-077
    area: ISO
    statement: "A client ID of a tenant MUST be the tenant's name, a colon and the client's name, each 1 to 32 characters."
    rationale: "Client IDs stay unique per issuer when thousands of tenants each have a web client."
    level: MUST
    source: design-decision
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards: []
    issues: [1023]
    verification:
      - {kind: integration-test, ref: "client ID format and uniqueness test"}
  - id: REQ-ISO-078
    area: ISO
    statement: "A person MUST NOT hold a grant in the scope of any tenant other than the tenant of the client they signed in to."
    rationale: "An identity provider is controlled by its administrators and must not reach another tenant's data (ADR 0032)."
    level: MUST
    source: design-decision
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards: []
    issues: [1023]
    verification:
      - {kind: integration-test, ref: "ceiling guard negative test across two tenants"}
  - id: REQ-ISO-079
    area: ISO
    statement: "An adapter MUST serve the upstreams of one boundary only."
    rationale: "A compromised adapter then reaches the upstreams of one boundary only, and the rest of the proof, with the layers switched off one at a time, comes with REQ-ISO-083 in v1 parity."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "an upstream of a second boundary is refused by the adapter"}
  - id: REQ-ISO-080
    area: ISO
    statement: "A pooled adapter MUST open the client secret of a connection at key@ for the duration of one call only, under a grant for the connection's tenant."
    rationale: "A pool must not hold every connection's secret in memory or open one connection's secret for another."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [916]
    superseded_by: [REQ-ISO-106]
    verification:
      - {kind: integration-test, ref: "an open under a grant for another tenant is refused; no secret is cached after the call"}
  - id: REQ-ISO-081
    area: ISO
    statement: "The egress proxy of a pooled adapter MUST refuse a request to a loopback, link-local or private address after name resolution."
    rationale: "A pool cannot list its hosts in a network policy, so the proxy at least keeps it off the inside."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [916]
    superseded_by: [REQ-ISO-110]
    verification:
      - {kind: integration-test, ref: "a request to a private address is refused"}
  - id: REQ-ISO-110
    area: ISO
    statement: "The adapter-upstream-oidc actor MUST restrict its egress to the hosts of the upstreams that config declares."
    rationale: "The upstream hosts are known, so an allow-list replaces a general egress proxy (ADR 0033)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1214]
    tests: [actors/adapter-upstream-oidc/internal/upstreamd/service_test.go]
    verification:
      - {kind: integration-test, ref: "an upstream that declares host A: the adapter's call to host B is refused before it leaves the adapter"}
  - id: REQ-ISO-082
    area: ISO
    statement: "sluis config check MUST refuse a private_key_jwt key for a pooled connection."
    rationale: "A key per pooled connection would be a key per tenant."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [916]
    superseded_by: [REQ-ISO-052]
    verification:
      - {kind: integration-test, ref: "config check negative test"}

  # ---- the two independent checks and the credential holders (decisions 0002, 0003 and 0007)
  - id: REQ-ISO-083
    area: ISO
    statement: "The isolation harness MUST be able to run every isolation vector with the store's rule, key@'s grant check or both switched off."
    rationale: "A check that is only ever tested behind another check is not tested at all (ADR 0007)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [877, 851, 950]
    verification:
      - {kind: integration-test, ref: "harness self-test: each switch is observed off in store@ and in key@ before a vector runs"}
  - id: REQ-ISO-084
    area: ISO
    statement: "A value sealed under a tenant's data or evidence key MUST be readable only when both the store's rule and key@'s grant check allow it."
    rationale: "Two checks in different holders, with different credentials and different registries, mean a flaw in one is caught by the other (ADR 0007)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [851, 950]
    verification:
      - {kind: test-vectors, ref: "T-11, key@'s grant check off: an actor with a store rule reads a sealed value; the value stays ciphertext"}
      - {kind: test-vectors, ref: "T-11, the store's rule off: an actor with a grant for another tenant asks key@ to open; refused"}
  - id: REQ-ISO-085
    area: ISO
    statement: "A work unit MUST hold no storage, key or audit credential at rest."
    rationale: "A work actor that holds a credential is a second holder and a bigger blast radius (ADR 0002)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [949]
    verification:
      - {kind: integration-test, ref: "actor registry check: no work actor lists a credential in its holds"}
      - {kind: integration-test, ref: "a work unit's and a work container's configuration (environment, files, mounts and directories) is scanned for a storage, key or audit credential"}
  - id: REQ-ISO-086
    area: ISO
    statement: "On Lambda only the roles of the credential holders MUST be able to reach storage, keys, export destinations or the audit blob."
    rationale: "A work function's role may only invoke, so a compromised function reaches data only through the holders (ADR 0002)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["serverless"]
    standards: []
    issues: [949]
    verification:
      - {kind: integration-test, ref: "IAM simulation: the role of every work function is denied every storage, key, export and audit-blob action"}
  - id: REQ-ISO-087
    area: ISO
    statement: "A work actor MUST NOT contain a configuration loader, a secret source or a driver."
    rationale: "Loading config and reading secrets belong to store@, and a driver belongs to its owner (ADR 0002)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1213]
    verification:
      - {kind: integration-test, ref: "dependency check: no work actor binary links a config source, a secret source or a driver package"}
  - id: REQ-ISO-088
    area: ISO
    statement: "The actors ca and ssh-ca MUST run as separate units with separate platform identities."
    rationale: "An X.509 CA and an SSH CA have different callers, keys and blast radius (ADR 0002)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [1213]
    verification:
      - {kind: integration-test, ref: "the generated units and roles for ca and ssh-ca are distinct on every runtime"}
  - id: REQ-ISO-089
    area: ISO
    statement: "Every contract between actors MUST be served over ConnectRPC, including a call inside one process."
    rationale: "One transport for every call keeps the rules and the audit the same whether actors are fused or not (ADR 0002)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [1213]
    verification:
      - {kind: integration-test, ref: "a fused unit's calls between actors pass through the same interceptors as a remote call"}
  - id: REQ-ISO-090
    area: ISO
    statement: "The transport MUST refuse a call from one actor to another that the actor registry does not list."
    rationale: "The call graph is a reviewed registry, and a compromised actor must not call outside it (ADR 0002)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [949]
    tests: [tests/deny/deny_test.go]
    verification:
      - {kind: integration-test, ref: "the generated deny matrix: every pair not listed is refused by the transport on each runtime"}
      - {kind: integration-test, ref: "drift test: a call added in code but not in the registry fails"}
  - id: REQ-ISO-091
    area: ISO
    statement: "The deny matrix and the blast-radius report MUST be generated from the actor registry and the kind registry."
    rationale: "A handwritten matrix drifts from what is enforced (ADR 0002)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [949]
    verification:
      - {kind: integration-test, ref: "the generated pages equal the committed pages; a registry change without them fails CI"}
  - id: REQ-ISO-092
    area: ISO
    statement: "The entry actor MUST be fuzzed in CI on its request parsing."
    rationale: "Entry is the one actor that faces the internet, so it gets the most hostile input (ADR 0002)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [entry]
    standards: []
    issues: [1215]
    verification:
      - {kind: integration-test, ref: "a fuzzing job runs on every release candidate and its corpus is kept"}
  - id: REQ-ISO-093
    area: ISO
    statement: "The entry actor MUST NOT load plugins."
    rationale: "A plugin is code that nobody reviewed with the actor (ADR 0002)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [entry]
    standards: []
    issues: [1215]
    verification:
      - {kind: integration-test, ref: "entry has no plugin interface; a dependency check finds no dynamic loader"}
  - id: REQ-ISO-094
    area: ISO
    statement: "The entry actor MUST run with a read-only root file system, in which only its own socket directory and a private tmp are writable."
    rationale: "What entry cannot write it cannot plant (ADR 0002)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [entry]
    standards: []
    issues: [1215]
    verification:
      - {kind: integration-test, ref: "static test over the generated unit and Compose service of both entry fronts: the root is read-only and the only writable paths are the socket directory and a private tmp"}

  # ---- units, listeners and fusion (decision 0003)
  - id: REQ-ISO-095
    area: ISO
    statement: "An actor on a board MUST NOT listen on a TCP socket."
    rationale: "Unix sockets with a peer-uid check are the only inbound path, so the network reaches no actor (ADR 0003)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    issues: [866]
    verification:
      - {kind: integration-test, ref: "every generated unit carries SocketBindDeny=any (unit test over the generated units)"}
      - {kind: integration-test, ref: "the first board deploy checks systemctl show -p SocketBindDeny on a running unit, since the directive depends on the kernel's cgroup BPF support"}
  - id: REQ-ISO-096
    area: ISO
    statement: "On a board entry MUST listen on a Unix socket that cloudflared forwards to."
    rationale: "Entry is then reached only by the tunnel's connector (ADR 0003)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [entry]
    standards: []
    issues: [866]
    verification:
      - {kind: integration-test, ref: "entry accepts a connection from cloudflared's uid and refuses one from another uid"}
  - id: REQ-ISO-097
    area: ISO
    statement: "On serverless the entry actor MUST listen on 127.0.0.1 inside the function's sandbox only."
    rationale: "The pinned Lambda Web Adapter is then its only client (ADR 0003)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["serverless"]
    actors: [entry]
    standards: []
    issues: [1215]
    verification:
      - {kind: integration-test, ref: "a connection to entry from outside the sandbox is impossible; the adapter's request is served"}
  - id: REQ-ISO-099
    area: ISO
    statement: "A credential holder MUST NOT be fused with a work actor."
    rationale: "Fusing a holder with a work actor would give the work actor its credential (ADR 0003)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1213]
    verification:
      - {kind: integration-test, ref: "the installation check refuses a fusion that names store@, key@ or exporter@ with a work actor"}
      - {kind: integration-test, ref: "the same check refuses key@ with entry"}
  - id: REQ-ISO-101
    area: ISO
    statement: "On Kubernetes a container that holds a cloud token MUST NOT have a listener."
    rationale: "A listener on the container with the token would be a path to it (ADR 0003)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: no driver container exposes a port"}
  - id: REQ-ISO-102
    area: ISO
    statement: "On Kubernetes the cloud token MUST be mounted only into the driver container of the holder's pod."
    rationale: "The holder's own container then never sees the token, and a work pod has none (ADR 0003)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: every rendered preset mounts the token in the driver container only"}
  - id: REQ-ISO-103
    area: ISO
    statement: "On Kubernetes a work pod MUST have no cloud identity."
    rationale: "A work pod reaches storage, keys and audit only through the holders (ADR 0003)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: no work pod has a cloud service account annotation"}
  - id: REQ-ISO-104
    area: ISO
    statement: "The platform MUST start every driver and no actor execs one."
    rationale: "An actor that can exec a driver can run it with its own arguments (ADR 0003)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [862]
    verification:
      - {kind: integration-test, ref: "every driver is Required= by its owner's unit; every actor unit has NoExecPaths for the drivers' tree and its writable places, so an exec of a driver or a copy is refused (unit test)"}
  - id: REQ-ISO-105
    area: ISO
    statement: "A service SHOULD prefer the replica of an actor in its own cell for its calls."
    rationale: "A local call saves a hop on every request (ADR 0003)."
    level: SHOULD
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1213]
    verification:
      - {kind: integration-test, ref: "with a replica in the same cell and one in another, calls go to the local one"}

  # ---- adapters, boundaries and promotion (decisions 0008 and 0025)
  - id: REQ-ISO-106
    area: ISO
    statement: "An adapter MUST hold no connection credential at rest."
    rationale: "A compromised adapter then yields no tenant's credential, since it opens each one at key@ for one call (ADR 0025)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [1214]
    tests: [actors/adapter-upstream-oidc/internal/upstreamd/service_test.go, actors/store/tests/store.rs, tools/gen/units/units_test.go]
    verification:
      - {kind: integration-test, ref: "an adapter holds no credential on disk, in its environment or between calls: connection credentials open at key@ per call, installation secrets come through store@ per call"}
  - id: REQ-ISO-107
    area: ISO
    statement: "An adapter MUST NOT call a work actor other than policy."
    rationale: "Core calls the adapter, and the adapter's one call is to policy for the grant of work that no caller started (ADR 0025)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1214]
    tests: [kits/go/registry/registry_test.go]
    verification:
      - {kind: integration-test, ref: "TestAdapterCallsPolicyOnly in kits/go/registry: for every adapter the call graph has the edge to policy and to no other work actor"}
  - id: REQ-ISO-108
    area: ISO
    statement: "Two L1 boundaries on one engine MUST wrap their data keys under wrapping keys of their own."
    rationale: "Their values stay apart because each boundary's data keys are wrapped for its own key and not because the engine differs (ADR 0008)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1216]
    verification:
      - {kind: integration-test, ref: "two L1 boundaries on one engine: one boundary's key@ cannot unwrap the other's data keys"}
  - id: REQ-ISO-109
    area: ISO
    statement: "Promoting a tenant to a boundary of its own MUST seal its values again and rewrap its data keys for the new boundary's wrapping key."
    rationale: "A value is bound to its full address, so a moved value is opened by the old key@ and sealed again by the new one (ADR 0008)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1216]
    verification:
      - {kind: integration-test, ref: "promote a test tenant: its values open under the new boundary and no longer under the old; the old copy is deleted after read-back"}

  # ---- Kubernetes: calls between pods, drivers and the edge (decision 0003)
  - id: REQ-ISO-111
    area: ISO
    statement: "On Kubernetes a NetworkPolicy per callee MUST admit ingress only from the pods of the callee's allowed callers."
    rationale: "The cluster then enforces the call graph a second time, outside the process (ADR 0003, The call graph)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [949, 876]
    verification:
      - {kind: integration-test, ref: "the deny matrix on kind: a pod that the call graph does not allow cannot open a connection to the callee, and an allowed caller can"}
  - id: REQ-ISO-112
    area: ISO
    statement: "On Kubernetes a callee MUST accept a call only with a projected service-account token whose audience is its own and whose caller the call graph allows."
    rationale: "A pod that the network admits must still be a caller the graph allows (ADR 0003, Transports)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [949, 876]
    verification:
      - {kind: integration-test, ref: "a call with a token of an allowed caller but another callee's audience is refused"}
      - {kind: integration-test, ref: "a call with a token of the right audience from a caller the graph does not list is refused"}
  - id: REQ-ISO-113
    area: ISO
    statement: "On Kubernetes a driver MUST run as a native sidecar container in its holder's pod, with its socket on an emptyDir."
    rationale: "The socket then never leaves the pod, and only the holder's container and the driver mount it (ADR 0003, Units; ADR 0005, Drivers)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: every driver is an init container with restartPolicy Always in the pod of its holder, and no driver is a pod of its own"}
  - id: REQ-ISO-114
    area: ISO
    statement: "On Kubernetes entry MUST listen on a Unix socket only and be reached through an edge relay container in its own pod."
    rationale: "entry then has no TCP listener, and a gateway can still route to the pod (ADR 0003, Listeners)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    actors: [entry]
    standards: []
    issues: [876, 1215]
    verification:
      - {kind: integration-test, ref: "a connection to entry's pod address is refused on every port; a request through the relay reaches entry's socket"}
  - id: REQ-ISO-115
    area: ISO
    statement: "The edge relay container MUST hold no key and no credential."
    rationale: "A relay that faces the network and holds nothing yields nothing when it is flawed (ADR 0003, Listeners)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: the relay container mounts no token, no secret and no key volume"}
  - id: REQ-ISO-116
    area: ISO
    statement: "Every tenant MUST have an issuer host of its own that no other tenant uses."
    rationale: "Apps pin the issuer, so a tenant's issuer must be its own and survive its move (ADR 0017)."
    level: MUST
    source: design-decision
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards: []
    issues: [1023]
    verification:
      - {kind: integration-test, ref: "a Tenant write that names the issuer host of another tenant is refused"}
  - id: REQ-ISO-117
    area: ISO
    statement: "The compiled policy MUST refuse to load a cross-tenant grant on a kind that the kind registry does not mark with shared_by."
    rationale: "There is no general sharing of data between tenants; a kind is shared only by a named integration's contract, and the field with its load check arrives with that integration (ADR 0008, #1220)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "a bundle with a cross-tenant grant on DirectoryUser fails to load, one on DesiredState (shared_by: [reconciler]) loads, and an audit read over a set of tenants loads"}
