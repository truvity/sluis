# TOKEN: Tokens and token endpoint
schema: 1
area: TOKEN
requirements:
  - id: REQ-TOKEN-001
    area: TOKEN
    statement: "An access token issued as a JWT MUST carry the media type at+jwt in its header."
    rationale: "A typed access token cannot be confused with an ID token."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-13, section: "2.1", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-49, section: "4", depth: Full}
    issues: [776]
    verification:
      - {kind: test-vectors, ref: "own at+jwt claim vectors"}
  - id: REQ-TOKEN-017
    area: TOKEN
    split_from: REQ-TOKEN-001
    statement: "An access token issued as a JWT MUST carry a kid in its header."
    rationale: "Verifiers select the key by kid."
    level: MUST
    source: v1-parity
    # Reworded 2026-11-07 to the proof we have: signer's cross-check with go-jose (a token signed through key@, verified against the
    # published key set, which finds the key by the kid of the header). No outside JOSE vector set is in the repository.
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-13, section: "2.1", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-49, section: "4", depth: Full}
    issues: [776]
    tests: [actors/signer/tests/sign.rs]
    verification:
      - {kind: integration-test, ref: "signer signs an access token through key@ and go-jose verifies it against the published key set, selecting the key by the kid of the header (actors/signer/tests/sign.rs)"}
  - id: REQ-TOKEN-018
    area: TOKEN
    split_from: REQ-TOKEN-001
    statement: "An access token issued as a JWT MUST carry the claims iss, sub, aud, exp, iat and jti."
    rationale: "A typed access token cannot be confused with an ID token."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-13, section: "2.1", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-49, section: "4", depth: Full}
    issues: [776]
    verification:
      - {kind: test-vectors, ref: "own at+jwt claim vectors"}
  - id: REQ-TOKEN-002
    area: TOKEN
    statement: "sluis MUST sign tokens with the algorithm configured for the audience."
    rationale: "Verifiers need a stable key set and a default that every driver supports."
    level: MUST
    source: v1-parity
    # Reworded 2026-11-07 to the proof we have (signer's go-jose cross-check and claims-vectors.json hold ES384, the one algorithm there is).
    # partial: no algorithm is configurable for an audience yet (REQ-TOKEN-019 is the default; a choice per audience is #788, v1 parity), and
    # the OIDF Config OP plan has not run.
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-51, section: "3", depth: Partial}
      - {id: ST-50, section: "5", depth: Full}
      - {id: ST-53, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
      - {id: ST-106, section: "test plan", depth: Full}
    issues: [774, 788, 800]
    verification:
      - {kind: test-vectors, ref: "tests/testdata/token/claims-vectors.json (the algorithm ES384 and the header types), and signer's go-jose cross-check of a signed token"}
      - {kind: conformance-suite, ref: "OIDF Config OP"}
  - id: REQ-TOKEN-019
    area: TOKEN
    split_from: REQ-TOKEN-002
    statement: "Token signing MUST default to ES384 when no algorithm is configured for the audience."
    rationale: "One curve that every driver supports keeps the default simple."
    level: MUST
    source: v1-parity
    # Reworded 2026-11-07 to the proof we have: the header key@ signs is alg ES384 (the signing input it saw), and go-jose verifies the token
    # against the published key set. No Wycheproof vectors are in the repository.
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-51, section: "3", depth: Partial}
      - {id: ST-50, section: "5", depth: Full}
      - {id: ST-53, section: "3", depth: Full}
      - {id: ST-106, section: "test plan", depth: Full}
    issues: [774, 788, 800]
    tests: [actors/signer/tests/sign.rs]
    verification:
      - {kind: integration-test, ref: "signer, with no algorithm configured, has key@ sign a header whose alg is ES384, and go-jose verifies the token against the published key set (actors/signer/tests/sign.rs)"}
  - id: REQ-TOKEN-020
    area: TOKEN
    split_from: REQ-TOKEN-002
    statement: "sluis MUST publish every pre-published, active and retiring key in the key set with a kid."
    rationale: "Verifiers need a stable key set and a default that every driver supports."
    level: MUST
    source: v1-parity
    # Reworded 2026-11-07 to the proof we have: tests/testdata/key/keyset-vectors.json (known answers made with openssl) and the state test
    # in entry's discovery.rs. No RFC 7517 appendix vectors are in the repository.
    # partial: the OIDF Config OP plan has not run.
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-51, section: "3", depth: Partial}
      - {id: ST-50, section: "5", depth: Full}
      - {id: ST-53, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [774, 788, 800]
    verification:
      - {kind: test-vectors, ref: "tests/testdata/key/keyset-vectors.json: the key set lists a pre-published, an active and a retiring key, each with a kid, and no other state; entry and signer both hold their key set to it"}
      - {kind: conformance-suite, ref: "OIDF suite v5.3.4: key set conditions pass; Config OP is red for one condition, RS256; public client, not the certification profile (docs/standards/conformance.md)"}
  - id: REQ-TOKEN-003
    area: TOKEN
    statement: "An access token MUST name exactly one audience."
    rationale: "A single-audience token cannot be replayed at another resource."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-52, section: "4.1.3", depth: Full}
      - {id: ST-56, section: "3.3", depth: Full}
    issues: [776, 791]
    verification:
      - {kind: integration-test, ref: "property test over all grants"}
  - id: REQ-TOKEN-004
    area: TOKEN
    statement: "A resource indicator MUST NOT appear in the audience of an ID token."
    rationale: "The ID token audience is the client; leaking the resource confuses verifiers."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-08, section: "2", depth: Full}
    issues: [776, 791]
    verification:
      - {kind: integration-test, ref: "negative test: the ID token audience is the client alone, and a resource indicator on the sign-in or on the code and refresh grants is refused before session sees it"}
  - id: REQ-TOKEN-005
    area: TOKEN
    statement: "sluis MUST issue an access token for a specific resource only when the request names it with the resource parameter."
    rationale: "Audience restriction depends on the client naming the target."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-08, section: "2", depth: Full}
    issues: [791]
    verification:
      - {kind: integration-test, ref: "resource matrix across code and refresh grants, with the audience of the ID token checked in each cell (REQ-TOKEN-004)"}
  - id: REQ-TOKEN-021
    area: TOKEN
    split_from: REQ-TOKEN-005
    statement: "A request for an unknown or unlisted resource MUST fail with invalid_target."
    rationale: "Audience restriction depends on the client naming the target."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-08, section: "2", depth: Full}
    issues: [791]
    verification:
      - {kind: integration-test, ref: "invalid_target negative test"}
  - id: REQ-TOKEN-006
    area: TOKEN
    statement: "Personal data such as names and e-mail addresses MUST be released only when the granted scopes request it."
    rationale: "Minimal disclosure limits the impact of a leaked token."
    level: MUST
    source: v1-parity
    # Gate: UserInfo releases only `sub` until the person's state (hold, suspension) is read before any other claim is released, and the
    # scope that a refresh narrowed to is enforced; today it reads the chain's own scope and not the person (ADR 0018).
    # Owner decision 2026-11-07: to v1 parity, with this gate kept. The first working version releases `sub` only.
    status: partial
    gap: partly-built
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-28, section: "5.4", depth: Full}
      - {id: ST-56, section: "3.2", depth: Partial}
    issues: [776]
    verification:
      - {kind: integration-test, ref: "claim-release matrix, and UserInfo reads the hold and the suspension and the narrowed scope before it releases a claim beyond sub"}
  - id: REQ-TOKEN-022
    area: TOKEN
    split_from: REQ-TOKEN-006
    statement: "Personal data MUST NOT appear in access tokens issued for another resource."
    rationale: "Minimal disclosure limits the impact of a leaked token."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "5.4", depth: Full}
      - {id: ST-56, section: "3.2", depth: Partial}
    issues: [776]
    verification:
      - {kind: integration-test, ref: "cross-resource token scan"}
  - id: REQ-TOKEN-007
    area: TOKEN
    statement: "A deployment MAY configure access tokens for people to omit client_id and carry azp instead."
    rationale: "Some integrators separate person tokens from machine tokens by claim presence."
    level: MAY
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-13, section: "2.2", depth: Partial}
      - {id: ST-52, section: "4", depth: Full}
    issues: [776]
    superseded_by: [REQ-TOKEN-023]
    verification:
      - {kind: integration-test, ref: "configured-variant test"}
  - id: REQ-TOKEN-023
    area: TOKEN
    split_from: REQ-TOKEN-007
    statement: "The default access token format MUST conform to the JWT access token profile."
    rationale: "A default that follows the profile keeps ordinary verifiers working."
    level: MUST
    source: stakeholder-ciam
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-13, section: "2.2", depth: Partial}
      - {id: ST-52, section: "4", depth: Full}
    issues: [776]
    verification:
      - {kind: integration-test, ref: "default-profile conformance test"}
  - id: REQ-TOKEN-008
    area: TOKEN
    statement: "The userinfo endpoint MUST return only claims granted by scope for a token whose session is still live."
    rationale: "A token must not outlive the sign-in it came from."
    level: MUST
    source: v1-parity
    # Owner decision 2026-11-07: REQ-TOKEN-006 is v1 parity, so the first working version releases the sub and nothing else, which is
    # never more than a scope grants. The verification is that answer; the claims the scopes profile and email grant, and the OIDF
    # userinfo modules that need them, come with REQ-TOKEN-006.
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "5.3", depth: Full}
      - {id: ST-02, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [778, 793]
    tests: [actors/session/internal/sessiond/userinfo_test.go, actors/entry/tests/edge.rs]
    verification:
      - {kind: integration-test, ref: "UserInfo answers the sub of the live session's ID token and no other claim, whatever the scope"}
  - id: REQ-TOKEN-024
    area: TOKEN
    split_from: REQ-TOKEN-008
    statement: "The userinfo endpoint MUST answer 401 for a token whose session ended."
    rationale: "A token must not outlive the sign-in it came from."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "5.3", depth: Full}
      - {id: ST-02, section: "3", depth: Full}
    issues: [778, 793]
    tests: [actors/session/internal/sessiond/userinfo_test.go]
    verification:
      - {kind: integration-test, ref: "post-logout test"}
  - id: REQ-TOKEN-009
    area: TOKEN
    statement: "The revocation endpoint MUST accept a token together with a client authentication."
    rationale: "A uniform answer does not reveal token existence."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-11, section: "2", depth: Full}
    issues: [778]
    tests: [actors/session/internal/sessiond/revoke_test.go, actors/entry/tests/edge.rs]
    verification:
      - {kind: integration-test, ref: "revocation request test"}
  - id: REQ-TOKEN-025
    area: TOKEN
    split_from: REQ-TOKEN-009
    statement: "The revocation endpoint MUST end exactly the grant that a refresh token belongs to."
    rationale: "Revoking one grant must not end the others."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-11, section: "2", depth: Full}
    issues: [778]
    tests: [actors/session/internal/sessiond/revoke_test.go]
    verification:
      - {kind: integration-test, ref: "grant-scope revocation test"}
  - id: REQ-TOKEN-026
    area: TOKEN
    split_from: REQ-TOKEN-009
    statement: "The revocation endpoint MUST answer 200 for an unknown refresh token or a refresh token of another client, and 400 unsupported_token_type for a token shaped like a JWT."
    rationale: "A uniform answer does not reveal token existence, and a token shaped like a JWT is answered by its shape alone, so a genuine access token is not told it was revoked (recall is REQ-SESS-055)."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-11, section: "2", depth: Full}
    issues: [778]
    tests: [actors/session/internal/sessiond/revoke_test.go]
    verification:
      - {kind: integration-test, ref: "uniform-answer test"}
  - id: REQ-TOKEN-010
    area: TOKEN
    statement: "Token endpoint responses MUST be JSON."
    rationale: "Tokens must never be cached."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-01, section: "5.1", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [776]
    verification:
      - {kind: conformance-suite, ref: "OIDF v5.3.4 reads the token response as JSON; runner probes check application/json and no-store on success and 3 refusals. Conformance workflow, not a required check; public client"}
  - id: REQ-TOKEN-027
    area: TOKEN
    split_from: REQ-TOKEN-010
    statement: "Token endpoint responses MUST carry Cache-Control no-store."
    rationale: "Tokens must never be cached."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-01, section: "5.1", depth: Full}
    issues: [776]
    verification:
      - {kind: integration-test, ref: "header test"}
  - id: REQ-TOKEN-028
    area: TOKEN
    split_from: REQ-TOKEN-010
    statement: "A token endpoint error MUST be reported as an error code with status 400, or 401 for invalid_client."
    rationale: "Clients branch on the status and the code."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-01, section: "5.1", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [776]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
      - {kind: integration-test, ref: "error status test"}
  - id: REQ-TOKEN-011
    area: TOKEN
    statement: "sluis SHOULD bind access tokens to a client-held key with DPoP for clients of a sender-constrained profile."
    rationale: "Sender-constrained tokens cannot be replayed by a thief."
    level: SHOULD
    source: stakeholder-ciam
    # Withdrawn 2026-11-12: D1 B and D7 A (owner, 2026-11-12), ADR 0045: the customer-facing profile (FAPI, PAR, DPoP) is the upstream's.
    status: withdrawn
    superseded_by: [REQ-AUTHN-112]
    runtimes: all
    standards:
      - {id: ST-18, section: "7", depth: Full}
      - {id: ST-58, section: "3", depth: Full}
    issues: [912]
    verification:
      - {kind: conformance-suite, ref: "FAPI2-SP (DPoP variant)"}
      - {kind: integration-test, ref: "proof-replay tests"}
  - id: REQ-TOKEN-029
    area: TOKEN
    split_from: REQ-TOKEN-011
    statement: "A DPoP-bound access token SHOULD carry a cnf claim."
    rationale: "The cnf claim lets a resource server check the binding."
    level: SHOULD
    source: stakeholder-ciam
    # Withdrawn 2026-11-12: D1 B and D7 A (owner, 2026-11-12), ADR 0045: the customer-facing profile (FAPI, PAR, DPoP) is the upstream's.
    status: withdrawn
    superseded_by: [REQ-AUTHN-112]
    runtimes: all
    standards:
      - {id: ST-18, section: "7", depth: Full}
      - {id: ST-58, section: "3", depth: Full}
    issues: [912]
    verification:
      - {kind: integration-test, ref: "cnf claim test"}
  - id: REQ-TOKEN-012
    area: TOKEN
    statement: "A DPoP proof sent by a client of a profile that does not use DPoP MUST be refused with invalid_request."
    rationale: "Silently issuing a bearer token to a client that asked for binding is a downgrade."
    level: MUST
    source: stakeholder-ciam
    # Withdrawn 2026-11-12: D1 B and D7 A (owner, 2026-11-12), ADR 0045: the customer-facing profile (FAPI, PAR, DPoP) is the upstream's.
    status: withdrawn
    superseded_by: [REQ-AUTHN-112]
    runtimes: all
    standards:
      - {id: ST-18, section: "5", depth: Partial}
    issues: [912]
    verification:
      - {kind: integration-test, ref: "negative test"}
  - id: REQ-TOKEN-013
    area: TOKEN
    statement: "An ID token MUST carry iss, sub, aud equal to the client, exp and iat."
    rationale: "The ID token is the proof of sign-in the client verifies."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [776]
    verification:
      - {kind: conformance-suite, ref: "OIDF v5.3.4: code-flow ID token has iss, sub, aud equal to the client (a string), exp, iat, valid signature. Conformance workflow, not a required check; public client, not certification"}
  - id: REQ-TOKEN-030
    area: TOKEN
    split_from: REQ-TOKEN-013
    statement: "An ID token MUST carry nonce when the request supplied one."
    rationale: "The nonce binds the token to the request."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [776]
    verification:
      - {kind: conformance-suite, ref: "OIDF v5.3.4: ValidateIdTokenNonce, the request's nonce in the code-flow ID token. Conformance workflow, not a required check; public client, not the certification profile"}
  - id: REQ-TOKEN-031
    area: TOKEN
    split_from: REQ-TOKEN-013
    statement: "An ID token MUST carry auth_time when it was requested."
    rationale: "The ID token is the proof of sign-in the client verifies."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [776]
    verification:
      - {kind: conformance-suite, ref: "OIDF suite v5.3.4: the max-age modules send no PKCE challenge and are refused, until a confidential client may skip PKCE; public client, not the certification profile (docs/standards/conformance.md)"}
  - id: REQ-TOKEN-014
    area: TOKEN
    statement: "sluis MAY serve token introspection to explicitly permitted confidential clients, reporting active=false once the session has ended."
    rationale: "Resource servers sometimes need liveness."
    level: MAY
    source: stakeholder-ciam
    status: planned
    milestone: backlog
    runtimes: all
    standards:
      - {id: ST-12, section: "2", depth: Full}
    issues: [927]
    verification:
      - {kind: integration-test, ref: "introspection tests"}
  - id: REQ-TOKEN-015
    area: TOKEN
    statement: "sluis MAY issue pairwise subject identifiers per sector, derived from the sluis subject with a keyed hash of one non-rotating key per tenant, so that two sectors cannot correlate a person."
    rationale: "Pairwise subjects prevent cross-service tracking, while single sign-on follows the sluis session and does not depend on the subject."
    level: MAY
    source: stakeholder-ciam
    # Withdrawn 2026-11-12: D1 B and D7 A (owner, 2026-11-12), ADR 0045: pairwise subjects per sector are cancelled.
    status: withdrawn
    superseded_by: [REQ-TOKEN-045]
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
      - {id: NC-06, section: "2104", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [1733]
    verification:
      - {kind: test-vectors, ref: "own subject vectors"}
      - {kind: conformance-suite, ref: "OIDF Basic OP with pairwise subject"}
  - id: REQ-TOKEN-016
    area: TOKEN
    statement: "A subject identifier MUST be an opaque string."
    rationale: "Reversible subjects leak the underlying identifier."
    level: MUST
    source: stakeholder-ciam
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
    issues: [1081]
    verification:
      - {kind: integration-test, ref: "subject opacity test"}
  - id: REQ-TOKEN-032
    area: TOKEN
    split_from: REQ-TOKEN-016
    statement: "A subject identifier MUST NOT be derived with a reversible cipher."
    rationale: "Reversible subjects leak the underlying identifier."
    level: MUST
    source: stakeholder-ciam
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
    issues: [1081]
    verification:
      - {kind: integration-test, ref: "subject derivation review test"}
  - id: REQ-TOKEN-033
    area: TOKEN
    statement: "An access token and an ID token MUST carry in groups only the held grants whose scope and thing appear among the pairs of the audience's requires, and those of the things its groups override names."
    rationale: "A relying party must not read a grant meant for another system (ADR 0020)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [776, 788, 1815]
    verification:
      - {kind: integration-test, ref: "hold grants on two things: the token for the first audience carries only that thing's grants"}
      - {kind: test-vectors, ref: "kits/conformance/token/groups-vectors.json, narrowing: kits/go/groupsclaim holds the rule, and session and exchange take their claim from it"}
  - id: REQ-TOKEN-034
    area: TOKEN
    statement: "sluis MUST NOT issue a claim that is not in the declared claim set of its token type."
    rationale: "A fixed set lets the claims be tested as a whole and keeps configuration from widening a token (ADR 0020)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [776]
    verification:
      - {kind: integration-test, ref: "a configuration that names another claim is refused at load; no token carries one"}
  - id: REQ-TOKEN-035
    area: TOKEN
    statement: "A token MUST omit acr, amr and auth_time when the upstream sent none."
    rationale: "An absent value means unknown, and a default would claim an assurance that was never shown."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [776, 1106]
    verification:
      - {kind: integration-test, ref: "sign in through an upstream that sends none of them: the tokens carry none"}
  - id: REQ-TOKEN-036
    area: TOKEN
    statement: "The access and ID tokens of a person MUST default to a lifetime of 1 hour."
    rationale: "The default is v1's, so relying parties tuned to it keep working (ADR 0020)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [776]
    verification:
      - {kind: integration-test, ref: "issue a token with no setting: exp minus iat is 3600 seconds"}
  - id: REQ-TOKEN-037
    area: TOKEN
    statement: "A token's exp MUST be no later than the earliest of the issuer's token_ttl, the client's ttl_cap, the end of its session and the end of the exchanged proof."
    rationale: "A token must never outlive what it came from (ADR 0020)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [776]
    verification:
      - {kind: integration-test, ref: "set each limit below the others in turn: exp follows the shortest"}
  - id: REQ-TOKEN-038
    area: TOKEN
    statement: "sluis config check MUST refuse a token_ttl or a ttl_cap above 1 hour."
    rationale: "The maximum is fixed in code, and a longer token needs a new decision record."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [776]
    verification:
      - {kind: integration-test, ref: "a value of 2h is refused with the path of the field"}
  - id: REQ-TOKEN-039
    area: TOKEN
    statement: "sluis MUST issue a token without cnf for an audience that does not declare binding."
    rationale: "The relying parties of v1 parity accept bearer tokens only (ADR 0020)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [776]
    verification:
      - {kind: integration-test, ref: "a token for an undeclared audience has no cnf"}
  - id: REQ-TOKEN-040
    area: TOKEN
    statement: "An access token for an audience of profile fapi2 MUST be sender-constrained by DPoP or mutual TLS."
    rationale: "The profile demands bound tokens (ADR 0038)."
    level: MUST
    source: standard
    # Withdrawn 2026-11-12: D1 B and D7 A (owner, 2026-11-12), ADR 0045: the customer-facing profile (FAPI, PAR, DPoP) is the upstream's.
    status: withdrawn
    superseded_by: [REQ-AUTHN-112]
    runtimes: all
    standards:
      - {id: ST-37, depth: Partial}
      - {id: ST-18, depth: Partial}
    issues: [912]
    verification:
      - {kind: integration-test, ref: "unbound token for a fapi2 audience is never issued"}
  - id: REQ-TOKEN-041
    area: TOKEN
    statement: "sluis MUST NOT sign a token for an audience of profile fapi2 with an algorithm other than PS256, ES256 or EdDSA."
    rationale: "The profile does not allow ES384."
    level: MUST
    source: standard
    # Withdrawn 2026-11-12: D1 B and D7 A (owner, 2026-11-12), ADR 0045: the customer-facing profile (FAPI, PAR, DPoP) is the upstream's.
    status: withdrawn
    superseded_by: [REQ-AUTHN-112]
    runtimes: all
    standards:
      - {id: ST-37, depth: Partial}
    issues: [912]
    verification:
      - {kind: integration-test, ref: "algorithm test for a fapi2 audience"}
  - id: REQ-TOKEN-042
    area: TOKEN
    statement: "The relying-party documentation MUST state the verifier contract: honour the max-age of the key set, and fetch it again when a token names an unfamiliar kid (OpenID Connect Core section 10.1.1)."
    rationale: "The lead time of a new key assumes a verifier that follows HTTP caching and the discovery rule, so the page must say what sluis relies on (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    features: ["design"]
    manual_reason: "A statement in published documentation is checked by reading it."
    verification:
      - {kind: manual, ref: "documentation review: the page Verifying tokens states both duties"}
  - id: REQ-TOKEN-043
    area: TOKEN
    statement: "signer MUST sign the ID token of an audience whose signing_alg is RS256 with RS256, and every other token with ES384, by the audience's declaration alone."
    rationale: "The audience decides and the caller cannot, so a compromised session or exchange cannot pick a weaker or a different key, and the bearer check of session, which takes ES384 access tokens alone, never meets an RS256 one (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    issues: [788]
    tests: [actors/signer/tests/sign.rs]
    verification:
      - {kind: integration-test, ref: "session and exchange get the same answers; go-jose verifies the RS256 ID token and the ES384 tokens (an_id_token_is_rs256_when_the_audience_says_so_and_every_other_token_stays_es384)"}
  - id: REQ-TOKEN-044
    area: TOKEN
    statement: "signer MUST refuse an ID token for an RS256 audience when no RS256 key is active, and sign it with no other key."
    rationale: "A relying party that asked for RS256 would meet an alg it did not expect, so the answer is a refusal with a closed reason, never a downgrade (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    issues: [788]
    tests: [actors/signer/tests/sign.rs]
    verification:
      - {kind: integration-test, ref: "unlisted, no key, pre-published, revoked: each refused and audited, no ES384 token made (with_no_active_rs256_key_an_rs256_audience_is_refused_and_never_given_es384)"}
  - id: REQ-TOKEN-045
    area: TOKEN
    statement: "A sluis token issued by an exchange of an upstream token MUST carry the customer, the organisation and the product that exchange set from the claims of that token."
    rationale: "Services call each other with the sluis token and need the three claims, and the request must never name them (ADR 0045, ADR 0020)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [782, 785]
    verification:
      - {kind: integration-test, ref: "a token of the trusted realm yields a sluis token with the three claims; a request that names them changes nothing"}

  - id: REQ-TOKEN-046
    area: TOKEN
    statement: "A token for a client MUST carry in groups every held grant name of each thing that the client's groups override names, in every scope and role, in addition to the pairs of its requires."
    rationale: "One relying party may read more than the pairs it requires, and the thing list names what, so a reviewer sees it (ADR 0020)."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [788, 1815]
    tests: [kits/go/groupsclaim/groupsclaim_test.go, actors/session/internal/sessiond/token_test.go, actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: test-vectors, ref: "kits/conformance/token/groups-vectors.json, narrowing: an override keeps every scope and role of a thing, adds to the pairs and takes none away, matches the thing whole"}
      - {kind: integration-test, ref: "sign-in, refresh and exchange give the ID token and the access token the same claim for a client with an override"}
  - id: REQ-TOKEN-047
    area: TOKEN
    statement: "A token for a client that declares a groups delimiter MUST carry each group written with that delimiter in place of each colon of the grant name, after narrowing."
    rationale: "Some verifiers split a group on the colon, and the audience that has one must be given names they can read (ADR 0020)."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [788, 1815]
    tests: [kits/go/groupsclaim/groupsclaim_test.go, actors/session/internal/sessiond/token_test.go, actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: test-vectors, ref: "kits/conformance/token/groups-vectors.json, narrowing: the delimiter respells every kept name, one or several characters, and changes which names are kept in no case"}
      - {kind: integration-test, ref: "ID token and access token, at sign-in and at a refresh, and the access token of an exchange, carry the respelled claim"}
  - id: REQ-TOKEN-048
    area: TOKEN
    statement: "signer MUST refuse a token whose groups are not grant names written with the groups delimiter of the audience's client, or with the colon when it declares none."
    rationale: "What signer signs must be what the policy of the claim allows, and a name written another way is a claim that nothing checked (ADR 0020)."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    actors: [signer]
    issues: [788, 1815]
    tests: [actors/signer/tests/sign.rs]
    verification:
      - {kind: integration-test, ref: "ID and access tokens for a client with a dot, a slash and no delimiter: the right names sign; another delimiter, the colon, a short or long name, a wildcard and a repeat are refused at claims.groups"}
  - id: REQ-TOKEN-049
    area: TOKEN
    statement: "A token MUST live for the shortest of the built-in maximum of 1 hour, the issuer's lifetime for its type (the ID token and the access token each have their own) and the cap of its audience's client, never past the end of its session chain or of the exchanged proof."
    rationale: "Each audience gets the lifetime its own client allows, so a relying party that tuned its refresh to a short cap keeps it, and no limit can lengthen a token (ADR 0020; v1: the lifetime of the deployment narrowed by the client's ttl_cap)."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [776, 786, 1817]
    tests: [kits/go/lifetime/lifetime_test.go, actors/session/internal/sessiond/token_ttlcap_test.go, actors/signer/src/claims.rs]
    verification:
      - {kind: test-vectors, ref: "kits/conformance/token/lifetime-vectors.json, expiry: issuer, client cap, maximum, chain and proof ends; session and exchange use kits/go/lifetime, signer holds exp minus iat to the same cap"}
      - {kind: integration-test, ref: "four clients with caps of 5 minutes, 2 minutes, 30 minutes and none: ID token, access token and expires_in follow each cap at sign-in and refresh; the chain is as long for all"}
  - id: REQ-TOKEN-050
    area: TOKEN
    statement: "sluis config check MUST refuse a TokenLifetime in which a token lifetime is above 1 hour, the absolute session limit is above 24 hours, the idle limit is above the absolute limit or a token lifetime is above the absolute limit, naming the field."
    rationale: "A file that session would cut to its maximum at run time is a file that does not say what it means; the check says so when the configuration loads (ADR 0018, ADR 0020; v1: the absolute limit is at least the token lifetime)."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [786, 1817]
    tests: [actors/store/tests/validate.rs]
    verification:
      - {kind: integration-test, ref: "an ID token of 61 minutes, a session of 25 hours, an idle limit or a token above the session are refused with the field path; the maxima and tokens as long as the session are accepted"}
  - id: REQ-TOKEN-051
    area: TOKEN
    statement: "A token for a resource MUST live no longer than the shorter of the ttl_cap of the client that asked and the ttl_cap of the resource."
    rationale: "The client and the resource each said not longer than this, and honouring the longer would answer neither (v1: the shorter of the client's and the resource's caps wins)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-08, section: "2", depth: Full}
    issues: [791]
    verification:
      - {kind: test-vectors, ref: "kits/conformance/token/lifetime-vectors.json, expiry: the resource_ttl_cap vectors, once a client declares a resource"}
