    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "subject unchanged after e-mail change test"}
  - id: REQ-REG-056
    area: REG
    statement: "Lifecycle rules MUST live in a policy table."
    rationale: "Operators must be able to review the lifecycle."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "lifecycle policy load test"}
  - id: REQ-REG-057
    area: REG
    statement: "A corporate account MUST be disabled when its connection is removed or after an idle period, and deleted after retention."
    rationale: "An orphaned corporate account is a standing credential."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "corporate lifecycle test"}
  - id: REQ-REG-058
    area: REG
    statement: "A personal account MUST be deleted after an idle period, with prior notice."
    rationale: "Unused accounts should not be kept forever."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "idle deletion notice test"}
  - id: REQ-REG-059
    area: REG
    statement: "Data-subject export and deletion MUST be supported."
    rationale: "The person's rights must be exercisable."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "export and deletion test"}
  - id: REQ-REG-060
    area: REG
    statement: "Account deletion MUST run in the order hub sign-out, entity response window, hub delete, context disable with grant revocation, vault delete."
    rationale: "Each step depends on the one before."
