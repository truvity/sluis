    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "path closure test"}
