# REG: Registration, recovery and lifecycle (open scope)
schema: 1
area: REG
requirements:
  - id: REQ-REG-001
    area: REG
    statement: "Registration MUST be reachable by a link from the identifier page."
    rationale: "Any sign-in can lead to registration."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "identifier page link test"}
  - id: REQ-REG-002
    area: REG
    statement: "Registration MUST be reachable directly by prompt=create, including through a pushed authorization request."
    rationale: "Any relying party can start registration."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
      - {id: ST-16, section: "2", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "prompt=create PAR test"}
  - id: REQ-REG-003
    area: REG
    statement: "Registration MUST complete the steps e-mail address, one-time code, display profile, terms acceptance, passkey creation and recovery codes, in this order."
    rationale: "The account gets a factor and a recovery path before any code is issued."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "7", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "registration order test"}
  - id: REQ-REG-004
    area: REG
    statement: "The account MUST become live only when registration completes."
    rationale: "A half-registered account must not reach a product."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "5", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "state after completion test"}
  - id: REQ-REG-005
    area: REG
    statement: "Discovery MUST list create in prompt_values_supported."
    rationale: "Relying parties learn from discovery that they can start registration."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-29, section: "3", depth: Partial}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
  - id: REQ-REG-006
    area: REG
    statement: "No authorization code MUST be issued until the account has a verified e-mail address, a passkey, an acknowledged set of recovery codes and accepted terms."
    rationale: "A half-registered account must not reach a product."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "abandoned registration test"}
  - id: REQ-REG-007
    area: REG
    statement: "Abandoning registration at any step MUST leave the account pending."
    rationale: "Only a complete registration makes an account live."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "5", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "abandon-at-each-step test"}
  - id: REQ-REG-008
    area: REG
    statement: "The session of a completed registration MUST have the configured registration assurance level, by default the lowest."
    rationale: "Registration proves little beyond the new factor."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-01, section: "8176", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "registration level test"}
  - id: REQ-REG-009
    area: REG
    statement: "Registration mail MUST be sent asynchronously."
    rationale: "Synchronous mail would make the response time depend on the account."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-14, section: "SPF DKIM DMARC", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "response timing test"}
  - id: REQ-REG-010
    area: REG
    statement: "The owner of an existing account MUST receive an already-registered notice in place of a code."
    rationale: "Registration must not become an oracle for who is a customer."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-14, section: "SPF DKIM DMARC", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "mail sink content test"}
  - id: REQ-REG-011
    area: REG
    statement: "An e-mail verification code MUST be six digits from a cryptographic random source."
    rationale: "A random code cannot be predicted."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-90, section: "A", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "code format and entropy test"}
  - id: REQ-REG-012
    area: REG
    statement: "An e-mail verification code MUST be single use."
    rationale: "A replayed code must not verify."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "code reuse test"}
  - id: REQ-REG-013
    area: REG
    statement: "An e-mail verification code MUST be valid for at most 10 minutes."
    rationale: "A short life limits guessing."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "code expiry test"}
  - id: REQ-REG-014
    area: REG
    statement: "An e-mail verification code MUST allow at most 5 attempts."
    rationale: "Attempts must be bounded to resist guessing."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "attempt limit test"}
  - id: REQ-REG-015
    area: REG
    statement: "At most 5 e-mail verification codes MUST be issued per address per hour."
    rationale: "Bounded issuance limits mail abuse."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "issuance limit test"}
  - id: REQ-REG-016
    area: REG
    statement: "Only a keyed hash of an e-mail verification code MUST be stored."
    rationale: "A stolen store must not reveal live codes."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "code storage scan"}
  - id: REQ-REG-017
    area: REG
    statement: "The account MUST record the verification time of its e-mail address when the code is verified."
    rationale: "E-mail is the contact and notice channel, so its ownership must be proven."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "5.1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "verified claim after registration test"}
  - id: REQ-REG-018
    area: REG
    statement: "Registration MUST record the accepted terms version and time on the account."
    rationale: "The controller must prove consent to its terms."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "5", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "terms record test"}
  - id: REQ-REG-019
    area: REG
    statement: "When the current terms version differs from the account's, the next interactive sign-in of a personal account MUST show the terms interstitial before a code is issued."
    rationale: "A change of terms needs fresh consent."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "terms version change test"}
  - id: REQ-REG-020
    area: REG
    statement: "A corporate account MUST NOT be shown the terms page."
    rationale: "The organisation's contract covers corporate accounts."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "corporate sign-in test"}
  - id: REQ-REG-021
    area: REG
    statement: "A terms acceptance MUST be sent to the control plane as an event that names the account reference."
    rationale: "The control plane needs the record without the internal identifier."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "outbox event test"}
  - id: REQ-REG-022
    area: REG
    statement: "A personal account MUST receive recovery codes right after its first passkey."
    rationale: "Passkey-only accounts need self-service recovery."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "recovery code issuance test"}
  - id: REQ-REG-023
    area: REG
    statement: "A recovery code MUST carry 80 bits of entropy."
    rationale: "The code must resist offline and online guessing."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-90, section: "A", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: test-vectors, ref: "recovery code vector"}
      - {kind: integration-test, ref: "entropy test"}
  - id: REQ-REG-024
    area: REG
    statement: "Recovery codes MUST be shown only once."
    rationale: "A code shown again would have to be stored in clear."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "single display test"}
  - id: REQ-REG-025
    area: REG
    statement: "The person MUST confirm that the recovery codes are saved before registration continues."
    rationale: "An unconfirmed code set is a false recovery path."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "confirmation gate test"}
  - id: REQ-REG-026
    area: REG
    statement: "A typed recovery code MUST be canonicalised before hashing: uppercase, spaces and hyphens removed, I and L read as 1, O read as 0."
    rationale: "Typing errors must not lock out a person."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: test-vectors, ref: "recovery code canonicalisation vectors"}
  - id: REQ-REG-027
    area: REG
    statement: "A recovery code MUST verify only once."
    rationale: "A used code must not work again."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "code reuse test"}
  - id: REQ-REG-028
    area: REG
    statement: "Regenerating recovery codes MUST invalidate all old codes."
    rationale: "A leaked old set must stop working."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "regeneration test"}
  - id: REQ-REG-029
    area: REG
    statement: "The mail module MUST send verification codes, notices and recovery messages."
    rationale: "Registration, notices and recovery depend on mail."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-14, section: "SPF DKIM DMARC", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "code delivery to sink test"}
  - id: REQ-REG-030
    area: REG
    statement: "The mail module MUST provide templates for every configured locale."
    rationale: "Messages must reach people in their language."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-04, section: "WCAG 2.1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "locale template coverage test"}
  - id: REQ-REG-031
    area: REG
    statement: "The mail module MUST send through an outbox with retries."
    rationale: "A transient failure must not lose a message."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-14, section: "SPF DKIM DMARC", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "mail transport failure test"}
  - id: REQ-REG-032
    area: REG
    statement: "The mail module MUST apply per-address and global abuse limits."
    rationale: "Mail must not become an amplification channel."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-14, section: "SPF DKIM DMARC", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "abuse limit test"}
  - id: REQ-REG-033
    area: REG
    statement: "The mail module MUST sign messages with DKIM on the operator's domain in the production profile."
    rationale: "Unsigned mail is distrusted or spoofed."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-14, section: "DKIM", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "DKIM signature check"}
  - id: REQ-REG-034
    area: REG
    statement: "The built-in mail sink MUST be refused at load in the production profile."
    rationale: "A sink keeps messages readable by the test interface."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-14, section: "SPF DKIM DMARC", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "production load refusal test"}
  - id: REQ-REG-035
    area: REG
    statement: "A pending account and its pointer records MUST expire after a configured time to live, by default 72 hours."
    rationale: "Abandoned registrations must not hold addresses forever."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "pending expiry test"}
  - id: REQ-REG-036
    area: REG
    statement: "Completing registration MUST make the account permanent."
    rationale: "A live account must not expire as a pending one."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "expiry removal test"}
  - id: REQ-REG-037
    area: REG
    statement: "Registration and fallback sign-in MUST call a pluggable challenge port."
    rationale: "Bot protection must be replaceable."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "challenge enforcement test"}
  - id: REQ-REG-038
    area: REG
    statement: "The none challenge adapter MUST be refused at load in the production profile."
    rationale: "Production must not run without bot protection."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "production load refusal test"}
  - id: REQ-REG-039
    area: REG
    statement: "A verified recovery code MUST open a session that is restricted to passkey enrolment."
    rationale: "A stolen code must not give access to a regulated entity."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "restricted recovery session test"}
  - id: REQ-REG-040
    area: REG
    statement: "A recovery session MUST NOT be able to obtain an authorization code."
    rationale: "The session exists only to enrol a passkey."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "recovery session code refusal test"}
  - id: REQ-REG-041
    area: REG
    statement: "Every recovery MUST start a cool-down of a configured length, by default 72 hours."
    rationale: "Recovery is the main takeover path."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "cool-down start test"}
  - id: REQ-REG-042
    area: REG
    statement: "During a cool-down a signed cancel link MUST be sent by e-mail and shown on the account page."
    rationale: "The real owner must be able to stop a takeover."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "cancel link test"}
  - id: REQ-REG-043
    area: REG
    statement: "During a cool-down any old authenticator MUST be able to cancel the recovery."
    rationale: "The old factors still belong to the real owner."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "cancel by old authenticator test"}
  - id: REQ-REG-044
    area: REG
    statement: "During a cool-down tokens MUST carry a cool-down marker."
    rationale: "Relying parties can then apply their own caution."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-52, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "cool-down marker test"}
  - id: REQ-REG-045
    area: REG
    statement: "During a cool-down the assurance level MUST be capped at the configured cap."
    rationale: "A fresh recovery must not open regulated contexts."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-01, section: "8176", depth: Partial}
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "acr under cool-down test"}
  - id: REQ-REG-046
    area: REG
    statement: "Where shared signals are deployed, a recovery MUST emit a recovery-activated signal to contexts."
    rationale: "Contexts can then react to the risk."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-26, section: "CAEP", depth: Partial}
      - {id: NC-03, section: "8417", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "recovery signal test"}
  - id: REQ-REG-047
    area: REG
    statement: "Recovery without codes MUST be an enrolment action that the control plane issues after identity is re-verified outside sluis."
    rationale: "No single insider may be able to take over an account."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: manual, ref: "process review"}
      - {kind: integration-test, ref: "action issuance test"}
  - id: REQ-REG-048
    area: REG
    statement: "The accounts module MUST execute an enrolment action for recovery only with a dual-signed intent."
    rationale: "Two people must agree."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-49, section: "7", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "single-signature refusal test"}
  - id: REQ-REG-049
    area: REG
    statement: "A recovery enrolment action MUST revoke all sessions and old factors, including the vault password and one-time password."
    rationale: "The old factors may be in the attacker's hands."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "factor revocation test"}
  - id: REQ-REG-050
    area: REG
    statement: "The vault provider's own password reset MUST be disabled."
    rationale: "Mailbox control must not equal account control."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "vault reset disabled test"}
  - id: REQ-REG-051
    area: REG
    statement: "A relying-party access token, an exchanged token or an administrative intent MUST NOT add, change or remove a factor."
    rationale: "A token leak must never become a persistent takeover."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
