    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-31, section: "2.4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "deletion saga order test"}
  - id: REQ-REG-061
    area: REG
    statement: "The deletion saga MUST be idempotent under replay and leave no pointer records."
    rationale: "A crashed deletion must be safely retried."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "saga replay test"}
  - id: REQ-REG-062
    area: REG
    statement: "Organisation events MUST NOT delete people."
    rationale: "An organisation's decision must not erase a person's personal account."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "organisation event test"}
  - id: REQ-REG-063
    area: REG
    statement: "A cohort import MUST create each account live and personal, idempotently per record."
    rationale: "A re-run must not create duplicates."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "re-run import test"}
  - id: REQ-REG-064
    area: REG
    statement: "A cohort import MUST NOT merge accounts by e-mail address."
    rationale: "Merging by address would join two people."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "5.7", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "conflicting address test"}
  - id: REQ-REG-065
    area: REG
    statement: "Password hashes MUST NOT transit sluis during a cohort import."
    rationale: "Offline-guessable verifiers must not pass through the platform."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "import payload scan"}
  - id: REQ-REG-066
    area: REG
    statement: "A cohort import MUST create a vault user with the pseudonym only."
    rationale: "The vault must stay blind."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "import vault record test"}
  - id: REQ-REG-067
    area: REG
    statement: "Imported password hashes MUST be loaded into the vault by its configuration pipeline under a journaled dual-signed migration intent."
    rationale: "The load is a vault mutation like any other."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-49, section: "7", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "import pipeline journal test"}
  - id: REQ-REG-068
    area: REG
    statement: "The accounts module MUST confirm each imported vault user by inventory: exactly one password and no one-time password."
    rationale: "The inventory proves that the import did what was approved."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "inventory confirmation test"}
  - id: REQ-REG-069
    area: REG
    statement: "The first sign-in of a migrated account MUST run e-mail code, terms, passkey and recovery codes in that order."
    rationale: "The migrated account gets the same protection as a new one."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "7", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "migrant first sign-in test"}
