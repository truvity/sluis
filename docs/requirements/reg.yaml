# REG: Registration, recovery and lifecycle
schema: 1
area: REG
requirements:
  - id: REQ-REG-030
    area: REG
    statement: "The e-mail Notifier MUST provide templates for every configured locale."
    rationale: "Messages must reach people in their language."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: backlog
    runtimes: all
    standards:
      - {id: NC-04, section: "WCAG 2.1", depth: Partial}
    issues: [927]
    verification:
      - {kind: integration-test, ref: "locale template coverage test"}
  - id: REQ-REG-031
    area: REG
    statement: "The e-mail Notifier MUST send through an outbox with retries."
    rationale: "A transient failure must not lose a message."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: backlog
    runtimes: all
    standards:
      - {id: NC-14, section: "SPF DKIM DMARC", depth: Partial}
    issues: [927]
    verification:
      - {kind: integration-test, ref: "mail transport failure test"}
  - id: REQ-REG-032
    area: REG
    statement: "The e-mail Notifier MUST apply per-address and global abuse limits."
    rationale: "Mail must not become an amplification channel."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: backlog
    runtimes: all
    standards:
      - {id: NC-14, section: "SPF DKIM DMARC", depth: Partial}
    issues: [927]
    verification:
      - {kind: integration-test, ref: "abuse limit test"}
  - id: REQ-REG-033
    area: REG
    statement: "The e-mail Notifier MUST sign messages with DKIM on the operator's domain in the production profile."
    rationale: "Unsigned mail is distrusted or spoofed."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: backlog
    runtimes: all
    standards:
      - {id: NC-14, section: "DKIM", depth: Full}
    issues: [927]
    verification:
      - {kind: integration-test, ref: "DKIM signature check"}
  - id: REQ-REG-034
    area: REG
    statement: "The e-mail Notifier MUST refuse the built-in mail sink at load in the production profile."
    rationale: "A sink keeps messages readable by the test interface."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: backlog
    runtimes: all
    standards:
      - {id: NC-14, section: "SPF DKIM DMARC", depth: Partial}
    issues: [927]
    verification:
      - {kind: integration-test, ref: "production load refusal test"}
  - id: REQ-REG-051
    area: REG
    statement: "A relying-party access token, an exchanged token or an administrative intent MUST NOT add, change or remove a factor of a person record."
    rationale: "A token leak must never become a persistent takeover."
    level: MUST
    source: stakeholder-ciam
    status: done
    milestone: core
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [885]
    verification:
      - {kind: integration-test, ref: "bearer-token mutation scan for adding a factor (kinds found by name or by_credential index); changing or removing one has no route yet, so it needs its own scan"}
  - id: REQ-REG-052
    area: REG
    statement: "A factor change MUST need a fresh own factor from the person."
    rationale: "The person, not a token, authorises the change."
    level: MUST
    source: stakeholder-ciam
    status: done
    milestone: core
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    issues: [885]
    verification:
      - {kind: integration-test, ref: "a passkey is added only after a fresh sign-in at the upstream and two policy decisions; a hardware-attested holder needs more (REQ-AUTHN-091, planned), not covered here"}
  - id: REQ-REG-074
    area: REG
    split_from: REQ-REG-029
    statement: "The e-mail Notifier MUST send security alerts through the configured provider."
    rationale: "A person learns of a new passkey or a sign-in from a new device by mail."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: backlog
    runtimes: all
    standards:
      - {id: NC-14, section: "SPF DKIM DMARC", depth: Partial}
    issues: [927]
    verification:
      - {kind: integration-test, ref: "security alert delivery to sink test"}
