    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "bearer-token mutation scan"}
  - id: REQ-REG-052
    area: REG
    statement: "A factor change MUST need a fresh own factor from the person on the account host."
    rationale: "The person, not a token, authorises the change."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "factor change authorisation test"}
  - id: REQ-REG-053
    area: REG
    statement: "An e-mail change MUST require a fresh own factor at the second assurance level."
    rationale: "Changing the contact channel is a takeover step."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-01, section: "8176", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "e-mail change authorisation test"}
  - id: REQ-REG-054
    area: REG
    statement: "The new address of an e-mail change MUST be verified by code."
    rationale: "The new mailbox must be proven."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "5.1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "new address verification test"}
  - id: REQ-REG-055
    area: REG
    statement: "An e-mail change MUST NOT change any relying-party subject."
    rationale: "Subjects are derived from the account identifier, not the address."
