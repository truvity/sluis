# AUTHN: Authentication and authorization endpoint
schema: 1
area: AUTHN
requirements:
  - id: REQ-AUTHN-001
    area: AUTHN
    statement: "The authorization endpoint MUST serve only the authorization code response type."
    rationale: "A single flow keeps the attack surface small and matches current security guidance."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-01, section: "3.1.1", depth: Partial}
      - {id: ST-14, section: "2.1.2", depth: Full}
      - {id: ST-28, section: "3.1", depth: Partial}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#775"]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
  - id: REQ-AUTHN-025
    area: AUTHN
    split_from: REQ-AUTHN-001
    statement: "The authorization endpoint MUST answer implicit and hybrid response types with unsupported_response_type."
    rationale: "A refused flow must be reported with a code that a client can act on."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-01, section: "3.1.1", depth: Partial}
      - {id: ST-14, section: "2.1.2", depth: Full}
      - {id: ST-28, section: "3.1", depth: Partial}
    features: ["#775"]
    verification:
      - {kind: integration-test, ref: "negative test for each refused response type"}
  - id: REQ-AUTHN-002
    area: AUTHN
    statement: "sluis MUST require PKCE with the S256 method on every authorization code request."
    rationale: "PKCE with a strong method defeats code interception and injection."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-03, section: "4.2-4.3", depth: Full}
      - {id: ST-14, section: "2.1.1", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#775"]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP (PKCE variant)"}
  - id: REQ-AUTHN-026
    area: AUTHN
    split_from: REQ-AUTHN-002
    statement: "sluis MUST refuse the plain method and a missing code challenge on an authorization code request."
    rationale: "A downgrade to plain or to no challenge reopens code interception."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-03, section: "4.2-4.3", depth: Full}
      - {id: ST-14, section: "2.1.1", depth: Full}
    features: ["#775"]
    verification:
      - {kind: integration-test, ref: "negative tests for plain and missing challenge"}
  - id: REQ-AUTHN-003
    area: AUTHN
    statement: "A client redirect URI MUST be compared by exact string match, with only the port excluded from the comparison for a loopback IP-literal URI registered by a native client."
    rationale: "Exact matching blocks open-redirect and code-leak attacks."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "2.1", depth: Full}
      - {id: ST-04, section: "7.3", depth: Full}
    features: ["#775"]
    verification:
      - {kind: integration-test, ref: "redirect matrix (exact, prefix, case, userinfo, fragment, port)"}
  - id: REQ-AUTHN-004
    area: AUTHN
    statement: "A policy that registers a non-loopback http redirect URI MUST be refused at load, for every client type and every installation profile."
    rationale: "Cleartext redirects expose authorization codes to the network."
    level: MUST
    source: security-review
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "2.1", depth: Full}
      - {id: ST-04, section: "8.3", depth: Full}
    features: ["#775", "#786"]
    verification:
      - {kind: integration-test, ref: "policy-load negative test"}
  - id: REQ-AUTHN-005
    area: AUTHN
    statement: "Every authorization response that carries a code or an error MUST include the iss parameter."
    rationale: "The issuer parameter defends against mix-up attacks."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-10, section: "2", depth: Full}
      - {id: ST-29, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#774", "#775"]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
      - {kind: integration-test, ref: "response check"}
  - id: REQ-AUTHN-027
    area: AUTHN
    split_from: REQ-AUTHN-005
    statement: "Every authorization response MUST return state unchanged when the request carried one."
    rationale: "The client matches a response to its request by state."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-01, section: "4.1.2", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#774", "#775"]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
  - id: REQ-AUTHN-028
    area: AUTHN
    split_from: REQ-AUTHN-005
    statement: "Discovery MUST advertise authorization_response_iss_parameter_supported."
    rationale: "A relying party learns from discovery that it can require the parameter."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-10, section: "3", depth: Full}
      - {id: ST-29, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#774", "#775"]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
  - id: REQ-AUTHN-006
    area: AUTHN
    statement: "Discovery documents MUST list exactly the endpoints, grant types, algorithms and parameters that the installation serves."
    rationale: "A relying party configures itself from discovery, so any untruth misleads it."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-29, section: "4", depth: Full}
      - {id: ST-05, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#774"]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
      - {kind: test-vectors, ref: "own golden for authorization server metadata"}
  - id: REQ-AUTHN-029
    area: AUTHN
    split_from: REQ-AUTHN-006
    statement: "Discovery documents MUST be served at both the OpenID and the OAuth well-known locations, including the path-inserted URL."
    rationale: "Clients look in either location depending on their library."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-29, section: "4", depth: Full}
      - {id: ST-05, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#774"]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
      - {kind: integration-test, ref: "both-location fetch test"}
  - id: REQ-AUTHN-030
    area: AUTHN
    split_from: REQ-AUTHN-006
    statement: "The issuer in a discovery document MUST equal the iss value byte for byte."
    rationale: "A mismatch breaks issuer validation in every relying party."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-29, section: "4", depth: Full}
      - {id: ST-05, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#774"]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
      - {kind: integration-test, ref: "byte-equality test"}
  - id: REQ-AUTHN-007
    area: AUTHN
    statement: "The authorization endpoint MUST honour prompt=none and prompt=login."
    rationale: "Silent checks must never show UI and must report why interaction is needed."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#775"]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
  - id: REQ-AUTHN-031
    area: AUTHN
    split_from: REQ-AUTHN-007
    statement: "The authorization endpoint MUST answer prompt=none without rendering a page."
    rationale: "A silent check that shows UI breaks embedded clients."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#775"]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
      - {kind: integration-test, ref: "no-render test for prompt=none"}
  - id: REQ-AUTHN-032
    area: AUTHN
    split_from: REQ-AUTHN-007
    statement: "The authorization endpoint MUST refuse prompt=none combined with another value."
    rationale: "The combination has no defined meaning."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Full}
    features: ["#775"]
    verification:
      - {kind: integration-test, ref: "prompt combination matrix"}
  - id: REQ-AUTHN-008
    area: AUTHN
    statement: "The authorization endpoint MUST force a new authentication when max_age is exceeded."
    rationale: "Relying parties use auth_time to decide freshness."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Full}
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#775", "#776"]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
      - {kind: integration-test, ref: "max_age test"}
  - id: REQ-AUTHN-033
    area: AUTHN
    split_from: REQ-AUTHN-008
    statement: "The auth_time claim in issued tokens MUST be the time of the most recent user authentication event."
    rationale: "Relying parties use auth_time to decide freshness."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Full}
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#775", "#776"]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
      - {kind: integration-test, ref: "federated auth_time test"}
  - id: REQ-AUTHN-009
    area: AUTHN
    statement: "When acr_values are sent, sluis MUST either satisfy one of them or fail with unmet_authentication_requirements."
    rationale: "A silent downgrade tells a relying party the user was strongly authenticated when they were not."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
      - {id: ST-24, section: "3", depth: Partial}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["#885"]
    gap: stakeholder-only
    verification:
      - {kind: integration-test, ref: "acr matrix (known, unknown, restricted, cool-down)"}
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
  - id: REQ-AUTHN-034
    area: AUTHN
    split_from: REQ-AUTHN-009
    statement: "sluis MUST NOT silently downgrade a requested authentication level."
    rationale: "A silent downgrade tells a relying party the user was strongly authenticated when they were not."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
      - {id: ST-24, section: "3", depth: Partial}
    features: ["#885"]
    gap: stakeholder-only
    verification:
      - {kind: integration-test, ref: "downgrade negative test"}
  - id: REQ-AUTHN-010
    area: AUTHN
    statement: "An authentication from an upstream identity provider MUST NOT raise the assurance level above the ceiling configured for that connection."
    rationale: "Upstream claims are not evidence sluis has verified."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
      - {id: NC-01, section: "8176", depth: Partial}
    features: ["design"]
    gap: stakeholder-only
    verification:
      - {kind: integration-test, ref: "federated acr ceiling test"}
  - id: REQ-AUTHN-011
    area: AUTHN
    statement: "The claims request parameter MUST be accepted only for an essential acr."
    rationale: "A narrow claims surface avoids undefined disclosure behaviour."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "5.5", depth: Partial}
      - {id: ST-23, section: "2", depth: Partial}
    features: ["design"]
    gap: stakeholder-only
    verification:
      - {kind: integration-test, ref: "essential acr acceptance test"}
  - id: REQ-AUTHN-035
    area: AUTHN
    split_from: REQ-AUTHN-011
    statement: "The claims request parameter MUST be refused with invalid_request for every other use."
    rationale: "A narrow claims surface avoids undefined disclosure behaviour."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "5.5", depth: Partial}
      - {id: ST-23, section: "2", depth: Partial}
    features: ["design"]
    gap: stakeholder-only
    verification:
      - {kind: integration-test, ref: "claims and authorization_details negative tests"}
  - id: REQ-AUTHN-012
    area: AUTHN
    statement: "Each protocol endpoint MUST accept only the parameters on its closed list."
    rationale: "Refusing instead of ignoring prevents a client from believing a requirement was honoured."
    level: MUST
    source: security-review
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "2", depth: Partial}
      - {id: ST-01, section: "3.1", depth: Partial}
    features: ["#796"]
    verification:
      - {kind: integration-test, ref: "closed-list acceptance test"}
  - id: REQ-AUTHN-036
    area: AUTHN
    split_from: REQ-AUTHN-012
    statement: "Each protocol endpoint MUST refuse any other parameter with invalid_request."
    rationale: "Refusing instead of ignoring prevents a client from believing a requirement was honoured."
    level: MUST
    source: security-review
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "2", depth: Partial}
      - {id: ST-01, section: "3.1", depth: Partial}
    features: ["#796"]
    verification:
      - {kind: integration-test, ref: "one negative test per refused input"}
      - {kind: integration-test, ref: "test that no refused row is accepted silently"}
  - id: REQ-AUTHN-037
    area: AUTHN
    split_from: REQ-AUTHN-012
    statement: "Each protocol endpoint MUST refuse a repeated security-relevant parameter."
    rationale: "Refusing instead of ignoring prevents a client from believing a requirement was honoured."
    level: MUST
    source: security-review
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "2", depth: Partial}
      - {id: ST-01, section: "3.1", depth: Partial}
    features: ["#796"]
    verification:
      - {kind: integration-test, ref: "repeated-parameter test"}
  - id: REQ-AUTHN-013
    area: AUTHN
    statement: "sluis SHOULD serve pushed authorization requests with a single-use request_uri."
    rationale: "Pushing parameters on the back channel protects integrity and confidentiality of the request."
    level: SHOULD
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-16, section: "2", depth: Full}
      - {id: ST-37, section: "5", depth: Partial}
    features: ["design"]
    verification:
      - {kind: conformance-suite, ref: "FAPI2-SP"}
      - {kind: integration-test, ref: "reuse test"}
  - id: REQ-AUTHN-038
    area: AUTHN
    split_from: REQ-AUTHN-013
    statement: "A request_uri SHOULD be bound to the client that pushed it."
    rationale: "A foreign client must not redeem another client's request."
    level: SHOULD
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-16, section: "2", depth: Full}
      - {id: ST-37, section: "5", depth: Partial}
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "foreign-client test"}
  - id: REQ-AUTHN-039
    area: AUTHN
    split_from: REQ-AUTHN-013
    statement: "A request_uri SHOULD expire within 60 seconds."
    rationale: "A short lifetime limits replay."
    level: SHOULD
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-16, section: "2", depth: Full}
      - {id: ST-37, section: "5", depth: Partial}
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "expiry test"}
  - id: REQ-AUTHN-040
    area: AUTHN
    split_from: REQ-AUTHN-013
    statement: "For a client that requires PAR, the authorization endpoint SHOULD accept only a pushed request_uri."
    rationale: "A client that requires PAR must not fall back to an unprotected request."
    level: SHOULD
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-16, section: "2", depth: Full}
      - {id: ST-37, section: "5", depth: Partial}
    features: ["design"]
    verification:
      - {kind: conformance-suite, ref: "FAPI2-SP"}
      - {kind: integration-test, ref: "PAR-required client test"}
  - id: REQ-AUTHN-014
    area: AUTHN
    statement: "sluis MAY accept signed request objects (JAR) passed inside a pushed authorization request for clients of a message-signing profile."
    rationale: "Message signing needs non-repudiable requests."
    level: MAY
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-17, section: "6", depth: Full}
      - {id: ST-38, section: "5", depth: Partial}
    features: ["design"]
    gap: stakeholder-only
    verification:
      - {kind: conformance-suite, ref: "FAPI2-MS"}
  - id: REQ-AUTHN-015
    area: AUTHN
    statement: "sluis MUST NOT serve the resource owner password credentials grant."
    rationale: "Each is deprecated or enlarges the attack surface."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "2.4", depth: Full}
    features: ["#850"]
    verification:
      - {kind: integration-test, ref: "unsupported_grant_type test"}
  - id: REQ-AUTHN-041
    area: AUTHN
    split_from: REQ-AUTHN-015
    statement: "sluis MUST NOT serve the JWT bearer authorization grant."
    rationale: "The grant is not needed and enlarges the attack surface."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-20, section: "7523", depth: Partial}
    features: ["#850"]
    verification:
      - {kind: integration-test, ref: "unsupported_grant_type test"}
  - id: REQ-AUTHN-042
    area: AUTHN
    split_from: REQ-AUTHN-015
    statement: "sluis MUST NOT serve front-channel logout."
    rationale: "Front-channel logout depends on third-party cookies, and back-channel logout is the supported path (ADR 0061)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-32, section: "1", depth: Full}
    features: ["#850"]
    verification:
      - {kind: integration-test, ref: "404 test"}
  - id: REQ-AUTHN-043
    area: AUTHN
    split_from: REQ-AUTHN-015
    statement: "sluis MUST NOT serve the session-management iframe."
    rationale: "The iframe depends on third-party cookies."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-33, section: "1", depth: Full}
    features: ["#850"]
    verification:
      - {kind: integration-test, ref: "404 test"}
  - id: REQ-AUTHN-044
    area: AUTHN
    split_from: REQ-AUTHN-015
    statement: "sluis MUST NOT serve third-party-initiated login."
    rationale: "Third-party-initiated login is a login CSRF vector, and no app launcher needs it yet (ADR 0061)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-35, section: "4", depth: Full}
    features: ["#850"]
    verification:
      - {kind: integration-test, ref: "404 test"}
  - id: REQ-AUTHN-045
    area: AUTHN
    split_from: REQ-AUTHN-015
    statement: "sluis MUST NOT serve client-initiated backchannel authentication."
    rationale: "The flow is not needed for sign-in."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-36, section: "1", depth: Full}
    features: ["#850"]
    superseded_by: [REQ-AUTHN-063, REQ-AUTHN-064, REQ-AUTHN-065]
    verification:
      - {kind: integration-test, ref: "404 test"}
  - id: REQ-AUTHN-016
    area: AUTHN
    statement: "The authorization endpoint MUST serve the query response mode only."
    rationale: "Query-only keeps responses simple and avoids form-post browser quirks."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-34, section: "1", depth: Full}
      - {id: ST-28, section: "3.1.2.5", depth: Partial}
    features: ["#775"]
    superseded_by: [REQ-AUTHN-058]
    verification:
      - {kind: integration-test, ref: "query-only response test"}
  - id: REQ-AUTHN-046
    area: AUTHN
    split_from: REQ-AUTHN-016
    statement: "The authorization endpoint MUST answer any other response_mode with invalid_request."
    rationale: "Query-only keeps responses simple and avoids form-post browser quirks."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-34, section: "1", depth: Full}
      - {id: ST-28, section: "3.1.2.5", depth: Partial}
    features: ["#775"]
    superseded_by: [REQ-AUTHN-060]
    verification:
      - {kind: integration-test, ref: "response_mode negative test"}
  - id: REQ-AUTHN-017
    area: AUTHN
    statement: "sluis MUST support the OAuth device authorization grant for sign-in on a machine without a browser."
    rationale: "Headless command-line tools need an interactive sign-in path."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-06, section: "3", depth: Full}
      - {id: ST-14, section: "4", depth: Partial}
    features: ["#855"]
    verification:
      - {kind: integration-test, ref: "device flow happy-path test"}
      - {kind: manual, ref: "review against the BCP"}
  - id: REQ-AUTHN-047
    area: AUTHN
    split_from: REQ-AUTHN-017
    statement: "A device authorization MUST use a high-entropy user code."
    rationale: "A short guessable code can be brute-forced."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-06, section: "3", depth: Full}
      - {id: ST-14, section: "4", depth: Partial}
    features: ["#855"]
    verification:
      - {kind: integration-test, ref: "user-code entropy and alphabet test"}
  - id: REQ-AUTHN-048
    area: AUTHN
    split_from: REQ-AUTHN-017
    statement: "A device authorization MUST enforce a minimum polling interval and answer early polls with slow_down."
    rationale: "Polling must not become a denial of service."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-06, section: "3", depth: Full}
      - {id: ST-14, section: "4", depth: Partial}
    features: ["#855"]
    verification:
      - {kind: integration-test, ref: "slow_down test"}
  - id: REQ-AUTHN-049
    area: AUTHN
    split_from: REQ-AUTHN-017
    statement: "A device code and its user code MUST expire after a bounded lifetime."
    rationale: "An unbounded code is a standing credential."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-06, section: "3", depth: Full}
      - {id: ST-14, section: "4", depth: Partial}
    features: ["#855"]
    verification:
      - {kind: integration-test, ref: "expiry test"}
  - id: REQ-AUTHN-018
    area: AUTHN
    statement: "A WebAuthn relying-party implementation MUST require user verification."
    rationale: "These checks make passkeys phishing-resistant."
    level: MUST
    source: design-decision
    status: partial
    runtimes: all
    standards:
      - {id: ST-59, section: "7-8", depth: Full}
      - {id: ST-105, section: "test plan", depth: Full}
    features: ["#885"]
    gap: register-gap
    verification:
      - {kind: conformance-suite, ref: "FIDO-CT"}
      - {kind: integration-test, ref: "negative test (UV=0)"}
  - id: REQ-AUTHN-050
    area: AUTHN
    split_from: REQ-AUTHN-018
    statement: "A WebAuthn relying-party implementation MUST accept only exact origins from an allow-list."
    rationale: "These checks make passkeys phishing-resistant."
    level: MUST
    source: design-decision
    status: partial
    runtimes: all
    standards:
      - {id: ST-59, section: "7-8", depth: Full}
      - {id: ST-105, section: "test plan", depth: Full}
    features: ["#885"]
    gap: register-gap
    verification:
      - {kind: conformance-suite, ref: "FIDO-CT"}
      - {kind: integration-test, ref: "negative test (wrong origin)"}
  - id: REQ-AUTHN-019
    area: AUTHN
    statement: "A WebAuthn relying party MUST bind a single-use challenge to each ceremony."
    rationale: "A replayed assertion must never sign a user in."
    level: MUST
    source: design-decision
    status: partial
    runtimes: all
    standards:
      - {id: ST-59, section: "7-8", depth: Full}
      - {id: ST-105, section: "test plan", depth: Full}
    features: ["#885"]
    gap: register-gap
    verification:
      - {kind: conformance-suite, ref: "FIDO-CT"}
      - {kind: integration-test, ref: "challenge binding test"}
  - id: REQ-AUTHN-051
    area: AUTHN
    split_from: REQ-AUTHN-019
    statement: "A WebAuthn relying party MUST reject a replayed challenge."
    rationale: "A replayed assertion must never sign a user in."
    level: MUST
    source: design-decision
    status: partial
    runtimes: all
    standards:
      - {id: ST-59, section: "7-8", depth: Full}
      - {id: ST-105, section: "test plan", depth: Full}
    features: ["#885"]
    gap: register-gap
    verification:
      - {kind: conformance-suite, ref: "FIDO-CT"}
      - {kind: integration-test, ref: "replay negative test"}
  - id: REQ-AUTHN-052
    area: AUTHN
    split_from: REQ-AUTHN-019
    statement: "A WebAuthn relying party MUST reject a signature-counter regression."
    rationale: "A counter regression indicates a cloned authenticator."
    level: MUST
    source: design-decision
    status: partial
    runtimes: all
    standards:
      - {id: ST-59, section: "7-8", depth: Full}
      - {id: ST-105, section: "test plan", depth: Full}
    features: ["#885"]
    gap: register-gap
    verification:
      - {kind: conformance-suite, ref: "FIDO-CT"}
      - {kind: integration-test, ref: "counter regression negative test"}
  - id: REQ-AUTHN-020
    area: AUTHN
    statement: "The page that follows an identifier entered for passkey sign-in MUST NOT reveal whether the identifier exists."
    rationale: "A uniform page prevents account enumeration."
    level: MUST
    source: design-decision
    status: partial
    runtimes: all
    standards:
      - {id: ST-59, section: "5", depth: Partial}
    features: ["#885"]
    gap: register-gap
    verification:
      - {kind: integration-test, ref: "identical-response test for known and unknown identifiers"}
  - id: REQ-AUTHN-021
    area: AUTHN
    statement: "sluis MUST support step-up authentication challenged by a resource server."
    rationale: "Step-up lets a resource demand stronger evidence per action."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-24, section: "3", depth: Full}
      - {id: NC-01, section: "8176", depth: Full}
    features: ["#885"]
    decisions: ["OD-12"]
    verification:
      - {kind: integration-test, ref: "step-up challenge test"}
  - id: REQ-AUTHN-053
    area: AUTHN
    split_from: REQ-AUTHN-021
    statement: "When a step-up challenge is met, sluis MUST issue a token whose acr and auth_time reflect the new authentication."
    rationale: "A token that hides the new authentication gives the resource server nothing to check."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-24, section: "3", depth: Full}
      - {id: NC-01, section: "8176", depth: Full}
    features: ["#885"]
    decisions: ["OD-12"]
    verification:
      - {kind: integration-test, ref: "step-up round trip"}
  - id: REQ-AUTHN-022
    area: AUTHN
    statement: "sluis MUST NOT verify end-user passwords."
    rationale: "Passwords are a phishing and storage liability; passkeys and federation replace them."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "password submission refusal test"}
  - id: REQ-AUTHN-054
    area: AUTHN
    split_from: REQ-AUTHN-022
    statement: "sluis MUST NOT store end-user password verifiers."
    rationale: "A stored verifier is an offline-guessing target."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "storage scan"}
  - id: REQ-AUTHN-055
    area: AUTHN
    split_from: REQ-AUTHN-022
    statement: "sluis MUST NOT render a password field for end users."
    rationale: "A password field trains users to type passwords into a sign-in page."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "page scan"}
      - {kind: manual, ref: "design review"}
  - id: REQ-AUTHN-023
    area: AUTHN
    statement: "A recovery sign-in for operators, where offered, MUST use a zero-knowledge password proof (SRP-6a)."
    rationale: "Break-glass access must not expose a reusable verifier."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-60, section: "RFC 5054", depth: Full}
      - {id: ST-45, section: "TokenReview", depth: Partial}
    features: ["#795"]
    verification:
      - {kind: test-vectors, ref: "RFC 5054 appendix B"}
  - id: REQ-AUTHN-056
    area: AUTHN
    split_from: REQ-AUTHN-023
    statement: "A recovery sign-in for operators MUST be disabled by default."
    rationale: "Break-glass access must not expose a reusable verifier."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-60, section: "RFC 5054", depth: Full}
      - {id: ST-45, section: "TokenReview", depth: Partial}
    features: ["#795"]
    verification:
      - {kind: integration-test, ref: "recovery door default-off test"}
  - id: REQ-AUTHN-024
    area: AUTHN
    statement: "Identifier, registration, recovery and fallback paths MUST return the same response for known and unknown accounts."
    rationale: "Enumeration helps targeted attacks."
    level: MUST
    source: security-review
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["#796"]
    verification:
      - {kind: integration-test, ref: "differential response test"}
  - id: REQ-AUTHN-057
    area: AUTHN
    split_from: REQ-AUTHN-024
    statement: "Identifier, registration, recovery and fallback paths MUST take the same observable time for known and unknown accounts."
    rationale: "A timing difference is as good as a different response for enumeration."
    level: MUST
    source: security-review
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["#796"]
    verification:
      - {kind: integration-test, ref: "timing test"}
  - id: REQ-AUTHN-058
    area: AUTHN
    statement: "The authorization endpoint MUST serve response_mode=form_post for the authorization code flow."
    rationale: "Form post keeps the code out of URLs, history and Referer headers, and some relying parties require it (ADR 0061)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-34, section: "2", depth: Full}
      - {id: ST-28, section: "3.1.2.5", depth: Partial}
    features: ["#979"]
    verification:
      - {kind: conformance-suite, ref: "Form Post OP plan"}
  - id: REQ-AUTHN-059
    area: AUTHN
    statement: "The form post response page MUST carry a Content-Security-Policy that lets only its own auto-submit script run, by a nonce fresh for each response."
    rationale: "The page runs a script on behalf of a client's response, so nothing else may run in it (ADR 0061)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-34, depth: Partial}
      - {id: NC-05, section: "CSP", depth: Partial}
    features: ["#979", "#796"]
    verification:
      - {kind: integration-test, ref: "form post page CSP and nonce test"}
  - id: REQ-AUTHN-060
    area: AUTHN
    statement: "The authorization endpoint MUST answer a response_mode other than query and form_post with invalid_request."
    rationale: "Only the two response modes of the code flow are served (ADR 0061)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-34, section: "2", depth: Full}
      - {id: ST-28, section: "3.1.2.5", depth: Partial}
    features: ["#775", "#979"]
    verification:
      - {kind: integration-test, ref: "response_mode negative test"}
  - id: REQ-AUTHN-061
    area: AUTHN
    statement: "The discovery document MUST NOT advertise front-channel logout as supported."
    rationale: "Discovery is truthful, and front-channel logout is not served (ADR 0061)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-32, section: "3", depth: Full}
      - {id: ST-29, section: "3", depth: Partial}
    features: ["#850"]
    verification:
      - {kind: integration-test, ref: "discovery metadata test"}
  - id: REQ-AUTHN-062
    area: AUTHN
    statement: "The configuration check MUST refuse a client that declares a frontchannel_logout_uri or an initiate_login_uri."
    rationale: "A client must not be configured for a flow that sluis does not serve (ADR 0061)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-32, section: "2", depth: Partial}
      - {id: ST-35, section: "4", depth: Partial}
    features: ["#789"]
    verification:
      - {kind: integration-test, ref: "config check refusal test"}
  - id: REQ-AUTHN-063
    area: AUTHN
    statement: "sluis MAY serve client-initiated backchannel authentication in poll mode after v2 parity."
    rationale: "A service can then ask for a person's approval on another device with the passkeys that are already planned (ADR 0061)."
    level: MAY
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-36, section: "5", depth: Partial}
    features: ["#980"]
    verification:
      - {kind: conformance-suite, ref: "CIBA plan for poll mode"}
  - id: REQ-AUTHN-064
    area: AUTHN
    statement: "sluis MUST NOT serve the ping or push token delivery modes of client-initiated backchannel authentication."
    rationale: "Poll mode covers the use, and ping and push add an outbound call to the client (ADR 0061)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-36, section: "5", depth: Partial}
    features: ["#980"]
    verification:
      - {kind: integration-test, ref: "CIBA delivery-mode negative test"}
  - id: REQ-AUTHN-065
    area: AUTHN
    statement: "A backchannel authentication request MUST be approved only by a passkey assertion made on the approving device."
    rationale: "An approval is a sign-in, and a notification tap alone proves only that someone holds the device (ADR 0061)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-36, section: "7", depth: Partial}
      - {id: ST-59, depth: Partial}
    features: ["#980", "#885"]
    verification:
      - {kind: integration-test, ref: "CIBA approval without a passkey assertion is refused"}
