# EXPORT: Export
schema: 1
area: EXPORT
requirements:
  - id: REQ-EXPORT-001
    area: EXPORT
    statement: "sluis MUST publish only the exportable kinds as documents of a small typed set."
    rationale: "A small typed set keeps what leaves sluis reviewable (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [exporter]
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [798]
    verification:
      - {kind: test-vectors, ref: "exportable-kind vectors"}
  - id: REQ-EXPORT-003
    area: EXPORT
    split_from: REQ-EXPORT-001
    statement: "Each export MUST be authorised by exporter@'s rule on the kind and, for a sealed value, by a grant."
    rationale: "An export is a read of sluis data by a holder, so it needs both checks (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [exporter]
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [798]
    verification:
      - {kind: integration-test, ref: "export authorisation test"}
  - id: REQ-EXPORT-004
    area: EXPORT
    split_from: REQ-EXPORT-001
    statement: "Each export MUST be recorded in the audit log."
    rationale: "An export is a disclosure."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [798]
    superseded_by: [REQ-EXPORT-017]
    verification:
      - {kind: integration-test, ref: "export audit test"}
  - id: REQ-EXPORT-002
    area: EXPORT
    statement: "A file-drop or bucket-drop export that contains a secret MUST be age-encrypted to the consumer's own recipient."
    rationale: "The consumer, not sluis, decrypts."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-95, section: "age", depth: Full}
      - {id: NC-10, section: "PIV", depth: Partial}
    issues: [798]
    superseded_by: [REQ-EXPORT-011, REQ-EXPORT-013]
    verification:
      - {kind: test-vectors, ref: "age vectors"}
  - id: REQ-EXPORT-005
    area: EXPORT
    split_from: REQ-EXPORT-002
    statement: "sluis MUST hold only the public recipient of an export consumer."
    rationale: "The consumer, not sluis, decrypts."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-95, section: "age", depth: Full}
      - {id: NC-10, section: "PIV", depth: Partial}
    issues: [798]
    superseded_by: [REQ-EXPORT-010]
    verification:
      - {kind: integration-test, ref: "recipient-only test"}
  - id: REQ-EXPORT-006
    area: EXPORT
    statement: "The export documentation SHOULD describe an age recipient whose identity is held on the consumer's hardware token."
    rationale: "The consumer decrypts with a key that sluis never sees."
    level: SHOULD
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-95, section: "age", depth: Full}
      - {id: NC-10, section: "PIV", depth: Partial}
    issues: [798]
    superseded_by: [REQ-EXPORT-013, REQ-EXPORT-011]
    verification:
      - {kind: manual, ref: "documentation review"}
  - id: REQ-EXPORT-007
    area: EXPORT
    statement: "exporter@ MUST refuse a document of a kind that the kind registry does not mark exportable."
    rationale: "The mark is a property of the kind and is set in review (ADR 0009)."
    level: MUST
    source: design-decision
    status: done
    milestone: v1-parity
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1014, 1453]
    tests:
      - actors/exporter/src/config.rs
    verification:
      - {kind: test-vectors, ref: "only_a_kind_the_registry_marks_exportable_is_published (config.rs): every kind of the registry is tried as a document; the seven marked pass the mark, the rest are refused"}

  # ---- exporter@ and the exportable kinds (decision 0009)
  - id: REQ-EXPORT-008
    area: EXPORT
    statement: "The kind registry MUST mark exactly seven kinds exportable: SigningRing, KeyCertificate, TrustAnchors, Crl, Krl, TrustBundle and ClientSecretExport."
    rationale: "What may leave sluis is decided in review as a property of the kind and not at run time (ADR 0009)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1014]
    tests: [kits/go/registry/registry_test.go]
    verification:
      - {kind: test-vectors, ref: "TestExportableKinds in kits/go/registry: exactly SigningRing, KeyCertificate, TrustAnchors, Crl, Krl, TrustBundle and ClientSecretExport are marked exportable"}
  - id: REQ-EXPORT-009
    area: EXPORT
    statement: "The kind registry MUST mark a kind exportable only when a consumer is named and a rule lets exporter@ read it."
    rationale: "Nothing leaves sluis without a consumer (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1217]
    verification:
      - {kind: integration-test, ref: "registry check: an exportable kind without a named consumer fails"}
  - id: REQ-EXPORT-010
    area: EXPORT
    statement: "exporter@ MUST be the only holder of the credentials of export destinations."
    rationale: "A destination needs a credential, and it belongs to one holder of the data family and to no work actor (ADR 0009)."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: partly-built
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1014]
    verification:
      - {kind: integration-test, ref: "actor registry check: no other actor holds a destination credential; on Lambda only the exporter role reaches a destination"}
  - id: REQ-EXPORT-011
    area: EXPORT
    statement: "`sluis config check` MUST refuse an ExportDestination that sends ClientSecretExport to a bucket."
    rationale: "A bucket receives public material at static addresses and never a secret (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1014, 864]
    verification:
      - {kind: integration-test, ref: "config check negative test: a bucket destination for ClientSecretExport"}
  - id: REQ-EXPORT-012
    area: EXPORT
    statement: "`sluis config check` MUST refuse an ExportDestination whose address is also read as a secret source."
    rationale: "sluis must never read back what it wrote, so no value has two writers (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1014, 864]
    verification:
      - {kind: integration-test, ref: "config check negative test: a destination that is also a secret source"}
  - id: REQ-EXPORT-013
    area: EXPORT
    statement: "exporter@ MUST open a sealed value at key@ with its own grant, sealed for the tenant of the value."
    rationale: "The grant check applies to the exporter like every other actor (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1014]
    verification:
      - {kind: integration-test, ref: "an export of ClientSecretExport with no grant, and with a grant for another tenant; each refused"}
  - id: REQ-EXPORT-014
    area: EXPORT
    statement: "exporter@ MUST run a full reconcile at start and once a day."
    rationale: "A missed change or an edit made at the destination is corrected within a day (ADR 0009)."
    level: MUST
    source: design-decision
    status: done
    milestone: v1-parity
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1014, 1453]
    tests:
      - actors/exporter/tests/publish.rs
    verification:
      - {kind: integration-test, ref: "the_reconcile_restores_an_edited_and_a_deleted_document: the scheduled reconcile restores a hand-edited and a deleted document, and the start reconcile one edited while exporter@ was down"}
  - id: REQ-EXPORT-015
    area: EXPORT
    statement: "exporter@ MUST keep the resume point of each destination in the temp kind ExportCursor."
    rationale: "Losing the cursor costs a full reconcile and not data (ADR 0009)."
    level: MUST
    source: design-decision
    status: done
    milestone: v1-parity
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1217, 1453]
    tests:
      - actors/exporter/tests/publish.rs
    verification:
      - {kind: integration-test, ref: "a_restart_resumes_from_the_cursor, a_lost_cursor_costs_a_full_reconcile_and_loses_no_document, a_stale_resume_point_is_resynced_and_nothing_is_skipped (publish.rs)"}
  - id: REQ-EXPORT-016
    area: EXPORT
    statement: "exporter@ MUST remove from a destination what it wrote for a value that no longer exists."
    rationale: "A revoked key or a deleted client secret must not stay at its destination (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1014]
    verification:
      - {kind: integration-test, ref: "delete an exportable item; the next reconcile removes its document"}
  - id: REQ-EXPORT-017
    area: EXPORT
    statement: "exporter@ MUST record every write to a destination and every refusal as an audit fact."
    rationale: "A refusal is an alarm and not a retry loop, and an operator must see why (ADR 0009)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: v1-parity
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1014, 1453]
    tests:
      - actors/exporter/tests/publish.rs
    verification:
      - {kind: integration-test, ref: "each_write_and_each_refusal_is_one_fact_and_no_fact_carries_a_list: one fact for each write and refusal, none when idle; the alarm is a log line (alert exporter.refused) for now"}
  - id: REQ-EXPORT-018
    area: EXPORT
    statement: "sluis MUST NOT write a Kubernetes object, except a Secret that exporter@ writes when an installation chooses the direct path."
    rationale: "Cluster tools stay its clients and distributors, and the cluster credential of exporter@ is limited to the named Secrets (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1014]
    verification:
      - {kind: integration-test, ref: "the RBAC of exporter@ allows writing the named Secrets in the named namespaces only"}
      - {kind: integration-test, ref: "no other actor holds a cluster write permission"}
  - id: REQ-EXPORT-019
    area: EXPORT
    statement: "An export MUST NOT carry a secret for a vendor that sluis could mint a scoped credential for."
    rationale: "A minted credential is short-lived and scoped, and a stored secret is neither (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1217]
    verification:
      - {kind: integration-test, ref: "registry check: no exportable kind holds a vendor secret that a minter can mint"}
  - id: REQ-EXPORT-020
    area: EXPORT
    statement: "exporter@ MUST omit every kid that KeyRevocation lists from every key set it publishes."
    rationale: "The omission is a filter at publication, so it does not depend on signer or on the node that owns the key; the live half is REQ-KEYS-107 (ADR 0041, ADR 0009)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1453, 1362]
    tests:
      - actors/exporter/tests/publish.rs
      - drivers/exporter/dir/tests/port.rs
    verification:
      - {kind: integration-test, ref: "a_revoked_key_leaves_the_set_and_its_tokens_fail_against_the_document: the next key set in a directory lacks the kid and its token fails; a crash or a reader never sees half a document. Bucket: #1454"}
  - id: REQ-EXPORT-021
    area: EXPORT
    statement: "After a change of KeyRevocation or SigningRing, exporter@ MUST write the document, purge its public address, read it back and write its report, in this order."
    rationale: "The purge must come after the write or the edge fills again with the old document, and the report must come after the read back; the behaviour is UNVERIFIED on a real edge until the first measurement, and only the in-memory driver has played an edge so far (ADR 0009)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1453, 1454]
    tests:
      - actors/exporter/tests/publish.rs
    verification:
      - {kind: integration-test, ref: "write_purge_read_back_then_report_in_that_order: the in-memory destination's call log shows Put, Purge, ReadBack in order, then the report; no real edge yet (bucket: #1454)"}
  - id: REQ-EXPORT-022
    area: EXPORT
    statement: "exporter@ MUST write the temp kind ExportReport after each publication, with the state published only when the purge was accepted and the read back then returned the written digest, and with the state written when the destination has no public address to read back from."
    rationale: "A reader that waits for a key to be published needs what a verifier would see, and not what exporter@ intended (ADR 0009)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1453]
    tests:
      - actors/exporter/tests/publish.rs
    verification:
      - {kind: integration-test, ref: "the_report_says_published_only_for_the_written_digest: a stale edge keeps purge-pending, the written digest gives published, and a destination with no public address reports written"}
      - {kind: integration-test, ref: "a_failed_purge_is_never_published: a read back after a purge that failed does not publish (the in-memory driver only: no real edge has been tried, the bucket is #1454)"}
  - id: REQ-EXPORT-023
    area: EXPORT
    statement: "The edge in front of the key set MUST NOT serve a cached copy more than 65 minutes after it expired."
    rationale: "Beyond the access-token cap plus the clock skew a stale key set serves no live token and a revoked key would stay, the edge settings are delivered by infrastructure code, and the behaviour is UNVERIFIED on a real edge until the first measurement (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1454]
    verification:
      - {kind: integration-test, ref: "the edge configuration of a test installation is read: the stale window is at most 65 minutes, and a purge evicts the stale copy"}
  - id: REQ-EXPORT-024
    area: EXPORT
    statement: "When exporter@ cannot read KeyRevocation or SigningRing, it MUST leave the published document unchanged apart from removing a key that a KeyRevocation event has just named, raise an alarm that repeats while the state lasts and report unverified."
    rationale: "Deleting the document for a blip of store@ would stop verification for every relying party, and exporter@ cannot learn of a revocation it cannot read, but a key an event has named is revoked whatever else is unknown, and removal is monotone (ADR 0009)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1453]
    tests:
      - actors/exporter/tests/publish.rs
    verification:
      - {kind: integration-test, ref: "an_unreadable_revocation_list_leaves_the_object_as_it_is: unchanged, a named kid removed alone, unverified, one fact in and out; the_unverified_alarm_repeats_while_it_lasts"}
  - id: REQ-EXPORT-025
    area: EXPORT
    statement: "Where a bucket destination serves the key set, the edge MUST fall back to the live key set of entry when the bucket cannot be read."
    rationale: "The key set then survives a failure of the bucket and the live set filters revoked kids as the static one does, and the fallback is an edge setting delivered by infrastructure code (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1454]
    verification:
      - {kind: integration-test, ref: "the bucket is stopped: the public address still answers with the live key set, and the revoked kid is absent"}
  - id: REQ-EXPORT-026
    area: EXPORT
    statement: "The purge credential of exporter@ MUST allow purging only the public addresses of the documents of its destinations."
    rationale: "A purge credential that could evict anything would let a compromised exporter@ take the edge cache of other services (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1454]
    verification:
      - {kind: integration-test, ref: "with the credential: a purge of a named address succeeds and a purge of another address is refused by the edge"}
  - id: REQ-EXPORT-027
    area: EXPORT
    statement: "A destination driver MUST implement the calls Put, Delete, List, Purge and ReadBack of the destination port and pass the port's conformance suite."
    rationale: "One contract lets exporter@ publish to any destination and lets a new driver be proven the same way (ADR 0009, ADR 0005)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1453, 1454, 1014]
    tests:
      - drivers/exporter/dir/tests/port.rs
    verification:
      - {kind: integration-test, ref: "the suite runs against the directory driver (in process, through its socket) and the in-memory driver; with no public address ReadBack is unsupported and Purge answers none; bucket: #1454"}
  - id: REQ-EXPORT-028
    area: EXPORT
    split_from: REQ-EXPORT-021
    statement: "exporter@ MUST complete the write, the purge and the read back of a key set within 60 seconds of seeing a change of KeyRevocation."
    rationale: "A revoked key must leave the edge at once; 60 seconds is a target and not a measurement, and the first drill replaces it with the measured figure (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    actors: [exporter]
    standards: []
    issues: [1454]
    verification:
      - {kind: integration-test, ref: "a revocation is written: the write, the purge and the read back of the test installation's edge are done within 60 seconds"}
  - id: REQ-EXPORT-029
    area: EXPORT
    statement: "exporter@ MUST send a Put that its destination refuses with 401 or 403 once more after it has read its destination credential again, and no more than once."
    rationale: "API-minted R2 temporary credentials were accepted at the first attempt in all 30 trials of the spike of 2026-11-06, but the exporter's destination credential is platform-provided and may be a static token, which v1 saw refused for up to about 34 seconds, so whether one retry keeps the revocation inside its 60 seconds is UNVERIFIED (ADR 0013, REQ-EXPORT-028)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: all
    actors: [exporter]
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "a fake destination refuses the first Put with 401: the write and the purge still finish within the 60 seconds of REQ-EXPORT-028; two refusals fail the Put after two attempts"}
