  - id: REQ-DATA-107
    area: DATA
    split_from: REQ-DATA-072
    statement: "`sluis config check` MUST refuse a driver of key@ or of an audit piece that does not fit the runtime of the installation."
    rationale: "A driver that needs a disk or a node cannot work on a runtime that has none (ADR 0005)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [864, 1419]
    verification:
