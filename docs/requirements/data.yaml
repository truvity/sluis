  - id: REQ-DATA-075
    area: DATA
    statement: "A read that decides authority MUST be linearizable."
    rationale: "A follower can be stale by about 50 ms, and an authority decision on stale data is a wrong decision (ADR 0005)."
    level: MUST
    source: design-decision
    status: partial
    gap: smoke-not-in-ci
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [store]
    standards: []
    issues: [952]
    verification:
      - {kind: integration-test, ref: "a write is acknowledged and read at once through a follower with the authority option; the write is seen"}

  # ---- configuration loading
  - id: REQ-DATA-076
    area: DATA
    statement: "store@ MUST verify the signature of a signed config document over the received bytes before it parses any of them."
    rationale: "A parser reached by an unsigned document is an attack surface (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    verification:
      - {kind: test-vectors, ref: "signed document vectors: unsigned, tampered bytes and a wrong key, each refused before parsing"}
  - id: REQ-DATA-077
    area: DATA
    statement: "store@ MUST accept a signature only from a publisher key pinned in the bootstrap file."
    rationale: "The pin is the trust anchor of config, so config cannot choose its own publisher (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    verification:
      - {kind: test-vectors, ref: "signed document vectors: another algorithm, a forbidden header and a key not in the pin"}
  - id: REQ-DATA-078
    area: DATA
    statement: "store@ MUST refuse any signing algorithm other than ES384 and any crit, jku, x5u or embedded jwk header in a signed config document."
    rationale: "A narrow header closes the confusions of JWS that fetch a key or choose an algorithm from the document itself (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    verification:
      - {kind: test-vectors, ref: "signed document vectors: RS256, none, a crit header, a jku and an embedded jwk"}
  - id: REQ-DATA-079
    area: DATA
    statement: "store@ MUST require every signature on a document that carries several."
    rationale: "Neither party can change the policy alone (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    verification:
      - {kind: test-vectors, ref: "signed document vectors: a RegulatedPartyPolicy with one of its two signatures removed, in turn"}
  - id: REQ-DATA-080
    area: DATA
    statement: "A running store MUST refuse a signed config document whose sequence number is lower than the one in force."
    rationale: "An older document would silently undo a reviewed change (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    verification:
      - {kind: test-vectors, ref: "signed document vectors: a validly signed document with a lower sequence number"}
  - id: REQ-DATA-081
    area: DATA
    statement: "At a cold start store@ MUST take the latest validly signed document whatever its sequence number."
    rationale: "A store with nothing in force has nothing to compare with, and a persisted mark would be one more state to lose (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    tests: [actors/store/tests/config.rs]
    verification:
      - {kind: integration-test, ref: "a cold start with a document of a lower sequence than a previous run starts and runs it"}
      - {kind: integration-test, ref: "no file holds a sequence mark after a run: the config source and socket directories are unchanged by each start and reload; the loader is handed no path and no engine"}
  - id: REQ-DATA-082
    area: DATA
    statement: "store@ MUST validate the whole set of documents of a boundary, including links, bounds and templates, and swap the snapshot atomically."
    rationale: "A document applied alone would run a set that nobody reviewed as a whole (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    tests: [actors/store/tests/config_set.rs]
    verification:
      - {kind: integration-test, ref: "a set whose second document breaks a link to the first is refused whole; the snapshot in force is unchanged"}
  - id: REQ-DATA-083
    area: DATA
    statement: "At a cold start store@ MUST refuse to start when a config source is unreachable or when a document is unsigned, badly signed, malformed or invalid, naming the document."
    rationale: "There is no cached copy, no default and no fallback to a weaker source (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    verification:
      - {kind: integration-test, ref: "start with an unreachable source, an unsigned document and an invalid one on each tested installation; each refuses and names the document"}
  - id: REQ-DATA-084
    area: DATA
    statement: "When a reload fails, store@ MUST keep the snapshot in force, refuse the new snapshot whole, and audit the refusal once per refused digest with a journal line."
    rationale: "Applying the part that validates would run a document that nobody reviewed (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    tests: [actors/store/tests/config_set.rs]
    verification:
      - {kind: integration-test, ref: "a reload with one bad document in a set of three applies none of them and leaves one audit fact and one journal line per digest"}
  - id: REQ-DATA-085
    area: DATA
    statement: "Each start and each reload MUST be an audit fact that names, for each document, its kind, its sequence number and the SHA-384 of its payload."
    rationale: "A reviewer matches the fact to the digest of the file at the commit and sees a lag (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    verification:
      - {kind: integration-test, ref: "the audit fact of a start names kind, seq and digest equal to sha384sum of each file"}
  - id: REQ-DATA-086
    area: DATA
    statement: "Every config change except a change of the bootstrap file MUST reload as a whole snapshot with no restart."
    rationale: "A change that applied in parts would run a set that nobody reviewed as a whole (ADR 0005), and it covers the kinds that can be loaded, because a kind this build cannot read is refused at the cold start (REQ-DATA-083)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    verification:
      - {kind: integration-test, ref: "change one document of every config kind in turn; each takes effect on the reload with no restart"}
  - id: REQ-DATA-087
    area: DATA
    statement: "The bootstrap file MUST hold the boundary, one destination per storage class, the driver sockets and the SPKI-pinned publisher keys."
    rationale: "The credentials of store@ are platform-provided, and the file is the one local setting that config cannot change (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [864, 1157]
    tests: [actors/store/src/bootstrap.rs]
    verification:
      - {kind: test-vectors, ref: "bootstrap file vectors: a file that lacks the boundary, a class destination, a driver socket or a publisher pin is refused"}
      - {kind: integration-test, ref: "the file names exactly one destination for each of the four classes, and a list of two for a class is refused"}
  - id: REQ-DATA-088
    area: DATA
    statement: "The bootstrap file MUST NOT hold a credential."
    rationale: "The credentials of store@ are platform-provided, as a systemd credential, a role or a service account (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [864, 1157]
    tests: [actors/store/src/bootstrap.rs]
    verification:
      - {kind: test-vectors, ref: "bootstrap file vectors: key lists equal the documented keys, so a key that could carry a secret is refused by place without its value; a private-key PEM is refused; free-text fields keep their shape"}
  - id: REQ-DATA-089
    area: DATA
    statement: "store@ MUST refuse a bootstrap file that another uid can write."
    rationale: "Whoever can write the file can choose the publisher keys that anchor config (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [store]
    standards: []
    issues: [1157]
    verification:
      - {kind: integration-test, ref: "a bootstrap file with group or world write permission or another owner; store@ refuses to start"}
  - id: REQ-DATA-090
    area: DATA
    statement: "`sluis config check` MUST run the same validation of a config set as store@ does at load, offline."
    rationale: "CI must refuse in review what the store would refuse at run time (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [864, 1157]
    verification:
      - {kind: test-vectors, ref: "the_offline_check_and_the_loader_give_the_same_verdict_on_every_set (actors/store/tests/validate.rs), the read path of the file driver included"}
  - id: REQ-DATA-091
    area: DATA
    statement: "The Go and Rust loaders of signed config MUST give the same verdict on every signed-document vector."
    rationale: "Two languages read the same documents, and a disagreement would let a document pass in one and fail in the other (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1157]
    tests: [actors/store/tests/vectors.rs, kits/go/signedconfig/vectors_test.go]
    verification:
      - {kind: test-vectors, ref: "the signed-document vector set run by both loaders"}
  - id: REQ-DATA-092
    area: DATA
    statement: "A config source driver MUST declare its watch capability as none, notify or poll."
    rationale: "A change must reach the store without a restart where the platform can say so (ADR 0005)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    tests: [drivers/store/file/tests/port.rs]
    verification:
      - {kind: integration-test, ref: "a ConfigMap swap is seen by the file driver; the appconfig driver polls at the interval the service returns; a Lambda layer reports none"}
  - id: REQ-DATA-093
    area: DATA
    statement: "A serverless store MUST apply a changed config document of an appconfig source at the first invocation after the poll interval, without a new function version."
    rationale: "A function has no timer, so the poll happens at an invocation (ADR 0005)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["serverless"]
    actors: [store]
    standards: []
    issues: [1157]
    verification:
      - {kind: integration-test, ref: "change a document in the config service; the next invocation after the interval serves the new snapshot"}

  # ---- what is not data
  - id: REQ-DATA-096
    area: DATA
    statement: "sluis MUST NOT offer a general-purpose secret store to other parties."
    rationale: "sluis keeps only its own secrets and its integrations', and an export is a typed set of public material, not a secrets engine (ADR 0009)."
    level: MUST
    source: design-decision
    status: out-of-scope
    milestone: backlog
    runtimes: all
    standards: []
    issues: [798]
    manual_reason: "A scope boundary is checked by reading the store API and the kind registry."
    verification:
      - {kind: manual, ref: "scope review of the store API and the kind registry"}
  - id: REQ-DATA-094
    area: DATA
    statement: "An authority key, a wrapping key, an opened data key and a sealed grant MUST NOT be a kind or an item that the store holds."
    rationale: "These live in a key store, in the memory of key@, or in flight, and a copy in the store would be a second place to protect (ADR 0004)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [1202]
    verification:
      - {kind: integration-test, ref: "the kind registry holds no kind for these; a scan of the engine finds no key material or grant"}
  - id: REQ-DATA-097
    area: DATA
    statement: "store@ MUST refuse a DELETE and an APPLY on the kind Lease."
    rationale: "A lease's version is a fencing token, so nothing may remove the item or set its version back (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [864]
    verification:
      - {kind: integration-test, ref: "a DELETE and an APPLY on a Lease are refused; a takeover by a conditional update still works"}
  - id: REQ-DATA-098
    area: DATA
    statement: "After a delete or a sweep, an item created again at the same address MUST have version 1."
    rationale: "The store keeps no tombstone, so a caller must not rely on a version across a deletion (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [864]
    tests: [actors/store/tests/watch_engines.rs, kits/rust/sluis-conformance/src/memory.rs, drivers/store/rqlite/tests/driver.rs]
    verification:
      - {kind: conformance-suite, ref: "version conformance on every engine: create, delete, create again gives 1; through store@ on memory and rqlite, a create after a delete or a sweep is at version 1"}
  - id: REQ-DATA-099
    area: DATA
    statement: "store@ MUST return, on request, the signed document in force of a config kind exactly as its config source gave it, to the readers of that kind in the registry and to no other caller, and for no self-scoped kind."
    rationale: "A reader that must not rely on store@ for what a document says, such as key@ for the KeyPlan, verifies the signature and the sequence itself (ADR 0005, ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157, 1208]
    tests: [actors/store/tests/store.rs, actors/store/tests/config.rs, actors/store/tests/signed_config.rs, kits/go/store/store_test.go]
    verification:
      - {kind: integration-test, ref: "a reader gets the source's bytes; a non-reader, a non-config kind and a self-scoped kind are refused; the size is bounded"}
  - id: REQ-DATA-110
    area: DATA
    statement: "The registry generator MUST fail when a Tenant-adjustable kind has a field that carries no bound in config or in the built-in layer and is not listed as unbounded with a reason."
    rationale: "A field added later must not become a way for a tenant to widen itself (v1 ADR 0078)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "the generator test adds a field to a fixture kind of the Tenant-adjustable profile and the generator fails until the field is bounded or listed as unbounded with a reason"}
  - id: REQ-DATA-111
    area: DATA
    statement: "store@ SHOULD refuse a write to a kind whose list field holds more entries than the maximum count that the kind declares."
    rationale: "A list that grows without a bound will one day exceed the size limit of an item in the engine, and v1 found this with a field it had not counted."
    level: SHOULD
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [store]
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "a write one entry over the declared maximum is refused; a kind with a bound counts every field it writes, bookkeeping fields included, before the write"}
  - id: REQ-DATA-113
    area: DATA
    statement: "A store engine that is asked for a linearizable listing MUST answer at that level or refuse the call, and never answer at a weaker one."
    rationale: "A listing that decides authority, such as the revocation check of a signature, must not be weaker than the Get it replaced, and an engine that quietly weakens it makes the request meaningless (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    tests:
      - drivers/store/rqlite/tests/driver.rs
      - actors/store/tests/store.rs
    verification:
      - {kind: conformance-suite, ref: "the item suite: after each of fifty acknowledged writes a linearizable query lists all of them (linearizable_query)"}
      - {kind: integration-test, ref: "the rqlite driver reads at weak when not asked and at linearizable when asked; store@ passes the consistency of a listing to the driver (a_query_is_read_at_the_level_it_asked_for)"}
