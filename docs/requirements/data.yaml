# DATA: The data model and the store (decisions 0004 and 0005).
# Each record states one rule of the kind registry, the address, the storage classes, treatment, profiles and the
# direction rule, the one generic store service, watch, drivers, engines, time to live, leases, configuration
# loading, the bootstrap file or secret sources. The rules that moved here from ISO, OPS and SECRETS are
# withdrawn there and name the record here in `superseded_by`.
schema: 1
area: DATA
requirements:

  # ---- the kind registry
  - id: REQ-DATA-001
    area: DATA
    statement: "store@ MUST refuse to read or write a kind that the kind registry does not declare."
    rationale: "A kind outside the registry has no schema, class, writer or rule, so nothing could be checked about it (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1203]
    verification:
      - {kind: integration-test, ref: "a get, a listing, a write and a watch of an undeclared kind name are refused with the reason address and the path of the kind"}
  - id: REQ-DATA-002
    area: DATA
    statement: "The kind registry MUST give every kind exactly one storage class, one treatment and one profile or none for protocol state."
    rationale: "A kind with two classes would have two writers and two backup rules, and where a thing is written decides its class (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1202]
    verification:
      - {kind: integration-test, ref: "registry check test: an unknown class, no treatment, no profile or an unknown profile fails the registry build, and a kind cannot be given two classes"}
  - id: REQ-DATA-003
    area: DATA
    statement: "The kind registry MUST name exactly one writer for every kind, except the restore command of store@ and the declared self-scoped kinds."
    rationale: "One writer per kind is what lets the store refuse every other caller and lets a reviewer find the owner of a rule (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1202]
    tests: [tools/gen/registry/generator_test.go]
    verification:
      - {kind: integration-test, ref: "registry check: a kind with two writers, or a writer that is not an actor, fails the check"}
  - id: REQ-DATA-004
    area: DATA
    statement: "store@ MUST refuse a write to a kind by any caller other than the kind's one writer, except the restore command of store@ and the actor named in the id of a self-scoped kind."
    rationale: "A compromised work actor must not be able to write what its rules refuse (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1203]
    tests: [actors/store/tests/store.rs]
    verification:
      - {kind: integration-test, ref: "every caller of store@ that is not a durable or temp kind's writer is refused a create, update, delete and apply with the rule or writer code, no engine is reached, and the writer is not refused"}
      - {kind: test-vectors, ref: "the generated rules table against the writer column of the registry, for every kind and every caller of store@; on a self-scoped kind an id that names another actor is refused"}
  - id: REQ-DATA-005
    area: DATA
    statement: "store@ MUST let an actor write an item of a declared self-scoped kind only when the id starts with that actor's name."
    rationale: "Lease, ReplayGuard and SpentGrant have many writers, and the id prefix keeps one writer per item (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1203]
    verification:
      - {kind: integration-test, ref: "actor X writes a Lease whose id starts with actor Y's name; refused"}
  - id: REQ-DATA-006
    area: DATA
    statement: "The registry check MUST fail a temp kind that has no default and maximum time to live."
    rationale: "A temp item with no expiry would grow without bound and be neither temporary nor lost (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1202]
    tests: [tools/gen/registry/generator_test.go]
    verification:
      - {kind: integration-test, ref: "registry check: a temp kind without a TTL fails"}
  - id: REQ-DATA-007
    area: DATA
    statement: "The registry check MUST fail a config kind or a secret kind that has a tenant scope."
    rationale: "A tenant never appears in config, so a tenant's change never waits for a review (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1202]
    verification:
      - {kind: integration-test, ref: "registry check test: a config or secret kind scoped to boundary and tenant fails the registry build"}
  - id: REQ-DATA-008
    area: DATA
    statement: "The registry check MUST fail a durable or temp kind that holds personal data or free text and is declared plain."
    rationale: "Treatment follows the data, so personal data is sealed, or hashed when it is compare-only (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1202]
    tests: [tools/gen/registry/generator_test.go]
    verification:
      - {kind: integration-test, ref: "registry check: a kind marked `personal: true` with treatment plain fails; the same kind sealed or hashed passes"}
  - id: REQ-DATA-009
    area: DATA
    statement: "The registry check MUST fail a writer or reader of a kind that is not an actor name of the actor registry, except IaC or the publishing pipeline as the writer of a config or secret kind."
    rationale: "A rule over a name that no actor has is a rule nobody enforces (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1202]
    tests: [tools/gen/registry/generator_test.go]
    verification:
      - {kind: integration-test, ref: "registry check: a reader named after a product or a person fails"}
  - id: REQ-DATA-010
    area: DATA
    statement: "store@ MUST answer a list only by tenant and kind or by an index that the kind declares."
    rationale: "A new question is a new declared index, reviewed with the kind, and there is no query language and no SQL (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1203]
    verification:
      - {kind: integration-test, ref: "a list by an undeclared index is refused; no call accepts a query string"}

  # ---- the address
  - id: REQ-DATA-011
    area: DATA
    statement: "Every address MUST have the form boundary, tenant or dash, kind and id."
    rationale: "Only two scope dimensions exist, and the flat address is what makes a prefix rule and a sealed value bound to its address possible (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1202]
    tests: [kits/go/store/address_test.go, actors/store/tests/store.rs]
    verification:
      - {kind: test-vectors, ref: "address vectors: well-formed and malformed addresses"}
  - id: REQ-DATA-012
    area: DATA
    statement: "An id MUST NOT contain personal data."
    rationale: "Ids appear in indexes, logs and addresses that are not sealed, so personal data in an id cannot be erased by shredding a key (ADR 0004)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [1202]
    tests: [tools/gen/registry/generator_test.go]
    verification:
      - {kind: integration-test, ref: "registry check: a kind marked `personal: true` is never plain, so a personal value is sealed or hashed and not in the clear"}
      - {kind: integration-test, ref: "an id made from a natural key is a keyed hash made at key@"}
  - id: REQ-DATA-013
    area: DATA
    statement: "store@ MUST derive the boundary of a call from its own bootstrap file and the caller from the transport, and never from a field of the request."
    rationale: "A scope taken from the request would let any caller name another boundary's data (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [851]
    tests: [actors/store/tests/store.rs, actors/store/tests/serve_config.rs]
    verification:
      - {kind: test-vectors, ref: "no request message has a boundary or caller field; a grant, tenant or id that names another boundary reaches nothing of it, and every key lands under the service's own boundary"}
      - {kind: test-vectors, ref: "actor X names another actor in an id; the rule applied and the caller in the audit fact are X's"}
      - {kind: integration-test, ref: "store serve builds the service with the boundary of its bootstrap file (the start fact of a `store serve` with the boundary stage names stage)"}
  - id: REQ-DATA-014
    area: DATA
    statement: "Settings that hold for a whole installation MUST be one signed config document that is written, with the same content, into every boundary's config source."
    rationale: "An installation is not a scope, and a boundary that read another's config would share its fate (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1205]
    verification:
      - {kind: integration-test, ref: "two boundaries load the same installation-wide document from their own sources; a read of a document from another boundary's source is impossible by the bootstrap file"}

  # ---- storage classes and treatment
  - id: REQ-DATA-015
    area: DATA
    statement: "sluis MUST NOT write a config kind or a secret kind."
    rationale: "Where a thing is written decides its class, and a value with two writers would have two classes (ADR 0004)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [store]
    standards: []
    issues: [1205]
    tests: [actors/store/tests/store.rs]
    verification:
      - {kind: integration-test, ref: "a create, update, delete and apply of every config and secret kind by every caller of store@ is refused with the rule, no engine is reached, and a batch that mixes one in is refused whole"}
      - {kind: integration-test, ref: "the permission of store@ on its config and secret sources, and the IAM policy of the serverless installation, hold no write action (needs the serverless installation: not built)"}
  - id: REQ-DATA-016
    area: DATA
    statement: "store@ MUST serve a secret kind only to the readers that the kind lists."
    rationale: "A secret source holds values in the clear for whoever may read it, so the store is the second check (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1205]
    tests: [actors/store/tests/store.rs]
    verification:
      - {kind: integration-test, ref: "an actor that is not a listed reader of a secret kind asks for it; refused"}
  - id: REQ-DATA-017
    area: DATA
    statement: "store@ MUST fetch a secret-source value on first use, hold it in memory only, and never write it to disk, an audit fact, a log line or a span."
    rationale: "A secret that reaches a file or a log is copied beyond the reach of its source (ADR 0005)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [store]
    standards: []
    issues: [1205]
    verification:
      - {kind: integration-test, ref: "a secret is read and the disk, the audit log, the logs and the traces are scanned for its value"}
  - id: REQ-DATA-112
    area: DATA
    statement: "The credential driver of store@ MUST refuse a credentials directory that group or others can write or that neither its own uid nor, for the directory $CREDENTIALS_DIRECTORY names, root owns, and a credential file that others can access or group can write, that is root-owned outside that directory, or that group can read without an access ACL that names no user but its own uid and no reading group."
    rationale: "Only the owner and root can then plant or read a credential; systemd leaves the directory to root with a POSIX ACL for the service user, whose mask is the group bits, so no named entry can write (MEASURED 2026-11-06, Ubuntu 26.04, systemd 259; docs/runtimes/bare-metal.md)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: test-vectors, ref: "credential crate vectors: directory, file and ACL; the Rocky board's chown case (systemd 257) rests on them alone, as Rocky 10 in Docker sets up no credentials directory"}
      - {kind: integration-test, ref: "os-container-test.sh on Ubuntu 26.04: the real driver in its unit, with the dr-xr-x---+ directory systemd 259 makes, and credential check reads the three credentials"}
  - id: REQ-DATA-018
    area: DATA
    statement: "A secret kind MUST be linked to the config kind it serves."
    rationale: "The linked kinds carry the difference between an app definition and its secret, each in one class (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1202]
    tests: [tools/gen/registry/generator_test.go, actors/store/tests/store.rs]
    verification:
      - {kind: integration-test, ref: "a secret kind with no config kind fails the registry check; a secret that the source does not hold fails closed at first use with the reason absent, and the load does not read it"}
  - id: REQ-DATA-019
    area: DATA
    statement: "store@ MUST keep a sealed value as the ciphertext the writing actor produced and a hashed value as the hash the writing actor computed."
    rationale: "The store never seals or opens a stored value, so a compromised store yields no sealed data (ADR 0004); the keys it may use open grants (ADR 0007) and, at a restore, the backup archive key (ADR 0006, ADR 0010), and neither opens a stored value."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1206]
    tests: [actors/store/tests/generic_service.rs]
    verification:
      - {kind: integration-test, ref: "store@ holds no key purpose that opens a stored value (data, evidence, chain, cookie) and no key credential; it opens grants and unwraps the archive key on restore"}
      - {kind: integration-test, ref: "a dump of the engine holds ciphertext and hashes only for sealed and hashed kinds"}
  - id: REQ-DATA-020
    area: DATA
    statement: "store@ MUST validate the envelope of a sealed value and nothing of its content."
    rationale: "The store cannot read a sealed field, so the writing actor validates before it seals (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1206]
    tests: [actors/store/tests/store.rs]
    verification:
      - {kind: test-vectors, ref: "envelope vectors: a truncated, a mislabelled and a well-formed sealed value"}
  - id: REQ-DATA-021
    area: DATA
    statement: "A secret that sluis generates or receives MUST be stored as a sealed durable or temp kind, or as a hashed one when it is compare-only."
    rationale: "A generated secret is ordinary data, and the secret class is only for values that IaC writes into a source (ADR 0004)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [1206]
    verification:
      - {kind: integration-test, ref: "a generated client secret is stored as a hash; a received provider token is stored sealed; neither appears in the secret class"}
  - id: REQ-DATA-022
    area: DATA
    statement: "An exportable generated secret MUST be stored twice, as a hash to verify it and as a sealed copy to export it."
    rationale: "The sealed copy exists only for a consumer that is named, so a secret nobody reads stays unrecoverable (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1206]
    verification:
      - {kind: integration-test, ref: "a client marked exportable has a ClientSecret hash and a ClientSecretExport copy; a client not marked has the hash only"}
  - id: REQ-DATA-023
    area: DATA
    statement: "An index entry of a sealed kind MUST be a keyed hash made at key@ or a date."
    rationale: "An index is readable by the store, so it must not undo the sealing of the value (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1206]
    verification:
      - {kind: integration-test, ref: "the index entries of a sealed kind are scanned for the plaintext of the sealed fields"}

  # ---- profiles, layers and the direction rule
  - id: REQ-DATA-024
    area: DATA
    statement: "store@ MUST refuse every run-time write to a kind with profile Fixed."
    rationale: "A Fixed kind changes only by a reviewed, signed document, and a change at run time would bypass the review (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1207]
    tests: [actors/store/tests/store.rs]
    verification:
      - {kind: integration-test, ref: "every kind with profile Fixed in kinds.yaml refuses a create, update, delete and apply from every caller of store@, the console included (an operator or tenant admin reaches store@ only through it)"}
  - id: REQ-DATA-025
    area: DATA
    statement: "store@ MUST refuse a write to a Tenant-adjustable kind that lies outside the bounds that config or the built-in layer declares."
    rationale: "A tenant or a product writing for its tenant must hold no authority that the template did not carry (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [store]
    standards: []
    issues: [864]
    verification:
      - {kind: integration-test, ref: "a tenant write that raises each bounded field in turn is refused; a write on the bound is accepted"}
  - id: REQ-DATA-026
    area: DATA
    statement: "store@ MUST accept a write to a Tenant-adjustable kind only into the tenant that the sealed grant names."
    rationale: "A product writes through the same path as a tenant admin and may reach only its own tenant (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1207]
    verification:
      - {kind: integration-test, ref: "a write into tenant B with a grant sealed for tenant A is refused"}
  - id: REQ-DATA-027
    area: DATA
    statement: "store@ MUST refuse a write to a tenant-scoped kind, other than key@'s own writes of DataKeyWrap, unless the caller carries a grant sealed for that tenant that allows the verb."
    rationale: "The store's rule and the grant are one of the two independent checks between an actor and a tenant's data (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1207]
    verification:
      - {kind: integration-test, ref: "a write with no grant, with an expired grant and with a grant for another tenant; each refused"}
      - {kind: integration-test, ref: "a write to a boundary-scoped address is checked by the rule alone"}
  - id: REQ-DATA-028
    area: DATA
    statement: "store@ MUST refuse a write that loosens a layered kind past what the layer below allows."
    rationale: "A higher layer tightens freely and loosens only as far as the layer below grants (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [store]
    standards: []
    issues: [1207]
    verification:
      - {kind: integration-test, ref: "a tenant lifetime longer than config, a link outside its template and a method config forbids; each refused"}
  - id: REQ-DATA-029
    area: DATA
    statement: "A run-time loosening MUST be written to a temp kind with an expiry."
    rationale: "A loosening that lasts turns a temporary measure into a standing back door (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [store]
    standards: []
    issues: [1207]
    verification:
      - {kind: integration-test, ref: "a break-glass link written to the durable link kind is refused; written to the temp kind it expires within its maximum"}
  - id: REQ-DATA-030
    area: DATA
    statement: "A tightening MUST take effect at once and survive a restart and a restore."
    rationale: "A revocation or a suspension that waits or lapses is not a control (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1207]
    verification:
      - {kind: integration-test, ref: "a suspension is in force on the next call and is still in force after a restart and a restore"}
  - id: REQ-DATA-031
    area: DATA
    statement: "The store MUST compose the layers of a layered kind by the combine rule of its group, which is union with forbid wins for policies, shortest wins for lifetimes, intersection for sign-in methods and the unexpired override for log levels."
    rationale: "One effective value per group keeps every reader on the same answer (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [store]
    standards: []
    issues: [1207]
    verification:
      - {kind: test-vectors, ref: "combine vectors per group, including a forbid in the lowest layer"}
  - id: REQ-DATA-032
    area: DATA
    statement: "A read of a layered kind MUST return the effective value and, for each field, the layer that set it and its version."
    rationale: "A decision audit and an operator must see why a value is what it is (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [store]
    standards: []
    issues: [1207]
    verification:
      - {kind: integration-test, ref: "an effective read of the policy group returns every layer's part with its version"}
  - id: REQ-DATA-033
    area: DATA
    statement: "The most specific layer of branding MUST win, bounded by what config allows."
    rationale: "Branding has no tighter or looser direction, so only its bounds are checked (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [store]
    standards: []
    issues: [1207]
    verification:
      - {kind: integration-test, ref: "a tenant client brand overrides the boundary default; a brand outside the allowed hosts is refused"}
  - id: REQ-DATA-034
    area: DATA
    statement: "store@ MUST refuse a write that names a linked item that does not exist where the registry says the link is checked at write."
    rationale: "A link to a missing template would carry authority that no reviewer saw (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [store]
    standards: []
    issues: [1207]
    verification:
      - {kind: integration-test, ref: "a PolicyLink that names a template absent from config is refused"}
  - id: REQ-DATA-035
    area: DATA
    statement: "A tenant's connection to a provider MUST be a durable tenant-scoped kind with its credential sealed."
    rationale: "Who connects decides: a tenant never appears in config, and a customer's change does not wait for review (ADR 0004)."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: partly-built
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "registry check: the connection kinds are durable, tenant-scoped and sealed"}
      - {kind: integration-test, ref: "a DirectoryConnection written through the API is accepted without a config change"}
  - id: REQ-DATA-036
    area: DATA
    statement: "The console MUST route every write except those of Switch and LogLevelOverride to the owning actor."
    rationale: "The owning actor validates a write with its own logic, so the console cannot become a second writer (ADR 0004)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: v1-parity
    runtimes: all
    actors: [console]
    standards: []
    issues: [1219]
    verification:
      - {kind: integration-test, ref: "the console's write rules over the store name exactly two kinds; a write of any other kind from the console is refused"}

  # ---- schemas
  - id: REQ-DATA-037
    area: DATA
    statement: "The JSON Schema of the bootstrap file, of Helm values and of external configs MUST be generated from the Protobuf messages."
    rationale: "One source keeps the types, the validation and the editors' schemas from drifting apart (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [864, 1177]
    verification:
      - {kind: integration-test, ref: "CI regenerates the JSON Schema from the messages and fails on a difference from the committed golden file"}
  - id: REQ-DATA-038
    area: DATA
    statement: "Every binary MUST validate a document against its embedded schema before decoding it."
    rationale: "Decoding an unvalidated document first lets an unknown key or a bad value reach code before a check (ADR 0004)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [864, 1177]
    verification:
      - {kind: test-vectors, ref: "documents with an unknown key, a wrong type and a retired field are refused before any decoder runs"}
  - id: REQ-DATA-039
    area: DATA
    statement: "The Go protovalidate validator and the Rust kit's checks MUST give the same verdict on every shared conformance vector."
    rationale: "A validator that disagrees across languages makes two actors read the same document differently (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1177]
    verification:
      - {kind: test-vectors, ref: "the shared protovalidate vector set run by the Go validator and the Rust checks"}
  - id: REQ-DATA-040
    area: DATA
    statement: "A published schema identifier MUST never change."
    rationale: "An external tool pins the identifier, so changing what it names breaks it without notice (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [864]
    verification:
      - {kind: integration-test, ref: "a schema change that breaks compatibility fails CI unless it carries a new identifier"}
  - id: REQ-DATA-041
    area: DATA
    statement: "A document with an unknown key MUST be refused with an error that names the path and never shows the value."
    rationale: "An error that shows a value could leak a secret, and a silent unknown key hides a typo (ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [864]
    verification:
      - {kind: test-vectors, ref: "unknown-key vectors per config kind: the error names the path and holds no value"}
  - id: REQ-DATA-042
    area: DATA
    statement: "A retired field in a signed config document MUST be refused."
    rationale: "Strictness comes from the schema, and a reviewed document can be fixed and published again where a stored item cannot (ADR 0004)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [1205]
    verification:
      - {kind: integration-test, ref: "a config document with a retired field fails the load with an error that names the path"}
  - id: REQ-DATA-043
    area: DATA
    statement: "A retired field in an item that sluis wrote MUST be read, ignored and never written again."
    rationale: "Refusing a retired field in stored data would make an installed item unreadable (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1205]
    verification:
      - {kind: integration-test, ref: "a stored item with a retired field is read and rewritten without it"}
  - id: REQ-DATA-044
    area: DATA
    statement: "A duration in a configuration file MUST be written as a number with a unit, such as `900s`, `15m`, `12h` or `30d`."
    rationale: "An operator reads and reviews a duration as written, and the loader converts it to a Duration that the generated schema checks by pattern (ADR 0004)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: external-suite-not-run
    runtimes: all
    standards: []
    issues: [1177]
    verification:
      - {kind: test-vectors, ref: "duration vectors in a configuration file: 900s, 15m, 12h and 30d accepted, 'PT15M', bare numbers and unknown units refused"}

  - id: REQ-DATA-095
    area: DATA
    split_from: REQ-DATA-044
    statement: "A duration in a value that is not a configuration file MUST be a proto3 JSON duration, such as `30s`."
    rationale: "Values outside configuration files are read by Protobuf tooling, which knows only the proto3 JSON form (ADR 0004)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1177]
    verification:
      - {kind: test-vectors, ref: "duration vectors in a value file: 30s accepted, 15m, 'PT30S' and bare numbers refused"}
  # ---- the store service and its rules
  - id: REQ-DATA-045
    area: DATA
    statement: "store@ MUST serve one generic store service with the calls Get, List, Write and Watch, each carrying a kind name and bytes."
    rationale: "One service for every kind keeps the wire small, and the rules of the registry give the isolation that a service per kind would only repeat (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1203]
    tests: [actors/store/tests/generic_service.rs]
    verification:
      - {kind: conformance-suite, ref: "store service conformance: a new kind is added to the registry and served with no new method"}
  - id: REQ-DATA-046
    area: DATA
    statement: "store@ MUST decode every write against the registry and validate it against the kind's schema, the envelope only for a sealed kind, before it applies the write."
    rationale: "The store is the one place that sees every write, so it is where a malformed item must stop (ADR 0005)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [store]
    standards: []
    issues: [1203]
    verification:
      - {kind: integration-test, ref: "a write with a wrong type, an unknown key and an out-of-range value is refused and nothing is stored"}
  - id: REQ-DATA-047
    area: DATA
    statement: "store@ MUST deny a call unless the caller's rule for the kind and verb allows it, checked before the call touches data."
    rationale: "A rule the caller can skip is not a control, and an unlisted call must fail (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [851]
    verification:
      - {kind: test-vectors, ref: "the rules matrix: every actor, kind and verb not listed is refused"}
      - {kind: integration-test, ref: "the matrix is generated from the kind registry and the actor registry and the drift test passes"}
  - id: REQ-DATA-048
    area: DATA
    statement: "store@ MUST learn the caller from the transport and apply the union of the rules of fused actors that present one identity."
    rationale: "Only the transport identity cannot be forged by the request (ADR 0005)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [store]
    standards: []
    issues: [1203]
    tests: [actors/store/tests/store.rs]
    verification:
      - {kind: integration-test, ref: "a process under another uid, a Lambda role and a service account each get the rules of their own identity only"}
  - id: REQ-DATA-049
    area: DATA
    statement: "store@ MUST apply the writes of one batch all or none."
    rationale: "A flow over several items is idempotent steps with a recovery marker, so there are no interactive transactions (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1203]
    verification:
      - {kind: integration-test, ref: "a batch with one invalid item changes nothing; a batch that mixes the kinds of two writers is refused"}
  - id: REQ-DATA-050
    area: DATA
    statement: "store@ MUST refuse an update whose if_version is not the item's current version."
    rationale: "A compare-and-set on the version is what makes concurrent writers safe (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1203]
    verification:
      - {kind: integration-test, ref: "two updates at one version: the second is refused; a create at an existing address is refused"}
  - id: REQ-DATA-051
    area: DATA
    statement: "While MaintenanceMode is set, store@ MUST refuse every write except those of the restore command."
    rationale: "A restore must not race with live writes, and a failed restore must stay in maintenance (ADR 0005)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [store]
    standards: []
    issues: [1203]
    verification:
      - {kind: integration-test, ref: "with the mode set, a write from every work actor is refused and a restore write is accepted"}
  - id: REQ-DATA-052
    area: DATA
    statement: "store@ MUST record every refusal as an audit fact that names the code of the rule."
    rationale: "An operator must see which rule refused a call, and a pattern of refusals is a signal (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1203]
    verification:
      - {kind: integration-test, ref: "a refused write returns the rule's code and the audit log holds the fact without the value"}
  - id: REQ-DATA-053
    area: DATA
    statement: "A typed client MUST build the address from the boundary it is connected to, the tenant and id the caller passes, and the kind's name."
    rationale: "The client is generated from the kind's message, and the identity belongs to the transport (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [861]
    tests: [kits/go/store/store_test.go, kits/rust/sluis-store/tests/store.rs]
    verification:
      - {kind: conformance-suite, ref: "client kit conformance in Go and Rust: the addresses of a representative set of kinds (one per class and scope) equal hand-written golden addresses; every kind follows with the typed clients"}
  - id: REQ-DATA-054
    area: DATA
    statement: "store@ MUST set every timestamp of an item itself."
    rationale: "An engine that does not rewrite non-deterministic defaults would let a replica compute its own time (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [952]
    tests: [actors/store/tests/watch_engines.rs, drivers/store/rqlite/src/sql.rs]
    verification:
      - {kind: integration-test, ref: "two store@ instances with different clocks over one engine, memory and rqlite: each item carries the expiry its writer computed from its own clock, and an update sets it from its writer's clock"}
      - {kind: test-vectors, ref: "no statement of the rqlite driver and no column default reads a clock or a random source"}

  # ---- watch, time to live and leases
  - id: REQ-DATA-055
    area: DATA
    statement: "store@ MUST write a change-log row in the same transaction as each change of a kind that some actor may watch."
    rationale: "A watcher must neither miss a change nor see one that did not happen (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [952]
    tests: [actors/store/tests/store.rs, kits/rust/sluis-conformance/src/memory.rs, drivers/store/rqlite/tests/driver.rs]
    verification:
      - {kind: integration-test, ref: "each put and delete of a watched or exportable kind goes to the engine as one transaction that asks for its log row, and the log grows by that row; a kind nobody watches asks for none"}
      - {kind: conformance-suite, ref: "a transaction that is refused leaves no log row and no change, one that holds leaves one row for each logged put and delete, on every engine"}
  - id: REQ-DATA-056
    area: DATA
    statement: "store@ MUST write no change-log row for a kind that nobody may watch."
    rationale: "A hot counter such as an allowance stays one conditional update (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1204]
    verification:
      - {kind: integration-test, ref: "an admit against an allowance writes one item and no log row"}
  - id: REQ-DATA-057
    area: DATA
    statement: "store@ MUST refuse a watch from a resume point that the change log no longer holds, with an error distinct from every other, so that the watcher lists the kind again."
    rationale: "A silent gap in the stream is a missed change (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1204]
    verification:
      - {kind: integration-test, ref: "a watch from a purged sequence returns the distinct error; a list then catches up"}
  - id: REQ-DATA-058
    area: DATA
    statement: "When the store swaps a snapshot, it MUST deliver each changed config kind to the watchers of that kind."
    rationale: "Config has no change log, and policy and exporter@ must act on a change (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1204]
    verification:
      - {kind: integration-test, ref: "a snapshot swap that changes one config kind notifies its watchers and no others"}
      - {kind: integration-test, ref: "a config watch sends the snapshot in force as puts, then a bookmark"}
      - {kind: integration-test, ref: "an item removed between the listing and the watch is dropped at the first bookmark"}
  - id: REQ-DATA-100
    area: DATA
    statement: "store@ MUST deliver a change of a watched kind with its log sequence and the item as read at delivery, skip a put row only for a later row of the same address, and deliver an item that is gone as a delete with no value."
    rationale: "The change log holds no value, so a watcher applies the state and not the edits; a version restarts at 1 after a re-create, so the sequence is the identity of a change (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1204]
    verification:
      - {kind: integration-test, ref: "an item changed three times since the resume point is delivered once at its current version; an item made and removed is a delete with no value"}
      - {kind: integration-test, ref: "an item removed and made again is delivered as the delete and then the new put, on both engines; a consumer that dedupes by the sequence ends with the new value"}
  - id: REQ-DATA-101
    area: DATA
    statement: "A driver MUST write a delete row of the change log whenever an item that was written with a log row is removed, expiry and a delete of an expired item included, which store@ delivers to a watcher as a delete."
    rationale: "A watcher that holds an item must learn that it expired, and an expired item is gone for every read (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1204]
    verification:
      - {kind: integration-test, ref: "an item with a short time to live is swept and its watcher gets a delete, then the item made again arrives as a new put, on both engines"}
      - {kind: integration-test, ref: "an expired item that was not swept and is deleted leaves its delete row; an item written without a log row leaves none"}
  - id: REQ-DATA-102
    area: DATA
    statement: "A listing of a watched kind MUST name a resume point, the same on every page, that a watch can start from without missing a change after the listing."
    rationale: "Without it a watcher that lists and then watches from now loses the changes between the two calls (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1204]
    verification:
      - {kind: integration-test, ref: "list in two pages with a write between them: both name one position, and a watch from it gives the write; an empty log still names a position"}
      - {kind: integration-test, ref: "the item suite of both engines: a query names the head of the log, never 0, and a tail from it misses nothing written after"}
  - id: REQ-DATA-103
    area: DATA
    statement: "An idle watch MUST send the latest resume point as a bookmark every 30 seconds."
    rationale: "A watcher that restarts after a long silence must not fall behind the retention of the change log (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1204]
    verification:
      - {kind: integration-test, ref: "an idle watch sends the resume point it started from, then the point of the last change it was told, with a short interval"}
      - {kind: integration-test, ref: "an idle config watch sends a bookmark with resume point 0"}
  - id: REQ-DATA-104
    area: DATA
    statement: "store@ MUST refuse a caller's watch beyond 16 open at once."
    rationale: "A stream is read for as long as it is open, and no buffer in store@ bounds its cost, so the number of streams is the bound (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1204]
    verification:
      - {kind: integration-test, ref: "16 watches open, the 17th is refused with watch_limit and audited; another caller has its own; a watch that ends gives its place back"}
  - id: REQ-DATA-105
    area: DATA
    statement: "A driver MUST keep the change log for a bounded window, one hour by default and at most seven days, and trim it in its sweeper."
    rationale: "A log that is kept for ever is storage nobody asked for, and a watcher that falls behind the window lists again (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1204]
    verification:
      - {kind: integration-test, ref: "the sweeper trims rows older than a short retention and a tail behind the floor is refused; a retention above seven days is refused at start"}
  - id: REQ-DATA-106
    area: DATA
    statement: "store@ MUST judge a watch as it judges a read: the actor's watch rule on the kind, the kind's scope for the tenant, and the actor's own ids for a self-scoped rule."
    rationale: "A change feed shows what a read shows, so it needs no weaker check (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1204]
    verification:
      - {kind: integration-test, ref: "an actor with no watch rule, a tenant that does not fit the kind and an engine that is down each get their refusal, audited"}
  - id: REQ-DATA-108
    area: DATA
    statement: "The Rust typed client's watch helper MUST list the kind, follow it from the position of the listing, deliver each change once and in increasing sequence, reconnect from the last position it delivered after a break, and take a stream that stays silent past its idle timeout for broken."
    rationale: "Every follower of a kind needs the same list-then-watch loop, and a loop written by hand per actor loses or repeats a change at the seams; the Go client has no watch helper yet (ADR 0005, ADR 0009)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1453, 1362]
    verification:
      - {kind: integration-test, ref: "a scripted store@: a three-page listing, then puts, deletes, a bookmark in order; a repeat is dropped; a break, an end, a silent stream resume from the last point; a cancelled call keeps the backoff"}
      - {kind: integration-test, ref: "store@ end to end: 150 items over two pages listed then followed; a restart resumes; a delete and an expiry arrive as deletes; an idle stream says its point"}
  - id: REQ-DATA-109
    area: DATA
    statement: "The Rust typed client's watch helper MUST report a resume point that store@ no longer holds as an explicit resync that carries the whole state of the kind, and end with an error, never a skip, on a value that does not decode, a change that is malformed or a refusal that a retry cannot cure."
    rationale: "A reader that answers \"not revoked\" from a followed kind must learn that it may have missed a change, and must not go on from a state it cannot trust (ADR 0005, ADR 0041)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1453, 1362]
    verification:
      - {kind: integration-test, ref: "a scripted store@: an expired point gives a resync with the whole state; a value that does not decode, a malformed change or a refusal of a rule ends the watch"}
      - {kind: integration-test, ref: "store@ end to end: a saved point below the floor of the change log gives a resync with every item of the kind, and the watch follows from the new position"}
  - id: REQ-DATA-114
    area: DATA
    statement: "An item engine MUST draw a nonzero epoch when it creates its change log, keep it with the log, name it beside the log head of every query, and give a log that it creates again another epoch."
    rationale: "A restore into a new database or a reset begins the sequence again, so the same number can name another position, and only an epoch tells the two logs apart (ADR 0005, issue 1459)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1459, 1453]
    tests:
      - kits/rust/sluis-conformance/src/memory.rs
      - drivers/store/rqlite/tests/driver.rs
    verification:
      - {kind: conformance-suite, ref: "the item suite: every query names a nonzero epoch, the same one on every query while the log lasts (log_epoch)"}
      - {kind: integration-test, ref: "memory engine and rqlite: a log made again has another epoch (and a floor of 0), a second start keeps it, no epoch row reads no position (serverless engine: not built)"}
  - id: REQ-DATA-115
    area: DATA
    statement: "An item engine MUST refuse a tail from a nonzero sequence under any epoch but its log's, an absent epoch included, and end an open tail whose log has another epoch, with the reason sequence_expired."
    rationale: "A tail that follows a number of another log delivers the wrong rows and skips the right ones without a word (ADR 0005, issue 1459)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1459, 1453]
    tests:
      - kits/rust/sluis-conformance/src/memory.rs
      - drivers/store/rqlite/tests/driver.rs
      - actors/store/tests/watch_engines.rs
    verification:
      - {kind: conformance-suite, ref: "the item suite: a tail from a held sequence is given under the log's epoch and refused under none or another; from 0 the epoch is not looked at (log_epoch)"}
      - {kind: integration-test, ref: "memory engine and rqlite: after a reset a tail under the old epoch or none is refused, one under the new is held, an open stream ends (serverless engine: not built)"}
  - id: REQ-DATA-116
    area: DATA
    statement: "store@ MUST name the epoch of the change log with the position of a listing of a watched kind and on every message of a watch."
    rationale: "A saved position is the pair of an epoch and a sequence, and a position that could be the same number in another log must never be handed out (ADR 0005, issue 1459)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1459, 1453]
    tests:
      - actors/store/tests/watch.rs
    verification:
      - {kind: integration-test, ref: "a listing names the epoch on every page; a change, a delete and a bookmark name it; a kind nobody watches names none"}
  - id: REQ-DATA-119
    area: DATA
    split_from: REQ-DATA-116
    statement: "store@ MUST refuse a listing of a watched kind and a watch, with unavailable and the reason engine, when the engine names a log position with no epoch."
    rationale: "A position without an epoch could be the same number in another log, and store@ must never hand one out (ADR 0005, issue 1459)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1459, 1453]
    tests:
      - actors/store/tests/watch.rs
    verification:
      - {kind: integration-test, ref: "an engine that names a position with epoch 0 gives unavailable for a listing and for a watch, from now or from a point"}
  - id: REQ-DATA-117
    area: DATA
    statement: "store@ MUST refuse a watch from a nonzero resume point under any epoch but the log's, an absent epoch included, with the reason resume_point_expired, even when the log holds that number."
    rationale: "After a restore or a reset a saved point would otherwise skip every change between the start of the new log and the saved number, and nothing would say so (ADR 0005, issue 1459)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1459, 1453]
    tests:
      - actors/store/tests/watch.rs
      - actors/store/tests/watch_engines.rs
      - actors/store/tests/watch_client.rs
    verification:
      - {kind: integration-test, ref: "a watch from a point saved before the log was made again is refused and audited, under the old epoch or none, though the new log holds the number (fake, memory, rqlite)"}
  - id: REQ-DATA-118
    area: DATA
    statement: "The Rust typed client's watch helper MUST keep its resume point as an epoch and a sequence, drop a change as a repeat only inside one epoch, and list the kind again, never skip, when store@ refuses the epoch of its point or a message names another epoch than its stream was opened under."
    rationale: "A dedupe by sequence alone drops the changes of a restored log whose numbers are below the old applied point, and a resume by sequence alone skips its first rows (ADR 0005, issue 1459)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1459, 1453]
    tests:
      - kits/rust/sluis-store/tests/watch.rs
      - actors/store/tests/watch_client.rs
    verification:
      - {kind: integration-test, ref: "a scripted store@: a point of another epoch or none lists again, a message of another epoch moves nothing, a change below the old sequence is applied, no epoch ends the watch"}
      - {kind: integration-test, ref: "store@ end to end: a point saved before a restore is refused when the new log has grown past it, and a change of the restored log below the old point is applied and not dropped"}
  - id: REQ-DATA-120
    area: DATA
    statement: "store@ MUST send one bookmark that says the stream is caught up as soon as a watch has delivered every row of the change log up to the head it read when it opened, at once when there is none to deliver, after the last row up to the head and before any row past it."
    rationale: "A reader that fails closed must know when its state holds what was committed before it reconnected, and neither the first change nor an idle bookmark says so (ADR 0005, issue 1458)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1458, 1453]
    tests:
      - actors/store/src/watch.rs
      - actors/store/tests/watch.rs
      - actors/store/tests/watch_engines.rs
      - actors/store/tests/watch_client.rs
    verification:
      - {kind: integration-test, ref: "an empty catch-up is the first message; 600 rows behind come before the bookmark at the head; writes during it follow it; other kinds and a put kept for a row past the head are placed right"}
      - {kind: integration-test, ref: "a log that lags gets idle bookmarks with no claim until the rows arrive; a stream that ends before the head never claims it; on the memory engine and rqlite"}
  - id: REQ-DATA-121
    area: DATA
    split_from: REQ-DATA-120
    statement: "The Rust typed client's watch helper MUST report the caught-up bookmark as an event and hold its state unconfirmed after a listing, a break, a reconnect and a dropped call until that event of the current stream, which no idle bookmark gives."
    rationale: "A reader that answers \"not revoked\" from a followed kind may answer only from a state that holds what was committed before it connected (ADR 0005, ADR 0041, issue 1458)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1458, 1453]
    tests:
      - kits/rust/sluis-store/tests/watch.rs
      - actors/store/tests/watch_client.rs
    verification:
      - {kind: integration-test, ref: "a scripted store@: a listing and a first change do not confirm, the caught-up bookmark does, an idle one keeps it, a break, a resync or a dropped call takes it away, the new stream gives it back"}
      - {kind: integration-test, ref: "store@ end to end: confirmed right after the listing, after a restart from a saved point, and after 300 rows behind, with a change made during the catch-up after it"}
  - id: REQ-DATA-122
    area: DATA
    split_from: REQ-DATA-120
    statement: "store@ MUST read the head of the change log that a watch opens at, and its epoch, at a linearizable level, or refuse the watch, and never at a weaker one."
    rationale: "A head read from a replica that lags a write acknowledged before the call would let the stream say it is caught up without that write (ADR 0005, issue 1458)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1458, 1453]
    tests:
      - actors/store/tests/watch.rs
    verification:
      - {kind: integration-test, ref: "with a read that is not linearizable 3 rows behind, the caught-up bookmark of a watch from a point and of one from now names the true head, and the query for it asks for a linearizable read"}
  - id: REQ-DATA-123
    area: DATA
    split_from: REQ-DATA-120
    statement: "The Rust typed client's watch helper MUST end its count of failures only on a change or on a caught-up stream that has stayed up, interrupt a stream that is not caught up within a stated time, and give a reader the time since the stream last spoke."
    rationale: "A store@ that opens streams and cannot read them would otherwise be asked again at the first wait for ever, hide its failure from the limit on failures, and leave a fail-closed reader with a claim of unknown age (ADR 0005, ADR 0041, issue 1458)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1458, 1453]
    tests:
      - kits/rust/sluis-store/tests/watch.rs
    verification:
      - {kind: integration-test, ref: "streams that say caught up and die: the count grows to the cap and give_up_after is reached; a caught-up stream that stays up ends the count, one never caught up does not"}
      - {kind: integration-test, ref: "a stream not caught up in time, though idle bookmarks keep coming, is interrupted (catch-up stalled) and the reconnects back off; a reader can bound the time since the stream last spoke"}
  - id: REQ-DATA-124
    area: DATA
    split_from: REQ-DATA-120
    statement: "store@ MUST refuse a watch of a kind that has no change log, whatever its rules grant, with invalid_argument and the reason address."
    rationale: "A stream over a kind that nothing logs would say it is caught up at once and then deliver nothing for ever (ADR 0005, issue 1458)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1458, 1453]
    tests:
      - actors/store/tests/watch.rs
    verification:
      - {kind: integration-test, ref: "a watch of a durable kind that is neither watched nor exportable is refused from now and from a point, and the refusal is audited"}
  - id: REQ-DATA-059
    area: DATA
    statement: "On serverless the store MUST answer a re-read with an unchanged reply when the ETag matches."
    rationale: "A function cannot hold a stream, so freshness costs one small reply (ADR 0005)."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: partly-built
    runtimes: ["serverless"]
    actors: [store]
    standards: []
    issues: [1204]
    verification:
      - {kind: integration-test, ref: "a re-read with the current ETag returns unchanged and carries no body"}
  - id: REQ-DATA-060
    area: DATA
    statement: "store@ MUST return an item past its expiry as absent whatever the engine still holds."
    rationale: "Correctness cannot depend on when a sweeper runs (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [952]
    verification:
      - {kind: integration-test, ref: "an item is read after its expiry before the sweeper has run; absent"}
      - {kind: integration-test, ref: "a create at an expired address succeeds"}
  - id: REQ-DATA-061
    area: DATA
    statement: "store@ MUST refuse a write to a temp kind that asks for a time to live longer than the kind's maximum."
    rationale: "A tunable may shorten a TTL and never lengthen it past the maximum (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1203]
    verification:
      - {kind: integration-test, ref: "a temp write with a TTL one second over the maximum is refused; at the maximum it is accepted"}
  - id: REQ-DATA-062
    area: DATA
    statement: "A sweeper MUST remove expired items, except those of the Lease kind."
    rationale: "The sweep only frees space, and a lease must keep growing its version (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [952]
    verification:
      - {kind: integration-test, ref: "expired items disappear from the engine within the sweep interval; an expired Lease stays"}
  - id: REQ-DATA-063
    area: DATA
    statement: "The kind Lease MUST be a temp kind whose version is a fencing token that grows each time the lease changes hands."
    rationale: "A fencing token lets a write be refused when its holder lost the lease (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [956]
    tests: [actors/store/tests/watch_engines.rs, kits/rust/sluis-conformance/src/memory.rs, drivers/store/rqlite/tests/driver.rs]
    verification:
      - {kind: integration-test, ref: "six takers race for one lease through store@ on memory and rqlite: one wins each of four rounds, the others are told it is taken or stale, and the version grows by one at each takeover"}
      - {kind: conformance-suite, ref: "six writers race on one key with the same condition on every engine: one wins, the version of the winner is the next one"}
  - id: REQ-DATA-064
    area: DATA
    statement: "store@ MUST let an expired lease be taken over by a conditional update of the same item."
    rationale: "A swept lease would restart its version and break the fencing token (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [956]
    verification:
      - {kind: integration-test, ref: "a lease expires, is taken over, and its version is one higher than before"}
  - id: REQ-DATA-065
    area: DATA
    statement: "A lease MUST be taken only by a background job."
    rationale: "Request paths need no lock, and a self-scoped id keeps one writer per item (ADR 0005); the kind registry will name the lease takers through an actors.yaml field background_jobs, from which the generator derives the Lease writers, built with the first lease consumer (#1203)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1203]
    verification:
      - {kind: integration-test, ref: "the kind registry's rules let only reconcilers, scheduled adapters and the backup job write a Lease"}

  # ---- drivers and engines
  - id: REQ-DATA-066
    area: DATA
    statement: "A driver MUST be a separate binary behind one port that only its owner can open."
    rationale: "A driver holds a credential, and a socket another actor could open would be a second holder (ADR 0005)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [store]
    standards: []
    issues: [862]
    tests: [tests/deny/deny_test.go]
    verification:
      - {kind: integration-test, ref: "a process of a work actor opens the socket of a driver; refused by the file permissions and the unit"}
  - id: REQ-DATA-067
    area: DATA
    statement: "Every driver MUST offer the commands serve, check, version and conformance."
    rationale: "One contract and one command line per port is what lets an installation check a driver before it runs (ADR 0005)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [store]
    standards: []
    issues: [862, 851]
    verification:
      - {kind: conformance-suite, ref: "each shipped driver runs its four commands; check reports a bad configuration without starting"}
  - id: REQ-DATA-069
    area: DATA
    statement: "A durable or temp driver MUST see items only: a key, a version, bytes, a time to live and index entries."
    rationale: "A driver that interpreted kinds would be a second place where rules could differ (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [862]
    tests: [kits/go/registry/itemport_test.go]
    verification:
      - {kind: integration-test, ref: "TestItemPortSeesItemsOnly in kits/go/registry: ItemService has exactly Get, Query, Transact, TailLog; no field names a kind; each message has its field set pinned"}
  - id: REQ-DATA-070
    area: DATA
    statement: "A config source driver MUST return the bytes and a version label without parsing them."
    rationale: "Verification must run over the exact bytes before anything is parsed (ADR 0005)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [store]
    standards: []
    issues: [1157]
    tests: [drivers/store/file/tests/port.rs]
    verification:
