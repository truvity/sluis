  - id: REQ-DATA-074
    area: DATA
    statement: "The client API of rqlite MUST listen on the loopback address only."
    rationale: "Another listener on a board would be a path around store@ (ADR 0005)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [store]
    standards: []
