# SSH: SSH certificates
schema: 1
area: SSH
requirements:
  - id: REQ-SSH-001
    area: SSH
    statement: "sluis MUST issue SSH user certificates that are short-lived."
    rationale: "Short-lived certificates remove authorised_keys sprawl."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-65, section: "1", depth: Full}
    features: ["design"]
    verification:
      - {kind: test-vectors, ref: "OpenSSH regress tests"}
      - {kind: integration-test, ref: "lifetime test"}
  - id: REQ-SSH-005
    area: SSH
    split_from: REQ-SSH-001
    statement: "An SSH user certificate MUST carry the permitted principals."
    rationale: "Principals bind the certificate to accounts."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-65, section: "1", depth: Full}
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "sshd acceptance test"}
  - id: REQ-SSH-006
    area: SSH
    split_from: REQ-SSH-001
    statement: "An SSH user certificate MUST have restricted critical options."
    rationale: "Unrestricted options widen what a certificate allows."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-65, section: "1", depth: Full}
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "critical-options test"}
  - id: REQ-SSH-002
    area: SSH
    statement: "sluis MUST issue SSH host certificates."
    rationale: "Host certificates remove trust-on-first-use."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-65, section: "1", depth: Full}
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "sshd acceptance test"}
  - id: REQ-SSH-007
    area: SSH
    split_from: REQ-SSH-002
    statement: "Documented host setup MUST use an authorised-principals file so that principals map to accounts."
    rationale: "Host certificates remove trust-on-first-use."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-65, section: "1", depth: Full}
    features: ["design"]
    manual_reason: "A statement in the documentation is checked by reading it."
    verification:
      - {kind: manual, ref: "documentation review"}
  - id: REQ-SSH-003
    area: SSH
    statement: "sluis MUST publish an SSH key revocation list in the OpenSSH binary format."
    rationale: "Hosts need a revocation source."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-66, section: "1", depth: Full}
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "ssh-keygen -Qf check"}
  - id: REQ-SSH-004
    area: SSH
    statement: "An operator MAY run an OpenPubkey-style SSH sign-in next to sluis, but sluis does not provide one."
    rationale: "v1 offered this mode; v2 uses sluis's own SSH CA only, so it is not carried over."
    level: MAY
    source: v1-parity
    status: out-of-scope
    runtimes: all
    standards:
      - {id: NC-07, section: "OpenPubkey", depth: Full}
      - {id: ST-28, section: "2", depth: Partial}
    features: ["#825"]
    verification:
      - {kind: integration-test, ref: "opkssh integration test"}
