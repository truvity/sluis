# QUOTA: Quota and metering
schema: 1
area: QUOTA
requirements:
  - id: REQ-QUOTA-001
    area: QUOTA
    statement: "Quota MUST be metering by default, with enforcement configurable per policy rule for chosen subjects or audiences."
    rationale: "Enforcement carries availability risk."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "metering-only and enforcing configurations"}
  - id: REQ-QUOTA-002
    area: QUOTA
    statement: "Under strict enforcement the admitted total MUST never exceed the configured limit under concurrent requests."
    rationale: "These are the testable accuracy guarantees."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards:
      - {id: NC-15, section: "Idempotency", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "concurrent admit test"}
  - id: REQ-QUOTA-009
    area: QUOTA
    split_from: REQ-QUOTA-002
    statement: "Under soft enforcement the admitted total MUST exceed the limit by no more than one grant per instance."
    rationale: "These are the testable accuracy guarantees."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards:
      - {id: NC-15, section: "Idempotency", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "k6 load test"}
  - id: REQ-QUOTA-003
    area: QUOTA
    statement: "A request to admit, to confirm usage or to cancel MUST be idempotent under a caller-supplied request identifier."
    rationale: "Retries must not double-count."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards:
      - {id: NC-15, section: "Idempotency-Key", depth: Full}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "retry test"}
  - id: REQ-QUOTA-004
    area: QUOTA
    statement: "The effect of an event on a balance MUST be separate from the meter it counts towards."
    rationale: "Top-ups and consumption are different facts."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "effect catalogue test"}
  - id: REQ-QUOTA-010
    area: QUOTA
    split_from: REQ-QUOTA-004
    statement: "The effect of an event on a balance MUST be able to be negative, zero or positive."
    rationale: "Top-ups and consumption are different facts."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "signed effect test"}
  - id: REQ-QUOTA-005
    area: QUOTA
    statement: "A top-up pushed to the quota engine MUST be idempotent and audited."
    rationale: "Money-like operations need exactly-once effects."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards:
      - {id: NC-15, section: "Idempotency-Key", depth: Full}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "duplicate top-up test"}
  - id: REQ-QUOTA-006
    area: QUOTA
    statement: "The quota policy MUST define whether an exhausted balance blocks or allows overage."
    rationale: "Operators choose the risk."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards:
      - {id: NC-15, section: "Idempotency-Key", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "exhaustion test"}
  - id: REQ-QUOTA-011
    area: QUOTA
    split_from: REQ-QUOTA-006
    statement: "The quota policy MUST define whether an unavailable quota engine fails open or fails closed."
    rationale: "Operators choose the risk."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards:
      - {id: NC-15, section: "Idempotency-Key", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "outage test"}
  - id: REQ-QUOTA-007
    area: QUOTA
    statement: "A client MUST be able to query current usage and remaining balance."
    rationale: "Aggregates must be verifiable."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
      - {id: ST-78, section: "8785", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "usage query test"}
  - id: REQ-QUOTA-012
    area: QUOTA
    split_from: REQ-QUOTA-007
    statement: "Hourly aggregates MUST list the identifiers of their events so that their sum equals the count of facts."
    rationale: "Aggregates must be verifiable."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
      - {id: ST-78, section: "8785", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "aggregate-sum test"}
  - id: REQ-QUOTA-008
    area: QUOTA
    statement: "Turning enforcement on in production MUST be preceded by a load test of the mint path with enforcement enabled, on the state driver that the installation uses."
    rationale: "Enforcement adds state writes to the hot path."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [1144]
    verification:
      - {kind: integration-test, ref: "load test"}
  - id: REQ-QUOTA-013
    area: QUOTA
    statement: "An operator MAY lower a declared quota limit on the console as a tighten-only change."
    rationale: "A fast brake on abuse must not wait for a deployment."
    level: MAY
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [915, 960]
    verification:
      - {kind: integration-test, ref: "quota limit tighten test"}
  - id: REQ-QUOTA-014
    area: QUOTA
    statement: "`Admit` MUST reserve the requested amount with a time to live that the rule declares, five minutes by default."
    rationale: "Usage is reserved before work and settled after it."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "reservation test"}
  - id: REQ-QUOTA-015
    area: QUOTA
    statement: "A reservation that is neither confirmed nor cancelled MUST be released when it expires and counted in the meters as expired."
    rationale: "An honest crash costs nothing, and abuse shows in the expired count."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "expired reservation test"}
  - id: REQ-QUOTA-016
    area: QUOTA
    statement: "`Confirm` MUST settle no more than the reserved amount unless the rule allows overage."
    rationale: "A reservation bounds what a confirmation may charge."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "confirm bound test"}
  - id: REQ-QUOTA-017
    area: QUOTA
    statement: "Quota MUST remember a request identifier for 24 hours, scoped to the calling client and the method."
    rationale: "A short window keeps the state small on the hot path."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards:
      - {id: NC-15, section: "Idempotency-Key", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "request id window test"}
  - id: REQ-QUOTA-018
    area: QUOTA
    statement: "After a restore quota MUST rebuild the request identifiers of the last 24 hours from the audit log."
    rationale: "A retry that straddles a restore must still count once."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: NC-15, section: "Idempotency-Key", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "request id rebuild after restore test"}
    superseded_by: [REQ-QUOTA-030]
  - id: REQ-QUOTA-019
    area: QUOTA
    statement: "`entry` MUST copy an `Idempotency-Key` header into the request identifier field and refuse a request whose header and field differ."
    rationale: "The field is canonical because a header does not survive every transport."
    level: MUST
    source: standard
    status: planned
    runtimes: all
    standards:
      - {id: NC-15, section: "Idempotency-Key", depth: Full}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "header mapping test"}
  - id: REQ-QUOTA-020
    area: QUOTA
    statement: "Quota amounts MUST be signed 64-bit integers in a unit declared per meter and per balance."
    rationale: "Integer arithmetic is exact on every store."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "amount representation test"}
  - id: REQ-QUOTA-021
    area: QUOTA
    statement: "`TopUp` MUST accept positive amounts only, from declared clients whose policy allows `quota.topup` on that balance."
    rationale: "A credential that can add credit must not be able to drain a balance."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards:
      - {id: NC-12, section: "1", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "top-up sign and grant test"}
  - id: REQ-QUOTA-022
    area: QUOTA
    statement: "A balance correction MUST be an `Adjust` call with a reason, allowed only to a declared client or to an operator with step-up."
    rationale: "Corrections are rare, explained and visible."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "adjust grant test"}
  - id: REQ-QUOTA-023
    area: QUOTA
    statement: "A refund MUST be an `Adjust` that names a confirmed event, bounded by that event's amount and refused for an event already refunded."
    rationale: "A refund traces to what it refunds and cannot exceed it."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "refund bound test"}
  - id: REQ-QUOTA-024
    area: QUOTA
    statement: "An application audit record MUST NOT carry an effect on a balance."
    rationale: "Only quota changes balances, under its compare-and-set, and roll-forward reads one kind of record."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "catalogue balance effect test"}
    superseded_by: [REQ-QUOTA-029]
  - id: REQ-QUOTA-025
    area: QUOTA
    statement: "A quota balance MUST belong to an account issued under a declared plan template and be keyed by boundary, company, account and meter."
    rationale: "Per-customer billing and per-client caps fit one model, and keys carry no personal data."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "account key test"}
  - id: REQ-QUOTA-026
    area: QUOTA
    statement: "`sluis config check` MUST refuse an enforcing quota rule that does not declare both its exhaustion and its unavailability behaviour."
    rationale: "Every risk choice is explicit and reviewed."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "config-check quota rule test"}
  - id: REQ-QUOTA-027
    area: QUOTA
    statement: "An enforcing quota rule MUST use strict enforcement."
    rationale: "Strict is the one mode built and proven first; soft enforcement comes when a load test shows the need."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "strict-only configuration test"}
  - id: REQ-QUOTA-028
    area: QUOTA
    statement: "A quota limit MUST be either a rate, as a token bucket per second or per minute, or a cap per calendar day or month in UTC."
    rationale: "Rates cover bursts and calendar caps match invoices."
    level: MUST
    source: stakeholder-integrator
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "limit kinds test"}
  - id: REQ-QUOTA-029
    area: QUOTA
    statement: "A balance effect MUST be written only as a usage event of a message that `quota` emits, never in an audit record."
    rationale: "Only quota changes balances, under its compare-and-set, and roll-forward reads one log."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-100, section: "1.0.2", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "catalogue balance effect test"}
  - id: REQ-QUOTA-030
    area: QUOTA
    statement: "After a restore quota MUST rebuild the request identifiers of the last 24 hours from the usage log."
    rationale: "A retry that straddles a restore must still count once."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: NC-15, section: "Idempotency-Key", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "request id rebuild from the usage log test"}
  - id: REQ-QUOTA-031
    area: QUOTA
    statement: "After a restore quota MUST roll its balances forward from the usage log."
    rationale: "No top-up or adjustment that reached the log is lost."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-100, section: "1.0.2", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "balance roll-forward from the usage log test"}
  - id: REQ-QUOTA-032
    area: QUOTA
    statement: "Quota MUST derive its meters and hourly aggregates from the usage log."
    rationale: "Meters cost nothing on the hot path and can always be rebuilt from the facts."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-100, section: "1.0.2", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "meter rebuild from the usage log test"}
  - id: REQ-QUOTA-033
    area: QUOTA
    statement: "The finance export derived from the usage log SHOULD use the column names of FinOps FOCUS for the usage it reports."
    rationale: "A billing system that reads FOCUS reads sluis usage with little mapping."
    level: SHOULD
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-115, section: "1.4", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "finance export columns test"}
  - id: REQ-QUOTA-034
    area: QUOTA
    statement: "A retried call that carries a remembered request identifier MUST send the message of its first attempt again, not a new one."
    rationale: "The writer removes the duplicate by message id, so a retried call has one usage event and changes a balance once."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: NC-15, section: "Idempotency-Key", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "retried call reuses its message test"}
  - id: REQ-QUOTA-035
    area: QUOTA
    statement: "Quota MUST store the message of a call in its state in the same atomic batch as the change the call makes."
    rationale: "A crash between the change and the send then leaves the message to be sent, not a balance change with no usage event."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "crash between change and send test"}
  - id: REQ-QUOTA-036
    area: QUOTA
    statement: "When a billing period closes, quota MUST write a statement for each billing account as an entry of the usage log, naming the checkpoint of the usage log that it was computed from."
    rationale: "A statement in the log is portable evidence that survives the exit of the company (ADR 0032)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "close a period: the statement entry is in the usage log, and its digest in the envelope matches the statement"}
  - id: REQ-QUOTA-037
    area: QUOTA
    split_from: REQ-QUOTA-036
    statement: "A statement MUST name, for each usage log it was computed from, the checkpoint and the range of entries it covers."
    rationale: "A reader can recompute the statement from exactly what it covers."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "statement sources test"}
  - id: REQ-QUOTA-038
    area: QUOTA
    split_from: REQ-QUOTA-036
    statement: "Quota MUST append the statement of a period only if none exists for its boundary, account and period."
    rationale: "A statement that never changes can be signed, stored and disputed."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "statement appended once test"}
  - id: REQ-QUOTA-039
    area: QUOTA
    statement: "Quota MUST count an event whose own period is closed in the earliest open period."
    rationale: "A late event is billed and not lost."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "late event counted test"}
  - id: REQ-QUOTA-040
    area: QUOTA
    split_from: REQ-QUOTA-039
    statement: "Quota MUST flag an event that it counts in a later period than its own with the period it belongs to."
    rationale: "A late event is visible on the statement."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "late event flag names its period test"}
  - id: REQ-QUOTA-041
    area: QUOTA
    statement: "A correction to a closed period MUST be made as an `Adjust` in an open period."
    rationale: "A closed statement is never rewritten or reopened."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "correction through Adjust test"}
  - id: REQ-QUOTA-042
    area: QUOTA
    statement: "Quota MUST NOT close a period while an event of that period waits in its outbox."
    rationale: "A statement computed before the outbox drains would miss usage."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "close deferred by outbox test"}
  - id: REQ-QUOTA-043
    area: QUOTA
    statement: "Recomputing a statement from the checkpoints and entry ranges it names MUST give the same canonical bytes."
    rationale: "A changed statement is detected."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-78, section: "8785", depth: Partial}
    issues: [915]
    verification:
      - {kind: test-vectors, ref: "statement recomputation vectors"}
  - id: REQ-QUOTA-044
    area: QUOTA
    statement: "Quota MUST serve a closed statement on a pull call authorised per account, as canonical JSON with the inclusion proof of its entry."
    rationale: "Billing pulls at its own pace and holds the only credential."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "statement pull and authorisation test"}
  - id: REQ-QUOTA-045
    area: QUOTA
    statement: "A statement MUST NOT carry personal data or free text."
    rationale: "A statement survives the shredding of a company's audit key."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "statement content scan test"}
  - id: REQ-QUOTA-046
    area: QUOTA
    statement: "Quota MUST NOT create or change a plan template at run time."
    rationale: "Plans are declared authority, reviewed in git."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "plan template declared only test"}
  - id: REQ-QUOTA-047
    area: QUOTA
    statement: "Quota MUST create an account only on a `CreateAccount` call from a declared client whose delegation allows `quota.account.create` for the named plan."
    rationale: "An account is issued under a declared template by a declared client."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: NC-12, section: "1", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "account creation grant test"}
  - id: REQ-QUOTA-048
    area: QUOTA
    statement: "`CreateAccount` MUST return the existing account when the id, the company and the plan are the same."
    rationale: "A retried creation counts once."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "account creation idempotency test"}
  - id: REQ-QUOTA-049
    area: QUOTA
    split_from: REQ-QUOTA-048
    statement: "`CreateAccount` MUST refuse an id that exists with another plan or another company."
    rationale: "A conflicting creation is visible."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "account creation conflict test"}
  - id: REQ-QUOTA-050
    area: QUOTA
    statement: "Quota MUST refuse `Admit`, `Confirm`, `Cancel`, `TopUp` and `Adjust` on an account that does not exist."
    rationale: "A typo or a hostile caller must not open an account."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "unknown account refused test"}
  - id: REQ-QUOTA-051
    area: QUOTA
    statement: "After a restore quota MUST roll its accounts forward from the usage log."
    rationale: "No account that reached the log is lost."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-100, section: "1.0.2", depth: Partial}
    issues: [915]
    verification:
      - {kind: integration-test, ref: "account roll-forward from the usage log test"}
  - id: REQ-QUOTA-052
    area: QUOTA
    statement: "Quota MUST refuse a configuration reload that removes a plan template which an account uses."
    rationale: "An account must not lose its limits by a reload."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "plan removal reload test"}
  - id: REQ-QUOTA-053
    area: QUOTA
    statement: "A closed account MUST refuse `Admit`."
    rationale: "A closed account takes no new usage."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "closed account test"}
  - id: REQ-QUOTA-054
    area: QUOTA
    statement: "The quota front MUST authenticate a calling service by its X.509-SVID over mutual TLS against the trust bundle that the installation declares."
    rationale: "The certificate is the credential of a service, and no token is exchanged per call."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-109, section: "1", depth: Partial}
      - {id: ST-19, section: "1", depth: Partial}
    issues: [1026]
    verification:
      - {kind: integration-test, ref: "service call authentication test"}
  - id: REQ-QUOTA-055
    area: QUOTA
    statement: "Quota MUST ask `policy` to authorise every call with the caller's identity, the action and the account, with its company, plan and state, as the resource."
    rationale: "A service acts only on the accounts its policy names."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: NC-12, section: "1", depth: Partial}
    issues: [1026]
    verification:
      - {kind: integration-test, ref: "per-account authorisation test"}
  - id: REQ-QUOTA-056
    area: QUOTA
    statement: "Quota MUST NOT reuse a grant for the same caller, action and account for longer than 60 seconds."
    rationale: "A suspended or closed account stops admitting within a minute."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1026]
    verification:
      - {kind: integration-test, ref: "grant reuse ceiling test"}
  - id: REQ-QUOTA-057
    area: QUOTA
    statement: "The quota front MUST accept a person only with an exchanged token for its audience that is valid for at most 5 minutes and bound to the caller's X.509-SVID."
    rationale: "A person's call is as short-lived and as bound as the audit front's."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "1", depth: Partial}
      - {id: ST-19, section: "1", depth: Partial}
    issues: [1026]
    verification:
      - {kind: integration-test, ref: "person token test"}
  - id: REQ-QUOTA-058
    area: QUOTA
    statement: "The quota front MUST keep accepting calls from services whose certificates are valid while the issuer is unreachable."
    rationale: "The hot path does not depend on the issuer."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1026]
    verification:
      - {kind: integration-test, ref: "issuer outage test"}
  - id: REQ-QUOTA-059
    area: QUOTA
    statement: "`sluis config check` MUST refuse a `session` or `console` actor in an installation that runs only the Quota piece."
    rationale: "A quota installation has no browser surface until a consumer needs one."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1026]
    verification:
      - {kind: integration-test, ref: "config-check quota installation test"}
  - id: REQ-QUOTA-060
    area: QUOTA
    statement: "The action table entry of an emitting product MUST declare, for every meter, its name, unit and kind, and for a gauge how its samples combine over a period."
    rationale: "A meter means the same thing to every reader."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [841]
    verification:
      - {kind: integration-test, ref: "meter declaration schema test"}
  - id: REQ-QUOTA-061
    area: QUOTA
    statement: "The emitter library MUST add a usage part to a message only for an outcome that the meter declares, `success` by default."
    rationale: "A refused or failed call is audited and not billed unless its table says so."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [841]
    verification:
      - {kind: integration-test, ref: "billable outcome test"}
  - id: REQ-QUOTA-062
    area: QUOTA
    statement: "CI MUST fail when a release renames a meter, or changes its unit or kind, without retiring the old one."
    rationale: "A renamed meter is a new meter, and old events keep their meaning."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [841]
    verification:
      - {kind: integration-test, ref: "meter table comparison test"}
  - id: REQ-QUOTA-063
    area: QUOTA
    statement: "Quota MUST assign a usage event to the period of its CloudEvents `time` when that time is not earlier than the recorded time by more than the close grace and not later by more than 5 minutes, and otherwise to the period of the recorded time."
    rationale: "Statements and caps count the same events, and a wrong clock cannot move usage across periods."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-100, section: "1.0.2", depth: Partial}
    issues: [915]
    verification:
      - {kind: test-vectors, ref: "period assignment vectors"}
  - id: REQ-QUOTA-064
    area: QUOTA
    statement: "Quota MUST flag a usage event whose period was assigned from its recorded time as `time_adjusted`."
    rationale: "An event moved by the rule shows as moved."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "time adjusted flag test"}
  - id: REQ-QUOTA-065
    area: QUOTA
    statement: "Quota MUST merge the usage logs of a boundary by recorded time, keeping each log's own order and breaking ties by log id, when it rolls balances forward."
    rationale: "A floor and a once-only refund depend on the order of effects."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "roll-forward order across logs test"}
  - id: REQ-QUOTA-066
    area: QUOTA
    statement: "Quota MUST bound its outbox by count and by the age of its oldest message, with both bounds declared in the install file."
    rationale: "An effect that only the outbox holds is lost if the state is lost."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "outbox bound test"}
  - id: REQ-QUOTA-067
    area: QUOTA
    split_from: REQ-QUOTA-066
    statement: "When its outbox reaches a bound, quota MUST refuse changing calls as unavailable."
    rationale: "Admission stops before an effect can be lost."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "outbox full test"}
  - id: REQ-QUOTA-068
    area: QUOTA
    split_from: REQ-QUOTA-066
    statement: "When its outbox is at a bound, quota MUST keep serving reads."
    rationale: "An operator and a billing system can still see the balances while changes are refused."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "reads with a full outbox test"}
  - id: REQ-QUOTA-069
    area: QUOTA
    statement: "Quota MUST raise an alarm when its outbox passes the declared warning level."
    rationale: "An operator sees a writer outage building up before it stops admission."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "outbox alarm test"}
  - id: REQ-QUOTA-070
    area: QUOTA
    statement: "After a restore, quota MUST refuse `Admit` on an enforcing balance as unavailable until the longest reservation time to live in force has passed."
    rationale: "The reservations forgotten by the restore must not let the limit be exceeded."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "quiet window after restore test"}
  - id: REQ-QUOTA-071
    area: QUOTA
    split_from: REQ-QUOTA-070
    statement: "Within the quiet window after a restore, quota MUST handle a `Confirm` for a reservation it does not know as an `Admit` and a `Confirm` in one step under the strict check."
    rationale: "Work that was admitted before the restore is still charged, and the limit still holds."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: integration-test, ref: "confirm of an unknown reservation test"}
