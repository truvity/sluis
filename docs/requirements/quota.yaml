# QUOTA: Limits. The limit check and its counters (ADR 0046). The withdrawn rows of the old quota and metering area are in archive/quota.yaml.
schema: 1
area: QUOTA
requirements:
  - id: REQ-QUOTA-060
    area: QUOTA
    statement: "A Meter config document MUST declare the name, unit and kind of every meter, and for a gauge how its samples combine over a period."
    rationale: "A meter means the same thing to every reader."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    runtimes: all
    standards: []
    issues: [841]
    verification:
      - {kind: integration-test, ref: "meter declaration schema test"}
  - id: REQ-QUOTA-061
    area: QUOTA
    statement: "The emitter library MUST add a usage part to a message only for an outcome that the meter declares, `success` by default."
    rationale: "A refused or failed call is audited and not billed unless its table says so."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    runtimes: all
    standards: []
    issues: [841]
    verification:
      - {kind: integration-test, ref: "billable outcome test"}
  - id: REQ-QUOTA-062
    area: QUOTA
    statement: "CI MUST fail when a release renames a meter, or changes its unit or kind, without retiring the old one."
    rationale: "A renamed meter is a new meter, and old events keep their meaning."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    runtimes: all
    standards: []
    issues: [841]
    verification:
      - {kind: integration-test, ref: "meter table comparison test"}
  - id: REQ-QUOTA-095
    area: QUOTA
    statement: "sluis MUST NOT hold a price, close a period or run a finance export."
    rationale: "The product owns plans, prices and money, and sluis gives evidence (ADR 0046)."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    runtimes: all
    standards: []
    issues: [915]
    verification:
      - {kind: manual, ref: "interface review: no limit-check or usage call or kind names a price, a plan, an account, a statement or a period"}
      - {kind: integration-test, ref: "no finance export job exists in the actor registry"}
  - id: REQ-QUOTA-097
    area: QUOTA
    statement: "sluis MUST check a limit on the request path against a counter of usage for the customer, the organisation and the product."
    rationale: "A limit needs a fast check beside the policy decision, while plans, prices and balances stay in the product (ADR 0046)."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    features: ["design"]
    runtimes: all
    standards: []
    verification:
      - {kind: integration-test, ref: "a request over the limit is refused and one under it is allowed, with the limit written by the product"}
  - id: REQ-QUOTA-098
    area: QUOTA
    statement: "sluis MUST answer a limit check with allow or refuse, beside the policy decision of the request."
    rationale: "The product writes the limit and sluis holds the counter, so the check is one more answer of the request path (ADR 0046)."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    runtimes: all
    standards: []
    issues: [1846]
    verification:
      - {kind: integration-test, ref: "a request under a limit that is reached is refused beside an allowed policy decision, and a request under a limit that is not reached is allowed"}
