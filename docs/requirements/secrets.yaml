# SECRETS: Secrets
schema: 1
area: SECRETS
requirements:
  - id: REQ-SECRETS-001
    area: SECRETS
    statement: "sluis MUST hold only its own secrets and its integrations' secrets."
    rationale: "A secrets product is out of scope; minting scoped credentials replaces storing others'."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [798]
    manual_reason: "The rule defines the product scope; a review confirms that no feature stores secrets for other parties."
    verification:
      - {kind: manual, ref: "scope review"}
  - id: REQ-SECRETS-005
    area: SECRETS
    split_from: REQ-SECRETS-001
    statement: "sluis MUST NOT offer a general-purpose secret store for other parties."
    rationale: "A secrets product is out of scope; minting scoped credentials replaces storing others'."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [798]
    verification:
      - {kind: manual, ref: "scope review"}
      - {kind: integration-test, ref: "no-general-store interface test"}
  - id: REQ-SECRETS-002
    area: SECRETS
    statement: "A secret that sluis holds MUST be a typed document with a schema."
    rationale: "Typed documents let consumers validate."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [798]
    verification:
      - {kind: test-vectors, ref: "JSON-Schema-Test-Suite"}
      - {kind: test-vectors, ref: "port suite secrets"}
  - id: REQ-SECRETS-006
    area: SECRETS
    split_from: REQ-SECRETS-002
    statement: "A breaking change to a secret document MUST use a new document version beside the old one."
    rationale: "Typed documents let consumers validate."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [798]
    verification:
      - {kind: test-vectors, ref: "port suite secrets"}
  - id: REQ-SECRETS-003
    area: SECRETS
    statement: "The secrets port MUST support rotation with a grace period."
    rationale: "A store with one version cannot rotate safely."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [798, 790]
    verification:
      - {kind: test-vectors, ref: "port suite secrets"}
  - id: REQ-SECRETS-007
    area: SECRETS
    split_from: REQ-SECRETS-003
    statement: "The secrets port MUST refuse to start on a store that keeps only one version."
    rationale: "A store with one version cannot rotate safely."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [798, 790]
    verification:
      - {kind: test-vectors, ref: "port suite secrets"}
  - id: REQ-SECRETS-004
    area: SECRETS
    statement: "A sealed-state driver SHOULD store secrets encrypted under a key held by the key driver."
    rationale: "Boards have no managed secrets service, and sealed state is allowed on every runtime when it is done properly."
    level: SHOULD
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-89, section: "6", depth: Partial}
    issues: [798]
    verification:
      - {kind: integration-test, ref: "sealed-state restore test"}
  - id: REQ-SECRETS-008
    area: SECRETS
    statement: "sluis SHOULD mint a scoped credential for a consumer rather than store a secret on the consumer's behalf."
    rationale: "Minting replaces storing other parties' secrets."
    level: SHOULD
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [798]
    verification:
      - {kind: manual, ref: "design review"}
  - id: REQ-SECRETS-009
    area: SECRETS
    statement: "sluis MUST NOT expose its transit, lease or dynamic-secret functions to other parties."
    rationale: "These functions belong to internal ports and would turn sluis into a general secrets product."
    level: MUST
    source: design-decision
    status: out-of-scope
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [798]
    verification:
      - {kind: manual, ref: "interface scan"}
      - {kind: integration-test, ref: "no-exposed-function test"}
  - id: REQ-SECRETS-010
    area: SECRETS
    statement: "A secret that only sluis uses MUST be stored under a namespace that is granted to no consumer."
    rationale: "A namespace boundary keeps internal secrets out of consumer reach."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [798]
    verification:
      - {kind: test-vectors, ref: "port suite secrets"}
  - id: REQ-SECRETS-011
    area: SECRETS
    statement: "A secret that is needed outside sluis MUST be stored as an exported document under a per-consumer path."
    rationale: "A per-consumer path lets the consumer be granted exactly one document."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [798]
    verification:
      - {kind: test-vectors, ref: "port suite secrets"}
      - {kind: test-vectors, ref: "port suite export"}
  - id: REQ-SECRETS-012
    area: SECRETS
    statement: "A sealed-state driver MUST seal secrets under a key that never leaves the key driver's hardware token or key service."
    rationale: "A sealed secret in state is only as safe as the sealing key."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: NC-10, section: "PIV", depth: Partial}
    issues: [798]
    verification:
      - {kind: integration-test, ref: "sealed-state restore test"}
      - {kind: integration-test, ref: "key-extraction negative test"}
