  - id: REQ-AUDIT-034
    area: AUDIT
    split_from: REQ-AUDIT-014
    statement: "The writer MUST deduplicate records by record identifier."
    rationale: "Networks duplicate; the log must not."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [802, 1121]
    verification:
      - {kind: integration-test, ref: "duplicate delivery test"}
  - id: REQ-AUDIT-015
    area: AUDIT
    statement: "Credential issuance (a grant, a token signature, a PIN release, a successful sign-in, code, token or exchange) SHOULD fail when its record is not durable in the transport, and a tightening change (a revocation, a change of the signer's ring) does not wait for it."
    rationale: "An issuance without a record must not happen, every transport must answer a non-blocking emit only when the record is durable because session, exchange and the adapter rely on it, and a full spool must never block a revocation (ADR 0029)."
    level: SHOULD
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [1120, 802]
    tests: [actors/policy/tests/service.rs, actors/key/internal/keyd/start_test.go, actors/key/internal/keyd/pinrelease_test.go, actors/key/internal/keyd/declaration_test.go, actors/signer/tests/sign.rs, actors/session/internal/sessiond/token_test.go, actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: integration-test, ref: "blocked-write test: a grant, a signature, a PIN release, a token and an exchange are withheld when their fact is refused; a revocation and a change of the signer's ring stand"}
