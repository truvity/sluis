    standards:
      - {id: ST-114, section: "Event Log Activity", depth: Partial}
    issues: [839, 841]
    verification:
      - {kind: integration-test, ref: "audit export record test"}
  - id: REQ-AUDIT-122
    area: AUDIT
    statement: "A step-up of a session MUST be recorded as an Authentication Logon event with `is_mfa` true, the `session.uid` of the session and the `activity_name` \"Step-Up\"."
    rationale: "Authentication has no step-up activity, and the same session identifier joins the step-up to the sign-in it raises."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-114, section: "authentication", depth: Partial}
    issues: [841]
    verification:
      - {kind: integration-test, ref: "step-up record test"}
  - id: REQ-AUDIT-123
    area: AUDIT
    statement: "An issued certificate MUST be recorded in `unmapped.sluis.certificate` and not in the `certificate` object of the event."
    rationale: "In OCSF 1.9.0 the `certificate` object of Authentication is a certificate that was presented, not one that was issued."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-114, section: "certificate", depth: Partial}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "certificate issue record test"}
  - id: REQ-AUDIT-124
    area: AUDIT
    statement: "An audit record MUST NOT use the `delegation` object or declare the `ai_operation` profile."
    rationale: "`delegation` exists only for AI operations and carries identifiers only, so the actor chain of an exchange is `actor`, `user` and `unmapped.sluis.actor_chain`."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-114, section: "delegation", depth: Partial}
    issues: [1120]
    verification:
      - {kind: test-vectors, ref: "negative vector test over every record vector, in Go and Rust: no delegation object and no profile but security_control; OCSF schema validity is a different row"}
  - id: REQ-AUDIT-125
    area: AUDIT
    statement: "One log key per writer instance MUST sign the checkpoints of its project's audit log."
    rationale: "A writer's log has one audience and one lifetime, so a second key would add a policy and a slot for nothing (ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [914]
    tests: [actors/writer/internal/writerd/log_content_test.go]
    verification:
      - {kind: integration-test, ref: "every checkpoint is signed with the one audit-log key of key@ (TestEachWriterInstanceSignsItsCheckpointsWithItsOwnLogKey); one key per instance is key@ and has no test yet"}
  - id: REQ-AUDIT-167
    area: AUDIT
    split_from: REQ-AUDIT-125
    statement: "The log key of a writer instance MUST sign the checkpoints of its project's usage log as well as those of its audit log."
    rationale: "Both logs of a writer have one audience and one lifetime, so a second key would add a policy and a slot for nothing (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    runtimes: all
    standards: []
    issues: [914, 915]
    verification:
      - {kind: integration-test, ref: "the checkpoints of both log kinds of one writer verify against one public key, and those of two writers against two"}
  - id: REQ-AUDIT-126
    area: AUDIT
    statement: "Each signed batch head MUST name the log it belongs to, the audit log or the usage log."
    rationale: "With one log key, the name inside the signed head keeps a head of one log from being passed off as a head of the other."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    runtimes: all
    standards:
      - {id: ST-75, section: "1", depth: Partial}
    issues: [914, 915]
    verification:
      - {kind: test-vectors, ref: "a checkpoint of the usage log presented as a checkpoint of the audit log; refused"}
  - id: REQ-AUDIT-127
    area: AUDIT
    statement: "A pseudonym MUST be computed by key@ with Mac, HMAC-SHA384, under the tenant's pseudonym data key of its epoch."
    rationale: "A keyed function cannot be reversed from a list of subjects without the key (ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards:
      - {id: NC-06, section: "HMAC", depth: Partial}
    issues: [1120]
    tests: [actors/key/internal/keyd/mac_vectors_test.go]
    verification:
      - {kind: integration-test, ref: "pseudonym test vectors: the HMAC-SHA384 of Mac under the pseudonym key of the tenant and the epoch; no tenant, a bad epoch or a caller with no rule gets none"}
  - id: REQ-AUDIT-128
    area: AUDIT
    statement: "An emitter MUST replace a subject with its pseudonym before the record leaves the emitting process."
    rationale: "No transport, spool or writer then holds a raw subject (ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: NC-06, section: "HMAC", depth: Partial}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "spool and transport scan for raw subjects"}
  - id: REQ-AUDIT-129
    area: AUDIT
    statement: "The pseudonym key of a tenant MUST start a new epoch at the start of every UTC month."
    rationale: "Pseudonyms rotate so the operator's view links a person within a month only (REQ-AUDIT-038, ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: NC-06, section: "HMAC", depth: Partial}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "epoch change test with a moved clock"}
  - id: REQ-AUDIT-130
    area: AUDIT
    statement: "The reader MUST refuse to reverse a pseudonym for anyone without the tenant's reversal permission."
    rationale: "Only the tenant's own audit role may link a pseudonym to a subject (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: NC-06, section: "HMAC", depth: Partial}
    issues: [839]
    verification:
      - {kind: integration-test, ref: "reversal by the installation operator; refused"}
  - id: REQ-AUDIT-131
    area: AUDIT
    statement: "Every reversal of a pseudonym MUST produce an audit record under the asking person's name."
    rationale: "A reversal is a use of personal data that must be visible (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: NC-06, section: "HMAC", depth: Partial}
    issues: [839]
    verification:
      - {kind: integration-test, ref: "reversal audit record test"}
  - id: REQ-AUDIT-132
    area: AUDIT
    statement: "A usage event MUST NOT carry a field that holds personal data."
    rationale: "Usage facts outlive the tenant's personal data, so they must hold none (ADR 0030)."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    runtimes: all
    standards: []
    issues: [837, 915]
    verification:
      - {kind: test-vectors, ref: "a usage part with a pseudonym, a subject or free text is refused by the writer"}
  - id: REQ-AUDIT-133
    area: AUDIT
    statement: "A company's usage data key MUST be a different key from its audit data key."
    rationale: "Keys with different lifetimes are not shared (ADR 0029)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [837]
    superseded_by: [REQ-AUDIT-150]
    verification:
      - {kind: integration-test, ref: "the audit key does not decrypt a usage entry, and the usage key does not decrypt an audit entry"}
  - id: REQ-AUDIT-134
    area: AUDIT
    statement: "Shredding a company's audit data key MUST NOT delete its usage data key."
    rationale: "Exit ends the personal data and keeps the evidence (ADR 0029)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [837, 973]
    superseded_by: [REQ-KEYS-036, REQ-KEYS-037, REQ-AUDIT-150]
    verification:
      - {kind: integration-test, ref: "after a shred the usage entries of the company are still readable by quota"}
  - id: REQ-AUDIT-135
    area: AUDIT
    statement: "A company's usage data key MUST be kept until the declared retention of the usage log ends for that company's entries."
    rationale: "A bill can be disputed until the billing retention ends (ADR 0029)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [837, 1016]
    superseded_by: [REQ-KEYS-037]
    verification:
      - {kind: integration-test, ref: "a deletion of a usage key before its retention ends is refused"}
  - id: REQ-AUDIT-136
    area: AUDIT
    statement: "sluis config check MUST refuse, in a production boundary, a log retention below the floor of the compliance profile that the project declares in AuditLog, naming the profile."
    rationale: "A profile is a floor that the installation must not go below (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [840]
    verification:
      - {kind: test-vectors, ref: "installations with a retention below each profile floor"}
  - id: REQ-AUDIT-137
    area: AUDIT
    statement: "sluis config check MUST refuse, in a production boundary, a lock mode below the floor of the compliance profile that the project declares in AuditLog unless the witness that the profile allows in its place is declared."
    rationale: "A profile that demands an immutable log must not run on a removable one unwitnessed (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [840]
    verification:
      - {kind: test-vectors, ref: "installations with a lock below each profile floor"}
  - id: REQ-AUDIT-138
    area: AUDIT
    statement: "A transition of an audit object to a colder storage class MUST NOT change the object's lock or retention."
    rationale: "A tier saves cost and must never shorten evidence (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [851, 837]
    verification:
      - {kind: conformance-suite, ref: "blob suite: a transitioned locked object keeps its lock"}
  - id: REQ-AUDIT-139
    area: AUDIT
    statement: "The checkpoints, the partial tiles and the hash tiles above level 0 of an audit log MUST stay in the hot storage class."
    rationale: "A proof and the newest entries must never wait for a retrieval (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "the rendered lifecycle rule names only entry bundles and level-0 tiles"}
  - id: REQ-AUDIT-140
    area: AUDIT
    statement: "The audit reader MUST answer a read of an object in a cold storage class with a pending state, not by holding the request until the retrieval ends."
    rationale: "A request must not hang for hours on an archive (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "a read of a cold object"}

  # ---- projects, evidence keys and access (decisions 0028 and 0029)
  - id: REQ-AUDIT-141
    area: AUDIT
    statement: "A project's writer MUST write only its own project's bucket and sign only with its own log key."
    rationale: "A flaw in one project's writer then cannot write or sign for another (ADR 0029)."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: partly-built
    runtimes: all
    actors: [writer]
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "the writer of project A attempts a put to project B's bucket and a sign with project B's log key; both refused"}
  - id: REQ-AUDIT-142
    area: AUDIT
    statement: "An audit piece MUST NOT write the billing prefix of a project's bucket."
    rationale: "The billing log is the product's and sluis neither builds nor reads it (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    runtimes: all
    actors: [writer]
    standards: []
    issues: [837, 915]
    verification:
      - {kind: integration-test, ref: "the credentials of every audit piece hold no write action on the billing prefix"}
  - id: REQ-AUDIT-143
    area: AUDIT
    statement: "Every credential that reaches a project's bucket MUST be scoped to that bucket and, for a person's direct read, to the prefixes of the log kinds that person was granted."
    rationale: "The blob store's own access control is the second of two independent checks on audit access (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [837, 985]
    verification:
      - {kind: integration-test, ref: "a person granted usage reads usage/ and is refused audit/ and billing/ by the bucket policy"}
  - id: REQ-AUDIT-144
    area: AUDIT
    statement: "The reader MUST serve a call only under a grant that covers the call's project, log kind and tenant."
    rationale: "Cedar decides every call on project, log kind and tenant, and the grant is a mandatory filter of the query (ADR 0028, ADR 0007)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [reader]
    standards: []
    issues: [839]
    verification:
      - {kind: integration-test, ref: "a search under a grant for tenant A returns no record of tenant B; a call naming another project is refused"}
  - id: REQ-AUDIT-145
    area: AUDIT
    statement: "The search index MUST be partitioned by project and log kind."
    rationale: "A partition is a boundary the index itself enforces, apart from the grant (ADR 0028)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [indexer]
    standards: []
    issues: [839]
    verification:
      - {kind: integration-test, ref: "a query in one partition never returns a row of another"}
  - id: REQ-AUDIT-146
    area: AUDIT
    statement: "The writer MUST refuse a record whose release has no published AuditCatalogue."
    rationale: "The release identifies the action table, so a log needs no copy of it, and a record of an unknown release cannot be validated (ADR 0030)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    actors: [writer]
    standards: []
    issues: [1121, 1120]
    verification:
      - {kind: integration-test, ref: "a record from a release whose catalogue is not published is quarantined"}
  - id: REQ-AUDIT-147
    area: AUDIT
    statement: "The build MUST publish the AuditCatalogue document of a release, together with its schemas, before that release emits."
    rationale: "A product release then needs no writer upgrade (ADR 0030)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "a release pipeline run publishes the catalogue document and the writer validates the first record of the release"}
  - id: REQ-AUDIT-148
    area: AUDIT
    statement: "The writer MUST refuse a record whose metadata.product.name its project does not declare."
    rationale: "A project's log must hold only the records of the product that the AuditLog declares for it (ADR 0030)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [writer]
    standards: []
    issues: [1121]
    tests:
      - actors/writer/internal/writerd/product_test.go
    verification:
      - {kind: integration-test, ref: "a record naming a product the project does not declare is refused"}
  - id: REQ-AUDIT-149
    area: AUDIT
    statement: "The audit pieces MUST read AuditLog, AuditWitnesses and AuditCatalogue through the data port as config kinds that store@ loads and verifies."
    rationale: "Under the foundation audit already depends on store@, so a loader of its own buys no independence (ADR 0028)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "an audit piece starts with a changed AuditLog and receives it from store@ on the snapshot swap"}
  - id: REQ-AUDIT-150
    area: AUDIT
    statement: "The writer MUST have key@ seal every audit entry under the tenant's evidence key and never under its data key."
    rationale: "Evidence never shares a key with personal data and outlives it, so an exit deletes everything personal and keeps the evidence (ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [writer]
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "the data key of the tenant does not open an entry; the evidence key does"}
      - {kind: integration-test, ref: "after the tenant's exit the entries still open under the evidence key until the evidence retention ends (the exit is REQ-KEYS-036, the retention end REQ-KEYS-037: not built)"}
  - id: REQ-AUDIT-168
    area: AUDIT
    split_from: REQ-AUDIT-150
    statement: "The writer MUST have key@ seal every usage entry under the tenant's evidence key and never under its data key."
    rationale: "Evidence never shares a key with personal data and outlives it, so an exit deletes everything personal and keeps the evidence (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    runtimes: all
    actors: [writer]
    standards: []
    issues: [837, 915]
    verification:
      - {kind: integration-test, ref: "the data key of the tenant does not open a usage entry; the evidence key does"}
      - {kind: integration-test, ref: "after the tenant's exit the usage entries still open under the evidence key until the evidence retention ends"}
  - id: REQ-AUDIT-159
    area: AUDIT
    statement: "The writer MUST ask `policy` for a grant for each batch of one tenant's records before key@ seals the batch."
    rationale: "No caller brings a grant to the writer, so it asks for its own and key@ checks it like any other (ADR 0029, ADR 0007)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [writer]
    standards: []
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "a batch sealed without a grant, or with a grant for another tenant, is refused at key@"}
  - id: REQ-AUDIT-160
    area: AUDIT
    statement: "The indexer MUST open a record at key@ only under a grant that it asked `policy` for and holds only while it is live."
    rationale: "The indexer runs with no caller, so it asks for its own grant and keeps it only for its life, and it may open and never seal (ADR 0028, ADR 0007)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [indexer]
    standards: []
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "an indexer pass with an expired grant, or with none, opens nothing; a Seal by the indexer is refused"}
  - id: REQ-AUDIT-151
    area: AUDIT
    statement: "The key@ rules MUST let the writer Seal under the evidence key and give it no Open."
    rationale: "A writer that cannot decrypt what it wrote holds nothing to leak (ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [837]
    tests:
      - kits/go/registry/registry_test.go
      - actors/key/internal/keyd/auditlog_evidence_test.go
    verification:
      - {kind: test-vectors, ref: "the generated key rules matrix: writer has seal on evidence and no open"}
      - {kind: integration-test, ref: "the writer asks key@ to Open an entry; refused"}
  - id: REQ-AUDIT-152
    area: AUDIT
    statement: "A record that concerns no tenant MUST be sealed under the evidence key of the operator's own tenant."
    rationale: "Every sealed entry has a tenant key, and the operator's company is a tenant (ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [writer]
    standards: []
    issues: [1218]
    verification:
      - {kind: integration-test, ref: "a machine-plane record is sealed under the operator tenant's evidence key"}
  - id: REQ-AUDIT-153
    area: AUDIT
    statement: "An actor that opens an entry MUST check that the clear envelope agrees with the record."
    rationale: "A writer that lies in the envelope is then caught by the first reader that opens the record (ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [indexer, reader]
    standards: []
    issues: [1218]
    verification:
      - {kind: test-vectors, ref: "table test in the indexer: an envelope that differs from the record in one field each (seven fields and the boundary) is refused; in the reader, such an entry is not returned"}
  - id: REQ-AUDIT-154
    area: AUDIT
    statement: "In audit alone a record for a tenant the boundary does not know MUST be held in the transport and raise an alarm."
    rationale: "A mistyped tenant id must never create a tenant (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [writer]
    standards: []
    issues: [1218]
    verification:
      - {kind: integration-test, ref: "a record for an unpushed tenant stays in the queue and an alarm is raised; after the push it is written"}
  - id: REQ-AUDIT-155
    area: AUDIT
    statement: "In audit alone the reader MUST verify a search token against the issuer that config declares as the trusted token source."
    rationale: "Policy decides from the token's claims, so the token's source must be one the operator chose (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [reader]
    standards: []
    issues: [1218]
    verification:
      - {kind: integration-test, ref: "a token from an undeclared issuer is refused; one from the declared issuer yields a grant"}
  - id: REQ-AUDIT-156
    area: AUDIT
    statement: "In audit alone the push of a tenant by a product MUST be idempotent by request id."
    rationale: "A product retries a push until it succeeds, and a repeat must change nothing (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1218]
    verification:
      - {kind: integration-test, ref: "the same push twice creates one tenant and one set of data keys"}

  # ---- the time of a usage fact (decision 0040)
  - id: REQ-AUDIT-157
    area: AUDIT
    statement: "A usage fact MUST count at its time of use when that time is not earlier than the recorded time by more than 72 hours and not later by more than 5 minutes, and otherwise at its recorded time."
    rationale: "A wrong clock, or a replay of old events, cannot place usage in a span it was not used in (ADR 0040)."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    runtimes: all
    standards: []
    issues: [841, 915]
    verification:
      - {kind: test-vectors, ref: "time rule vectors at 72 hours back, 5 minutes forward and one second beyond each"}
  - id: REQ-AUDIT-158
    area: AUDIT
    statement: "A reader MUST mark a fact that it counts at its recorded time as time_adjusted."
    rationale: "A fact moved by the rule shows as moved (ADR 0040)."
    level: MUST
    source: design-decision
    status: planned
    milestone: quota
    runtimes: all
    standards: []
    issues: [841, 915]
    verification:
      - {kind: integration-test, ref: "a fact outside the bounds is counted at its recorded time and flagged"}
  - id: REQ-AUDIT-161
    area: AUDIT
    statement: "An actor MUST audit every call except an answered health or readiness probe."
    rationale: "A probe reads and changes nothing, and auditing it grows the log with no callers; a probe that is refused is a real call and stays audited (ADR 0030)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [841]
    verification:
      - {kind: integration-test, ref: "an idle installation writes no audit entry; one real call, a refused one included, writes one (entry: a_health_probe_is_not_audited_and_a_real_call_is)"}
  - id: REQ-AUDIT-162
    area: AUDIT
    statement: "A health or readiness probe MUST NOT make another actor write an audit record."
    rationale: "A probe that calls a second actor, or provokes one of its refusals, moves the growth of the log there (ADR 0030)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [841]
    verification:
      - {kind: integration-test, ref: "an installation whose probes run for a minute writes no audit entry at any actor (a_health_probe_is_not_audited_and_a_real_call_is covers entry only)"}
  - id: REQ-AUDIT-163
    area: AUDIT
    statement: "sluis audit verify MUST accept more than one log key, each with the checkpoint size from which it applies."
    rationale: "A replaced log key must verify the history it signed up to the last size a witness cosigned, and the new key after it (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a log with a key-change record: the old key verifies up to the cut-off size and fails after it, and the new key verifies after it"}
  - id: REQ-AUDIT-164
    area: AUDIT
    statement: "A suspected compromise of a tenant's pseudonym key MUST start a new epoch at once."
    rationale: "Until now only prose says so, and the thief must not link new records (ADR 0029, ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "declare the pseudonym key in the middle of a month: the next record uses a new epoch and older records keep their pseudonyms"}
  - id: REQ-AUDIT-165
    area: AUDIT
    statement: "An audit record of a change across tenants MUST name the person by the source tenant's pseudonym of its own subject in the source's log, and by the owner's pseudonym of the vendor account in the owner's log."
    rationale: "Each tenant's reversal role then works on its own log, and neither log carries the other tenant's personal data beyond the minimal reference (ADR 0026, ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1220]
    verification:
      - {kind: integration-test, ref: "one change across tenants: the source's role reverses its record to the subject, the owner's role reverses its record to the account id, and neither holds a name or address"}
  - id: REQ-AUDIT-169
    area: AUDIT
    statement: "Every request of a blob driver MUST have a bounded duration for each attempt and a bounded number of attempts."
    rationale: "A blob call with no bound can pass the start-up limit of a function on one slow answer, and the worst case of an operation must be known (ADR 0028)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [writer, witness, indexer, reader]
    standards: []
    features: ["parity"]
    verification:
      - {kind: conformance-suite, ref: "the blob port suite runs a fake that stalls during connect, during the headers and in the middle of the body; the call fails within the attempts times the timeout plus the back-off"}
  - id: REQ-AUDIT-170
    area: AUDIT
    statement: "The writer SHOULD log each phase of its start-up with the duration of the phase."
    rationale: "A start-up that is slow, or near the limit of a function, shows which phase takes the time only if each phase is timed (ADR 0028)."
    level: SHOULD
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: all
    actors: [writer]
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "a start of the writer logs one line for each phase of Init and recover with its duration"}
  - id: REQ-AUDIT-171
    area: AUDIT
    statement: "For an AWS S3 blob destination, `sluis config check` MUST report a bucket whose policy lacks a statement that denies s3:BypassGovernanceRetention, s3:DeleteObjectVersion and s3:PutBucketObjectLockConfiguration to every principal except the roles in the break-glass list of the destination (ADR 0029)."
    rationale: "A bucket that sluis does not own is open to any role of the account with a broad allow unless its policy denies these actions, and sluis renders the lifecycle rule and applies none of the rest (ADR 0029)."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a config check against a fake S3 control plane reports a policy without the guard, and accepts a policy with it"}
  - id: REQ-AUDIT-172
    area: AUDIT
    statement: "`sluis config check` MUST refuse a production installation whose S3 blob destination lacks the guard of the bucket policy when the blob destination sets its bucket guard to require (ADR 0029)."
    rationale: "The report alone does not stop an installation from going live without the protection (ADR 0029)."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "with the guard required, a bucket without it is refused for a production boundary and only reported for any other"}
  - id: REQ-AUDIT-173
    area: AUDIT
    statement: "`sluis config check` MUST report a bucket whose policy it cannot read as unchecked rather than as guarded."
    rationale: "A check that cannot run is not a pass (principle 4); the role of the checker may lack the permission to read the policy."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a fake S3 control plane that denies the read of the policy gives a report that names the bucket as unchecked and the missing permission"}
  - id: REQ-AUDIT-174
    area: AUDIT
    statement: "When the store refuses a blob request with 401 or 403, the driver MUST read its credential again without a cache and send the request exactly once more."
    rationale: "A credential that was rotated away answers 401 or 403, a cache can return the credential just refused, and a request sent three times hides a configuration error; the R2 spike of 2026-11-06 found no delay for API-minted temporary credentials, so one retry is the rule for them; locally signed credentials were not measured (ADR 0013)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: all
    actors: [writer, witness, indexer, reader]
    standards: []
    features: ["parity"]
    verification:
      - {kind: conformance-suite, ref: "blob port suite, fake store: 401 once and 403 once succeed in two attempts, 401 forever fails in two; a streamed body is replayed byte for byte"}
  - id: REQ-AUDIT-175
    area: AUDIT
    statement: "Blob requests of one driver that are refused with 401 or 403 at the same time MUST share one re-read of the credential."
    rationale: "Each request that re-reads on its own multiplies the reads of the credential and can leave the requests with different credentials (ADR 0028)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [writer, witness, indexer, reader]
    standards: []
    features: ["parity"]
    verification:
      - {kind: conformance-suite, ref: "the blob port suite sends several concurrent requests that the fake store refuses; the credential is read once and every request is retried once"}
  - id: REQ-AUDIT-176
    area: AUDIT
    statement: "A blob driver MUST log a refusal of its credential at warning level with the status and the operation and without the credential."
    rationale: "The warning tells an operator that credentials rotate under load, and the log must never be a place where a credential is found (ADR 0028, REQ-OBS-008)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [writer, witness, indexer, reader]
    standards: []
    features: ["parity"]
    verification:
      - {kind: conformance-suite, ref: "after a refused-then-accepted request the log holds one warning with the status and the operation and no part of the credential"}
  - id: REQ-AUDIT-177
    area: AUDIT
    statement: "A blob driver MUST decide that its credential changed by comparing the key id, the secret and the session token, not the key id alone."
    rationale: "A credential rotated in place keeps its key id, and a driver that compares the id would take the refused credential for a new one (ADR 0028)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: all
    actors: [writer, witness, indexer, reader]
    standards: []
    features: ["parity"]
    verification:
      - {kind: conformance-suite, ref: "blob port suite: a secret rotated under the same key id is reported as changed"}
  - id: REQ-AUDIT-178
    area: AUDIT
    statement: "The writer's state MUST stay under the blob port's request limit at the top rate of the design, 51 messages a second for 14 days, by naming write-once segments for the older identifiers."
    rationale: "A state that holds every identifier outgrew the 4 MiB the blob driver takes after 64,287 identifiers on a board, and the writer then could neither seal a batch nor adopt the entries a crash left, and restarted in a loop (ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [writer]
    standards: []
    tests: [actors/writer/internal/writerd/seen_test.go]
    verification:
      - {kind: integration-test, ref: "a state of the old format over 4 MiB and the entries of a crashed batch: the writer adopts and spills at its start, and a crash at each step loses and doubles nothing"}
      - {kind: integration-test, ref: "a clock that jumps and is put right, and a spool backlog on a boot clock behind or ahead or unobserved: sealed once, nothing quarantined by the clock, the seal entry says the checks did not run"}
      - {kind: manual, ref: "board check: a board whose writer looped on the refused put of its state adopts the entries a crash left and stays up. Run 2026-11-07. Untested on hardware: the untrusted-clock path after a power cut"}
  - id: REQ-AUDIT-179
    area: AUDIT
    statement: "The writer MUST NOT take a record identifier as new when a segment of remembered identifiers that its state names is missing or differs from the bytes the state names and stops with an error that names the segment."
    rationale: "An identifier that cannot be looked up could be written twice, so the stop covers every message behind it and a start that must merge the segment too, until the object is restored, and no tool rebuilds one yet (ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [writer]
    standards: []
    features: ["design"]
    tests: [actors/writer/internal/writerd/seen_test.go]
    verification:
      - {kind: integration-test, ref: "a segment removed or changed under a running writer: a repeated and a new identifier of its hour both stop the writer with the segment's path, a stale message does not, and the log is unchanged"}
  - id: REQ-AUDIT-180
    area: AUDIT
    statement: "A board that is idle, locked or waiting for a peer MUST write no more than 60 audit records an hour."
    rationale: "Every refusal and every decision is a record that the writer must seal, and a board with no traffic that writes thousands an hour fills a spool of 256 MiB in days and takes card signatures for facts about itself (ADR 0029); the indexer's own decisions end only while it polls at most every 30 seconds, inside the 50 seconds a grant is presented."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    tests:
      - actors/key/internal/keyd/pinpoll_test.go
      - actors/writer/internal/writerd/idle_loop_test.go
      - actors/writer/internal/writerd/retry_test.go
      - actors/indexer/tests/index.rs
    verification:
      - {kind: integration-test, ref: "key@'s share on the fakes: a simulated hour with an unanswerable request, and an idle hour, write no audit fact and sign nothing (TestAnIdleUnlockedBoardWritesNoAuditFactsAndSignsNothing)"}
      - {kind: integration-test, ref: "the writer's share on the fakes, policy's part played: one record and its decision's record are sealed, then two simulated hours write and sign nothing (TestAnIdleWriterSeals...)"}
      - {kind: integration-test, ref: "the indexer's share: it keeps its grant for the expiry policy states, so at the longest poll (30 s) it decides once and goes quiet (a_slow_poll_within_the_life_of_the_grant_goes_quiet...)"}
      - {kind: manual, ref: "board check, idle hour: unlocked, no traffic, after the last seal, 60 records or fewer, log flat. Run 2026-11-07, three boards: 0 in 60 min; before the fix 23 entries a minute"}
  - id: REQ-AUDIT-181
    area: AUDIT
    statement: "The writer MUST keep the sealed grant that policy gave it for a tenant, with the expiry that policy states in its answer, and present it for every seal of every batch until ten seconds before that expiry."
    rationale: "A grant is reusable for about 60 seconds (ADR 0007), and a grant asked for in every batch made the record of each decision the input of the next batch, so an idle board sealed about 600 records and signed about 600 checkpoints an hour (ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [writer]
    standards: []
    features: ["design"]
    tests:
      - actors/writer/internal/writerd/idle_loop_test.go
      - actors/key/internal/keyd/seal_test.go
      - actors/policy/tests/service.rs
    verification:
      - {kind: integration-test, ref: "on the fakes: a busy writer makes about 72 decisions an hour (TestABusyWriter...); key@ takes one grant for many seals until its expiry (TestOneGrantSealsManyRecords...)"}
  - id: REQ-AUDIT-182
    area: AUDIT
    statement: "The writer MUST NOT present a grant after ten seconds before its expiry, keep one that policy or key@ refused or that came with no expiry beyond its batch, or hold one across a start."
    rationale: "A permission that policy takes away must reach the writer within the life of the grant it holds, which ADR 0007 puts at about 60 seconds, and a grant is never stored."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [writer]
    standards: []
    features: ["design"]
    tests: [actors/writer/internal/writerd/idle_loop_test.go]
    verification:
      - {kind: integration-test, ref: "on the fakes: a permission taken away stops the sealing 50 s after the decision (TestARevokedPermission...); a refused grant, a restart and a clock set back each make it ask again"}
  - id: REQ-AUDIT-183
    area: AUDIT
    statement: "The writer MUST wait between 1 and 30 seconds before it opens the transport stream again after a failure, doubling the wait at each failure in a row and starting from 1 second again after a batch is sealed."
    rationale: "Every try that reaches policy is a decision and an audit record, and a writer that retried each second while key@ was locked wrote up to 3,600 records an hour for nothing, where the wait now bounds how long a writer takes to recover after an unlock (ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [writer]
    standards: []
    features: ["design"]
    tests: [actors/writer/internal/writerd/retry_test.go]
    verification:
      - {kind: integration-test, ref: "a simulated hour with key@ locked is about 124 tries, the writer seals at the first try after the unlock, and the next failure waits 1 s (TestAWriterWhoseKeyIsLockedBacksOff...)"}
  - id: REQ-AUDIT-184
    area: AUDIT
    statement: "A pass that opens records of the log under a grant MUST ask `policy` for a new grant when the one it holds is half its life old or key@ refuses it with the reason grant."
    rationale: "A grant lives 60 seconds and the log of a board that has run for days holds thousands of records, so a pass that holds the one grant it asked for first is refused by key@ part of the way (ADR 0007, ADR 0028)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [indexer]
    standards: []
    tests: [tests/e2e/spine/audit_test.go]
    verification:
      - {kind: integration-test, ref: "a pass over 300 records at 25 s an Open: key@ refuses none and policy is asked again; a grant that ran out before key@ saw it is asked for again (audit_test.go in tests/e2e/spine)"}
      - {kind: manual, ref: "board check: boards-smoke step 3 on a board whose writer ran a day or more (thousands of records) finds the records of its run and verifies the log. Run 2026-11-07, three boards"}
  - id: REQ-AUDIT-185
    area: AUDIT
    split_from: REQ-AUDIT-184
    statement: "A pass that opens records of the log MUST NOT go on after key@ refuses the new grant it asked for, or refuses for another reason."
    rationale: "A pass that goes on after a second refusal would walk around the check of key@, which is the same whoever asks (ADR 0006, ADR 0007)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [indexer]
    standards: []
    tests: [tests/e2e/spine/audit_test.go]
    verification:
      - {kind: integration-test, ref: "key@ refuses every grant: one Open, one more ask and an error; a refusal by rule: one Open, one ask and an error (audit_test.go in tests/e2e/spine)"}
