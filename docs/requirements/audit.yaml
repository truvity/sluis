  - id: REQ-AUDIT-012
    area: AUDIT
    statement: "The audit emitter MUST be a library inside each application."
    rationale: "The application must not depend on writer availability."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: attestation-missing
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [802, 1120]
    manual_reason: "The rule constrains the architecture of the applications that embed the emitter."
    verification:
      - {kind: manual, ref: "architecture review"}
  - id: REQ-AUDIT-032
    area: AUDIT
    split_from: REQ-AUDIT-012
    statement: "The audit emitter MUST be decoupled from the writer by a transport."
    rationale: "The application must not depend on writer availability."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [802, 1120]
    verification:
      - {kind: test-vectors, ref: "port suite transport"}
  - id: REQ-AUDIT-013
    area: AUDIT
    statement: "In direct transport mode, when the writer is unavailable, the emitter MUST fall back to a local spool."
    rationale: "Direct mode needs durability."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [802]
    verification:
      - {kind: integration-test, ref: "writer-down fallback test"}
  - id: REQ-AUDIT-033
    area: AUDIT
    split_from: REQ-AUDIT-013
    statement: "When the transport fails, the emitter MUST return the failure to its caller and not buffer the record in memory."
    rationale: "A record held only in memory is lost with the process, and a failure the caller never sees is a loss that nobody can count; this replaces the earlier ban on dropping records, which a full spool makes impossible to keep (ADR 0029)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [802]
    tests: [kits/go/audit/emitter_test.go, kits/go/audit/lost_test.go, kits/rust/sluis-audit/tests/emit.rs, drivers/writer/spool/tests/spool.rs]
    verification:
      - {kind: integration-test, ref: "a failing transport in both kits returns the error, is not retried and is not sent later; through the real spool, a full or an absent spool refuses both calls and the spool holds only what it took"}
  - id: REQ-AUDIT-186
    area: AUDIT
    split_from: REQ-AUDIT-013
    statement: "An emitter MUST carry the running total of the best-effort facts it failed to deliver for a tenant in that tenant's records, as `unmapped.sluis.lost` with the process, the total and the time of the first, until a record that carries the current total is delivered."
    rationale: "A best-effort fact that is lost while its process lives must be visible in the log, and only to the tenant it concerns (ADR 0029, ADR 0005)."
    level: MUST
    source: design-decision
    status: partial
    gap: attestation-missing
    milestone: first-version
    runtimes: all
    standards: []
    issues: [802]
    tests: [kits/go/audit/lost_test.go, kits/rust/sluis-audit/tests/emit.rs, drivers/writer/spool/tests/spool.rs, actors/writer/internal/writerd/writer_test.go, actors/key/main_test.go, actors/signer/tests/sign.rs]
    verification:
      - {kind: test-vectors, ref: "record vectors with lost: the same bytes and SHA-384 in the Go and Rust kits, and a record of a caller that writes lost is refused (kits/conformance/audit)"}
      - {kind: integration-test, ref: "a failure then a success carries the total and stops; per tenant, bounded; a delivered but errored record repeats it harmlessly; the real spool, full and absent; the writer stores the record as it is"}
      - {kind: manual, ref: "board check: two tenants lose a fact to a full spool; free it; each next record names its own total; restart the actor and see a new process id. A spool that accepts late is not covered. Not run yet"}
  - id: REQ-AUDIT-187
    area: AUDIT
    split_from: REQ-AUDIT-013
    statement: "An emitter MAY lose a best-effort fact when its delivery fails, and the best-effort facts are refusals and denials, start and reload facts, data-key creations, wrap writes, revocations and changes of the signer's ring, but not the successful sign-in, code, token or exchange outcomes of session, exchange and the upstream adapter, which fail their operation."
    rationale: "A full spool must never block a revocation or answer a refusal on the log's health, and a fact whose operation failed is not lost (ADR 0029)."
    level: MAY
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [802]
    tests: [actors/key/internal/keyd/declaration_test.go, actors/signer/tests/sign.rs, kits/go/audit/lost_test.go]
    verification:
      - {kind: integration-test, ref: "a revocation with the audit transport down stands and its answer says Audited=false; a ring change stands when the spool is full; a fact of a failed operation is not counted"}
  - id: REQ-AUDIT-014
    area: AUDIT
    statement: "Delivery from the emitter to the writer MUST be at least once."
    rationale: "Networks duplicate; the log must not."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards:
