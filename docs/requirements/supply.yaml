# SUPPLY: Release and supply chain
schema: 1
area: SUPPLY
requirements:
  - id: REQ-SUPPLY-001
    area: SUPPLY
    statement: "Release artifacts MUST be signed."
    rationale: "Users verify what they install."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-83, section: "9580", depth: Full}
      - {id: ST-84, section: "sigstore", depth: Full}
    issues: [848, 874]
    verification:
      - {kind: integration-test, ref: "signature check"}
  - id: REQ-SUPPLY-007
    area: SUPPLY
    split_from: REQ-SUPPLY-001
    statement: "The verification procedure for release signatures MUST be published."
    rationale: "Users verify what they install."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-83, section: "9580", depth: Full}
      - {id: ST-84, section: "sigstore", depth: Full}
    issues: [848, 874]
    verification:
      - {kind: integration-test, ref: "verify-from-docs test"}
  - id: REQ-SUPPLY-002
    area: SUPPLY
    statement: "Releases MUST carry build provenance."
    rationale: "Provenance proves the build."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-85, section: "1", depth: Full}
      - {id: ST-86, section: "1", depth: Partial}
    issues: [848]
    verification:
      - {kind: integration-test, ref: "slsa-verifier"}
  - id: REQ-SUPPLY-008
    area: SUPPLY
    split_from: REQ-SUPPLY-002
    statement: "The provenance level of a release MUST be stated."
    rationale: "Provenance proves the build."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-85, section: "1", depth: Full}
      - {id: ST-86, section: "1", depth: Partial}
    issues: [848]
    manual_reason: "A statement in the release notes is checked by reading it."
    verification:
      - {kind: manual, ref: "release notes check"}
  - id: REQ-SUPPLY-003
    area: SUPPLY
    statement: "Releases MUST include a software bill of materials in a standard format."
    rationale: "Dependency transparency."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-87, section: "1", depth: Full}
    issues: [848]
    verification:
      - {kind: integration-test, ref: "SBOM validator"}
  - id: REQ-SUPPLY-004
    area: SUPPLY
    statement: "Each release signing primary key MUST be generated on a hardware token under a documented ceremony."
    rationale: "The primary key must stay offline."
    level: MUST
    source: design-decision
    status: withdrawn
    moved_to: "https://github.com/truvity/ritueel/issues/24"
    runtimes: all
    standards:
      - {id: ST-83, section: "9580", depth: Full}
      - {id: NC-10, section: "OpenPGP card", depth: Full}
    verification:
      - {kind: manual, ref: "ceremony guide"}
      - {kind: integration-test, ref: "dry-run"}
  - id: REQ-SUPPLY-009
    area: SUPPLY
    split_from: REQ-SUPPLY-004
    statement: "Each node's release-signing subkey MUST be bound under both OpenPGP primary keys, with an expiry."
    rationale: "The primary keys stay on their cards while one shared subkey signs, so one signature verifies under either."
    level: MUST
    source: design-decision
    status: withdrawn
    moved_to: "https://github.com/truvity/ritueel/issues/24"
    runtimes: all
    standards:
      - {id: ST-83, section: "9580", depth: Full}
      - {id: NC-10, section: "OpenPGP card", depth: Full}
    verification:
      - {kind: integration-test, ref: "subkey expiry test"}
  - id: REQ-SUPPLY-005
    area: SUPPLY
    statement: "The public release keys SHOULD be published through several independent channels."
    rationale: "One channel is a single point of trust."
    level: SHOULD
    source: design-decision
    status: withdrawn
    moved_to: "https://github.com/truvity/ritueel/issues/24"
    runtimes: all
    standards:
      - {id: ST-68, section: "7929", depth: Full}
      - {id: ST-83, section: "9580", depth: Full}
    verification:
      - {kind: manual, ref: "channel consistency check"}
  - id: REQ-SUPPLY-006
    area: SUPPLY
    statement: "Changes to authentication, token, key and audit code MUST require two human approvals including a security owner."
    rationale: "Review is a control."
    level: MUST
    source: security-review
    status: partial
    milestone: backlog
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    manual_reason: "The rule is a repository setting; the evidence is the setting itself."
    issues: [1052]
    verification:
      - {kind: manual, ref: "repository settings"}
  - id: REQ-SUPPLY-010
    area: SUPPLY
    statement: "Release signing MUST use two OpenPGP primary keys, one on each hardware token of a pair."
    rationale: "One primary per card keeps each card's attestation."
    level: MUST
    source: design-decision
    status: withdrawn
    moved_to: "https://github.com/truvity/ritueel/issues/24"
    runtimes: all
    standards:
      - {id: ST-83, section: "9580", depth: Full}
      - {id: NC-10, section: "OpenPGP card", depth: Full}
    verification:
      - {kind: manual, ref: "ceremony guide"}
      - {kind: integration-test, ref: "dry-run"}
  - id: REQ-SUPPLY-011
    area: SUPPLY
    statement: "An OpenPGP primary key MUST NOT be copied between hardware tokens."
    rationale: "A copied primary key loses its attestation."
    level: MUST
    source: design-decision
    status: withdrawn
    moved_to: "https://github.com/truvity/ritueel/issues/24"
    runtimes: all
    standards:
      - {id: NC-10, section: "OpenPGP card", depth: Full}
    manual_reason: "Non-copying of a key is evidenced by the ceremony record and the token attestations."
    verification:
      - {kind: manual, ref: "ceremony record"}
  - id: REQ-SUPPLY-012
    area: SUPPLY
    statement: "A release-signing subkey MUST be revoked under both OpenPGP primary keys."
    rationale: "gpg and gpgv ignore a revocation made under only one primary, so a verifier that holds a single certificate would still accept the subkey."
    level: MUST
    source: design-decision
    status: withdrawn
    moved_to: "https://github.com/truvity/ritueel/issues/24"
    runtimes: all
    standards:
      - {id: ST-83, section: "9580", depth: Full}
    verification:
      - {kind: integration-test, ref: "revocation-under-both-primaries check"}
  - id: REQ-SUPPLY-013
    area: SUPPLY
    statement: "A release MUST carry one signature that verifies under either primary key's certificate."
    rationale: "A verifier should need only one of the two certificates."
    level: MUST
    source: design-decision
    status: withdrawn
    moved_to: "https://github.com/truvity/ritueel/issues/24"
    runtimes: all
    standards:
      - {id: ST-83, section: "9580", depth: Full}
      - {id: ST-68, section: "7929", depth: Partial}
    verification:
      - {kind: integration-test, ref: "verify-with-either-key test"}
  - id: REQ-SUPPLY-014
    area: SUPPLY
    statement: "The signing API MUST sign an artifact only for a caller that proves its identity with an OIDC token and that policy authorises for that key."
    rationale: "CI holds no long-lived signing key; it shows a short-lived identity and policy decides."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [890]
    verification:
      - {kind: integration-test, ref: "a caller without a token, and a caller the policy does not name, are refused"}
  - id: REQ-SUPPLY-015
    area: SUPPLY
    statement: "The signing API MUST write an audit record for every signature it makes, naming the caller and the key."
    rationale: "A signing service is found out by its signatures, so each one must be on the record."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [890]
    verification:
      - {kind: integration-test, ref: "sign N times; the audit log holds N records with caller and key"}
  - id: REQ-SUPPLY-016
    area: SUPPLY
    statement: "The signing API MUST return an ASCII-armoured OpenPGP detached signature for the content it is sent."
    rationale: "The package tools read this form; a binary Release.gpg fails in apt."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-83, section: "9580", depth: Full}
    issues: [890]
    verification:
      - {kind: integration-test, ref: "gpgv, sqv and apt accept the armoured signature; a tampered file is refused"}
  - id: REQ-SUPPLY-017
    area: SUPPLY
    statement: "The signing API MUST sign the Release.gpg and InRelease files of an apt repository and the repomd.xml.asc file of an rpm repository."
    rationale: "This is the second stage of OpenPGP artifact signing and covers the v1 repositories."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-83, section: "9580", depth: Full}
    issues: [1074]
    verification:
      - {kind: integration-test, ref: "apt and dnf verify a test repository signed through the API in a clean container"}
  - id: REQ-SUPPLY-018
    area: SUPPLY
    statement: "A release signature MUST verify against the published release keyring with gpgv, sqv, apt and rpm."
    rationale: "Users verify with the tool they already have."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-83, section: "9580", depth: Full}
    issues: [874]
    verification:
      - {kind: integration-test, ref: "the verifier matrix accepts a release signature and refuses a tampered artifact and an expired subkey"}
  - id: REQ-SUPPLY-019
    area: SUPPLY
    statement: "The signing API MUST refuse a request whose content is empty or longer than 4 MiB with invalid_argument."
    rationale: "An OpenPGP signature needs the data, so a digest alone cannot be signed (ADR 0024)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [890]
    verification:
      - {kind: integration-test, ref: "send zero bytes and 4 MiB plus one byte: both refused"}
  - id: REQ-SUPPLY-020
    area: SUPPLY
    statement: "The signing API MUST return a version 4 OpenPGP signature of type 0x00 with ECDSA on P-384 and SHA-384, whose hashed subpackets are the creation time and the issuer fingerprint and whose unhashed subpacket is the issuer key id."
    rationale: "This is the packet rule that the release keyring and the verifiers read (ADR 0024)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-83, section: "5.2", depth: Full}
    issues: [890]
    verification:
      - {kind: integration-test, ref: "gpgv, sqv, apt and rpm accept the signature, and a packet parser shows exactly those subpackets"}
  - id: REQ-SUPPLY-021
    area: SUPPLY
    statement: "The signer MUST sign an artifact only for a grant that policy sealed and whose key purpose, content hash and expiry match the request."
    rationale: "A flaw in the actors in front of the signer must not obtain a signature policy did not allow."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [890]
    verification:
      - {kind: integration-test, ref: "a grant for other content, another purpose or past its expiry is refused; a request without a grant is refused"}
  - id: REQ-SUPPLY-022
    area: SUPPLY
    statement: "The signing API MUST answer failed_precondition when the OpenPGP binding of the release subkey is absent or expired."
    rationale: "A subkey that no primary vouches for must not sign (ADR 0024)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [890]
    verification:
      - {kind: integration-test, ref: "sign before sluis key install and after the binding's expiry: both refused"}
  - id: REQ-SUPPLY-023
    area: SUPPLY
    statement: "The signing API MUST NOT return a signature whose audit record could not be written."
    rationale: "A signing service is found out by its records."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [890]
    verification:
      - {kind: integration-test, ref: "stop the audit transport: the request fails and no signature is returned"}
  - id: REQ-SUPPLY-024
    area: SUPPLY
    statement: "The release-signing key MUST be used by the signer only and only for OpenPGP signatures."
    rationale: "One key under two formats lets an input chosen for one pass as a signature in the other."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [890]
    verification:
      - {kind: integration-test, ref: "the rules of key@ and the key policy name one actor, and the signer has no other format to ask for"}
  - id: REQ-SUPPLY-025
    area: SUPPLY
    statement: "The contract vectors of the previous release of the same major version MUST pass against the actors of the current release."
    rationale: "A rolling deployment runs two neighbouring releases at once (ADR 0015)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1022]
    verification:
      - {kind: test-vectors, ref: "previous-release vectors for messages, records and documents run against the current build in CI"}
  - id: REQ-SUPPLY-026
    area: SUPPLY
    statement: "A field of a stored kind MUST NOT be removed in the release that stops writing it."
    rationale: "A rollback and a mixed window both need the previous release to read what the current one wrote (ADR 0015)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1022]
    verification:
      - {kind: integration-test, ref: "a schema diff between two releases fails when a field is removed in the release that stops writing it"}
  - id: REQ-SUPPLY-027
    area: SUPPLY
    statement: "The contract vectors of the current release MUST pass against the artifacts of the previous release of the same major version."
    rationale: "A newer writer must stay readable by an older reader during a rollout and a rollback (ADR 0015)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1022]
    verification:
      - {kind: test-vectors, ref: "current vectors run against the previous release's artifacts in CI"}

  # ---- packages (decision 0013)
  - id: REQ-SUPPLY-028
    area: SUPPLY
    statement: "A driver package MUST install no service of its own."
    rationale: "A driver is private to its owner and starts beside it (ADR 0013)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1223]
    verification:
      - {kind: integration-test, ref: "package metadata check: a driver package has no unit file and depends on its owner's package"}
  - id: REQ-SUPPLY-029
    area: SUPPLY
    statement: "A host that runs the foundation and the audit module MUST install no identity actor."
    rationale: "Audit alone is the foundation plus the audit module and nothing more (ADR 0013)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1223]
    verification:
      - {kind: integration-test, ref: "the dependencies of sluis-audit-writer and sluis-audit-search reach no package of the identity module"}

  # ---- licences (approved libraries)
  - id: REQ-SUPPLY-045
    area: SUPPLY
    statement: "A Go module, Rust crate or TypeScript package that is linked into a sluis artifact MUST be under a permissive licence (MIT, BSD, Apache-2.0, ISC, Zlib, Unicode-3.0 or Apache-2.0 with the LLVM exception)."
    rationale: "Copyleft is allowed only for external tools that CI runs, such as gpgv and sq, because their licence does not reach a sluis binary."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1039]
    verification:
      - {kind: integration-test, ref: "a CI licence check over go.mod and Cargo.lock fails on a linked dependency whose licence is not on the allow list in approved-libraries.md"}

  # ---- advisories and the CI that gates a release
  - id: REQ-SUPPLY-030
    area: SUPPLY
    statement: "The continuous-integration gate MUST fail on a known advisory that affects a dependency sluis ships, in Go, Rust and JavaScript, unless an entry of the ignore list covers it."
    rationale: "A fixed vulnerability that stays in a lock file ships to every installation, and a floor written only in a document (go-jose) is not enforced by anything."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    features: [design]
    tests: [tools/advisories/advisories_test.go, tools/workflows/workflows_test.go]
    verification:
      - {kind: integration-test, ref: "the advisories job of checks.yaml runs govulncheck (default and card builds), cargo audit and osv-scanner over every lock file, and fails on an advisory no ignore entry covers"}
  - id: REQ-SUPPLY-034
    area: SUPPLY
    split_from: REQ-SUPPLY-030
    statement: "An entry of the advisory ignore list MUST carry a reason and an expiry date no more than 90 days ahead."
    rationale: "An exception that cannot expire, or that nobody explained, is a silent permanent one."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    features: [design]
    tests: [tools/advisories/advisories_test.go]
    verification:
      - {kind: integration-test, ref: "an ignore list with an entry without a reason, without a date, past its date or more than 90 days ahead is refused"}
  - id: REQ-SUPPLY-043
    area: SUPPLY
    statement: "The release-signing page MUST state that a verifier accepts a sluis release only when its signed tag and a provenance attestation that names that tag's commit both verify."
    rationale: "A signed tag says who vouches for the release and the provenance says which workflow built it, so a verifier that checks one leaves a swap open (ADR 0042, G8 A)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    features: [design]
    manual_reason: "A statement on a documentation page is checked by reading it."
    issues: [1124]
    verification:
      - {kind: manual, ref: "release-signing page review"}
  - id: REQ-SUPPLY-044
    area: SUPPLY
    statement: "The workflow lint MUST fail any workflow in which a job that is reachable from a pull-request trigger, directly or through workflow_call, is granted id-token write."
    rationale: "A pull request runs the files it proposes, so a job it reaches with id-token write can sign through GitHub's own Sigstore instance, which the signing API does not govern (ADR 0042, C3 A; REQ-WORKLOAD-007)."
    level: MUST
    source: security-review
    status: planned
    milestone: first-version
    runtimes: all
    standards: []
    features: [design]
    issues: [1124]
    verification:
      - {kind: integration-test, ref: "fixtures: id-token write in a job under a pull-request trigger, or in a workflow that such a trigger calls through workflow_call, fails the lint; the same job on a tag or a dispatch passes"}
  - id: REQ-SUPPLY-040
    area: SUPPLY
    split_from: REQ-SUPPLY-030
    statement: "The advisory gate MUST fail, whatever the scans find, while an entry of the ignore list is past its expiry date."
    rationale: "An expired exception that only stops covering its advisory could be missed, and a gate that still passes would let it stay."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    features: [design]
    tests: [tools/advisories/advisories_test.go]
    verification:
      - {kind: integration-test, ref: "an ignore list with an entry past its date is refused before any scan runs, and the gate exits non-zero"}
  - id: REQ-SUPPLY-031
    area: SUPPLY
    statement: "A push to main MUST NOT cancel the continuous-integration run of an earlier commit on main."
    rationale: "A release gate that publishes only a commit whose run passed starves when the next merge cancels that run."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    features: [design]
    tests: [tools/workflows/workflows_test.go]
    verification:
      - {kind: integration-test, ref: "every workflow that runs on a push to main and is not a serial deploy has a concurrency group per commit for pushes and cancel-in-progress only for pull requests"}
  - id: REQ-SUPPLY-032
    area: SUPPLY
    statement: "A release MUST be published only from a commit that is an ancestor of main and whose continuous-integration run on main concluded successfully."
    rationale: "A tag on a red, cancelled or unmerged commit must not become an artifact users install."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    features: [design]
    tests: [tools/release/gate_test.go, tools/workflows/release_rules_test.go]
    verification:
      - {kind: integration-test, ref: "tools/release/gate.sh over scratch repositories, gh stubbed: a green commit on main passes; an unmerged, unrun, failed, cancelled, running or unreadable one is refused; release.yaml needs the gate"}
  - id: REQ-SUPPLY-033
    area: SUPPLY
    statement: "A release workflow MUST declare no permission at workflow level."
    rationale: "A permission granted to the whole workflow reaches every job, including those that never need it."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    features: [design]
    tests: [tools/workflows/release_rules_test.go]
    verification:
      - {kind: integration-test, ref: "a workflow test: release.yaml has an empty top-level permissions block, and a fixture with any permission at workflow level fails the rule"}
  - id: REQ-SUPPLY-041
    area: SUPPLY
    split_from: REQ-SUPPLY-033
    statement: "A job of a release workflow MUST declare only the permissions it uses."
    rationale: "The job that publishes holds the only credential that can change what users install, and no other job may share it."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    features: [design]
    tests: [tools/workflows/release_rules_test.go]
    verification:
      - {kind: integration-test, ref: "a workflow test: each job of release.yaml lists its permissions as a map, the write permissions are on the job release alone, and fixtures that break each part fail the rule"}
  - id: REQ-SUPPLY-042
    area: SUPPLY
    split_from: REQ-SUPPLY-033
    statement: "A release workflow MUST NOT persist the checkout credential."
    rationale: "A persisted credential stays readable by every later step of the job, including a dependency's install script."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    features: [design]
    tests: [tools/workflows/release_rules_test.go]
    verification:
      - {kind: integration-test, ref: "a workflow test: every checkout of release.yaml sets persist-credentials: false, and a fixture without it fails the rule"}
  - id: REQ-SUPPLY-035
    area: SUPPLY
    statement: "CI MUST fail on a dependency update that leaves a Go module, `Cargo.lock`, `yarn.lock` or `devbox.lock` stale."
    rationale: "A bump that tidies one module leaves the modules that replace it by path with a stale checksum file."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "CI runs the tidy check of each Go module, cargo with --locked, and the check of the devbox lock, and fails on a lock file that a bump left stale"}
  - id: REQ-SUPPLY-036
    area: SUPPLY
    statement: "A Go module that others import MUST NOT carry a tool directive whose dependencies the module does not otherwise need."
    rationale: "A tool directive pulls the tool's dependencies into the go.mod of a library that other modules import."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "the module graph of each published Go module holds no requirement that only a tool directive needs"}
  - id: REQ-SUPPLY-037
    area: SUPPLY
    statement: "A release job MUST push a chart or an image tag once, and on a re-run verify the digest of the existing tag instead of overwriting it."
    rationale: "A tag that is pushed twice with different content breaks every installation that pinned it."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "a second run of the push step with the same content passes after comparing digests; with different content it fails and the tag is unchanged"}
  - id: REQ-SUPPLY-038
    area: SUPPLY
    statement: "The site workflow SHOULD stay named `site.yaml`, keep its manual trigger and run from the main branch, because the v1 line starts it when it tags a release."
    rationale: "Renaming the workflow or dropping the trigger stops the v1 documentation from being rebuilt, and the failing job would be on the other branch."
    level: SHOULD
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    features: ["parity"]
    tests: [tools/workflows/release_rules_test.go]
    verification:
      - {kind: integration-test, ref: "a check over .github/workflows/site.yaml fails when the file name, the manual trigger or the main branch is missing"}
  - id: REQ-SUPPLY-039
    area: SUPPLY
    statement: "The run of the public-content check on a push to the main branch SHOULD fail when the denylist secret is absent."
    rationale: "A check that skips itself when its input is missing passes by accident (principle 4), and a renamed private repository is added to the denylist by hand."
    level: SHOULD
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    features: ["parity"]
    tests: [tools/workflows/release_rules_test.go]
    verification:
      - {kind: integration-test, ref: "the workflow sets REQUIRE_DENYLIST for the run on main, and the check exits non-zero without the secret"}
