# SUBJ: Subjects and sectors
schema: 1
area: SUBJ
requirements:
  - id: REQ-SUBJ-001
    area: SUBJ
    statement: "The key that identifies a person in storage, sessions, exchange proofs, held records and audit actors MUST be the account identifier."
    rationale: "E-mail addresses change and are personal data."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "person key scan"}
  - id: REQ-SUBJ-002
    area: SUBJ
    statement: "The account identifier MUST NOT appear in any token or response that a relying party receives."
    rationale: "A global identifier is a correlation key across controllers."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "issued token scan"}
  - id: REQ-SUBJ-003
    area: SUBJ
    statement: "A client that receives a pairwise subject MUST name exactly one sector."
    rationale: "A pairwise subject without a sector would fall back to a global identifier."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "sector assignment test"}
  - id: REQ-SUBJ-004
    area: SUBJ
    statement: "The loader MUST refuse a client that asks for a pairwise subject and names no sector."
    rationale: "A missing sector is a configuration error."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "missing sector load test"}
  - id: REQ-SUBJ-005
    area: SUBJ
    statement: "The loader MUST refuse a machine client that names a sector."
    rationale: "A machine token carries the machine's own identifier as its subject, so no sector applies."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "machine sector load test"}
  - id: REQ-SUBJ-006
    area: SUBJ
    statement: "The subject of a machine token MUST be its client identifier."
    rationale: "A machine has no person to hide."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CLIENT-023]
    verification:
      - {kind: integration-test, ref: "machine token subject test"}
  - id: REQ-SUBJ-007
    area: SUBJ
    statement: "The subject for a client in a sector MUST be a keyed MAC of the sluis subject with the sector in the message."
    rationale: "Sites in different sectors must not be able to join their customer lists."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Full}
      - {id: NC-06, section: "2104", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [1024]
    verification:
      - {kind: test-vectors, ref: "own subject vectors"}
      - {kind: conformance-suite, ref: "OIDF Basic OP with pairwise subject"}
  - id: REQ-SUBJ-008
    area: SUBJ
    statement: "The subject MAC key MUST be non-extractable and used through the keys port."
    rationale: "A key that cannot be read cannot be brute-forced offline."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Partial}
      - {id: ST-88, section: "1", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "key extraction negative test"}
  - id: REQ-SUBJ-009
    area: SUBJ
    statement: "A pairwise subject MUST be the unpadded base64url encoding of a 256-bit MAC."
    rationale: "A fixed encoding makes the value verifiable by vector."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Partial}
    issues: [1024]
    verification:
      - {kind: test-vectors, ref: "own subject vectors"}
  - id: REQ-SUBJ-010
    area: SUBJ
    statement: "Two clients in one sector MUST receive the same pairwise subject for a person."
    rationale: "A sector is one audience, so sites that must recognise the same user share one sector."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Full}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "same-sector subject test"}
  - id: REQ-SUBJ-011
    area: SUBJ
    statement: "Clients in two different sectors MUST receive different pairwise subjects for a person."
    rationale: "Sites in different sectors get different subjects by design, so they cannot correlate a person."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Full}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "cross-sector subject test"}
  - id: REQ-SUBJ-012
    area: SUBJ
    statement: "A pairwise subject MUST stay the same across sign-in, refresh, exchange and logout tokens."
    rationale: "Relying parties key their records by subject, and single sign-on follows the sluis session, so pairwise subjects do not affect it."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Full}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "subject stability test"}
  - id: REQ-SUBJ-013
    area: SUBJ
    statement: "A pairwise subject MUST NOT equal the upstream subject."
    rationale: "The subject must not expose the upstream identifier."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Full}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "subject distinctness test"}
  - id: REQ-SUBJ-014
    area: SUBJ
    statement: "Discovery MUST announce pairwise as the only supported subject type."
    rationale: "Discovery must tell the truth about the subject type."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Full}
      - {id: ST-29, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    features: ["design"]
    superseded_by: [REQ-AUTHN-006]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
  - id: REQ-SUBJ-015
    area: SUBJ
    statement: "The loader MUST refuse a change of a sector's key backend, key identifier or tenant while subjects exist."
    rationale: "Such a change would change every stored subject of the sector."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "sector identity change load test"}
  - id: REQ-SUBJ-016
    area: SUBJ
    statement: "A change of subject key MUST be made as a new sector or as a migration through the computed-subject export."
    rationale: "Subject stability is worth more than key hygiene here."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "migration through export test"}
  - id: REQ-SUBJ-017
    area: SUBJ
    statement: "No component except the administrative service MUST be able to map a sector subject back to an account identifier."
    rationale: "Reverse resolution is a privileged, audited capability."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "deny matrix for reverse pointers"}
  - id: REQ-SUBJ-018
    area: SUBJ
    statement: "Reverse resolution of a sector subject MUST write a blocking audit record."
    rationale: "A resolution that cannot be audited must not happen."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "resolution audit test"}
  - id: REQ-SUBJ-019
    area: SUBJ
    statement: "Reverse resolution in a production profile MUST require a dual-signed intent."
    rationale: "No single person may unmask a customer."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "single-signature refusal test"}
  - id: REQ-SUBJ-020
    area: SUBJ
    statement: "Reverse resolution MUST return an opaque account reference and not the account identifier."
    rationale: "The only person handle outside the hub is the reference."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "account reference test"}
  - id: REQ-SUBJ-021
    area: SUBJ
    statement: "An account reference MUST be deterministic, stable per installation and not reversible without the administrative service state."
    rationale: "Support and requests need a stable handle that reveals nothing."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: test-vectors, ref: "own account reference vectors"}
  - id: REQ-SUBJ-022
    area: SUBJ
    statement: "Reverse resolution of an unknown subject MUST be audited."
    rationale: "Failed lookups are part of the trail."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "unknown subject audit test"}
  - id: REQ-SUBJ-023
    area: SUBJ
    statement: "The issuer and the accounts module MUST NOT have read access to the reverse pointers."
    rationale: "Only the administrative service may hold the mapping."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "deny matrix for reverse pointers"}
  - id: REQ-SUBJ-024
    area: SUBJ
    statement: "In a context installation the subject MUST be a random version 4 UUID that is the same for every client of that installation."
    rationale: "A context needs a stable subject that reveals nothing about the hub."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: NC-02, section: "9562", depth: Full}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "context subject test"}
  - id: REQ-SUBJ-025
    area: SUBJ
    statement: "A context account MUST be linked to the hub by the hub sector identifier and the hub subject, rather than by the hub issuer."
    rationale: "The link then survives a change of the hub host."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "hub link key test"}
  - id: REQ-SUBJ-026
    area: SUBJ
    statement: "A context subject MUST differ from every hub subject of the same person."
    rationale: "A context must not be linkable to the hub by subject."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "context subject distinctness test"}
  - id: REQ-SUBJ-027
    area: SUBJ
    statement: "Hub tokens issued to a client MUST carry the sector marker of the client's sector in the configured claim."
    rationale: "Resource servers can detect a token minted for the wrong sector."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-52, section: "4", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "sector marker claim test"}
  - id: REQ-SUBJ-028
    area: SUBJ
    statement: "The sector marker claim MUST be omitted for a sector whose marker is null."
    rationale: "A sector may choose not to be marked."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-52, section: "4", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "null marker test"}
  - id: REQ-SUBJ-029
    area: SUBJ
    statement: "The WebAuthn user handle MUST be 32 random bytes stored on the person record."
    rationale: "The handle lives on authenticators and leaves the device."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-59, section: "5", depth: Partial}
    issues: [885]
    verification:
      - {kind: integration-test, ref: "user handle test"}
  - id: REQ-SUBJ-030
    area: SUBJ
    statement: "The WebAuthn user handle MUST NOT be derived from the person identifier."
    rationale: "A derived handle would leak the internal identifier."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-59, section: "5", depth: Partial}
    issues: [885]
    verification:
      - {kind: integration-test, ref: "user handle independence test"}
  - id: REQ-SUBJ-031
    area: SUBJ
    statement: "A subject MUST be an opaque random identifier that sluis assigns when it first sees a person: at a directory read where the upstream has a directory, otherwise at the person's first sign-in."
    rationale: "Resource servers key their records by it."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
    issues: [1081, 1106]
    verification:
      - {kind: integration-test, ref: "subject format test"}
  - id: REQ-SUBJ-032
    area: SUBJ
    statement: "sluis MUST make the subject of a directory person available before that person's first sign-in."
    rationale: "Resource servers and reconcilers create their records before the person signs in."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
    issues: [805]
    verification:
      - {kind: integration-test, ref: "subject before first sign-in test"}
  - id: REQ-SUBJ-033
    area: SUBJ
    statement: "In partner mode the subject MUST be the client identifier."
    rationale: "A partner token represents the partner."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CLIENT-023]
    verification:
      - {kind: integration-test, ref: "partner subject test"}
  - id: REQ-SUBJ-034
    area: SUBJ
    statement: "An e-mail address MUST NOT be used as a subject."
    rationale: "E-mail addresses change and are personal data."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
    issues: [1081]
    verification:
      - {kind: integration-test, ref: "subject scan for e-mail"}
  - id: REQ-SUBJ-035
    area: SUBJ
    statement: "Exit, escrow and step-in packages MUST carry the computed subject per sector and per account."
    rationale: "A successor keeps every relying-party subject."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "re-import subject reproduction test"}
  - id: REQ-SUBJ-036
    area: SUBJ
    statement: "Exit, escrow and step-in packages MUST NOT carry sector keys."
    rationale: "A successor must never hold a non-extractable key."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "package key scan"}
  - id: REQ-SUBJ-037
    area: SUBJ
    statement: "sluis MUST identify an upstream account by the issuer of the ID token and the value of the upstream's subject claim."
    rationale: "One pair identifies an account whichever path reaches it (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1081, 1106]
    verification:
      - {kind: integration-test, ref: "sign in twice through one account: one person; sign in through an account with the same value at another issuer: another person"}
  - id: REQ-SUBJ-038
    area: SUBJ
    statement: "The subject claim of an upstream MUST be the claim its configuration names, or sub when it names none."
    rationale: "Microsoft Entra needs oid because its sub differs per application, and Google uses sub (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1106]
    verification:
      - {kind: integration-test, ref: "an upstream with no subject_claim links by sub; an upstream with oid links by oid"}
  - id: REQ-SUBJ-039
    area: SUBJ
    statement: "sluis MUST NOT link, match or merge persons by e-mail address."
    rationale: "An address is reused, renamed and not always verified, so linking by it lets whoever obtains an address take over an account."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1081, 1106]
    verification:
      - {kind: integration-test, ref: "two accounts with one e-mail address are two persons; a changed address keeps the person"}
  - id: REQ-SUBJ-040
    area: SUBJ
    statement: "sluis MUST refuse a sign-in whose ID token lacks the configured subject claim, or whose value is not a string of at most 255 characters."
    rationale: "There is no fallback to another claim, so a missing claim cannot create a second identity."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1106]
    verification:
      - {kind: integration-test, ref: "a token without the claim, and one with a number or a 300-character value, are refused and no person is created"}
  - id: REQ-SUBJ-041
    area: SUBJ
    statement: "sluis MUST refuse a sign-in through an upstream whose configured subject claim differs from the claim pinned when the issuer's first person was linked."
    rationale: "A changed claim would make every known person look new, so a contradicted pin is refused (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1106]
    verification:
      - {kind: integration-test, ref: "link a person by sub, change the configuration to oid, and sign in: refused"}
  - id: REQ-SUBJ-042
    area: SUBJ
    statement: "Two concurrent first sign-ins through one upstream account MUST create exactly one person."
    rationale: "The link is created only if absent, so a race cannot make two subjects for one account."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1081]
    verification:
      - {kind: integration-test, ref: "race N first sign-ins through one account: one person, one subject"}
  - id: REQ-SUBJ-043
    area: SUBJ
    statement: "sluis MUST refuse sign-in, refresh, exchange and step-up for a person under an operator hold."
    rationale: "A hold is a tighten-only action and takes effect at once (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1081]
    verification:
      - {kind: integration-test, ref: "hold a signed-in person: the next refresh and exchange are refused and the sessions end"}
  - id: REQ-SUBJ-044
    area: SUBJ
    statement: "sluis config check MUST refuse a subject claim that is e-mail, preferred_username, upn or name."
    rationale: "Those claims change for a person, and an identity must not."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1106]
    verification:
      - {kind: integration-test, ref: "each of the four claims is refused with the path of the field"}
  - id: REQ-SUBJ-045
    area: SUBJ
    statement: "sluis MUST mark a directory person as left only after the person is absent from the configured number of consecutive successful full snapshots."
    rationale: "One missing read must not remove a person (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [805]
    verification:
      - {kind: integration-test, ref: "drop a person from two of three snapshots: still live; from three: left and the sessions end"}
  - id: REQ-SUBJ-046
    area: SUBJ
    statement: "A failed or incomplete directory read MUST NOT count as a person's absence."
    rationale: "An unreadable directory is not an empty one."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [805]
    verification:
      - {kind: integration-test, ref: "fail a pass: no person moves towards left"}
  - id: REQ-SUBJ-047
    area: SUBJ
    statement: "sluis MUST hold and report a directory snapshot that lacks more than half of the persons it knows."
    rationale: "A truncated answer must not remove most of a company."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [805]
    verification:
      - {kind: integration-test, ref: "a snapshot with 40 percent of the known persons is held, reported and not applied"}
  - id: REQ-SUBJ-048
    area: SUBJ
    statement: "The state of a person MUST be one of live, held, suspended, left or erased."
    rationale: "One defined state machine replaces the account states that were withdrawn (ADR 0050)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "state table and transition matrix"}
  - id: REQ-SUBJ-049
    area: SUBJ
    statement: "Erasing a person MUST delete their person record, upstream link, holds, statuses, sessions, refresh records and consents."
    rationale: "After erasure nothing ties an audit pseudonym to a person."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "erasure test that scans every record kind for the subject"}
  - id: REQ-SUBJ-050
    area: SUBJ
    statement: "Erasing a person MUST write a tombstone."
    rationale: "A repeated erasure must be idempotent, and the tombstone says why a stale token is refused."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "repeated erasure test"}
  - id: REQ-SUBJ-051
    area: SUBJ
    statement: "sluis MUST refuse a token or a refresh that names an erased subject."
    rationale: "A stale token must not read as an unknown subject."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "stale token and refresh test after an erasure"}
  - id: REQ-SUBJ-052
    area: SUBJ
    statement: "The schema MUST NOT mark a field personal in any record kind outside the end-user inventory of ADR 0050."
    rationale: "The inventory is what an erasure and an export must cover."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "schema scan for personal fields"}
  - id: REQ-SUBJ-053
    area: SUBJ
    statement: "The subject export MUST list the state, the times, the connection, the sessions and the consents of one subject."
    rationale: "An export answers a data-subject request for what sluis holds."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1024]
