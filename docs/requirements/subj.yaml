  - id: REQ-SUBJ-054
    area: SUBJ
    statement: "The key for pairwise subjects MUST be one non-extractable key per boundary rather than one per sector or per tenant."
    rationale: "A key per sector is a key per tenant, and KMS GenerateMac takes no encryption context to separate shared uses."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Full}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "key count before and after a sector is added; unchanged"}
  - id: REQ-SUBJ-055
    area: SUBJ
    statement: "sluis MUST erase a left person when the declared retention ends."
    rationale: "Retention bounds how long records of a person who left are kept."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
