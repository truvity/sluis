# SESS: Sessions, refresh and logout
schema: 1
area: SESS
requirements:
  - id: REQ-SESS-001
    area: SESS
    statement: "A refresh token MUST be single use."
    rationale: "Reuse indicates theft."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-01, section: "6", depth: Full}
      - {id: ST-14, section: "4.14", depth: Full}
    issues: [777]
    verification:
      - {kind: integration-test, ref: "single-use test"}
  - id: REQ-SESS-013
    area: SESS
    split_from: REQ-SESS-001
    statement: "Two concurrent presentations of a refresh token within a short grace window MUST both succeed with the same successor."
    rationale: "Retried requests must not lock a client out."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-01, section: "6", depth: Full}
      - {id: ST-14, section: "4.14", depth: Full}
    issues: [777]
    verification:
      - {kind: test-vectors, ref: "concurrent-replay vectors"}
      - {kind: integration-test, ref: "grace-window tests"}
  - id: REQ-SESS-014
    area: SESS
    split_from: REQ-SESS-001
    statement: "A presentation of a refresh token after the grace window MUST end the whole token chain."
    rationale: "Reuse indicates theft."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-01, section: "6", depth: Full}
      - {id: ST-14, section: "4.14", depth: Full}
    issues: [777]
    verification:
      - {kind: integration-test, ref: "reuse-detection chain-end test"}
  - id: REQ-SESS-002
    area: SESS
    statement: "A refresh token MUST be bound to the client session."
    rationale: "A session limit that tokens can outlive is no limit."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-01, section: "6", depth: Full}
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
    issues: [777, 793]
    verification:
      - {kind: integration-test, ref: "session-binding test"}
  - id: REQ-SESS-015
    area: SESS
    split_from: REQ-SESS-002
    statement: "A refresh token of a human session MUST end at sign-out, at the idle limit and at the absolute limit."
    rationale: "A session limit that tokens can outlive is no limit."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-01, section: "6", depth: Full}
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
    issues: [777, 793]
    verification:
      - {kind: integration-test, ref: "idle and absolute limit tests"}
  - id: REQ-SESS-003
    area: SESS
    statement: "A refresh MUST re-check that the grant and the client are still allowed and that the directory person is not disabled."
    rationale: "Refresh must not upgrade or hide a state change, so a person whom the directory has disabled gets no new tokens once sluis knows of it."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-01, section: "6", depth: Full}
    issues: [777]
    verification:
      - {kind: integration-test, ref: "refresh re-check tests"}
  - id: REQ-SESS-016
    area: SESS
    split_from: REQ-SESS-003
    statement: "A refresh MUST keep acr, amr, auth_time and sid from the original authentication."
    rationale: "Refresh must not upgrade or hide a state change."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-01, section: "6", depth: Full}
    issues: [777]
    verification:
      - {kind: integration-test, ref: "claim-preservation test"}
  - id: REQ-SESS-004
    area: SESS
    statement: "Each client session MUST have a sid that is unique per installation, client and single sign-on session."
    rationale: "The sid links tokens to a session for revocation."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-31, section: "2.4", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [793]
    verification:
      - {kind: conformance-suite, ref: "OIDF BCL OP"}
      - {kind: integration-test, ref: "sid uniqueness test"}
  - id: REQ-SESS-017
    area: SESS
    split_from: REQ-SESS-004
    statement: "The sid MUST appear in ID tokens, access tokens and logout tokens."
    rationale: "The sid links tokens to a session for revocation."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-31, section: "2.4", depth: Full}
    issues: [793]
    verification:
      - {kind: integration-test, ref: "sid presence test"}
  - id: REQ-SESS-005
    area: SESS
    statement: "Session records MUST NOT contain e-mail addresses or names."
    rationale: "Durable, minimal records keep privacy and availability."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [793]
    verification:
      - {kind: integration-test, ref: "storage scan for personal data"}
  - id: REQ-SESS-018
    area: SESS
    split_from: REQ-SESS-005
    statement: "Session records MUST survive process restarts and upgrades."
    rationale: "Durable, minimal records keep privacy and availability."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [793]
    verification:
      - {kind: integration-test, ref: "restart test"}
  - id: REQ-SESS-006
    area: SESS
    statement: "sluis MUST allow an operator and a user to list and revoke sessions."
    rationale: "Session visibility is a basic control."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [793]
    verification:
      - {kind: integration-test, ref: "session listing and revocation tests"}
  - id: REQ-SESS-007
    area: SESS
    statement: "Session cookies MUST be Secure, HttpOnly, host-prefixed and without a Domain attribute."
    rationale: "Host-prefixed cookies cannot be set by a sibling origin."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: NC-05, section: "6265bis", depth: Full}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "cookie attribute test"}
  - id: REQ-SESS-019
    area: SESS
    split_from: REQ-SESS-007
    statement: "Session cookies MUST be named with an installation prefix."
    rationale: "Two installations on one parent domain must not read each other's cookies."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: NC-05, section: "6265bis", depth: Full}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "cookie name test"}
  - id: REQ-SESS-008
    area: SESS
    statement: "The end-session endpoint MUST accept an ID token hint that this installation signed for the named client even after expiry."
    rationale: "An expired hint is still proof of the session."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-30, section: "2", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [779]
    verification:
      - {kind: conformance-suite, ref: "OIDF RP-Initiated Logout OP"}
      - {kind: integration-test, ref: "expired-hint test"}
  - id: REQ-SESS-020
    area: SESS
    split_from: REQ-SESS-008
    statement: "The end-session endpoint MUST validate the post-logout redirect URI against the registered list."
    rationale: "An expired hint is still proof of the session."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-30, section: "2", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [779]
    verification:
      - {kind: conformance-suite, ref: "OIDF RP-Initiated Logout OP"}
      - {kind: integration-test, ref: "redirect-URI tests"}
  - id: REQ-SESS-009
    area: SESS
    statement: "A client that registers a back-channel logout URI MUST receive a logout token with typ logout+jwt, iss, aud, iat, exp of at most two minutes, jti, sid or sub, the backchannel-logout event, and no nonce."
    rationale: "The logout token profile is what receivers verify."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-31, section: "2.4", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [780]
    verification:
      - {kind: conformance-suite, ref: "OIDF BCL OP"}
  - id: REQ-SESS-010
    area: SESS
    statement: "Delivery of logout tokens MUST retry with exponential backoff."
    rationale: "A missed logout leaves a session alive."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-31, section: "2.5", depth: Partial}
    issues: [780]
    verification:
      - {kind: integration-test, ref: "receiver-down retry test"}
  - id: REQ-SESS-021
    area: SESS
    split_from: REQ-SESS-010
    statement: "A dead-lettered logout delivery MUST raise an alarm."
    rationale: "A missed logout leaves a session alive."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-31, section: "2.5", depth: Partial}
    issues: [780]
    verification:
      - {kind: integration-test, ref: "dead-letter alarm test"}
  - id: REQ-SESS-011
    area: SESS
    statement: "A global sign-out MUST end every session of the account at every client."
    rationale: "Broadcast keeps the hub from building a person-to-service graph."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-31, section: "2.4", depth: Full}
      - {id: ST-26, section: "CAEP", depth: Partial}
    issues: [793]
    verification:
      - {kind: integration-test, ref: "global sign-out session test"}
  - id: REQ-SESS-022
    area: SESS
    split_from: REQ-SESS-011
    statement: "A global sign-out MUST notify every registered receiver without sluis learning which receivers know the person."
    rationale: "Broadcast keeps the hub from building a person-to-service graph."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    superseded_by: [REQ-SESS-011, REQ-SESS-038]
    runtimes: all
    standards:
      - {id: ST-31, section: "2.4", depth: Full}
      - {id: ST-26, section: "CAEP", depth: Partial}
    issues: [927]
    verification:
      - {kind: integration-test, ref: "broadcast test"}
  - id: REQ-SESS-012
    area: SESS
    statement: "An agent-class session MUST require explicit consent."
    rationale: "Consent for an agent is the user's only control."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-25, section: "auth", depth: Partial}
      - {id: ST-14, section: "4", depth: Partial}
    issues: [794]
    verification:
      - {kind: integration-test, ref: "consent matrix"}
  - id: REQ-SESS-023
    area: SESS
    split_from: REQ-SESS-012
    statement: "An agent-class session MUST be bound to that consent for its entire lifetime."
    rationale: "Consent for an agent is the user's only control."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-25, section: "auth", depth: Partial}
      - {id: ST-14, section: "4", depth: Partial}
    issues: [794]
    verification:
      - {kind: integration-test, ref: "consent-binding test"}
  - id: REQ-SESS-024
    area: SESS
    statement: "sluis MUST end all sessions and refresh grants of a person when it learns that the directory has disabled that person."
    rationale: "A known disable takes effect at once, and the bounded window for last-known groups applies only while the directory is unreachable, where sluis cannot learn of a disable."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [793]
    verification:
      - {kind: integration-test, ref: "disabled person session end test"}
  - id: REQ-SESS-025
    area: SESS
    statement: "Every session MUST have a class, human or agent, that is fixed when the session is created."
    rationale: "The classes differ in their limits and in what ends them (ADR 0023)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [959]
    verification:
      - {kind: integration-test, ref: "session class test: the class never changes on refresh"}
  - id: REQ-SESS-026
    area: SESS
    statement: "sluis MUST NOT issue a refresh token for a client-credentials grant or a workload exchange."
    rationale: "A machine client has no session; it presents its credential again (ADR 0023)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-01, section: "4.4", depth: Partial}
    issues: [961]
    verification:
      - {kind: integration-test, ref: "client credentials and workload exchange return no refresh token"}
  - id: REQ-SESS-027
    area: SESS
    statement: "A human session MUST end at its absolute limit from its start, whatever its activity."
    rationale: "Use must not extend a person's sign-in (v1 ADR 0001, ADR 0023)."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [793]
    verification:
      - {kind: integration-test, ref: "absolute limit test with a moved clock and steady refreshes"}
  - id: REQ-SESS-028
    area: SESS
    statement: "A step-up re-authentication MUST NOT extend a session's absolute limit."
    rationale: "Step-up refreshes freshness, not the sign-in (ADR 0023)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [885]
    verification:
      - {kind: integration-test, ref: "step-up then refresh past the original limit; refused"}
  - id: REQ-SESS-029
    area: SESS
    statement: "A person's sign-out MUST NOT end that person's agent sessions."
    rationale: "A background agent must not break silently when its person closes a browser (ADR 0023)."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [794, 822]
    verification:
      - {kind: integration-test, ref: "sign-out leaves agent sessions live"}
  - id: REQ-SESS-030
    area: SESS
    statement: "Revoking a consent MUST end at once every agent session that the consent started."
    rationale: "An agent acts only while its person allows it (ADR 0023)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [794, 822]
    verification:
      - {kind: integration-test, ref: "consent revocation ends agent sessions"}
  - id: REQ-SESS-031
    area: SESS
    statement: "An agent session MUST NOT outlive the absolute lifetime of the consent that started it."
    rationale: "An agent's lifetime is bounded by its consent (ADR 0023)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [794, 822]
    verification:
      - {kind: integration-test, ref: "agent session past the consent lifetime; refresh refused"}
  - id: REQ-SESS-032
    area: SESS
    statement: "sluis MUST refuse a new agent session past the cap of concurrent agent sessions for that person and client."
    rationale: "A client that starts a session on every run must not pile up live grants (ADR 0023)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [794, 822]
    verification:
      - {kind: integration-test, ref: "agent session cap test"}
  - id: REQ-SESS-033
    area: SESS
    statement: "A boundary MUST NOT extend a session beyond the absolute limit of the session that seeded it."
    rationale: "A limit at one boundary is worthless if another can extend it (ADR 0023)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [959, 963]
    verification:
      - {kind: integration-test, ref: "exchange into a boundary near the front's limit; the boundary session ends with it"}
  - id: REQ-SESS-034
    area: SESS
    statement: "sluis MUST let a person list and revoke each of their agent sessions."
    rationale: "A person must see what acts on their behalf (ADR 0023)."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [794, 822]
    verification:
      - {kind: integration-test, ref: "agent session listing and revocation by the person"}
  - id: REQ-SESS-035
    area: SESS
    statement: "At the absolute limit of a human session, sluis MUST authenticate the person at the upstream again, first with prompt=none, instead of extending the session."
    rationale: "The upstream holds the long session and sluis keeps the 24-hour cap (ADR 0023)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [793, 916]
    verification:
      - {kind: integration-test, ref: "a session past its limit starts a new session through a prompt=none request, and login_required ends in an interactive sign-in"}
  - id: REQ-SESS-036
    area: SESS
    statement: "sluis MUST answer a step-up for a person who signs in through a customer upstream by re-authentication at that upstream with the acr_values and max_age that policy asked for."
    rationale: "sluis hosts no end-user factors (ADR 0023)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "a step-up for a person of a customer upstream redirects to the upstream with acr_values and max_age"}
  - id: REQ-SESS-037
    area: SESS
    statement: "sluis MUST NOT enrol a factor for, or ask for a passkey of, a person who signs in through a customer upstream."
    rationale: "sluis hosts no end-user accounts or factors (ADR 0023, REQ-CIAM-017)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "a sign-in and a step-up through a customer upstream show no passkey prompt and create no factor"}
  - id: REQ-SESS-038
    area: SESS
    statement: "A global sign-out MUST send one logout token for each ended session to each client that registered a back-channel logout URI."
    rationale: "Every client with a session must learn that it ended."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-31, section: "2.6", depth: Full}
    issues: [780]
    verification:
      - {kind: integration-test, ref: "fan-out test with three clients and two customer boundaries"}
  - id: REQ-SESS-039
    area: SESS
    statement: "A status of suspended or an erasure MUST end the agent sessions of the person as well as their human sessions."
    rationale: "An agent session never outlives the person (ADR 0023)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [916, 1024]
    verification:
      - {kind: integration-test, ref: "suspend test with a live agent session"}
  - id: REQ-SESS-040
    area: SESS
    statement: "sluis MUST NOT start an agent session through a connection that declares no status source."
    rationale: "sluis can promise to end an agent session only where it can be told."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "agent consent through a connection without a source is refused"}
  - id: REQ-SESS-041
    area: SESS
    statement: "sluis MUST acknowledge an upstream logout token for an unknown sid and change nothing."
    rationale: "A logout for a session that sluis never had or already ended is not an error."
    level: MUST
    source: standard
    status: planned
    runtimes: all
    standards:
      - {id: ST-31, section: "2.8", depth: Partial}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "unknown sid test"}
  - id: REQ-SESS-042
    area: SESS
    statement: "sluis MUST NOT renew a session silently through a connection of trust level internal."
    rationale: "A workforce sign-in needs the periodic full sign-in with multi-factor authentication (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "renewal through an internal connection is refused"}
