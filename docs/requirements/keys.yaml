  # ---- where a tenant's keys live, and the pairwise key (decision 0006)
  - id: REQ-KEYS-074
    area: KEYS
    statement: "A tenant's key location MUST be operator-held unless its Tenant item declares customer account."
    rationale: "The location is chosen per tenant by a declaration and defaults to the installation's own KMS keys (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
