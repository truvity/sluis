      - {kind: manual, ref: "on three boards, a rebooted board keeps asking until a peer answers and unlocks with no hand action. Run 2026-11-07, also on a reinstalled board; not run: a locked peer with nobody to unlock it"}
  - id: REQ-KEYS-060
