  - id: REQ-KEYS-110
    area: KEYS
    statement: "key@ MUST verify the signature, the pinned publisher key and the sequence of the KeyPlan itself, keep the highest sequence in state of its own, and take no recipient, purpose or time to live from a KeyPlan it refuses."
    rationale: "A compromised store@ could otherwise serve a KeyPlan that lists its own key, and the list is signed so that it cannot; where key@ has no durable local state (a function on serverless) it has no mark, and a cold start takes the newest validly signed document (ADR 0005; the residual is in [Who may receive a wrap](/decisions/0006-keys-and-sealing/#who-may-receive-a-wrap))."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: [bare-metal, kubernetes]
    actors: [key]
    standards: []
    issues: [1208]
    tests: [actors/key/internal/keyd/plan_test.go, actors/key/internal/keyd/plan_vectors_test.go, kits/go/signedconfig/vectors_test.go, actors/store/tests/vectors.rs]
    verification:
      - {kind: test-vectors, ref: "the shared vectors of the signed document: the Go and the Rust verifier give the same verdict at every step"}
      - {kind: integration-test, ref: "a forged KeyPlan, one signed by the wrong key and one for another kind stop the start; a lower seq is refused while key@ runs and after a restart"}
  - id: REQ-KEYS-111
    area: KEYS
    statement: "key@ MUST verify the signature, the pinned publisher key, the kind and the sequence of the Boundary document itself, keep its highest sequence in state of its own, and apply the floor of the software key driver only to the environment of a Boundary it verified."
    rationale: "key@ read Boundary through store@ unsigned, so a compromised store@ could serve environment development and relax the floor in production (ADR 0006, Floors in code); where key@ has no durable local state it has no mark, as for the KeyPlan."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: [bare-metal, kubernetes]
    actors: [key]
    standards: []
    issues: [1208]
    verification:
      - {kind: test-vectors, ref: "the Boundary payload vectors: the Go and the Rust reader read the same environment from every case"}
      - {kind: integration-test, ref: "a forged Boundary, one for another kind and an unsigned item that says development leave the production floor in force; a lower seq is refused after a restart"}
  - id: REQ-KEYS-112
    area: KEYS
    statement: "key@ MUST refuse a key revocation declaration whose seq is below the highest it has taken, or equal to it with another payload, and keep that seq and digest in state of its own."
    rationale: "An older declaration must not come back, and the same declaration again is a retry that completes one a store@ failure stopped half way, writing only what is missing (ADR 0041, The declaration)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    issues: [1362]
    runtimes: [bare-metal, kubernetes]
    actors: [key]
    standards: []
    verification:
      - {kind: integration-test, ref: "a lower seq and another payload under the last seq are refused, also after a restart; a declaration stopped half way is completed by a retry"}
  - id: REQ-KEYS-113
    area: KEYS
    statement: "key@ MUST refuse a key revocation declaration without allow_unknown that names a key it does not know: one it holds, one SigningRing lists or one a signing KeyCertificate certifies."
    rationale: "A mistyped key id must not be written as a revocation that stops nothing, while a lost board's own keys, which no source knows, are revoked with allow_unknown, which the publisher signs and the audit fact marks (ADR 0041, The declaration)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    issues: [1362]
    runtimes: all
    actors: [key]
    standards: []
    verification:
      - {kind: integration-test, ref: "an unknown kid refuses it; a wrapping key is refused with allow_unknown too; the ring and a certificate make a key known; allow_unknown writes a marked key"}
  - id: REQ-KEYS-114
    area: KEYS
    statement: "A locked key@ MUST give its card driver only a PinRelease whose signature it verified with the pin-release key that the signed KeyPlan's slot map holds for a listed, unrevoked peer."
    rationale: "Every PIN the card is sent counts against its retry limit, so a forged answer would block a tier-0 card (ADR 0006, Touch and PIN)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    issues: [914]
    verification:
      - {kind: integration-test, ref: "a tampered answer, one signed by an unlisted key, one under a listed name with another key, and one in the requester's own name are refused before the driver is called; the card is sent no PIN"}
  - id: REQ-KEYS-115
    area: KEYS
    statement: "A card PIN MUST NOT leave the card driver of key@ in clear: the driver seals it only to a request, and opens only an answer, that a peer's card driver wrote and signed with the pin-release key that the driver's own check of the signed KeyPlan lists for that peer."
    rationale: "A compromised key@ must not obtain the PIN or spend tries without a request or answer a listed peer's driver signed, and the PIN-never key signs no text of key@'s; revocation stays key@'s, as the driver cannot read the store, so a revoked peer still listed works until a re-signed KeyPlan drops it (ADR 0006, Touch and PIN)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    issues: [914]
    verification:
      - {kind: integration-test, ref: "two card drivers on test cards: Sign refuses pin-release; a forged or unlisted request, another boundary and a lower KeyPlan seq are refused; a wrongly signed answer is no PIN attempt"}
      - {kind: integration-test, ref: "a released PIN the card refused stops the release in the driver across a restart, until a person unlocks the board"}
      - {kind: integration-test, ref: "no answer of the key-store port carries a PIN"}
      - {kind: test-vectors, ref: "the driver and key@ read the slot map with one reader, which reads the shared KeyPlan payload vectors as store@ does"}
  - id: REQ-KEYS-228
    area: KEYS
    statement: "The card driver MUST end any PIN verification the card holds before it reports itself locked, by resetting the card session at its start, when it finds the card verified while it holds no PIN, and on a clean exit, and refuse to start or to unlock, with a reason, when the reset fails, another process holds the card, or the PIN counter still cannot be read."
    rationale: "A driver that ends leaves the card logged in, so a restarted driver that says locked would leave the keys open to whatever reaches the card service and could not read the counter that guards the unlock; the reset is a warm reset at the PC/SC layer, which leaves the keys, the PIN and the retry counters alone, and no PIN is sent without a successful counter read (ADR 0006, Touch and PIN)."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    tests:
      - drivers/key/yubikey-piv/internal/driver/cardreset_test.go
      - drivers/key/yubikey-piv/internal/card/piv_test.go
    verification:
      - {kind: integration-test, ref: "on a fake card: a card left verified is logged out at start, unlock, Status and a peer's release, with keys and counter unchanged; a failed or held reset sends no PIN"}
      - {kind: manual, ref: "on a real board: restart the card driver with pcscd running, then just boards-unlock and a peer's PIN release unlock it; the PIN counter is the same before and after"}
  - id: REQ-KEYS-076
    area: KEYS
    statement: "A new token-signing key MUST be pre-published before it signs for the lead time of the installation, which is 30 minutes by default (the key set's max-age, the edge cache time to live, 10 minutes for a verifier's throttled refetch and 5 minutes of clock skew, 25 minutes, rounded up to leave a margin), except a replacement under REQ-KEYS-089."
    rationale: "Every cache between sluis and a relying party must hold the key before the first token carries it, and the lead time follows from the cache budget that sluis publishes (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    issues: [774]
    verification:
      - {kind: integration-test, ref: "with the default lead time, a key joins the key set as pre-published, signs nothing for 30 minutes, and then becomes active"}
  - id: REQ-KEYS-077
    area: KEYS
    statement: "A node MUST move only the token-signing key that its own key@ holds through the states pre-published, active and retiring."
    rationale: "One node's rotation must not retire the key that another node is signing with; revoking another node's key is a tightening that REQ-KEYS-090 allows (ADR 0006, ADR 0041)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    issues: [774]
    verification:
      - {kind: integration-test, ref: "the signer of one node does not change the state of, or remove, a key whose node is another"}
  - id: REQ-KEYS-078
    area: KEYS
    statement: "A token-signing key MUST stay in the published key set for 65 minutes after it stops signing."
    rationale: "A token signed just before the change must verify for its whole life (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    issues: [774]
    verification:
      - {kind: integration-test, ref: "a retiring key is in the key set at 64 minutes and absent after 65 minutes with a moved clock"}
  - id: REQ-KEYS-079
    area: KEYS
    statement: "A retiring or revoked token-signing key MUST NOT become active again or return to the published key set."
    rationale: "A key that has begun to leave the key set, or has been revoked, must not return to signing or to the set (ADR 0006, ADR 0041)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [signer]
    standards: []
    issues: [774]
    verification:
      - {kind: integration-test, ref: "a retiring key stays retiring through every later rotation step"}
  - id: REQ-KEYS-080
    area: KEYS
    statement: "A node's first token-signing key MUST become active at once while no key in the key set is older than 15 minutes."
    rationale: "On a first deploy there is no cached key set to wait for (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    issues: [774]
    verification:
      - {kind: integration-test, ref: "three nodes start together and each key is active at once; a node added a day later pre-publishes for 30 minutes"}
  - id: REQ-KEYS-081
    area: KEYS
    statement: "The checkpoint key of an audit log MUST be a P-256 key that signs SHA-256."
    rationale: "A generic witness or checkpoint verifier checks the standard C2SP signature of type 0x02 only (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [838]
    verification:
      - {kind: test-vectors, ref: "a checkpoint the writer made through key@ opens with golang.org/x/mod/sumdb/note and a type 0x02 verifier written from the C2SP signed-note text"}
      - {kind: integration-test, ref: "the key plan check refuses an audit-log purpose that is not ES256"}
  - id: REQ-KEYS-082
    area: KEYS
    statement: "The chain data key of a tenant MUST be sealable by session alone and openable by session and exchange alone."
    rationale: "Session-chain facts are read by exchange, which must not hold the cookie key or a tenant's data key, and they are a tenant's personal data, so they are sealed under the tenant's key and erased with it (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [1208]
    tests: [actors/key/internal/keyd/seal_test.go, actors/session/internal/sessiond/token_test.go, actors/exchange/internal/exchanged/directory_store_test.go]
    verification:
      - {kind: integration-test, ref: "session seals and opens and exchange opens, by rule with no grant; exchange's seal and every other actor's seal or open are refused with the reason rule; another tenant's chain does not open"}
  - id: REQ-KEYS-083
    area: KEYS
    statement: "key@ MUST delete a generation of the chain data key of a tenant only after the longest time to live of a session chain has passed since that tenant's key last sealed under it."
    rationale: "A chain must stay readable for its whole life, and nothing sealed under an older generation may outlive it (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [key]
    standards: []
    issues: [1208]
    verification:
      - {kind: integration-test, ref: "a generation of a tenant's chain key is kept for 90 days after its last seal and deleted after that, with a moved clock; the generations of another tenant are not affected"}
  - id: REQ-KEYS-085
    area: KEYS
    statement: "signer MUST make a token-signing key active only after the lead time has passed since the key was written to the live key set."
    rationale: "A verifier can only have a key after it is published, so the lead time counts from the write and covers the cache budget of the key set; the read-back that proves the publication is REQ-KEYS-116 (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    issues: [1338, 1453]
    runtimes: all
    actors: [signer]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a new key stays pre-published until the lead time of 30 minutes after it is written to the live key set, and not a second less; the read-back from the public URL is REQ-KEYS-116"}
  - id: REQ-KEYS-086
    area: KEYS
    statement: "`sluis node unlock` MUST deliver the PIN to a locked key@ only over an authenticated channel."
    rationale: "A PIN that crosses an unauthenticated channel lets anyone who can reach the board unlock it (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    issues: [914]
    verification:
      - {kind: integration-test, ref: "ADR 0006 Touch and PIN: unlock runs as root over ssh with a checked host key; a PIN on the admin socket from a uid other than root is refused unread"}
  - id: REQ-KEYS-087
    area: KEYS
    statement: "When an operator declares a token-signing key compromised or suspected, key@ MUST write a KeyRevocation item for it at once, dated at the declaration, with neither the pre-publication period nor the retention period."
    rationale: "A healthy key needs those periods to move without breaking a verifier, and a stolen key must not wait for them; that the key leaves the key sets is REQ-KEYS-106 and REQ-KEYS-107 (ADR 0041)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    issues: [1361, 1362]
    runtimes: all
    actors: [key]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "declare a key: a KeyRevocation item dated at the declaration exists at once, holds no later effective time or retention, and key@ refuses a Sign with the key at once"}
  - id: REQ-KEYS-088
    area: KEYS
    statement: "sluis key revoke MUST report a revocation as not confirmed until it has fetched the published key set from its public address and the live key set of entry and found the kid absent from both."
    rationale: "A check that cannot run is reported as not run, a stale edge copy must not look like a finished revocation, and the edge falls back to the live key set (ADR 0041, ADR 0009)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    issues: [1361, 1362, 1454]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "the edge serves a stale key set after a revocation: the command prints not confirmed, and confirmed once the set lacks the kid"}
      - {kind: integration-test, ref: "the public address lacks the kid and the live key set of entry still lists it: the command prints not confirmed"}
      - {kind: integration-test, ref: "an address that is unreachable, slow, or answers something that is not a key set: the command prints could not tell and not confirmed, and exits 5"}
      - {kind: integration-test, ref: "a key listed under another kid or none, found by its RFC 7638 thumbprint, is still listed; a duplicate or case-variant member in the answer is could not tell"}
      - {kind: integration-test, ref: "the kids to look for are those of the signed declaration, whatever key@ answered; with none the command prints not confirmed"}
  - id: REQ-KEYS-089
    area: KEYS
    statement: "A replacement for a revoked token-signing key MUST sign at once when no other key of the issuer is active, with its key set published and purged at the edge before its first token."
    rationale: "Waiting for the lead time would stop every sign-in of a single-key installation, and a verifier that does not fetch the key set again on an unfamiliar kid is broken against the standard (ADR 0041)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    issues: [1361, 1362]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "revoke the only key: the replacement is active in the ring and signs once entry can list it; a normal rotation still waits. The edge purge is REQ-EXPORT-021"}
  - id: REQ-KEYS-090
    area: KEYS
    statement: "The signer of any node and the operator command MUST each be able to relay an operator's declaration to key@ so that it revokes the token-signing key of any node."
    rationale: "A compromised or stopped owner must not decide whether its own key leaves, and the relay needs no initiative of its own (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1361]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "node B relays a declaration for node A's key while A is down; the item exists and the key set lacks the key"}
  - id: REQ-KEYS-091
    area: KEYS
    actors: [store]
    statement: "store@ MUST refuse an update, a delete and an apply on KeyRevocation, for every caller, an apply even at an address that holds no item."
    rationale: "A revocation is terminal, and the direction rule alone would still allow a delete; Lease allows an update, so its rule is not the model (ADR 0041, ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    issues: [1362]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "an update, a delete and an apply on KeyRevocation are refused for every actor, key@ included, an apply on a free address too; a create is accepted"}
  - id: REQ-KEYS-092
    area: KEYS
    statement: "sluis MUST provide a command that revokes the keys a declaration names, with a reason, as KeyRevocation items, and that works while the actor of the compromised node is down."
    rationale: "One revocation path for every kind lets an operator act without a deploy, and a declaration names exact keys, never a purpose, because a key a ceremony put on a card has no age that a cutoff could be compared with (ADR 0041, principle 12)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    issues: [1362]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "the command writes and delivers a signed declaration; another node's key is revoked from this node; a data key generation and a recipient with one node stopped"}
  - id: REQ-KEYS-093
    area: KEYS
    statement: "A peer MUST release a PIN only to a board that the KeyPlan lists and KeyRevocation does not revoke."
    rationale: "A stolen board that reconnects must not be given its PIN, and a board that is merely unlisted or revoked is the same case (ADR 0041)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    actors: [key]
    issues: [914, 1365]
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "a board that is unlisted, and one that is revoked, ask for their PIN: both refused with an audit fact; a listed board is answered"}
  - id: REQ-KEYS-094
    area: KEYS
    statement: "key@ MUST make no wrap for a revoked recipient in any new data key."
    rationale: "A lost or stolen board must not receive access to any data key made after its revocation (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1365]
    runtimes: ["bare-metal"]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "revoke a board: a new data key has no wrap for it and the other boards still open it"}
  - id: REQ-KEYS-095
    area: KEYS
    statement: "key@ MUST refuse every Open under a compromised generation of the grant, cookie or chain data key."
    rationale: "These keys protect integrity: a forged value is the threat, so it must stop working at once, while a confidentiality key goes on opening because the thief already holds it (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "per purpose (grant, cookie, chain): declare, then an Open under the old generation is refused and the new generation opens"}
  - id: REQ-KEYS-096
    area: KEYS
    statement: "key@ MUST re-seal the values of a compromised generation of the data key under the new one as a paginated, asynchronous and idempotent job."
    rationale: "The three properties are one job: it runs over a store of any size in pages, in the background, and is run again after a failure without harm; pseudonym seals nothing and evidence is append-only, so neither has a job (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "stop the job half way and run it again: every value of a tenant's data key and of the boundary's data key opens under the new generation"}
  - id: REQ-KEYS-097
    area: KEYS
    statement: "The compromise of the cookie data key MUST end every browser session of the boundary at the next request."
    rationale: "A forged session cookie must stop working, and people sign in again (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "declare the cookie key: the next request with an old cookie is refused and a refresh-token chain still works"}
  - id: REQ-KEYS-098
    area: KEYS
    statement: "sluis MUST provide a command that changes a card PIN and delivers the new PIN to the key@ of the board over the unlock channel."
    rationale: "A suspected PIN has no remedy short of replacing the board without it (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1365]
    runtimes: ["bare-metal"]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "change the PIN on a virtual card, then the board unlocks with the new one and not the old"}
      - {kind: manual, ref: "rehearsal on a real card"}
  - id: REQ-KEYS-099
    area: KEYS
    statement: "key@ MUST disable a compromised AWS wrapping key only after every wrap has been rewrapped under its replacement."
    rationale: "Disabling first would lose the data, and automatic key rotation keeps the old key material (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1372]
    runtimes: [serverless, kubernetes]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "replace the wrapping key of a test boundary: the old key is disabled after the last rewrap and not before, and every value opens"}
  - id: REQ-KEYS-100
    area: KEYS
    statement: "On AWS key@ MUST also wrap every data key for the offline recovery recipient."
    rationale: "A disabled wrapping key must not make every old archive unreadable (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1372]
    runtimes: [serverless, kubernetes]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a data key made on AWS has a wrap for the recovery recipient that the ceremony tooling opens"}
  - id: REQ-KEYS-101
    area: KEYS
    statement: "On a declared compromise of the grant, cookie, chain, data or evidence data key, key@ MUST make a new generation that every later Seal uses."
    rationale: "New values must not be sealed under a key the thief holds; mac and pairwise are accepted risks, and pseudonym seals nothing (its new epoch is REQ-AUDIT-164) (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "per purpose (grant, cookie, chain, data, evidence): declare, then the next Seal uses the new generation; for mac and pairwise the declaration is refused as not supported"}
  - id: REQ-KEYS-102
    area: KEYS
    statement: "key@ MUST refuse every Seal under a compromised generation of the grant, cookie, chain, data or evidence data key."
    rationale: "A stale cache or a slow caller must not seal new values under it; mac and pairwise are accepted risks (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a Seal that names the old generation is refused for each of the five purposes; on Lambda, after the time to live of the cache"}
  - id: REQ-KEYS-103
    area: KEYS
    statement: "key@ MUST keep opening a compromised generation of a tenant's data key and of the boundary's data key until the re-seal job has rewritten every value sealed under it."
    rationale: "The thief already holds the key, so refusing opens protects nothing and only takes the data offline (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "declare the data key: a value sealed before the declaration opens until the job ends and under the new generation after"}
  - id: REQ-KEYS-104
    area: KEYS
    statement: "key@ MUST delete the wraps of a compromised generation of the data key when the re-seal job ends."
    rationale: "The old generation must not outlive the values it sealed (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "after the job the old wraps of the tenant's and the boundary's data key are gone and every value opens"}
  - id: REQ-KEYS-105
    area: KEYS
    statement: "key@ MUST delete the existing wraps of a revoked recipient."
    rationale: "A lost or stolen board must not keep access to the data keys it already received (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1365]
    runtimes: ["bare-metal"]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "revoke a board: its existing wraps are deleted and the other boards still open"}
  - id: REQ-KEYS-106
    area: KEYS
    statement: "signer MUST NOT promote or sign with a kid that KeyRevocation lists."
    rationale: "A revoked key must not return to signing even if its own node writes the ring (ADR 0041)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    issues: [1361, 1362]
    runtimes: all
    actors: [signer]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "the owner node of a revoked key tries to make it active and to sign: both refused"}
  - id: REQ-KEYS-107
    area: KEYS
    statement: "entry and signer MUST omit every kid that KeyRevocation lists from every key set they serve."
    rationale: "The omission is a filter at publication, so it does not depend on signer or on the node that owns the key; the static key set of exporter@ is REQ-EXPORT-020 (ADR 0041)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    issues: [1361, 1362]
    runtimes: all
    standards: []
    actors: [entry, signer]
    verification:
      - {kind: integration-test, ref: "revoke a key: the next live key set lacks its kid, and a token it signed fails against the set"}
  - id: REQ-KEYS-116
    area: KEYS
    split_from: REQ-KEYS-085
    statement: "signer MUST NOT make a token-signing key active unless the ExportReport of every published key set has the state published, lists the kid of the key and has a read back at most 26 hours old."
    rationale: "When exporter@ cannot tell what is published, a key could sign before a verifier can have it; 26 hours is a day of the reconcile and a margin, and a destination that cannot read back is not counted (ADR 0009)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1453, 1362]
    runtimes: all
    actors: [signer]
    standards: []
    verification:
      - {kind: integration-test, ref: "a report that is unverified, absent, without the kid or older than 26 hours keeps a pre-published key pre-published; a published report with the kid lets it become active after the lead time"}
  - id: REQ-KEYS-108
    area: KEYS
    statement: "key@ MUST write a KeyRevocation item only on a key revocation declaration for its boundary that a publisher key of its bootstrap file signed."
    rationale: "Only a person declares; a signal or a signer acting on its own would let an attacker use the alarm to stop sign-in, and the publisher's signature needs neither the token keys nor sign-in, which a compromise may have taken (ADR 0041, The declaration; principle 7)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    issues: [1361, 1362]
    runtimes: all
    actors: [key]
    standards: []
    verification:
      - {kind: integration-test, ref: "tampered, unpinned, other-kind and other-boundary declarations and another user on the admin socket are refused and write nothing; a signed one writes an item per key"}
  - id: REQ-KEYS-109
    area: KEYS
    statement: "key@ MUST refuse a Sign with any key that KeyRevocation lists, whatever the signing purpose."
    rationale: "A revoked key signs nothing more, for every signing purpose and whichever actor asks; a revocation names the key by its kid, so its replacement signs; an unreadable KeyRevocation is refused (ADR 0041)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    issues: [1362, 1369]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "revoke a key of each signing purpose: a Sign with it is refused and audited; another key of the purpose signs; an unreadable KeyRevocation refuses the Sign"}

  # ---- a person binds their own keys to their identity (decision 0043)
  - id: REQ-KEYS-122
    area: KEYS
    statement: "sluis MUST accept a key binding only with a possession signature of the challenge that sluis issued for that person, boundary and card, made by every subkey in the bundle."
    rationale: "A card that cannot sign the challenge is not present, and an attestation certificate is public, so a subkey without its own proof could be copied from another person (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bind lacking the signature of any one subkey, with a signature by another key, or over another challenge, is refused; a bind with a correct signature by every subkey succeeds"}
  - id: REQ-KEYS-123
    area: KEYS
    statement: "sluis MUST refuse a staff key binding unless the person has a hardware-attested sign-in within the age that policy sets, verified by the boundary that holds the binding."
    rationale: "Binding a key is a privileged act, and an upstream claim or a synced passkey must not meet it (ADR 0043, PK1 A)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bind after a synced-passkey or upstream sign-in, or a hardware-attested one older than the age, is refused; a fresh hardware-attested sign-in is accepted"}
  - id: REQ-KEYS-124
    area: KEYS
    statement: "sluis MUST record each accepted key binding with the person, the key identity, the kind, the class, the bound set, the attestation as received, the time created, the expiry and the state."
    rationale: "Everything sluis does with a card follows from the binding, so the record must hold what the later checks need (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "after a bind the stored KeyBinding item holds each field, is ciphertext at rest, and is erased with the person"}
  - id: REQ-KEYS-125
    area: KEYS
    statement: "sluis MUST refuse a key binding whose attestation does not verify to the one vendor root that config pins."
    rationale: "A forged statement is an incident and must not be downgraded to an unattested key, and a second root widens what is trusted (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a statement with a broken chain, a chain to the old Yubico root or another unpinned root, and a statement for another public key are each refused and audited"}
  - id: REQ-KEYS-126
    area: KEYS
    statement: "sluis MUST give a card whose attestation verified but whose firmware or form factor is not on the allowlist the class hardware-unlisted and not hardware-attested."
    rationale: "Only the cards the installation vouches for may sign for the company (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a verified statement with a form factor off the list and one with a firmware below the list yield hardware-unlisted; a listed card yields hardware-attested"}
  - id: REQ-KEYS-127
    area: KEYS
    statement: "sluis MUST give a key that came with no attestation the class unattested."
    rationale: "A key that sluis cannot show to be on a card must never count as a card key (ADR 0043, BK2 A)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bind with no attestation is recorded with class unattested and is refused by every action that demands hardware-attested"}
  - id: REQ-KEYS-128
    area: KEYS
    statement: "sluis MUST decide what a key binding may be used for by a policy rule on the class of the binding."
    rationale: "Each class differs in what it proves, and an installation decides what that is worth (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a policy that permits an action to one class only: the action succeeds for that class and is refused for the other two"}
  - id: REQ-KEYS-129
    area: KEYS
    statement: "sluis MUST sign the binding of a subkey under a person's primary only for a binding of class hardware-attested."
    rationale: "Staff company signing accepts card-born keys only, with no software or unattested fallback (ADR 0043, BK2 A, G1 A)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "bindings of class hardware-unlisted and unattested are recorded and no subkey of theirs is bound under the primary; a hardware-attested binding is bound"}
  - id: REQ-KEYS-130
    area: KEYS
    statement: "sluis MUST certify a person's primary so that a web-of-trust verifier that trusts only the company root validates it through the root's trust signature and the company key's certification."
    rationale: "The root stays offline, and a verifier that trusts only the root must accept the company's people and nobody else under the domain (ADR 0043, ADR 0024)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: test-vectors, ref: "test vectors with gpg (root trusted) and sq-wot: a certified primary validates from the root alone; one certified by another key, or for another domain or a subdomain, does not"}
  - id: REQ-KEYS-131
    area: KEYS
    statement: "sluis MUST give a person's primary exactly one user ID, the person's verified company address in the domain of the trust signature, and certify only that user ID."
    rationale: "A certification of another person's address would let a key sign in that person's name (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a primary gets one user ID; an unverified address, another person's address and a foreign domain are never given or certified"}
  - id: REQ-KEYS-132
    area: KEYS
    statement: "sluis MUST set the expiry of a certification no later than the expiry of the primary and no later than 395 days after it is made."
    rationale: "A certification outlives a leaver only until it expires (ADR 0043, ADR 0024)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a certification made at the maximum expires after 395 days at most, and one for a primary that expires sooner expires with it"}
  - id: REQ-KEYS-133
    area: KEYS
    statement: "sluis MUST require, before it adds a binding to a person who holds an active hardware-attested binding, a vouch signature by that binding's signing subkey over a challenge issued within 600 seconds that names the new card's signing subkey and set."
    rationale: "Attestation shows that a card is genuine and not whose it is, so a stolen session must not be able to add a card of its own (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "an add with no vouch, a stale one, one by another person's key, one with another action, or one naming another set is refused; a fresh vouch by the person's bound signing subkey is accepted"}
  - id: REQ-KEYS-134
    area: KEYS
    statement: "sluis MUST record a binding of any class for a person who has no active hardware-attested binding only after approval by another person who holds the identity-administration grant and presents a fresh hardware-attested assertion."
    rationale: "The first card, and a card after every card was lost or ended, has no earlier card to vouch for it, and a directory change cannot show whose device it is (ADR 0043, FB1 A)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bind of each class approved by no one, the person, a directory fact, or an operator with a stale assertion or no grant is refused; another operator with a fresh assertion is accepted"}
  - id: REQ-KEYS-135
    area: KEYS
    statement: "sluis MUST write an audit record for every key bind, refusal and end."
    rationale: "A binding is the root of a person's signing identity, so every change to it must be findable (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a successful bind, a refusal for each reason and an end each leave one audit record with the fingerprint, the class and the outcome"}
  - id: REQ-KEYS-136
    area: KEYS
    statement: "sluis MUST alert the operators, with the fingerprint, the class and the card serial, when a hardware-attested binding is recorded."
    rationale: "A rogue subkey is only caught if the operators see each new card and can compare it with their own purchase register (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a new binding raises one operator alert that holds the fingerprint, the class and the serial"}
  - id: REQ-KEYS-137
    area: KEYS
    statement: "sluis MUST build a company's staff keyring only from the certificates of people with an active hardware-attested binding, each holding only its bound set."
    rationale: "The keyring is a view of the bindings, so no key is in it that sluis did not bind (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "the keyring holds exactly the certificates of people with an active hardware-attested binding; a person whose bindings are ended, revoked, of another class or not yet bound is absent"}
  - id: REQ-KEYS-138
    area: KEYS
    statement: "sluis MUST re-certify a person's primary and renew its expiry from 60 days before the certification ends, with no person present, while the person has an active binding, is live in the directory and the primary is not revoked."
    rationale: "The yearly renewal of every person's certification must not be work for a person (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "with a clock moved to day 335 an active person gets a new certification of 395 days and a renewed primary; one marked left, or without an active binding, does not"}
  - id: REQ-KEYS-139
    area: KEYS
    statement: "sluis MUST leave every other active binding of a person unchanged when it ends one of that person's bindings."
    rationale: "A second card is a separate binding, and a lost card must not end the person's work (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a person with two bindings has one ended: the other stays active, bound and in the keyring"}
  - id: REQ-KEYS-140
    area: KEYS
    statement: "sluis MUST set a binding to revoked at once when its person declares the card compromised after a fresh hardware step-up."
    rationale: "A compromised key must leave at once, and only a person declares (ADR 0043, ADR 0041)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a declaration after a fresh hardware step-up sets the binding to revoked in the same call; one by a session without it is refused"}
  - id: REQ-KEYS-141
    area: KEYS
    statement: "sluis MUST end every binding of a person whom the directory marks left."
    rationale: "A leaver's keys stop being renewed, leave the keyring and are removed by the sync (ADR 0043, G5 A)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a person marked left with two bindings has both ended, neither is renewed, and the person is not in the next keyring"}
  - id: REQ-KEYS-142
    area: KEYS
    statement: "sluis MUST refuse a key binding for a subkey whose key identity, the hash of its public key material, belongs to any binding in the boundary in any state, including ended and revoked."
    rationale: "The fingerprint covers a creation time that the holder chooses, so one card key could be bound twice under it, and a revoked key must never be bindable again (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "the same subkey bound again, with another creation time, by a second person, or after its binding ended or was revoked, is refused"}
  - id: REQ-KEYS-143
    area: KEYS
    statement: "sluis MUST refuse a key binding request that carries private key material."
    rationale: "The company must never hold the private part of a card's key (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a request that holds a secret key packet, or an SSH private key, is refused and the material is not stored or logged"}
  - id: REQ-KEYS-146
    area: KEYS
    statement: "sluis MUST give each key binding an expiry of at most the bound that policy sets, 1095 days by default, and carry it in the binding signature of each subkey."
    rationale: "A card that is lost or forgotten stops being trusted by itself, and the card's proof extends it (ADR 0043, PX1)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a binding made with no bound is given 1095 days; a request for a longer expiry is refused; the subkey binding signature holds the expiry"}
  - id: REQ-KEYS-147
    area: KEYS
    statement: "sluis MUST extend a binding, keeping it, only after a fresh hardware step-up and an extend challenge signed by every subkey whose set equals the stored set and whose expiry is later and within the bound."
    rationale: "Extending at the card must not add or swap a key, so the binding and its place in the keyring and on GitHub are kept, and a tap for an extension must not authorise a wider set (ADR 0043, PX1)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "an extension with the stored set updates the expiry and keeps the binding; another set, an earlier expiry, a missing subkey signature and a missing step-up are refused"}
  - id: REQ-KEYS-148
    area: KEYS
    statement: "sluis MUST issue a binding challenge of the eleven fixed lines of ADR 0043, with the label, the action, the tenant, the person, the boundary, the signing key, the target key, the set, the expiry, a nonce of 256 random bits and a not-after 600 seconds ahead."
    rationale: "A fixed, named challenge that commits to the tenant, the set and the expiry cannot be mistaken for another use, and a tap for one thing cannot authorise another (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "two challenges differ in the nonce; each has exactly eleven lines in order with the label first, a 64-digit set and nonce, and a not-after 600 seconds ahead"}
  - id: REQ-KEYS-149
    area: KEYS
    statement: "sluis MUST accept a binding challenge once, before it expires, and only from the session that asked for it."
    rationale: "A replayed or borrowed signature must not bind a key (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a second use of a challenge, a use after 600 seconds and a use from another session are each refused"}
  - id: REQ-KEYS-150
    area: KEYS
    statement: "sluis MUST refuse a possession signature that is not an OpenPGP standalone signature, type 0x02, that holds the challenge in a critical hashed notation."
    rationale: "A type 0x00 signature over text is hashed with its data and lenient formats tolerate extra lines, so only a type 0x02 signature separates the proof from every other use (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a type 0x00 signature over the challenge, a type 0x02 without the notation and one with the notation not critical are refused; the type 0x02 critical form is accepted"}
  - id: REQ-KEYS-151
    area: KEYS
    statement: "sluis key bind MUST read the staff key bundle v1, the files .subkey.pgp, .proof.json and .possession.sig, and nothing else."
    rationale: "Standard files with shared test vectors keep sluis and ritueel apart in code and together in format (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: test-vectors, ref: "the bundle vectors shared with ritueel are accepted, and a bundle with a missing file or an unknown version is refused"}
  - id: REQ-KEYS-152
    area: KEYS
    statement: "sluis MUST NOT accept an allowlist that admits a firmware below 5.7.4."
    rationale: "Older cards chain to a root that sluis does not pin and their statements cannot be verified (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "config check refuses an allowlist with a minimum firmware below 5.7.4 and accepts one at or above it"}
  - id: REQ-KEYS-153
    area: KEYS
    statement: "sluis key install MUST refuse a company certification key whose trust signature lacks the anchored expression for one exact domain, or has a trust depth above 1."
    rationale: "A trust signature without a domain limit would let the key vouch for any address (ADR 0043, ADR 0024)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a trust signature with no expression, a subdomain-permitting one or depth 2 is refused; the expression for one exact domain at depth 1 is installed"}
  - id: REQ-KEYS-154
    area: KEYS
    split_from: REQ-KEYS-129
    statement: "sluis MUST hand only certificates of people with a hardware-attested binding, with only their bound sets, to the GitHub key sync."
    rationale: "Syncing a key puts it on a personal account as the company's, which only a card key may be (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "bindings of class hardware-unlisted and unattested are never returned to the sync; a hardware-attested binding is returned"}
  - id: REQ-KEYS-155
    area: KEYS
    split_from: REQ-KEYS-136
    statement: "sluis MUST notify the person at a verified address of theirs, with the fingerprint, when a hardware-attested binding is recorded."
    rationale: "The person is the first to know that a card was bound in their name (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a new binding sends one notice to the person's verified address that holds the fingerprint"}
  - id: REQ-KEYS-156
    area: KEYS
    split_from: REQ-KEYS-140
    statement: "sluis MUST revoke the subkeys of a binding with a subkey revocation signature of the person's primary when the person declares the card compromised."
    rationale: "Verifiers that read the certificate must stop trusting a compromised subkey (ADR 0043, ADR 0041)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "after a declaration each subkey of the binding carries a revocation signature by the primary and the other binding's subkeys do not"}
  - id: REQ-KEYS-157
    area: KEYS
    split_from: REQ-KEYS-140
    statement: "sluis MUST put a subkey on the withdrawn list of the next staff keyring when its binding is revoked, ended or has lapsed."
    rationale: "Verifiers that use the keyring learn of a bad key from the list (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "after a revocation, an end and a lapse the key identity appears on the withdrawn list with its reason and date, and not in staff.gpg"}
  - id: REQ-KEYS-158
    area: KEYS
    statement: "sluis MUST alert the operators 30 and 14 days before a certification ends when it has not been renewed."
    rationale: "A broken renewal must be seen while there is time to fix it (ADR 0043, ADR 0024)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "with renewal disabled and a clock moved, one alert is raised at 30 days and one at 14 days before the end"}
  - id: REQ-KEYS-159
    area: KEYS
    statement: "sluis MUST warn the person and the operators 60, 30 and 14 days before the expiry of a binding."
    rationale: "A binding that is not extended lapses, and only the card can prove the extension (ADR 0043, PX1)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "with a clock moved to 60, 30 and 14 days before a binding's expiry the person and the operators each get one warning"}
  - id: REQ-KEYS-160
    area: KEYS
    statement: "sluis MUST refuse to bind a card whose bundle carries a subkey with no verified attestation of its own."
    rationale: "A software copy of a subkey could sign as the person and would sit in the company's keyring (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bundle with a subkey made in software is refused; one whose subkeys each have a verified statement is bound"}
  - id: REQ-KEYS-161
    area: KEYS
    statement: "sluis MUST store, list in the keyring and sync only the bound set: the primary, its one user ID with the certification, and the subkeys attested at bind time, with their signatures."
    rationale: "Anything else in a submitted bundle could carry a capability that was never checked (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bundle submitted with a photo, a foreign user ID and a third-party signature yields a stored and published certificate that holds none of them"}
  - id: REQ-KEYS-162
    area: KEYS
    statement: "sluis MUST treat any subkey added to or removed from a binding as a change that needs a fresh hardware step-up, a possession signature by the signing subkey, a back-signature and an attestation for each new subkey."
    rationale: "A change can widen what is bound, so it needs the person at the card, and it is not a second bind of the same card (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a new subkey needs the proof and the checks and then keeps the binding; a new subkey with no statement, no back-signature or no proof is refused"}
  - id: REQ-KEYS-163
    area: KEYS
    statement: "sluis MUST end a binding only on an end challenge signed by another active hardware-attested binding of the person, or on approval by another person who holds the identity-administration grant."
    rationale: "A stolen session must not end the good card and then ask for a re-binding (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "an end by a session alone is refused; an end signed by another binding, and one approved by an operator, succeed"}
  - id: REQ-KEYS-164
    area: KEYS
    statement: "sluis MUST sign a company's staff keyring manifest with a keyring-signing key that is not the company's certification key."
    rationale: "One compromise must not give an attacker both the power to certify and the power to publish (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "the manifest verifies under the keyring-signing key; a manifest signed by the certification key does not verify, and the two keys differ"}
  - id: REQ-KEYS-165
    area: KEYS
    statement: "sluis MUST publish the staff keyring as the files staff.gpg, staff.withdrawn and staff.manifest with a detached signature, the manifest holding the digests, a rising sequence number and a time after which it must not be used."
    rationale: "The CI check of commit signers and gpgv need a file whose age and integrity a verifier can check (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a published set verifies with gpgv; a lower sequence number, a wrong digest and an expired manifest are each refused"}
  - id: REQ-KEYS-166
    area: KEYS
    statement: "signer MUST refuse to certify a primary once the company certification key is on the key revocation list."
    rationale: "A compromised certification key must stop certifying at once, before ritueel acts (ADR 0043, ADR 0041)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "after the certification key is revoked a certification request is refused and audited, and no certification is made"}
  - id: REQ-KEYS-167
    area: KEYS
    statement: "sluis MUST re-certify the primary of every person of a company under the new certification key after the root has replaced the old one."
    rationale: "The bindings are the record, so a replacement needs no card and no person (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "after a replacement each active person's primary has a certification by the new key and none by the old one"}
  - id: REQ-KEYS-168
    area: KEYS
    statement: "sluis MUST NOT write the serial number of a card into an audit record, a token, a log line or the staff keyring."
    rationale: "The serial identifies one device; operators see it in the binding, and nothing else carries it (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bind with a known serial leaves it in the stored statement and the operator alert, and in no audit record, log line, token or keyring file"}
  - id: REQ-KEYS-171
    area: KEYS
    statement: "sluis MUST bind a signing subkey only with an embedded back-signature, type 0x19, made by that subkey over the person's primary and the subkey, and verified against the primary that key@ holds."
    rationale: "OpenPGP requires it so that nobody can claim another's signing key, and it proves the card agrees to be a subkey of this primary (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a signing subkey with no back-signature, one over another primary and one by another key are refused; one with a valid back-signature is bound and the signature is embedded"}
  - id: REQ-KEYS-172
    area: KEYS
    statement: "key@ MUST generate a person's primary key inside key@ and keep it only sealed under the person-key data key of the person's tenant."
    rationale: "The primary is the one key per person that sluis holds, so it must never exist outside key@ in clear (ADR 0043, BD1 B)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "after a primary is made the stored PersonPrimary is ciphertext, and no store, log, backup or response holds the private key in clear"}
  - id: REQ-KEYS-173
    area: KEYS
    statement: "key@ MUST use a sealed primary only to make signatures of that person's own certificate, each for a grant that policy sealed."
    rationale: "The primary signs no data, so a caller cannot turn it into a signing oracle (ADR 0043, BD1 B)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a request to sign a document, a commit or a certificate of another person with a sealed primary is refused; a binding of that person's own subkey with a grant succeeds"}
  - id: REQ-KEYS-174
    area: KEYS
    statement: "key@ MUST refuse to open a sealed primary with the person-key data key of another tenant."
    rationale: "A compromise of one company's data key must not open another company's primaries (ADR 0043, BD1 B)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a PersonPrimary of tenant A cannot be opened with the key of tenant B, and the attempt is refused and audited"}
  - id: REQ-KEYS-175
    area: KEYS
    statement: "key@ MUST write an audit record for every use of a sealed primary."
    rationale: "A quiet use of a person's primary is what detection has to catch (ADR 0043, BD1 B)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "each binding, revocation, user ID signature and renewal that opens a primary leaves one audit record that names the person and the grant"}
  - id: REQ-KEYS-176
    area: KEYS
    statement: "key@ MUST NOT return the private part of a primary to any caller."
    rationale: "The primary stays inside key@ for its whole life (ADR 0043, BD1 B)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "no key@ operation returns primary key material; an export request is refused"}
  - id: REQ-KEYS-177
    area: KEYS
    statement: "sluis MUST certify a person's primary only with the certification key of that person's own company."
    rationale: "No online key may serve two companies, so one compromise reaches one company (ADR 0043, BD1 B)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a primary of company A is certified by company A's key only; a request to certify with company B's key is refused"}
  - id: REQ-KEYS-178
    area: KEYS
    statement: "sluis MUST sign a company's staff keyring only with that company's own keyring-signing key."
    rationale: "One company's keyring key must not publish another company's keyring (ADR 0043, BD1 B)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a manifest of company A verifies under company A's keyring-signing key and not under company B's"}
  - id: REQ-KEYS-179
    area: KEYS
    statement: "sluis MUST replace the user ID of a person's primary when the person's company address changes in the directory, only to an address the company's directory owns in the domain of the trust signature, by certifying the new and revoking the old, and keep exactly one."
    rationale: "One company address per primary keeps verifiers and GitHub from trusting a stale address (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "after an address change the primary has one live user ID, the new address, certified, and the old one revoked; an address outside the domain or not owned by the directory is refused"}
  - id: REQ-KEYS-180
    area: KEYS
    statement: "sluis MUST accept a signature by a customer's bound key only for the tenant in which the key is bound."
    rationale: "A customer's key is for that company only (ADR 0043, BD2 B)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a signature by a key bound in tenant A is accepted for tenant A and refused for tenant B"}
  - id: REQ-KEYS-181
    area: KEYS
    statement: "sluis MUST NOT certify, list in a staff keyring or sync to GitHub a key that a customer bound."
    rationale: "A customer's key never signs for the company (ADR 0043, BD2 B)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a customer's bound key is never given to the certifier, the keyring producer or the key sync"}
  - id: REQ-KEYS-182
    area: KEYS
    statement: "sluis MUST record a customer's first binding only after approval, once the bundle has arrived and naming its key, by another person who holds the identity-administration grant of that tenant and presents a fresh hardware-attested assertion."
    rationale: "The approval is what ties a key to the customer, and a tenant admin approves only their own customers (ADR 0043, BD2 B)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a first customer bind approved by no one, the customer, an admin of another tenant, or before the bundle is refused; an admin of the tenant with a fresh assertion naming the key is accepted"}
  - id: REQ-KEYS-183
    area: KEYS
    statement: "sluis MUST NOT require a customer to bind a key unless the policy of the tenant demands one for an action."
    rationale: "A customer is not asked for a key by default (ADR 0043, REQ-SESS-037)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a customer who has bound no key signs in and uses every action whose policy does not demand a key; an action whose policy demands one is refused with a reason"}
  - id: REQ-KEYS-184
    area: KEYS
    statement: "sluis MUST NOT use a customer's bound key to authenticate a sign-in."
    rationale: "A bound key is a signing key and never a factor, which REQ-SESS-037 forbids enrolling for a customer (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a sign-in presented with a bound customer key is refused; the key is accepted only for signing data"}
  - id: REQ-KEYS-185
    area: KEYS
    statement: "sluis MUST require a customer's key binding to follow a re-authentication at the customer's upstream within the age that policy sets."
    rationale: "A customer has no hardware step-up, so the upstream's step-up is the freshness that sluis can ask for (ADR 0043, REQ-SESS-036)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a customer bind after an old upstream sign-in is refused with a step-up request; a bind after a fresh re-authentication proceeds to approval"}
  - id: REQ-KEYS-186
    area: KEYS
    statement: "sluis MUST accept data that a customer signs for a tenant only as a JWS, RFC 7515, made by a key bound by that customer in that tenant."
    rationale: "One signature format keeps verification in sluis simple, and tokens are JOSE already (ADR 0043, CU1 A)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a JWS by the bound key verifies; an OpenPGP signature, a JWS by an unbound key and a JWS by a key bound in another tenant are refused"}
  - id: REQ-KEYS-187
    area: KEYS
    statement: "sluis MUST verify a customer's JWS against the customer's active binding in the tenant and write an audit record of the outcome."
    rationale: "The binding state lives in sluis, so sluis must be the verifier and the keeper of the evidence (ADR 0043, CU2 A)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a JWS by an active binding verifies and is audited with the tenant, the key identity and the outcome; one by an ended, revoked or expired binding is refused and audited"}
  - id: REQ-KEYS-188
    area: KEYS
    statement: "sluis MUST NOT let a tenant's policy waive the approval of a customer's first key binding."
    rationale: "The approval is what ties a key to the customer (ADR 0043, CU3 A)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a tenant policy that sets a waiver is refused by config check, and a first customer bind with no approval is refused whatever the policy"}
  - id: REQ-KEYS-189
    area: KEYS
    statement: "sluis MUST accept a customer's key binding only for a JWK in the first version."
    rationale: "The first version supports one format for customers (ADR 0043, CU4 A)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a customer bind with a JWK proceeds; a customer bind with an OpenPGP key is refused with a reason"}
  - id: REQ-KEYS-190
    area: KEYS
    statement: "key@ MUST make a person-key data key for each tenant that issues staff keys, separate from the tenant's other data keys."
    rationale: "The sealed primaries of one company must open only with that company's own key (ADR 0043, EX1 A)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a tenant that issues staff keys has a person-key data key; no other data key of the tenant, and no person-key of another tenant, opens a PersonPrimary"}
  - id: REQ-KEYS-191
    area: KEYS
    statement: "sluis MUST take the key identity of a customer's JWK from its RFC 7638 thumbprint and accept its possession proof only as a JWS over the challenge lines, signed by the key being bound."
    rationale: "The customer's proof has the same freshness as a staff proof, in the customer's format (ADR 0043, CU1 A)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bind with a JWS over the challenge by the JWK succeeds; a JWS over other bytes, an expired challenge and a JWS by another key are refused"}
  - id: REQ-KEYS-192
    area: KEYS
    statement: "sluis MUST refuse a key binding whose bundle carries an encryption-capable subkey."
    rationale: "Staff keys have no encryption subkey, because a lost card would lose the mail it decrypted, and a bound encryption key could not be replaced (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bundle with an encryption subkey is refused; a bundle with a signing subkey and an authentication subkey is bound"}
  - id: REQ-KEYS-193
    area: KEYS
    statement: "sluis MUST compute the key identity of an OpenPGP ECDSA P-384 subkey as the SHA-256 of the algorithm octet 0x13, the OID length octet, the OID and the MPI of the public point as the key packet carries it."
    rationale: "A fixed byte layout makes the identity the same in sluis and in ritueel, whatever the creation time (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: test-vectors, ref: "the published key vector yields the published key identity; the same key with another creation time yields the same identity and another fingerprint"}
  - id: REQ-KEYS-194
    area: KEYS
    statement: "sluis key bind MUST read proof.json only as an object with the members bundle, subkey_sha256, primary, key and subkeys, and refuse a file whose subkey_sha256 is not the SHA-256 of the .subkey.pgp bytes."
    rationale: "Both repositories share the member names, and the proof must not be movable to another file (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: test-vectors, ref: "a proof.json with every member and the right digest is read; a missing member, an unknown bundle number and a wrong digest are each refused"}
  - id: REQ-KEYS-195
    area: KEYS
    statement: "sluis MUST verify an OpenPGP ECDSA signature whose r or s MPI has fewer octets than the curve size by padding it to the curve size first."
    rationale: "An MPI strips leading zero octets, and a verifier that does not pad rejects about one signature in 128 (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: test-vectors, ref: "the published challenge signature, whose s has a leading zero octet, verifies; a signature with neither padded verifies; a damaged r or s does not"}
  - id: REQ-KEYS-196
    area: KEYS
    statement: "policy MUST seal a primary-use grant that names the tenant, the person, the action, the subkey key identity, the approved expiry, the digests of the evidence and a 60-second expiry."
    rationale: "A reusable grant would let a compromised caller bind arbitrary subkeys for anyone in the tenant (ADR 0043, ADR 0007)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a grant names each of those fields; key@ refuses a grant that lacks one, names another subkey or person, or has expired"}
  - id: REQ-KEYS-197
    area: KEYS
    statement: "key@ MUST build the binding, revocation and user ID signatures of a primary itself from the values in the grant, including the key flags, the creation time bound and the expiry."
    rationale: "A caller that sends packets to be signed could make key@ sign anything under the primary (ADR 0043, ADR 0024)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a request that carries a packet to sign is refused; the signature key@ makes carries the grant's flags and expiry and nothing the caller chose"}
  - id: REQ-KEYS-198
    area: KEYS
    statement: "key@ MUST verify the back-signature and the possession signatures named in a grant against the primary and the challenge itself before it binds a subkey."
    rationale: "A grant that rests only on the word of the asking actor trusts a compromised caller (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a grant whose back-signature is over another primary, or whose possession signature is by another key or over another challenge, is refused by key@"}
  - id: REQ-KEYS-199
    area: KEYS
    statement: "exchange MUST verify the attestation and the approval of a binding before it asks policy for a primary-use grant, with their digests in the request."
    rationale: "One actor checks the evidence that key@ cannot, and the grant records what it checked (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a request for a grant for a bundle whose attestation or approval does not verify is not made; a grant for a verified bundle carries the digest of each"}
  - id: REQ-KEYS-200
    area: KEYS
    statement: "sluis MUST accept an approval of a binding only when it was made after the bundle arrived, names the key identities of all subkeys and the card serial, is used once and is no older than one hour."
    rationale: "An approval given before the bundle, or for no particular key, could be used for a different card (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "an approval made before the bundle, one that names other keys or another serial, a second use and one older than an hour are each refused"}
  - id: REQ-KEYS-201
    area: KEYS
    statement: "sluis MUST NOT list a person's primary in the staff keyring or hand it to the key sync until a subkey is bound under it."
    rationale: "Nothing trusts a primary before a subkey is bound, which is why making it needs no approval (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a person with a primary and no bound subkey is absent from the keyring and from the sync"}
  - id: REQ-KEYS-203
    area: KEYS
    statement: "sluis MUST require, for a customer's further binding or change, approval by the tenant admin or a vouch signature from an active bound key of that customer."
    rationale: "A stolen customer session must not add a key of its own (ADR 0043, BD2 B)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a customer add or change with no approval and no vouch is refused; one approved by the tenant admin, and one vouched by a bound key, succeed"}
  - id: REQ-KEYS-204
    area: KEYS
    statement: "sluis MUST let a customer end their own key binding after a fresh re-authentication at their upstream."
    rationale: "Ending a lost key is the safe direction, and binding again needs the tenant admin (ADR 0043, REQ-SESS-036)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "an end after a fresh upstream re-authentication succeeds; an end after an old sign-in is refused"}
  - id: REQ-KEYS-206
    area: KEYS
    statement: "sluis MUST refuse an extend challenge whose set is not the stored set of the binding."
    rationale: "A tap for an extension must not authorise a wider set (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "an extend with an added subkey in the set, or with a removed one, is refused and a change is required"}
  - id: REQ-KEYS-208
    area: KEYS
    statement: "sluis MUST refuse a binding unless, for every subkey, the attested key, the presented subkey and the key that made the possession signature are the same key."
    rationale: "A public attestation certificate could otherwise be paired with another key (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bundle with a statement for another public key, or a possession signature by another key, is refused for each subkey"}
  - id: REQ-KEYS-209
    area: KEYS
    statement: "sluis MUST refuse a binding whose subkeys do not all come from one card, that is, whose attestation statements do not carry the same serial."
    rationale: "A bundle that mixes cards would bind a key that is not on the card the person presented (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bundle whose two statements carry different serials is refused; one with equal serials is accepted"}
  - id: REQ-KEYS-210
    area: KEYS
    statement: "sluis MUST refuse a binding whose card serial belongs to an active or pending binding of any tenant in the boundary."
    rationale: "One card holds one signing slot, so one card serves one company's primary at a time (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a second bundle with the serial of an active or pending binding is refused, also in another tenant; it is accepted once that binding has ended"}
  - id: REQ-KEYS-211
    area: KEYS
    statement: "key@ MUST set the key flags of every signature it makes: 0x01 only on a primary, 0x02 with a back-signature on a signing subkey and 0x20 on an authentication subkey, and never 0x01, 0x04 or 0x08 on a subkey."
    rationale: "A subkey that can certify or encrypt would widen what the card's key is for (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bound signing subkey has flags 0x02, an authentication subkey 0x20 and the primary 0x01; a request for another flag on a subkey is refused"}
  - id: REQ-KEYS-212
    area: KEYS
    statement: "sluis MUST refuse a subkey whose slot in proof.json is not the slot of its attestation."
    rationale: "The flags follow the slot, so a mislabelled slot would give a key the wrong capability (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a signing-slot statement labelled aut and an authentication-slot statement labelled sig are each refused"}
  - id: REQ-KEYS-213
    area: KEYS
    statement: "key@ MUST set the key expiration time of a subkey to the approved expiry minus the subkey's creation time."
    rationale: "The expiry is an offset from a creation time the holder chooses, so both must be bounded (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "the binding signature of an accepted subkey expires at the approved date, whatever creation time the holder chose"}
  - id: REQ-KEYS-214
    area: KEYS
    statement: "sluis MUST set the expiry of a primary to at most 395 days after its last renewal."
    rationale: "A verifier that does not read certifications still stops trusting a leaver's primary within that time (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a renewed primary expires after at most 395 days; a primary of a leaver, not renewed, expires within that time"}
  - id: REQ-KEYS-215
    area: KEYS
    statement: "The published staff keyring MUST make gpgv, sqv and apt with signed-by reject a signature by a valid subkey of an expired primary and a signature by a revoked subkey."
    rationale: "The keyring and the expiry are all that these verifiers use (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: test-vectors, ref: "with the published keyring each of the three verifiers rejects a signature by a subkey of an expired primary and a signature by a revoked subkey, and accepts a valid one"}
  - id: REQ-KEYS-217
    area: KEYS
    statement: "sluis MUST accept a customer's JWS only with the typ sluis-customer-signature and a kid equal to the key identity of a binding of that tenant."
    rationale: "The header names which key and what the signature is for (ADR 0043, CU1 A)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a JWS with another typ, a missing kid, or a kid of another tenant's key is refused"}
  - id: REQ-KEYS-218
    area: KEYS
    statement: "sluis MUST accept a customer's JWS only with alg ES256 or ES384."
    rationale: "A weak or symmetric algorithm would let a verifier be tricked (ADR 0043, CU1 A)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "ES256 and ES384 verify; alg none, HS256 and a key of type oct are refused"}
  - id: REQ-KEYS-219
    area: KEYS
    statement: "sluis MUST accept a customer's JWS only with the claims aud, tenant, iat, exp and jti, with the tenant equal to the tenant of the binding and exp at most five minutes after iat."
    rationale: "The tenant and the lifetime must be in the signed bytes (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a JWS missing a claim, with another tenant, with exp too far from iat or already past is refused"}
  - id: REQ-KEYS-220
    area: KEYS
    statement: "sluis MUST keep the jti of an accepted customer JWS until its exp and refuse a second JWS with the same jti."
    rationale: "A signed request must not be replayed (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a second JWS with the same jti before exp is refused; after exp the cache entry is gone"}
  - id: REQ-KEYS-221
    area: KEYS
    statement: "sluis MUST refuse a customer's JWS whose crit header names an extension that sluis does not implement."
    rationale: "A critical extension that a verifier ignores changes the meaning of the signature (ADR 0043, RFC 7515)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a JWS with a crit header is refused in the first version, and one without is verified"}
  - id: REQ-KEYS-222
    area: KEYS
    statement: "sluis MUST audit a change of a person's user ID, alert the operators and notify the person at the old and the new address."
    rationale: "Whoever can change an address in the directory can make a key vouch for it, so the change must be seen (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "an address change leaves one audit record, one operator alert and one notice at each of the two addresses"}
  - id: REQ-KEYS-223
    area: KEYS
    statement: "sluis MUST require a fresh hardware-attested step-up of the person, or of an operator when the person has no usable card, before it accepts a declaration of compromise."
    rationale: "A stolen session must not revoke the good card for good (ADR 0043, ADR 0041)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a declaration from a session without a fresh hardware step-up is refused; one after a fresh step-up, and one by an operator for a person with no card, are accepted"}
  - id: REQ-KEYS-224
    area: KEYS
    statement: "sluis MUST refuse a bundle that has an authentication subkey and no signing subkey."
    rationale: "The signing subkey is the card's identity in a binding, and an authentication-only card would have none (ADR 0043)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a bundle with only a signing subkey is bound; a bundle with only an authentication subkey is refused"}
  - id: REQ-KEYS-225
    area: KEYS
    statement: "key@ MUST accept a primary-use grant once, recording it in a SpentGrant before it signs."
    rationale: "A reusable grant would let a compromised caller reuse one approval for many binds (ADR 0043, ADR 0007)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a grant is accepted once; a second use of the same grant is refused and nothing is signed"}
  - id: REQ-KEYS-226
    area: KEYS
    statement: "key@ MUST refuse a subkey creation time more than 5 minutes in the future or more than 30 days before the binding."
    rationale: "The expiry is an offset from a creation time the holder chooses, so the creation time must be bounded (ADR 0043)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a subkey created 6 minutes ahead or 31 days ago is refused; one created a day ago is accepted"}
  - id: REQ-KEYS-227
    area: KEYS
    statement: "sluis MUST refuse a customer's JWS or key of type oct and an alg of none or HS256, HS384 or HS512."
    rationale: "A symmetric or absent algorithm would let a verifier be tricked into accepting a forged signature (ADR 0043, CU1 A)."
    level: MUST
    source: security-review
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    features: [design]
    verification:
      - {kind: integration-test, ref: "a JWS with alg none, each HS algorithm, or a JWK of type oct is refused"}
  - id: REQ-KEYS-119
    area: KEYS
    statement: "The generated key policy of every KMS key MUST allow the control-plane actions (CreateAlias, UpdateAlias, DeleteAlias, PutKeyPolicy, ScheduleKeyDeletion and DisableKey) only to the key administrators that the installation names, with no delegation to IAM through the account root."
    rationale: "A role with a broad allow could otherwise retarget an alias and send new writes to a key of its choice (ADR 0006)."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: ["serverless", "kubernetes"]
    actors: [key]
    standards: []
    features: ["design"]
    verification:
      - {kind: test-vectors, ref: "the generated policy of each KMS key matches a golden file: control-plane actions allowed to the named administrators alone, denied to all others, none delegated to the root"}
      - {kind: integration-test, ref: "a role with a broad kms allow cannot create, update or delete the alias of a key"}
  - id: REQ-KEYS-120
    area: KEYS
    statement: "The pre-publication lead time of a token-signing key MUST be an installation setting with a default of 30 minutes."
    rationale: "The relying parties that move first at a cutover may hold the key set longer than the budget assumes, and the installation must be able to raise the time to the longest cache found (ADR 0006)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "the signer honours a setting of 45 minutes and uses 30 when the setting is absent"}
  - id: REQ-KEYS-121
    area: KEYS
    statement: "key@ MUST refuse to start when the ARN that DescribeKey returns for a KMS key differs from the ARN that the signed KeyPlan names for it."
    rationale: "A retargeted alias would otherwise send new writes to a key of an attacker's choice, and the check does not depend on the key policy being right (principle 4, ADR 0006)."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: ["serverless", "kubernetes"]
    actors: [key]
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "a fake KMS whose DescribeKey returns another ARN for the alias makes key@ refuse to start and name the key; the matching ARN starts"}
  - id: REQ-KEYS-169
    area: KEYS
    statement: "`sluis config check` MUST refuse a pre-publication lead time below the sum of the key set's max-age, the edge cache time to live, the refetch allowance and the clock skew."
    rationale: "A lead time under the cache budget lets a token carry a key that a cache does not hold yet (ADR 0006)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "config check refuses a lead time of 24 minutes for the default budget and accepts 25 and 30"}
  - id: REQ-KEYS-170
    area: KEYS
    statement: "key@ MUST call KMS by the key ARN that the signed KeyPlan names and never by the alias."
    rationale: "An alias can be retargeted, and a call by ARN reaches only the key that the reviewed plan named (ADR 0006)."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: ["serverless", "kubernetes"]
    actors: [key]
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "a fake KMS records the key identifier of every call of key@: each is the ARN of the KeyPlan, none is an alias, and a retargeted alias changes nothing"}
  - id: REQ-KEYS-229
    area: KEYS
    statement: "key@ MUST read KeyRevocation and the PIN release answers by listing the kind, and never by the id of an item that it expects to be absent."
    rationale: "store@ audits every refusal (ADR 0005), and a lookup of a key that is not revoked, or of an answer that is not written yet, is a refusal that a board then wrote at every sign and every poll of its PIN release."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    tests:
      - actors/key/internal/keyd/pinpoll_test.go
      - actors/key/internal/keyd/pinwake_test.go
      - actors/key/internal/keyd/revocation_test.go
    verification:
      - {kind: integration-test, ref: "on the fake store, a pass over an unanswerable request and 20 Signs of a key that is not revoked make no lookup that finds nothing (TestAPassOverAnUnanswerableRequestCostsNoRefusal)"}
      - {kind: manual, ref: "on three boards, the journals of key@ and store@ hold no store.refused for KeyRevocation or PinRelease after the deploy of the change (checked 2026-11-07)"}
  - id: REQ-KEYS-230
    area: KEYS
    statement: "The releasing loop of key@ MUST double its wait after every pass that answered no request and saw no request for the first time, up to 10 seconds (2 seconds while its own driver is locked and a request is open), and start again from 500 milliseconds after one that did."
    rationale: "A request that this node cannot answer stays open for minutes, and a loop that counted the requests it saw instead of the requests it answered polled once a second for as long as it did."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    tests:
      - actors/key/internal/keyd/pinpoll_test.go
      - actors/key/internal/keyd/pinwake_test.go
    verification:
      - {kind: integration-test, ref: "a simulated hour with one unanswerable request: the waits run 500 ms, 1 s, 2 s, 4 s, 8 s, 10 s (TestAnUnansweredPINRequestBacksOffAndWritesNoAuditFacts)"}
  - id: REQ-KEYS-231
    area: KEYS
    statement: "An unlocked key@ MUST answer a PIN release request within 10 seconds of the request's arrival, however long its releasing loop has been waiting."
    rationale: "A board that is restarted waits for its peer, so the back-off must not make the wait for a new request longer than an idle board's longest wait."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    tests:
      - actors/key/internal/keyd/pinpoll_test.go
    verification:
      - {kind: integration-test, ref: "a request that arrives 30 minutes into the longest wait is answered by the next pass, within 10 s (TestARequestDuringALongWaitIsAnsweredWithinTheLongestWait)"}
  - id: REQ-KEYS-232
    area: KEYS
    statement: "A key@ whose driver has just taken a PIN, or is found unlocked, MUST answer the PIN release requests that peers left open without waiting for its back-off."
    rationale: "A board that a peer has just unlocked is the next peer for a board that is still locked, and a back-off of ten seconds at each step would add up over three boards."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    tests:
      - actors/key/internal/keyd/pinpoll_test.go
      - actors/key/internal/keyd/pinwake_test.go
    verification:
      - {kind: integration-test, ref: "a node unlocked by a peer wakes its releaser, which answers an open request at once (TestTheRequestingLoopWakesTheReleasingLoop, TestARequestLeftOpenIsAnsweredAtOnceWhenThisNodeUnlocks)"}
  - id: REQ-KEYS-233
    area: KEYS
    statement: "key@ MUST read KeyRevocation with a linearizable listing for the check of every Sign and of every PIN release, and refuse when the store cannot give that read."
    rationale: "A listing that is not asked to be linearizable is read by a leader that may have just been deposed, and a revocation missed by it would let a revoked key sign, which the Get it replaced could not (ADR 0005); the Rust kit cannot ask for that read yet, so entry and signer still read the listing of KeyRevocation at the weak level, which this row does not change."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    tests:
      - actors/key/internal/keyd/revocation_list_test.go
    verification:
      - {kind: integration-test, ref: "the Sign, the releaser and the requester each list KeyRevocation with LINEARIZABLE, and a store that refuses that read refuses them (TestEveryRevocationListingAsksForALinearizableRead)"}
  - id: REQ-KEYS-234
    area: KEYS
    statement: "A key@ whose card driver is locked MUST try the PIN release requests that peers left open again at least every 2 seconds."
    rationale: "A person unlocks a board through the driver and key@ is not told, so the first board of a cold start answers its peers only as soon as its releasing loop looks again."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    tests:
      - actors/key/internal/keyd/pinwake_test.go
    verification:
      - {kind: integration-test, ref: "a locked releaser with an open request answers within 2 s of a person unlocking its driver, with no wake (TestABoardUnlockedByHandAnswersWithinTheLockedRecheck)"}
      - {kind: manual, ref: "on three boards, a board unlocked by hand answers two open PIN release requests in the second it unlocks, inside the 2 s recheck (checked 2026-11-07)"}
  - id: REQ-KEYS-235
    area: KEYS
    statement: "The YubiKey PIV driver MUST write one journal line for each reset of the card session, naming where it was made (start, unlock, status or exit) and whether the card was logged in, as a warning for a card found logged in while the driver held no PIN, and holding no PIN or anything derived from one."
    rationale: "The reset logs a card out that something else logged in, which is a security-relevant event, and on a board nothing in the journal said it had happened, so the only evidence was indirect."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    tests:
      - drivers/key/yubikey-piv/internal/driver/cardreset_test.go
    verification:
      - {kind: integration-test, ref: "on the fake card, each reset leaves one line with its place and the card state, a card found logged in with no PIN held warns, no line holds the PIN (cardreset_test.go: TestTheResetAt*IsInTheJournal)"}
      - {kind: manual, ref: "on three boards, the reset line after each deploy and after a plain driver restart, with the card state and no PIN held as the page says. Seen 2026-11-07"}
  - id: REQ-KEYS-236
    area: KEYS
    statement: "key@ MUST answer a status call on its admin socket with each asymmetric key of the KeyPlan, its store, its algorithm, its public key and the certificate chain installed for that key and no other."
    rationale: "An operator needs one place that says which keys a node holds and how long their certificates last (ADR 0024, Lifetimes and the warning)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1068, 867]
    tests: [actors/key/internal/keyd/status_test.go]
    verification:
      - {kind: integration-test, ref: "the keys of the plan in order; a certificate for another key or purpose or without a chain is not the chain; slots on a card (TestStatusListsTheKeysOfThePlan..., TestStatusNamesTheSlotOnACardOnly)"}
  - id: REQ-KEYS-237
    area: KEYS
    statement: "key@ MUST NOT write to the store or make an audit record when it answers a status call."
    rationale: "A read of the state of the keys must change nothing, so it can be run at any time (ADR 0024, Lifetimes and the warning)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1068, 867]
    tests: [actors/key/internal/keyd/status_test.go]
    verification:
      - {kind: integration-test, ref: "writes are made to fail, no item changes a version and no audit fact is made (TestStatusWritesNothingAndAsksForNoAbsentItem)"}
  - id: REQ-KEYS-238
    area: KEYS
    statement: "key@ MUST NOT ask store@ for an item that may be absent when it answers a status call."
    rationale: "store@ audits a refusal for each absent item and an idle node writes at most 60 audit records an hour (REQ-AUDIT-180), so the answer is read by listing the kind."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1068, 867]
    tests: [actors/key/internal/keyd/status_test.go]
    verification:
      - {kind: integration-test, ref: "no Get finds an absent item across three calls (TestStatusWritesNothingAndAsksForNoAbsentItem)"}
  - id: REQ-KEYS-239
    area: KEYS
    statement: "key@ MUST serve the status call to root only."
    rationale: "The answer describes the keys of the node, and the admin socket is the channel of the person with a shell on it (ADR 0041)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1068, 867]
    tests: [actors/key/internal/keyd/status_test.go]
    verification:
      - {kind: integration-test, ref: "a peer that is not root is permission_denied (TestStatusIsRootOnlyAndSaysWhenStoreIsDown)"}
  - id: REQ-KEYS-240
    area: KEYS
    statement: "key@ MUST answer a status call as unavailable with the reason store when store@ cannot be read."
    rationale: "A status that left out the certificates because the store was down would read as no certificate, and as no warning."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1068, 867]
    tests: [actors/key/internal/keyd/status_test.go]
    verification:
