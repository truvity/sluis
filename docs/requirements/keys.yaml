  - id: REQ-KEYS-068
    area: KEYS
    statement: "key@ MUST use a customer-account KMS key only through a key policy or grant that covers Encrypt, Decrypt, GenerateDataKey, Sign and GetPublicKey and no other operation."
    rationale: "The customer's grant is the narrowest that key@ needs (ADR 0006)."
