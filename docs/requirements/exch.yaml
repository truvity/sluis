# EXCH: Token exchange
schema: 1
area: EXCH
requirements:
  - id: REQ-EXCH-001
    area: EXCH
    statement: "Token exchange MUST be denied unless a configured exchange grant matches the requesting client, the subject token and the requested audience."
    rationale: "Deny by default prevents confused-deputy chains."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2", depth: Full}
      - {id: ST-14, section: "4", depth: Partial}
    issues: [782, 785]
    verification:
      - {kind: test-vectors, ref: "own exchange vectors"}
      - {kind: integration-test, ref: "default-deny test"}
  - id: REQ-EXCH-002
    area: EXCH
    statement: "The token exchange endpoint MUST refuse a request that carries an actor_token with invalid_request."
    rationale: "Ignoring a parameter implies delegation semantics that sluis does not provide."
    level: MUST
    source: security-review
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2.1", depth: Partial}
    issues: [782]
    verification:
      - {kind: integration-test, ref: "actor_token negative test"}
  - id: REQ-EXCH-008
    area: EXCH
    split_from: REQ-EXCH-002
    statement: "The token exchange endpoint MUST refuse a requested_token_type other than an access token with invalid_request."
    rationale: "Ignoring a parameter implies delegation semantics that sluis does not provide."
    level: MUST
    source: security-review
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2.1", depth: Partial}
    issues: [782]
    verification:
      - {kind: integration-test, ref: "requested_token_type negative test"}
  - id: REQ-EXCH-003
    area: EXCH
    statement: "A refusal by unknown audience, by limit or by missing grant MUST be answered identically with invalid_target."
    rationale: "A uniform answer hides which audiences exist."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2.2.2", depth: Full}
      - {id: ST-08, section: "2", depth: Partial}
    issues: [782, 785]
    verification:
      - {kind: integration-test, ref: "uniform-refusal test"}
  - id: REQ-EXCH-009
    area: EXCH
    split_from: REQ-EXCH-003
    statement: "The reason for an exchange refusal MUST be recorded in the audit log."
    rationale: "The operator still needs the real reason."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2.2.2", depth: Full}
      - {id: ST-08, section: "2", depth: Partial}
    issues: [782, 785]
    verification:
      - {kind: integration-test, ref: "refusal audit-record test"}
  - id: REQ-EXCH-004
    area: EXCH
    statement: "The output of an exchange MUST be narrower than or equal to the subject token in audience, scope and lifetime."
    rationale: "An exchange must never widen authority."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2.2", depth: Full}
    issues: [782, 785]
    verification:
      - {kind: integration-test, ref: "narrowing property test"}
  - id: REQ-EXCH-010
    area: EXCH
    split_from: REQ-EXCH-004
    statement: "The output of an exchange MUST NOT include a refresh token."
    rationale: "A refresh token would extend the lifetime beyond the subject token."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2.2", depth: Full}
    issues: [782, 785]
    verification:
      - {kind: integration-test, ref: "no-refresh-token test"}
  - id: REQ-EXCH-005
    area: EXCH
    statement: "An exchange MUST be refused when the session that produced the subject token has ended."
    rationale: "Logout must cut every derived token."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2", depth: Full}
      - {id: ST-30, section: "1", depth: Partial}
    issues: [782, 793]
    verification:
      - {kind: integration-test, ref: "post-logout exchange test"}
  - id: REQ-EXCH-006
    area: EXCH
    statement: "An exchange MUST be refused when the subject token was issued by a different installation."
    rationale: "Cross-installation exchange breaks the trust boundary."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2", depth: Full}
    issues: [782]
    verification:
      - {kind: integration-test, ref: "cross-installation negative test"}
  - id: REQ-EXCH-007
    area: EXCH
    statement: "A client that exchanges tokens MUST be confidential."
    rationale: "Public clients cannot hold an exchange authority."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2.1", depth: Full}
      - {id: ST-01, section: "2.3", depth: Full}
    issues: [785]
    verification:
      - {kind: integration-test, ref: "public client exchange negative test"}
  - id: REQ-EXCH-011
    area: EXCH
    split_from: REQ-EXCH-007
    statement: "A client that exchanges tokens MUST authenticate."
    rationale: "Public clients cannot hold an exchange authority."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2.1", depth: Full}
      - {id: ST-01, section: "2.3", depth: Full}
    issues: [785]
    verification:
      - {kind: integration-test, ref: "unauthenticated exchange negative test"}
  - id: REQ-EXCH-012
    area: EXCH
    statement: "The token exchange endpoint MUST refuse an exchange when the directory person of the subject is disabled."
    rationale: "A known disable takes effect at once, and the bounded window for last-known groups applies only while the directory is unreachable, where sluis cannot learn of a disable."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2.2.2", depth: Partial}
    issues: [782]
    verification:
      - {kind: integration-test, ref: "disabled person exchange test"}
  - id: REQ-EXCH-013
    area: EXCH
    statement: "A credential minter MUST refuse a request for a target or a catalogue entry that the install file does not declare, with the reason NOT_FOUND."
    rationale: "A minter serves only what an operator declared (ADR 0036)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1011]
    verification:
      - {kind: integration-test, ref: "a mint for an undeclared target and for an undeclared entry"}
  - id: REQ-EXCH-014
    area: EXCH
    statement: "A credential minter MUST refuse a catalogue entry that grants administration of tokens, billing, account settings, memberships or identity providers at its vendor."
    rationale: "The minting credential is the sharpest edge of an integration, so the floor is in code (ADR 0036)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1011]
    verification:
      - {kind: test-vectors, ref: "catalogue entries on the refusal list"}
  - id: REQ-EXCH-015
    area: EXCH
    statement: "A credential minter MUST NOT return a credential that outlasts the least of the lifetime of its grant, the policy cap and the vendor's maximum."
    rationale: "A minted credential is never longer-lived than what authorised it (ADR 0036)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1011]
    verification:
      - {kind: integration-test, ref: "a mint request for a longer lifetime than each limit in turn"}
