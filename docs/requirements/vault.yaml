# VAULT: Fallback credential vault (open scope)
schema: 1
area: VAULT
requirements:
  - id: REQ-VAULT-001
    area: VAULT
    statement: "Only the vault adapter inside the accounts module MUST hold the vault client-assertion key and the vault administrative keys."
    rationale: "One credential holder is one place to defend and audit."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-20, section: "7523", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "deny matrix"}
      - {kind: integration-test, ref: "import-boundary test"}
  - id: REQ-VAULT-002
    area: VAULT
    statement: "A vault ceremony MUST use a pushed authorization request."
    rationale: "The request parameters stay on the back channel."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-16, section: "2", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "recorded PAR body test"}
  - id: REQ-VAULT-003
    area: VAULT
    statement: "A vault ceremony MUST authenticate the client with private_key_jwt."
    rationale: "A shared secret with the vault would be a theft target."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-20, section: "7523 2.2", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "client authentication test"}
  - id: REQ-VAULT-004
    area: VAULT
    statement: "A vault ceremony MUST use the authorization code flow with PKCE S256, state and nonce of 256 random bits each."
    rationale: "Standard protections apply to the vault leg too."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-03, section: "4.2", depth: Full}
      - {id: ST-14, section: "2.1", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "recorded PAR body test"}
  - id: REQ-VAULT-005
    area: VAULT
    statement: "A vault ceremony MUST force a fresh authentication with prompt=login and max_age=0."
    rationale: "A reused vault session would merge old factors into a new ceremony."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "recorded PAR body test"}
  - id: REQ-VAULT-006
    area: VAULT
    statement: "A vault ceremony request MUST NOT carry acr_values, claims or any product, entity, client, theme or redirect hint."
    rationale: "The vault must stay blind to the relying party."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "recorded PAR body test"}
  - id: REQ-VAULT-007
    area: VAULT
    statement: "The authorization response from the vault MUST carry an iss equal to the pinned vault issuer."
    rationale: "The issuer parameter defends against mix-up."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-10, section: "2", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "vault mix-up test"}
  - id: REQ-VAULT-008
    area: VAULT
    statement: "A vault ID token MUST be verified against the pinned key set before any use."
    rationale: "Reading unsigned vault claims would let a network attacker or the vendor forge sign-ins."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.3.7", depth: Full}
      - {id: ST-49, section: "5", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "forged signature test"}
  - id: REQ-VAULT-009
    area: VAULT
    statement: "A vault ID token MUST be rejected unless iss, aud, azp, typ, nonce, exp and iat are as expected."
    rationale: "Each claim closes a different substitution attack."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.3.7", depth: Full}
      - {id: ST-52, section: "7", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "claim mismatch tests"}
  - id: REQ-VAULT-010
    area: VAULT
    statement: "A vault ID token MUST be rejected when its auth_time is older than the pushed request time minus 5 seconds."
    rationale: "The ceremony must be fresh."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.3.7", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "stale auth_time test"}
  - id: REQ-VAULT-011
    area: VAULT
    statement: "A vault ID token MUST be rejected when it lacks sid, carries an act claim or has an amr that is not a set."
    rationale: "Each is a sign of a malformed or delegated token."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
      - {id: NC-01, section: "8176", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "malformed token tests"}
  - id: REQ-VAULT-012
    area: VAULT
    statement: "A vault ID token MUST be rejected unless its subject and preferred_username match the linked account."
    rationale: "A token for another vault user must not sign this person in."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.3.7", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "binding mismatch test"}
  - id: REQ-VAULT-013
    area: VAULT
    statement: "A vault ID token MUST be rejected unless the linked account is in good standing in sluis."
    rationale: "Vault evidence cannot revive a disabled account."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.3.7", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "disabled account vault test"}
  - id: REQ-VAULT-014
    area: VAULT
    statement: "A vault ID token MUST be rejected when its identifier has been seen before."
    rationale: "A replayed vault token must never sign a person in."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-52, section: "7", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "replayed vault token test"}
  - id: REQ-VAULT-015
    area: VAULT
    statement: "A vault ID token MUST be rejected unless its claim set is exactly the expected one."
    rationale: "An extra claim is an unreviewed capability."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "extra claim test"}
  - id: REQ-VAULT-016
    area: VAULT
    statement: "Vault evidence with an amr of exactly password and one-time password MUST give at most the lowest assurance level."
    rationale: "A compromised vendor can forge at most the lowest level."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-01, section: "8176", depth: Full}
      - {id: NC-16, section: "800-63B", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "evidence ceiling test"}
  - id: REQ-VAULT-017
    area: VAULT
    statement: "Vault evidence with a single factor, or with an empty, unknown or extra amr value, MUST be rejected."
    rationale: "Evidence that does not match the approved set is not evidence."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-01, section: "8176", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "amr rejection tests"}
  - id: REQ-VAULT-018
    area: VAULT
    statement: "The acr claim of a vault token MUST be ignored."
    rationale: "Only sluis decides the assurance level."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "vault acr ignored test"}
  - id: REQ-VAULT-019
    area: VAULT
    statement: "A vault acr claim MUST raise a drift alarm."
    rationale: "A vault that starts sending acr has changed its configuration."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "drift alarm test"}
  - id: REQ-VAULT-020
    area: VAULT
    statement: "A request that needs more than the lowest level and that only vault evidence could answer MUST fail with unmet_authentication_requirements."
    rationale: "Vault evidence must not open a regulated context."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
      - {id: ST-24, section: "3", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "vault evidence level request test"}
  - id: REQ-VAULT-021
    area: VAULT
    statement: "After every validated vault ceremony the accounts module MUST end the vault session at once with a server-to-server logout."
    rationale: "A reusable vault session would be a second single sign-on outside sluis."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-30, section: "2", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "zero vault sessions after sign-in test"}
  - id: REQ-VAULT-022
    area: VAULT
    statement: "The vault username MUST be a keyed pseudonym of the account identifier."
    rationale: "A breach or compulsion of the vault reveals no relationship data."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: test-vectors, ref: "own pseudonym vectors"}
  - id: REQ-VAULT-023
    area: VAULT
    statement: "The pseudonym MUST be derived with a non-extractable key and a lineage identifier that is kept across same-provider moves."
    rationale: "The pseudonym must stay stable when the vault moves."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Partial}
      - {id: ST-88, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "lineage stability test"}
  - id: REQ-VAULT-024
    area: VAULT
    statement: "The vault MUST NOT receive an e-mail address, an account identifier, a sector subject or an account class."
    rationale: "Personal and relationship data must not reach the vendor."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "vault payload inspection test"}
  - id: REQ-VAULT-025
    area: VAULT
    statement: "The vault MUST NOT receive an organisation, a client, an entity, an assurance level, a passkey or a recovery code."
    rationale: "The vault must stay blind."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "vault payload inspection test"}
  - id: REQ-VAULT-026
    area: VAULT
    statement: "A staff or corporate account MUST NOT have a vault user."
    rationale: "The fallback factor is only for personal accounts."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "reconciliation finds no corporate vault user"}
  - id: REQ-VAULT-027
    area: VAULT
    statement: "A personal account MUST have a vault user only when the person opts into the fallback factor."
    rationale: "The fallback is optional."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "opt-in test"}
  - id: REQ-VAULT-028
    area: VAULT
    statement: "The vault user record MUST hold the pseudonym only."
    rationale: "A record without attributes leaks nothing."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "vault record inspection test"}
  - id: REQ-VAULT-029
    area: VAULT
    statement: "Every vault write MUST name a cause that is a ceremony, a control-plane intent or a system intent."
    rationale: "An unexplained vault change must be impossible to make."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "write without cause compile-time test"}
  - id: REQ-VAULT-030
    area: VAULT
    statement: "Every vault write MUST be journaled before the call and confirmed after it."
    rationale: "The journal is how unmatched changes are detected."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "journal ordering test"}
  - id: REQ-VAULT-031
    area: VAULT
    statement: "A vault revoke, unlock, delete or enable after an incident MUST require a dual-signed control-plane intent."
    rationale: "Risky changes need two people."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-49, section: "7", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "single-signature refusal test"}
  - id: REQ-VAULT-032
    area: VAULT
    statement: "The vault port MUST NOT offer search, impersonation, role, attribute or password-setting operations."
    rationale: "A narrow port can be checked, fuzzed and re-implemented."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "port surface test"}
  - id: REQ-VAULT-033
    area: VAULT
    statement: "Test seeding of a vault MUST use a separate interface that is compiled only into test builds."
    rationale: "Seeding doors must not ship."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "production-build symbol test"}
  - id: REQ-VAULT-034
    area: VAULT
    statement: "An enrolment ticket MUST be a single-use link to the accounts module that is valid for at most 600 seconds."
    rationale: "A ticket is the only door for setting fallback factors."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "ticket reuse and expiry test"}
  - id: REQ-VAULT-035
    area: VAULT
    statement: "Completion of a vault enrolment MUST be proven by the credential inventory and not by a redirect."
    rationale: "A redirect proves nothing about what was enrolled."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "inventory after enrolment test"}
  - id: REQ-VAULT-036
    area: VAULT
    statement: "The bootstrap enrolment strategy MUST be refused at load in the production profile."
    rationale: "A test-only strategy must not run in production."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "production load refusal test"}
  - id: REQ-VAULT-037
    area: VAULT
    statement: "A person MUST set the optional fallback password and one-time password only on the vault host, through an enrolment ticket."
    rationale: "The password never transits sluis."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "no sluis page contains a password field"}
  - id: REQ-VAULT-038
    area: VAULT
    statement: "Before an assertion is issued at a fallback sign-in, the accounts module MUST read the credential inventory of the vault user with the read-only credential."
    rationale: "A credential injected through the admin interface is invisible in events."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "injected credential test"}
  - id: REQ-VAULT-039
    area: VAULT
    statement: "The credential inventory MUST equal the approved one: exactly one password and one one-time password with unchanged identifiers and creation times, and no required actions."
    rationale: "Any other inventory is an injection until proven otherwise."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "inventory mismatch test"}
  - id: REQ-VAULT-040
    area: VAULT
    statement: "A fallback sign-in MUST fail closed when the vault administrative interface is down."
    rationale: "Without the inventory the evidence cannot be trusted."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "admin interface down test"}
  - id: REQ-VAULT-041
    area: VAULT
    statement: "The accounts module MUST process vault events idempotently by event identifier and re-read state through the port."
    rationale: "Events are hints, not records."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "duplicate event test"}
  - id: REQ-VAULT-042
    area: VAULT
    statement: "Every vault factor or state change MUST match an open journal entry."
    rationale: "Detection must not depend on the vendor's honesty."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "console change detection test"}
  - id: REQ-VAULT-043
    area: VAULT
    statement: "An unmatched vault change MUST put the account into cool-down through a system intent."
    rationale: "The cool-down limits the damage until the change is understood."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "unmatched change cool-down test"}
  - id: REQ-VAULT-044
    area: VAULT
    statement: "An unmatched vault change MUST raise an incident."
    rationale: "A human must look at it."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "unmatched change incident test"}
  - id: REQ-VAULT-045
    area: VAULT
    statement: "A gap in vault events MUST trigger a full reconciliation."
    rationale: "A gap means events were missed."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "event gap test"}
  - id: REQ-VAULT-046
    area: VAULT
    statement: "A full reconciliation sweep MUST run at a configured interval, by default every 5 minutes."
    rationale: "A sweep bounds the time to detect a change."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "sweep interval test"}
  - id: REQ-VAULT-047
    area: VAULT
    statement: "A vault user without a sluis link that a sweep finds MUST be disabled by a system intent."
    rationale: "An orphaned vault user is an unreviewed sign-in path."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "orphan vault user test"}
  - id: REQ-VAULT-048
    area: VAULT
    statement: "A missing linked vault user that a sweep finds MUST set the fallback state to missing."
    rationale: "The state then closes fallback sign-in until re-enrolment."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "missing vault user test"}
  - id: REQ-VAULT-049
    area: VAULT
    statement: "After a vault restore, re-hosting or escrow opening, fallback sign-in MUST stay closed until reconciliation, journal replay and a clean re-reconciliation complete."
    rationale: "A restored copy must never bring back a revoked factor."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "restore-to-older-snapshot test"}
  - id: REQ-VAULT-050
    area: VAULT
    statement: "The vault configuration MUST be described by a signed desired-state document and its digest."
    rationale: "Every behaviour that matters for evidence is configuration."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-78, section: "8785", depth: Full}
      - {id: ST-49, section: "7515", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "signed digest test"}
  - id: REQ-VAULT-051
    area: VAULT
    statement: "The accounts module MUST compare the canonical effective vault configuration with the signed digest at a configured interval, at adapter start and on a configuration event."
    rationale: "Drift detection must not depend on one trigger."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-78, section: "8785", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "drift check trigger test"}
  - id: REQ-VAULT-052
    area: VAULT
    statement: "Security-relevant vault configuration drift MUST close vault ceremonies."
    rationale: "A drifted vault cannot be trusted for evidence."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-78, section: "8785", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "registration-enabled drift test"}
  - id: REQ-VAULT-053
    area: VAULT
    statement: "With the vault down, passkey sign-in, refresh, single sign-on, step-up, token exchange and context legs MUST keep working."
    rationale: "A vendor outage may remove only the fallback factor."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "7", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "vault-stopped suite"}
  - id: REQ-VAULT-054
    area: VAULT
    statement: "With the vault down, a fallback sign-in MUST fail closed with a neutral page that offers the passkey."
    rationale: "The person needs a way forward."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "7", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "neutral page test"}
  - id: REQ-VAULT-055
    area: VAULT
    statement: "Vault requests and vault-side logs MUST contain no client identifier, no product or entity host, no theme and no e-mail address."
    rationale: "The vendor must not learn which relying party a person uses."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "blindness test of PAR bodies and vault login events"}
  - id: REQ-VAULT-056
    area: VAULT
    statement: "The browser MUST reach the vault only from the account host and with a no-referrer policy."
    rationale: "A referrer would reveal the relying party."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-05, section: "Referrer-Policy", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "browser request header test"}
  - id: REQ-VAULT-057
    area: VAULT
    statement: "Before the redirect to the vault, the accounts module MUST show a requester line that names the entity and the account controller."
    rationale: "The person must see who is asking."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-04, section: "WCAG 2.1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "page text test"}
  - id: REQ-VAULT-058
    area: VAULT
    statement: "The accounts module MUST be re-pointable to a second vault instance of the same provider type."
    rationale: "The vendor must be replaceable."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "two-instance contract test"}
  - id: REQ-VAULT-059
    area: VAULT
    statement: "A move to a second vault instance MUST keep every relying-party subject."
    rationale: "A move must be invisible to relying parties."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "subject stability after move test"}
  - id: REQ-VAULT-060
    area: VAULT
    statement: "Passkeys, recovery codes, the account registry and the relying-party identifier MUST NOT move with a vault."
    rationale: "They belong to sluis, not to the vendor."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-59, section: "5", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "non-moving data test"}
  - id: REQ-VAULT-061
    area: VAULT
    statement: "For an unknown or non-enrolled identifier on the fallback path, the accounts module MUST redirect to the vault with a decoy pseudonym of the same shape as a real one."
    rationale: "The fallback path must not reveal whether an account exists."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: test-vectors, ref: "own decoy vectors"}
      - {kind: integration-test, ref: "decoy shape test"}
  - id: REQ-VAULT-062
    area: VAULT
    statement: "A success on a decoy pseudonym MUST raise an incident."
    rationale: "A decoy can succeed only by a vault compromise."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-06, section: "2104", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "decoy success test"}
  - id: REQ-VAULT-063
    area: VAULT
    statement: "Known and unknown identifiers on the fallback path MUST produce the same redirect shape and the same pushed request body shape."
    rationale: "A different shape would enumerate accounts."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "differential redirect test"}
  - id: REQ-VAULT-064
    area: VAULT
    statement: "Every vault sign-in on an account that has a passkey MUST send a notice by mail."
    rationale: "A fallback sign-in on a passkey account may be an attack."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-14, section: "SPF DKIM DMARC", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "notice delivery test"}
  - id: REQ-VAULT-065
    area: VAULT
    statement: "Vault calls MUST go through the egress policy to a pinned host with certificate public-key pinning."
    rationale: "A network attacker must not be able to impersonate the vault."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "unpinned certificate test"}
  - id: REQ-VAULT-066
    area: VAULT
    statement: "A new key identifier in the vault key set MUST raise an alarm."
    rationale: "A new signing key at the vendor may precede a forgery."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-50, section: "5", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "unpinned kid alarm test"}
  - id: REQ-VAULT-067
    area: VAULT
    statement: "Vault administrative tokens MUST live at most 60 seconds."
    rationale: "Short lifetimes limit theft."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-52, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "token lifetime test"}
  - id: REQ-VAULT-068
    area: VAULT
    statement: "Vault administrative tokens MUST be bound with DPoP."
    rationale: "A bound token cannot be replayed by a thief."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-18, section: "7", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "token replay test"}
  - id: REQ-VAULT-069
    area: VAULT
    statement: "Vault administrative calls MUST have timeouts and circuit breakers."
    rationale: "A slow vendor must not stall sluis."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "slow vault test"}
  - id: REQ-VAULT-070
    area: VAULT
    statement: "DNS CAA records with an account URI MUST restrict certificate issuance for the issuer, account and vault hosts."
    rationale: "Issuance by an unintended authority is the main impersonation path."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-13, section: "8657", depth: Full}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "CAA record check"}
  - id: REQ-VAULT-071
    area: VAULT
    statement: "Certificate Transparency logs MUST be monitored for the issuer, account and vault hosts."
    rationale: "Monitoring finds certificates that the operator did not request."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-13, section: "8657", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "CT monitor test"}
  - id: REQ-VAULT-072
    area: VAULT
    statement: "An unexpected certificate for the issuer, account or vault host MUST be treated as an incident."
    rationale: "It signals an impersonation attempt."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: NC-13, section: "8657", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "CT monitor incident test"}
  - id: REQ-VAULT-073
    area: VAULT
    statement: "After an incident involving the vault provider's access, the vault signing keys MUST be rotated and the pin updated."
    rationale: "The provider's keys may have been exposed."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-50, section: "5", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    manual_reason: "A runbook step is exercised in a drill by people."
    verification:
      - {kind: manual, ref: "incident runbook review"}
  - id: REQ-VAULT-074
    area: VAULT
    statement: "Account deletion and data-subject erasure MUST delete the vault user and tombstone the link."
    rationale: "Erasure must reach the vendor."
    level: MUST
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "post-deletion lookup test"}
  - id: REQ-VAULT-075
    area: VAULT
    statement: "A synthetic account SHOULD sign in through the fallback path at a fixed interval for each context installation."
    rationale: "The fallback path is rarely used, so silent breakage would otherwise be found by a person who needs it."
    level: SHOULD
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-98, section: "OTLP", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "probe interval test"}
  - id: REQ-VAULT-076
    area: VAULT
    statement: "A failure of the synthetic fallback probe SHOULD raise an alert."
    rationale: "Detection is the point of the probe."
    level: SHOULD
    source: stakeholder-ciam
    status: open
    runtimes: all
    standards:
      - {id: ST-98, section: "OTLP", depth: Partial}
    features: ["design"]
    gap: account-hosting-scope
    verification:
      - {kind: integration-test, ref: "vault-stopped alert test"}
