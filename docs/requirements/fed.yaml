# FED: Federation (sluis as a relying party)
schema: 1
area: FED
requirements:
  - id: REQ-FED-001
    area: FED
    statement: "When sluis consumes an upstream ID token it MUST verify the signature against the connection key set."
    rationale: "An RP that skips a check is a login bypass."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.3.7", depth: Full}
      - {id: ST-56, section: "3", depth: Full}
      - {id: ST-49, section: "5", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [807]
    verification:
      - {kind: conformance-suite, ref: "OIDF RP plans"}
      - {kind: integration-test, ref: "bad-signature and unknown-kid cases"}
  - id: REQ-FED-011
    area: FED
    split_from: REQ-FED-001
    statement: "When sluis consumes an upstream ID token it MUST restrict the algorithms to an allow-list that excludes none and HMAC."
    rationale: "An RP that skips a check is a login bypass."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.3.7", depth: Full}
      - {id: ST-56, section: "3", depth: Full}
      - {id: ST-49, section: "5", depth: Full}
    issues: [807]
    verification:
      - {kind: integration-test, ref: "alg=none and HMAC negative cases"}
  - id: REQ-FED-012
    area: FED
    split_from: REQ-FED-001
    statement: "When sluis consumes an upstream ID token it MUST verify iss, aud, azp, nonce and the time claims."
    rationale: "An RP that skips a check is a login bypass."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.3.7", depth: Full}
      - {id: ST-56, section: "3", depth: Full}
      - {id: ST-49, section: "5", depth: Full}
    issues: [807]
    verification:
      - {kind: integration-test, ref: "wrong-aud and wrong-nonce cases"}
  - id: REQ-FED-013
    area: FED
    split_from: REQ-FED-001
    statement: "sluis MUST NOT read identity claims from an unsigned upstream token."
    rationale: "An RP that skips a check is a login bypass."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.3.7", depth: Full}
      - {id: ST-56, section: "3", depth: Full}
      - {id: ST-49, section: "5", depth: Full}
    issues: [807]
    verification:
      - {kind: integration-test, ref: "unsigned-token negative case"}
  - id: REQ-FED-002
    area: FED
    statement: "A federated identity MUST be linked by the tuple of connection, issuer and subject."
    rationale: "E-mail is not a stable or verified key."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "5.7", depth: Full}
    issues: [1106, 916]
    verification:
      - {kind: integration-test, ref: "link-key test"}
  - id: REQ-FED-014
    area: FED
    split_from: REQ-FED-002
    statement: "A federated identity MUST NOT be linked by e-mail address."
    rationale: "E-mail is not a stable or verified key."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "5.7", depth: Full}
    issues: [1106, 916]
    verification:
      - {kind: integration-test, ref: "e-mail link negative test"}
  - id: REQ-FED-003
    area: FED
    statement: "A client of an upstream connection MUST check iss in the authorization response."
    rationale: "This stops mix-up attacks across upstreams."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-10, section: "2.4", depth: Full}
    issues: [1106, 916]
    verification:
      - {kind: integration-test, ref: "mix-up tests"}
  - id: REQ-FED-015
    area: FED
    split_from: REQ-FED-003
    statement: "A client of an upstream connection MUST refuse a missing iss when the upstream advertises support."
    rationale: "This stops mix-up attacks across upstreams."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-10, section: "2.4", depth: Full}
    issues: [1106, 916]
    verification:
      - {kind: integration-test, ref: "missing-iss test"}
  - id: REQ-FED-004
    area: FED
    statement: "Each upstream connection MUST carry an assurance policy that sets an assurance ceiling, optional required authentication methods and a maximum authentication age."
    rationale: "The relying decision is per connection."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
      - {id: NC-01, section: "8176", depth: Partial}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "trust-policy matrix"}
  - id: REQ-FED-005
    area: FED
    statement: "sluis MUST read only a configured allow-list of claims from an upstream."
    rationale: "Only declared claims enter the model."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2", depth: Partial}
    issues: [1106, 916]
    verification:
      - {kind: integration-test, ref: "claim allow-list test"}
  - id: REQ-FED-016
    area: FED
    split_from: REQ-FED-005
    statement: "sluis MUST NOT read upstream roles or groups."
    rationale: "Upstream roles are not evidence that sluis has verified."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2", depth: Partial}
    issues: [1106, 916]
    verification:
      - {kind: integration-test, ref: "role-claim negative test"}
  - id: REQ-FED-017
    area: FED
    split_from: REQ-FED-005
    statement: "sluis MUST refuse identity-provider-initiated sign-in."
    rationale: "An unsolicited response is a login CSRF vector."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2", depth: Partial}
    issues: [1106, 916]
    verification:
      - {kind: integration-test, ref: "unsolicited-response negative test"}
  - id: REQ-FED-006
    area: FED
    statement: "A domain MUST become routable to a connection only after a DNS TXT record proves control of the domain."
    rationale: "Home-realm routing for the wrong domain is an account-takeover path."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3", depth: Partial}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "domain verification test"}
  - id: REQ-FED-007
    area: FED
    statement: "sluis SHOULD be usable as an upstream by another sluis installation through the same connector, with peer trust declared by key set."
    rationale: "Peer trust composes installations."
    level: SHOULD
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3", depth: Full}
      - {id: ST-29, section: "4", depth: Full}
      - {id: ST-07, section: "2", depth: Partial}
    issues: [916, 963]
    verification:
      - {kind: integration-test, ref: "peer integration test"}
  - id: REQ-FED-008
    area: FED
    statement: "All outbound discovery, key-set and token fetches MUST pass an egress policy that checks addresses after name resolution and refuses loopback, link-local and private addresses outside the local profile."
    rationale: "SSRF through an attacker-chosen discovery URL reaches internal services."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [792]
    verification:
      - {kind: integration-test, ref: "SSRF tests (metadata address, loopback, private)"}
  - id: REQ-FED-009
    area: FED
    statement: "sluis MAY provide a SAML service-provider connector."
    rationale: "SAML is outside the current register."
    level: MAY
    source: stakeholder-ciam
    status: out-of-scope
    runtimes: all
    standards:
      - {id: ST-43, section: "2", depth: Partial}
    features: ["design"]
    verification:
      - {kind: manual, ref: "scope record"}
  - id: REQ-FED-018
    area: FED
    split_from: REQ-FED-009
    statement: "A SAML service-provider connector, where provided, MUST NOT accept an unsigned assertion."
    rationale: "SAML is outside the current register."
    level: MUST
    source: stakeholder-ciam
    status: out-of-scope
    runtimes: all
    standards:
      - {id: ST-43, section: "2", depth: Partial}
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "signature-wrapping corpus"}
  - id: REQ-FED-019
    area: FED
    split_from: REQ-FED-009
    statement: "A SAML service-provider connector, where provided, MUST NOT accept an unsolicited response."
    rationale: "SAML is outside the current register."
    level: MUST
    source: stakeholder-ciam
    status: out-of-scope
    runtimes: all
    standards:
      - {id: ST-43, section: "2", depth: Partial}
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "unsolicited-response test"}
  - id: REQ-FED-010
    area: FED
    statement: "A social-identity sign-in MUST count as a first factor only."
    rationale: "Social sign-in carries no assurance sluis has verified."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "first-factor-only test"}
  - id: REQ-FED-020
    area: FED
    split_from: REQ-FED-010
    statement: "A further own factor MUST be required before any assurance level is granted to a social-identity sign-in."
    rationale: "Social sign-in carries no assurance sluis has verified."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "further-factor test"}
  - id: REQ-FED-021
    area: FED
    statement: "sluis MUST refuse the sign-in of a person whom the directory has disabled."
    rationale: "A known disable takes effect at once, and the bounded window for last-known groups applies only while the directory is unreachable, where sluis cannot learn of a disable."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
    issues: [807]
    verification:
      - {kind: integration-test, ref: "disabled person sign-in test"}
  - id: REQ-FED-022
    area: FED
    statement: "When domain discovery finds no verified domain, sluis MUST send the person to the client's default connection with the same response shape as for a known domain."
    rationale: "The answer must not reveal whether a domain or an address is known."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3", depth: Partial}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "response comparison for a known and an unknown domain"}
  - id: REQ-FED-023
    area: FED
    statement: "A verified domain MUST route to exactly one connection in a customer boundary."
    rationale: "A second claim on a verified domain would capture its sign-ins."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "second claim on a verified domain is refused"}
  - id: REQ-FED-024
    area: FED
    statement: "sluis MUST verify the DNS TXT record of a routable domain again at least every 24 hours."
    rationale: "A domain that changes hands must stop routing to the old owner's provider."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "re-verification schedule test with a moved clock"}
  - id: REQ-FED-025
    area: FED
    statement: "sluis MUST stop routing a domain whose proof has failed three consecutive checks."
    rationale: "A lapsed proof is no proof."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "three failed checks stop routing"}
  - id: REQ-FED-026
    area: FED
    statement: "sluis MUST refuse an idp_hint that names a connection the client does not allow, with invalid_request."
    rationale: "A hint chooses among allowed connections and cannot create or widen one."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "hint matrix: allowed, not allowed, unknown"}
  - id: REQ-FED-027
    area: FED
    statement: "Each upstream connection MUST carry a trust level of internal, partner or customer that bounds the grants a person who signed in through it can hold."
    rationale: "Reach and strength are separate limits, and reach is compiled into policy guards."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "a customer-level person is refused a grant in an all scope"}
  - id: REQ-FED-028
    area: FED
    statement: "sluis MUST treat an upstream acr value that the connection's mapping table does not name as unknown."
    rationale: "An unmapped value must not be read as a level."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: NC-01, section: "8176", depth: Partial}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "mapping table test with an unmapped value"}
  - id: REQ-FED-029
    area: FED
    statement: "sluis MUST verify the signature, iss, aud, iat, exp and events claim of an upstream logout token before it acts on it."
    rationale: "An unchecked logout token would let anyone end a person's sessions."
    level: MUST
    source: standard
    status: planned
    runtimes: all
    standards:
      - {id: ST-31, section: "2.4", depth: Full}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "logout token validation matrix"}
  - id: REQ-FED-030
    area: FED
    statement: "sluis MUST accept the jti of an upstream logout token only once."
    rationale: "A replayed logout token must change nothing."
    level: MUST
    source: standard
    status: planned
    runtimes: all
    standards:
      - {id: ST-31, section: "2.6", depth: Full}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "replayed logout token test"}
  - id: REQ-FED-031
    area: FED
    statement: "sluis MUST refuse an upstream logout token that carries a nonce."
    rationale: "A logout token with a nonce is an ID token passed off as a logout token."
    level: MUST
    source: standard
    status: planned
    runtimes: all
    standards:
      - {id: ST-31, section: "2.4", depth: Full}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "logout token with nonce is refused"}
  - id: REQ-FED-032
    area: FED
    statement: "A logout token with a sid MUST end the sluis sessions that were started from that upstream session."
    rationale: "The upstream's session id is the key that ties its sign-out to sluis's sessions (ADR 0051)."
    level: MUST
    source: standard
    status: planned
    runtimes: all
    standards:
      - {id: ST-31, section: "2.6", depth: Full}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "sid mapping test with two upstream sessions of one person"}
  - id: REQ-FED-033
    area: FED
    statement: "A logout token with only a sub MUST end the human sessions of that person that came through that connection."
    rationale: "Without a sid the person is the finest key the logout names."
    level: MUST
    source: standard
    status: planned
    runtimes: all
    standards:
      - {id: ST-31, section: "2.6", depth: Full}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "sub-only logout test; agent sessions stay"}
  - id: REQ-FED-034
    area: FED
    statement: "sluis MUST bound the number of pending sign-in records of one connection."
    rationale: "Unauthenticated requests must not create unbounded state."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "pending sign-in cap test"}
