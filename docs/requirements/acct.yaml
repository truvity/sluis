# ACCT: Customer accounts
schema: 1
area: ACCT
requirements:
  - id: REQ-ACCT-001
    area: ACCT
    statement: "An account record MUST hold authentication facts only."
    rationale: "A registry of authentication facts keeps identity-verification results and product data out of the account store."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "schema scan for forbidden fields"}
  - id: REQ-ACCT-002
    area: ACCT
    statement: "An account identifier MUST be random, 128 bits long and immutable."
    rationale: "A random identifier reveals nothing and cannot be guessed."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "identifier entropy and immutability test"}
  - id: REQ-ACCT-003
    area: ACCT
    statement: "The account decoder MUST refuse a record that contains an unknown field."
    rationale: "Closed decoding stops attributes from creeping in."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "unknown-field decoder test"}
  - id: REQ-ACCT-004
    area: ACCT
    statement: "The e-mail address of a personal account MUST be unique by a normalised comparison key."
    rationale: "Two accounts for one mailbox would split a person's identity."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "uniqueness test"}
  - id: REQ-ACCT-005
    area: ACCT
    statement: "Two concurrent registrations of the same e-mail address MUST produce exactly one account."
    rationale: "A race must not create duplicates."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "concurrent registration test"}
  - id: REQ-ACCT-006
    area: ACCT
    statement: "Two registrations whose e-mail addresses differ only in the case of the local part MUST produce one account."
    rationale: "Case variants name the same mailbox in practice."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "case-variant registration test"}
  - id: REQ-ACCT-007
    area: ACCT
    statement: "The e-mail address of a corporate account MUST be treated as unverified display data."
    rationale: "The organisation, not the mailbox, vouches for a corporate identity."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "corporate e-mail display-only test"}
  - id: REQ-ACCT-008
    area: ACCT
    statement: "The e-mail address of a corporate account MUST NOT be required to be unique."
    rationale: "Two corporate accounts of different organisations may share an address."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "non-unique corporate e-mail test"}
  - id: REQ-ACCT-009
    area: ACCT
    statement: "A storage key MUST NOT contain an e-mail address in clear."
    rationale: "Storage keys leak into logs and backups."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "storage key scan"}
  - id: REQ-ACCT-010
    area: ACCT
    statement: "A write that spans several account records MUST be a sequence of idempotent steps with a recovery marker."
    rationale: "Without transactions a crash must leave a repairable state."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "crash-between-steps recovery test"}
  - id: REQ-ACCT-011
    area: ACCT
    statement: "Subject state transitions MUST be limited to those of the defined state machine."
    rationale: "Every gate depends on one unambiguous standing."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "5", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "state-pair unit test"}
  - id: REQ-ACCT-012
    area: ACCT
    statement: "An undefined subject state transition MUST be refused with failed_precondition."
    rationale: "A refused transition must be distinguishable from a failure."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "5", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "undefined transition refusal test"}
  - id: REQ-ACCT-013
    area: ACCT
    statement: "A sign-in MUST complete only for a live subject that has no security hold."
    rationale: "A held or suspended subject must not obtain tokens."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "sign-in by state test"}
  - id: REQ-ACCT-014
    area: ACCT
    statement: "A hub account MUST have the class personal or corporate."
    rationale: "Resource servers gate products by class."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "class vocabulary test"}
  - id: REQ-ACCT-015
    area: ACCT
    statement: "The path that creates an account MUST set its class: personal for self-registration and corporate for organisation just-in-time provisioning."
    rationale: "The creating path is the evidence for the class."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "class by creating path test"}
  - id: REQ-ACCT-016
    area: ACCT
    statement: "The class of an account MUST change only through an administrative operation."
    rationale: "A silent class change would move a person between product audiences."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "class change authorisation test"}
  - id: REQ-ACCT-017
    area: ACCT
    statement: "The account class MUST be released as a claim only to clients whose release list includes it."
    rationale: "Minimal disclosure applies to the class claim too."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5.4", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "class claim release test"}
  - id: REQ-ACCT-018
    area: ACCT
    statement: "A corporate account MUST NOT have a passkey."
    rationale: "An employer identity provider must never become a way into a personal account."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "corporate passkey enrolment refusal test"}
  - id: REQ-ACCT-019
    area: ACCT
    statement: "A corporate account MUST NOT have recovery codes."
    rationale: "Recovery of a corporate account belongs to its organisation."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "corporate recovery code refusal test"}
  - id: REQ-ACCT-020
    area: ACCT
    statement: "A corporate account MUST sign in only through its linked organisation connection."
    rationale: "A sign-in through another connection would be an account-linking attack."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "3", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "unlinked connection refusal test"}
  - id: REQ-ACCT-021
    area: ACCT
    statement: "Accounts MUST be created only by self-registration, organisation just-in-time provisioning, workforce staff operations, the cohort import or test seeding."
    rationale: "A closed list of creation paths makes consent auditable."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "creation path inventory test"}
  - id: REQ-ACCT-022
    area: ACCT
    statement: "The administrative interface MUST NOT offer an operation that creates a personal account on a person's behalf, except the cohort import."
    rationale: "Consent to the terms and the first factor must come from the person."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "administrative catalogue scan"}
  - id: REQ-ACCT-023
    area: ACCT
    statement: "The hub MUST read account data only through the methods of the accounts module."
    rationale: "One boundary keeps the credential store from leaking into the hub."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "import-boundary test"}
  - id: REQ-ACCT-024
    area: ACCT
    statement: "Requests from the hub to the accounts module MUST NOT carry a client identifier, a sector or an entity identifier."
    rationale: "The credential boundary must not be able to build a person-to-entity graph."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "request payload inspection test"}
  - id: REQ-ACCT-025
    area: ACCT
    statement: "The account standing method MUST return no personal data."
    rationale: "Standing is needed on every request and must stay out of storage."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "standing response scan"}
  - id: REQ-ACCT-026
    area: ACCT
    statement: "The hub MUST NOT write personal data to storage, including session and held records."
    rationale: "The hub keeps personal data only in request memory."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "storage scan for personal data"}
  - id: REQ-ACCT-027
    area: ACCT
    statement: "The hub MAY cache an account standing for a bounded hold window to survive an outage of the accounts module."
    rationale: "A short cache keeps degraded operation possible."
    level: MAY
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "hold window outage test"}
  - id: REQ-ACCT-028
    area: ACCT
    statement: "A held standing record MUST contain no e-mail address and no name."
    rationale: "A cached standing must not become a personal-data store."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "held record scan"}
  - id: REQ-ACCT-029
    area: ACCT
    statement: "A disable, a suspension or a security hold MUST take effect immediately, whatever the hold window."
    rationale: "A cached live standing must not survive a disable."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "5", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "disable-then-refresh test"}
  - id: REQ-ACCT-030
    area: ACCT
    statement: "The hub MUST end the sessions of a disabled account and broadcast to the context installations before the disable intent completes."
    rationale: "Containment must be complete when the operator is told it is done."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-31, section: "2.4", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "disable broadcast ordering test"}
  - id: REQ-ACCT-031
    area: ACCT
    statement: "During an outage of the accounts module and inside the hold window, a refresh or an exchange MUST be answered from the held record."
    rationale: "Degraded operation keeps signed-in people working."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-01, section: "6", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "accounts-down refresh test"}
  - id: REQ-ACCT-032
    area: ACCT
    statement: "During an outage of the accounts module, an ID token MUST be issued without profile claims."
    rationale: "The profile cannot be read, so it must not be invented or cached."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5.4", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "accounts-down ID token claim test"}
  - id: REQ-ACCT-033
    area: ACCT
    statement: "During an outage of the accounts module, an account never seen before MUST be refused."
    rationale: "An unknown standing cannot be assumed live."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "5", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "accounts-down unknown-account test"}
  - id: REQ-ACCT-034
    area: ACCT
    statement: "A non-live subject MUST be refused at sign-in with the uniform refusal page."
    rationale: "Disable is a security control, not a hint."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "disabled sign-in test"}
  - id: REQ-ACCT-035
    area: ACCT
    statement: "A non-live subject MUST be refused at refresh with invalid_grant."
    rationale: "A refresh must not outlive the subject's standing."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-01, section: "5.2", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "disabled refresh test"}
  - id: REQ-ACCT-036
    area: ACCT
    statement: "A non-live account MUST be refused at every context leg."
    rationale: "A context must not sign in an account the hub has disabled."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "disabled context leg test"}
  - id: REQ-ACCT-037
    area: ACCT
    statement: "A non-live subject MUST be refused at token exchange."
    rationale: "An exchange must not extend the reach of a disabled subject."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "disabled exchange test"}
  - id: REQ-ACCT-038
    area: ACCT
    statement: "A non-live subject MUST be refused at federated sign-in through an organisation connection, on a sluis error page."
    rationale: "The relying party must not learn why a person was refused."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "disabled federated sign-in test"}
  - id: REQ-ACCT-039
    area: ACCT
    statement: "A context installation MUST end all sessions and consent-bound grants of an account when it receives the account-wide logout token."
    rationale: "A context learns of a disable only through the logout broadcast."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-31, section: "2.4", depth: Full}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "context session end test"}
  - id: REQ-ACCT-040
    area: ACCT
    statement: "A context refresh for a disabled account MUST fail with invalid_grant within 5 seconds of the disable intent returning."
    rationale: "The bound makes disable measurable."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-31, section: "2.4", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "context refresh timing test"}
  - id: REQ-ACCT-041
    area: ACCT
    statement: "Every ceremony of the accounts module MUST end with a signed assertion for the hub."
    rationale: "One assertion format serves every factor source."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-49, section: "7515", depth: Full}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "assertion per ceremony test"}
  - id: REQ-ACCT-042
    area: ACCT
    statement: "The assertion MUST be signed with a non-extractable named key."
    rationale: "The hub's trust stays rooted in a key that cannot be copied."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-49, section: "7515", depth: Full}
      - {id: ST-88, section: "1", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "assertion key extraction negative test"}
  - id: REQ-ACCT-043
    area: ACCT
    statement: "An assertion MUST NOT be valid for longer than 60 seconds."
    rationale: "A short lifetime limits replay."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-52, section: "4", depth: Full}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "assertion lifetime test"}
  - id: REQ-ACCT-044
    area: ACCT
    statement: "The assertion outcome MUST be one of authenticated, registered, enrolled, federate, cancelled, unmet or refused."
    rationale: "A closed outcome set makes the hub's mapping exhaustive."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-52, section: "4", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "outcome vocabulary test"}
  - id: REQ-ACCT-045
    area: ACCT
    statement: "The hub MUST verify the signature of an assertion against a pinned key identifier."
    rationale: "An unpinned key identifier would let a new key sign in."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-49, section: "7515", depth: Full}
      - {id: ST-56, section: "3", depth: Full}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "tampered and unpinned assertion tests"}
  - id: REQ-ACCT-046
    area: ACCT
    statement: "The hub MUST verify the issuer, audience, nonce and times of an assertion."
    rationale: "Each claim closes a different substitution attack."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-52, section: "7", depth: Full}
      - {id: ST-56, section: "3", depth: Full}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "claim mismatch and expiry tests"}
  - id: REQ-ACCT-047
    area: ACCT
    statement: "The hub MUST refuse an assertion whose identifier it has already seen."
    rationale: "A replayed assertion must never sign a person in."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-52, section: "4", depth: Full}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "replayed jti test"}
  - id: REQ-ACCT-048
    area: ACCT
    statement: "The hub MUST accept no assurance level that the factors of an assertion do not prove."
    rationale: "The hub, not the accounts module, decides the level."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: NC-01, section: "8176", depth: Partial}
    features: ["design"]
    superseded_by: [REQ-CIAM-017]
    verification:
      - {kind: integration-test, ref: "level-from-factors test"}
  - id: REQ-ACCT-049
    area: ACCT
    statement: "A ceremony handle MUST be single use and valid for at most 600 seconds."
    rationale: "A bounded handle limits abandoned ceremonies."
    level: MUST
    source: stakeholder-ciam
