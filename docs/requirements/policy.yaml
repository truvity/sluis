# POLICY: Policy
schema: 1
area: POLICY
requirements:
  - id: REQ-POLICY-001
    area: POLICY
    statement: "sluis MUST validate the policy document against its schema at load."
    rationale: "A misread policy is an authorization bug."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [786, 846]
    verification:
      - {kind: test-vectors, ref: "JSON-Schema-Test-Suite"}
  - id: REQ-POLICY-005
    area: POLICY
    split_from: REQ-POLICY-001
    statement: "sluis MUST refuse to start on a policy violation, with an error that names the offending path."
    rationale: "A misread policy is an authorization bug."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [786, 846]
    verification:
      - {kind: integration-test, ref: "load-refusal tests"}
  - id: REQ-POLICY-002
    area: POLICY
    statement: "A request MUST be denied unless a policy grant explicitly allows it."
    rationale: "Deny by default is the base of least privilege."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [786, 787]
    verification:
      - {kind: integration-test, ref: "policy tests (allow, deny)"}
  - id: REQ-POLICY-006
    area: POLICY
    split_from: REQ-POLICY-002
    statement: "Grant names MUST follow the declared vocabulary, with wildcards matching only where the vocabulary allows."
    rationale: "Deny by default is the base of least privilege."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [786, 787]
    verification:
      - {kind: integration-test, ref: "policy tests (wildcard)"}
      - {kind: test-vectors, ref: "policy corpus"}
  - id: REQ-POLICY-003
    area: POLICY
    statement: "The policy engine MUST evaluate a policy language with a published grammar and a corpus of conformance cases."
    rationale: "A decision engine that fails open is a bypass."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: NC-12, section: "Cedar", depth: Full}
    issues: [892, 852]
    verification:
      - {kind: test-vectors, ref: "policy-language corpus"}
  - id: REQ-POLICY-007
    area: POLICY
    split_from: REQ-POLICY-003
    statement: "The policy engine MUST fail closed when it cannot evaluate."
    rationale: "A decision engine that fails open is a bypass."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: NC-12, section: "Cedar", depth: Full}
    issues: [892, 852]
    verification:
      - {kind: integration-test, ref: "fail-closed test"}
  - id: REQ-POLICY-004
    area: POLICY
    statement: "A change to policy that weakens a recorded assurance rule, adds an exchange grant or widens a sector MUST require an approval attestation from a second person."
    rationale: "Risky changes need two people."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-49, section: "7", depth: Partial}
    issues: [1052]
    verification:
      - {kind: integration-test, ref: "attestation tests"}
      - {kind: manual, ref: "process review"}
  - id: REQ-POLICY-008
    area: POLICY
    statement: "A policy snapshot that fails validation on reload MUST be refused while the policy in force stays."
    rationale: "A bad policy must never replace a good one."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: NC-12, section: "Cedar", depth: Partial}
    issues: [977, 892]
    verification:
      - {kind: integration-test, ref: "policy reload refusal test"}
  - id: REQ-POLICY-009
    area: POLICY
    statement: "A template-linked policy MUST be refused unless the declared delegation policy allows that link."
    rationale: "Links made on the console stay within reviewed bounds."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: NC-12, section: "Cedar", depth: Partial}
    issues: [892]
    verification:
      - {kind: integration-test, ref: "delegation bound test"}
