# The approved cryptography and parser libraries of sluis, per language (REQ-SEC-008, REQ-SEC-018;
# issue #1039). docs/reference/approved-libraries.md renders the reasoning; this file is the data a
# CI check reads once there is code: a dependency that provides a cryptographic primitive or parses
# a protocol or a format must be listed here, under the language of the executable that links it.
#
# Fields of an entry:
#   name     the module path (Go), the crate (Rust) or the package or platform API (TypeScript)
#   for      what sluis uses it for
#   needed_by  the record that needs the capability (the list itself is approved by review of this file)
#   evaluated  optional: the version the choice was made at and its release date, and a floor when a
#              security fix sets one ("floor" is the oldest version a lockfile may hold)
#
# A library not listed needs a pull request that adds it, with the reason. A version is not
# pinned here: the lockfiles pin versions, and Renovate moves them.
schema: 1

go:
  - { name: "crypto/... (standard library)", for: "ECDSA P-384, AES-256-GCM, SHA-2, HKDF, HMAC, X.509, TLS and the operating system's random generator (crypto/rand)", needed_by: "ADR 0012" }
  - { name: "golang.org/x/crypto/ssh", for: "OpenSSH keys and certificates in Go components and the CLI", needed_by: "ADR 0008" }
  - { name: "github.com/go-piv/piv-go/v2", for: "YubiKey PIV in key-holder, and attestation verification in the CLI and the yubikey-attestation verifier", needed_by: "ADR 0014" }
  - { name: "github.com/ProtonMail/go-crypto", for: "OpenPGP packets: the subkey request, the back-signature, detached signatures", needed_by: "ADR 0013" }
  - { name: "filippo.io/age", for: "Backup archives and export drops (a named exception)", needed_by: "ADR 0012" }
  - { name: "github.com/santhosh-tekuri/jsonschema/v6", for: "Validating configuration against the JSON Schema", needed_by: "ADR 0010" }
  - { name: "connectrpc.com/connect", for: "The Connect protocol, client and server", needed_by: "ADR 0002" }
  - { name: "google.golang.org/protobuf", for: "Protobuf encoding and decoding", needed_by: "ADR 0002" }
  - { name: "github.com/go-jose/go-jose/v4", for: "JWS, JWK and JWT: verifying tokens and client assertions, reading and writing key sets; never JWE", needed_by: "ADR 0006", evaluated: "v4.1.7, 2026-10-30; floor v4.1.7 (five advisories against v4.1.6 and earlier, published 2026-10-30)" }
  - { name: "github.com/zitadel/oidc/v3", for: "The OpenID Provider of session and exchange (pkg/op) and the relying party of the oidc upstream (pkg/client/rp)", needed_by: "ADR 0014", evaluated: "v3.51.16, 2026-10-15; floor v3.47.0 (advisory of 2026-08-24)" }
  - { name: "golang.org/x/oauth2", for: "The OAuth 2.0 client under the relying party of the oidc upstream", needed_by: "ADR 0006", evaluated: "v0.37.0, 2026-08-25" }
  - { name: "golang.org/x/mod/sumdb/note", for: "C2SP signed notes in writer and witness; the signer goes through the keys port", needed_by: "ADR 0016", evaluated: "golang.org/x/mod v0.42.0, 2026-10-09" }
  - { name: "golang.org/x/mod/sumdb/tlog", for: "Hashes and tiles of a tiled log in writer and witness", needed_by: "ADR 0016", evaluated: "golang.org/x/mod v0.42.0, 2026-10-09" }
  - { name: "filippo.io/torchwood", for: "C2SP checkpoints, cosignatures and tiles, and the tile client, in writer and witness", needed_by: "ADR 0016", evaluated: "v0.10.0, 2026-09-24 (before 1.0)" }
  - { name: "filippo.io/sunlight", for: "C2SP static-ct-api entries and checkpoints, in the issuance log of ca", needed_by: "ADR 0008", evaluated: "v0.10.2, 2026-10-26" }
  - { name: "go.yaml.in/yaml/v3", for: "Reading the install file behind the strict profile of docs/reference/install-file.md", needed_by: "ADR 0010", evaluated: "v3.0.6, 2026-10-13" }

rust:
  - { name: "aws-lc-rs", for: "AES-256-GCM with RandomizedNonceKey, ECDSA P-384, HKDF, SHA-2 and the library's random generator", needed_by: "ADR 0012" }
  - { name: "rustls", for: "TLS, with the aws-lc-rs provider and no FIPS pin", needed_by: "ADR 0014" }
  - { name: "cedar-policy", for: "Parsing, validating and evaluating Cedar policy in policy", needed_by: "ADR 0009" }
  - { name: "jsonschema", for: "Validating configuration against the JSON Schema", needed_by: "ADR 0010" }
  - { name: "connectrpc", for: "The Connect protocol over Unix sockets, once spike S1 passes", needed_by: "ADR 0014" }
  - { name: "zeroize", for: "Wiping secrets from memory when they are dropped", needed_by: "ADR 0014" }
  - { name: "jsonwebtoken (feature aws_lc_rs)", for: "Verifying JWS and JWT with an explicit algorithm list", needed_by: "ADR 0006", evaluated: "11.1.0, 2026-09-16" }
  - { name: "signed_note", for: "C2SP signed notes in indexer and reader; the P-384 verifier of the log key is a NoteVerifier on aws-lc-rs", needed_by: "ADR 0016", evaluated: "0.2.0, 2025-04-18 (repository changed 2026-10-27; a pinned revision needs a pull request to this file)" }
  - { name: "tlog_tiles", for: "C2SP checkpoints and tiles in indexer and reader", needed_by: "ADR 0016", evaluated: "0.2.0, 2025-04-18 (repository changed 2026-10-27; a pinned revision needs a pull request to this file)" }
  - { name: "saphyr-parser", for: "Reading the install file behind the strict profile of docs/reference/install-file.md", needed_by: "ADR 0010", evaluated: "0.3.3, 2026-10-27" }
  - { name: "ssh-key", for: "OpenSSH keys and certificates in ssh-ca, with a signing key that signs through the keys port", needed_by: "ADR 0008", evaluated: "0.6.7, 2024-10-15 (last stable); 0.7.0-rc.11, 2026-06-29. Condition: a stable 0.7, or 0.6.7 with the certificate interop tests, or ssh-ca in Go (rule R11)" }
  - { name: "aws-sdk-* (the AWS SDK for Rust)", for: "Calls to AWS services from the AWS-backed drivers; its SigV4 and checksums are outside any FIPS module", needed_by: "ADR 0014" }

typescript:
  - { name: "ajv (draft 2020-12 build)", for: "Validating configuration against the JSON Schema", needed_by: "ADR 0010" }
  - { name: "WebCrypto (crypto.subtle) and WebAuthn (navigator.credentials)", for: "Cryptography and passkeys in the console's single-page application, from the browser", needed_by: "ADR 0006" }
  - { name: "@connectrpc/connect", for: "The Connect client of the public API (connect-es)", needed_by: "ADR 0017" }
  - { name: "jose", for: "Verifying tokens in the console's single-page application and in the verification demo", needed_by: "ADR 0006", evaluated: "6.2.14, 2026-10-29" }

# Libraries that are not to be used, with the reason and the record that refuses them (needed_by: the record).
refused:
  - { name: "yubikey (Rust crate)", reason: "Its own notice says it is unaudited and experimental (R7)", needed_by: "ADR 0014" }
  - { name: "ykcs11 through cryptoki, for key-holder", reason: "It resets the card for every client when a second one appears and keeps a PIN copy that cannot be wiped", needed_by: "ADR 0014" }
  - { name: "gpg on a node", reason: "sluis builds the OpenPGP packets itself and the card signs; no gpg on a board", needed_by: "ADR 0013" }
  - { name: "A Go plugin (.so) or WebAssembly module in an actor", reason: "Plugins run out of process, always", needed_by: "ADR 0004" }
  - { name: "lestrrat-go/jwx, golang-jwt/jwt (Go)", reason: "A second JOSE library beside go-jose, which the OpenID Connect provider already needs", needed_by: "docs/reference/approved-libraries.md" }
  - { name: "josekit (Rust)", reason: "Built on OpenSSL, not aws-lc-rs, and not released since 2025-05-20", needed_by: "docs/reference/approved-libraries.md" }
  - { name: "ory/fosite, dexidp/dex, coreos/go-oidc", reason: "fosite has its own OAuth 2.0 and no release since 2024-12-12; Dex is a server with its own storage; go-oidc is a relying party only", needed_by: "docs/reference/approved-libraries.md" }
  - { name: "Tessera as the audit writer's engine", reason: "It sequences entries and publishes checkpoints itself, while the writer owns the batch, the seal entry and the write-once fence", needed_by: "ADR 0016" }
  - { name: "serde_yaml, serde_yml, serde-saphyr, goccy/go-yaml", reason: "Deprecated or unmaintained, or they read a different document than the other language or print the source in an error", needed_by: "docs/reference/approved-libraries.md" }
  - { name: "russh (for ssh-ca)", reason: "An SSH transport; ssh-ca issues certificates and speaks no SSH", needed_by: "docs/reference/approved-libraries.md" }
