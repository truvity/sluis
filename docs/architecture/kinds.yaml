  - name: RateWindow
    serves: work
    scope: boundary+tenant
    class: temp
    treatment: plain
    profile: "-"
    writer: entry
    readers: [entry]
    exportable: no
    backed_up: no
    ttl: {default: "the window", max: 1h}
    notes: "Protective token buckets per connection, client and source address (not quota); counts only. The id of a source-address bucket is a keyed hash (key@ Mac, boundary `mac` key) with tenant `-`, never the address. On boards each window write is a Raft commit."

  - name: Lease
    serves: work
    scope: boundary
    class: temp
    treatment: plain
    profile: "-"
    writer: self
    self_scoped: true
    readers: [self]
    exportable: no
    backed_up: no
    ttl: {default: 30s, max: 10m}
    notes: "A conditional create plus a TTL; the version is the fencing token. Background jobs only (a reconciler, a scheduled adapter, the backup job). Never swept: an expired lease is taken over by a conditional update of the same item, so its version only grows (rqlite's sweeper and DynamoDB TTL skip it; on DynamoDB its TTL attribute is set far in the future and the expiry is read-time only)."

  - name: SpentGrant
    serves: keys
    scope: boundary+tenant
    class: temp
    treatment: hashed
    profile: "-"
    writer: self
    self_scoped: true
    readers: [self]
    exportable: no
    backed_up: no
    ttl: {default: 2m, max: 5m}
    notes: "The hash of a sealed grant used for a one-shot irreversible action (an artifact signature, a mint)."

  - name: SpentPush
    serves: work
    scope: boundary+tenant
    class: temp
    treatment: hashed
    profile: "-"
    writer: quota
    readers: [quota]
    exportable: no
    backed_up: no
    ttl: {default: 7d, max: 30d}
    layer_module: quota module
    notes: "The hash of the request id of an allowance push that was applied, so a retried push changes nothing. A hashed spent marker, like SpentGrant, but with one writer."

  - name: LogLevelOverride
    serves: work
    scope: boundary
    class: temp
    treatment: plain
    profile: Operable
    layer: {group: Logging, layer: operator}
    writer: console
    readers: [every actor (its own id only)]
    watched_by: [every actor (its own id only)]
    exportable: no
    backed_up: no
    ttl: {default: 1h, max: 24h}
    notes: "A run-time loosening (debug), so it expires. The console writes it itself (with Switch, the only kinds it writes): every actor reads its own id."

  - name: PredefinedPolicyLinkTemporary
    serves: work
    scope: boundary+tenant
    class: temp
    treatment: plain
    profile: Operable
    layer: {group: PolicySet, layer: operator}
    writer: exchange
    readers: [policy, console]
    watched_by: [policy]
    exportable: no
    backed_up: no
    ttl: {default: 1h, max: 24h}
    notes: "A link to a predefined policy that loosens, such as break-glass recovery; it names the policy and a group, a role or a session chain (random ids), never a person, so it stays plain; it expires, and policy recompiles when it does."

  - name: SlackInstallState
    serves: work
    scope: boundary+tenant
    class: temp
    treatment: hashed
    profile: "-"
    writer: adapter-slack
    readers: [adapter-slack]
    exportable: no
    backed_up: no
    ttl: {default: 10m, max: 10m}
    notes: "OAuth state of an install in progress."

  - name: GitHubManifestState
    serves: work
    scope: boundary+tenant
    class: temp
    treatment: hashed
    profile: "-"
    writer: adapter-github
    readers: [adapter-github]
    exportable: no
    backed_up: no
    ttl: {default: 1h, max: 1h}
    notes: "OAuth-style state of a manifest flow in progress; 1 h is the vendor's manifest code lifetime. Tenant-scoped, as SlackInstallState is."

  - name: EntraConsentState
    serves: work
    scope: boundary+tenant
    class: temp
    treatment: hashed
    profile: "-"
    writer: adapter-upstream-oidc
    readers: [adapter-upstream-oidc]
    exportable: no
    backed_up: no
    ttl: {default: 10m, max: 10m}

  - name: PendingEnrolment
    serves: work
    scope: boundary
    class: temp
    treatment: sealed
    personal: true
    profile: "-"
    writer: exchange
    readers: [exchange, console]
    exportable: no
    backed_up: no
    ttl: {default: 7d, max: 30d}
    notes: "An enrolment waiting for manual approval: the host's name, the requester and the short code, sealed under the boundary's `data` key (tenant `-`). Lost means the host asks again."

  - name: EnrolmentNonce
    serves: work
    scope: boundary
    class: temp
    treatment: hashed
    profile: "-"
    writer: exchange
    readers: [exchange]
    exportable: no
    backed_up: no
    ttl: {default: 5m, max: 5m}
    notes: "The fresh server nonce the enrolment HMAC covers."

  - name: DirectoryUser
    serves: work
    scope: boundary+tenant
    class: temp
    treatment: sealed
    personal: true
    profile: "-"
    writer: adapter-<vendor>
    readers: [session, exchange, adapter-<vendor> (as facts source)]
    exportable: no
    backed_up: no
    ttl: {default: 24h, max: 7d}
    indexes: [by_upstream_subject_hash]
    notes: "A learned fact: rebuildable by a re-sync, so temp with a long TTL (24 h default, 7 d at most). Holds names and addresses, so sealed. Tenant-scoped: a directory is read through a connection of that tenant. Id carries the vendor's own organisation."

  - name: DirectoryGroup
    serves: work
    scope: boundary+tenant
    class: temp
    treatment: sealed
    personal: true
    profile: "-"
    writer: adapter-<vendor>
    readers: [session, exchange, adapter-<vendor> (as facts source)]
    exportable: no
    backed_up: no
    ttl: {default: 24h, max: 7d}
    notes: "Group and team names are vendor free text, so sealed. Tenant-scoped, as DirectoryUser is."

  - name: DirectoryMembership
    serves: work
    scope: boundary+tenant
    class: temp
    treatment: sealed
    personal: true
    profile: "-"
    writer: adapter-<vendor>
    readers: [session, exchange, adapter-<vendor> (as facts source)]
    exportable: no
    backed_up: no
    ttl: {default: 24h, max: 7d}
    indexes: [by_group, by_user]
    notes: "Holds vendor user ids, so sealed; the two indexes hold keyed hashes (key@ Mac, purpose `mac`) of the group and user ids. Tenant-scoped, as DirectoryUser is."

  - name: DesiredState
    serves: work
    scope: boundary+tenant
    class: temp
    treatment: sealed
    personal: true
    profile: "-"
    links: [ReconcileTarget, DirectoryConnection]
    writer: adapter-<vendor>
    readers: [adapter-<vendor> (as provisioner)]
    exportable: no
    backed_up: no
    ttl: {default: 24h, max: 7d}
    indexes: [by_target]
    notes: "One part of the desired state of a target: the people one source directory connection puts in it, addressed by digest. Written by the adapter of that directory (adapter-upstream-oidc for Google Workspace and Entra, adapter-github for a GitHub organisation) under the lease of its refresh, from the answer of policy's batch membership method; read by the provisioner of the target, which reconciles to the union of the current parts. Names users, so sealed, under the data key of the tenant that owns the container, which is not always the tenant of the source: a part from another company is written there for a declared pair only, and holds vendor identifiers only. A missing or stale part is unreadable, never empty."

  - name: Crl
    serves: work
    scope: boundary
    class: temp
    treatment: plain
    profile: "-"
    writer: ca
    readers: [exporter@]
    exportable: yes
    backed_up: no
    ttl: {default: 7d, max: 7d}
    notes: "One static CRL per intermediate, re-signed every 24 h with nextUpdate 7 d and at once after a revocation. Derived from Revocation, so temp."

  - name: Krl
    serves: work
    scope: boundary
    class: temp
    treatment: plain
    profile: "-"
    writer: ssh-ca
    readers: [exporter@]
    exportable: yes
    backed_up: no
    ttl: {default: 7d, max: 7d}
    notes: "The SSH key revocation list hosts fetch."

  - name: TrustBundle
    serves: work
    scope: boundary
    class: temp
    treatment: plain
    profile: "-"
    writer: ca
    readers: [exchange, exporter@]
    exportable: yes
    backed_up: no
    ttl: {default: 24h, max: 7d}
    notes: "The SPIFFE trust bundle hosts sync, rendered from TrustAnchors and KeyCertificate; its certificates verify themselves. ca renders chains, so ca writes it."

  - name: ExportCursor
    serves: data
    scope: boundary
    class: temp
    treatment: plain
    profile: "-"
    writer: exporter@
    readers: [exporter@]
    exportable: no
    backed_up: no
    ttl: {default: 30d, max: 30d}
    notes: "The resume point per destination; losing it costs a full reconcile, which runs at start and daily anyway."

  - name: ExportManifest
    serves: data
    scope: boundary
    class: durable
    treatment: plain
    profile: "-"
    writer: exporter@
    readers: [exporter@, signer, console]
    exportable: no
    backed_up: no
    notes: "The documents exporter@ is configured to publish, one item (id default) written at its start and whenever its destinations change (ADR 0009, \"The order and the time\"): for each document the destination, the document, the kind it is built from and whether it has a public address that exporter@ reads back. signer reads it to know which ExportReports it must see before it makes a token key active (REQ-KEYS-116): it counts the reports of the entries with a public address, treats an entry with no report as not published, and ignores a report that no entry names, which is a destination that was removed. Durable, so that a publisher that has gone quiet keeps holding activation instead of being forgotten with its reports (a temp kind would expire into \"nothing to wait for\"); exporter@ writes it again, and deletes the reports of what it no longer publishes, at every start. Not backed up: the next start writes it. Plain: it holds names only."

  - name: PinReleaseRequest
    serves: keys
    scope: boundary
    class: temp
    treatment: plain
    profile: "-"
    writer: key@
    readers: [key@]
    watched_by: [key@]
    exportable: no
    backed_up: no
    ttl: {default: 5m, max: 15m}
    notes: "A locked board's request for its card PIN: the signed text sluis-pin-release-v1, boundary, node, request id (a UUIDv7) and an ephemeral public key made by the locked board's card driver for this request, each field length-prefixed, and an ES384 signature over it by the board's pin-release key (slot 87, PIN policy never, attested in the KeyPlan's slot map). Public values only, so plain. Id <node>/<request>. An unlocked peer's key@ polls the kind, checks that the node is a listed, unrevoked peer of the boundary, that the request is fresh and its id unused, verifies the signature and, through its own card driver, the slot attestation, and answers with a PinRelease. Default 5 min, at most 15 min; a request that expires is made again."

  - name: PinRelease
    serves: keys
    scope: boundary
    class: temp
    treatment: plain
    profile: "-"
    writer: key@
    readers: [key@]
    watched_by: [key@]
    exportable: no
    backed_up: no
    ttl: {default: 5m, max: 15m}
    notes: "The one answer to a PinReleaseRequest, same id: the boundary's PIN sealed by an unlocked peer's card driver to the ephemeral public key of the request (ECDH P-384, HKDF-SHA384, AES-256-GCM, the request text as info and additional data), in a signed answer text that binds the request id, the request's digest and the ciphertext, ES384 by the releaser's pin-release key. The locked key@ verifies the signature before its driver opens it, so a forged answer is never a PIN attempt. Already ciphertext, so plain. The PIN crosses only the Raft port, through the store. Default 5 min, at most 15 min."

  - name: ExportReport
    serves: data
    scope: boundary
    class: temp
    treatment: plain
    profile: "-"
    writer: exporter@
    readers: [exporter@, signer, console]
    exportable: no
    backed_up: no
    ttl: {default: 48h, max: 7d}
    notes: "What exporter@ published and saw, one item per destination and document, id <destination>/<document> (ADR 0009, \"Publishing public material\"): the state (published, purge-pending, written, unverified), the kind the document is built from, the digest of the body, for a key set the kids it lists, whether the destination has a public address (`public`: signer counts only those reports), and the times of the write, the purge and the read back from the public address. A destination with no public address cannot read back (ReadBack answers unsupported), so its report says written, carries no purge or read back time, and signer does not count it (the ExportManifest says which entries count). signer makes a token key active only after the report of every counted key set has the state published, lists the kid and has a read back at most 26 hours old, and the lead time has passed since (REQ-KEYS-085, REQ-KEYS-116); the console shows the state. exporter@ removes the reports of what is no longer configured at its start. Rewritten by every publication and by the daily reconcile, with the longest time to live the kind allows (7 days), so an item that expires is a publisher that has gone quiet, which a reader treats as not published: the ExportManifest, which does not expire, still names the entry. Plain: it holds public addresses, digests and kids."
