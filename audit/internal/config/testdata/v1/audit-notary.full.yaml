apiVersion: truvity.github.io/audit-notary/v1
archive:
  bucket:
    name: audit-archive
    region: eu-central-1
    endpoint: https://s3.example.test
    pathStyle: true
    credentialsEnv:
      accessKeyID: AUDIT_NOTARY_ACCESS_KEY_ID
      secretAccessKey: AUDIT_NOTARY_SECRET_ACCESS_KEY
  prefix: app
  lockMode: none
  kmsKey: alias/audit-archive
signer:
  file:
    path: /etc/audit/seal/key.pem
profiles:
  - security
  - billing
settle: 10m0s
sink:
  url: http://audit:8080
  tokenFile: /var/run/audit/token
  expect: archived
require: queued
