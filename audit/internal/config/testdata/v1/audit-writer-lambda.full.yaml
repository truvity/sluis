apiVersion: truvity.github.io/audit-writer-lambda/v1
deployment: /var/task/deployment.yaml
catalogues: /var/task/catalogues
archive:
  bucket:
    name: audit-archive
    region: eu-central-1
  prefix: app
  lockMode: governance
  kmsKey: alias/audit-archive
forgetIdentities: true
dedupe:
  dynamodb:
    table: audit-dedupe
    region: eu-central-1
    window: 336h0m0s
require: archived
