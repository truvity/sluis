[workspace]
resolver = "3"
members = ["kits/rust/*", "actors/*", "drivers/*/*"]
# The Go executables live beside the Rust ones (ADR 0012 per-actor table); Cargo must skip them.
exclude = [
  "actors/ca", "actors/key", "actors/session", "actors/exchange", "actors/writer", "actors/adapter-upstream-oidc",
  "drivers/key/software", "drivers/key/yubikey-piv",
]

[workspace.dependencies]
# atoom, pinned by commit until its first release (docs/plan.md of truvity/atoom, step 1): `just atoom-sync` moves this line, go.mod and
# third_party/atoom together, and `just atoom-check` holds them to one commit. Then it moves to `tag = "v0.1.0"`.
atoom-common = { git = "https://github.com/truvity/atoom", rev = "1a91a13fee2c558d23494eabc47d120ee0c32933" }

[workspace.package]
edition = "2024"
version = "0.0.0"          # the release version is stamped at build time (ADR 0013, One version)
license = "MIT"
publish = false
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "deny"        # a crate that needs peer credentials uses the kit's one audited call site

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
