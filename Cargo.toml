[workspace]
resolver = "3"
members = ["kits/rust/*", "actors/*", "drivers/*/*"]
# The Go executables live beside the Rust ones (ADR 0012 per-actor table); Cargo must skip them.
exclude = [
  "actors/ca", "actors/key", "actors/session", "actors/exchange", "actors/writer", "actors/adapter-upstream-oidc",
  "drivers/key/software", "drivers/key/yubikey-piv",
]

[workspace.dependencies]
# atoom, pinned by commit until its first release (docs/plan.md of truvity/atoom, steps 1 to 4): `just atoom-sync` moves this line, go.mod and
# third_party/atoom together, and `just atoom-check` holds them to one commit. Then it moves to `tag = "v0.1.0"`.
atoom-common = { git = "https://github.com/truvity/atoom", rev = "bbe2df79a3af9979f06325db0f5eb9e74ce4b7cf" }
# The item port (step 3): its contract, the conformance kit, the two drivers' libraries and the plain socket host the kit's client uses.
atoom-socket = { git = "https://github.com/truvity/atoom", rev = "bbe2df79a3af9979f06325db0f5eb9e74ce4b7cf" }
atoom-store = { git = "https://github.com/truvity/atoom", rev = "bbe2df79a3af9979f06325db0f5eb9e74ce4b7cf" }
atoom-store-conformance = { git = "https://github.com/truvity/atoom", rev = "bbe2df79a3af9979f06325db0f5eb9e74ce4b7cf" }
atoom-store-memory = { git = "https://github.com/truvity/atoom", rev = "bbe2df79a3af9979f06325db0f5eb9e74ce4b7cf" }
atoom-store-rqlite = { git = "https://github.com/truvity/atoom", rev = "bbe2df79a3af9979f06325db0f5eb9e74ce4b7cf" }
# The source port (step 4): its contract and the two drivers' libraries. Both drivers are Linux only, as sluis's boards are.
atoom-source = { git = "https://github.com/truvity/atoom", rev = "bbe2df79a3af9979f06325db0f5eb9e74ce4b7cf" }
atoom-source-credential = { git = "https://github.com/truvity/atoom", rev = "bbe2df79a3af9979f06325db0f5eb9e74ce4b7cf" }
atoom-source-file = { git = "https://github.com/truvity/atoom", rev = "bbe2df79a3af9979f06325db0f5eb9e74ce4b7cf" }

[workspace.package]
edition = "2024"
version = "0.0.0"          # the release version is stamped at build time (ADR 0013, One version)
license = "MIT"
publish = false
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "deny"        # a crate that needs peer credentials uses the kit's one audited call site

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
