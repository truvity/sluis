[workspace]
resolver = "3"
members = ["kits/rust/*", "actors/*", "drivers/*/*"]
# The Go executables live beside the Rust ones (ADR 0012 per-actor table); Cargo must skip them.
exclude = [
  "actors/ca", "actors/key", "actors/session", "actors/exchange", "actors/writer", "actors/adapter-upstream-oidc",
  "drivers/key/software", "drivers/key/yubikey-piv",
]

[workspace.dependencies]
# atoom, pinned by release tag (docs/plan.md of truvity/atoom): `just atoom-sync X.Y.Z` moves these lines, go.mod and third_party/atoom
# together, and `just atoom-check` holds them to one release and refuses it unless atoom's CI is green on the tagged commit. Cargo.lock
# records the commit the tag names.
atoom-common = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
# The item port: its contract, the conformance kit's library (store@'s tests and the rqlite host's tests use its rules), the two drivers' libraries and the plain socket host.
atoom-socket = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-store = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-store-conformance = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-store-memory = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-store-rqlite = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
# The source port: its contract and the two drivers' libraries. Both drivers are Linux only, as sluis's bare-metal runtime is.
atoom-source = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-source-credential = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-source-file = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
# The audit ports: the contracts and the libraries of the five drivers. The kits of the blob, source, transport and index ports are not used: atoom's CI runs them. The blob drivers are Linux only, as sluis's
# bare-metal runtime is. `atoom-destination` is the port crate with the `Destination` trait, the rules and the client (exporter@ takes all three from it, over `atoom-socket`'s dial); the destination kit holds the service, the in-memory driver and the suite.
atoom-blob = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-blob-fs = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-blob-fsdir = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-blob-fsreadonly = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-destination = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-destination-conformance = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-destination-dir = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-index = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-index-sqlite = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-transport = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }
atoom-transport-spool = { git = "https://github.com/truvity/atoom", tag = "v0.4.0" }

[workspace.package]
edition = "2024"
version = "0.0.0"          # the release version is stamped at build time (ADR 0013, One version)
license = "MIT"
publish = false
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "deny"        # a crate that needs peer credentials uses the kit's one audited call site

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
