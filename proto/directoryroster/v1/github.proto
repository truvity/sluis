syntax = "proto3";

package directoryroster.v1;

import "google/protobuf/timestamp.proto";

import "directoryroster/v1/workspace.proto";

// GitHubService is the console's view of GitHub organisations: which the
// policy binds, and what the GitHub controller last reported for each.
//
// Read-only. The controller acts and the console shows: no call here
// writes to GitHub, and the one thing an operator does through the
// console for GitHub — connecting an organisation — gives the controller
// a credential rather than telling it what to do.
service GitHubService {
  // ListGitHubApps returns every GitHub App this service keeps a key for
  // or is declared to — the link App, one controller App per bound
  // organisation, one runner App per organisation per declared tier, and
  // every App the catalogue declares — each in the same shape, with what
  // GitHub says of it beside what the deployment declares. Viewer.
  rpc ListGitHubApps(ListGitHubAppsRequest) returns (ListGitHubAppsResponse);

  // GetGitHubApp returns one App by the id ListGitHubApps gives it.
  // Viewer.
  rpc GetGitHubApp(GetGitHubAppRequest) returns (GetGitHubAppResponse);

  // ListGitHubAppTokens returns the last installation tokens asked of one
  // App, minted or refused, newest first. Operator: a request names who
  // asked for it.
  //
  // This service's own memory of them, kept since it started and bounded
  // per App — not the audit trail, which holds every request for as long
  // as the bucket does and is one link away on an App's page.
  rpc ListGitHubAppTokens(ListGitHubAppTokensRequest) returns (ListGitHubAppTokensResponse);

  // BeginGitHubAppConnect starts creating any one of those Apps, or
  // finishing installing one created before: its manifest and where to
  // post it, or where to install it. Sets the flow's state cookie.
  // Operator.
  //
  // The state it issues is the one the App's kind has always used, so a
  // browser part-way through a flow finishes at the same callback even if
  // the service restarts under it.
  rpc BeginGitHubAppConnect(BeginGitHubAppConnectRequest) returns (BeginGitHubAppConnectResponse);

  // DisconnectGitHubApp uninstalls one App, then forgets its record and
  // key. The App itself stays on GitHub, for its owner to delete.
  // Operator.
  rpc DisconnectGitHubApp(DisconnectGitHubAppRequest) returns (DisconnectGitHubAppResponse);

  // CheckGitHubApp asks GitHub again what one App and its installation
  // hold, bypassing the short cache the list reads through. Operator.
  rpc CheckGitHubApp(CheckGitHubAppRequest) returns (CheckGitHubAppResponse);

  // RotateGitHubAppWebhook replaces the secret GitHub signs a catalogue
  // App's webhook deliveries with. It keeps the new secret (where the
  // consumers read it), sends the new target a signed ping until it
  // answers 2xx, and only then tells GitHub — the secret and, for a Kargo
  // receiver, the URL derived from it, in one call. A consumer holds one
  // secret, so there is no overlap: a failure before GitHub is told
  // restores the old secret and leaves deliveries as they were. Operator.
  rpc RotateGitHubAppWebhook(RotateGitHubAppWebhookRequest) returns (RotateGitHubAppWebhookResponse);

  // GetGitHubStatus returns every organisation the policy binds or the
  // controller reports on, each with its bound teams and the members the
  // controller derived for them. Viewer.
  //
  // ListGitHubApps says the same things about all four kinds of App at
  // once, and it is what the console reads. The four App-shaped fields
  // here — link_app, runner_apps, catalogue_apps and each
  // organisation's connection — are still filled in, so a client
  // generated against an older proto keeps working; nothing new is
  // added to them.
  rpc GetGitHubStatus(GetGitHubStatusRequest) returns (GetGitHubStatusResponse);

  // BeginGitHubConnect starts connecting an organisation the policy
  // binds: the App's manifest and where to post it, or — for an App
  // already created and not yet installed — where to install it. Sets the
  // flow's state cookie. Operator.
  //
  // An organisation already connected and installed is refused: connecting
  // it again would create a second App beside the first, and the one
  // left installed would be the one nobody holds a key for.
  //
  // Superseded by BeginGitHubAppConnect, which does this for every kind of
  // App. Kept so a console mid-rollout keeps working.
  rpc BeginGitHubConnect(BeginGitHubConnectRequest) returns (BeginGitHubConnectResponse);

  // RequestGitHubPass asks the GitHub controller to pass over now instead of
  // at its next interval: it leaves a marker in the records the controller
  // watches. The operator of the organisation's recorded owner, or the
  // installation-wide operator. Refused with FAILED_PRECONDITION while the
  // organisation is not installed (there is nothing for a pass to act with)
  // and with RESOURCE_EXHAUSTED while the organisation's last request is
  // under a minute old. Recorded as a configuration change.
  rpc RequestGitHubPass(RequestGitHubPassRequest) returns (RequestGitHubPassResponse);

  // ChangeGitHubOrganisationOwner changes the directory recorded as a
  // connected organisation's owner, or removes it. Installation-wide
  // operator only: an owner may not hand its own organisation to another
  // or take it for itself. Recorded as a configuration change.
  rpc ChangeGitHubOrganisationOwner(ChangeGitHubOrganisationOwnerRequest) returns (ChangeGitHubOrganisationOwnerResponse);

  // DisconnectGitHubOrganisation uninstalls the App, then forgets the
  // organisation's record and credential. Operator.
  //
  // Superseded by DisconnectGitHubApp, which does this for every kind of
  // App. Kept so a console mid-rollout keeps working.
  rpc DisconnectGitHubOrganisation(DisconnectGitHubOrganisationRequest) returns (DisconnectGitHubOrganisationResponse);

  // BeginGitHubLinkAppConnect starts creating the link App: the one App
  // people authorize, as themselves, to link their GitHub account to their
  // work addresses. Public, installed nowhere, and asking only to read the
  // person's own email addresses. Created under an organisation the
  // operator owns. Operator.
  //
  // Superseded by BeginGitHubAppConnect, which does this for every kind of
  // App. Kept so a console mid-rollout keeps working.
  rpc BeginGitHubLinkAppConnect(BeginGitHubLinkAppConnectRequest) returns (BeginGitHubLinkAppConnectResponse);

  // BeginGitHubRunnerAppConnect starts creating a runner App: the App a
  // self-hosted runner scale set in one tier registers with in one
  // organisation the policy binds. Its manifest and where to post it, or —
  // for an App already created and not yet installed — where to install
  // it. Sets the flow's state cookie. Operator.
  //
  // One App per organisation per tier, so a compromised runner plane is
  // confined to its tier. A tier the deployment does not declare is
  // refused, and so is one already installed.
  //
  // Superseded by BeginGitHubAppConnect, which does this for every kind of
  // App. Kept so a console mid-rollout keeps working.
  rpc BeginGitHubRunnerAppConnect(BeginGitHubRunnerAppConnectRequest) returns (BeginGitHubRunnerAppConnectResponse);

  // DisconnectGitHubRunnerApp uninstalls a runner App, then forgets it.
  // Runners registered with it stop getting jobs. Operator.
  //
  // Superseded by DisconnectGitHubApp, which does this for every kind of
  // App. Kept so a console mid-rollout keeps working.
  rpc DisconnectGitHubRunnerApp(DisconnectGitHubRunnerAppRequest) returns (DisconnectGitHubRunnerAppResponse);

  // DisconnectGitHubLinkApp forgets the link App. Every link made with it
  // becomes unverifiable — nothing can check its tokens any more — which
  // removes nobody and adds nobody until each person links again.
  // Operator.
  //
  // Superseded by DisconnectGitHubApp, which does this for every kind of
  // App. Kept so a console mid-rollout keeps working.
  rpc DisconnectGitHubLinkApp(DisconnectGitHubLinkAppRequest) returns (DisconnectGitHubLinkAppResponse);

  // ConfirmGitHubRemovals lets a pass that would remove more than half an
  // organisation go ahead — for exactly the set of removals the operator
  // saw, named by its fingerprint in the organisation's report. A
  // different set needs confirming again; a confirmation lapses after a
  // day. Operator.
  rpc ConfirmGitHubRemovals(ConfirmGitHubRemovalsRequest) returns (ConfirmGitHubRemovalsResponse);

  // ImportGitHubLinks adopts pairings of a GitHub login and work addresses
  // that somebody approved elsewhere — github-roster 0.x kept them. Each
  // becomes a link only when the pairing was approved, an address is a
  // live account the directory vouches for, and the account is a member of
  // a connected organisation; a link the person made is never displaced.
  // Operator.
  rpc ImportGitHubLinks(ImportGitHubLinksRequest) returns (ImportGitHubLinksResponse);

  // BeginGitHubCatalogueAppConnect starts creating an App the deployment
  // declares in its catalogue, under the organisation the entry names: its
  // manifest and where to post it, or — for an App already created and not
  // yet installed — where to install it. Sets the flow's state cookie.
  // Operator.
  //
  // An id the catalogue does not declare is refused, and so is an App
  // already installed.
  //
  // Superseded by BeginGitHubAppConnect, which does this for every kind of
  // App. Kept so a console mid-rollout keeps working.
  rpc BeginGitHubCatalogueAppConnect(BeginGitHubCatalogueAppConnectRequest) returns (BeginGitHubCatalogueAppConnectResponse);

  // DisconnectGitHubCatalogueApp uninstalls a catalogue App, then forgets
  // its record and key. The App itself stays on GitHub, for its owner to
  // delete. Operator.
  //
  // Superseded by DisconnectGitHubApp, which does this for every kind of
  // App. Kept so a console mid-rollout keeps working.
  rpc DisconnectGitHubCatalogueApp(DisconnectGitHubCatalogueAppRequest) returns (DisconnectGitHubCatalogueAppResponse);

  // CheckGitHubCatalogueApp asks GitHub again what one catalogue App and
  // its installation hold, bypassing the short cache GetGitHubStatus reads
  // through. Operator.
  //
  // Superseded by CheckGitHubApp, which does this for every kind of
  // App. Kept so a console mid-rollout keeps working.
  rpc CheckGitHubCatalogueApp(CheckGitHubCatalogueAppRequest) returns (CheckGitHubCatalogueAppResponse);
}

// AppPurpose is what a GitHub App is for. Four kinds, one list.
//
// Named for the field rather than for GitHubApp: the linter reads
// "GitHub" as two words and would want GIT_HUB_ on every value.
enum AppPurpose {
  APP_PURPOSE_UNSPECIFIED = 0;
  // the one App people authorize to link their GitHub account.
  APP_PURPOSE_LINK = 1;
  // the App the controller manages one organisation's members and teams
  // through.
  APP_PURPOSE_CONTROLLER = 2;
  // the App one tier's self-hosted runners register with.
  APP_PURPOSE_RUNNERS = 3;
  // an App internal groups mint installation tokens of.
  APP_PURPOSE_TOKENS = 4;
}

// AppOrigin is where an App's declaration comes from: this
// service's own manifest builder, or the deployment's catalogue.
enum AppOrigin {
  APP_ORIGIN_UNSPECIFIED = 0;
  APP_ORIGIN_PRESET = 1;
  APP_ORIGIN_CATALOGUE = 2;
}

// AppState is how far along GitHub's two clicks an App is, and
// whether what GitHub holds still matches what the deployment declares.
// One vocabulary for all four kinds.
enum AppState {
  APP_STATE_UNSPECIFIED = 0;
  APP_STATE_NOT_CREATED = 1;
  // created on GitHub and not installed: nothing can act through it yet.
  APP_STATE_CREATED = 2;
  APP_STATE_INSTALLED = 3;
  // installed, and GitHub holds something other than the declaration.
  APP_STATE_DRIFTED = 4;
}

// AppAttention is who has to move next, in the same four words the
// membership rows use. The exact state is state_detail.
enum AppAttention {
  APP_ATTENTION_UNSPECIFIED = 0;
  APP_ATTENTION_DONE = 1;
  APP_ATTENTION_NEEDS_YOU = 2;
  APP_ATTENTION_WAITING_PERSON = 3;
  APP_ATTENTION_WAITING_CONTROLLER = 4;
}

// GitHubApp is one App, whichever of the four kinds it is: what the
// deployment declares of it, what this service recorded when it was
// created, and what GitHub says of it now. Never the key.
message GitHubApp {
  // the App's id here, stable and the address of its page: `link`,
  // `<org>-controller`, `<org>-runners-<tier>`, or the catalogue id. A
  // catalogue id wins a collision — it is the operator's own name for an
  // App — and the preset moves aside behind a `-preset` suffix.
  string id = 1;
  // the organisation it is installed on; for the link App, the one it was
  // created under.
  string org = 2;
  AppPurpose purpose = 3;
  // the runner tier, for a runner App alone.
  string tier = 4;
  AppOrigin origin = 5;
  // the App's name on GitHub once created, and the name it is created
  // with before that.
  string name = 6;
  string app_slug = 7;
  string description = 8;
  bool public = 9;
  // all or selected: the repositories the installer is expected to
  // choose.
  string installation = 10;
  // all or selected, as installed on GitHub.
  string repository_selection = 11;
  AppState state = 12;
  AppAttention attention = 13;
  // the exact state in words, for a tooltip.
  string state_detail = 14;
  // whether the deployment still declares it. An App created for a tier,
  // an organisation or a catalogue entry since dropped can only be
  // disconnected.
  bool declared = 15;
  // each way GitHub differs from the declaration, as a sentence.
  repeated string drift = 16;
  // every permission declared or held, each with its declared level and
  // what the App and its installation hold.
  repeated GitHubAppPermission permissions = 17;
  // the webhook events declared. They are delivered only to an App whose
  // catalogue entry declares a webhook (webhook_url is then set).
  repeated string events = 18;
  // which internal groups may mint tokens of it, and for how much. Only a
  // catalogue App has any.
  repeated GitHubAppGrant grants = 19;
  string html_url = 20;
  // where the organisation's owner edits or deletes the App, which the
  // API cannot do.
  string settings_url = 21;
  int64 app_id = 22;
  int64 installation_id = 23;
  google.protobuf.Timestamp connected_at = 24;
  string connected_by = 25;
  // when GitHub was last asked.
  google.protobuf.Timestamp checked_at = 26;
  // why GitHub could not be asked, when it could not. The state is then
  // what the record says, and no drift is claimed either way.
  string reason = 27;
  // the Kubernetes Secret the App's key is kept in, and the keys within
  // it, for a deployment copying one. Empty where the deployment keeps no
  // state in Kubernetes.
  string secret = 28;
  repeated string secret_keys = 29;
  // how many accounts people linked through it. The link App only.
  int32 linked_accounts = 30;
  // whether the caller may operate it: hold the operator role over the
  // directory recorded as its organisation's owner, or installation-wide.
  // The link App has no organisation of its own and is operated
  // installation-wide alone. The controller App of an organisation nobody
  // has connected yet may be operated by anyone who could connect it.
  bool can_operate = 31;
  // the directory workspace id recorded as its organisation's owner when
  // the organisation was connected; empty for none, and for the link App.
  string owner_directory = 32;
  // every domain the owner is authoritative for, sorted and joined with ", "
  // (how a person knows the directory); the console words it with the id.
  string owner_domain = 33;
  // whether the caller may change the organisation's owner: the
  // installation-wide operator, on the controller App of a connected
  // organisation.
  bool can_change_owner = 34;
  // where GitHub was last told to deliver the App's events; empty for an
  // App that has no webhook. A Kargo receiver's URL moves with the secret.
  string webhook_url = 35;
  // when the webhook's secret was last set on GitHub: the creation, or the
  // latest rotation.
  google.protobuf.Timestamp webhook_rotated_at = 36;
}

message ListGitHubAppsRequest {}

message ListGitHubAppsResponse {
  repeated GitHubApp apps = 1;
  // false where connecting an organisation is not possible here, because
  // there is nowhere to keep what it leaves behind.
  bool connecting_available = 2;
  // false where people cannot link accounts here, for the same reason.
  bool linking_available = 3;
  // false where this deployment keeps no catalogue Apps.
  bool catalogue_available = 4;
  // the runner tiers this deployment declares.
  repeated string runner_tiers = 5;
  // the organisations the policy binds: the ones an App can be created
  // under.
  repeated string bound_organisations = 6;
  // the page a person opens to link their account. Share it.
  string link_url = 7;
  // the directories the caller may name as the owner of an organisation it
  // connects: every connected directory for the installation-wide
  // operator, the caller's own for a scoped one.
  repeated DirectoryRef owner_choices = 8;
  // whether the caller may connect an organisation with no owner: the
  // installation-wide operator alone.
  bool may_connect_without_owner = 9;
}

message GetGitHubAppRequest {
  // the App's id, as ListGitHubApps gives it.
  string id = 1;
}

message GetGitHubAppResponse {
  GitHubApp app = 1;
}

message BeginGitHubAppConnectRequest {
  string id = 1;
  // the organisation the App is created under. Read for the link App
  // alone, which belongs to no one organisation; every other App is
  // created under the organisation it acts on.
  string owner = 2;
  // for the controller App of an organisation not yet connected: the
  // directory workspace id that will own it. Empty is "none" for the
  // installation-wide operator, and for an operator scoped to exactly one
  // directory means that one; an operator scoped to several must name one
  // of them. Ignored once the organisation is connected.
  string owner_directory = 3;
}

message BeginGitHubAppConnectResponse {
  // where the browser goes next.
  string url = 1;
  // when set, the browser POSTs it as the form field `manifest` to url:
  // GitHub creates an App only from a posted manifest. Empty means url is
  // an ordinary navigation — the App exists and is to be installed.
  string manifest = 2;
}

message DisconnectGitHubAppRequest {
  string id = 1;
}

message DisconnectGitHubAppResponse {
  // whether the installation was removed on GitHub. The App's record and
  // key are forgotten either way.
  bool uninstalled = 1;
  // why it could not be, when it could not.
  string detail = 2;
  // where the organisation's owner deletes the App itself, which the API
  // cannot do.
  string app_settings_url = 3;
  // how many links became unverifiable. The link App only.
  int32 invalidated = 4;
}

// GitHubAppToken is one installation token asked of an App, minted or
// refused. **Never the token**, nor any part of it.
message GitHubAppToken {
  // when it was asked for.
  google.protobuf.Timestamp at = 1;
  // who asked: the proof's subject.
  string subject = 2;
  // how they proved it: ci, workload or person.
  string proof = 3;
  // the internal group whose grant it was minted under. Empty where no
  // grant was chosen, which is what a refusal before the decision looks
  // like.
  string grant = 4;
  // what GitHub granted, or what was asked for when refused. Empty is
  // every repository the installation holds.
  repeated string repositories = 5;
  // `name:level`, space separated, as a request spells them.
  string permissions = 6;
  // ok, refused or failed.
  string outcome = 7;
  // why it was refused or failed: the description the caller was given.
  string reason = 8;
}

message ListGitHubAppTokensRequest {
  // the App's id, as ListGitHubApps gives it.
  string id = 1;
}

message ListGitHubAppTokensResponse {
  // newest first, at most `kept` of them.
  repeated GitHubAppToken tokens = 1;
  // how many this service keeps per App.
  int32 kept = 2;
  // since when it has been keeping them: this replica's start. Nothing
  // asked for before that is here, and nothing here survives a restart —
  // the audit trail is the record.
  google.protobuf.Timestamp kept_since = 3;
}

message CheckGitHubAppRequest {
  string id = 1;
}

message CheckGitHubAppResponse {
  GitHubApp app = 1;
}

message RotateGitHubAppWebhookRequest {
  // the App's id in the catalogue. Its entry must declare a webhook, and
  // the App must have been created.
  string id = 1;
}

message RotateGitHubAppWebhookResponse {
  GitHubApp app = 1;
}

// GitHubGroupGrant is one App an internal group may mint installation
// tokens of, as that group's own page reads it. Derived from the
// catalogue, so it says nothing about the App's state on GitHub and costs
// no call to GitHub.
message GitHubGroupGrant {
  // the App's id, which is also the address of its page.
  string app_id = 1;
  // the App's name on GitHub.
  string app_name = 2;
  string org = 3;
  // names or globs within the App's organisation; "*" is every one.
  repeated string repositories = 4;
  // the most a token may carry.
  map<string, string> permissions = 5;
  // when a token was last minted under this grant, where this service
  // still remembers: its memory of the last tokens, not the trail, so it
  // is empty after a restart and never means "never". Absent for a grant
  // nothing has used.
  google.protobuf.Timestamp last_minted = 6;
}

message BeginGitHubCatalogueAppConnectRequest {
  // the App's id in the catalogue.
  string id = 1;
}

message BeginGitHubCatalogueAppConnectResponse {
  // where the browser goes next.
  string url = 1;
  // when set, the browser POSTs it as the form field `manifest` to url.
  // Empty means url is an ordinary navigation to install the App.
  string manifest = 2;
}

message DisconnectGitHubCatalogueAppRequest {
  string id = 1;
}

message DisconnectGitHubCatalogueAppResponse {
  // whether the installation was removed on GitHub. The App's record and
  // key are forgotten either way.
  bool uninstalled = 1;
  // why it could not be, when it could not.
  string detail = 2;
  // where the organisation's owner deletes the App itself, which the API
  // cannot do.
  string app_settings_url = 3;
}

message CheckGitHubCatalogueAppRequest {
  string id = 1;
}

message CheckGitHubCatalogueAppResponse {
  GitHubCatalogueApp app = 1;
}

// GitHubCatalogueApp is one App the catalogue declares, or one created
// from an entry the catalogue no longer declares, beside what GitHub says
// of it. Never the key.
message GitHubCatalogueApp {
  // the App's id in the catalogue, which is also where it is kept.
  string id = 1;
  string org = 2;
  // the name it is created with.
  string name = 3;
  string description = 4;
  bool public = 5;
  // all or selected: the repositories the installer is expected to choose.
  string installation = 6;
  // every permission declared or held, each with its declared level and
  // what the App and its installation hold.
  repeated GitHubAppPermission permissions = 7;
  // the webhook events declared.
  repeated string events = 8;
  // which groups may ask for tokens of it, and for how much.
  repeated GitHubAppGrant grants = 9;
  // not_created, created, installed or drifted.
  string state = 10;
  string html_url = 11;
  // each way GitHub differs from the catalogue, as a sentence.
  repeated string drift = 12;
  // why GitHub could not be asked, when it could not. The state is then
  // what the record says.
  string reason = 13;
  int64 app_id = 14;
  string app_slug = 15;
  int64 installation_id = 16;
  google.protobuf.Timestamp connected_at = 17;
  string connected_by = 18;
  // when GitHub was last asked.
  google.protobuf.Timestamp checked_at = 19;
  // all or selected, as installed on GitHub.
  string repository_selection = 20;
  // false for an App created from an entry the catalogue no longer
  // declares: it can be disconnected and not created again.
  bool declared = 21;
}

// GitHubAppPermission is one permission of a catalogue App: declared, on
// the App, and accepted by its installation. Empty is none.
message GitHubAppPermission {
  string name = 1;
  string declared = 2;
  string app = 3;
  string installation = 4;
}

// GitHubAppGrant is what one group may ask of a catalogue App.
message GitHubAppGrant {
  string group = 1;
  // names or globs within the App's organisation; "*" is every one.
  repeated string repositories = 2;
  // the most a token may carry.
  map<string, string> permissions = 3;
  // whether the policy declares the group.
  bool group_declared = 4;
}

message ConfirmGitHubRemovalsRequest {
  string org = 1;
  // the breaker's fingerprint, as the report shows it.
  string fingerprint = 2;
}

message ConfirmGitHubRemovalsResponse {}

message ImportGitHubLinksRequest {
  repeated GitHubLinkRecord records = 1;
  // where the records come from, kept on each link as its note.
  string origin = 2;
}

// GitHubLinkRecord is one approved pairing to import.
message GitHubLinkRecord {
  string login = 1;
  repeated string emails = 2;
  // who approved the pairing, and when; a record nobody approved is
  // skipped.
  string approved_by = 3;
  google.protobuf.Timestamp approved_at = 4;
}

message ImportGitHubLinksResponse {
  repeated GitHubLink imported = 1;
  repeated GitHubAccount skipped = 2;
}

message BeginGitHubLinkAppConnectRequest {
  // the organisation the App is created under.
  string owner = 1;
}

message BeginGitHubLinkAppConnectResponse {
  // where the browser POSTs the manifest.
  string url = 1;
  // the App's manifest, posted as the form field `manifest`.
  string manifest = 2;
}

message BeginGitHubRunnerAppConnectRequest {
  // the organisation's login.
  string org = 1;
  // one of the tiers the deployment declares.
  string tier = 2;
}

message BeginGitHubRunnerAppConnectResponse {
  // where the browser goes next.
  string url = 1;
  // when set, the browser POSTs it as the form field `manifest` to url.
  // Empty means url is an ordinary navigation to install the App.
  string manifest = 2;
}

message DisconnectGitHubRunnerAppRequest {
  string org = 1;
  string tier = 2;
}

message DisconnectGitHubRunnerAppResponse {
  // whether the installation was removed on GitHub. The App's record and
  // key are forgotten either way.
  bool uninstalled = 1;
  // why it could not be, when it could not.
  string detail = 2;
  // where the organisation's owner deletes the App itself.
  string app_settings_url = 3;
}

message DisconnectGitHubLinkAppRequest {}

message DisconnectGitHubLinkAppResponse {
  // how many links became unverifiable.
  int32 invalidated = 1;
  // where the owner deletes the App itself, which the API cannot do.
  string app_settings_url = 2;
}

message BeginGitHubConnectRequest {
  // the organisation's login.
  string org = 1;
  // the directory that will own it; see BeginGitHubAppConnectRequest.
  string owner_directory = 2;
}

message RequestGitHubPassRequest {
  string org = 1;
}

message RequestGitHubPassResponse {
  google.protobuf.Timestamp requested_at = 1;
}

message ChangeGitHubOrganisationOwnerRequest {
  string org = 1;
  // the directory workspace id to record, which must be a connected
  // directory; empty removes the owner.
  string owner_directory = 2;
}

message ChangeGitHubOrganisationOwnerResponse {}

message BeginGitHubConnectResponse {
  // where the browser goes next.
  string url = 1;
  // when set, the browser POSTs it as the form field `manifest` to url:
  // GitHub creates an App only from a posted manifest. Empty means url is
  // an ordinary navigation — the App exists and is to be installed.
  string manifest = 2;
}

message DisconnectGitHubOrganisationRequest {
  string org = 1;
}

message DisconnectGitHubOrganisationResponse {
  // whether the installation was removed on GitHub. The record and the
  // credential are forgotten either way.
  bool uninstalled = 1;
  // why it could not be, when it could not.
  string detail = 2;
  // where the organisation's owner deletes the App itself, which the API
  // cannot do.
  string app_settings_url = 3;
}

message GetGitHubStatusRequest {}

message GetGitHubStatusResponse {
  repeated GitHubOrganisation organisations = 1;
  // false where this deployment keeps no report at all, because it keeps
  // no state in Kubernetes. Every organisation then reads as not
  // reported, and this is the reason rather than the controller.
  bool reports_available = 2;
  // false where connecting an organisation is not possible here, because
  // there is nowhere to keep what it leaves behind.
  bool connecting_available = 3;
  // false where people cannot link accounts here, for the same reason.
  bool linking_available = 4;
  // the connected link App; absent until an operator creates it.
  // Also in ListGitHubApps, as the `link` App, which is what the console reads.
  GitHubLinkApp link_app = 5;
  // the page a person opens to link their account. Share it.
  string link_url = 6;
  // every linked account, never with its tokens.
  repeated GitHubLink links = 7;
  // the runner tiers this deployment declares; empty where it keeps no
  // runner Apps.
  repeated string runner_tiers = 8;
  // every runner App created, never with its key.
  // Also in ListGitHubApps, as the `runners` Apps, which is what the console reads.
  repeated GitHubRunnerApp runner_apps = 9;
  // every App the deployment's catalogue declares, and every one created
  // from an entry it no longer declares, with its state on GitHub.
  // Also in ListGitHubApps, as the `tokens` Apps, which is what the console reads.
  repeated GitHubCatalogueApp catalogue_apps = 10;
  // false where this deployment keeps no catalogue Apps.
  bool catalogue_available = 11;
  // as in ListGitHubAppsResponse.
  repeated DirectoryRef owner_choices = 12;
  bool may_connect_without_owner = 13;
}

// GitHubRunnerApp is the App one tier's runners register with in one
// organisation. Never the key.
message GitHubRunnerApp {
  string org = 1;
  string tier = 2;
  int64 app_id = 3;
  string app_slug = 4;
  // false between Create and Install.
  bool installed = 5;
  string html_url = 6;
  google.protobuf.Timestamp connected_at = 7;
  string connected_by = 8;
}

// GitHubLinkApp is the App people authorize to link their accounts.
message GitHubLinkApp {
  int64 app_id = 1;
  string app_slug = 2;
  // the organisation it was created under.
  string owner = 3;
  string html_url = 4;
  google.protobuf.Timestamp connected_at = 5;
  string connected_by = 6;
}

// GitHubLink is one GitHub account a person linked.
message GitHubLink {
  int64 account_id = 1;
  string login = 2;
  // the work addresses GitHub verifies for it, which the directory knew.
  repeated string emails = 3;
  // linked, lost or unverifiable.
  string state = 4;
  // why a link is lost or unverifiable.
  string reason = 5;
  google.protobuf.Timestamp linked_at = 6;
  google.protobuf.Timestamp checked_at = 7;
  google.protobuf.Timestamp changed_at = 8;
  // self, profile or imported.
  string source = 9;
  // where a link that is not a self-link came from.
  string note = 10;
}

// GitHubOrganisation is one organisation: its bindings beside its report.
message GitHubOrganisation {
  // the organisation's login.
  string org = 1;
  // whether the policy binds it. A report for one it does not is the
  // controller's last word on an organisation removed from the policy.
  bool bound = 2;
  // whether the controller has reported on it at all.
  bool reported = 3;
  // why a report that exists could not be read. The rest of the report is
  // then empty, and the bindings are still shown.
  string report_error = 4;
  // whether the controller acts on it. A disabled organisation is still
  // derived, and its members' states say what would change.
  bool enabled = 5;
  GitHubTick tick = 6;
  // the internal groups bound to the organisation itself, and the
  // members the controller derived from them.
  repeated string member_groups = 7;
  repeated GitHubMember members = 8;
  repeated GitHubTeamStatus teams = 9;
  // members nobody linked to a work address: nobody can say who they
  // are, so they are listed and never touched.
  repeated GitHubAccount unlinked = 10;
  // how the controller acts in it. Absent until an operator connects it.
  // Also in ListGitHubApps, as the organisation's `controller` App, which is what the console reads.
  GitHubConnection connection = 11;
  // accounts with access to repositories without membership: reported.
  repeated GitHubAccount outside_collaborators = 12;
  // the organisation's seats as last read.
  GitHubSeats seats = 13;
  // set when the last pass would have removed more than half the
  // organisation.
  GitHubBreaker breaker = 14;
  // the removal set an operator confirmed, while it holds.
  GitHubRemovalConfirmation removal_confirmation = 15;
  // addresses and GitHub logins the policy says to leave alone here.
  repeated string ignored = 16;
  // whether the caller may operate it: hold the operator role over the
  // directory recorded as its owner, or installation-wide.
  bool can_operate = 17;
  // the directory workspace id recorded as its owner when it was
  // connected; empty for none.
  string owner_directory = 18;
  // every domain the owner is authoritative for, sorted, joined with ", ".
  string owner_domain = 19;
  // whether the caller may change the owner.
  bool can_change_owner = 20;
  // when an operator last asked for a pass over it now, if ever. The page
  // says "pass requested" until a report newer than this exists.
  google.protobuf.Timestamp pass_requested_at = 21;
}

// GitHubSeats is what the organisation pays for.
message GitHubSeats {
  // false when GitHub would not say: nobody is invited while it is.
  bool known = 1;
  int32 total = 2;
  int32 filled = 3;
  int32 pending = 4;
  int32 free = 5;
  // invitations the last pass could not send for want of a seat.
  int32 short = 6;
}

// GitHubBreaker is a pass that would have removed more than half the
// organisation.
message GitHubBreaker {
  int32 affected = 1;
  int32 members = 2;
  string fingerprint = 3;
  // whether the set was confirmed, so the removals went ahead.
  bool confirmed = 4;
}

// GitHubRemovalConfirmation is an operator's confirmation of one set.
message GitHubRemovalConfirmation {
  string fingerprint = 1;
  string confirmed_by = 2;
  google.protobuf.Timestamp confirmed_at = 3;
}

// GitHubConnection is the App connecting an organisation left behind.
// Never the key.
message GitHubConnection {
  int64 app_id = 1;
  string app_slug = 2;
  // false between Create and Install: the owner made the App and has not
  // installed it, so nothing can act through it yet.
  bool installed = 3;
  string html_url = 4;
  google.protobuf.Timestamp connected_at = 5;
  string connected_by = 6;
}

// GitHubTick is how the controller's last pass over an organisation went.
message GitHubTick {
  google.protobuf.Timestamp at = 1;
  // in-sync, applied, dry-run, held, retrying, waiting or failed.
  string outcome = 2;
  string error = 3;
  // actions taken, or that would have been while disabled.
  int32 changes = 4;
  // actions not taken, each with its reason on the member.
  int32 held = 5;
  // rows waiting on somebody to link a GitHub account.
  int32 waiting = 6;
  // actions that could not be taken this pass and are tried again.
  int32 retrying = 7;
}

// GitHubTeamStatus is one team: its binding beside what was derived.
message GitHubTeamStatus {
  // the team's slug.
  string team = 1;
  // whether the policy binds it; false for a team only a stale report
  // still names.
  bool bound = 2;
  repeated string member_groups = 3;
  repeated string maintainer_groups = 4;
  repeated GitHubMember members = 5;
}

// GitHubMember is one person's membership as the controller derived it.
message GitHubMember {
  string email = 1;
  // empty for somebody not yet linked to a GitHub account.
  string login = 2;
  // member or maintainer.
  string role = 3;
  // not-linked, pending, invited, ignored, synced, leaving, retrying, held or
  // reported.
  string state = 4;
  // invite, add, set-role or remove; empty when synced.
  string action = 5;
  // why an action is held.
  string reason = 6;
}

// GitHubAccount is a login with a note.
message GitHubAccount {
  string login = 1;
  string reason = 2;
}
