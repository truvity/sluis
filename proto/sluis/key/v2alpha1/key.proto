// The key service, served by key@ (0006 "Seal and open", "Sign and Mac"), and the kind DataKeyWrap.
syntax = "proto3";

package sluis.key.v2alpha1;

import "google/protobuf/timestamp.proto";
import "sluis/type/v2alpha1/type.proto";

// KeyService seals, opens, signs and macs; key material never leaves key@.
service KeyService {
  rpc Seal(SealRequest) returns (SealResponse);
  rpc Open(OpenRequest) returns (OpenResponse);                    // batched (0006 "Opens are batched")
  rpc SealGrant(SealGrantRequest) returns (SealGrantResponse);     // policy only
  rpc OpenGrant(OpenGrantRequest) returns (OpenGrantResponse);     // store@, signer, ca, minters
  rpc Sign(SignRequest) returns (SignResponse);                    // content-aware per purpose (0006 "Keys sign in place")
  rpc Mac(MacRequest) returns (MacResponse);
  rpc PublicKey(PublicKeyRequest) returns (PublicKeyResponse);
}

// KeyAdminService is served by key@ on its local admin socket, <run-dir>/admin.sock, which only root on the node
// reaches (ADR 0041, "A person declares, and a suspicion counts"). It is not part of the actor call graph: the caller is
// a person with a shell on the node, and the authority of a call is the declaration's signature, not the channel.
service KeyAdminService {
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
}

// RevokeRequest delivers a signed key revocation declaration.
message RevokeRequest {
  // The declaration: a signed document in the general JSON serialisation of RFC 7515, under a publisher key of the
  // bootstrap file, whose protected header names the kind KeyRevocationDeclaration and whose payload is a
  // KeyRevocationDeclaration (signed-config.md, "Declarations").
  bytes declaration = 1;
}

// RevokeResponse says what key@ did with each key the declaration names. A declaration that a store@ failure stopped
// half way is refused with the reason "partial", and the refusal carries this message as a detail, with the keys that
// are not written yet marked pending; delivering the same declaration again completes it.
message RevokeResponse {
  uint64 seq = 1;                    // the seq of the declaration, now the highest key@ has taken
  repeated RevokedKey keys = 2;      // one per key of the declaration, in its order
  bool audited = 3;                  // the audit fact of the revocation was made durable
}

// RevokedKey is one key of a declaration.
message RevokedKey {
  string kid = 1;                    // the RFC 7638 thumbprint, base64url
  bool already = 2;                  // the key was revoked before this declaration; nothing new was written
  bool unknown = 3;                  // no source of key@ knows the key; written because the declaration allows it
  bool pending = 4;                  // not written yet: a store@ failure stopped the declaration before it
}

// KeyRevocationDeclaration is the payload of a key revocation declaration (ADR 0041; signed-config.md,
// "Declarations"): what an operator declares, signed with a publisher key. It names the exact keys, never a purpose.
message KeyRevocationDeclaration {
  string boundary = 1;               // the boundary the declaration is for; key@ of another boundary refuses it
  repeated string kids = 2;          // the RFC 7638 thumbprints, base64url, of the keys to revoke; 1 to 64, each once
  string reason = 3;                 // compromise, suspicion, lost-board or drill
  // Revoke keys that no source of key@ knows (a lost board's own keys, a signer that left the ring). Without it a
  // key key@ does not know refuses the whole declaration, so that a mistyped id is not written as a revocation.
  bool allow_unknown = 4;
}

// SealRequest seals a value under the data key of a purpose.
message SealRequest {
  string purpose = 1;                        // a purpose name from the key registry (keys.yaml), not an enum
  sluis.type.v2alpha1.Address address = 2;   // the address the value is bound to (the envelope's additional authenticated data)
  bytes plaintext = 3;                       // the value to seal
  bytes grant = 4;                           // the sealed grant; required for a tenant purpose of a tenant address
}

// SealResponse carries the envelope.
message SealResponse {
  bytes envelope = 1;  // store-api.md "The sealed envelope"
}

// OpenItem is one envelope to open.
message OpenItem {
  string purpose = 1;                        // a purpose name from the key registry
  sluis.type.v2alpha1.Address address = 2;   // the address the envelope was bound to
  bytes envelope = 3;                        // the envelope to open
}

// OpenRequest opens a batch of envelopes.
message OpenRequest {
  repeated OpenItem items = 1;  // at most 64
  bytes grant = 2;              // the sealed grant; required for a tenant purpose of a tenant address
}

// OpenResponse carries the plaintexts.
message OpenResponse {
  repeated bytes plaintexts = 1;  // same order as the items; all or none
}

// SealGrantRequest asks key@ to seal a grant that policy decided.
message SealGrantRequest {
  sluis.type.v2alpha1.Grant grant = 1;  // the decision to seal
}

// SealGrantResponse carries the sealed grant.
message SealGrantResponse {
  // The grant sealed under the boundary's grant data key, in the wire form
  //   u16 length | decision_id | envelope
  // with the length big-endian and the envelope of store-api.md "The sealed envelope" (purpose grant, address:
  // tenant "-", kind "grant", id the decision id). Callers carry it as opaque bytes.
  bytes sealed_grant = 1;
}

// OpenGrantRequest asks key@ to open a sealed grant.
message OpenGrantRequest {
  bytes sealed_grant = 1;  // a grant sealed by SealGrant
}

// OpenGrantResponse carries the grant.
message OpenGrantResponse {
  sluis.type.v2alpha1.Grant grant = 1;  // the opened grant
}

// SignRequest signs content under the key of a purpose.
message SignRequest {
  string purpose = 1;    // a purpose name from the key registry, e.g. token-signing or audit-log
  bytes content = 2;     // the content key@ checks and signs
  string algorithm = 3;  // the purpose's own: "ES256" (P-256, SHA-256) for audit-log, "ES384" for every other signing purpose
  bytes grant = 4;       // only for purposes that carry an effect
}

// SignResponse carries the signature in both encodings.
message SignResponse {
  bytes signature_raw = 1;  // raw r||s (JWS)
  bytes signature_der = 2;  // ASN.1 DER (signed notes)
  string key_id = 3;        // the signing key's RFC 7638 thumbprint, base64url
}

// MacRequest computes a keyed hash.
message MacRequest {
  string purpose = 1;  // mac, pseudonym or pairwise
  string tenant = 2;   // the tenant whose key is used
  string label = 3;    // separates uses of the same purpose
  bytes input = 4;     // the value to hash
  string epoch = 5;    // YYYYMM for pseudonym
  bytes grant = 6;     // the sealed grant (0006: Mac(purpose, input, grant)); not checked tonight under D-5, boundary purposes are checked by rule only
}

// MacResponse carries the keyed hash.
message MacResponse {
  bytes mac = 1;  // HMAC-SHA384, 48 bytes
}

// PublicKeyRequest asks for the public key of a purpose.
message PublicKeyRequest {
  string purpose = 1;  // a purpose name from the key registry
}

// PublicKeyResponse carries the public key.
message PublicKeyResponse {
  bytes spki_der = 1;       // the public key, SubjectPublicKeyInfo in DER
  string key_id = 2;        // RFC 7638 thumbprint, base64url
  string algorithm = 3;     // "ES256" for audit-log, else e.g. "ES384"
  repeated bytes x5c = 4;   // the certificate chain, DER, when the purpose has one
}

// DataKeyWrap is the kind of a wrapped data key (0006 "DataKeyWrap"): id <purpose>/<generation>/<recipient>,
// durable, plain (already ciphertext).
message DataKeyWrap {
  string purpose = 1;            // the purpose the data key belongs to
  uint32 generation = 2;         // the data key's generation
  string recipient = 3;          // the key@ that may unwrap it
  bytes ephemeral_public = 4;    // SEC1 uncompressed P-384 point of the ECDH-ES sender key
  bytes wrapped_key = 5;         // AES-KW (RFC 3394) of the 32-byte data key under HKDF-SHA384(shared secret)
}

// KeyCertificate is the kind KeyCertificate (0006 "Keys sign in place"): the public key of a key purpose and the
// chain the root custodian returned for it. key@ is its only writer. Tonight it holds the wrapping public key of
// each node, with id wrapping/<recipient> and no chain.
message KeyCertificate {
  string purpose = 1;                         // the key purpose
  string recipient = 2;                       // the recipient label of a wrapping key: its RFC 7638 thumbprint in lower-case base32
  bytes spki_der = 3;                         // the public key, SubjectPublicKeyInfo in DER
  repeated bytes chain = 4;                   // the certificate chain, DER, leaf first; empty when there is none
  google.protobuf.Timestamp added_at = 5;     // when key@ published it
  int64 trust_sequence = 6;                   // the trust sequence of the answer that brought the chain (hand-off); 0 for a key with no chain or an answer on the floor
}

// KeyRevocation is the kind KeyRevocation (ADR 0041, "The tighten-only record"): one revoked target, create only. key@
// is its one writer, on a declaration that an operator signed with a publisher key (KeyRevocationDeclaration); the
// signer, entry, exporter@ and ca read it. The operator and any free-text reason are in the audit fact, not here: this
// kind is plain so that the publishers can read it. Its id is <target_kind>/<target>: kid/<recipient label of the kid>
// for a key, and recipient/<label> or generation/<purpose>/<generation> (the last in the tenant of the data key) for the
// targets that follow with their declarations. There is no target for a whole purpose: a declaration names keys.
message KeyRevocation {
  string target_kind = 1;                       // kid, generation or recipient
  string target = 2;                            // the kid, "<purpose>/<generation>" or the recipient
  string reason_code = 3;                       // compromise, suspicion, lost-board or drill
  google.protobuf.Timestamp revoked_at = 4;     // when key@ took the declaration
}

// PinReleaseRequest is the kind PinReleaseRequest (0006 "Touch and PIN"): a locked board asks its peers for the card
// PIN. key@ alone writes and reads it. Its id is <node>/<request>, the two fields of the text.
message PinReleaseRequest {
  // The signed text: "sluis-pin-release-v1", the boundary, the node, the request id (a UUIDv7, RFC 9562) and the
  // ephemeral P-384 public key (SEC1 uncompressed) that the locked card driver made for this request, each field a
  // 4-octet big-endian length and its octets (0006 "Touch and PIN"; kits/go/pinrelease). The same octets are the HKDF-SHA384
  // info and the AES-256-GCM additional data of the answer.
  bytes text = 1;
  bytes signature_der = 2;  // ES384 over SHA-384(text) by the node's pin-release key (slot 87), ASN.1 DER
}

// PinRelease is the kind PinRelease: the one answer to the PinReleaseRequest with the same id, written by the unlocked
// peer that answered first.
message PinRelease {
  // The signed answer text: "sluis-pin-release-answer-v1", the boundary, the releasing node, the requesting node, the
  // request id, SHA-384 of the request text, the releaser's ephemeral public key and the sealed PIN (AES-256-GCM,
  // nonce first), each field length-prefixed as in the request.
  bytes text = 1;
  bytes signature_der = 2;  // ES384 over SHA-384(text) by the releasing node's pin-release key, ASN.1 DER
}
