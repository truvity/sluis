// The temp kinds of exporter@ (0009 "Watch and reconcile", "Publishing public material"): ExportCursor and ExportReport, and the durable ExportManifest.
syntax = "proto3";

package sluis.exporter.v2alpha1;

import "google/protobuf/timestamp.proto";

// ExportCursor is the kind ExportCursor: boundary-scoped, id <destination>. The resume point of each watched kind up
// to which the destination reflects what exporter@ published, so that a restart watches from there. Losing it costs a
// full reconcile, never data.
message ExportCursor {
  uint64 signing_ring = 1;                    // the sequence of the resume point in the change log of SigningRing
  uint64 key_revocation = 2;                  // the sequence of the resume point in the change log of KeyRevocation
  google.protobuf.Timestamp saved_at = 3;     // when exporter@ saved it
  uint64 signing_ring_epoch = 4;              // the epoch of that log: a sequence means something only inside its epoch (0 in a cursor saved before epochs: not used, the kind is listed again)
  uint64 key_revocation_epoch = 5;            // the epoch of the KeyRevocation log
}

// ExportReport is the kind ExportReport: boundary-scoped, id <destination>/<document>. What exporter@ published and saw
// (0009 "The order and the time"). Public values only: addresses, digests and kids.
message ExportReport {
  string state = 1;                           // published, purge-pending, written or unverified
  string address = 2;                         // the document's address at the destination
  string public_address = 3;                  // the URL a verifier fetches; empty when the destination has none
  string sha256 = 4;                          // the SHA-256 of the body exporter@ wrote, lower-case hex
  repeated string kids = 5;                   // for a key set, the kids it lists
  google.protobuf.Timestamp written_at = 6;   // when the destination took the document
  google.protobuf.Timestamp purged_at = 7;    // when the edge accepted the purge; absent with no edge
  google.protobuf.Timestamp read_back_at = 8; // when the public address answered with the written digest; absent when it never did
  bool public = 9;                            // the destination has a public address; signer counts only those reports
  google.protobuf.Timestamp reported_at = 10; // when exporter@ wrote this report
  string kind = 11;                           // the exportable kind the document is built from: SigningRing for a key set
}

// ExportManifest is the kind ExportManifest: boundary-scoped, one item, id default. The documents exporter@ is
// configured to publish, written at its start and whenever its destinations change (0009 "The order and the time").
// signer reads it to know which reports it must see before it makes a key active (REQ-KEYS-116): it counts the reports
// of the entries here that have a public address, treats an entry with no report as not published, and ignores a report
// that no entry names (a destination that was removed). The kind is durable so that a publisher that has gone quiet
// keeps holding activation instead of being forgotten with its reports. Public values only: names and addresses.
message ExportManifest {
  message Entry {
    string destination = 1;  // the destination's name
    string document = 2;     // the document's name; with the destination, the id of its report
    string kind = 3;         // the exportable kind the document is built from: SigningRing for a key set
    bool public = 4;         // the document has a public address that exporter@ reads back, so signer counts it
  }
  repeated Entry entries = 1;
  google.protobuf.Timestamp written_at = 2; // when exporter@ wrote the manifest
}
