// The store service, served by store@ (store-api.md "The store service").
syntax = "proto3";

package sluis.store.v2alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "sluis/type/v2alpha1/type.proto";

// StoreService is the one generic data service of a work actor; a kind is named, never a method.
service StoreService {
  rpc Get(GetRequest) returns (GetResponse);               // one item by address
  rpc List(ListRequest) returns (ListResponse);            // the items of a kind in a tenant, or by a declared index
  rpc Write(WriteRequest) returns (WriteResponse);         // create, update, delete or apply, all or none
  rpc Watch(WatchRequest) returns (stream WatchResponse);  // the changes of a kind from a resume point
  rpc GetSignedConfig(GetSignedConfigRequest) returns (GetSignedConfigResponse);  // the signed document of a config kind, as the source holds it
}

// Item is a stored item as store@ returns it.
message Item {
  sluis.type.v2alpha1.Address address = 1;               // where the item lives
  uint64 version = 2;                                     // 1 at create, plus 1 at each change; set by store@
  bytes value = 3;                                        // the kind's Protobuf message; for a sealed kind, the envelope
  google.protobuf.Timestamp expires_at = 4;               // set by store@ when the kind has a TTL
  repeated sluis.type.v2alpha1.IndexEntry indexes = 5;    // the declared indexes, computed by the writer
}

// Consistency is the read guarantee a Get or a List asks for. Left unset it differs: a Get is linearizable, a List is not
// (ListRequest.consistency).
enum Consistency {
  CONSISTENCY_UNSPECIFIED = 0;  // not set: the same as LINEARIZABLE for a Get; the leader's unconfirmed read for a List
  LINEARIZABLE = 1;             // the default; the read sees every write that finished before it
  FOLLOWER = 2;                 // a read that tolerates lag
}

// Layer is the layer of a layered kind that set a field.
enum Layer {
  LAYER_UNSPECIFIED = 0;  // not set
  BUILT_IN = 1;           // the built-in layer
  CONFIG = 2;             // the signed config
  OPERATOR = 3;           // the operator's items
  TENANT = 4;             // the tenant's items
}

// Verb is what a write operation does.
enum Verb {
  VERB_UNSPECIFIED = 0;  // not set
  CREATE = 1;            // the item, only if the address is free
  UPDATE = 2;            // the item, only at if_version
  DELETE = 3;            // removes the item, at if_version when given
  APPLY = 4;             // creates the item or sets it to the value; never refused for a version
}

// ChangeType is what a watched change did to its item.
enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;  // not set
  CHANGE_TYPE_PUT = 1;          // the item was written
  CHANGE_TYPE_DELETE = 2;       // the item was removed, or it expired
  CHANGE_TYPE_BOOKMARK = 3;     // no change: the latest resume point, sent on a stream that has been idle (no item)
}

// Provenance says which layer set a field of a layered kind.
message Provenance {
  string field_path = 1;  // the path of the field
  Layer layer = 2;        // the layer that set it
  uint64 version = 3;     // the version of the item of that layer
}

// GetRequest reads one item.
message GetRequest {
  sluis.type.v2alpha1.Address address = 1;  // the item
  Consistency consistency = 2;              // LINEARIZABLE (the default) or FOLLOWER
  uint64 if_none_match = 3;                 // a version the caller holds; the reply may be "unchanged"
}

// GetResponse is the item, or "unchanged".
message GetResponse {
  bool unchanged = 1;                  // true when the item is still at if_none_match; item is then empty
  Item item = 2;                       // the item
  repeated Provenance provenance = 3;  // for a layered kind only
}

// ListRequest lists a tenant's items of a kind, or follows a declared index.
message ListRequest {
  string kind = 1;         // the kind's segment
  string tenant = 2;       // the tenant; empty for a kind with none
  string index = 3;        // a declared index of the kind, or empty to list the tenant's items
  bytes index_value = 4;   // the value to match under that index
  int32 page_size = 5;     // at most the maximum the contract declares
  string page_token = 6;   // opaque; bound to the query and the caller
  // The read guarantee of the listing. Unlike a Get, a List that leaves this unset keeps the read it always had, which is
  // not linearizable: UNSPECIFIED and FOLLOWER both mean that read (the leader answers without confirming that it still
  // leads). LINEARIZABLE asks for a read that sees every write acknowledged before it; a store that cannot provide it
  // refuses the call and never answers a weaker one. A reader that decides on what it lists, such as a revocation
  // check, asks for LINEARIZABLE. A config kind is served from the signed documents store@ holds, and this field does
  // not change it.
  Consistency consistency = 7;
}

// ListResponse is one page of items.
message ListResponse {
  repeated Item items = 1;       // the items of the page
  string next_page_token = 2;    // empty on the last page
  uint64 resume_point = 3;       // the change-log position that the snapshot reflects or is older than; Watch from it misses nothing (at-least-once). 0 for a config kind
  uint64 log_epoch = 4;          // the epoch of the change log that resume_point belongs to: hand it back with the point. 0 where resume_point is 0
}

// WriteRequest is a batch of operations, applied all or none.
message WriteRequest {
  repeated Operation operations = 1;  // at most 64, applied all or none, to kinds of the calling actor
  bytes grant = 2;                    // the sealed grant; required when an address is tenant-scoped (not for key@'s DataKeyWrap and KeyRevocation)
}

// Operation is one write of a batch.
message Operation {
  Verb verb = 1;                                          // CREATE, UPDATE, DELETE or APPLY
  sluis.type.v2alpha1.Address address = 2;                // the item
  bytes value = 3;                                        // the kind's Protobuf message; for a sealed kind, the envelope
  uint64 if_version = 4;                                  // UPDATE: the version read; DELETE: optional
  google.protobuf.Duration ttl = 5;                       // optional: shorter than the kind's maximum; absent, the kind's default
  repeated sluis.type.v2alpha1.IndexEntry indexes = 6;    // the declared indexes, computed by the writer
}

// WriteResponse carries the items as written.
message WriteResponse {
  repeated Item items = 1;  // the items as written, with their versions
}

// WatchRequest asks for the changes of a kind from a resume point.
message WatchRequest {
  string kind = 1;           // the kind's segment
  string tenant = 2;         // empty only for a kind with no tenant, and for DataKeyWrap and KeyRevocation, as for List
  uint64 resume_point = 3;   // the change-log sequence last seen, or ListResponse.resume_point; 0 starts from now
  uint64 log_epoch = 4;      // the epoch that came with resume_point; a nonzero resume_point with any other epoch (0 included) is refused as resume_point_expired. Ignored when resume_point is 0
}

// WatchResponse is one change.
message WatchResponse {
  uint64 resume_point = 1;   // the log sequence of this change; hand it back after a restart, and dedupe by it. 0 for a config kind: apply every config change
  ChangeType type = 2;       // PUT, DELETE or BOOKMARK
  Item item = 3;             // PUT: the item as read at delivery. DELETE: its address and the version of the row, no value. BOOKMARK: none
  uint64 log_epoch = 4;      // the epoch of the change log that resume_point belongs to: the same on every message of a stream, and to be handed back with the point. 0 for a config kind
  // true on the one BOOKMARK that says the stream has delivered every change up to the log head that store@ read, linearizably, when the stream
  // opened; resume_point is that head. It is sent at once when there was nothing to deliver, and never before the rows up to the head. False on every
  // other message, an idle bookmark included: that one is a sign of life and a point to resume from, and proves nothing about what the stream has seen.
  bool caught_up = 5;
}

// GetSignedConfigRequest asks for the signed document of one config kind.
message GetSignedConfigRequest {
  string kind = 1;  // the kind's segment; a config kind the caller may read
}

// GetSignedConfigResponse is the signed document in force, so that the caller verifies it itself.
message GetSignedConfigResponse {
  bytes document = 1;  // the JWS bytes exactly as the config source gave them (signed-config.md); store@ vouches for nothing in them
}
