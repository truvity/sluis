syntax = "proto3";

// Package accessissuer.v1 is what the issuer answers ABOUT itself, as
// opposed to the OpenID surface it answers protocol on. Today that is one
// service: the sessions it is holding, and ending them.
//
// The browser calls this at the issuer's own host, directly. The hub
// serves the console and must not depend on this service — it answers
// "is this account live" for consumers, and that has to keep working when
// the issuer is down — so the console speaks to the issuer itself and the
// hub's code learns nothing about it. The cost is one value: the origin
// the issuer allows.
package accessissuer.v1;

import "google/protobuf/timestamp.proto";

// SessionService lists and ends what this issuer is holding.
//
// It can only ever REMOVE. There is no call here that grants anything,
// which is the whole reason a console may be pointed at it: the worst a
// stolen operator session can do through this surface is sign people out.
service SessionService {
  // ListSessions answers what is open. Narrow it to one identity or one
  // client, which anybody may ask about their own; naming neither is the
  // global listing, and it is refused unless the caller is an operator,
  // paged by page_size/page_token.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // RevokeSessions ends a set of them and says how many it ended.
  rpc RevokeSessions(RevokeSessionsRequest) returns (RevokeSessionsResponse);
}

// How a session began. It is not decoration: "revoke Ada's kubectl login"
// and "revoke the console she left open" are different acts, and an
// operator can only tell them apart if the issuer remembers which was
// which.
enum How {
  HOW_UNSPECIFIED = 0;
  // A browser sign-in: OIDC code with PKCE.
  HOW_CODE = 1;
  // A terminal with no browser to redirect: the device flow.
  HOW_DEVICE = 2;
  // A workload or a CI job trading a token it already had.
  HOW_EXCHANGE = 3;
}

// Who holds a refresh chain (docs/decisions/0040-agent-class-sessions.md).
// It decides how long the chain lives and whether a person's browser
// sign-out ends it.
enum SessionClass {
  // A session recorded before classes existed, which is interactive.
  SESSION_CLASS_UNSPECIFIED = 0;
  // A person at a browser: held to the installation's lifetimes, and
  // ended by their sign-out.
  SESSION_CLASS_INTERACTIVE = 1;
  // Software that keeps its own refresh token and works in the
  // background, such as an MCP host: held to the agent class's lifetimes,
  // and kept when the person signs a browser out. Every revoke ends it.
  SESSION_CLASS_AGENT = 2;
}

// Session is one refresh token, described. The token itself is never
// here: this is the index that makes them listable and revocable, and an
// index that carried the credential would be a second place to steal it
// from.
message Session {
  string id = 1;
  // The identity it belongs to — an address for a person, a
  // ServiceAccount subject for a recovery sign-in.
  string identity = 2;
  // The client it was issued for. A session belongs to one identity AND
  // one client: that pairing is the unit of revocation, so that ending
  // somebody's ArgoCD session does not end their kubectl session.
  string client_id = 3;
  How how = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  // Unset when it has never been refreshed.
  google.protobuf.Timestamp last_refreshed = 7;
  // The browser (SSO) session this one was opened from, empty for a flow
  // with no browser -- a device code redeemed by a CLI, an exchange. A
  // console groups a person's sessions under this so that "this laptop"
  // reads as one thing, and *sign out everywhere* is what ends it. An
  // agent session a sign-out spared stays filed under the sign-in that
  // ended, which is then no longer among the listing's sign_ins.
  string sso = 8;
  // Who holds the chain.
  SessionClass session_class = 9;
  // The latest the chain may live, however often it is refreshed: its
  // auth_time plus the absolute limit its class and resource allow, as
  // the policy and configuration stand now. Unset for a chain with no such
  // limit (an exchange's). expires_at is the sliding end beside it.
  google.protobuf.Timestamp deadline = 10;
}

message ListSessionsRequest {
  // Narrows to their intersection: "Ada's ArgoCD sessions". Naming
  // neither is the global listing — every session in the installation —
  // which is operator-only: the two questions anybody else has
  // are "what does this person have open" and "who is on this client".
  string identity = 1;
  string client_id = 2;
  // How many to return. Zero picks a server default; the server caps it
  // regardless of what is asked for, so a client can always ask for more
  // than it needs.
  int32 page_size = 3;
  // Opaque; pass back next_page_token from the previous response to
  // continue a listing. Empty starts from the newest session.
  string page_token = 4;
  // Read `identity` and `client_id` as SUBSTRINGS rather than as exact
  // values, so that "lovelace" finds `ada.lovelace@globex.example` and "karg"
  // finds `kargo`. Prefix, suffix and middle, one rule.
  //
  // Operator-only, and not for tidiness: an exact identity is the
  // caller's own or nobody's, whereas "globex.example" as a substring names
  // everybody. The server refuses it for anyone else rather than
  // narrowing it, because a filter that silently means something
  // different to different callers is worse than one that is refused.
  //
  // It also costs more. An exact identity reads that identity's own
  // index; a substring cannot know which indexes to read, so it walks
  // the whole live set — the same read the unfiltered listing already
  // does, which is why this is affordable at all.
  bool contains = 5;
}

message ListSessionsResponse {
  // Newest first.
  repeated Session sessions = 1;
  // Non-empty when more sessions follow this page.
  string next_page_token = 2;
  // The SIGN-INS behind those sessions: one per browser, newest first.
  //
  // Listed because leaving them out made the page lie by omission. A
  // console showed every per-client session and none of the sign-ins, so
  // revoking every row emptied the page and changed nothing about who
  // could walk back in — and the console's own sign-in never appears as
  // a session at all, because it does not redeem the code it gets back.
  //
  // Not paged with the sessions above: there are as many of these as a
  // person has browsers, which is a number you can read.
  repeated SignIn sign_ins = 3;
}

// SignIn is one browser's authentication: what `/authorize` completes
// silently from, and what a session points at when it was opened by one.
message SignIn {
  // The id its sessions carry as `sso`, and what ends it.
  string id = 1;
  string identity = 2;
  // What proved it: a provider kind ("google"), or "recovery".
  string how = 3;
  // When the person authenticated, never when a token was minted from
  // it. This is what `max_age` is measured against.
  google.protobuf.Timestamp auth_time = 4;
  google.protobuf.Timestamp expires_at = 5;
}

// Which of a person's sessions their own *sign out everywhere* ends
// (docs/decisions/0040-agent-class-sessions.md, decision 7). A value this
// issuer does not know is EVERYTHING: a scope can only ever end less by
// being understood.
enum RevokeScope {
  // Everything, as EVERYTHING.
  REVOKE_SCOPE_UNSPECIFIED = 0;
  // Every session of every class and every browser sign-in: "Sign out
  // everything", the one lever for a suspected compromise.
  REVOKE_SCOPE_EVERYTHING = 1;
  // Every interactive session and every browser sign-in; agent sessions
  // keep working: "Sign out all browsers and apps".
  REVOKE_SCOPE_INTERACTIVE = 2;
  // Every agent session; the browsers stay signed in: "Disconnect all
  // agents".
  REVOKE_SCOPE_AGENTS = 3;
}

message RevokeSessionsRequest {
  // The identity whose sessions to end. Required, unless every_identity
  // names one client for everybody: revocation is about somebody, and a
  // call that could omit them by accident is a call that could sign out
  // the installation by mistake.
  string identity = 1;
  // Narrow to one client, or to one session. Empty means every session
  // this identity holds — "sign out everywhere".
  string client_id = 2;
  string session_id = 3;
  // One BROWSER, by the sign-on id its sessions carry.
  //
  // The distinction this exists for: ending a session ends what a client
  // holds, and leaves the SIGN-IN that produced it. A browser whose
  // sessions were all ended one by one can still open new ones with no
  // password, which is the half sign-out that looks exactly like a whole
  // one — reported from the console, where every button sent a session
  // id and none of them touched the sign-in.
  //
  // Naming this ends the sign-in and every session under it.
  string sso = 4;
  // End ONE CLIENT for everybody: with client_id set and identity empty,
  // every session of that client, whoever holds it. Operator-only, and
  // explicit rather than inferred from an empty identity, which would
  // otherwise be the mistake the identity rule above exists to refuse.
  // The incident lever for a client whose tokens are in doubt.
  bool every_identity = 5;
  // Narrows a person's OWN sign-out everywhere (identity is the caller's,
  // and no client, session or browser is named) to one class. Ignored
  // everywhere else -- an operator ending somebody else's sessions, any
  // narrower revoke -- which ends every class as it always did.
  RevokeScope scope = 6;
}

message RevokeSessionsResponse {
  // How many ended. Zero is a success: revocation is idempotent, and
  // saying otherwise tells a caller whether a session they do not hold
  // ever existed.
  int32 ended = 1;
}
