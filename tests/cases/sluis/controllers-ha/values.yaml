# The controllers, each in its own module at two replicas: what makes a rollout
# safe. Two replicas need the tick leases in a State they share, so the one
# document names the shared adapter (DynamoDB); the rollout and the readiness
# probe are the defaults: the new pod is Ready before the old one goes, and
# Ready means the process finished starting.
replicaCount: 2
config:
  issuerURL: https://issuer.example
  ports:
    adapter: dynamodb
    dynamodb:
      tables:
        oidc: sluis-oidc
        github: sluis-github
        slack: sluis-slack
        google: sluis-google
        cloudflare: sluis-cloudflare
        backup: sluis-backup
      region: eu-west-1
  controllers:
    github:
      consoleURL: http://sluis.default.svc:8080/console
    slack:
      consoleURL: http://sluis.default.svc:8080/console
exchange:
  clusters:
    - name: example-cluster
      issuer: https://oidc.eu-example-1.example/id/EXAMPLE
      jwksUri: https://oidc.eu-example-1.example/id/EXAMPLE/keys
console:
  mount: /console
# The controllers run in their own modules, at two replicas each.
modules:
  github:
    enabled: true
    replicas: 2
  slack:
    enabled: true
    replicas: 2
