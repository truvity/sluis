# The copies of the secrets the console keeps, made into OpenBao by the
# service itself (docs/decisions/0034): what reproduces, on staging, the External
# Secrets PushSecrets the deployment ran before. The chart mounts the CA and
# projects the token the jwt login presents; WHAT is copied and where is the
# policy document's (`policy.exports`), and the chart renders it as it stands.
config:
  issuerURL: https://access.example
  ports:
    adapter: dynamodb
    dynamodb:
      table: sluis
      region: eu-west-1
    export:
      adapter: openbao
      openbao:
        address: https://openbao.staging.example.internal
        caFile: /var/run/access-issuer/openbao-ca/ca.pem
        mount: kv
        namespace: staging
        auth:
          method: jwt
          mount: jwt-staging
          role: sluis-writer
          tokenFile: /var/run/openbao/token
policy:
  apps:
    github:
      runnerTiers: [preview, stable]
  exports:
    - source: slack-app
      app: alerts
      namespace: staging
      path: slack-apps/alerts
    - source: runner-app
      tier: preview
      org: truvity
      namespace: devel
      path: arc/acme
    - source: bundle
      bundle: github-apps
      namespace: staging
      path: sluis-backup/github-apps
  slack:
    workspaces:
      truvity: {}
slackApps:
  - id: alerts
    workspace: truvity
    botScopes: [chat:write, chat:write.public]
exports:
  openbao:
    caBundle: |
      -----BEGIN CERTIFICATE-----
      MIIBexample
      -----END CERTIFICATE-----
    token:
      audience: sluis
