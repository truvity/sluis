# KMS-wrapped signing through the adapters form, with IRSA: the account carries
# the role's ARN.
config:
  issuerURL: https://access.example
  signingKey:
    file: null
  adapters:
    signing:
      adapter: kms-wrapped
      settings:
        keyId: alias/sluis-signing
        stateSecret: signing/state
secrets:
  - name: signing/state
    secretName: sluis-inputs
    key: signing-state
serviceAccount:
  awsIdentity: irsa
  awsRoleArn: arn:example:iam::acct:role/sluis
