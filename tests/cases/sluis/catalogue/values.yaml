# A catalogue of GitHub Apps: one App with a grant, one with defaults.
# Rendered to a mounted file the config names (`github.catalogueFile`) and rolled out on
# change; the same values are parsed by the service's own loader in
# internal/githubapp/catalogue's tests, so the schema and the parser
# describe one shape.
config:
  issuerURL: https://access.example
  github:
    catalogueFile: /var/run/access-issuer/github-apps-catalogue.yaml
githubApps:
  catalogue:
    - id: renovate
      org: example-org
      name: example-org-renovate
      description: Dependency updates
      public: false
      permissions:
        contents: write
        pull_requests: write
      events: [pull_request]
      installation: all
      grants:
        - group: all:platform:engineer
          repositories: ["*"]
          permissions:
            contents: read
    - id: releases
      org: example-org
      permissions:
        contents: write
