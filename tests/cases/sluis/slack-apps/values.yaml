# Slack Apps declared as data, one whose bot token is copied out to a
# secret store and one beside it that is not. `push` is the only key of an
# entry the service never sees: it is stripped from the rendered catalogue,
# because the loader refuses an unknown key rather than ignoring it, which
# this render pins.
config:
  issuerURL: https://access.example
  slack:
    catalogueFile: /var/run/access-issuer/slack-apps-catalogue.yaml
slackApps:
  - id: sync
    workspace: acme
    description: Keeps channels in step with groups
    botScopes:
      - channels:read
      - users:read
      - users:read.email
      - conversations.connect:write
    push:
      secretStore:
        name: example-store
        kind: ClusterSecretStore
      remoteKey: platform/slack-apps/sync
      refreshInterval: 30m
      deletionPolicy: Delete
  - id: notify
    workspace: globex
    name: globex-notify
    botScopes: [chat:write]
    push:
      secretStore:
        name: example-store
      remoteKey: platform/slack-apps/notify
  - id: unpushed
    workspace: acme
    botScopes: [channels:read]
