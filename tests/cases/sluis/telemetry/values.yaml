replicaCount: 1
# Telemetry wired (ADR 0006): every pod of the app gets the SDK environment,
# the one process's service name, and the extra OTEL_* entries; the secrets volume
# still renders beside it on the service.
exchange:
  clusters:
    - name: example
      issuer: https://oidc.example

config:
  issuerURL: https://issuer.example
  valkey:
    address: valkey.example.svc:6379
    passwordSecret: valkey/password
  controllers:
    github:
      consoleURL: http://sluis.default.svc:8080/console
    slack:
      consoleURL: http://sluis.default.svc:8080/console
secrets:
  - name: valkey/password
    secretName: valkey
    key: password
telemetry:
  otlp:
    endpoint: http://gateway.observability.svc:4318
    extraEnv:
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.1"
