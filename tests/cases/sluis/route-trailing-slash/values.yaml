# The `route` case with the console mount written with a trailing slash.
# "/console" and "/console/" are the same place, so this must render
# byte-for-byte the same as `route` (the lint recipe diffs the two), and
# never a route to "/console//".
config:
  issuerURL: https://access.example
  publicURL: https://access.example/console
  publicRootURL: https://access.example
route:
  host: access.example
console:
  mount: /console/
