# image.perModule: the Deployment runs sluis-issuer, the backup CronJobs and the
# restore Job run sluis-backup, at the chart's tag.
image:
  perModule: true
config:
  issuerURL: https://access.example
  preset: k8s-aws
  signingKey:
    file: null
    kmsWrapped:
      keyId: alias/sluis-signing
      region: eu-west-1
      stateSecret: internal/oidc/state-secret
  secrets:
    source: ssm
    root: /sluis
    layout: v5
  ports:
    dynamodb:
      region: eu-west-1
      tables:
        oidc: sluis-oidc
        github: sluis-github
        slack: sluis-slack
        google: sluis-google
        cloudflare: sluis-cloudflare
        backup: sluis-backup
    blob:
      adapter: s3
      s3: {bucket: sluis-blobs, region: eu-west-1}
serviceAccount:
  awsIdentity: pod-identity
backup:
  enabled: true
  schedule: "5 1 * * *"
  timeZone: Europe/Amsterdam
  resources:
    requests: {cpu: 100m, memory: 256Mi}
  secretEnv:
    - {name: OTEL_EXPORTER_OTLP_HEADERS, secretName: sluis-backup-inputs, key: otlp-headers}
  serviceAccount:
    awsIdentity: irsa
    awsRoleArn: arn:example:iam::acct:role/sluis-backup
  config:
    instance: sluis
    preset: k8s-aws
    secrets:
      source: ssm
      root: /sluis
      layout: v5
    ports:
      dynamodb:
        region: eu-west-1
        tables:
          oidc: sluis-oidc
          github: sluis-github
          slack: sluis-slack
          google: sluis-google
          cloudflare: sluis-cloudflare
          backup: sluis-backup
      blob:
        adapter: s3
        s3: {bucket: sluis-blobs, region: eu-west-1}
    audit:
      writer: https://audit.example:8443
      tokenFile: /var/run/audit/token
    keys:
      adapter: kms
      archive: alias/sluis-archive
    backup:
      target: {bucket: sluis-archive, prefix: sluis, region: eu-west-1}
      retention: {keep: 7, maxAge: 720h}
restore:
  enabled: true
  backupId: 20261010T020000Z-3fa9c1
  confirm: sluis
