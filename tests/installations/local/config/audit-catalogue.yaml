# AuditCatalogue, minimal (decision D-15): the action names the writer accepts. The JSON Schema of
# each action's fields comes with the full catalogue generator.
default:
  release: "0.0.0"
  actions:
    - key.sign
    # key@'s other facts (actors/key/internal/keyd/audit.go); without them the writer quarantines them.
    - key.start
    - key.refuse
    - key.data_key.make
    - key.wrap.write
    - key.pin.release
    - key.pin.unlock
    - key.revoke
    - key.certificate.install
    - store.start
    - store.refused
    - store.reload
    - store.reload.refused
    - policy.decide
    - policy.start
    - policy.reload
    - policy.reload.refused
    - session.authorize
    - session.signin
    - session.token
    - session.refresh
    - session.chain.end
    - signer.refused
    - signer.sign
    - signer.ring.add
    - signer.ring.change
    - signer.ring.drop
    - exchange.token
    - exchange.refused
    # entry: one action per route, named entry.<route> (actors/entry/src/audit.rs); a request that
    # matched no route is entry.unrouted (actors/entry/src/handler.rs).
    - entry.connection
    - entry.authorize
    - entry.callback
    - entry.token
    - entry.discovery
    - entry.jwks
    # A health request that is refused (a wrong method, a parameter, a body); an answered probe writes no record (S-3).
    - entry.health
    - entry.unrouted
    # The audit front (--front audit) names its one route the same way.
    - entry.search
    # reader: one record per Search, answered or refused (actors/reader/src/audit.rs).
    - reader.search
    # adapter-upstream-oidc (actors/adapter-upstream-oidc/internal/upstreamd/audit.go).
    - upstream.begin
    - upstream.complete
