directories: [acme.example]
groups:
  - "dev:web:*"
  - "stage:web:deployer"
  - "acme:*:job"
  - "dev:agent:*"
rungs: [dev]
github_orgs: [acme]
slack_workspaces: [acme-chat]
clusters: [acme-dev]
aws_accounts: ["111122223333"]
github_apps:
  acme-automation:
    contents: write
    pull_requests: write
    metadata: read
zones: [acme.example]
clients: ["acme-*"]
org:
  platform_variables: ["CI_RUNNER_LABEL_*", "CI_REMOTE_BUILDERS*", "CI_OPENBAO_*"]
  platform_valued: [ACCESS_ROSTER_ISSUER]
  secret_prefix: /acme/sluis/credentials/
