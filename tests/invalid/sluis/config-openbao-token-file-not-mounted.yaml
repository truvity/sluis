# A tokenFile the chart does not project fails the render, naming the value that projects it.
# error: config.adapters.secrets.settings.auth.tokenFile must be /var/run/openbao/token, where the chart mounts what adapters.openbao.token.audience renders
config:
  issuerURL: https://issuer.example
  adapters:
    secrets:
      adapter: openbao
      settings:
        address: https://openbao.example
        root: sluis
        auth: {method: jwt, role: r, tokenFile: /tmp/token}
adapters:
  openbao:
    token:
      audience: sluis
