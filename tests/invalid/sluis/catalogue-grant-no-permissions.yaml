# A catalogue grant needs permissions.
# error: at '/githubApps/catalogue/0/grants/0': missing property 'permissions'
config:
  issuerURL: https://issuer.example
githubApps:
  catalogue:
  - id: releases
    org: acme
    permissions:
      contents: write
    grants:
    - group: all:platform:engineer
      repositories:
      - '*'
