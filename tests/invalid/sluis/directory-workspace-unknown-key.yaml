# A key in a declared workspace does not know must fail the render, not be ignored.
# error: at '/config/directory/workspaces/0': additional properties
config:
  issuerURL: https://issuer.example
  directory:
    workspaces:
    - backend: google
      admin: admin@acme.example
      keySecret: directory/acme/key
      domains:
      - acme.example
