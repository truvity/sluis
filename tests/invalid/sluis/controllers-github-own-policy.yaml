# A controller decides by the process's policy: it has none of its own.
# error: at '/config/controllers/github': additional properties 'policy' not allowed
replicaCount: 1
config:
  issuerURL: https://issuer.example
  controllers:
    github:
      consoleURL: http://sluis.default.svc:8080/console
      policy:
        file: /etc/policy.yaml
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
