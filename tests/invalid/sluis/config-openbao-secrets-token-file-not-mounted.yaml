# The openbao Secrets adapter logs in with the token the chart projects.
# error: config.adapters.secrets.settings.auth.tokenFile is "/tmp/token" and the chart renders nothing there
config:
  issuerURL: https://issuer.example
  adapters:
    secrets:
      adapter: openbao
      settings:
        address: https://openbao.example
        root: sluis
        auth: {method: jwt, role: sluis, tokenFile: /tmp/token}
