# The workspaces' Secret is mounted at one path.
# error: controllerSlack.config.credentialsDir must be /var/run/slack-roster/credentials
config:
  issuerURL: https://issuer.example
  exchange:
    clustersFile: /var/run/access-issuer/clusters.yaml
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
controllerSlack:
  enabled: true
  config:
    consoleURL: http://sluis.default.svc:8080/console
    credentialsDir: /etc/creds
