# Pod Identity annotates nothing.
# error: backup.serviceAccount.awsRoleArn is set and backup.serviceAccount.awsIdentity is not irsa
config:
  issuerURL: https://issuer.example
backup:
  enabled: true
  serviceAccount: {awsRoleArn: arn:aws:iam::111111111111:role/x}
  config:
    instance: sluis
    secrets: {source: ssm, root: /sluis, layout: v5}
    ports:
      dynamodb: {region: eu-west-1, tables: {backup: sluis-backup}}
      blob: {adapter: s3, s3: {bucket: b}}
    keys: {adapter: kms, archive: alias/a}
    backup:
      target: {bucket: archive}
