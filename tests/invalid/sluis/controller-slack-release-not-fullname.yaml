# The controller reads the report and the records the service writes under the release's name.
# error: controllerSlack.config.release must be "sluis"
config:
  issuerURL: https://issuer.example
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
controllerSlack:
  enabled: true
  config:
    consoleURL: http://sluis.default.svc:8080/console
    release: other
