# controllers.github.enabledOrgs names an organisation the inline policy does not bind.
# error: policy.controllers.github.enabledOrgs names "old", which policy.github does not bind
replicaCount: 1
config:
  issuerURL: https://issuer.example
  controllers:
    github:
      consoleURL: http://sluis.default.svc:8080/console
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
policy:
  groups:
    a:b:c: {}
  github:
    acme: {members: [a:b:c]}
  controllers:
    github:
      enabledOrgs: [acme, old]
