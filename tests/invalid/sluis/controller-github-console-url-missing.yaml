# The github controller reads this release's console, and the config says where.
# error: controllerGithub.config.consoleURL is required
config:
  issuerURL: https://issuer.example
  exchange:
    clustersFile: /var/run/access-issuer/clusters.yaml
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
controllerGithub:
  enabled: true
  config: {}
