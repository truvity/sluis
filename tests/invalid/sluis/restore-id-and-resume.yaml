# One or the other.
# error: restore.backupId and restore.resume are both set
config:
  issuerURL: https://issuer.example
backup:
  enabled: true
  config:
    instance: sluis
    secrets: {source: ssm, root: /sluis, layout: v5}
    ports:
      dynamodb: {region: eu-west-1, tables: {backup: sluis-backup}}
      blob: {adapter: s3, s3: {bucket: b}}
    keys: {adapter: kms, archive: alias/a}
    backup:
      target: {bucket: archive}
restore: {enabled: true, backupId: 20261010T020000Z-3fa9c1, resume: true, confirm: sluis}
