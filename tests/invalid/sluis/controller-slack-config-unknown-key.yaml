# A key the controller does not read is refused at render.
# error: at '/controllerSlack/config': additional properties 'bogusKey' not allowed
config:
  issuerURL: https://issuer.example
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
controllerSlack:
  enabled: true
  config:
    consoleURL: http://sluis.default.svc:8080/console
    bogusKey: 1
