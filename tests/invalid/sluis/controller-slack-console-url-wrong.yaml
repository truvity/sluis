# The console is this release's own Service, and the chart prints the address.
# error: controllerSlack.config.consoleURL must be http://sluis.default.svc:8080/console
config:
  issuerURL: https://issuer.example
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
controllerSlack:
  enabled: true
  config:
    consoleURL: http://elsewhere.example/console
