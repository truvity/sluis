# The config says where the chart mounts each key.
# error: config.signingKey.verifyOnly[0].file must be /var/run/access-issuer/verify-keys/0.pem
config:
  issuerURL: https://issuer.example
  signingKey:
    verifyOnly:
      - {file: /etc/old.pem, until: "2026-11-05T00:00:00Z"}
signingKey:
  verifyOnly:
    - pem: |
        -----BEGIN PUBLIC KEY-----
        MIIBexample
        -----END PUBLIC KEY-----
