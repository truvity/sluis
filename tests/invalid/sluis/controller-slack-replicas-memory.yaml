# controllerSlack.replicas above 1 on the memory adapter: the lease lives in the process (template fail).
# error: controllerSlack.replicas is 2, which needs the tick leases in a State every replica shares
config:
  issuerURL: https://issuer.example
exchange:
  clusters:
    - name: example-cluster
      issuer: https://oidc.eu-example-1.example/id/EXAMPLE
console:
  mount: /console
controllerSlack:
  enabled: true
  replicas: 2
  config:
    consoleURL: http://sluis.default.svc:8080/console
    ports:
      adapter: memory
