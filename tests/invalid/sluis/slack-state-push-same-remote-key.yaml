# The credentials and the records are two Secrets: written to one remote key, one would overwrite the other.
# error: both write remoteKey
config:
  issuerURL: https://issuer.example
slackState:
  push:
    secretStore:
      name: example-store
      kind: ClusterSecretStore
    remoteKey: platform/access-issuer/slack
    recordsRemoteKey: platform/access-issuer/slack
