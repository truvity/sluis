# SSM holds the secrets of layout v5: nothing is projected.
# error: config.secrets.layout is v5, which reads secrets from SSM
config:
  issuerURL: https://issuer.example
  preset: k8s-aws
  secrets: {source: ssm, root: /sluis, layout: v5}
  ports:
    dynamodb: {region: eu-west-1, tables: {oidc: sluis-oidc}}
secrets:
  - {name: issuer/state-secret, secretName: x, key: state}
