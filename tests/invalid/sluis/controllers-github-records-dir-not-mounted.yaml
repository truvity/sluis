# The console's records are mounted at one path.
# error: config.controllers.github.recordsDir must be /var/run/github-roster/records
replicaCount: 1
config:
  issuerURL: https://issuer.example
  controllers:
    github:
      consoleURL: http://sluis.default.svc:8080/console
      recordsDir: /etc/records
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
