# Under irsa each module has its own role: the release's awsRoleArn is not inherited.
# error: modules.github.serviceAccount.awsRoleArn
split: true
config:
  issuerURL: https://issuer.example
serviceAccount:
  awsIdentity: irsa
  awsRoleArn: arn:example:iam::acct:role/sluis
modules:
  issuer:
    serviceAccount:
      awsRoleArn: arn:example:iam::acct:role/sluis-issuer
  github:
    enabled: true
