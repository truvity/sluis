# A controller's interval is a Go duration.
# error: at '/config/controllers/github/interval'
replicaCount: 1
config:
  issuerURL: https://issuer.example
  controllers:
    github:
      consoleURL: http://sluis.default.svc:8080/console
      interval: a while
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
