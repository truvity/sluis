# The clusters are said once: in `exchange` or in the policy document, not both.
# error: exchange.clusters and policy.exchange.clusters are both set
config:
  issuerURL: https://issuer.example
exchange:
  clusters:
  - name: example
    issuer: https://oidc.example
policy:
  exchange:
    clusters:
    - name: example
      issuer: https://oidc.example
