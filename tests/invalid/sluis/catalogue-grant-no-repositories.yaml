# A catalogue grant needs repositories.
# error: at '/githubApps/catalogue/0/grants/0': missing property 'repositories'
config:
  issuerURL: https://issuer.example
githubApps:
  catalogue:
  - id: releases
    org: acme
    permissions:
      contents: write
    grants:
    - group: all:platform:engineer
      permissions:
        contents: read
