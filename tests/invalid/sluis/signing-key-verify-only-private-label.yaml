# A PEM block that is not a public key or certificate is refused, whatever its label.
# error: only PUBLIC KEY and CERTIFICATE are accepted
config:
  issuerURL: https://issuer.example
  signingKey:
    verifyOnly:
      - {file: /var/run/access-issuer/verify-keys/0.pem, until: "2026-11-05T00:00:00Z"}
signingKey:
  verifyOnly:
    - pem: |
        -----BEGIN EC PARAMETERS-----
        MIIBexample
        -----END EC PARAMETERS-----
