# The policy is mounted at one path in every module's pod.
# error: modules.outline.config.policy.file must be /var/run/access-issuer/policy/policy.yaml
config:
  issuerURL: https://issuer.example
exchange:
  clusters:
    - name: example-cluster
      issuer: https://oidc.eu-example-1.example/id/EXAMPLE
      jwksUri: https://oidc.eu-example-1.example/id/EXAMPLE/keys
modules:
  outline:
    enabled: true
    config:
      preset: k8s-aws
      ports:
        dynamodb:
          region: eu-west-1
          tables:
            outline: sluis-outline
      policy:
        file: /etc/sluis/policy.yaml
