# The chart mounts the policy at one path, and the controller's config must name it.
# error: controllerSlack.config.policyDir must be /var/run/slack-roster/policy
config:
  issuerURL: https://issuer.example
  exchange:
    clustersFile: /var/run/access-issuer/clusters.yaml
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
controllerSlack:
  enabled: true
  config:
    consoleURL: http://sluis.default.svc:8080/console
    policyDir: /etc/policy
