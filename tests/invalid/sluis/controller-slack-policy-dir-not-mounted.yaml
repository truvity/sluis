# The chart mounts the policy document at one path, and the controller's config must name it.
# error: controllerSlack.config.policy.file must be /var/run/slack-roster/policy/policy.yaml
config:
  issuerURL: https://issuer.example
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
controllerSlack:
  enabled: true
  config:
    consoleURL: http://sluis.default.svc:8080/console
    policy:
      file: /etc/policy.yaml
