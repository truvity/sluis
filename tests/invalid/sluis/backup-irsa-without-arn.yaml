# IRSA needs the role to annotate the account with.
# error: backup.serviceAccount.awsIdentity is irsa
config:
  issuerURL: https://issuer.example
backup:
  enabled: true
  serviceAccount: {awsIdentity: irsa}
  config:
    instance: sluis
    secrets: {source: ssm, root: /sluis, layout: v5}
    ports:
      dynamodb: {region: eu-west-1, tables: {backup: sluis-backup}}
      blob: {adapter: s3, s3: {bucket: b}}
    backup:
      recipients: [age1843v2a5nyfrx6ssyftdyz7n8gncu5r0c3mwx4pgrv00uvca6vgjqa59uwj]
      target: {bucket: archive}
