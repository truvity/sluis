# The projected token is mounted at one path.
# error: config.controllers.github.tokenFile must be /var/run/secrets/github-roster/token
replicaCount: 1
config:
  issuerURL: https://issuer.example
  controllers:
    github:
      consoleURL: http://sluis.default.svc:8080/console
      tokenFile: /etc/token
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
