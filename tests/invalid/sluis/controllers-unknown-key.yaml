# A key a controller does not read is refused at render.
# error: at '/config/controllers/github': additional properties 'bogusKey' not allowed
replicaCount: 1
config:
  issuerURL: https://issuer.example
  controllers:
    github:
      consoleURL: http://sluis.default.svc:8080/console
      bogusKey: 1
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
