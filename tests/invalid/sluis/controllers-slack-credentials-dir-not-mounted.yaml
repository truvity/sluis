# The workspaces' Secret is mounted at one path.
# error: config.controllers.slack.credentialsDir must be /var/run/slack-roster/credentials
replicaCount: 1
config:
  issuerURL: https://issuer.example
  controllers:
    slack:
      consoleURL: http://sluis.default.svc:8080/console
      credentialsDir: /etc/credentials
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
