# controllers.slack.enabledWorkspaces names a workspace the inline policy does not declare.
# error: policy.controllers.slack.enabledWorkspaces names "old", which policy.slack.workspaces does not declare
config:
  issuerURL: https://issuer.example
controllerSlack:
  enabled: true
  config:
    consoleURL: http://sluis.default.svc:8080/console
exchange:
  clusters:
  - name: example
    issuer: https://oidc.example
console:
  mount: /console
policy:
  slack:
    workspaces:
      acme: {}
  controllers:
    slack:
      enabledWorkspaces: [acme, old]
