# oauthClient.secret.keys.clientSecret may not be empty.
# error: at '/config/oauthClient/secretKey': minLength
config:
  issuerURL: https://issuer.example
  oauthClient:
    secretName: sign-in-client
    idFile: /var/run/access-issuer/oauth-client/client-id
    secretFile: /var/run/access-issuer/oauth-client/client-secret
    secretKey: ''
secretMounts:
- secretName: sign-in-client
  mountPath: /var/run/access-issuer/oauth-client
