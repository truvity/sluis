# controllerGithub.config.probes.address with a port out of range (template fail).
# error: controllerGithub.config.probes.address: the port in ":70000" must be between 1 and 65535
config:
  issuerURL: https://issuer.example
  exchange:
    clustersFile: /var/run/access-issuer/clusters.yaml
exchange:
  clusters:
    - name: example-cluster
      issuer: https://oidc.eu-example-1.example/id/EXAMPLE
console:
  mount: /console
controllerGithub:
  enabled: true
  config:
    consoleURL: http://sluis.default.svc:8080/console
    probes:
      address: ":70000"
