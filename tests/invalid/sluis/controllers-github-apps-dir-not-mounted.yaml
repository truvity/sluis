# The Apps' Secret is mounted at one path.
# error: config.controllers.github.appsDir must be /var/run/github-roster/apps
replicaCount: 1
config:
  issuerURL: https://issuer.example
  controllers:
    github:
      consoleURL: http://sluis.default.svc:8080/console
      appsDir: /etc/apps
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
