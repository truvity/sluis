# Only public keys are published.
# error: signingKey.verifyOnly[0] holds a private key
config:
  issuerURL: https://issuer.example
  signingKey:
    verifyOnly:
      - file: /var/run/access-issuer/verify-keys/0.pem
signingKey:
  verifyOnly:
    - pem: |
        -----BEGIN PRIVATE KEY-----
        MIIBexample
        -----END PRIVATE KEY-----
