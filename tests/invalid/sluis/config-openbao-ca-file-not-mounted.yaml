# A caFile the chart mounts nothing at fails the render, naming the value that mounts it.
# error: config.ports.export.openbao.caFile is "/etc/ca.pem" and the chart renders nothing there: set exports.openbao.caBundle
config:
  issuerURL: https://issuer.example
  ports:
    export:
      adapter: openbao
      openbao:
        address: https://openbao.example
        caFile: /etc/ca.pem
        auth: {method: kubernetes, role: r}
