# The console is this release's own Service, and the chart prints the address.
# error: controllerGithub.config.consoleURL must be http://sluis.default.svc:8080/console
config:
  issuerURL: https://issuer.example
  exchange:
    clustersFile: /var/run/access-issuer/clusters.yaml
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
controllerGithub:
  enabled: true
  config:
    consoleURL: http://elsewhere.example/console
