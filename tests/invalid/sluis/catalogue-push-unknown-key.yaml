# A key in a catalogue App's push block the chart does not know must fail the render.
# error: at '/githubApps/catalogue/0/push': additional properties
config:
  issuerURL: https://issuer.example
githubApps:
  catalogue:
  - id: iac
    org: acme
    permissions:
      contents: read
    push:
      secretStore:
        name: example-store
      remoteKey: platform/github-apps/iac
      template:
        type: Opaque
