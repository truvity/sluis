# The openbao Secrets adapter trusts the bundle the chart mounts, or the system CAs.
# error: config.adapters.secrets.settings.caFile is "/etc/ca.pem" and the chart renders nothing there
config:
  issuerURL: https://issuer.example
  adapters:
    secrets:
      adapter: openbao
      settings:
        address: https://openbao.example
        root: sluis
        caFile: /etc/ca.pem
        auth: {method: kubernetes, role: sluis}
