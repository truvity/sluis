# A catalogue grant grants at least one permission.
# error: at '/githubApps/catalogue/0/grants/0/permissions': minProperties
config:
  issuerURL: https://issuer.example
githubApps:
  catalogue:
  - id: releases
    org: acme
    permissions:
      contents: write
    grants:
    - group: all:platform:engineer
      repositories:
      - '*'
      permissions: {}
