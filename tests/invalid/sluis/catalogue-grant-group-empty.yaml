# A catalogue grant's group may not be empty.
# error: at '/githubApps/catalogue/0/grants/0/group': minLength
config:
  issuerURL: https://issuer.example
githubApps:
  catalogue:
  - id: releases
    org: acme
    permissions:
      contents: write
    grants:
    - group: ''
      repositories:
      - '*'
      permissions:
        contents: read
