# A Slack copy written where another recovery copy lives must fail the render: whoever restored from that path could not tell which Secret they were holding.
# error: both write remoteKey
config:
  issuerURL: https://issuer.example
directory:
  push:
    secretStore:
      name: example-store
      kind: ClusterSecretStore
    remoteKey: platform/access-issuer/state
slackState:
  push:
    secretStore:
      name: example-store
      kind: ClusterSecretStore
    remoteKey: platform/access-issuer/slack-credentials
    recordsRemoteKey: platform/access-issuer/state
