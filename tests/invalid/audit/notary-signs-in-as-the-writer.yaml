# refuse: the notary signs in to OpenBAO as the writer
# base: separation-base
jobs:
  notary:
    enabled: true
    config:
      apiVersion: audit.truvity.github.io/audit-notary/v2
      deployment: /etc/audit/deployment.yaml
      sink:
        url: http://audit:8080
      keys:
        adapter: transit
        instance: audit
        seal: audit-seal
        openbao:
          address: https://openbao.example.test:8200
          login:
            mount: jwt-devel
            role: audit-writer
            jwtFile: /var/run/openbao/token
