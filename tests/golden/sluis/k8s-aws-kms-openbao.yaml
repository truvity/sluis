# Source: sluis/templates/verify-keys.yaml
# PUBLIC keys the service publishes in its JWKS and never signs with: the keys of
# an earlier signer, kept so tokens it issued verify until they expire. A
# ConfigMap, because a public key is not a secret. Mounted at
# /var/run/access-issuer/verify-keys, where config.signingKey.verifyOnly[].file
# says.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-verify-keys
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
