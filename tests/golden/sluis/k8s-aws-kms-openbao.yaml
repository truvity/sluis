# Source: sluis/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: sluis/templates/serviceaccount.yaml
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-issuer-recovery
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: sluis/templates/configmap.yaml
# What `sluis serve --config` reads: `config`, as the values give it, with
# nothing added, renamed or dropped but the apiVersion the chart writes. The
# binary validates it against schemas/config/sluis.schema.json at start, and
# values.schema.json holds the values to the same schema before this renders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-config
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: serve
data:
  config.yaml: |
    apiVersion: sluis.truvity.github.io/sluis/v3
    adapters:
      secrets:
        adapter: openbao
        settings:
          address: https://openbao.kernel.truvity.private
          auth:
            method: jwt
            mount: jwt-kernel
            role: sluis
            tokenFile: /var/run/openbao/token
          caFile: /var/run/access-issuer/openbao-ca/ca.pem
          mount: kv
          namespace: kernel
          root: sluis
    audit:
      tokenFile: /var/run/audit/token
      writer: https://audit.example:8443
    inCluster: true
    issuerURL: https://access.example
    lifetimes:
      absolute: 24h
      hold: 4h
      refresh: 12h
      token: 1h
    listen:
      address: :8080
    policy:
      file: /var/run/access-issuer/policy/policy.yaml
    ports:
      blob:
        adapter: s3
        s3:
          bucket: sluis-blobs
          region: eu-west-1
      dynamodb:
        region: eu-west-1
        table: sluis
    preset: k8s-aws
    probes:
      address: :7070
    recovery:
      audience: access-issuer-recovery
      enabled: true
      serviceAccount: access-issuer-recovery
    secrets:
      root: /var/run/sluis/secrets
      source: file
    signingKey:
      activationDelay: 15m
      kmsWrapped:
        keyId: alias/sluis-signing
        region: eu-west-1
        rotateEvery: 24h
        stateSecret: signing/state
      pollInterval: 30s
      verifyOnly:
      - file: /var/run/access-issuer/verify-keys/0.pem
        until: "2026-11-05T00:00:00Z"
    store: kubernetes

---
# Source: sluis/templates/openbao-ca-configmap.yaml
# The authorities that sign OpenBao's certificate, for the service's exports
# (docs/decisions/0034). A certificate, never a secret: it is mounted where
# config.ports.export.openbao.caFile says.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-openbao-ca
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  ca.pem: |
    -----BEGIN CERTIFICATE-----
    MIIBexample
    -----END CERTIFICATE-----

---
# Source: sluis/templates/policy-configmap.yaml
# The policy document (schemas/config/policy.schema.json): what every process
# of this installation decides by, read once at start. Mounted as a directory
# by the service and both controllers, so a change rolls all three.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-policy
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.yaml: |
    apiVersion: sluis.truvity.github.io/policy/v2
    apps:
      github:
        runnerTiers:
        - preview
        - stable
    exports:
    - namespace: devel
      org: truvity
      path: github-runner-app/preview/truvity
      source: runner-app
      tier: preview

