---
# Source: sluis/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sluis
      app.kubernetes.io/instance: sluis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sluis
        app.kubernetes.io/instance: sluis
      annotations:
        # A configuration change is a rollout: the file is read at start.
        checksum/config: 8377f0eb0117ebc68bfa348de4592fcd1741c1f230afe5744646354168abc704
        # A policy change is a rollout: the file is read at start.
        checksum/policy: 8bee7bc36a81deba29b9ff56f3b29ae793ec023e4c72225f85aaa243e5566a92
        # Likewise the Slack catalogue: read once at start.
        checksum/slack-apps-catalogue: 3eea40ff55f194620a37af7ec242bc4367fb1bf30c285aaaf493c6101083020f
    spec:
      serviceAccountName: sluis
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serve
          image: "ghcr.io/truvity/sluis/sluis:0.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: 8080
            - name: health
              containerPort: 7070
          # The whole of the configuration is the file: `config`, rendered as it
          # stands. The environment carries only the secrets that file names.
          args:
            - serve
            - --config=/etc/sluis/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/sluis/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: signing-key
              mountPath: /var/run/access-issuer/signing-key
              readOnly: true
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            - name: tmp
              mountPath: /tmp
            
            - name: slack-apps-catalogue
              mountPath: /var/run/access-issuer/slack-apps-catalogue.yaml
              subPath: catalogue.yaml
              readOnly: true
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: sluis-config
        - name: signing-key
          secret:
            secretName: sluis-signing-key
        - name: policy
          configMap:
            name: sluis-policy
        # The root filesystem is read-only, and the directory backends
        # want somewhere to write.
        - name: tmp
          emptyDir: {}
        
        - name: slack-apps-catalogue
          configMap:
            name: sluis-slack-apps-catalogue

---
# Source: sluis/templates/signing-key.yaml
# The signing key, issued by cert-manager.
#
# The certificate is a by-product: only the key is used. cert-manager is
# here because it generates the key in the cluster, keeps it out of every
# other system, and rotates it on a schedule the platform already
# understands — none of which is true of a key this service minted for
# itself, and the last of which is the reason it does not.
#
# `rotationPolicy: Always` makes a renewal a *new key*, which is the
# point: a renewed certificate over the same key would rotate nothing.
#
# The algorithm decides what the issuer signs with -- RSA signs RS256, and
# P-256, P-384 and P-521 sign ES256, ES384 and ES512 -- and that is what
# the discovery document advertises, so every relying party has to accept
# it. Changing it here rotates the key, so tokens signed with the previous
# one stop verifying once the old public key leaves the JWKS -- which the
# issuer itself now schedules, with no restart of this Deployment needed
# either to notice the new key or to retire the old one; see
# `signingKey.rotation` for the delays that govern it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sluis-signing-key
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  secretName: sluis-signing-key
  commonName: sluis
  duration: "8760h"
  renewBefore: "720h"
  privateKey:
    algorithm: ECDSA
    size: 384
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: "selfsigned"
    kind: "ClusterIssuer"
    group: cert-manager.io

---
# Source: sluis/templates/slack-apps-push.yaml
# The bot token of catalogue Slack App sync, copied to ClusterSecretStore example-store.
# A consumer reads the property `bot_token` from platform/slack-apps/sync; the
# name is the contract and does not change for the life of the App.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: sluis-slack-app-sync
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  refreshInterval: 30m
  # Declared rather than left to the API's default, and `conversionStrategy`
  # below likewise. A field the CRD defaults but the manifest omits reads
  # as drift to anything that compares desired against live: an ArgoCD
  # Application carrying this chart sits permanently OutOfSync on a
  # PushSecret that is doing its job, and a permanent OutOfSync is a
  # health signal nobody can read any more.
  updatePolicy: Replace
  # None by default: a declaration removed here leaves the copy for
  # somebody to remove deliberately rather than breaking a consumer's next
  # run from a distance.
  deletionPolicy: Delete
  secretStoreRefs:
    - name: example-store
      kind: ClusterSecretStore
  selector:
    secret:
      # The one Secret the service keeps every catalogue Slack App in. The
      # bot token key below exists only once the App is INSTALLED, so
      # nothing is pushed for an App an operator created and stopped at.
      name: sluis-slack-catalogue-apps
  data:
    - conversionStrategy: None
      match:
        secretKey: sync.slack_bot_token
        remoteRef:
          remoteKey: platform/slack-apps/sync
          property: bot_token

