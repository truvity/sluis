# Source: sluis/templates/serviceaccount.yaml
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: break-glass
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: sluis/templates/configmap.yaml
# What `sluis serve --config` reads: `config`, as the values give it, with
# nothing added, renamed or dropped but the apiVersion the chart writes. The
# binary validates it against schemas/config/serve.schema.json at start, and
# values.schema.json holds the values to the same schema before this renders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-config
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: serve
data:
  config.yaml: |
    apiVersion: sluis.truvity.github.io/serve/v2
    audit:
      audience: audit
      forwardedForTrustedHops: 1
      queryURL: http://audit-query.access-issuer.svc:8080
      tokenFile: /var/run/audit/token
      writer: http://audit.access-issuer.svc:8080
    clientSecretsDir: /var/run/access-issuer/clients
    cluster: example-cluster
    console:
      client: access-console
      origin: https://access.example
    directory:
      workspaces:
      - admin: admin@acme.example
        backend: google
        id: C0acme
        keyFile: /var/run/access-issuer/directory/acme/service-account.json
        serve:
        - acme.example
        syncGroups:
        - engineering@acme.example
      - admin: admin@globex.example
        backend: google
        keyFile: /var/run/access-issuer/directory/globex/key.json
    exchange:
      audience: access-exchange
    freshness:
      freshnessWindow: 20m
      probeInterval: 2m
      refreshInterval: 10m
    inCluster: true
    issuerURL: https://access.example
    lifetimes:
      absolute: 24h
      hold: 2h
      refresh: 6h
      session: 8h
      token: 30m
    listen:
      address: :8443
    log:
      level: debug
    login:
      directory: false
    oauthClient:
      idFile: /var/run/access-issuer/oauth-client/id
      idKey: id
      secretFile: /var/run/access-issuer/oauth-client/secret
      secretKey: secret
      secretName: sign-in-client
    policy:
      file: /var/run/access-issuer/policy/policy.yaml
    probes:
      address: :9090
    publicRootURL: https://access.example
    publicURL: https://access.example/console
    recovery:
      audience: break-glass-audience
      enabled: true
      serviceAccount: break-glass
    release: sluis
    secureCookies: true
    signingKey:
      activationDelay: 15m
      file: /var/run/access-issuer/signing-key/tls.key
      pollInterval: 30s
    store: kubernetes
    valkey:
      address: valkey.example.svc:6379
      cluster: true
      passwordEnv: VALKEY_PASSWORD
      tls: true

