---
# Source: sluis/templates/networkpolicy.yaml
# Ingress only. Everything with a browser arrives through the gateway;
# these are the in-cluster callers — the proxies verifying tokens and the
# workloads exchanging them.
#
# No egress rules: this service has to reach the API server, the hub and
# whichever directory a person signs in with, and a chart that guessed at
# that list would be a chart that breaks a login the day a provider adds
# a hostname. The fleet's own egress policy is where that belongs: a
# Kubernetes NetworkPolicy cannot name a host, and the Slack controller
# (config.controllers.slack) needs slack.com:443 to be allowed there, as the
# GitHub controller needs api.github.com:443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sluis
      app.kubernetes.io/instance: sluis
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: workloads
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: proxies
      ports:
        - port: 8443
    # The controllers in this process read the console's API through this
    # release's own Service, which may route the call to another replica of
    # the pod: so the pods admit one another on the issuer's port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sluis
              app.kubernetes.io/instance: sluis
      ports:
        - port: 8443

---
# Source: sluis/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: issuer
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: sluis/templates/serviceaccount.yaml
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: break-glass
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: sluis/templates/configmap.yaml
# What `sluis serve --config` reads: `config`, as the values give it, with
# nothing added, renamed or dropped but the apiVersion the chart writes. The
# binary validates it against schemas/config/sluis.schema.json at start, and
# values.schema.json holds the values to the same schema before this renders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-config
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: serve
data:
  config.yaml: |
    apiVersion: sluis.truvity.github.io/sluis/v3
    audit:
      audience: audit
      forwardedForTrustedHops: 1
      queryURL: http://audit-query.access-issuer.svc:8080
      tokenFile: /var/run/audit/token
      writer: http://audit.access-issuer.svc:8080
    cluster: example-cluster
    console:
      client: access-console
      origin: https://access.example
    controllers:
      github:
        consoleURL: http://sluis.identity.svc:8443/console
        interval: 5m
      slack:
        consoleURL: http://sluis.identity.svc:8443/console
        interval: 5m
    directory:
      workspaces:
      - admin: admin@acme.example
        backend: google
        id: C0acme
        keySecret: directory/C0acme/key
        serve:
        - acme.example
        syncGroups:
        - engineering@acme.example
      - admin: admin@globex.example
        backend: google
        keySecret: directory/globex/key
    exchange:
      audience: access-exchange
    freshness:
      freshnessWindow: 20m
      probeInterval: 2m
      refreshInterval: 10m
    inCluster: true
    issuerURL: https://access.example
    lifetimes:
      absolute: 24h
      hold: 2h
      refresh: 6h
      session: 8h
      token: 30m
    listen:
      address: :8443
    log:
      level: debug
    login:
      directory: false
    oauthClient:
      idKey: id
      secretKey: secret
      secretName: sign-in-client
    policy:
      file: /var/run/access-issuer/policy/policy.yaml
    probes:
      address: :9090
    publicRootURL: https://access.example
    publicURL: https://access.example/console
    recovery:
      audience: break-glass-audience
      enabled: true
      serviceAccount: break-glass
    release: sluis
    secrets:
      root: /var/run/sluis/secrets
      source: file
    secureCookies: true
    signingKey:
      activationDelay: 15m
      file: /var/run/access-issuer/signing-key/tls.key
      pollInterval: 30s
    store: kubernetes
    valkey:
      address: valkey.example.svc:6379
      cluster: true
      passwordSecret: valkey/password
      tls: true

---
# Source: sluis/templates/policy-configmap.yaml
# The policy document (schemas/config/policy.schema.json): what every process
# of this installation decides by, read once at start. Mounted as a directory
# by the service and both controllers, so a change rolls all three.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-policy
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.yaml: |
    apiVersion: sluis.truvity.github.io/policy/v2
    apps:
      github:
        apps:
        - purpose: runner
          tier: preview
        - purpose: runner
          tier: stable
        - description: Dependency updates
          events:
          - pull_request
          grants:
          - group: all:platform:engineer
            permissions:
              contents: read
            repositories:
            - '*'
          id: dependency-bot
          installation: selected
          name: acme-dependency-bot
          org: acme
          permissions:
            contents: write
            pull_requests: write
          public: false
          purpose: catalogue
    clients:
      access-console:
        kind: confidential
        redirects:
        - https://access.example/console/
        requires:
        - all:access-roster:operator
        secret: access-console-client
      accessctl:
        kind: public
        redirects:
        - http://127.0.0.1/callback
        requires:
        - all:platform:engineer
      reports:
        kind: confidential
        redirects:
        - https://reports.example/oauth2/callback
        requires:
        - all:platform:engineer
        secret: reports-client
    controllers:
      github:
        enabledOrgs:
        - acme
        - globex
      slack:
        enabledWorkspaces:
        - acme
        - globex-eu
    exchange:
      aws:
        accounts:
        - account: "111122223333"
          algs:
          - ES384
          issuer: https://example-id.tokens.sts.global.api.aws
          name: apps
          orgId: o-example1234
        - account: "444455556666"
          issuer: https://other-id.tokens.sts.global.api.aws
          jwksUri: https://keys.example/jwks.json
          name: data
        audience: https://access.example
        maxAge: 3m
      clusters:
      - issuer: https://oidc.eu-example-1.example/id/EXAMPLE
        jwksUri: https://oidc.eu-example-1.example/id/EXAMPLE/keys
        name: example-cluster
      - issuer: https://edge.example
        name: example-edge
      github:
        owners:
        - acme
        - globex
    github:
      acme:
        members:
        - all:platform:engineer
      globex:
        teams:
          platform:
            members:
            - all:platform:engineer
    groups:
      all:access-roster:operator:
        members:
        - platform@acme.example
      all:platform:engineer:
        members:
        - engineering@acme.example
        - engineering@globex.example
    slack:
      workspaces:
        acme: {}
        globex-eu: {}

---
# Source: sluis/templates/serviceaccount.yaml
# The one cluster-scoped permission this service ever needs, and the one
# thing left that asks the API server anything: creating TokenReviews, so
# that recovery can check a token proving cluster access. It reads
# nothing.
#
# Workloads used to need it too. They do not any more: a
# ServiceAccount token is verified against the key set its own cluster
# publishes, so this service holds no access to any cluster including its
# own. Recovery keeps it because on the day everything else is broken it
# should depend on nothing but the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sluis-identity-tokenreview
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]

---
# Source: sluis/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sluis-identity-tokenreview
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sluis-identity-tokenreview
subjects:
  - kind: ServiceAccount
    name: issuer
    namespace: identity

---
# Source: sluis/templates/controllers.yaml
# What the controllers in this process may do to the cluster, bound to the
# service's own account (there is one account and one pod). Update, by name,
# the ConfigMaps they report into, and the one Secret people's linked GitHub
# accounts are kept in: each link's token pair rotates every time it is renewed,
# and the renewed pair has to be written back. The service creates those
# objects -- `create` cannot be narrowed to a name -- so this grants no create,
# and in particular no ConfigMap that would read to the service as a workspace
# record. The Secrets with the Apps' keys and the ConfigMaps with the console's
# records are mounted volumes, so no other Secret or ConfigMap is readable, and
# watching them for a change (an install, a Refresh) needs no permission either.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sluis-controllers
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - "sluis-github-status"
      - "sluis-slack-status"
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sluis-github-links"]
    verbs: ["get", "update"]

---
# Source: sluis/templates/serviceaccount.yaml
# The directory store is plain Kubernetes objects in THIS namespace:
# workspace records (ConfigMaps) and their credentials (Secrets), written
# by this service itself. A namespaced Role and never a ClusterRole —
# which is why this service gets a namespace of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# Source: sluis/templates/controllers.yaml
