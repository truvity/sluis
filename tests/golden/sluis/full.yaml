            - slack
            - --config=/etc/sluis/controller-slack.yaml
          ports:
            - name: health
              containerPort: 7070
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/sluis/controller-slack.yaml
              subPath: config.yaml
              readOnly: true
            - name: policy
              mountPath: /var/run/slack-roster/policy
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/slack-roster
              readOnly: true
            - name: credentials
              mountPath: /var/run/slack-roster/credentials
              readOnly: true
            - name: workspaces
              mountPath: /var/run/slack-roster/workspaces
              readOnly: true
            
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: sluis-slack-roster-config
        - name: policy
          configMap:
            name: sluis-policy
        # The token the console verifies, for the audience it accepts a
        # workload's token for. Rotated by the kubelet; the controller reads
        # the file on every call.
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: access-exchange
                  expirationSeconds: 3600
                  path: token
        # One file per connected workspace: the app's credentials and its bot
        # token. Optional: before anything is connected there may be nothing,
        # and the controller reports each declared workspace as not connected
        # rather than failing to start.
        - name: credentials
          secret:
            secretName: sluis-slack-credentials
            optional: true
        # The console's records beside them: each workspace's record, the
        # shared channels' definitions and the operators' confirmations.
        # Optional for the same reason.
        - name: workspaces
          configMap:
            name: sluis-slack-workspaces
            optional: true
        
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: identity

