# Source: sluis/templates/controller-github.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sluis-github-roster
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller-github
spec:
  # Rolled so that a new pod must be Ready before an old one goes: a
  # start that fails (the 2026-10-04 rollout, where every new pod crashed
  # at start) leaves the old pod running. More than one replica is safe only
  # on a shared State (see sluis.controllerRollout), and `replicas` is
  # refused above 1 without one.
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sluis-github-roster
      app.kubernetes.io/instance: sluis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sluis-github-roster
        app.kubernetes.io/instance: sluis
      annotations:
        # One checksum per document this process reads: its own, and the
        # policy. A change to the service's or the other controller's
        # document does not restart it.
        checksum/config: 1430c7d6ba0607e3e22e67873fe6dac7f5a0662b67752da5472b78d823ab9693
        checksum/policy: 271a7354dcbf9b192a831177ce3df1c573b2140a01b1dd43592be78af812ef00
    spec:
      serviceAccountName: sluis-github-roster
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller-github
          image: "registry.example/sluis/sluis:v1.2.3"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args:
            - controller
            - github
            - --config=/etc/sluis/controller-github.yaml
          ports:
            - name: health
              containerPort: 7070
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/sluis/controller-github.yaml
              subPath: config.yaml
              readOnly: true
            - name: policy
              mountPath: /var/run/github-roster/policy
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/github-roster
              readOnly: true
            - name: apps
              mountPath: /var/run/github-roster/apps
              readOnly: true
            - name: records
              mountPath: /var/run/github-roster/records
              readOnly: true
            
            - name: audit-token
              mountPath: /var/run/audit
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: sluis-github-roster-config
        - name: policy
          configMap:
            name: sluis-policy
        # The token the console verifies, for the audience it accepts a
        # workload's token for. Rotated by the kubelet; the controller reads
        # the file on every call.
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: access-exchange
                  expirationSeconds: 3600
                  path: token
        # One file per connected organisation. Optional: before anything is
        # connected there may be nothing, and the controller reports each
        # bound organisation as not connected rather than failing to start.
        - name: apps
          secret:
            secretName: sluis-github-apps
            optional: true
        # The console's records beside them: each organisation's record, the
        # operators' confirmations and their requests for a pass now. The
        # controller watches it, so a Refresh runs a pass at once. Optional
        # for the same reason.
        - name: records
          configMap:
            name: sluis-github-orgs
            optional: true
        
        - name: audit-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "audit"
                  expirationSeconds: 1800
                  path: token
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: identity

