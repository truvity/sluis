---
# Source: sluis/templates/policy-configmap.yaml
# The policy document (schemas/config/policy.schema.json): what every process
# of this installation decides by, read once at start. Mounted as a directory
# by the service and both controllers, so a change rolls all three.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-policy
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.yaml: |
    apiVersion: sluis.truvity.github.io/policy/v2
    apps:
      github:
        apps:
        - purpose: runner
          tier: preview
        - purpose: runner
          tier: stable
        - description: Dependency updates
          events:
          - pull_request
          grants:
          - group: all:platform:engineer
            permissions:
              contents: read
            repositories:
            - '*'
          id: dependency-bot
          installation: selected
          name: acme-dependency-bot
          org: acme
          permissions:
            contents: write
            pull_requests: write
          public: false
          purpose: catalogue
    clients:
      access-console:
        kind: confidential
        redirects:
        - https://access.example/console/
        requires:
        - all:access-roster:operator
        secret: access-console-client
      accessctl:
        kind: public
        redirects:
        - http://127.0.0.1/callback
        requires:
        - all:platform:engineer
      reports:
        kind: confidential
        redirects:
        - https://reports.example/oauth2/callback
        requires:
        - all:platform:engineer
        secret: reports-client
      sluisctl:
        kind: public
        redirects:
        - http://127.0.0.1/callback
        requires:
        - all:platform:engineer
    controllers:
      github:
        enabledOrgs:
        - acme
        - globex
      slack:
        enabledWorkspaces:
        - acme
        - globex-eu
    exchange:
      aws:
        accounts:
        - account: "111122223333"
          algs:
          - ES384
          issuer: https://example-id.tokens.sts.global.api.aws
          name: apps
          orgId: o-example1234
        - account: "444455556666"
          issuer: https://other-id.tokens.sts.global.api.aws
          jwksUri: https://keys.example/jwks.json
          name: data
        audience: https://access.example
        maxAge: 3m
      clusters:
      - issuer: https://oidc.eu-example-1.example/id/EXAMPLE
        jwksUri: https://oidc.eu-example-1.example/id/EXAMPLE/keys
        name: example-cluster
      - issuer: https://edge.example
        name: example-edge
      github:
        owners:
        - acme
        - globex
    github:
      acme:
        members:
        - all:platform:engineer
      globex:
        teams:
          platform:
            members:
            - all:platform:engineer
    groups:
      all:access-roster:operator:
        members:
        - platform@acme.example
      all:platform:engineer:
        members:
        - engineering@acme.example
        - engineering@globex.example
    slack:
      workspaces:
        acme: {}
        globex-eu: {}

---
# Source: sluis/templates/serviceaccount.yaml
# The one cluster-scoped permission this service ever needs, and the one
# thing left that asks the API server anything: creating TokenReviews, so
# that recovery can check a token proving cluster access. It reads
# nothing.
#
# Workloads used to need it too. They do not any more: a
# ServiceAccount token is verified against the key set its own cluster
# publishes, so this service holds no access to any cluster including its
# own. Recovery keeps it because on the day everything else is broken it
# should depend on nothing but the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sluis-identity-tokenreview
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]

---
# Source: sluis/templates/modules.yaml
# The module checks its callers' tokens with a TokenReview, which is the one
# thing system:auth-delegator allows (and a SubjectAccessReview).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sluis-identity-github-auth-delegator
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: github
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: sluis-github
    namespace: identity

---
# Source: sluis/templates/modules.yaml
