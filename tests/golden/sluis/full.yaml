---
# Source: sluis/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sluis
      app.kubernetes.io/instance: sluis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sluis
        app.kubernetes.io/instance: sluis
      annotations:
        # Configuration and policy are immutable for an instance: each document
        # is read once, at start, so a change to either is a rollout. One
        # checksum per document this process reads: the service document (the
        # controllers' sections are in it) and the policy.
        checksum/config: 0e1af74de96b6301847facdefce17161de8252e2ca9f085516b0423d6a4ad3d1
        checksum/policy: 164a6383e1a8a507459fac193139e235f56b49d8d6e02c883e65b490101c88b6
        example.com/scrape: "false"
    spec:
      serviceAccountName: issuer
      securityContext:
        runAsNonRoot: true
        # The projected secrets are mode 0440: readable by this group, whatever
        # user the image runs as.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serve
          image: "registry.example/sluis/sluis:v1.2.3"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: 8443
            - name: health
              containerPort: 9090
          # The whole of the configuration is the service document, `config`
          # rendered as it stands, and the policy document it names. The
          # environment carries only the secrets the document names.
          args:
            - serve
            - --config=/etc/sluis/config.yaml
          env:
            - name: SLUIS_EXTRA
              valueFrom:
                secretKeyRef:
                  name: extra
                  key: value
          volumeMounts:
            # Read once, at start: a subPath is enough, since a change replaces
            # the pod (checksum/*). The policy keeps its directory.
            - name: config
              mountPath: /etc/sluis/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            - name: signing-key
              mountPath: /var/run/access-issuer/signing-key
              readOnly: true
            - name: tmp
              mountPath: /tmp
            
            - name: audit-token
              mountPath: /var/run/audit
              readOnly: true
            # The GitHub controller's: the token the console verifies for it, the
            # Apps' credentials and the console's records.
            - name: github-token
              mountPath: /var/run/secrets/github-roster
              readOnly: true
            - name: github-apps
              mountPath: /var/run/github-roster/apps
              readOnly: true
            - name: github-records
              mountPath: /var/run/github-roster/records
              readOnly: true
            # The Slack controller's, likewise.
            - name: slack-token
              mountPath: /var/run/secrets/slack-roster
              readOnly: true
            - name: slack-credentials
              mountPath: /var/run/slack-roster/credentials
              readOnly: true
            - name: slack-workspaces
              mountPath: /var/run/slack-roster/workspaces
              readOnly: true
            # A directory, not a subPath: a secret is read on every use, so a
            # rotated Secret reaches the running process.
            - name: secrets
              mountPath: /var/run/sluis/secrets
              readOnly: true
            - name: secret-sign-in-client
              mountPath: /var/run/access-issuer/oauth-client
              readOnly: true
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: sluis-config
        - name: signing-key
          secret:
            secretName: sluis-signing-key
        - name: policy
          configMap:
            name: sluis-policy
        # The root filesystem is read-only, and the directory backends
        # want somewhere to write.
        - name: tmp
          emptyDir: {}
        
        - name: audit-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "audit"
                  expirationSeconds: 1800
                  path: token
        # The token the console verifies, for the audience it accepts a
        # workload's token for. Rotated by the kubelet; the controller reads
        # the file on every call.
        - name: github-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: access-exchange
                  expirationSeconds: 3600
                  path: token
        # One file per connected organisation. Optional: before anything is
        # connected there may be nothing, and the controller reports each
        # bound organisation as not connected rather than failing to start.
        - name: github-apps
          secret:
            secretName: sluis-github-apps
            optional: true
        # The console's records beside them: each organisation's record, the
        # operators' confirmations and their requests for a pass now. Optional
        # for the same reason.
        - name: github-records
          configMap:
            name: sluis-github-orgs
            optional: true
        - name: slack-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: access-exchange
                  expirationSeconds: 3600
                  path: token
        # One file per connected workspace: the app's credentials and its bot
        # token. Optional: before anything is connected there may be nothing.
        - name: slack-credentials
          secret:
            secretName: sluis-slack-credentials
            optional: true
        # The console's records beside them: each workspace's record, the
        # shared channels' definitions and the operators' confirmations.
        - name: slack-workspaces
          configMap:
            name: sluis-slack-workspaces
            optional: true
        # Every secret the config names, as the file <root>/<name>, so the
        # service resolves a secret by reading a path and never by holding
        # RBAC to read Secrets -- the same reason the signing key is a file.
        # A confidential client's is clients/<client-id>/secret, from the
        # Secret its policy entry names.
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: "valkey-password"
                  items:
                    - key: "secret"
                      path: "valkey/password"
              - secret:
                  name: "acme-directory-key"
                  items:
                    - key: "service-account.json"
                      path: "directory/C0acme/key"
              - secret:
                  name: "globex-directory-key"
                  items:
                    - key: "key.json"
                      path: "directory/globex/key"
              - secret:
                  name: access-console-client
                  items:
                    - key: client-secret
                      path: clients/access-console/secret
              - secret:
                  name: reports-client
                  items:
                    - key: oidc-secret
                      path: clients/reports/secret
        - name: secret-sign-in-client
          secret:
            secretName: sign-in-client
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: identity

---
# Source: sluis/templates/httproute.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sluis-tls
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  secretName: sluis-tls
  dnsNames:
    - "access.example"
  privateKey:
    algorithm: ECDSA
    encoding: PKCS8
    rotationPolicy: Always
    size: 384
  issuerRef:
    name: "web-ca"
    kind: "Issuer"
    group: cert-manager.io

---
# Source: sluis/templates/signing-key.yaml
# The signing key, issued by cert-manager.
#
# The certificate is a by-product: only the key is used. cert-manager is
# here because it generates the key in the cluster, keeps it out of every
# other system, and rotates it on a schedule the platform already
# understands — none of which is true of a key this service minted for
# itself, and the last of which is the reason it does not.
#
# `rotationPolicy: Always` makes a renewal a *new key*, which is the
# point: a renewed certificate over the same key would rotate nothing.
#
# The algorithm decides what the issuer signs with -- RSA signs RS256, and
# P-256, P-384 and P-521 sign ES256, ES384 and ES512 -- and that is what
# the discovery document advertises, so every relying party has to accept
# it. Changing it here rotates the key, so tokens signed with the previous
# one stop verifying once the old public key leaves the JWKS -- which the
# issuer itself now schedules, with no restart of this Deployment needed
# either to notice the new key or to retire the old one; see
# `signingKey.rotation` for the delays that govern it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sluis-signing-key
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  secretName: sluis-signing-key
  commonName: sluis
  duration: "4380h"
  renewBefore: "360h"
  privateKey:
    algorithm: RSA
    size: 4096
    encoding: PKCS1
    rotationPolicy: Always
  issuerRef:
    name: "signing-issuer"
    kind: "Issuer"
    group: cert-manager.io

---
# Source: sluis/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  gatewayClassName: "shared"
  listeners:
    - name: issuer
      protocol: HTTPS
      port: 443
      hostname: "access.example"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - "consoles"
                  - "identity"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: sluis-tls

---
# Source: sluis/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: sluis
      sectionName: issuer
  hostnames:
    - "access.example"
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: "/console/"
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sluis
          port: 8443
          weight: 1

---
# Source: sluis/templates/httproute.yaml
# The console's own route, and the reason it is a SEPARATE object rather
# than another rule above: a gateway policy attaches to an HTTPRoute, so
# anything put in front of the console would otherwise also sit in front
# of /token, /keys and discovery. Every relying party in the estate would
# be asked to sign in to fetch a key set.
#
# It renders whether or not anything attaches to it. An empty route costs
# a few lines of YAML; discovering at cutover that there is nothing to
# attach to costs an evening, and the alternative in that moment —
# attaching to the catch-all — is the outage described above.
#
# The path is NOT rewritten. The merged service strips the prefix
# itself, so a gateway that stripped it too would hand the console a path
# it never serves.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sluis-console
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: sluis
      sectionName: issuer
  hostnames:
    - "access.example"
  rules:
    - matches:
        - path:
            type: Exact
            value: "/console"
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: "/console/"
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: "/console/"
      backendRefs:
        - group: ""
          kind: Service
          name: sluis
          port: 8443
          weight: 1
