---
# Source: sluis/templates/networkpolicy.yaml
# The issuer. Ingress: the gateway and the namespaces that call it (the proxies
# verifying tokens, the workloads exchanging them), and the controllers, which
# read the console's API through the release's own Service.
# Egress is DNS, the module's own peers, and HTTPS to `networkPolicy.egress.https`
# (the providers' hosts, the cloud APIs and the API server cannot be named in a
# NetworkPolicy), and what `networkPolicy.egress.extra.issuer` adds.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sluis-issuer
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: issuer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sluis
      app.kubernetes.io/instance: sluis
      app.kubernetes.io/component: issuer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: workloads
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: proxies
      ports:
        - port: 8443
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["github","slack"]
            matchLabels:
              app.kubernetes.io/name: sluis
              app.kubernetes.io/instance: sluis
      ports:
        - port: 8443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sluis
              app.kubernetes.io/instance: sluis
              app.kubernetes.io/component: github
      ports:
        - port: 8081
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sluis
              app.kubernetes.io/instance: sluis
              app.kubernetes.io/component: slack
      ports:
        - port: 8081
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { port: 443, protocol: TCP }

