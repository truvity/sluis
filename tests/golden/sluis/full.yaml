# Source: sluis/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: sluis
      app.kubernetes.io/instance: sluis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sluis
        app.kubernetes.io/instance: sluis
      annotations:
        # Configuration and policy are immutable for an instance: each document
        # is read once, at start, so a change to either is a rollout. One
        # checksum per document this process reads, and no other: a change
        # to a controller's own document does not restart the service.
        checksum/config: 2e3a9886137ab14f1c456db1800fea54ed976b90f721f0acb209360253406a24
        checksum/policy: 271a7354dcbf9b192a831177ce3df1c573b2140a01b1dd43592be78af812ef00
        example.com/scrape: "false"
    spec:
      serviceAccountName: issuer
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serve
          image: "registry.example/sluis/sluis:v1.2.3"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: 8443
            - name: health
              containerPort: 9090
          # The whole of the configuration is the service document, `config`
          # rendered as it stands, and the policy document it names. The
          # environment carries only the secrets the document names.
          args:
            - serve
            - --config=/etc/sluis/config.yaml
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-password
                  key: secret
          volumeMounts:
            # Read once, at start: a subPath is enough, since a change replaces
            # the pod (checksum/*). The policy keeps its directory.
            - name: config
              mountPath: /etc/sluis/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            - name: signing-key
              mountPath: /var/run/access-issuer/signing-key
              readOnly: true
            - name: tmp
              mountPath: /tmp
            
            - name: audit-token
              mountPath: /var/run/audit
              readOnly: true
            - name: client-secrets
              mountPath: /var/run/access-issuer/clients
              readOnly: true
            - name: secret-sign-in-client
              mountPath: /var/run/access-issuer/oauth-client
              readOnly: true
            - name: secret-acme-directory-key
              mountPath: /var/run/access-issuer/directory/acme
              readOnly: true
            - name: secret-globex-directory-key
              mountPath: /var/run/access-issuer/directory/globex
              readOnly: true
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: sluis-config
        - name: signing-key
          secret:
            secretName: sluis-signing-key
        - name: policy
          configMap:
            name: sluis-policy
        # The root filesystem is read-only, and the directory backends
        # want somewhere to write.
        - name: tmp
          emptyDir: {}
        
        - name: audit-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "audit"
                  expirationSeconds: 1800
                  path: token
        # One file per confidential client, named after the client id, so
        # the service resolves a secret by reading a path and never by
        # holding RBAC to read Secrets -- the same reason the signing key
        # is a file.
        - name: client-secrets
          projected:
            sources:
              - secret:
                  name: access-console-client
                  items:
                    - key: client-secret
                      path: access-console
              - secret:
                  name: reports-client
                  items:
                    - key: client-secret
                      path: reports
        - name: secret-sign-in-client
          secret:
            secretName: sign-in-client
        - name: secret-acme-directory-key
          secret:
            secretName: acme-directory-key
        - name: secret-globex-directory-key
          secret:
            secretName: globex-directory-key
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: identity

