---
# Source: sluis/templates/serviceaccount.yaml
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sluis-recovery
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: sluis/templates/configmap.yaml
# What `sluis serve --config` reads: `config`, as the values give it, with
# nothing added, renamed or dropped but the apiVersion the chart writes. The
# binary validates it against schemas/config/sluis.schema.json at start, and
# values.schema.json holds the values to the same schema before this renders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-config
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: serve
data:
  config.yaml: |
    apiVersion: sluis.truvity.github.io/sluis/v3
    adapters:
      blobs:
        adapter: s3
        settings:
          bucket: example-sluis-staging-111122223333
          region: eu-central-1
      secrets:
        adapter: openbao
        settings:
          address: https://openbao.example.test
          auth:
            method: kubernetes
            mount: kubernetes
            role: sluis
            tokenFile: /var/run/openbao/token
          caFile: /var/run/access-issuer/openbao-ca/ca.pem
          namespace: staging
          root: sluis
      state:
        adapter: dynamodb
        settings:
          region: eu-central-1
          table: example-sluis-staging
    audit:
      audience: audit
      forwardedForTrustedHops: 2
      queryURL: http://audit-query.audit.svc:8080
      tokenFile: /var/run/audit/token
      writer: http://audit.audit.svc:8080
    cluster: staging
    console:
      client: access-console
    controllers:
      github:
        consoleURL: http://sluis.sluis.svc:8080/console
        interval: 15m
      slack:
        consoleURL: http://sluis.sluis.svc:8080/console
        interval: 15m
    exchange:
      audience: sluis
    groupsScoping: enforce
    inCluster: true
    issuerURL: https://access.example.test
    lifetimes:
      absolute: 24h
      hold: 4h
      refresh: 12h
      session: 12h
      token: 1h
    log:
      level: info
    login:
      directory: false
    oauthClient:
      provider: default
    policy:
      file: /var/run/access-issuer/policy/policy.yaml
    preset: k8s-aws
    publicRootURL: https://access.example.test
    publicURL: https://access.example.test/console
    recovery:
      audience: sluis-recovery
      enabled: true
      serviceAccount: sluis-recovery
    release: sluis
    secrets:
      root: sluis
      source: ssm
    secureCookies: true
    signingKey:
      kmsWrapped:
        algorithms:
          - ES384
          - RS256
        keyId: alias/example-sluis-signing
        region: eu-central-1
        rotateEvery: 24h
        stateSecret: issuer/state-secret
      overlap: 25h
      verifyOnly:
        - alg: ES384
          file: /var/run/access-issuer/verify-keys/0.pem
          until: "2026-11-01T00:00:00Z"
    valkey:
      address: valkey-sluis.sluis.svc:6379
      cluster: true

