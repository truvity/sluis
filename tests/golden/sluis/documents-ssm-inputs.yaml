# Source: sluis/templates/serviceaccount.yaml
# The one cluster-scoped permission this service ever needs, and the one
# thing left that asks the API server anything: creating TokenReviews, so
# that recovery can check a token proving cluster access. It reads
# nothing.
#
# Workloads used to need it too. They do not any more: a
# ServiceAccount token is verified against the key set its own cluster
# publishes, so this service holds no access to any cluster including its
# own. Recovery keeps it because on the day everything else is broken it
# should depend on nothing but the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sluis-sluis-tokenreview
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]

---
# Source: sluis/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sluis-sluis-tokenreview
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sluis-sluis-tokenreview
subjects:
  - kind: ServiceAccount
    name: sluis
    namespace: sluis

---
# Source: sluis/templates/controllers.yaml
# What the controllers in this process may do to the cluster, bound to the
# service's own account (there is one account and one pod). Update, by name,
# the ConfigMaps they report into, and the one Secret people's linked GitHub
# accounts are kept in: each link's token pair rotates every time it is renewed,
# and the renewed pair has to be written back. The service creates those
# objects -- `create` cannot be narrowed to a name -- so this grants no create,
# and in particular no ConfigMap that would read to the service as a workspace
# record. The Secrets with the Apps' keys and the ConfigMaps with the console's
# records are mounted volumes, so no other Secret or ConfigMap is readable, and
# watching them for a change (an install, a Refresh) needs no permission either.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sluis-controllers
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - "sluis-github-status"
      - "sluis-slack-status"
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sluis-github-links"]
    verbs: ["get", "update"]

