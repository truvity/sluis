---
# Source: sluis/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sluis
      app.kubernetes.io/instance: sluis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sluis
        app.kubernetes.io/instance: sluis
      annotations:
        # Configuration and policy are immutable for an instance: each document
        # is read once, at start, so a change to either is a rollout. One
        # checksum per document this process reads: the service document (the
        # controllers' sections are in it) and the policy.
        checksum/config: 8398a8d66999506b45cbcabc4d9b1c2f347f558f7b7e17e005ae6e466abef9af
        checksum/policy: d8fee78c7b9f81d2a4c598c3b432515f29384a0f4a1fe3e4ccda3db4f307843b
    spec:
      serviceAccountName: sluis
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serve
          image: "ghcr.io/truvity/sluis/sluis:0.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: 8080
            - name: health
              containerPort: 7070
          # The whole of the configuration is the service document, `config`
          # rendered as it stands, and the policy document it names. The
          # environment carries only the secrets the document names.
          args:
            - serve
            - --config=/etc/sluis/config.yaml
          volumeMounts:
            # Read once, at start: a subPath is enough, since a change replaces
            # the pod (checksum/*). The policy keeps its directory.
            - name: config
              mountPath: /etc/sluis/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            - name: tmp
              mountPath: /tmp
            
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: sluis-config
        - name: policy
          configMap:
            name: sluis-policy
        # The root filesystem is read-only, and the directory backends
        # want somewhere to write.
        - name: tmp
          emptyDir: {}
        

---
# Source: sluis/templates/backup.yaml
# The backup: `sluis backup run` takes the lease, exports the installation and
# seals it into the archive bucket. A run that finds the lease held, or a module
# under maintenance, says so and exits 0. Forbid by default, because the second
# run would only wait on the lease.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sluis-backup
  labels:
    app.kubernetes.io/name: sluis-backup
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: sluis
spec:
  schedule: "5 1 * * *"
  timeZone: "Europe/Amsterdam"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sluis-backup
            app.kubernetes.io/instance: sluis
            app.kubernetes.io/version: "0.0.0"
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: sluis
          annotations:
            checksum/config: 39b156c2092c7c64435773c4c663a7c899341fdd41bf279b948aa418df6a3624
        spec:
          restartPolicy: Never
          serviceAccountName: sluis-backup
          # The role's credentials are the platform's (Pod Identity, IRSA), which inject
          # their own token; the cluster API token is never used.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: "ghcr.io/truvity/sluis/sluis:0.0.0"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              args:
                - "backup"
                - "run"
                - "--config=/etc/sluis-backup/config.yaml"
              env:
                - name: OTEL_EXPORTER_OTLP_HEADERS
                  valueFrom:
                    secretKeyRef:
                      name: sluis-backup-inputs
                      key: otlp-headers
              volumeMounts:
                - name: config
                  mountPath: /etc/sluis-backup/config.yaml
                  subPath: config.yaml
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                
                - name: audit-token
                  mountPath: /var/run/audit
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
          volumes:
            - name: config
              configMap:
                name: sluis-backup-config
            - name: tmp
              emptyDir: {}
            
            - name: audit-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: "audit"
                      expirationSeconds: 3600
                      path: token

