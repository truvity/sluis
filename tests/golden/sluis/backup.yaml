# Source: sluis/templates/serviceaccount.yaml
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-issuer-recovery
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: sluis/templates/backup-configmap.yaml
# What `sluis backup` and `sluis restore --config` read: `backup.config`, as the
# values give it, with the apiVersion the chart writes. The binary validates it
# against schemas/config/sluis-backup.schema.json at start, and values.schema.json
# holds the values to the same schema before this renders. The restore Job reads
# this very document: its role comes from the command, not from the document.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-backup-config
  labels:
    app.kubernetes.io/name: sluis-backup
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: sluis
data:
  config.yaml: |
    apiVersion: sluis.truvity.github.io/sluis-backup/v1
    audit:
      tokenFile: /var/run/audit/token
      writer: https://audit.example:8443
    backup:
      retention:
        keep: 7
        maxAge: 720h
      target:
        bucket: sluis-archive
        prefix: sluis
        region: eu-west-1
    instance: sluis
    keys:
      adapter: kms
      archive: alias/sluis-archive
    ports:
      blob:
        adapter: s3
        s3:
          bucket: sluis-blobs
          region: eu-west-1
      dynamodb:
        region: eu-west-1
        tables:
          backup: sluis-backup
          cloudflare: sluis-cloudflare
          github: sluis-github
          google: sluis-google
          oidc: sluis-oidc
          slack: sluis-slack
    preset: k8s-aws
    secrets:
      layout: v5
      root: /sluis
      source: ssm

---
# Source: sluis/templates/configmap.yaml
# What `sluis serve --config` reads: `config`, as the values give it, with
# nothing added, renamed or dropped but the apiVersion the chart writes. The
# binary validates it against schemas/config/sluis.schema.json at start, and
# values.schema.json holds the values to the same schema before this renders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-config
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: serve
data:
  config.yaml: |
    apiVersion: sluis.truvity.github.io/sluis/v3
    audit:
      tokenFile: /var/run/audit/token
    inCluster: true
    issuerURL: https://access.example
    lifetimes:
      absolute: 24h
      hold: 4h
      refresh: 12h
      token: 1h
    listen:
      address: :8080
    policy:
      file: /var/run/access-issuer/policy/policy.yaml
    ports:
      blob:
        adapter: s3
        s3:
          bucket: sluis-blobs
          region: eu-west-1
      dynamodb:
        region: eu-west-1
        tables:
          backup: sluis-backup
          cloudflare: sluis-cloudflare
          github: sluis-github
          google: sluis-google
          oidc: sluis-oidc
          slack: sluis-slack
    preset: k8s-aws
    probes:
      address: :7070
    recovery:
      audience: access-issuer-recovery
      enabled: true
      serviceAccount: access-issuer-recovery
    secrets:
      layout: v5
      root: /sluis
      source: ssm
    signingKey:
      activationDelay: 15m
      kmsWrapped:
        keyId: alias/sluis-signing
        region: eu-west-1
        stateSecret: internal/oidc/state-secret
      pollInterval: 30s
    store: kubernetes

