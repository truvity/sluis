  template:
    metadata:
      labels:
        app.kubernetes.io/name: sluis
        app.kubernetes.io/instance: sluis
      annotations:
        # A configuration change is a rollout: the file is read at start.
        checksum/config: 9acd5ee05144b250ffdda2237ddeaa6b6719e90e40be4e4eefaba86ae72dd526
        # A policy change is a rollout: the file is read at start.
        checksum/policy: 8bee7bc36a81deba29b9ff56f3b29ae793ec023e4c72225f85aaa243e5566a92
        # A federated cluster is read once at start. A row added without a
        # rollout is a cluster whose workloads go on being refused, with
        # nothing to see but an error naming the wrong cause.
        checksum/clusters: 137423e4d6623f391e68ab91981ae128f045cfe43ac6764f71b2b7b716fc2983
    spec:
      serviceAccountName: sluis
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serve
          image: "ghcr.io/truvity/sluis/sluis:0.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: 8080
            - name: health
              containerPort: 7070
          # The whole of the configuration is the file: `config`, rendered as it
          # stands. The environment carries only the secrets that file names.
          args:
            - serve
            - --config=/etc/sluis/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/sluis/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: signing-key
              mountPath: /var/run/access-issuer/signing-key
              readOnly: true
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            - name: clusters
              mountPath: /var/run/access-issuer/clusters.yaml
              subPath: clusters.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: sluis-config
        - name: signing-key
          secret:
            secretName: sluis-signing-key
        - name: policy
          configMap:
            name: sluis-policy
        # The root filesystem is read-only, and the directory backends
        # want somewhere to write.
        - name: tmp
          emptyDir: {}
        
        - name: clusters
          configMap:
            name: sluis-clusters

---
# Source: sluis/templates/signing-key.yaml
# The signing key, issued by cert-manager.
#
# The certificate is a by-product: only the key is used. cert-manager is
# here because it generates the key in the cluster, keeps it out of every
# other system, and rotates it on a schedule the platform already
# understands — none of which is true of a key this service minted for
# itself, and the last of which is the reason it does not.
#
# `rotationPolicy: Always` makes a renewal a *new key*, which is the
# point: a renewed certificate over the same key would rotate nothing.
#
# The algorithm decides what the issuer signs with -- RSA signs RS256, and
# P-256, P-384 and P-521 sign ES256, ES384 and ES512 -- and that is what
# the discovery document advertises, so every relying party has to accept
# it. Changing it here rotates the key, so tokens signed with the previous
# one stop verifying once the old public key leaves the JWKS -- which the
# issuer itself now schedules, with no restart of this Deployment needed
# either to notice the new key or to retire the old one; see
# `signingKey.rotation` for the delays that govern it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sluis-signing-key
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  secretName: sluis-signing-key
  commonName: sluis
  duration: "8760h"
  renewBefore: "720h"
  privateKey:
    algorithm: ECDSA
    size: 384
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: "selfsigned"
    kind: "ClusterIssuer"
    group: cert-manager.io
