# Source: sluis/templates/controller-github.yaml
# The controller's own account. It holds two permissions: updating its one
# report, and updating the one Secret people's linked GitHub accounts are
# kept in — each link's token pair rotates every time it is renewed, and
# the renewed pair has to be written back. The Secret with the Apps' keys
# and the ConfigMap with the console's records are mounted volumes, so no
# other Secret or ConfigMap is readable at all, and watching them for a
# change (an install, a Refresh) needs no permission either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sluis-github-roster
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller-github

