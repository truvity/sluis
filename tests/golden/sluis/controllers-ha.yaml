---
# Source: sluis/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
---
# Source: sluis/templates/serviceaccount.yaml
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-issuer-recovery
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: sluis/templates/configmap.yaml
# What `sluis serve --config` reads: `config`, as the values give it, with
# nothing added, renamed or dropped but the apiVersion the chart writes. The
# binary validates it against schemas/config/sluis.schema.json at start, and
# values.schema.json holds the values to the same schema before this renders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-config
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: serve
data:
  config.yaml: |
    apiVersion: sluis.truvity.github.io/sluis/v3
    audit:
      tokenFile: /var/run/audit/token
    controllers:
      github:
        consoleURL: http://sluis.default.svc:8080/console
      slack:
        consoleURL: http://sluis.default.svc:8080/console
    inCluster: true
    issuerURL: https://issuer.example
    lifetimes:
      absolute: 24h
      hold: 4h
      refresh: 12h
      token: 1h
    listen:
      address: :8080
    policy:
      file: /var/run/access-issuer/policy/policy.yaml
    ports:
      adapter: dynamodb
      dynamodb:
        region: eu-west-1
        table: sluis
    probes:
      address: :7070
    recovery:
      audience: access-issuer-recovery
      enabled: true
      serviceAccount: access-issuer-recovery
    secrets:
      root: /var/run/sluis/secrets
      source: file
    signingKey:
      activationDelay: 15m
      file: /var/run/access-issuer/signing-key/tls.key
      pollInterval: 30s
    store: kubernetes

---
# Source: sluis/templates/policy-configmap.yaml
# The policy document (schemas/config/policy.schema.json): what every process
# of this installation decides by, read once at start. Mounted as a directory
# by the service and both controllers, so a change rolls all three.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-policy
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.yaml: |
    apiVersion: sluis.truvity.github.io/policy/v2
    exchange:
      clusters:
      - issuer: https://oidc.eu-example-1.example/id/EXAMPLE
        jwksUri: https://oidc.eu-example-1.example/id/EXAMPLE/keys
        name: example-cluster

---
# Source: sluis/templates/serviceaccount.yaml
# The one cluster-scoped permission this service ever needs, and the one
# thing left that asks the API server anything: creating TokenReviews, so
# that recovery can check a token proving cluster access. It reads
# nothing.
#
# Workloads used to need it too. They do not any more: a
# ServiceAccount token is verified against the key set its own cluster
# publishes, so this service holds no access to any cluster including its
# own. Recovery keeps it because on the day everything else is broken it
# should depend on nothing but the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sluis-default-tokenreview
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
# Source: sluis/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sluis-default-tokenreview
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sluis-default-tokenreview
subjects:
  - kind: ServiceAccount
    name: sluis
    namespace: default
---
# Source: sluis/templates/controllers.yaml
# What the controllers in this process may do to the cluster, bound to the
# service's own account (there is one account and one pod). Update, by name,
# the ConfigMaps they report into, and the one Secret people's linked GitHub
# accounts are kept in: each link's token pair rotates every time it is renewed,
# and the renewed pair has to be written back. The service creates those
# objects -- `create` cannot be narrowed to a name -- so this grants no create,
# and in particular no ConfigMap that would read to the service as a workspace
# record. The Secrets with the Apps' keys and the ConfigMaps with the console's
# records are mounted volumes, so no other Secret or ConfigMap is readable, and
# watching them for a change (an install, a Refresh) needs no permission either.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sluis-controllers
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - "sluis-github-status"
      - "sluis-slack-status"
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sluis-github-links"]
    verbs: ["get", "update"]
---
# Source: sluis/templates/serviceaccount.yaml
# The directory store is plain Kubernetes objects in THIS namespace:
# workspace records (ConfigMaps) and their credentials (Secrets), written
# by this service itself. A namespaced Role and never a ClusterRole —
# which is why this service gets a namespace of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Source: sluis/templates/controllers.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sluis-controllers
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sluis-controllers
subjects:
  - kind: ServiceAccount
    name: sluis
    namespace: default

