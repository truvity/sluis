# Source: sluis/templates/serviceaccount.yaml
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-issuer-recovery
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: sluis/templates/clusters-configmap.yaml
# The clusters whose workloads may exchange a ServiceAccount token for one
# of this issuer's, each verified against the key set that cluster
# publishes for itself.
#
# Nothing here is a secret: a name and two URLs per cluster. That is the
# whole point — the alternative is a kubeconfig per cluster held by the
# service whose design is to hold almost no credential.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-clusters
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  clusters.yaml: |
    clusters:
      - name: "example-cluster"
        issuer: "https://oidc.eu-example-1.example/id/EXAMPLE"
        jwksUri: "https://oidc.eu-example-1.example/id/EXAMPLE/keys"

---
# Source: sluis/templates/configmap.yaml
# What `sluis serve --config` reads: `config`, as the values give it, with
# nothing added, renamed or dropped. The binary validates it against
# schemas/config/serve.schema.json at start, and values.schema.json
# holds the values to the same schema before this renders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-config
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: serve
data:
  config.yaml: |
    audit:
      tokenFile: /var/run/audit/token
    exchange:
      clustersFile: /var/run/access-issuer/clusters.yaml
    inCluster: true
    issuerURL: https://issuer.example
    lifetimes:
      absolute: 24h
      hold: 4h
      refresh: 12h
      token: 1h
    listen:
      address: :8080
    policyDir: /var/run/access-issuer/policy
    probes:
      address: :7070
    recovery:
      audience: access-issuer-recovery
      enabled: true
      serviceAccount: access-issuer-recovery
    signingKey:
      activationDelay: 15m
      file: /var/run/access-issuer/signing-key/tls.key
      pollInterval: 30s
    store: kubernetes

---
# Source: sluis/templates/controller-github.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-github-roster-config
  labels:
