---
# Source: sluis/templates/alerts.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: sluis-alerts
  namespace: default
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: alerts
spec:
  groups:
    - name: access-roster
      interval: 1m
      rules:
        # Zero published keys is an issuer that cannot be verified against: the JWKS is
        # empty, so every relying party refuses every token, and a new one cannot be
        # signed. There is no healthy zero. Five minutes rides out a rollout, in which a
        # new replica has read the key file but not yet published the key. A
        # series that is absent (no issuer running) is not this alert's to say.
        - alert: AccessRosterNoSigningKeyPublished
          expr: >-
            min by (k8s_cluster_name, namespace, algorithm) (access_issuer_signing_keys_published{namespace="sluis"}) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'The access-roster issuer in {{ $labels.namespace }} publishes no {{ $labels.algorithm }} signing key'
            description: >-
              The issuer's key ring holds no key to publish for this algorithm, so its JWKS
              is empty and no relying party can verify a token. Look at the signing key
              Secret the chart mounts (cert-manager's Certificate, or the existing Secret
              named in signingKey.existingSecret) and the issuer's log for why it could not
              be read.
            runbook_url: "https://github.com/truvity/sluis/blob/master/docs/reference/telemetry.md#accessrosternosigningkeypublished"
        # The age of the active key is the time since the first replica saw it become
        # active. With kms-wrapped signing a new key pair is made every `rotateEvery`
        # and the threshold is that plus two hours. cert-manager replaces the certificate `renewBefore` ahead of its end
        # (default 720h before 8760h), so a healthy key is at most about 335 days old and
        # `maxAgeSeconds` allows two weeks more. A key that is older has not been
        # replaced: the Certificate is not renewing, or the issuer is not picking the new
        # key up, and the day the certificate expires every token stops verifying. The
        # newest timestamp across replicas is used, so a lagging replica does not fire it.
        - alert: AccessRosterSigningKeyRotationStalled
          expr: >-
            time() - max by (k8s_cluster_name, namespace, algorithm) (access_issuer_signing_key_active_since_timestamp_seconds{namespace="sluis"}) > 50400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'The {{ $labels.algorithm }} signing key in {{ $labels.namespace }} has been active for {{ $value | humanizeDuration }}'
            description: >-
              The active signing key is older than 50400s
              and has not rotated. With cert-manager keys, check the Certificate for the key
              (kubectl describe certificate), its issuer, and whether the issuer's
              signingKey.pollInterval is reading the mounted file. With kms-wrapped keys,
              check the issuer's log for why it cannot generate or wrap a key pair (the
              pod's AWS role, the KMS key's policy).
            runbook_url: "https://github.com/truvity/sluis/blob/master/docs/reference/telemetry.md#accessrostersigningkeyrotationstalled"
        # The share of the issuer listener's requests answered 5xx over 10 minutes. A
        # healthy issuer answers none: its refusals are 4xx. A floor of `minErrors` in
        # the window keeps one failed request in a quiet hour from being a page, and the
        # share (5% by default) keeps a handful among thousands from being one either.
        # Every route is counted together: the sign-in and the token endpoint failing are
        # the same outage to the people behind them.
        - alert: AccessRosterIssuer5xx
          expr: >-
            (
              sum by (k8s_cluster_name, namespace) (increase(access_issuer_http_requests_total{namespace="sluis",status_class="5xx"}[10m]))
              /
              sum by (k8s_cluster_name, namespace) (increase(access_issuer_http_requests_total{namespace="sluis"}[10m]))
            ) > 0.05
            and
            sum by (k8s_cluster_name, namespace) (increase(access_issuer_http_requests_total{namespace="sluis",status_class="5xx"}[10m])) >= 5
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'The access-roster issuer in {{ $labels.namespace }} answers {{ $value | humanizePercentage }} of requests with a 5xx'
            description: >-
              More than 5% of the requests in the last 10 minutes
              failed on the server side. The dashboard's request panel names the route; the
              issuer's log has the error. A store that is down (see AccessRosterPortErrors)
              and a directory that cannot be reached are the usual causes.
            runbook_url: "https://github.com/truvity/sluis/blob/master/docs/reference/telemetry.md#accessrosterissuer5xx"
        # A token is signed in memory and costs one store write, so the p99 of the token
        # endpoint is milliseconds when healthy. Two seconds is two orders of magnitude
        # over that and still short of the clients' timeouts, which is where a slow
        # issuer starts to look like a down one. Ten minutes of rate smooths a single slow
        # request; the quantile over `le` buckets of every replica together is the one a
        # client sees.
        - alert: AccessRosterTokenEndpointSlow
          expr: >-
            histogram_quantile(0.99, sum by (k8s_cluster_name, namespace, le) (rate(access_issuer_http_request_duration_seconds_bucket{namespace="sluis",route="token"}[10m]))) > 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'The access-roster token endpoint in {{ $labels.namespace }} has a p99 of {{ $value | humanizeDuration }}'
            description: >-
              Token requests are taking longer than 2s at the
              99th percentile. The store (see the port latency panel), the policy's size and
              the directory are what a token waits on.
            runbook_url: "https://github.com/truvity/sluis/blob/master/docs/reference/telemetry.md#accessrostertokenendpointslow"
        # A tick that fails once is a console mid-rollout or GitHub having a moment, and
        # the next pass repairs it. The default interval is 15 minutes, so
        # `failures` (3) failed ticks of ONE target within `window` (45m) is three in a
        # row: the target is not being reconciled and the cause is not going away. The
        # counter is per kind and target, because one organisation failing (its App was
        # uninstalled) is not another's outage.
        - alert: AccessRosterTickFailing
          expr: >-
            sum by (k8s_cluster_name, namespace, kind, target) (increase(access_roster_ticks_total{namespace="sluis",outcome="failed"}[45m])) >= 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: 'The {{ $labels.kind }} of {{ $labels.target }} has failed {{ $value | printf "%.0f" }} times'
            description: >-
              The controller's tick of this target failed 3 or more
              times within 45m. Its report (the controller's page in the
              console, and the log's "a pass over an organisation failed" or the Slack
              equivalent) names the error.
            runbook_url: "https://github.com/truvity/sluis/blob/master/docs/reference/telemetry.md#accessrostertickfailing"
        # The time since a target's last ok tick, from a gauge each ok tick stamps. It
        # catches what a failure counter cannot: a controller that is not running, a
        # lease nobody can take, a loop that hangs. One hour is four default intervals
        # (15m), which tolerates three missed passes; `last_over_time` over a day keeps
        # the series visible after the controller is gone, so a dead controller fires and
        # is not mistaken for an absent one. A target the policy no longer declares fires
        # for at most a day and then leaves.
        - alert: AccessRosterTickStale
          expr: >-
            time() - max by (k8s_cluster_name, namespace, kind, target) (last_over_time(access_roster_tick_last_success_timestamp_seconds{namespace="sluis"}[1d])) > 3600
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'No successful {{ $labels.kind }} of {{ $labels.target }} for {{ $value | humanizeDuration }}'
            description: >-
              This target has not completed a tick for longer than 3600s.
              Check that the controller's Deployment is running, that its leases are not held
              by a runner that is gone (AccessRosterLeaseLost), and the log for the failures.
            runbook_url: "https://github.com/truvity/sluis/blob/master/docs/reference/telemetry.md#accessrostertickstale"
        # A lease is lost when another runner takes it over or when it could not be
        # renewed for a whole lifetime; the tick stops before its next write, which is
        # what the lease is for, so one loss is the design working. Repeated losses are
        # two runners fighting over one target, or a State that cannot be reached to
        # renew. `losses` (3) within `window` (1h) separates that from a node being
        # drained.
        - alert: AccessRosterLeaseLost
          expr: >-
            sum by (k8s_cluster_name, namespace, kind) (increase(access_roster_leases_lost_total{namespace="sluis"}[1h])) >= 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: 'Tick leases of {{ $labels.kind }} in {{ $labels.namespace }} were lost {{ $value | printf "%.0f" }} times'
            description: >-
              Controllers lost their lease on a target 3 or more times
              within 1h. Look for a second runner (a tick Job beside the
              Deployment, a replica count over one on a State that is not shared) and for
              port errors on the State.
            runbook_url: "https://github.com/truvity/sluis/blob/master/docs/reference/telemetry.md#accessrosterleaselost"
        # GitHub's budget left, as last reported on a response. An App's core budget is
        # thousands of requests an hour, and the controller waits out a limit itself, so
        # a low reading is not an outage; sustained is. Under `remaining` (100) for
        # thirty minutes means the budget is being spent as fast as it refills and the
        # next pass will be made to wait or be refused. The reading is of the last
        # response, so a quiet controller keeps its last value: a pass runs every
        # interval, which is what keeps it fresh.
        - alert: AccessRosterGitHubRateLimitLow
          expr: >-
            min by (k8s_cluster_name, namespace, resource) (github_roster_rate_limit_remaining{namespace="sluis"}) < 100
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'GitHub rate limit ({{ $labels.resource }}) is down to {{ $value | printf "%.0f" }} requests'
            description: >-
              The GitHub budget for this resource has been under 100
              requests for 30m. github_roster_rate_limited_total says how
              often a call already waited. Lengthen the controller's interval, or look for
              a caller spending the App's budget outside this controller.
            runbook_url: "https://github.com/truvity/sluis/blob/master/docs/reference/telemetry.md#accessrostergithubratelimitlow"
        # The invitations the last pass could not send for want of a free seat. There is
        # no healthy non-zero: each is a person the policy admits who cannot be invited
        # until the organisation buys a seat or removes one. Not a page (the controller is
        # well), but it does not clear on its own, so thirty minutes only keeps a seat
        # that frees up between two passes from alerting.
        - alert: AccessRosterSeatsShort
          expr: >-
            max by (k8s_cluster_name, namespace, org) (github_roster_seats_short{namespace="sluis"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'GitHub organisation {{ $labels.org }} is {{ $value | printf "%.0f" }} seat(s) short'
            description: >-
              The controller could not invite everyone the policy admits to this organisation
              because it has no free seats. Buy seats, or remove members that no longer
              belong, and the next pass sends the invitations.
            runbook_url: "https://github.com/truvity/sluis/blob/master/docs/reference/telemetry.md#accessrosterseatsshort"
        # The share of storage port calls (state, index, blob) that ended `unavailable`
        # or `error` over five minutes. A lost compare-and-swap (`conflict`), a create
        # over a live key (`exists`) and a missing key (`not_found`) are the ports
        # working and are not counted. A healthy store fails none; the sign-in path
        # refuses a request when it is down, so this is the alert that explains the 5xx.
        # `minErrors` keeps a single failed call from being a page.
        - alert: AccessRosterPortErrors
          expr: >-
            (
              sum by (k8s_cluster_name, namespace, port) (increase(access_roster_port_operation_duration_seconds_count{namespace="sluis",outcome=~"unavailable|error"}[5m]))
              /
              sum by (k8s_cluster_name, namespace, port) (increase(access_roster_port_operation_duration_seconds_count{namespace="sluis"}[5m]))
            ) > 0.05
            and
            sum by (k8s_cluster_name, namespace, port) (increase(access_roster_port_operation_duration_seconds_count{namespace="sluis",outcome=~"unavailable|error"}[5m])) >= 5
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'The {{ $labels.port }} store of access-roster in {{ $labels.namespace }} is failing {{ $value | humanizePercentage }} of calls'
            description: >-
              More than 5% of the calls to this storage port failed in the
              last 5 minutes. State and index are Valkey (or the namespace's ConfigMaps and
              Secrets); blobs are the reports' ConfigMaps. Check that store's own health and
              the NetworkPolicy to it.
            runbook_url: "https://github.com/truvity/sluis/blob/master/docs/reference/telemetry.md#accessrosterporterrors"
