---
# Source: sluis/templates/serviceaccount.yaml
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-issuer-recovery
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: sluis/templates/modules.yaml
# The issuer module's document, read once at start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-issuer-config
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: issuer
data:
  config.yaml: |
    apiVersion: sluis.truvity.github.io/sluis/v3
    audit:
      tokenFile: /var/run/audit/token
    github:
      remote:
        audience: github
        tokenFile: /var/run/secrets/sluis/github/token
        url: http://access-issuer-github.default.svc:8081
    inCluster: true
    issuerURL: https://issuer.example
    lifetimes:
      absolute: 24h
      hold: 4h
      refresh: 12h
      token: 1h
    listen:
      address: :8080
    policy:
      file: /var/run/access-issuer/policy/policy.yaml
    probes:
      address: :7070
    recovery:
      audience: access-issuer-recovery
      enabled: true
      serviceAccount: access-issuer-recovery
    release: access-issuer
    secrets:
      root: /var/run/sluis/secrets
      source: file
    signingKey:
      activationDelay: 15m
      file: /var/run/access-issuer/signing-key/tls.key
      pollInterval: 30s
    store: kubernetes

