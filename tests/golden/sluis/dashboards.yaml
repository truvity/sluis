apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: sluis-sluis-overview
  namespace: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: dashboards
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  allowCrossNamespaceImport: true
  folderUID: "prod-sluis"
  instanceSelector:
    matchLabels:
      observability.truvity.io/grafana: shared
  json: |
    {
      "annotations": {
        "list": []
      },
      "description": "The token service and its controllers: the issuer's requests, errors and latency, tokens and sign-ins, signing keys, the controllers' ticks and leases, the storage ports, and GitHub rate limits and seats.",
      "editable": false,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Is it healthy?",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Keys in the JWKS, the lowest across algorithms and replicas. Healthy is at least one. Zero is an issuer nobody can verify a token against: see SluisNoSigningKeyPublished in the telemetry runbook.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [],
              "noValue": "no data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "min(sluis_signing_keys_published{k8s_cluster_name=~\"$cluster\",namespace=~\"$namespace\"})",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Signing keys published",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "The share of the issuer's requests answered 5xx. Healthy is zero: its refusals are 4xx. The request panels below name the route.",
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "mappings": [],
              "noValue": "no data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.0001
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(increase(sluis_http_requests_total{k8s_cluster_name=~\"$cluster\",namespace=~\"$namespace\",status_class=\"5xx\"}[1h])) / sum(increase(sluis_http_requests_total{k8s_cluster_name=~\"$cluster\",namespace=~\"$namespace\"}[1h]))",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "5xx share (1h)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Sign-ins that did not complete. A few are people closing a tab; a climb in one reason is the signal. The reasons are in the sign-in panel below.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [],
              "noValue": "no data",
