              "expr": "sum(increase(sluis_login_failures_total{k8s_cluster_name=~\"$cluster\",namespace=~\"$namespace\"}[1h]))",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Sign-in failures (1h)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "A spent authorization code or refresh token presented again. A code reuse also ends the session it opened. A refresh token outside the grace window is spent or unknown (the two are not told apart). A burst is a client bug or a stolen credential.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [],
              "noValue": "no data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 20
