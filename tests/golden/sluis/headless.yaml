# Source: sluis/templates/policy-configmap.yaml
# The policy document (schemas/config/policy.schema.json): what every process
# of this installation decides by, read once at start. Mounted as a directory
# by the service and both controllers, so a change rolls all three.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-policy
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.yaml: |
    apiVersion: sluis.truvity.github.io/policy/v2

