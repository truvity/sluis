---
# Source: sluis/templates/modules.yaml
# Voluntary disruptions (a node drain) may take down only as many of the
# issuer module's pods as this allows.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sluis-issuer
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: issuer
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sluis
      app.kubernetes.io/instance: sluis
      app.kubernetes.io/component: issuer

---
# Source: sluis/templates/modules.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sluis-issuer
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: issuer

---
# Source: sluis/templates/modules.yaml
# The issuer module's document, read once at start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-issuer-config
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: issuer
data:
  config.yaml: |
    apiVersion: sluis.truvity.github.io/sluis/v3
    audit:
      tokenFile: /var/run/audit/token
    inCluster: false
    issuerURL: https://issuer.example
    lifetimes:
      absolute: 24h
      hold: 4h
      refresh: 12h
      token: 1h
    listen:
      address: :8080
    policy:
      file: /var/run/access-issuer/policy/policy.yaml
    probes:
      address: :7070
    recovery:
      audience: access-issuer-recovery
      enabled: false
      serviceAccount: access-issuer-recovery
    secrets:
      root: /var/run/sluis/secrets
      source: file
    signingKey:
      activationDelay: 15m
      file: /var/run/access-issuer/signing-key/tls.key
      pollInterval: 30s
    store: memory

---
# Source: sluis/templates/policy-configmap.yaml
# The policy document (schemas/config/policy.schema.json): what every process
# of this installation decides by, read once at start. Mounted as a directory
# by the service and both controllers, so a change rolls all three.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-policy
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.yaml: |
    apiVersion: sluis.truvity.github.io/policy/v2

---
# Source: sluis/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/component: issuer
  ports:
    - name: issuer
      port: 8080
      targetPort: issuer

---
# Source: sluis/templates/modules.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sluis-issuer
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: issuer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sluis
      app.kubernetes.io/instance: sluis
      app.kubernetes.io/component: issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sluis
        app.kubernetes.io/instance: sluis
        app.kubernetes.io/component: issuer
      annotations:
        # Each document is read once, at start: a change to it, or to the
        # policy, is a rollout.
        checksum/config: 0e86d0834eaab9e7e16398bed44f342c41b2367c221b68eacf33d0a7bdcaffb8
        checksum/policy: d8fee78c7b9f81d2a4c598c3b432515f29384a0f4a1fe3e4ccda3db4f307843b
    spec:
      serviceAccountName: sluis-issuer
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: issuer
          image: "ghcr.io/truvity/sluis/sluis:0.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: 8080
            - name: health
              containerPort: 7070
          args:
            - issuer
            - --config=/etc/sluis/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/sluis/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            - name: tmp
              mountPath: /tmp
            
            - name: signing-key
              mountPath: /var/run/access-issuer/signing-key
              readOnly: true
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: sluis-issuer-config
        - name: policy
          configMap:
            name: sluis-policy
        - name: tmp
          emptyDir: {}
        
        - name: signing-key
          secret:
            secretName: delivered-signing-key

---
# Source: sluis/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  gatewayClassName: "internal"
  listeners:
    - name: issuer
      protocol: HTTPS
      port: 443
      hostname: "issuer.example"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: sluis-tls

---
# Source: sluis/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: sluis
      sectionName: issuer
  hostnames:
    - "issuer.example"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sluis
          port: 8080
          weight: 1
