apiVersion: v1
kind: ServiceAccount
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: sluis/templates/configmap.yaml
# What `sluis serve --config` reads: `config`, as the values give it, with
# nothing added, renamed or dropped but the apiVersion the chart writes. The
# binary validates it against schemas/config/serve.schema.json at start, and
# values.schema.json holds the values to the same schema before this renders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sluis-config
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: serve
data:
  config.yaml: |
    apiVersion: sluis.truvity.github.io/serve/v2
    audit:
      tokenFile: /var/run/audit/token
    inCluster: false
    issuerURL: https://issuer.example
    lifetimes:
      absolute: 24h
      hold: 4h
      refresh: 12h
      token: 1h
    listen:
      address: :8080
    policy:
      file: /var/run/access-issuer/policy/policy.yaml
    probes:
      address: :7070
    recovery:
      audience: access-issuer-recovery
      enabled: false
      serviceAccount: access-issuer-recovery
    secrets:
      root: /var/run/sluis/secrets
      source: file
    signingKey:
      activationDelay: 15m
      file: /var/run/access-issuer/signing-key/tls.key
      pollInterval: 30s
    store: memory

