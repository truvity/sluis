# Source: sluis/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  gatewayClassName: "internal"
  listeners:
    - name: issuer
      protocol: HTTPS
      port: 443
      hostname: "issuer.example"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: sluis-tls

---
# Source: sluis/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sluis
  labels:
    app.kubernetes.io/name: sluis
    app.kubernetes.io/instance: sluis
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: sluis
      sectionName: issuer
  hostnames:
    - "issuer.example"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sluis
          port: 8080
          weight: 1
