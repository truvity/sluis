# Source: audit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-deployment
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  # The document a config names as `deployment`: which framework profiles each profile is
  # composed from, and where its copies land. Every component that reads
  # profiles reads this one, because retention is a property of the profile and
  # every one of them needs to agree about it.
  deployment.yaml: |
    apiVersion: audit.truvity.github.io/audit-deployment/v2
    external_identifiers_are_opaque: true
    profiles:
      security:
        frameworks:
        - security
    presets:
      standard:
        bucket: audit-eu-example-1
        key_alias: alias/audit-archive
        prefix: audit/
        region: eu-example-1

---
# Source: audit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-writer-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: writer
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    anonymousWrites: true
    apiVersion: audit.truvity.github.io/audit-writer/v2
    database:
      passwordSecret: AUDIT_DATABASE_PASSWORD
      url: postgres://audit_writer@postgres.postgres.svc:5432/audit?sslmode=require
    deployment: /etc/audit/deployment.yaml
    replicas: 3
    stream:
      consumer: audit-writer
      name: AUDIT
      nats:
        url: nats://nats.nats.svc:4222

