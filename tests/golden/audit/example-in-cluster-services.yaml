# Source: audit/templates/serviceaccount.yaml
# The indexer reads the archive and writes the index. It holds the index's
# write credential, which the writer must not, and reads what the writer wrote
# without being able to write it: a different identity from either. Pod
# Identity or IRSA binds here, with get and list on the archive and nothing more.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-observe
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/serviceaccount.yaml
# Sealing is a different privilege from writing: whoever can write the archive
# and can also sign for it can choose what to sign. This identity reads the
# records, puts seals and keys/roots.jwks, and uses the seal key; the writer's
# role has no use of that key, and this one has no write to records/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-notary
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/serviceaccount.yaml
# Verification needs to read the archive and nothing else. An auditor running
# the same command must get the same answer, which is what makes the answer
# worth having.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-verify
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/serviceaccount.yaml
# The front door publishes and nothing more. It must not hold the archive's
# write identity: a receiver that shares the writer's service account would
# reach the bucket through whatever Pod Identity or IRSA role that binds.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-receiver
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

