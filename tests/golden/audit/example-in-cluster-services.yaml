# Source: audit/templates/migrate.yaml
# The identity this Job runs as, created as a hook of its own so that it
# exists before the Job that names it. A pre-install hook runs BEFORE the
# release's ordinary resources, so a hook Pod cannot name a ServiceAccount
# the release has not created yet: the Job would be admitted and then never
# get a Pod, with "serviceaccount not found" on the Job and a release that
# waits for a hook that can never run. The same is true of its configuration.
#
# It is the migration's own, not the writer's, and it carries no cloud
# annotations. This Job talks to Postgres; it has no business holding the
# credentials that write the archive. A lower weight than the Job so it is
# applied first.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-migrate
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

---
# Source: audit/templates/migrate.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-migrate-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    apiVersion: audit.truvity.github.io/audit-migrate/v2
    database:
      passwordSecret: AUDIT_DATABASE_PASSWORD
      url: postgres://audit_owner@postgres.postgres.svc:5432/audit?sslmode=require
    observe: audit_observe
    reader: audit_query
    writer: audit_writer

---
# Source: audit/templates/migrate.yaml
# The index schema, applied before the writer rolls.
#
# A hook rather than something the writer does at start-up: several replicas
# migrating at once is a race, and a schema change to the index should be a step
# an operator can see happen. The writer refuses to start against a version it
# does not know, so this Job failing stops the release rather than producing a
# writer that will not run.
apiVersion: batch/v1
kind: Job
metadata:
  name: audit-migrate
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
    spec:
      restartPolicy: Never
      serviceAccountName: audit-migrate
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/truvity/audit/audit:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - migrate
            - --config=/etc/audit/config.yaml
          env:
            
            - name: AUDIT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-owner-database
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/audit/config.yaml
              subPath: config.yaml
              readOnly: true
            
            
      volumes:
        - name: config
          configMap:
            name: audit-migrate-config
        
        

