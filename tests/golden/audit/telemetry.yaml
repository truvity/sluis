---
# Source: audit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-deployment
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  # The document a config names as `deployment`: which framework profiles each profile is
  # composed from, and where its copies land. Every component that reads
  # profiles reads this one, because retention is a property of the profile and
  # every one of them needs to agree about it.
  deployment.yaml: |
    apiVersion: audit.truvity.github.io/audit-deployment/v2
    external_identifiers_are_opaque: false
    profiles:
      billing-nl:
        frameworks:
        - billing-nl
      history:
        frameworks:
        - history
      security:
        frameworks:
        - security
    presets:
      operational:
        bucket: audit-archive
        prefix: operational/
        region: eu-example-1
      standard:
        bucket: audit-archive
        key_alias: alias/audit
        prefix: standard/
        region: eu-example-1
  # The document a writer's config names as `workloads`: the issuers trusted to
  # name a calling workload, and the source each speaks for.
  workloads.yaml: |
    issuers:
      - url: "https://oidc.example.com/id/CLUSTER"
        audience: "audit"
    workloads:
      - source: wallet
        subject: system:serviceaccount:wallet:wallet-api

---
# Source: audit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-writer-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: writer
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    apiVersion: audit.truvity.github.io/audit-writer/v2
    archive:
      kmsKey: alias/audit
    database:
      passwordSecret: AUDIT_DATABASE_PASSWORD
      url: postgres://audit_writer@db.example.test:5432/audit?sslmode=verify-full
    deployment: /etc/audit/deployment.yaml
    keys:
      adapter: local
      instance: audit
      pseudonym: audit-pseudonym
      rootFile: /etc/audit/keys/root
    replicas: 3
    stream:
      consumer: audit-writer
      name: AUDIT
      nats:
        tokenFile: /var/run/audit/stream/token
        url: nats://nats.audit.svc:4222
    workloads: /etc/audit/workloads.yaml

