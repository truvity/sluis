---
# Source: audit/templates/networkpolicy.yaml
# The writer is the single trusted consumer of the stream and the only thing
# that puts to the bucket. Saying so here is what keeps a second writer from
# appearing quietly: a deployment that can run one anyway is a deployment whose
# seals vouch for an hour that something else was still writing into.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
      app.kubernetes.io/component: writer
  policyTypes: [Ingress]
  ingress:
    - from:
        # This release's own pods: the jobs and the query service record
        # themselves through the writer.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: audit
              app.kubernetes.io/instance: audit
      ports:
        - protocol: TCP
          port: 8080

