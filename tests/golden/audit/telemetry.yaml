kind: ConfigMap
metadata:
  name: audit-migrate-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    apiVersion: audit.truvity.github.io/audit-migrate/v2
    database:
      passwordSecret: AUDIT_DATABASE_PASSWORD
      url: postgres://audit_owner@db.example.test:5432/audit?sslmode=verify-full
    observe: audit_observe
    purge: audit_purge
    reader: audit_query
    writer: audit_writer

