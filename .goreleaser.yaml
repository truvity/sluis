    builder: go
    main: ./actors/adapter-upstream-oidc
    binary: adapter-upstream-oidc
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/truvity/sluis/v2/kits/go/version.Version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: actor-entry
    builder: rust
