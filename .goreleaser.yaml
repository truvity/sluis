# Release: two images (sluis and the resource-proxy sidecar) and
# their binaries, from one tag.
#
# The tag is the sole version authority. The chart's own version field is
# a placeholder the release workflow stamps, and this file stamps the
# same tag into the binaries, so a console, an image label and a chart
# never disagree about which build is running.
project_name: sluis

version: 2

# The console is BUILT here, not committed. `frontend/dist` is embedded
# by the Go binary, and goreleaser runs `go build` directly rather than
# through the Justfile, so without this the release would compile
# against whatever happened to be on disk -- or fail outright on a clean
# checkout with `pattern all:dist: no matching files found`, which is
# the honest failure and still not one to discover at release time.
before:
  hooks:
    # `just console`, NOT the npm commands written out again. The console
    # imports @truvity/sluis as file:../ts and resolves it
    # through ts/dist, so ts has to be built first -- an ordering the
    # Justfile already declares. Restating it here got it wrong on the
    # first release after the bundles left git: the hook built the
    # console against a package that was not there yet, and goreleaser
    # failed on `Cannot find module '@truvity/sluis'`.
    #
    # One definition of the order, in the place that already had it.
    - just console

builds:
  # One binary: `serve` is the service (issuer, console and hub, with the
  # GitHub and Slack controllers in-process since v1.63), and `migrate` is
  # 0031's State copy. One image, one archive entry, one
  # version: a service and a controller from two releases cannot run
  # together by accident.
  - id: sluis
    main: ./cmd/sluis
    binary: sluis
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}}

  # The resource-server sidecar: verifies a sluis token in front
  # of a service that knows nothing about sluis, and gives that
  # service an identity of its own for what it calls. Its own image,
  # because it runs beside somebody else's container and not in a pod
  # of ours.
  - id: resource-proxy
    main: ./cmd/resource-proxy
    binary: resource-proxy
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}}

  # Not an image either, and for a stronger reason than the one below:
  # this opens a browser and writes into somebody's own kubeconfig and
  # AWS configuration. A container would have neither.
  #
  # Windows is built because a laptop is a laptop. The credential
  # helpers are what the AWS SDKs and kubectl run, and both exist there.
  - id: sluisctl
    main: ./cmd/sluisctl
    binary: sluisctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}}

  # The old name of the CLI, for one or two releases after the rename. The
  # SAME program as sluisctl, built under its old name: the binary looks at
  # the name it was started as and says on stderr that the name is
  # deprecated (cmd/sluisctl/main.go). It is its own archive, accessctl_*,
  # so that a download URL, a devbox package and a Nix flake that name it
  # keep resolving while they are moved to sluisctl_*.
  - id: accessctl
    main: ./cmd/sluisctl
    binary: accessctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}}

  # Not an image: it is run by a person against a cluster they chose, and
  # a container that needs a kubeconfig and a namespace argument is a
  # worse way to hand somebody a command than a binary is.
  - id: acceptance
    main: ./cmd/acceptance
    binary: sluis-acceptance
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}}

  # sluis as AWS Lambda functions: ONE arm64 binary, deployed as three functions
  # (http, github, slack) whose role is the SLUIS_ROLE variable. The runtime is
  # provided.al2023, which runs the file named `bootstrap` at the zip's root, so
  # that is the binary's name. arm64 only: the functions are Graviton.
  #
  # `lambda` leaves the Kubernetes, NATS and Valkey storage out of the binary
  # (internal/store/store_lambda.go; cmd/sluis-lambda/imports_test.go holds the
  # line), and `lambda.norpc` is aws-lambda-go's own tag for a runtime that is
  # not the old Go one. The console is embedded, so `just console` above has
  # built it. The telemetry layer is truvity/observability's otlp-lambda, never
  # ours.
  - id: sluis-lambda
    main: ./cmd/sluis-lambda
    binary: bootstrap
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [arm64]
    flags: [-trimpath]
    tags: [lambda, lambda.norpc]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}}

archives:
  # TWO archives, because sluisctl is the only thing built for Windows.
  # In one archive that makes the Windows download hold a single binary
  # where every other holds four, and goreleaser refuses the mix rather
  # than publishing a set that is different depending on the platform.
  # It is also the download somebody actually wants on their own laptop,
  # so it is better on its own with a name that says what it is.
  - id: sluisctl
    ids: [sluisctl]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "sluisctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # The deprecated alias, alone, under the name it always had.
  - id: accessctl
    ids: [accessctl]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "accessctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # The service and the acceptance runner: what an operator pulls to run
  # a build outside a container.
  - id: binaries
    ids: [sluis, resource-proxy, acceptance]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # The Lambda zip the three functions are deployed from, with `bootstrap` at
  # its root. The deploy tooling ADDS the estate's configuration files to it
  # (config/sluis.yaml and the catalogues), so that a change to them is a new
  # deployment: this archive holds nothing of the estate's.
  - id: lambda
    ids: [sluis-lambda]
    formats: [zip]
    wrap_in_directory: false
    # Nothing but the binary: the zip root IS /var/task, and a README or
    # LICENSE there is clutter in a function's code.
    files: ["none*"]
    name_template: "sluis-lambda_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # The two documents' contracts, as release assets of their own. Meta
  # archives: no binary in them, so they are one file per release and not one
  # per platform, and they are checksummed with the rest (checksums.txt).
  #
  # The schemas of the documents an installation writes (the service, policy
  # and, when it exists, installation documents): schemas/config/*.schema.json,
  # flat. TestReleaseBundlesAreComplete holds the glob to the schema list.
  - id: config-schemas
    meta: true
    formats: [tar.gz]
    name_template: "sluis-config-schemas_{{ .Version }}"
    files:
      - src: schemas/config/*.schema.json
        strip_parent: true

  # What the audit installation needs to accept sluis's events: the
  # catalogue and EVERY schema it references, side by side. The audit writer
  # refuses to start when a schema the catalogue names is missing (hive's was
  # down for a day on exactly that), so the test holds this glob to the
  # catalogue: nothing missing, nothing extra.
  - id: audit-catalogue
    meta: true
    formats: [tar.gz]
    name_template: "sluis-audit-catalogue_{{ .Version }}"
    files:
      - src: internal/audit/catalogue/roster.yaml
        strip_parent: true
      - src: internal/audit/catalogue/*.json
        strip_parent: true

checksum:
  name_template: checksums.txt
  # Every archive above, the two bundles included.
  algorithm: sha256

kos:
  # base_import_paths appends the cmd directory's basename, so with the
  # caller's ko-docker-repo ghcr.io/truvity/sluis the published
  # slug nests as sluis/sluis.
  #
  # One image for the whole product: the service and both controllers are
  # subcommands of the one binary, and the chart runs each with its own
  # arguments. (access-issuer, github-roster and slack-roster were three
  # images until 0032; they are no longer published.)
  - id: sluis
    build: sluis
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    bare: true
    preserve_import_paths: false
    base_import_paths: true
    base_image: gcr.io/distroless/static:nonroot
    sbom: none
    labels:
      org.opencontainers.image.title: sluis
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/sluis

  # The resource-server sidecar's image. No chart of ours renders it: a
  # consumer's chart names it beside the stock container it fronts, pinned
  # by digest.
  - id: resource-proxy
    build: resource-proxy
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    bare: true
    preserve_import_paths: false
    base_import_paths: true
    base_image: gcr.io/distroless/static:nonroot
    sbom: none
    labels:
      org.opencontainers.image.title: resource-proxy
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/sluis

release:
  github:
    owner: truvity
    name: sluis
  # vX.Y.Z-rc.N is a pre-release on GitHub (never "Latest"); the pulumi-tag
  # job and the gates run on it exactly as on a release.
  prerelease: auto
  header: |
    ## sluis {{ .Tag }}

    | | |
    |---|---|
    | Image | `ghcr.io/truvity/sluis/sluis:{{ .Version }}` |
    | Sidecar image | `ghcr.io/truvity/sluis/resource-proxy:{{ .Version }}` |
    | Chart | `oci://ghcr.io/truvity/charts/sluis:{{ .Version }}` |
    | TypeScript | `@truvity/sluis@{{ .Version }}` on GitHub Packages |
    | Go | `go get github.com/truvity/sluis@{{ .Tag }}` |

    The TypeScript package is published to GitHub Packages at this
    version; installing it needs a token that can read packages
    (`docs/reference/typescript.md`). The Go module at
    this tag is the policy engine, `identity` and `tokens`; `authz` and
    `directory` are not built yet, and `docs/reference/go-module.md` says
    so.

    The Lambda zip `sluis-lambda_{{ .Version }}_linux_arm64.zip` holds `bootstrap`, the one
    binary the issuer and both controllers run as on AWS Lambda
    (`docs/reference/lambda.md`). The telemetry layer is
    `otlp-lambda-layer_<version>_linux_<arch>.zip` from `truvity/observability`;
    sluis ships none.

    `sluisctl` is its own archive, because it is the one thing here that
    runs on somebody's own laptop. `accessctl_*` is the same program under
    its old name, for one or two more releases: it says on stderr that the
    name is deprecated, and does everything `sluisctl` does.

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
