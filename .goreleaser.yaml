# Release: images (sluis, one per module for Kubernetes, and the
# resource-proxy sidecar) and their binaries, from one tag.
#
# The tag is the sole version authority. The chart's own version field is
# a placeholder the release workflow stamps, and this file stamps the
# same tag into the binaries, so a console, an image label and a chart
# never disagree about which build is running.
project_name: sluis

version: 2

# A release tags every Go module of the repository at the same commit
# (storage/vX.Y.Z, deploy/pulumi/vX.Y.Z, audit/vX.Y.Z, ...). Only the root
# `vX.Y.Z` is the version: a module tag must never be picked as it (an
# annotated `sdk/v0.7.0` once was, and ko refused it as an image tag).
git:
  ignore_tags:
    - "*/*"

# The console is BUILT here, not committed. `frontend/dist` is embedded
# by the Go binary, and goreleaser runs `go build` directly rather than
# through the Justfile, so without this the release would compile
# against whatever happened to be on disk -- or fail outright on a clean
# checkout with `pattern all:dist: no matching files found`, which is
# the honest failure and still not one to discover at release time.
before:
  hooks:
    # `just console`, NOT the npm commands written out again. The console
    # imports @truvity/sluis as file:../ts and resolves it
    # through ts/dist, so ts has to be built first -- an ordering the
    # Justfile already declares. Restating it here got it wrong on the
    # first release after the bundles left git: the hook built the
    # console against a package that was not there yet, and goreleaser
    # failed on `Cannot find module '@truvity/sluis'`.
    #
    # One definition of the order, in the place that already had it.
    - just console

builds:
  # One binary: `serve` is the service (issuer, console and hub, with the
  # GitHub and Slack controllers in-process since v1.63), and `migrate` is
  # 0031's State copy. One image, one archive entry, one
  # version: a service and a controller from two releases cannot run
  # together by accident.
  - id: sluis
    main: ./cmd/sluis
    binary: sluis
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}}

  # The resource-server sidecar: verifies a sluis token in front
  # of a service that knows nothing about sluis, and gives that
  # service an identity of its own for what it calls. Its own image,
  # because it runs beside somebody else's container and not in a pod
  # of ours.
  - id: resource-proxy
    main: ./cmd/resource-proxy
    binary: resource-proxy
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}}

  # Not an image either, and for a stronger reason than the one below:
  # this opens a browser and writes into somebody's own kubeconfig and
  # AWS configuration. A container would have neither.
  #
  # Windows is built because a laptop is a laptop. The credential
  # helpers are what the AWS SDKs and kubectl run, and both exist there.
  - id: sluisctl
    main: ./cmd/sluisctl
    binary: sluisctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}}

  # The old name of the CLI, for one or two releases after the rename. The
  # SAME program as sluisctl, built under its old name: the binary looks at
  # the name it was started as and says on stderr that the name is
  # deprecated (cmd/sluisctl/main.go). It is its own archive, accessctl_*,
  # so that a download URL, a devbox package and a Nix flake that name it
  # keep resolving while they are moved to sluisctl_*.
  - id: accessctl
    main: ./cmd/sluisctl
    binary: accessctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}}

  # Not an image: it is run by a person against a cluster they chose, and
  # a container that needs a kubeconfig and a namespace argument is a
  # worse way to hand somebody a command than a binary is.
  - id: acceptance
    main: ./cmd/acceptance
    binary: sluis-acceptance
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}}

  # The per-module Lambda zips (docs/decisions/0072): one arm64 `bootstrap` per
  # module that has an entry point of its own, each built with its module name
  # pinned (`-X .../internal/version.Module=sluis-module=<name>`), so a zip refuses to start as
  # another module and a document that is another module's. The providers (github,
  # slack, google) run inside the issuer's process until each is released as a
  # zip of its own, one per release from v1.76; they are added here as they exist.
  # `sluis-backup` is deployed twice, as the backup function and as the restore
  # function (`backup.role: restore`). There is no signer zip: the signer runs in
  # `sluis-issuer`. The module list is held by internal/releasecheck.
  - id: sluis-issuer
    main: ./cmd/sluis-issuer
    binary: bootstrap
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [arm64]
    flags: [-trimpath]
    tags: [lambda, lambda.norpc]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}} -X github.com/truvity/sluis/internal/version.Module=sluis-module=issuer

  - id: sluis-cloudflare
    main: ./cmd/sluis-cloudflare
    binary: bootstrap
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [arm64]
    flags: [-trimpath]
    tags: [lambda, lambda.norpc]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}} -X github.com/truvity/sluis/internal/version.Module=sluis-module=cloudflare

  - id: sluis-backup
    main: ./cmd/sluis-backup
    binary: bootstrap
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [arm64]
    flags: [-trimpath]
    tags: [lambda, lambda.norpc]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}} -X github.com/truvity/sluis/internal/version.Module=sluis-module=backup

archives:
  # TWO archives, because sluisctl is the only thing built for Windows.
  # In one archive that makes the Windows download hold a single binary
  # where every other holds four, and goreleaser refuses the mix rather
  # than publishing a set that is different depending on the platform.
  # It is also the download somebody actually wants on their own laptop,
  # so it is better on its own with a name that says what it is.
  - id: sluisctl
    ids: [sluisctl]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "sluisctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # The deprecated alias, alone, under the name it always had.
  - id: accessctl
    ids: [accessctl]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "accessctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # The service and the acceptance runner: what an operator pulls to run
  # a build outside a container.
  - id: binaries
    ids: [sluis, resource-proxy, acceptance]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # The per-module Lambda zips, each with `bootstrap` at its root and nothing
  # else. The deploy tooling ADDS the estate's configuration files to a zip
  # (config/sluis.yaml and the catalogues), so that a change to them is a new
  # deployment: this archive holds nothing of the estate's. The zip root IS
  # /var/task, so a README or LICENSE there would be clutter. An estate pins one
  # digest per zip. There is no all-in-one `sluis-lambda` zip since 1.75.
  - id: lambda-issuer
    ids: [sluis-issuer]
    formats: [zip]
    wrap_in_directory: false
    files: ["none*"]
    name_template: "sluis-issuer_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: lambda-cloudflare
    ids: [sluis-cloudflare]
    formats: [zip]
    wrap_in_directory: false
    files: ["none*"]
    name_template: "sluis-cloudflare_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: lambda-backup
    ids: [sluis-backup]
    formats: [zip]
    wrap_in_directory: false
    files: ["none*"]
    name_template: "sluis-backup_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # The two documents' contracts, as release assets of their own. Meta
  # archives: no binary in them, so they are one file per release and not one
  # per platform, and they are checksummed with the rest (checksums.txt).
  #
  # The schemas of the documents an installation writes (the service, policy
  # and, when it exists, installation documents): schemas/config/*.schema.json,
  # flat. TestReleaseBundlesAreComplete holds the glob to the schema list.
  - id: config-schemas
    meta: true
    formats: [tar.gz]
    name_template: "sluis-config-schemas_{{ .Version }}"
    files:
      - src: schemas/config/*.schema.json
        strip_parent: true

  # What the audit installation needs to accept sluis's events: the
  # catalogue and EVERY schema it references, side by side. The audit writer
  # refuses to start when a schema the catalogue names is missing (an installation's was
  # down for a day on exactly that), so the test holds this glob to the
  # catalogue: nothing missing, nothing extra.
  - id: audit-catalogue
    meta: true
    formats: [tar.gz]
    name_template: "sluis-audit-catalogue_{{ .Version }}"
    files:
      - src: internal/audit/catalogue/roster.yaml
        strip_parent: true
      - src: internal/audit/catalogue/*.json
        strip_parent: true

checksum:
  name_template: checksums.txt
  # Every archive above, the two bundles included.
  algorithm: sha256

# A software bill of materials for every archive (the Lambda zips, the
# binaries, the two bundles), SPDX JSON, by syft (devbox). Each is a release
# asset beside its archive and is checksummed with it; the release workflow's
# `attest` job binds it to the archive with `actions/attest-sbom`. The images'
# SBOMs are attestations on the image digest, not a separate tag (the kos
# below turn ko's own `sbom` off for that reason).
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.sbom.spdx.json"
    cmd: syft
    args: ["${artifact}", "--output", "spdx-json=${document}"]

kos:
  # base_import_paths appends the cmd directory's basename, so with the
  # caller's ko-docker-repo ghcr.io/truvity/sluis the published
  # slug nests as sluis/sluis.
  #
  # One image for the whole product: the service and both controllers are
  # subcommands of the one binary, and the chart runs each with its own
  # arguments. (access-issuer, github-roster and slack-roster were three
  # images until 0032; they are no longer published.)
  - id: sluis
    build: sluis
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    bare: true
    preserve_import_paths: false
    base_import_paths: true
    base_image: gcr.io/distroless/static:nonroot
    sbom: none  # attested on the digest instead (release.yaml, `attest`)
    labels:
      org.opencontainers.image.title: sluis
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/sluis

  # The resource-server sidecar's image. No chart of ours renders it: a
  # consumer's chart names it beside the stock container it fronts, pinned
  # by digest.
  - id: resource-proxy
    build: resource-proxy
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    bare: true
    preserve_import_paths: false
    base_import_paths: true
    base_image: gcr.io/distroless/static:nonroot
    sbom: none  # attested on the digest instead (release.yaml, `attest`)
    labels:
      org.opencontainers.image.title: resource-proxy
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/sluis

  # One image per module, for Kubernetes (U34c, docs/decisions/0072): the zip per
  # module is for Lambda, and this is its container counterpart. Each is the
  # multi-call `sluis` main built with its module name pinned
  # (`-X .../internal/version.Module=sluis-module=<module>`), so a module image
  # refuses another module's commands (cmd/sluis checkPin). The chart runs them
  # with `image.perModule: true` and keeps the single `sluis` image by default.
  # The repository is set per image, not by the cmd directory, since all three
  # build ./cmd/sluis; the id IS the image name (the artifacts table reads it).
  - id: sluis-issuer
    main: ./cmd/sluis
    repositories:
      - "{{ .Env.KO_DOCKER_REPO }}/sluis-issuer"
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}} -X github.com/truvity/sluis/internal/version.Module=sluis-module=issuer
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    bare: true
    preserve_import_paths: false
    base_import_paths: false
    base_image: gcr.io/distroless/static:nonroot
    sbom: none  # attested on the digest instead (release.yaml, `attest`)
    labels:
      org.opencontainers.image.title: sluis-issuer
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/sluis

  - id: sluis-cloudflare
    main: ./cmd/sluis
    repositories:
      - "{{ .Env.KO_DOCKER_REPO }}/sluis-cloudflare"
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}} -X github.com/truvity/sluis/internal/version.Module=sluis-module=cloudflare
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    bare: true
    preserve_import_paths: false
    base_import_paths: false
    base_image: gcr.io/distroless/static:nonroot
    sbom: none  # attested on the digest instead (release.yaml, `attest`)
    labels:
      org.opencontainers.image.title: sluis-cloudflare
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/sluis

  - id: sluis-backup
    main: ./cmd/sluis
    repositories:
      - "{{ .Env.KO_DOCKER_REPO }}/sluis-backup"
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/truvity/sluis/internal/version.Version={{.Version}} -X github.com/truvity/sluis/internal/version.Module=sluis-module=backup
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    bare: true
    preserve_import_paths: false
    base_import_paths: false
    base_image: gcr.io/distroless/static:nonroot
    sbom: none  # attested on the digest instead (release.yaml, `attest`)
    labels:
      org.opencontainers.image.title: sluis-backup
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/sluis

release:
  github:
    owner: truvity
    name: sluis
  # vX.Y.Z-rc.N is a pre-release on GitHub (never "Latest"); the pulumi-tag
  # job and the gates run on it exactly as on a release.
  prerelease: auto
  header: |
    ## sluis {{ .Tag }}

    | | |
    |---|---|
    | Image | `ghcr.io/truvity/sluis/sluis:{{ .Version }}` |
    | Sidecar image | `ghcr.io/truvity/sluis/resource-proxy:{{ .Version }}` |
    | Module images | `ghcr.io/truvity/sluis/sluis-{issuer,cloudflare,backup}:{{ .Version }}` |
    | Chart | `oci://ghcr.io/truvity/charts/sluis:{{ .Version }}` |
    | TypeScript | `@truvity/sluis@{{ .Version }}` on GitHub Packages |
    | Go | `go get github.com/truvity/sluis@{{ .Tag }}` |

    The TypeScript package is published to GitHub Packages at this
    version; installing it needs a token that can read packages
    (`docs/sdk/typescript/sluis.md`). The Go module at
    this tag is the policy engine, `identity` and `tokens`; `authz` and
    `directory` are not built yet, and `docs/sdk/go/sluis.md` says
    so.

    The Lambda zips are one per module, each holding `bootstrap` built for that module and
    refusing to run as another: `sluis-issuer_{{ .Version }}_linux_arm64.zip` (the issuer, the
    signer and the console, with the providers in-process),
    `sluis-cloudflare_{{ .Version }}_linux_arm64.zip` and
    `sluis-backup_{{ .Version }}_linux_arm64.zip` (deployed as the backup and the restore
    function). The single `sluis-lambda` zip is no longer published
    (`docs/reference/sluis/lambda.md`). The telemetry layer is
    `otlp-lambda-layer_<version>_linux_<arch>.zip` from `truvity/observability`;
    sluis ships none.

    `sluisctl` is its own archive, because it is the one thing here that
    runs on somebody's own laptop. `accessctl_*` is the same program under
    its old name, for one or two more releases: it says on stderr that the
    name is deprecated, and does everything `sluisctl` does.

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
