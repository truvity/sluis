# Data for the architecture explorer (docs/architecture/explorer.mdx).
#
# The facts live here and the component only renders them. Today the file is
# written by hand from the design ledger; once the permission manifest exists,
# the actors, drivers, edges, uids and sockets below are generated from it and
# the prose fields stay. `status` is agreed | proposed | open; `od` names a row
# on /open-decisions/.
#
# Vocabulary (docs/TAXONOMY): an actor is a process with one responsibility; a
# runtime is the runtime kind (bare-metal, serverless, kubernetes); an
# installation is one concrete deployment; four are tested: local, boards,
# lambda and kubernetes. The keys below keep their old names so that the code
# that reads them does not change: `shapes` lists the tested installations,
# `roles` lists the actors, `environment` names the runtime kind, and
# `runtimes` are the runtime templates. Kubernetes is a tested installation too
# but is not drawn here yet; the delivery order is local first, then boards,
# lambda and kubernetes in parallel.

default_shape: boards

statuses:
  agreed: Agreed
  proposed: Proposed
  open: Open

# ---------------------------------------------------------------------------
# Tested installations (the key stays `shapes`). `environment` is the runtime
# kind of the installation. `ports` names the driver behind each port in it.
# ---------------------------------------------------------------------------
shapes:
  - id: local
    name: Local (development)
    environment: bare-metal
    hardware: Docker on a workstation, one node, with the host's YubiKey
    runtime: docker
    nodes: 1
    node_agent: false
    edge: cloudflared
    ports: { keys: yubikey, state: embedded, blob: fs, transport: spool, index: sqlite }
    keys: the host's YubiKey, through the host's pcscd socket mounted into the key-holder container (a software key in CI)
    state: embedded single-node store
    use: Development and CI. Delivered first, until v2 can replace v1.
    notes:
      - text: "The key-holder container uses the host's pcscd socket, mounted into it; the host keeps using the YubiKey, and the pcsc-lite protocol versions of the image and the host must match. The fallback is to run key-holder natively on the host, so that the containers mount only its Unix socket."
        status: agreed
      - text: "The log store is the fs blob, a local directory with no lock mode, so tamper evidence comes from verification and, where there is one, a witness. The witness is optional, and sluis config check warns when there is none."
        status: agreed
  - id: boards
    name: Boards (three-board cluster)
    environment: bare-metal
    hardware: Three single-board computers (arm64, 2 GB RAM, eMMC), a YubiKey in each
    runtime: systemd
    nodes: 3
    node_agent: true
    edge: cloudflared
    ports: { keys: yubikey, state: rqlite, blob: r2, transport: spool, index: rqlite_index }
    keys: One YubiKey per node
    state: rqlite (Raft) across three nodes
    use: Integration tests and tutorials. Built in parallel with lambda and kubernetes after local; a Cloudflare tunnel serves sluis.example.com.
    notes:
      - text: "The audit pieces run on the same nodes as sluis, so they share driver instances. Each node has its own writer, spool and log key, and the other two nodes are its peer witnesses (the 2-of-3 co-signing). Readers merge the logs by time. The rule is exactly one writer per log."
        status: agreed
      - text: "The blob is an R2 bucket. Its lock can be removed by an account administrator, so the peer witnesses are what protects against a rewritten history."
        status: agreed
      - text: "The index is rqlite, a replicated SQLite, so the reader can run on any node. This is a proposed index driver (ADR 0022). Its full-text support (FTS5) was verified on a three-node cluster on 2026-10-30; arm64 board hardware and the cost of writes on eMMC are not measured yet."
        status: proposed
      - text: "The boards run the vendor's Ubuntu 22.04 for now, as a declared exception. systemd 249 has no LoadCredentialEncrypted=, so units use plain LoadCredential=, and sluis doctor warns about kernel 5.10. Building Ubuntu 26.04 and Rocky 10.2 images is a backlog task."
        status: agreed
  - id: lambda
    name: AWS Lambda
    environment: serverless
    hardware: One Lambda function per actor
    runtime: lambda
    nodes: 0
    node_agent: false
    edge: lwa
    ports: { keys: aws, state: aws, blob: s3, transport: sqs, index: remote }
    keys: AWS KMS
    state: DynamoDB
    use: Integration tests and tutorials. Built in parallel with boards and kubernetes after local.
    notes:
      - text: "The default index here is none (proposed). Serverless may run the indexer and the reader with a postgres index, through RDS Proxy (proposed). With no index, the reader and its search index run in a separate Search installation that reads the same bucket: on Kubernetes with Postgres (cnpg, or external with a connection string), or on a server with sqlite. Where Search runs is derived from the port and driver rules. A small install can run sluis audit search from the CLI, which builds a local sqlite index from the chain. The search index is a rebuildable cache; the chain in the blob is the record."
        status: agreed
      - text: "The transport is an SQS queue here. Direct mode is not available on serverless, because its fallback is a local spool and a function has no disk."
        status: agreed
      - text: "The log key is a single KMS key whose key policy names the writer function's role only. There is one log, so there is no peer witness; the function's role is the isolation. A witness is optional."
        status: agreed
      - text: "Kubernetes is the fourth tested installation and is proposed, not drawn here: see /runtimes/kubernetes/. Its audit transport is an SQS queue, as here."
        status: proposed

# What each runtime turns a process id into. {id} is the process id, {driver}
# the driver id, {role} the actor the driver belongs to.
runtimes:
  docker:
    label: Docker Compose
    process: compose service
    role:
      unit: "sluis-{id} (compose service)"
      identity: "container user sluis-{id}"
      id_short: "user sluis-{id}"
      listen: "/run/sluis/{id}/api.sock"
      sock_short: "sock {id}"
    shared_driver:
      unit: "sluis-driver-{driver} (compose service)"
      identity: "container user sluis-drv-{driver}"
      id_short: "user sluis-drv-{driver}"
      listen: "/run/sluis/driver-{driver}/api.sock"
      sock_short: "sock driver-{driver}"
    role_driver:
      unit: "sluis-driver-{driver}-{role} (compose service)"
      identity: "the role's own user, sluis-{role}"
      id_short: "user sluis-{role}"
      listen: "/run/sluis/{role}/{driver}.sock"
      sock_short: "{driver}.sock"
    role_call: Unix socket
    driver_call: Unix socket on a shared volume
  systemd:
    label: systemd
    process: systemd unit
    role:
      unit: "sluis-{id}.service (+ .socket)"
      identity: "uid sluis-{id}"
      id_short: "uid sluis-{id}"
      listen: "/run/sluis/{id}/api.sock"
      sock_short: "sock {id}"
    shared_driver:
      unit: "sluis-driver-{driver}.service (+ .socket)"
      identity: "uid sluis-drv-{driver}"
      id_short: "uid sluis-drv-{driver}"
      listen: "/run/sluis/driver-{driver}/api.sock"
      sock_short: "sock driver-{driver}"
    role_driver:
      unit: "sluis-driver-{driver}@{role}.service (+ .socket)"
      identity: "the role's own uid, sluis-{role}"
      id_short: "uid sluis-{role}"
      listen: "/run/sluis/{role}/{driver}.sock"
      sock_short: "{driver}.sock"
    role_call: Unix socket
    driver_call: Unix socket
  lambda:
    label: AWS Lambda
    process: Lambda function
    role:
      unit: "Lambda function sluis-{id}"
      identity: "execution role sluis-{id}"
      id_short: "role sluis-{id}"
      listen: "no socket: called by Lambda invoke"
      sock_short: "invoke"
    shared_driver:
      unit: "Lambda extension sluis-driver-{driver} (layer)"
      identity: "the function's execution role"
      id_short: "execution role"
      listen: "/tmp/sluis/{driver}.sock"
      sock_short: "sock {driver}"
    role_driver:
      unit: "Lambda extension sluis-driver-{driver} (layer of sluis-{role})"
      identity: "the function's execution role, sluis-{role}"
      id_short: "role sluis-{role}"
      listen: "/tmp/sluis/{driver}.sock"
      sock_short: "{driver}.sock"
    role_call: Lambda invoke
    driver_call: Unix socket (extension)

# The edge connector, per kind.
edges_kinds:
  cloudflared:
    title: edge connector
    sub: cloudflared tunnel
    line2: "cloudflared"
    line3: "unix: origin"
    does: "The Cloudflare tunnel client. Its ingress service is entry's public Unix socket, as a unix: origin (unix:/run/sluis/entry/<boundary>-public.sock), so it makes outbound connections only and no inbound port is opened on the node. It holds no key and can open no other actor's socket. In the local installation, how a developer reaches entry's socket (this connector in a container, or a development proxy) is ADR 0055, not yet decided."
    listen: Outbound tunnel only. It forwards to entry's public Unix socket.
    transport: Unix socket (a unix origin)
    status: proposed
  lwa:
    title: edge connector
    sub: Lambda Web Adapter
    line2: "Lambda Web Adapter"
    line3: "loopback TCP"
    does: The Lambda Web Adapter, pinned and vendored into sluis's own layer, behind API Gateway. It forwards the invocation to entry over a loopback TCP port inside the sandbox, which holds only sluis processes.
    listen: Loopback TCP inside the sandbox (127.0.0.1:8080 is an example).
    transport: Loopback TCP (127.0.0.1)
    status: agreed

# ---------------------------------------------------------------------------
# Drivers. A driver is the technology behind a port; it is a service that
# speaks ConnectRPC over a Unix socket, started by the platform.
# ---------------------------------------------------------------------------
drivers:
  soft:
    port: keys
    title: soft
    instance: shared
    shared_name: key-holder
    binary: drivers/soft
    does: Software keys under its own uid. A development driver; the code refuses it in production.
    holds: The software key files
    backing: software key file
    status: agreed
  yubikey:
    port: keys
    title: yubikey
    instance: shared
    shared_name: key-holder
    binary: drivers/yubikey
    does: "Serves the keys port from the node's YubiKey (PIV), as key-holder, the one mediating driver. One device and one PIN, so one shared instance with three checks: one Unix socket per caller, in a directory only that caller can open; the caller's peer uid on every connection; and content-aware signing per purpose (a TBSCertificate for ca, an OpenSSH certificate body for ssh-ca, a JWS signing input for token purposes). An access list generated from the manifest names who may use which key. Built with cgo against pcsc-lite."
    holds: The PIN, as a systemd credential. No symmetric keys; sealing uses ECDH plus HKDF with the P-384 key in slot 9d.
    backing: YubiKey PIV
    slots: "9c node intermediate and signing; 9d ECDH sealing and ring wrap; 82 SSH user CA and 83 SSH host CA (both for ssh-ca); 84 release subkey; 85 to 95 retired sealing keys (proposed); 9e avoided"
    status: agreed
  embedded:
    port: state
    title: embedded
    instance: per-actor
    shared_name: null
    binary: drivers/embedded
    does: Serves the state port from a single-node embedded store, with no Raft, a file per actor and uid. One writer per record kind follows from the scope the port library takes from the actor's own identity.
    holds: The store file
    backing: embedded single-node store
    status: agreed
  rqlite:
    port: state
    title: rqlite
    instance: per-actor
    shared_name: null
    binary: drivers/rqlite
    does: Serves the state port on rqlite, with one cluster per boundary and owning actor (sluis-rqlite@<boundary>-<actor>) and no state-owner. The owner has an rqlite user with execute, and each declared reader a query-only user. Raft peer traffic is each cluster's own TCP port, over mTLS with a certificate per cluster. How an actor unit that runs with PrivateNetwork=yes reaches its cluster's TCP client port is an open point of ADR 0008.
    holds: The Raft peer TLS credential
    backing: rqlited (Raft, three nodes)
    status: agreed
    peer_port: true
  aws:
    port: any
    title: aws
    instance: per-actor
    shared_name: null
    binary: drivers/aws
    does: One binary for KMS (keys), DynamoDB (state), S3 or an S3-compatible store (blob) and SQS (transport). One instance per actor, running as that actor's uid, so the cloud's own IAM or key policy is the enforcer.
    holds: Nothing. Credentials come from the platform identity, or from a workload JWT exchanged for cloud credentials.
    backing: AWS KMS, DynamoDB, S3 or SQS
    status: agreed
  spool:
    port: transport
    mode: queue
    title: spool
    instance: shared
    shared_name: null
    binary: drivers/spool
    does: The transport port in queue mode on a local, fsync'd spool. A producer's request returns once its record is durable here. One shared instance that checks every caller's peer credentials.
    holds: The spool segment files
    backing: local spool on disk
    status: proposed
  fs:
    port: blob
    title: fs
    instance: file
    shared_name: null
    binary: drivers/fs
    does: The blob port on a local directory, for one node. It has no lock mode, so tamper evidence comes from verification and witnesses. The blob driver of the local installation.
    holds: The blob directory
    backing: local directory
    status: agreed
  s3:
    port: blob
    title: s3-compatible (S3)
    instance: per-actor
    shared_name: null
    binary: drivers/aws
    does: The blob port on AWS S3, served by the one s3-compatible driver, with credentials from the cloud port and IAM prefix conditions. Only the writer, the witness, the indexer and the reader use it.
    holds: Nothing
    backing: object store
    status: agreed
  r2:
    port: blob
    title: s3-compatible (R2)
    instance: per-actor
    shared_name: null
    binary: drivers/aws
    does: The blob port on a Cloudflare R2 bucket, served by the one s3-compatible driver with R2 temporary credentials scoped to the bucket and a prefix, minted by the cloudflare cloud driver. An object lock exists, but an account administrator can remove it (lock mode removable), so tamper evidence leans on the witnesses. Only the writer, the witness, the indexer and the reader use it.
    holds: Nothing
    backing: R2 bucket (S3 API)
    status: agreed
  sqs:
    port: transport
    mode: queue
    title: aws (SQS)
    instance: per-actor
    shared_name: null
    binary: drivers/aws
    does: The transport port in queue mode on SQS. Each producer sends under its own IAM role; the writer takes the observer from the queue's sender, not from the message body.
    holds: Nothing
    backing: SQS queue
    status: agreed
  sqlite:
    port: index
    title: sqlite
    instance: file
    shared_name: null
    binary: drivers/sqlite
    does: The index port on a SQLite file with FTS5, one per node. A projection of the batch stream, never the evidence.
    holds: The index file
    backing: SQLite file
    status: proposed
  rqlite_index:
    port: index
    title: rqlite
    instance: shared
    shared_name: null
    binary: drivers/rqlite
    does: "The index port on rqlite, a replicated SQLite, so the reader can run on any node. A projection of the batch stream, never the evidence. This is a proposed index driver (ADR 0022); its full-text support (FTS5) was verified on 2026-10-30."
    holds: The replicated index tables
    backing: rqlite (replicated SQLite)
    status: proposed
  remote:
    port: index
    title: none here
    instance: file
    shared_name: null
    binary: null
    does: "The default index of the lambda installation is none (proposed); a postgres index through RDS Proxy is allowed. With no index, the reader and its search index run in a separate Search installation that reads the same bucket (Kubernetes with Postgres, or a server with sqlite). The search index is a rebuildable cache; the chain in the blob is the record."
    holds: Nothing
    backing: an index in a separate audit install
    status: agreed
  postgres:
    port: index
    title: postgres
    instance: per-actor
    shared_name: null
    binary: drivers/postgres
    does: "The index port on Postgres, one driver with a provisioning mode: rds or aurora on AWS (through RDS Proxy on serverless, proposed), cnpg on Kubernetes (proposed), or external, a connection string only. Exposing CNPG through a load balancer is not a driver of its own; it is external."
    holds: Nothing
    backing: Postgres
    status: agreed

# The four drivers shown on the map are the ports; the backing stores are
# described per port and driver.
ports:
  keys:
    node: drv-keys
    title: keys
    store_node: store-keys
    store_title: key custody
    users: [session, exchange, policy, signer, ca, ssh-ca, writer, witness]
  state:
    node: drv-state
    title: state
    store_node: store-state
    store_title: state store
    users: [session, exchange, signer, ca, ssh-ca, quota, writer, witness, indexer, reader]
  blob:
    node: drv-blob
    title: blob
    store_node: store-blob
    store_title: blob
    users: [writer, witness, indexer, reader]
  transport:
    node: drv-transport
    title: transport
    store_node: store-transport
    store_title: transport
    users: [entry, session, exchange, console, policy, signer, ca, ssh-ca, quota, writer, witness, indexer, reader]
  index:
    node: null
    store_node: store-index
    store_title: index

# ---------------------------------------------------------------------------
# Actors (the key stays `roles`). Each is its own OS user and unit, its own
# Lambda function, or its own container. `resources` is an illustrative slice
# of the permission manifest.
# ---------------------------------------------------------------------------
roles:
  entry:
    status: agreed
    name: entry
    kind: actor
    binary: actors/entry
    does: "Parses each request, validates it against closed parameter lists generated from the contracts, and routes it to the actor that owns it: session for sign-in and sessions, exchange for token exchange and enrolment, console for the operator API, ssh-ca for SSH certificates. It sits behind the edge connector and is the only actor whose API faces the edge. It is written in a memory-safe language, fuzzed, loads no plugin and runs on a read-only file system (ADR 0007)."
    holds: "Nothing: no key, no secret, no state and no outbound network"
    uses: [transport]
    workload_jwt: false
    resources:
      - "calls: session, exchange, console, ssh-ca (on serverless it invokes them); integrations only to route a push notification"
      - "state: none; keys: none; secrets: none"
      - "network: none (PrivateNetwork=yes, AF_UNIX only, seccomp and Landlock on bare-metal)"
      - "transport: put"
    listen_by_runtime:
      docker: "/run/sluis/entry/<boundary>-public.sock on a shared volume; the container has no network"
      systemd: "/run/sluis/entry/<boundary>-public.sock, a Unix socket; PrivateNetwork=yes, so no TCP listener"
      lambda: "TCP 127.0.0.1:8080 (an example port) inside the sandbox, through the Lambda Web Adapter"
    map_line_by_runtime:
      docker: "unix socket"
      systemd: "unix socket"
      lambda: "tcp 127.0.0.1"
    listener_note: "entry's public API is the only listener that faces the edge. On bare-metal it is a Unix socket that cloudflared forwards to as a unix: origin, and entry has no network at all. On serverless it is a loopback TCP port inside the function's sandbox, because the Lambda Web Adapter needs one. Kubernetes is proposed in ADR 0046. Every other actor listens on Unix sockets only."
  session:
    status: agreed
    name: session
    kind: actor
    binary: actors/session
    does: "Sign-in and sessions: the authorization flows with the upstream integrations, session records, the HttpOnly session cookie it seals, and freshness per boundary (RFC 9470 step-up). It owns the recovery verifier and switch. It asks policy before it issues anything and has no listener toward the edge."
    holds: "The cookie-sealing key, behind the keys port; sessions and refresh tokens (state)"
    uses: [keys, state, transport]
    resources:
      - "state: sessions/*, codes/*, recovery/* (its own record kinds, in its own rqlite cluster)"
      - "keys: seal and open the session cookie"
      - "calls: policy, signer, the Upstream integrations"
      - "called by: entry (sign-in, cookie), console (session check)"
      - "transport: put"
  exchange:
    status: agreed
    name: exchange
    kind: actor
    binary: actors/exchange
    does: "Token exchange (RFC 8693), enrolment of hosts and workloads, and the proof verifiers (aws-iid, k8s-sa-token, github-oidc, yubikey-attestation, enrol-token, manual approval). Verifier drivers hold public material only. An enrolment request is HPKE-encrypted end to end, and exchange opens it through the keys port; the enrolment key stays in key-holder or KMS. A downstream mint goes from here to the minter with a grant that policy signed."
    holds: "No authority key. Enrolments, token hashes and the host registry (state)"
    uses: [keys, state, transport]
    resources:
      - "state: enrolments/*, enrol-tokens/* (hashes only), hosts/*, clients/* (its own record kinds)"
      - "keys: open an enrolment request sealed to the enrolment key"
      - "calls: policy, quota, signer, ca, the WorkloadVerifier, CredentialMinter and Notifier integrations"
      - "called by: entry, console (operator writes to its record kinds)"
      - "transport: put"
  console:
    status: agreed
    name: console
    kind: actor
    binary: actors/console
    does: "The operator API, as the browser's backend. It has session check the cookie, checks the operator's delegation (per company, and per environment for machine-plane records), and routes each operator-set write to the actor that owns the record kind, which validates and writes it. It reads through the actors it calls. The browser holds no token; the single-page application is a separate static artifact."
    holds: "No key and no write access to other actors' records; delegation checks only"
    uses: [transport]
    resources:
      - "state: none of its own; writes go to the owning actor"
      - "calls: session (session check), the owning actors of operator-set kinds (exchange for enrolments and hosts, an integration for its console-managed kinds), reader (the audit page)"
      - "keys: none"
      - "transport: put (every operator change, under the operator's name)"
  policy:
    status: agreed
    name: policy
    kind: actor
    binary: actors/policy
    does: "The decision point. A reviewed, file-based Cedar policy maps facts to grants. It is written in Rust with the cedar-policy crate. It keeps no state and opens no network connection. It signs mint grants with its own key."
    holds: The grant key
    uses: [keys, transport]
    resources:
      - "keys: sign with the grant key"
      - "state: none; network: none"
      - "transport: put"
  signer:
    status: agreed
    name: signer
    kind: actor
    binary: actors/signer
    does: "Holds the signing ring and signs tokens under a signing policy. It is not a pure oracle: it checks the issuer, the audience, the lifetime and the algorithm, and accepts a request only from session and exchange."
    holds: The token-signing keys
    uses: [keys, state, transport]
    resources:
      - "keys: sign with the token-signing keys"
      - "state: ring/* read and write"
      - "transport: put"
  ca:
    status: agreed
    name: ca
    kind: actor
    binary: actors/ca
    does: "The X.509 certificate authority: host and workload SVIDs at enrolment, and database client certificates. The subject comes from the requester's authenticated identity, never from the request. Every certificate is audited and goes in the issuance log. The SSH CA is a separate actor, ssh-ca (ADR 0013)."
    holds: The X.509 CA keys (slot 9c for the node intermediate on a YubiKey, proposed)
    uses: [keys, state, transport]
    resources:
      - "keys: sign a TBSCertificate within its profile's constraints (key-holder parses it before signing)"
      - "state: issued/* (its own record kinds)"
      - "called by: exchange"
      - "transport: put"
  ssh-ca:
    status: agreed
    name: ssh-ca
    kind: actor
    binary: actors/ssh-ca
    does: "The SSH certificate authority, for user and host certificates. A certificate carries identity only (u:<person-key> for people, w:<workload> for machines); what an identity may log in as comes from the signed bundle that sluis-host writes on each host. Policy decides each signature (ssh.certify). It is its own actor because it is a different authority from ca (ADR 0013)."
    holds: The SSH user and host CA keys (slots 82 and 83 on a YubiKey, proposed)
    uses: [keys, state, transport]
    resources:
      - "keys: sign an OpenSSH certificate body only (key-holder parses it before signing)"
      - "state: ssh-issued/* (its own record kinds)"
      - "calls: policy"
      - "called by: entry (the SSH certificate endpoint)"
      - "transport: put"
  quota:
    status: agreed
    name: quota
    kind: actor
    binary: actors/quota
    does: "Rate limits and caps, with compare-and-set on the state port (a conditional adjust is a proposed further operation). Caps and limits live in core. Quota (quota engine, quota state) is a separate piece, combinable with sluis, and it shares sluis's driver instances. It meters by default and enforces per policy rule."
    holds: Balances and meters (state), no key
    uses: [state, transport]
    resources:
      - "state: quota/* compare-and-set (balances are issued records; meters are derived from the log)"
      - "transport: put"
  writer:
    status: agreed
    name: writer
    kind: actor
    binary: actors/writer
    does: "Seals audit batches and writes them to the blob. It reads the transport, dedupes, rolls batches, puts the batch object, registers it in audit_batches, and asks key-holder to sign the batch head with the log key. There is no notary: key-holder's access list lets only the writer use the log key, so the writer never holds the key itself. It declares instances: exactly 1 per log; a cluster keeps one log per node."
    holds: The log-store credential; no key (key-holder signs for it)
    uses: [keys, transport, blob, state]
    resources:
      - "transport: receive and ack"
      - "keys: sign the batch head with the log key (through key-holder, or the key policy on AWS)"
      - "blob: write on the batch prefix, and seals/"
      - "state: append audit_batches"
  witness:
    status: agreed
    name: witness
    kind: actor
    binary: actors/witness
    does: "Co-signs the batch heads it has seen, so that the writer alone cannot choose which history an auditor sees. Optional everywhere; sluis config check warns when an installation has none. On a cluster of boards the other nodes are a node's peer witnesses (peer driver). It holds nothing the writer holds."
    holds: Its own key
    uses: [keys, state, blob, transport]
    resources:
      - "keys: sign a cosignature with its own key"
      - "state: read new batch heads"
      - "blob: read heads; write only its cosignature"
      - "transport: put"
  indexer:
    status: agreed
    name: indexer
    kind: actor
    binary: actors/indexer
    does: "Search, the indexer. Follows audit_batches from its cursor, fetches each new batch from the blob and applies it to the search index. It declares instances: exactly 1, so with more than one node it needs the lease port. Where it runs is derived from the port and driver rules."
    holds: Read on audit_batches and the blob; write on the search index
    uses: [state, blob, transport]
    resources:
      - "state: read audit_batches and its cursor"
      - "blob: read batches"
      - "index: apply"
      - "transport: put (each purge it applies is audited)"
  reader:
    status: agreed
    name: reader
    kind: actor
    binary: actors/reader
    does: "Search, the reader. Answers audit queries from the search index and records each read. Where it runs is derived from the port and driver rules: with a sqlite index on a cluster it runs on the indexer's node; with an rqlite or postgres index it can run on any node."
    holds: Read only; the search index
    uses: [state, blob, transport]
    resources:
      - "blob: read batches"
      - "index: query"
      - "transport: put (each read is audited)"

# ---------------------------------------------------------------------------
# Integrations: six kinds, each its own process. The names are examples.
# ---------------------------------------------------------------------------
integrations:
  int-upstream:
    kind: Upstream
    example: int-google
    does: Federates sign-in from an upstream identity provider (Authorize, Callback). Returns facts; it never decides.
    holds: The provider's client secret
    egress: the provider's own hosts only
  int-workload:
    kind: WorkloadVerifier
    example: int-workload
    does: Verifies workload tokens (Kubernetes and CI OIDC subject tokens) against the issuers' published keys. Holds no secret.
    holds: No secret
    egress: the configured issuers' key hosts only
  int-facts:
    kind: FactsSource
    example: int-github
    does: Returns directory facts (workspace directories, GitHub teams, chat workspaces) and writes them as learned records of its own. A product's push notification reaches it through entry; it then pulls the full state. It also owns the operator-set kinds of its own objects (a chat integration's managed channels), written through console.
    holds: The source's credential
    egress: the source's API host only
  int-minter:
    kind: CredentialMinter
    example: int-cloudflare
    does: Mints a short-lived downstream credential (cloud API token, GitHub installation token, AWS credentials). It receives a mint grant signed by policy and carries it out; it never decides.
    holds: The connection's parent credential
    egress: the vendor's API host only
  int-provisioner:
    kind: Provisioner
    example: int-gitops
    does: Pulls a digest-addressed desired state and carries it out. Core calls it; it never calls core.
    holds: The target's credential
    egress: the desired-state source and the target only
  int-notifier:
    kind: Notifier
    example: int-slack
    does: Sends notifications.
    holds: The service's webhook or token
    egress: the service's host only

# ---------------------------------------------------------------------------
# Node services
# ---------------------------------------------------------------------------
node_agent:
  status: agreed
  title: sluis-node
  binary: node/sluis-node
  does: "Issues a short-lived workload JWT per actor. Each actor's process identity comes from its uid, by peer credentials. The node's non-extractable hardware key signs the JWT (about 120 ms per signature, hourly per actor)."
  holds: The node's hardware key, through the keys driver
  resources:
    - "keys: sign workload JWTs with the node key"
    - "callers: every sluis uid listed in the uid-to-actor map generated from the manifest"
  listener_note: "On bare-metal every actor, entry included, and every driver listens on Unix sockets only. sluis-node publishes no network listener; the issuer's discovery document and JWKS (public keys only) are static files served from the distribution bucket, one issuer per node."

# ---------------------------------------------------------------------------
# External and backing nodes (drawn, not run by sluis)
# ---------------------------------------------------------------------------
externals:
  client:
    title: client
    sub: browser, CLI, CI job
    does: A person, a robot or a workload calling sluis.
  upstream:
    title: upstream
    sub: IdPs, token issuers
    does: Upstream identity providers and the issuers of workload tokens.
  vendor:
    title: external systems
    sub: directories, vendors
    does: The systems that integrations read facts from, mint credentials in, or notify.
  downstream:
    title: cloud IAM
    sub: STS, GCP WIF, Entra
    does: The cloud's token service. A cloud driver exchanges a workload JWT for that cloud's credentials there.

# What a port's backing node says, per port and driver.
backing_lines:
  blob.r2: ["R2 bucket", "S3 API, lock removable"]
  index.rqlite_index: ["rqlite index", "replicated SQLite"]
  keys.soft: ["software key file", "under driver-soft"]
  keys.yubikey: ["YubiKey PIV", "one per node, or the host's"]
  keys.aws: ["AWS KMS", "key per purpose"]
  state.embedded: ["embedded store", "single node"]
  state.rqlite: ["rqlited", "Raft, 3 nodes"]
  state.aws: ["DynamoDB", "table per record kind"]
  blob.s3: ["object store", "S3 API"]
  transport.spool: ["local spool", "fsync'd segments"]
  transport.sqs: ["SQS queue", "dead-letter queue"]
  index.sqlite: ["SQLite + FTS5", "one file per node"]
  index.postgres: ["Postgres", "rds, cnpg or external"]
  index.remote: ["no index here", "separate Search install"]

# ---------------------------------------------------------------------------
# The call graph. `from > to`. `when` limits an edge to installations or drivers;
# an edge to a node an installation does not have is dropped.
# ---------------------------------------------------------------------------
calls:
  - { f: client, t: edge, m: HTTPS, d: "Sign-in, token exchange, mint and the console reach sluis through the edge connector." }
  - { f: edge, t: entry, m: connect, d: "The edge connector reaches entry's public socket; this is the only public path in." }
  - { f: entry, t: session, m: "Route: sign-in", d: "Sign-in, the session cookie and step-up go to session." }
  - { f: entry, t: exchange, m: "Route: exchange", d: "Token exchange, enrolment and downstream mint go to exchange." }
  - { f: entry, t: console, m: "Route: console", d: "The operator API goes to console." }
  - { f: entry, t: ssh-ca, m: "Route: SSH cert", d: "An SSH certificate request goes to ssh-ca." }
  - { f: entry, t: int-facts, m: "Route: push", d: "A product's push notification goes to the integration that owns the object; the integration then pulls the full state." }
  - { f: session, t: int-upstream, m: "Authorize / Callback", d: Human sign-in upstream. }
  - { f: session, t: policy, m: Decide, d: "Maps the upstream facts to grants, and says whether fresh MFA is needed." }
  - { f: session, t: signer, m: SignToken, d: "ID and access tokens for a signed-in session." }
  - { f: session, t: drv-keys, m: "Seal(cookie)", d: "Seals and opens the session cookie with the cookie-sealing key." }
  - { f: session, t: drv-state, m: "sessions/*", d: "Sessions, codes and the recovery switch, in its own cluster." }
  - { f: console, t: session, m: "Check session", d: "session checks the HttpOnly cookie and its freshness for the boundary." }
  - { f: console, t: exchange, m: "Operator write", d: "Approve a pending enrolment, create an enrolment token; exchange validates and writes its own records." }
  - { f: console, t: int-facts, m: "Operator write", d: "An operator-set kind an integration owns, such as a chat integration's managed channels." }
  - { f: console, t: reader, m: Search, d: The console audit page. }
  - { f: exchange, t: int-workload, m: Verify, d: Check a workload subject token. }
  - { f: exchange, t: policy, m: Decide, d: "host.enrol, token exchange and mint decisions." }
  - { f: exchange, t: quota, m: Adjust, d: Rate and count limits. }
  - { f: exchange, t: signer, m: SignToken, d: Issue a token. }
  - { f: exchange, t: ca, m: Issue, d: "A host or workload SVID, bound to the requester's identity." }
  - { f: exchange, t: drv-keys, m: "Open(enrolment)", d: "Opens an HPKE-sealed enrolment request; the enrolment key never leaves the keys port." }
  - { f: exchange, t: drv-state, m: "enrolments/*", d: "Enrolments, enrolment-token hashes, hosts and clients, in its own cluster." }
  - { f: exchange, t: int-minter, m: Mint(grant), d: "Downstream mint, with a grant signed by policy." }
  - { f: exchange, t: int-notifier, m: Notify, d: "Notifications, such as an enrolment waiting for approval." }
  - { f: console, t: int-provisioner, m: Reconcile, d: "Asks the provisioner to reconcile to a published, digest-addressed desired state (illustrative)." }
  - { f: ssh-ca, t: policy, m: Decide, d: "ssh.certify: may this identity get this certificate now." }
  - { f: int-upstream, t: upstream, m: OIDC, d: The user authenticates at the upstream provider. }
  - { f: int-workload, t: upstream, m: JWKS, d: Fetches the issuer's published keys. }
  - { f: int-facts, t: vendor, m: Read, d: Reads directory facts. }
  - { f: int-minter, t: vendor, m: Mint, d: Mints the credential at the vendor. }
  - { f: int-provisioner, t: vendor, m: Pull, d: Pulls the desired state and applies it. }
  - { f: int-notifier, t: vendor, m: Send, d: Sends the notification. }
  - { f: policy, t: drv-keys, m: "Sign(grant)", d: Signs mint grants with its own key. }
  - { f: signer, t: drv-keys, m: "Sign(token)", d: Token signatures. }
  - { f: ca, t: drv-keys, m: "Sign(cert)", d: "A TBSCertificate within its profile's constraints." }
  - { f: ssh-ca, t: drv-keys, m: "Sign(ssh cert)", d: "An OpenSSH certificate body only." }
  - { f: writer, t: drv-keys, m: "Sign(head)", d: "Asks key-holder to sign the batch head with the log key; only the writer may use it." }
  - { f: witness, t: drv-keys, m: "Sign(cosign)", d: Cosigns a batch head with its own key. }
  - { f: signer, t: drv-state, m: "ring/*", d: The signing ring. }
  - { f: quota, t: drv-state, m: "quota/*", d: Compare-and-set on balances. }
  - { f: ca, t: drv-state, m: "issued/*", d: Its issued certificates. }
  - { f: ssh-ca, t: drv-state, m: "ssh-issued/*", d: Its issued SSH certificates. }
  - { f: witness, t: drv-state, m: "Read heads", d: Reads new batch heads from audit_batches. }
  - { f: writer, t: drv-state, m: "audit_batches", d: Registers each batch in order. }
  - { f: indexer, t: drv-state, m: "Follow batches", d: Reads audit_batches from its cursor. }
  - { f: writer, t: drv-blob, m: "Put batch, seal", d: "Puts the batch object, and the signed head under seals/." }
  - { f: witness, t: drv-blob, m: "Get head, put cosign", d: Reads the signed head and puts its cosignature next to it. }
  - { f: indexer, t: drv-blob, m: "Get batch", d: Fetches batch objects. }
  - { f: reader, t: drv-blob, m: "Get batch", d: Fetches the batch object when one record is opened. }
  - { f: indexer, t: store-index, m: "Apply", d: Applies batches to the search index. }
  - { f: reader, t: store-index, m: "Query", d: Answers queries. }
  - { f: entry, t: drv-transport, m: Put, d: "Records each request it routes or refuses." }
  - { f: session, t: drv-transport, m: Put, d: "Records each sign-in and step-up." }
  - { f: exchange, t: drv-transport, m: Put, d: "Records each exchange, enrolment and mint." }
  - { f: console, t: drv-transport, m: Put, d: "Records each operator change, under the operator's name." }
  - { f: ssh-ca, t: drv-transport, m: Put, d: Records each SSH certificate. }
  - { f: policy, t: drv-transport, m: Put, d: Records each decision. }
  - { f: signer, t: drv-transport, m: Put, d: Records each signature. }
  - { f: ca, t: drv-transport, m: Put, d: Records each certificate. }
  - { f: quota, t: drv-transport, m: Put, d: Records each limit decision. }
  - { f: witness, t: drv-transport, m: Put, d: Records each cosignature. }
  - { f: indexer, t: drv-transport, m: Put, d: Records each purge it applies. }
  - { f: reader, t: drv-transport, m: Put, d: Records each read of the trail. }
  - { f: writer, t: drv-transport, m: "Receive / Ack", d: Takes records, acknowledges after the batch is registered. }
  - { f: drv-keys, t: store-keys, m: "", d: "" }
  - { f: drv-state, t: store-state, m: "", d: "" }
  - { f: drv-blob, t: store-blob, m: "", d: "" }
  - { f: drv-transport, t: store-transport, m: "", d: "" }
  - { f: sluis-node, t: drv-keys, m: "Sign(JWT)", d: "Signs the workload JWT with the node's hardware key.", when: { node_agent: true } }
  - { f: drv-keys, t: sluis-node, m: "Workload JWT", d: "A cloud key driver asks sluis-node for its actor's JWT (uid from peer credentials).", when: { node_agent: true, ports: { keys: aws } } }
  - { f: drv-state, t: sluis-node, m: "Workload JWT", d: "A cloud state driver asks sluis-node for its actor's JWT.", when: { node_agent: true, ports: { state: aws } } }
  - { f: drv-blob, t: sluis-node, m: "Workload JWT", d: "The blob driver asks sluis-node for its actor's JWT (uid from peer credentials).", when: { node_agent: true } }
  - { f: drv-keys, t: downstream, m: "AssumeRoleWithWebIdentity", d: "Exchanges the workload JWT for the cloud's credentials.", when: { node_agent: true, ports: { keys: aws } } }
  - { f: drv-state, t: downstream, m: "AssumeRoleWithWebIdentity", d: "Exchanges the workload JWT for the cloud's credentials.", when: { node_agent: true, ports: { state: aws } } }
  - { f: drv-blob, t: downstream, m: "AssumeRoleWithWebIdentity", d: "Exchanges the workload JWT for the cloud's credentials.", when: { node_agent: true } }
  - { f: drv-keys, t: downstream, m: "Platform identity", d: "The Lambda execution role is the identity; no workload JWT.", when: { node_agent: false, ports: { keys: aws } } }

# ---------------------------------------------------------------------------
# Flows. Nodes and edges name map nodes; ids that an installation lacks are skipped.
# `variants` add installation-specific sentences (the key stays `shapes`).
# ---------------------------------------------------------------------------
flows:
  - id: signin
    title: Human sign-in
    why: A person signs in with an upstream identity provider and gets a session.
    steps:
      - title: The browser reaches the edge
        nodes: [client, edge]
        edges: ["client>edge"]
        text: The browser opens the console and HTTPS arrives at the edge connector. Nothing on the node listens on a public TCP port, and entry listens on a Unix socket with no network of its own.
      - title: The edge connector forwards to entry
        nodes: [edge, entry]
        edges: ["edge>entry"]
        text: The edge connector forwards the request to entry's public Unix socket, a unix origin.
        variants:
          - { shapes: [lambda], text: "API Gateway invokes the function, and the Lambda Web Adapter forwards the request to entry over loopback TCP inside the sandbox, the one place entry has a TCP port." }
      - title: entry routes to session
        nodes: [entry, session]
        edges: ["entry>session"]
        text: entry checks the request against the closed parameter list of the endpoint and routes it to session, which owns sign-in. entry holds nothing and decides nothing.
      - title: session asks the upstream integration
        nodes: [session, int-upstream, upstream]
        edges: ["session>int-upstream", "int-upstream>upstream"]
        text: session calls the upstream integration (Authorize) for the redirect, and later (Callback) with the code. The user authenticates at the upstream provider, and the integration returns subject, email and groups as facts. It does not decide.
      - title: policy decides
        nodes: [session, policy]
        edges: ["session>policy"]
        text: session asks policy to map the facts to grants, and whether this boundary wants fresh MFA. The policy is a reviewed file; policy keeps no state and opens no network connection.
      - title: The session is stored and sealed
        nodes: [session, drv-state, store-state, drv-keys, store-keys]
        edges: ["session>drv-state", "drv-state>store-state", "session>drv-keys", "drv-keys>store-keys"]
        text: session writes the session record in its own state, which no other actor can write, and seals the HttpOnly cookie with its cookie-sealing key. The browser holds no token.
        variants:
          - { shapes: [boards], text: "The session record goes to session's own rqlite cluster, where only session has the execute user." }
      - title: The sign-in is audited
        nodes: [entry, session, drv-transport, store-transport]
        edges: ["entry>drv-transport", "session>drv-transport", "drv-transport>store-transport"]
        text: entry and session each put a record on the transport. The request returns once the records are durable there, never waiting for the audit writer.
  - id: exchange
    title: Token exchange
    why: A workload trades its CI or Kubernetes token for a sluis token (RFC 8693).
    steps:
      - title: The workload posts its token
        nodes: [client, edge, entry]
        edges: ["client>edge", "edge>entry"]
        text: A CI job or workload posts its subject token to the token endpoint, through the edge connector. Whatever happens next, success or refusal, leaves a record.
      - title: entry routes to exchange
        nodes: [entry, exchange]
        edges: ["entry>exchange"]
        text: entry validates the parameters against the closed list for the token endpoint and routes the request to exchange.
      - title: The subject token is verified
        nodes: [exchange, int-workload, upstream]
        edges: ["exchange>int-workload", "int-workload>upstream"]
        text: exchange asks the workload verifier to check the token. The verifier fetches the issuer's published keys and returns facts.
      - title: policy decides
        nodes: [exchange, policy]
        edges: ["exchange>policy"]
        text: policy maps the facts to a grant, or refuses. A refusal stops here with a reason and is audited the same way.
      - title: The limit is adjusted
        nodes: [exchange, quota, drv-state]
        edges: ["exchange>quota", "quota>drv-state"]
        text: quota updates the balance with compare-and-set. Caps and rate limits live in core.
      - title: signer signs the token
        nodes: [exchange, signer, drv-keys, store-keys]
        edges: ["exchange>signer", "signer>drv-keys", "drv-keys>store-keys"]
        text: signer signs the token under its signing policy through the keys driver. The token is sender-constrained (DPoP or mutual TLS) and carries exactly one audience.
        variants:
          - { shapes: [lambda], text: "The token is signed directly with the non-extractable KMS key. A production install measured about 25,000 tokens in 7 days, a peak of 0.8 per second, so direct signing costs about $2.62 per month." }
          - { shapes: [boards], text: "P-384 on the YubiKey signs at about 120 ms, 8 per second, far above the measured load. The YubiKey signs each token itself, through signer's own key-holder socket; there are no derived signing keys." }
          - { shapes: [local], text: "The host's YubiKey signs it through key-holder, or a software key in tests; the code refuses a software key in production." }
      - title: The exchange is audited
        nodes: [exchange, drv-transport, store-transport]
        edges: ["exchange>drv-transport", "policy>drv-transport", "signer>drv-transport", "drv-transport>store-transport"]
        text: exchange, policy and signer each put a record on the transport. The token goes back to the client once exchange's record is durable.
  - id: enrol
    title: Host enrolment
    why: A host or workload proves what it is and gets a short-lived certificate (SVID) from ca.
    steps:
      - title: The host posts a sealed request
        nodes: [client, edge, entry, exchange]
        edges: ["client>edge", "edge>entry", "entry>exchange"]
        text: The host sends its proof and a CSR, HPKE-encrypted to the enrolment key carried in the signed bundle. entry routes it to exchange and cannot read it.
      - title: exchange opens and verifies it
        nodes: [exchange, drv-keys, store-keys]
        edges: ["exchange>drv-keys", "drv-keys>store-keys"]
        text: "exchange opens the request through the keys port; the enrolment key stays in key-holder or KMS. A verifier driver checks the proof: an instance identity document (once per instance), a ServiceAccount token, a CI token, a YubiKey attestation, an enrolment token (its ID and an HMAC, never the token itself) or a manual approval."
      - title: policy decides
        nodes: [exchange, policy]
        edges: ["exchange>policy"]
        text: policy decides host.enrol from attested and declared attributes. Reported attributes never grant.
      - title: ca issues the certificate
        nodes: [exchange, ca, drv-keys, store-keys]
        edges: ["exchange>ca", "ca>drv-keys", "drv-keys>store-keys"]
        text: ca issues the host's X.509-SVID. Its subject comes from the authenticated requester, never from the request, and key-holder signs only a TBSCertificate within the profile's constraints.
      - title: The enrolment is recorded and audited
        nodes: [exchange, drv-state, store-state, drv-transport, store-transport]
        edges: ["exchange>drv-state", "drv-state>store-state", "exchange>drv-transport", "ca>drv-transport", "drv-transport>store-transport"]
        text: exchange writes the enrolment and the host record in its own state; exchange and ca each put a record on the transport.
  - id: operator
    title: Operator write
    why: An operator changes a record on the console, and the owning actor writes it.
    steps:
      - title: The browser reaches console through entry
        nodes: [client, edge, entry, console]
        edges: ["client>edge", "edge>entry", "entry>console"]
        text: The console's single-page application calls the operator API. entry routes it to console, the browser's backend.
      - title: session checks the cookie
        nodes: [console, session]
        edges: ["console>session"]
        text: console has session check the HttpOnly cookie and its freshness for this boundary. A stale session gets a step-up challenge.
      - title: console checks the delegation and routes the write
        nodes: [console, exchange]
        edges: ["console>exchange"]
        text: console checks that the operator is delegated for this company and environment, then routes the write, here the approval of a pending host, to exchange, the actor that owns the record kind. console itself has no write access to it.
      - title: The owning actor validates and writes
        nodes: [exchange, drv-state, store-state]
        edges: ["exchange>drv-state", "drv-state>store-state"]
        text: exchange validates the write with its own logic and writes its own record. The state backend refuses any other writer.
      - title: The change is audited under the operator's name
        nodes: [console, exchange, drv-transport, store-transport]
        edges: ["console>drv-transport", "exchange>drv-transport", "drv-transport>store-transport"]
        text: console and exchange each put a record on the transport, naming the operator.
  - id: sshcert
    title: SSH certificate
    why: A person or a workload gets a short-lived SSH certificate that carries its identity only.
    steps:
      - title: The request reaches ssh-ca
        nodes: [client, edge, entry, ssh-ca]
        edges: ["client>edge", "edge>entry", "entry>ssh-ca"]
        text: The CLI posts its public key with its sender-constrained token. entry routes the request to ssh-ca.
      - title: policy decides
        nodes: [ssh-ca, policy]
        edges: ["ssh-ca>policy"]
        text: ssh-ca asks policy for ssh.certify. Which accounts the identity may use on which hosts is not in the certificate; it comes from the signed bundle that sluis-host writes on each host (ssh.login).
      - title: The certificate is signed
        nodes: [ssh-ca, drv-keys, store-keys]
        edges: ["ssh-ca>drv-keys", "drv-keys>store-keys"]
        text: "The certificate carries u:<person-key> for a person or w:<workload> for a machine. key-holder signs only an OpenSSH certificate body with the SSH user CA key."
        variants:
          - { shapes: [lambda], text: "The SSH CA key is a KMS key whose key policy names only ssh-ca's role." }
      - title: The certificate is recorded and audited
        nodes: [ssh-ca, drv-state, drv-transport, store-transport]
        edges: ["ssh-ca>drv-state", "ssh-ca>drv-transport", "drv-transport>store-transport"]
        text: ssh-ca records the certificate (requester, profile, serial, validity, key hash) and puts a record on the transport.
  - id: mint
    title: Downstream mint
    why: A caller asks for a short-lived downstream credential, such as a cloud API token.
    steps:
      - title: The caller names the connection
        nodes: [client, edge, entry, exchange]
        edges: ["client>edge", "edge>entry", "entry>exchange"]
        text: The caller posts to the mint endpoint, naming the connection and the preset. entry routes it to exchange.
      - title: policy decides
        nodes: [exchange, policy]
        edges: ["exchange>policy"]
        text: policy decides whether this caller may mint this credential.
      - title: policy signs a mint grant
        nodes: [policy, drv-keys, store-keys]
        edges: ["policy>drv-keys", "drv-keys>store-keys"]
        text: policy signs the mint grant (connection, preset, ttl, nonce, expiry) with its own grant key. The grant key is not the token-signing key, and only policy may use it.
      - title: exchange calls the minter with the grant
        nodes: [exchange, int-minter]
        edges: ["exchange>int-minter"]
        text: exchange passes the grant to the minter. The minter verifies the grant against policy's public key and the nonce. It does not decide; caps and rate limits already live in core.
      - title: The minter mints at the vendor
        nodes: [int-minter, vendor]
        edges: ["int-minter>vendor"]
        text: The minter holds only the connection's parent credential. It mints the short-lived credential and returns it.
      - title: The mint is audited
        nodes: [exchange, drv-transport, store-transport]
        edges: ["exchange>drv-transport", "drv-transport>store-transport"]
        text: exchange appends the record and returns the credential to the caller.
  - id: workload
    title: Workload credentials
    why: An actor's cloud driver gets the cloud credentials it needs, on a node that runs sluis-node.
    steps:
      - title: The driver asks sluis-node
        nodes: [drv-keys, drv-state, drv-blob, sluis-node]
        edges: ["drv-keys>sluis-node", "drv-state>sluis-node", "drv-blob>sluis-node"]
        text: The cloud driver of an actor asks sluis-node for its actor's workload JWT. sluis-node reads the caller's uid from the socket (SO_PEERCRED) and maps the uid to the actor. On a node, the key driver, state driver and blob driver that are cloud drivers each ask for their own actor's JWT.
        variants:
          - { shapes: [local], text: "The local installation has no sluis-node and no cloud federation." }
          - { shapes: [lambda], text: "The lambda installation has no sluis-node: the Lambda execution role of each function is the identity, so there is no workload JWT. Platform-native identity is used where it exists." }
      - title: The node key signs the JWT
        nodes: [sluis-node, drv-keys, store-keys]
        edges: ["sluis-node>drv-keys", "drv-keys>store-keys"]
        text: The node's non-extractable hardware key signs the JWT, about 120 ms per signature, hourly per actor. AWS accepts ES384. GCP needs ES256 and Entra needs RS256, the written-down exceptions to ES384 as the default.
        variants:
          - { shapes: [boards], text: "On boards the node's own YubiKey signs the JWT, the same card whose key signs that node's audit log." }
      - title: The driver exchanges the JWT
        nodes: [drv-keys, drv-state, drv-blob, downstream]
        edges: ["drv-keys>downstream", "drv-state>downstream", "drv-blob>downstream"]
        text: "The driver trades the JWT for the cloud's credentials: AssumeRoleWithWebIdentity against an IAM OIDC provider on AWS, Workload Identity Federation on GCP, a federated credential on Azure. The credentials last an hour and the driver refreshes them before they expire."
      - title: The issuer is trusted per node
        nodes: [downstream]
        edges: []
        text: "The boundary's issuer publishes a static discovery document and JWKS (public keys only) with one key per node card. Per-node issuers at https://<issuer>/nodes/<node>/ are optional, for fleets whose nodes run different actors; there a cloud role trusts only the issuers of the nodes that run that actor. AWS allows at most 100 EC keys in a JWKS and 100 OIDC providers per account."
  - id: audit
    title: Audit write
    why: A request becomes evidence, and a record reaches the index.
    steps:
      - title: An actor appends a record
        nodes: [entry, session, exchange, policy, signer, drv-transport, store-transport]
        edges: ["entry>drv-transport", "session>drv-transport", "exchange>drv-transport", "policy>drv-transport", "signer>drv-transport", "drv-transport>store-transport"]
        text: Every actor that acted puts what it did on the transport. The request returns once the record is durable there. Every success is audited.
        variants:
          - { shapes: [local, boards], text: "Durable means an fsync to the node's local spool." }
          - { shapes: [lambda], text: "Durable means the queue accepted the message." }
      - title: The writer takes the records
        nodes: [writer, drv-transport]
        edges: ["writer>drv-transport"]
        text: The writer receives records, validates and stamps them, drops duplicates by record id and rolls them into a batch.
        variants:
          - { shapes: [boards], text: "Each node has its own writer, spool and log key; each writer drains its own spool. The rule is exactly one writer per log." }
      - title: The batch object is put
        nodes: [writer, drv-blob, store-blob]
        edges: ["writer>drv-blob", "drv-blob>store-blob"]
        text: The writer puts the batch object in the blob. Its blob driver may write the batch prefix and nothing else.
      - title: The batch is registered
        nodes: [writer, drv-state, store-state]
        edges: ["writer>drv-state", "drv-state>store-state"]
        text: Only after the put, the writer appends an entry to audit_batches in the state store, then acks the transport (queue mode). The state store is on the write path, which is accepted given the transport, a reconciler against the bucket listing, and verification that never trusts state.
      - title: The writer signs the head
        nodes: [writer, drv-keys, store-keys]
        edges: ["writer>drv-keys", "drv-keys>store-keys"]
        text: The writer asks the keys driver to sign the batch head with the log key and writes the signed head under seals/. There is no notary; key-holder's access list (or the key policy on AWS) lets only the writer use the log key, so the writer never holds the key itself.
        variants:
          - { shapes: [local], text: "The host's YubiKey signs, through key-holder. The local blob has no object lock, so tamper evidence depends on a witness, which is optional." }
          - { shapes: [boards], text: "The node's own YubiKey signs for that node's log." }
          - { shapes: [lambda], text: "One KMS key whose key policy names the writer function's role only. There is one log and no peer witness; the function's role is the isolation." }
      - title: A witness cosigns the head
        nodes: [witness, drv-state, drv-blob, drv-keys, store-keys]
        edges: ["witness>drv-state", "witness>drv-blob", "witness>drv-keys", "drv-keys>store-keys"]
        text: Where the installation has a witness, it reads the new head, cosigns it with its own key and puts its cosignature next to the signed head. A witness is optional everywhere, and sluis config check warns when there is none. Without one, a compromised writer can get a rewritten checkpoint signed, and a lock does not prevent a split view.
        variants:
          - { shapes: [boards], text: "The other two nodes are this node's peer witnesses (2-of-3 co-signing), and this node witnesses theirs." }
          - { shapes: [local, lambda], text: "No witness by default. An external witness is possible." }
      - title: The index follows the chain
        nodes: [indexer, reader, drv-state, drv-blob, store-index]
        edges: ["indexer>drv-state", "indexer>drv-blob", "indexer>store-index", "reader>store-index"]
        text: The indexer follows audit_batches from its cursor, fetches each new batch and applies it to the index; the reader answers queries from it. Verification never trusts the index. The audit explorer shows lag and the integrity chain.
        variants:
          - { shapes: [boards], text: "The index is rqlite (a proposed driver), so the reader can run on any node. Readers merge the three logs by time." }
          - { shapes: [lambda], text: "The default here is no search index of its own (proposed). With none, the indexer and the reader of a separate Search installation follow the chain in the same bucket." }

# ---------------------------------------------------------------------------
# Open points that touch the architecture
# ---------------------------------------------------------------------------
open_points: []

# What runs where on a cluster of boards (bare-metal with N nodes).
cluster:
  - { process: edge connector, where: every node, status: proposed }
  - { process: quota, where: "derived from the port and driver rules: a separate piece, combinable with sluis and sharing its driver instances; metering by default, enforcement per policy rule", status: agreed }
  - { process: "Search (indexer, search index, reader)", where: "derived from the port and driver rules: with an rqlite index (proposed) the reader runs on any node; with a sqlite index it runs on the indexer's node", status: agreed }
  - { process: entry, where: "every node, on a Unix socket behind that node's edge connector, with no network", status: agreed }
  - { process: "session, console, exchange", where: "every node, beside entry. session and exchange each keep their state in their own rqlite cluster; console keeps none", status: agreed }
  - { process: "signer, policy, ca, ssh-ca", where: "every node; an earlier draft made each single-active, with a named lease and a fencing token, and standbys on the other nodes", status: proposed }
  - { process: writer, where: "every node: one log per node, each writer draining its own spool and signing with its own log key. The rule is exactly one writer per log, not one per installation", status: agreed }
  - { process: witness, where: "every node, as a peer: each node's log is cosigned by the other two (2-of-3). A witness is optional, and sluis config check warns when there is none", status: agreed }
  - { process: "state driver and its store", where: "every node; one rqlite cluster per (boundary, owning actor), each a Raft quorum of three over its own TCP port with mTLS. How an actor unit with PrivateNetwork=yes reaches its cluster's client port is open (ADR 0008)", status: open }
  - { process: keys driver, where: "each node's own YubiKey, behind key-holder, with one socket per caller", status: agreed }
  - { process: sluis-node, where: every node, status: agreed }
  - { process: integrations, where: "next to the actors that call them on each node, over Unix sockets; no actor is called across nodes, and the Raft port is the only TCP port between nodes", status: agreed }
