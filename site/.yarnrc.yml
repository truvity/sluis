# Yarn 4 (Berry) over pnpm's strict, symlinked layout: the JS toolchain standard.
nodeLinker: pnpm
enableTelemetry: false

# @astrojs/cloudflare 14.4.0 imports prismjs (dist/vite-plugin-prism.js) without
# declaring it; it only resolves when a package manager hoists it. The pnpm linker
# above does not, and astro.config.mjs then fails to load. Drop this once the
# adapter declares prismjs itself.
packageExtensions:
  "@astrojs/cloudflare@*":
    dependencies:
      prismjs: 1.30.0
  # Starlight, when it sees the Cloudflare adapter, asks Vite to pre-bundle
  # "@astrojs/starlight>astro-expressive-code>hast-util-select" and four more paths
  # (@astrojs/starlight/dist/index.js). Those packages are Starlight's own or
  # @expressive-code/core's, not astro-expressive-code's, so with the pnpm linker the
  # paths do not resolve and a cold build prints five "[WARN] [vite] Failed to resolve
  # dependency" lines, which the strict build rejects. Declaring them here makes the
  # paths resolve. Drop this once Starlight lists the packages by their owners.
  astro-expressive-code@*:
    dependencies:
      "@expressive-code/core": 0.44.3
      hast-util-select: ^6.0.4
      hast-util-to-string: ^3.0.1
      hastscript: ^9.0.1
      unist-util-visit: ^5.1.0
