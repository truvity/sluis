# Link check for the built site (`just site-links`). In-site links and anchors are
# held by the build itself (starlight-links-validator); this is for every link,
# including the ones that leave the site.

cache = true
max_cache_age = "1d"
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 8
# 429 is a host asking for patience, not a dead link.
accept = ["200..=204", "429"]
user_agent = "Mozilla/5.0 (compatible; sluis-docs-link-check)"

exclude = [
  # The v1 documentation is built in by the Pages workflow (site/scripts/build-v1.sh)
  # and held by its own strict build; a build of this site alone has no /v1/, so
  # links into it (the features page) cannot be checked here.
  '/v1(/|$)',
  # The site's own absolute URLs (canonical, sitemap, Open Graph) point at the
  # deployed copy, which does not have this build yet.
  '^https://sluis\.id/',
  # ritueel.id is the site of the sibling product; it is not deployed yet. Remove this line once it is.
  '^https://ritueel\.id',
  # Files and pages that exist only once the governance files and the roadmap
  # project are merged or created; the site links to them by their final path.
  '^https://github\.com/truvity/sluis/(blob|tree|edit)/',
  '^https://github\.com/orgs/truvity/projects',
  # Needs a token or a session.
  '^https://(www\.)?linkedin\.com',
]
