version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/truvity/sluis/gen
plugins:
  # Local plugins to avoid BSR rate limits: protoc-gen-go from devbox, and
  # connect-go v2's protoc-gen-connect-go as a Go tool, pinned by the
  # `tool` line and the connectrpc.com/connect/v2 require in go.mod (nixpkgs
  # carries only the v1 generator), so it always matches the runtime.
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt: paths=source_relative
  # TypeScript for the console. protobuf-es v2 emits the message schemas
  # AND the service descriptor, which @connectrpc/connect v2 consumes via
  # createClient — so there is no separate connect-es plugin. Generated
  # code is committed here too: CI builds the SPA without buf.
  - remote: buf.build/bufbuild/es
    out: frontend/src/gen
    opt: target=ts
